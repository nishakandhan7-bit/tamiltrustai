து கிளப்பின் எல்லா மொழியும் சொல்லிய பண்பின் இயற்கை ஆகும்.” — What does this sutra state?", "எ-டு.: நாகுகடிது, வரகுகடிது, தௌ;குகடிது, எஃகு கடிது, குரங்குகடிது - இதில் வன்றொடர் ஒழிந்தன@ இயல்பாய் முடிந்தன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.173, நூ. 425", "", "easy", "false"], ["TOLK-426", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 426: “வல்லொற்றுத் தொடர்மொழி வல்லெழுத்து மிகுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 426: “வல்லொற்றுத் தொடர்மொழி வல்லெழுத்து மிகுமே.” — What does this sutra state?", "இது குற்றியலுகர ஈறுகளுள் ஒன்றனுக்கு எய்தியது விலக்கிப் பிறிது விதி கூறுகிறது. எ-டு.: கொக்குக்கடிது, கொக்குச்சிறிது, கொக்குத்தீது, கொக்குப்பெரிது - இதில் அல்வழிக்கண் வன்றொடர்க் குற்றியலுகரம் வன்கணம் வர வல்லெழுத்து மிக்கு முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.173, நூ. 426", "", "medium", "false"], ["TOLK-427", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 427: “சுட்டுசினை நீடிய மென்றொடர் மொழியும் யாவினா முதலிய மென்றொடர் மொழியும் ஆயியல் திரியா வல்லெழுத்து இயற்கை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 427: “சுட்டுசினை நீடிய மென்றொடர் மொழியும் யாவினா முதலிய மென்றொடர் மொழியும் ஆயியல் திரியா வல்லெழுத்து இயற்கை.” — What does this sutra state?", "இஃது ஏழாம் வேற்றுமை இடப்பொருள் உணரநின்ற மென்றொடர்க் குற்றியலுகர ஈற்று இடைச்சொல் முடிபு கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.173, நூ. 427", "", "easy", "false"], ["TOLK-428", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 428: “யா வினா மொழியே இயல்பும் ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 428: “யா வினா மொழியே இயல்பும் ஆகும்.” — What does this sutra state?", "மேற்கூறியவற்றுள் யா முதலாகிய மென்றொடர்க் குற்றியலுகரம் வல்லெழுத்து மிகாது இயல்பாயும் முடியும். எ-டு.: யாங்குகொண்டான், யாங்குசென்றான், யாங்குதந்தான், யாங்குபோயினான் - யா வினா முதலாகிய மென்றொடர்மொழி இயல்பாயிற்று.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.174, நூ. 428", "", "medium", "false"], ["TOLK-429", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 429: “அந்நால் மொழியும் தம்நிலை திரியா.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 429: “அந்நால் மொழியும் தம்நிலை திரியா.” — What does this sutra state?", "மேற்கூறிய நான்கு மொழிகளும் தம் மெல்லெழுத்து நிலையினின்றும் திரியா.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.174, நூ. 429", "", "easy", "false"], ["TOLK-430", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 430: “உண்டுஎன் கிளவி உண்மை செப்பின் முந்தை இறுதிமெய் யொடும் கெடுதலும் மேல்நிலை ஒற்றே ளகாரம் ஆதலும் ஆமுறை இரண்டும் உரிமையும் உடைத்தே வல்லெழுத்து வரூஉம் காலையான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 430: “உண்டுஎன் கிளவி உண்மை செப்பின் முந்தை இறுதிமெய் யொடும் கெடுதலும் மேல்நிலை ஒற்றே ளகாரம் ஆதலும் ஆமுறை இரண்டும் உரிமையும் உடைத்தே வல்லெழுத்து வரூஉம் காலையான.” — What does this sutra state?", "இஃது உண்மைத்தன்மை செப்பும் மென்றொடர்க் குற்றியலுகரம் ஒன்றனுக்கு வேறுமை முடிபு கூறுகிறது. எ-டு.: உள்பொருள், உண்டு பொருள் எனவும், உண்டு காணம், உண்டு சாக்காடு, உண்டு தாமரை எனவும், உண்டு ஞாண், நூல், மணி, யாழ், வட்டு, அடை, ஆடை, எனவும் வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.174, நூ. 430", "", "medium", "false"], ["TOLK-431", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 431: “இருதிசை புணரின்ஏ இடை வருமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 431: “இருதிசை புணரின்ஏ இடை வருமே.” — What does this sutra state?", "இது குற்றியலுகர ஈற்று திசைப்பெயர்க்கு அல்வழி முடிபு கூறுகிறது. எ-டு.: வடக்கூதெற்கு→வடக்கே தெற்கு, கிழக்கே மேற்கு என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.174, நூ. 431", "", "easy", "false"], ["TOLK-433", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 433: “ஒன்றுமுதல் ஆக எட்டன் இறுதி எல்லா எண்ணும் பத்தன் முன்வரின் குற்றியலுகரம் மெய்யொடும் கெடுமே முற்றஇன் வரூஉம் இரண்டு அலங்கடையே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 433: “ஒன்றுமுதல் ஆக எட்டன் இறுதி எல்லா எண்ணும் பத்தன் முன்வரின் குற்றியலுகரம் மெய்யொடும் கெடுமே முற்றஇன் வரூஉம் இரண்டு அலங்கடையே.” — What does this sutra state?", "நிறுத்த முறையானே ஆறு ஈற்றுக் குற்றியலுகரமும் உணர்த்தி, எண்ணுப்பெயர்களை முடிக்கப் புகுந்த ஆசிரியர், இந்நூற்பாவான் பத்து என்னும் எண்ணுப்பெயரோடு ஒன்று முதல் எட்டு எண்கள் புணருமாற்றைக் கூறுகின்றார்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.175, நூ. 433", "", "easy", "false"], ["TOLK-434", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 434: “பத்தன் ஒற்றுக்கெட னகாரம் இரட்டல் ஒத்தது என்ப இரண்டுவரு காலை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 434: “பத்தன் ஒற்றுக்கெட னகாரம் இரட்டல் ஒத்தது என்ப இரண்டுவரு காலை.” — What does this sutra state?", "இது மேல் இன் பெறாதென விலக்கிய இரண்டற்கு வேறு முடிபு கூறுகிறது. எ-டு.: பத்தூஇரண்டு ஸ்ரீ பன்னிரண்டு எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.176, நூ. 434", "", "easy", "false"], ["TOLK-435", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 435: “ஆயிரம் வரினும் ஆயியல் திரியாது.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 435: “ஆயிரம் வரினும் ஆயியல் திரியாது.” — What does this sutra state?", "இது பத்தின்முன் ஆயிரத்திற்கு முடிபு கூறுகிறது. எ-டு.: பத்தூஇன்+ஆயிரம் ஸ்ரீ பதினாயிரம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.176, நூ. 435", "", "easy", "false"], ["TOLK-436", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 436: “நிறையும் அளவும் வரூஉம் காலையும் குறையாது ஆகும் இன்என் சாரியை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 436: “நிறையும் அளவும் வரூஉம் காலையும் குறையாது ஆகும் இன்என் சாரியை.” — What does this sutra state?", "இது பத்தின்முன் வரும் நிறை, அளவுப்பெயர்களுக்கு முடிபு கூறுகிறது. எ-டு.: பதின்கழஞ்சு, பதின்றொடி, பதின்கலம்-நிறைப்பெயர் வர, பத்தன் ஈற்றுக் குற்றியலுகரம் மெய்யொடுங்கெட, இன் சாரியை பெற்று முடிந்தது. பதின்கலம், பதின்சாடி, பதின்றூதை, பதின்பானை, பதினாழி, பதின்மண்டை பதின்வட்டில், பதின்கல், பதினுழக்கு - அளவுப்பெயர் வர, பத்தன் ஈற்றுக் குற்றியலுகரம், மெய்யொடும்கெட இன் சாரியை பெற்று முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.176, நூ. 436", "", "medium", "false"], ["TOLK-437", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 437: “ஒன்றுமுதல் ஒன்பான் இறுதி முன்னர் நின்ற பத்தன் ஒற்றுக்கெட ஆய்தம் வந்துஇடை நிலையும் இயற்கைத்து என்ப கூறிய இயற்கை குற்றியலுகரம் ஆறன் இறுதி அல்வழியான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 437: “ஒன்றுமுதல் ஒன்பான் இறுதி முன்னர் நின்ற பத்தன் ஒற்றுக்கெட ஆய்தம் வந்துஇடை நிலையும் இயற்கைத்து என்ப கூறிய இயற்கை குற்றியலுகரம் ஆறன் இறுதி அல்வழியான.” — What does this sutra state?", "இஃது ஒன்றுமுதல் ஒன்பது எண்களுக்குமுன் வரும் பத்துப் புணருமாறு கூறுகிறது. எ-டு.: ஒருபஃது, இருபஃது எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.177, நூ. 437", "", "easy", "false"], ["TOLK-438", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 438: “முதல்ஈர் எண்ணின் ஒற்று ரகரம் ஆகும்; உகரம் வருதல் ஆவயினான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 438: “முதல்ஈர் எண்ணின் ஒற்று ரகரம் ஆகும்; உகரம் வருதல் ஆவயினான.” — What does this sutra state?", "இது ஒன்று, இரண்டு எனும் எண்களுக்கு எய்தியதன் மேல் சிறப்புவிதி கூறுகிறது. எ-டு.: ஒருபஃது என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.177, நூ. 438", "", "easy", "false"], ["TOLK-439", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 439: “இடைநிலை ரகரம் இரண்டுஎன் எண்ணிற்கு நடைமருங்கு இன்றே, பொருள்வயினான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 439: “இடைநிலை ரகரம் இரண்டுஎன் எண்ணிற்கு நடைமருங்கு இன்றே, பொருள்வயினான.” — What does this sutra state?", "இஃது இரண்டு என்னும் எண்ணிற்கு எய்தியதன்மேல் சிறப்புவிதி கூறுகிறது. எ-டு.: இருபஃது (இருபது) எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.177, நூ. 439", "", "easy", "false"], ["TOLK-441", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 441: “மூன்றன் ஒற்றே பகாரம் ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 441: “மூன்றன் ஒற்றே பகாரம் ஆகும்.” — What does this sutra state?", "இஃது மூன்று, ஆறு என்னும் எண்களுக்கு எய்தியதன்மேல் சிறப்புவிதி கூறுகிறது. எ-டு.: முப்பஃது, (முப்பது); அறுபஃது (அறுபது)", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.178, நூ. 441", "", "easy", "false"], ["TOLK-442", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 442: “நான்கன் ஒற்றே றகாரம் ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 442: “நான்கன் ஒற்றே றகாரம் ஆகும்.” — What does this sutra state?", "இஃது நான்கு என்னும் எண்ணிற்கு எய்தியதன்மேல் சிறப்புவிதி கூறுகிறது. எ-டு.: நாற்பஃது, (நாற்பது)", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.178, நூ. 442", "", "easy", "false"], ["TOLK-443", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 443: “ஐந்தன் ஒற்றே மகாரம் ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 443: “ஐந்தன் ஒற்றே மகாரம் ஆகும்.” — What does this sutra state?", "இஃது ஐந்து என்னும் எண்ணிற்கு எய்தியதன்மேல் சிறப்புவிதி கூறுகிறது. எ-டு.: ஐந்தூபஃது→ஐம்பஃது (ஐம்பது) எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.178, நூ. 443", "", "easy", "false"], ["TOLK-444", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 444: “எட்டன் ஒற்றே ணகாரம் ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 444: “எட்டன் ஒற்றே ணகாரம் ஆகும்.” — What does this sutra state?", "இஃது எட்டு என்னும் எண்ணிற்கு எய்தியதன்மேல் சிறப்புவிதி கூறுகிறது. எ-டு.: எண்பஃது, (எண்பது)", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.178, நூ. 444", "", "easy", "false"], ["TOLK-445", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 445: “ஒன்பான் ஒகரமிசைத் தகரம் ஒற்றும் முந்தை ஒற்றே ணகாரம் இரட்டும் பஃது என் கிளவி ஆய்த பகரம்கெட நிற்றல் வேண்டும், எகாரக் கிளவி ஒற்றிய தகரம் றகரம் ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 445: “ஒன்பான் ஒகரமிசைத் தகரம் ஒற்றும் முந்தை ஒற்றே ணகாரம் இரட்டும் பஃது என் கிளவி ஆய்த பகரம்கெட நிற்றல் வேண்டும், எகாரக் கிளவி ஒற்றிய தகரம் றகரம் ஆகும்.” — What does this sutra state?", "இஃது ஒன்பது என்னும் எண்ணிற்கு எய்தியதன்மேல் சிறப்புவிதி கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.179, நூ. 445", "", "easy", "false"], ["TOLK-446", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 446: “அளந்து அறி கிளவியும் நிறையின் கிளவியும் கிளந்த இயல தோன்றும் காலை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 446: “அளந்து அறி கிளவியும் நிறையின் கிளவியும் கிளந்த இயல தோன்றும் காலை.” — What does this sutra state?", "இந்நூற்பாவில் ஒன்றுமுதல் ஒன்பது எண்களோடு பத்துப் புணருமாறு கூறி, இனி அளவு நிறைப்பெயர்கள் புணருமாறு கூறுகின்றார். எ-டு.: ஒருகலம், ஒருசாடி, ஒருதூதை, ஒருபானை- அளவு", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.179, நூ. 446", "", "easy", "false"], ["TOLK-447", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 447: “மூன்றன் ஒற்றே வந்தது ஒக்கும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 447: “மூன்றன் ஒற்றே வந்தது ஒக்கும்.” — What does this sutra state?", "குற்றியலுகரம் மெய்யொடும் கெட நின்ற மூன்றனது னகர ஒற்று, வருமொழியாய அளவு, நிறைப்பெயர்களின் முதலில்வந்த ஒற்றொடு ஒத்த ஒற்றாய்த் திரிந்து முடியும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.179, நூ. 447", "", "easy", "false"], ["TOLK-448", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 448: “ஐந்தன் ஒற்றே மெல்லெழுத்து ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 448: “ஐந்தன் ஒற்றே மெல்லெழுத்து ஆகும்.” — What does this sutra state?", "குற்றியலுகரம் மெய்யொடும் கெட, நின்ற ஐந்தன் நகர ஒற்று வருமொழியாய அளவு நிறைப்பெயர்களின் முதற்கண் நின்ற வல்லெழுத்திற்கு இனமாய மெல்லெழுத்தாய்த் திரிந்து முடியும். எ-டு.: ஐங்கலம், ஐஞ்சாடி, ஐந்தூதை, ஐம்பலம் எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.180, நூ. 448", "", "medium", "false"], ["TOLK-449", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 449: “கசதப முதல்மொழி வரூஉம் காலை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 449: “கசதப முதல்மொழி வரூஉம் காலை.” — What does this sutra state?", "அளவு நிறைப்பெயர்களுக்கு முதலாகும் எழுத்துக்கள் ஒன்பதனுள் வன்கணமாகிய கசதபக்கள் முதன்மொழியாய் வந்த காலத்து மூன்றன் ஒற்று வந்த ஒற்றாயும், ஐந்தன் ஒற்று மெல்லெழுத்தாயும் திரியும். எ-டு.: அறுகலம், அறுசாடி, அறுதூதை எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.180, நூ. 449", "", "medium", "false"], ["TOLK-450", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 450: “நமவ என்னும் மூன்றொடு சிவணி அகரம் வரினும் எட்டன் முன் இயல்பே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 450: “நமவ என்னும் மூன்றொடு சிவணி அகரம் வரினும் எட்டன் முன் இயல்பே.” — What does this sutra state?", "குற்றியலுகரம் மெய்யொடும்கெட, நின்ற எட்டன்முன் நம என்னும் மெல்லெழுத்துகளும் வ என்னும் இடையெழுத்துமாகிய மூன்றனொடு சேர்ந்து அகரமாகிய உயிரெழுத்து வரினும் (உகரம் வரினும்) முற்கூறிய இயல்பாய் முடியும். எ-டு.: எண்கலம், எண்சாடி, எண்நாழி, பானை, தூதை, மண்டை எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.180, நூ. 450", "", "medium", "false"], ["TOLK-451", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 451: “ஐந்தும் மூன்றும் ந ம வருகாலை வந்தது ஒக்கும் ஒற்று இயல்நிலையே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 451: “ஐந்தும் மூன்றும் ந ம வருகாலை வந்தது ஒக்கும் ஒற்று இயல்நிலையே.” — What does this sutra state?", "மூன்று, ஐந்து என்னும் எண்ணுப்பெயர்கள் இரண்டும் நகர, மகர முதன்மொழி வருங்காலத்துத் தங்கண் நின்ற ஒற்றுக்கள் இயலும் நிலைமையக் கூறின், வந்த ஒற்றொடு ஒத்த ஒற்றாய் முடியும். எ-டு.: முந்நாழி, மும்மண்டை, ஐந்நாழி, ஐம்மண்டை எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.180, நூ. 451", "", "medium", "false"], ["TOLK-452", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 452: “மூன்றன் ஒற்றே வகாரம் வருவழி தோன்றிய வகாரத்து உருஆகும்மே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 452: “மூன்றன் ஒற்றே வகாரம் வருவழி தோன்றிய வகாரத்து உருஆகும்மே.” — What does this sutra state?", "வகர முதன்மொழி வருமிடத்து மூன்றனது னகர ஒற்று, வருமொழியாய் தோன்றிய வகரத்தினது உருவாய் முடியும். எ-டு.: முவ்வட்டி என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.181, நூ. 452", "", "easy", "false"], ["TOLK-453", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 453: “நான்கன் ஒற்றும் லகாரம் ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 453: “நான்கன் ஒற்றும் லகாரம் ஆகும்.” — What does this sutra state?", "நான்கனது னகர ஒற்று வகர முதன்மொழி வருங்கால் லகாரமாகும். எ-டு.: நால்வட்டி எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.181, நூ. 453", "", "easy", "false"], ["TOLK-454", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 454: “ஐந்தன் ஒற்றே முந்தையது கெடுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 454: “ஐந்தன் ஒற்றே முந்தையது கெடுமே.” — What does this sutra state?", "வகர முதன்மொழி வருங்கால் ஐந்தன் முந்தையதாகிய நகர ஒற்றுக்கெட்டு முடியும். எ-டு.: ஐவட்டி.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.181, நூ. 454", "", "easy", "false"], ["TOLK-455", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 455: “முதல்ஈர் எண்ணின்முன் உயிர்வரு காலை தவல்என மொழிப உகரக் கிளவி முதல்நிலை நீடல் ஆவயினான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 455: “முதல்ஈர் எண்ணின்முன் உயிர்வரு காலை தவல்என மொழிப உகரக் கிளவி முதல்நிலை நீடல் ஆவயினான.” — What does this sutra state?", "இஃது ஒன்று, இரண்டு எனும் எண்களின் முன் உயிர்முதல் அளவுப்பெயர் வருங்கால் எய்தும் முடிபினைக் கூறுகிறது. எ-டு.: ஓரகல், ஓருழக்கு, ஈரகல், ஈருழக்கு. மூன்று, நான்கு, ஐந்து முன் உயிர் முதன்மொழிகள் மூன்று, நான்கு, ஐந்து எனும் எண்ணுப்பெயர்கள் உயிர்முதல் அளவுப்பெயர் வருங்காலத்து முன்பு தோன்றி முடிந்த வகரத்தினது இயல்பாய் முடியும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.181, நூ. 455", "", "medium", "false"], ["TOLK-456", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 456: “மூன்றும் நான்கும் ஐந்துஎன் கிளவியும் தோன்றிய வகரத்து இயற்கை ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 456: “மூன்றும் நான்கும் ஐந்துஎன் கிளவியும் தோன்றிய வகரத்து இயற்கை ஆகும்.” — What does this sutra state?", "இஃது மூன்று, நான்கு, ஐந்து எனும் எண்களின் முன் உயிர்முதல் அளவுப்பெயர் வருங்கால் எய்தும் முடிபினைக் கூறுகிறது. எ-டு.: முவ்வகல், முவ்வுழக்கு- மூன்றன் ஒற்று வகரமாயிற்று. நாலகல், நாவுழக்கு - நான்கன் ஒன்று லகரமாயிற்று. ஐயகல், ஐயுழக்கு - ஐந்தன் ஒற்றுக்கெட்டது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.182, நூ. 456", "", "medium", "false"], ["TOLK-458", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 458: “ஆறு என்பதற்கும் அம்முடிபே ஆறு என் கிளவி முதல் நீடும்மே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 458: “ஆறு என்பதற்கும் அம்முடிபே ஆறு என் கிளவி முதல் நீடும்மே.” — What does this sutra state?", "இஃது ஆறு எனும் எண்ணின் முன் உயிர்முதல் அளவுப்பெயர் வருங்கால் எய்தும் முடிபினைக் கூறுகிறது. எ-டு.: ஆறகல், ஆறுழக்கு என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.182, நூ. 458", "", "easy", "false"], ["TOLK-459", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 459: “ஒன்பான் இறுதி உருபு நிலை திரியாது இன்பெறல் வேண்டும் சாரியை மொழியே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 459: “ஒன்பான் இறுதி உருபு நிலை திரியாது இன்பெறல் வேண்டும் சாரியை மொழியே.” — What does this sutra state?", "இஃது ஒன்பது எனும் எண்ணின் முன் உயிர்முதல் அளவுப்பெயர் வருங்கால் எய்தும் முடிபினைக் கூறுகிறது. எ-டு.: ஒன்பதின்கலம், ஒன்பதின்சாடி, ஒன்பதின்றூதை, ஒன்பதின்பானை,", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.183, நூ. 459", "", "easy", "false"], ["TOLK-460", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 460: “ஒன்று முதல் ஒன்பது எண்களின் முன் நூறு நூறுமுன் வரினும் கூறிய இயல்பே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 460: “ஒன்று முதல் ஒன்பது எண்களின் முன் நூறு நூறுமுன் வரினும் கூறிய இயல்பே.” — What does this sutra state?", "இஃது ஒன்றுமுதல் ஒன்பான் எண்களோடு நூறு புணருமாறு கூறுகிறது. எ-டு.: ஒன்றூநூறுஸ்ரீஒருநூறு, இருநூறு, அறுநூறு, எண்ணூறு என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.183, நூ. 460", "", "easy", "false"], ["TOLK-463", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 463: “ஒன்பான் முதல்நிலை முந்து கிளந்தற்றே முந்தை ஒற்றே னகாரம் இரட்டும் நூறு என்கிளவி நகாரம் மெய்கெட எஆ ஆகும் இயற்கைத்து என்ப ஆயிடை வருதல் இகார ரகாரம் ஈறுமெய் கெடுத்து மகாரம் ஒற்றும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 463: “ஒன்பான் முதல்நிலை முந்து கிளந்தற்றே முந்தை ஒற்றே னகாரம் இரட்டும் நூறு என்கிளவி நகாரம் மெய்கெட எஆ ஆகும் இயற்கைத்து என்ப ஆயிடை வருதல் இகார ரகாரம் ஈறுமெய் கெடுத்து மகாரம் ஒற்றும்.” — What does this sutra state?", "இது மாட்டேறு ஏலாத ஒன்பதனுக்கு வேறுமுடிபு கூறுகிறது. எ-டு.: ஒன்பதூநூறுஸ்ரீதொள்ளாயிரம். தொள்ளாயிரம்ஸ்ரீஒன்பதூநூறு→தொன்பதூநூறு→தொள்ள்+நூறு→தொள்ளூ; ஐறு→தொள்ள்+ஆறு→தொள்ள்+ஆஇரறு→தொள்ளூ ; ஆஇரம்→தொள்ளாயிரம் எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.184, நூ. 463", "", "medium", "false"], ["TOLK-464", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 464: “ஆயிரக் கிளவி வரூஉம் காலை முதல்ஈர் எண்ணின் உகரம் கெடுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 464: “ஆயிரக் கிளவி வரூஉம் காலை முதல்ஈர் எண்ணின் உகரம் கெடுமே.” — What does this sutra state?", "ஒன்று முதல் ஒன்பான் எண்களின் முன்னர் ஆயிரம் புணருமாறு கூறுவான் தொடங்கி, முதற்கண் முதலீரெண்களோடு புணருமாறு கூறுகின்றார். இஃது எய்தியதன்மேற் சிறப்புவிதி. எ-டு.: ஒராயிரம், இராயிரம் என வரும். ஒராயிரம்ஸ்ரீஒன்றூஆயிரம்→ஒன்+ஆயிரம்→ஒர்+ஆயிரம்→ஒரூஆயிரம்→ ஒர்+ஆயிரம்→ஒராயிரம். இராயிரம்ஸ்ரீஇரண்டூஆயிரம்→இரண்+ஆயிரம்→இரர்+ஆயிரம்→இரரூஆயிரம்→", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.184, நூ. 464", "", "medium", "false"], ["TOLK-465", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 465: “முதல்நிலை நீடினும் மானம் இல்லை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 465: “முதல்நிலை நீடினும் மானம் இல்லை.” — What does this sutra state?", "ஒன்று, இரண்டு எனும் முதலிரண்டு எண்களின் விகார வடிவுகளாகிய, ஒர், இர் என்பனவற்றின் முதற்கண் நின்ற ஒகர இகரங்கள் நீண்டு முடியினும் குற்றம் இல்லை. எ-டு.: ஓராயிரம், ஈராயிரம் என வரும். ஓராயிரம்ஸ்ரீஒன்றூஆயிரம்→ஒன்+ஆயிரம்→ஒர்+ஆயிரம்→ஒரூஆயிரம்→ ஒர்+ஆயிரம்→ஒர்+ஆயிரம்→ஓராயிரம். ஈராயிரம்ஸ்ரீஇரண்டூஆயிரம்→இரண்+ஆயிரம்→இரர்+ஆயிரம்→இரரூஆயிரம்→ இரூஆயிரம்→இர்+ஆயிரம்→ஈர்+ஆயிரம்→ஈராயிரம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.185, நூ. 465", "", "medium", "false"], ["TOLK-466", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 466: “மூன்றன் ஒற்றே வகாரம் ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 466: “மூன்றன் ஒற்றே வகாரம் ஆகும்.” — What does this sutra state?", "மூன்று என்பதன் விகார வடிவாகிய முன் என்பதன் னகர ஒற்று, ஆயிரம் வருங்கால் வகரமாய்த் திரியும். எ-டு.: முவ்வாயிரம். முவ்வாயிரம்→மூன்றூஆயிரம்→முன்+ஆயிரம்→முன்+ஆயிரம்→முவ்வாயிரம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.185, நூ. 466", "", "easy", "false"], ["TOLK-467", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 467: “நான்கன் ஒற்றே லகாரம் ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 467: “நான்கன் ஒற்றே லகாரம் ஆகும்.” — What does this sutra state?", "எ-டு.: நாலாயிரம். நாலாயிரம்→நான்கூஆயிரம்→நான்+ஆயிரம்→நான்+ஆயிரம்→ நால்+ஆயிரம்→நாலாயிரம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.185, நூ. 467", "", "easy", "false"], ["TOLK-468", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 468: “ஐந்தன் ஒற்றே யகாரம் ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 468: “ஐந்தன் ஒற்றே யகாரம் ஆகும்.” — What does this sutra state?", "எ-டு.: ஐயாயிரம். ஐயாயிரம்→ஐந்தூஆயிரம்→ஐந்+ஆயிரம்→ஐய்+ஆயிரம்→ஐயாயிரம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.186, நூ. 468", "", "easy", "false"], ["TOLK-469", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 469: “ஆறன் மருங்கின் குற்றியலுகரம் ஈறுமெய் ஒழியக் கெடுதல் வேண்டும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 469: “ஆறன் மருங்கின் குற்றியலுகரம் ஈறுமெய் ஒழியக் கெடுதல் வேண்டும்.” — What does this sutra state?", "ஆறன் திரிபு அறு என்பதாகும். எ-டு.: ஆறூஆயிரம்ஸ்ரீஅறாயிரம் என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.186, நூ. 469", "", "easy", "false"], ["TOLK-470", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 470: “ஒன்பான் இறுதி உருபு நிலை திரியாது இன்பெறல் வேண்டும் சாரியை மரபே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 470: “ஒன்பான் இறுதி உருபு நிலை திரியாது இன்பெறல் வேண்டும் சாரியை மரபே.” — What does this sutra state?", "இந்நூற்பா ஒன்பதனோடு ஆயிரம் புணருமாறு கூறுகிறது. எ-டு.; ஒன்பதினாயிரம். ஒன்பதினாயிரம்→ஒன்பதூஆயிரம்→ஒன்பதூஇன்+ஆயிரம்→ஒன்பதினாயிரம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.186, நூ. 470", "", "easy", "false"], ["TOLK-471", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 471: “நூறாயிரம் முன் வரூஉம் காலை நூறன் இயற்கை முதல்நிலைக் கிளவி.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 471: “நூறாயிரம் முன் வரூஉம் காலை நூறன் இயற்கை முதல்நிலைக் கிளவி.” — What does this sutra state?", "இது ஒன்றுமுதல் ஒன்பான் எண்களோடு நூறாயிரம் புணருமாறு கூறுகிறது. எ-டு.: ஒருநூறாயிரம், இருநூறாயிரம். ஒருநூறாயிரம்→ஒன்றூநூறாயிரம்→ஒன்+நூறாயிரம்→ஒர்+நூறாயிரம்→ ஒருநூறாயிரம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.186, நூ. 471", "", "easy", "false"], ["TOLK-472", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 472: “நூறுஎன் கிளவி ஒன்றுமுதல் ஒன்பாற்கு ஈறுசினை ஒழிய இனஒற்று மிகுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 472: “நூறுஎன் கிளவி ஒன்றுமுதல் ஒன்பாற்கு ஈறுசினை ஒழிய இனஒற்று மிகுமே.” — What does this sutra state?", "ஒன்று முதல் ஒன்பான் எண்களோடு நூறு புணருமாறு கூறிய ஆசிரியர், இந்நூற்பாவான் நூற்றொடு ஒன்றுமுதல் ஒன்பது புணருமாறு கூறுகின்றார். எ-டு.: நூற்றொன்று, நூற்றைந்து, நூற்றாறு, நூற்றேழ் எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.187, நூ. 472", "", "easy", "false"], ["TOLK-473", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 473: “அவைஊர் பத்தினும் அத்தொழிற்று ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 473: “அவைஊர் பத்தினும் அத்தொழிற்று ஆகும்.” — What does this sutra state?", "நூற்றொடு ஒன்றுமுதல் ஒன்பது புணருமாறு கூறிய ஆசிரியர், அவை பத்தனுக்கு அடையாய வழியும் புணருமாறு கூறுகிறார். நூறு என்னும் சொல், ஒன்றுமுதல் ஒன்பான்களை ஊர்ந்துவந்த பத்தனொடு புணருங்காலத்தும், ஈற்றுக் குற்றியலுகரமும், அஃதூர்ந்த மெய்யாகிய சினையும் கெடாதே நிற்ப, அச்சினைக்கு இனமாகிய றகர ஒற்று மிக்கு முடியும். எ-டு.: நூற்றொருபஃது, நூற்றிருபஃது, நூற்றுமுப்பஃது எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.187, நூ. 473", "", "medium", "false"], ["TOLK-474", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 474: “அளவும் நிறையும் ஆயியல் திரியா குற்றியலுகரமும் வல்லெழுத்து இயற்கையும் முன்கிளந்தன்ன என்மனார் புலவர்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 474: “அளவும் நிறையும் ஆயியல் திரியா குற்றியலுகரமும் வல்லெழுத்து இயற்கையும் முன்கிளந்தன்ன என்மனார் புலவர்.” — What does this sutra state?", "இது நூற்றோடு அளவு, நிறைப்பெயர்கள் புணருமாறு கூறுகிறது. எ-டு.: நூற்றுக்கலம், நூற்றுச்சாடி, நூற்றுத்தூதை, நூற்றுப்பானை. நூற்றுநாழி, நூற்றுக்கழஞ்சு, நூற்றுத்தொடி, நூற்றுப்பலம் எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.188, நூ. 474", "", "easy", "false"], ["TOLK-475", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 475: “ஒன்று முதல் ஆகிய பத்து ஊர் கிளவி ஒன்றுமுதல் ஒன்பாற்கு ஒற்றுஇடை மிகுமே நின்ற ஆய்தம் கெடுதல் வேண்டும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 475: “ஒன்று முதல் ஆகிய பத்து ஊர் கிளவி ஒன்றுமுதல் ஒன்பாற்கு ஒற்றுஇடை மிகுமே நின்ற ஆய்தம் கெடுதல் வேண்டும்.” — What does this sutra state?", "இஃது ஒன்றுமுதல் எட்டீறாகிய எண்களை ஊர்ந்த பத்தனொடு ஒன்றுமுதல் ஒன்பான் எண்கள் புணருமாறு கூறுகிறது. எ-டு.: ஒருபத்தொன்று, இருபத்தொன்று, முப்பத்தொன்று எனவரும். ஒருபத்தொன்றுஸ்ரீஒருபஃதூஒன்று.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.188, நூ. 475", "", "easy", "false"], ["TOLK-476", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 476: “ஆயிரம் வரினே, இன்ஆம் சாரியை ஆவயின் ஒற்றுஇடை மிகுதல் இல்லை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 476: “ஆயிரம் வரினே, இன்ஆம் சாரியை ஆவயின் ஒற்றுஇடை மிகுதல் இல்லை.” — What does this sutra state?", "இஃது ஒன்றுமுதல் எட்டீறாகிய எண்களை ஊர்ந்த பத்தனொடு ஆயிரம் புணருங்கால் எய்தியது ஒருவழி விலக்கிப் பிறிது விதி வகுக்கிறது. எ-டு.: ஒருபதினாயிரம், இருபதினாயிரம், முப்பதினாயிரம் எனவரும். ஒருபஃதூஆயிரம்ஸ்ரீஒருபதினாயிரம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.188, நூ. 476", "", "medium", "false"], ["TOLK-477", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 477: “அளவும் நிறையும் ஆயியல் திரியா.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 477: “அளவும் நிறையும் ஆயியல் திரியா.” — What does this sutra state?", "இஃது ஒன்று முதல் எட்டீறாகிய எண்களை எர்ந்த பத்தனொடு அளவுப்பெயரும், நிறைப்பெயரும், புணருமாறு கூறுகிறது. எ-டு.: ஒருபதின்கலம், ஒருபதின்சாடி, ஒருபதின்றூதை, ஒருபதின்பனை,", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.189, நூ. 477", "", "easy", "false"], ["TOLK-478", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 478: “முதல்நிலை எண்ணின்முன் வல்லெழுத்து வரினும் ஞநமத் தோன்றினும் யவவந்து இயையினும் முதல்நிலை இயற்கை என்மனார் புலவர்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 478: “முதல்நிலை எண்ணின்முன் வல்லெழுத்து வரினும் ஞநமத் தோன்றினும் யவவந்து இயையினும் முதல்நிலை இயற்கை என்மனார் புலவர்.” — What does this sutra state?", "இஃது ஒன்றுமுதல் ஒன்பான் எண்களோடு பொருட்பெயர்கள் புணருமாறு கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.189, நூ. 478", "", "easy", "false"], ["TOLK-479", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 479: “அதன்நிலை உயிர்க்கும் யாவரு காலை முதல்நிலை ஒகரம்ஓ ஆகும்மே ரகரத்து உகரம் துவரக் கெடுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 479: “அதன்நிலை உயிர்க்கும் யாவரு காலை முதல்நிலை ஒகரம்ஓ ஆகும்மே ரகரத்து உகரம் துவரக் கெடுமே.” — What does this sutra state?", "இஃது ஒன்றுமுதல் ஒன்பான்களோடு உயிர்முதலாகிய பொருட்பெயர் முடியுமாறும், மேற்கூறிய யகர முதலாய பொருட்பெயர் வேறுபட முடியுமாறும் கூறுகிறது. உண்டு ஒன்று, ஒருவின் மேற்று.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.190, நூ. 479", "", "easy", "false"], ["TOLK-480", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 480: “இரண்டு முதல் ஒன்பான் இறுதி முன்னர் வழங்கு இயல் மாஎன் கிளவி தோன்றின் மகர அளவொடு நிகரலும் உரித்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 480: “இரண்டு முதல் ஒன்பான் இறுதி முன்னர் வழங்கு இயல் மாஎன் கிளவி தோன்றின் மகர அளவொடு நிகரலும் உரித்தே.” — What does this sutra state?", "இஃது இரண்டு முதல் ஒன்பான் முன்னர் அளவு, நிறை, எண் எனும் மூன்றனுக்கும் உரிய மா புணருமாறு கூறுகிறது. எ-டு.: இரண்டுமா-இருமா, எனவும், மூன்றுமா-மும்மா எனவும் வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.190, நூ. 480", "", "easy", "false"], ["TOLK-481", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 481: “லனஎன வரூஉம் புள்ளி இறுதி முன் உம்மும் கெழுவும் உளப்படப் பிறவும் அன்ன மரபின் மொழியிடைத் தோன்றி செய்யுள் தொடர்வயின் மெய்பெற நிலையும் வேற்றுமை குறித்த பொருள் வயினான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 481: “லனஎன வரூஉம் புள்ளி இறுதி முன் உம்மும் கெழுவும் உளப்படப் பிறவும் அன்ன மரபின் மொழியிடைத் தோன்றி செய்யுள் தொடர்வயின் மெய்பெற நிலையும் வேற்றுமை குறித்த பொருள் வயினான.” — What does this sutra state?", "இது லகர, னகர ஈற்றுச்சொற்கள் செய்யுட்கண் முடியுமாறு கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.191, நூ. 481", "", "easy", "false"], ["TOLK-483", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 483: “கிளந்த அல்ல செய்யுளுள் திரிநவும் வழங்கு இயல் மருங்கின் மருவொடு திரிநவும் விளம்பிய இயற்கையின் வேறுபடத் தோன்றின் வழங்குஇயல் மருங்கின் உணர்ந்தனர் ஒழுக்கல் நான்மதி நாட்டத்து என்மனார் புலவர்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 483: “கிளந்த அல்ல செய்யுளுள் திரிநவும் வழங்கு இயல் மருங்கின் மருவொடு திரிநவும் விளம்பிய இயற்கையின் வேறுபடத் தோன்றின் வழங்குஇயல் மருங்கின் உணர்ந்தனர் ஒழுக்கல் நான்மதி நாட்டத்து என்மனார் புலவர்.” — What does this sutra state?", "இது விதந்தோதியவற்றானும் மிகையானும் முடியாதனவற்றையெல்லாம் இதனானே முடித்துக்கொள்க எனப்படலப் புறனடை கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.192, நூ. 483", "", "easy", "false"], ["OLD-001", "Old Tamil writing", "பழந்தமிழ் எழுத்து முறைகளை அறிய எவை உதவுகின்றன?", "What helps us learn about the writing systems used in ancient Tamil times?", "கல்வெட்டுகள், பானை ஓடுகள் மற்றும் பிற தொல்லியல் சான்றுகள் உதவுகின்றன. தமிழ் பிராமி (தமிழி) மற்றும் வட்டெழுத்து ஆகியவை பழைய தமிழ் எழுத்து மரபுகளைப் புரிந்துகொள்ள முக்கியமானவை.", "pazhanthamiz_ezhuthukkal_notes.pdf (Pazhantamiz Eluttukkal – introductory notes), section 1 அறிமுகம்", "", "easy", "false"], ["OLD-002", "Old Tamil writing", "தமிழ் பிராமி (தமிழி) என்றால் என்ன?", "What is Tamil-Brahmi (Tamili)?", "தமிழ் பிராமி அல்லது தமிழி என்பது தமிழின் தொடக்ககாலக் கல்வெட்டு எழுத்து மரபுகளில் ஒன்றாகக் கருதப்படுகிறது. குகைக் கல்வெட்டுகள் மற்றும் பானை ஓடுகள் போன்ற தொல்லியல் பொருட்களில் இதற்கான சான்றுகள் கிடைக்கின்றன. அந்தக் காலத்தின் மொழி, மக்கள் மற்றும் சமூக வாழ்க்கையைப் புரிந்துகொள்ள இச்சான்றுகள் உதவுகின்றன.", "pazhanthamiz_ezhuthukkal_notes.pdf (Pazhantamiz Eluttukkal – introductory notes), section 2", "", "medium", "false"], ["OLD-003", "Old Tamil writing", "தமிழ் பிராமி சான்றுகள் எந்தப் பொருட்களில் கிடைக்கின்றன?", "On what kinds of objects is evidence of Tamil-Brahmi found?", "குகைக் கல்வெட்டுகள் மற்றும் பானை ஓடுகள் போன்ற தொல்லியல் பொருட்களில் தமிழ் பிராமிக்கான சான்றுகள் கிடைக்கின்றன.", "pazhanthamiz_ezhuthukkal_notes.pdf (Pazhantamiz Eluttukkal – introductory notes), section 2", "", "easy", "false"], ["OLD-004", "Old Tamil writing", "வட்டெழுத்து என்றால் என்ன? அது எங்கெல்லாம் காணப்படுகிறது?", "What is Vaṭṭeḻuttu and where is it found?", "வட்டெழுத்து என்பது வளைந்த வடிவங்களைக் கொண்ட பழைய தென்னிந்திய எழுத்து முறை. தமிழகத்தின் தென்பகுதி மற்றும் கேரளப் பகுதிகளில் பல காலகட்டங்களில் இது பயன்படுத்தப்பட்டது. கல்வெட்டுகள் மற்றும் செப்பேடுகள் போன்றவற்றில் வட்டெழுத்தைக் காணலாம்.", "pazhanthamiz_ezhuthukkal_notes.pdf (Pazhantamiz Eluttukkal – introductory notes), section 3", "", "medium", "false"], ["OLD-005", "Old Tamil writing", "இன்றைய தமிழில் உயிரெழுத்துக்கள் எத்தனை? அவை யாவை?", "How many vowel letters are there in present-day Tamil, and what are they?", "உயிரெழுத்துக்கள் 12: அ ஆ இ ஈ உ ஊ எ ஏ ஐ ஒ ஓ ஔ.", "pazhanthamiz_ezhuthukkal_notes.pdf (Pazhantamiz Eluttukkal – introductory notes), section 4 (table)", "", "easy", "false"], ["OLD-006", "Old Tamil writing", "இன்றைய தமிழில் மெய்யெழுத்துக்கள் எத்தனை? அவை யாவை?", "How many consonant letters are there in present-day Tamil, and what are they?", "மெய்யெழுத்துக்கள் 18: க் ங் ச் ஞ் ட் ண் த் ந் ப் ம் ய் ர் ல் வ் ழ் ள் ற் ன்.", "pazhanthamiz_ezhuthukkal_notes.pdf (Pazhantamiz Eluttukkal – introductory notes), section 4 (table)", "", "easy", "false"], ["OLD-007", "Old Tamil writing", "உயிர்மெய்யெழுத்துக்கள் எத்தனை? எடுத்துக்காட்டு தருக.", "How many vowel-consonant (uyirmey) letters are there? Give examples.", "உயிர்மெய்யெழுத்துக்கள் 216. எடுத்துக்காட்டு: க, கா, கி, கீ போன்றவை.", "pazhanthamiz_ezhuthukkal_notes.pdf (Pazhantamiz Eluttukkal – introductory notes), section 4 (table)", "", "easy", "false"], ["OLD-008", "Old Tamil writing", "ஆய்த எழுத்து எத்தனை? அது எது?", "How many aytam letters are there and which is it?", "ஆய்த எழுத்து 1: ஃ.", "pazhanthamiz_ezhuthukkal_notes.pdf (Pazhantamiz Eluttukkal – introductory notes), section 4 (table)", "", "easy", "false"], ["OLD-009", "Old Tamil writing", "பழந்தமிழ் எழுத்துக்களை ஆராயும்போது நினைவில் கொள்ள வேண்டியவை யாவை?", "What should b – பழந்தமிழ் எழுத்து வடிவங்கள்", "", "medium", "true"], ["OLD-014", "Old Tamil writing", "“தற்காலத் தமிழ்” எழுத்து வடிவத்தின் தோராயக் காலமும் சிறப்பும் யாவை?", "What is the approximate period and the notable feature of the script form தற்காலத் தமிழ்?", "காலம்: சோழர் காலம் முதல் படிப்படியாக. சிறப்பு: பல்லவ, சோழர் கல்வெட்டுகளில் உருவான வடிவத்தின் தொடர்ச்சி; பின்னர் அச்சுக்காக ஒழுங்குபடுத்தப்பட்டது.", "uploaded CSV “jk” – பழந்தமிழ் எழுத்து வடிவங்கள்", "", "medium", "true"], ["OLD-015", "Old Tamil writing", "தமிழி எழுத்து ஆய்வில் “ஐராவதம் மகாதேவன் (1930-2018)” யார்? அவரது பங்களிப்பு என்ன?", "In the study of early Tamil writing, who is/are ஐராவதம் மகாதேவன் (1930-2018) and what is the contribution?", "தமிழ்க் கல்வெட்டியலின் முதன்மை அறிஞர். 'Early Tamil Epigraphy' (2003) நூல் எழுதினார்; சிந்துவெளி எழுத்துகள் திராவிட மொழியுடன் தொடர்புடையவை என்ற கருதுகோளை ஆதரித்தார்.", "uploaded CSV “jk” – முக்கிய நிபுணர்கள்", "", "medium", "true"], ["OLD-016", "Old Tamil writing", "தமிழி எழுத்து ஆய்வில் “கே.வி. சுப்பிரமணிய ஐயர்” யார்? அவரது பங்களிப்பு என்ன?", "In the study of early Tamil writing, who is/are கே.வி. சுப்பிரமணிய ஐயர் and what is the contribution?", "தென்னிந்தியக் கல்வெட்டுகள் மற்றும் தமிழ்-பிராமி எழுத்து குறித்த ஆரம்பகால ஆய்வுகளைச் செய்தவர்களில் ஒருவர்.", "uploaded CSV “jk” – முக்கிய நிபுணர்கள்", "", "medium", "true"], ["OLD-017", "Old Tamil writing", "தமிழி எழுத்து ஆய்வில் “டி.வி. மகாலிங்கம்” யார்? அவரது பங்களிப்பு என்ன?", "In the study of early Tamil writing, who is/are டி.வி. மகாலிங்கம் and what is the contribution?", "'South Indian Palaeography' (1974) நூலின் மூலம் தென்னிந்திய எழுத்துகளின் வளர்ச்சியை முறையாக ஆராய்ந்தார்.", "uploaded CSV “jk” – முக்கிய நிபுணர்கள்", "", "medium", "true"], ["OLD-018", "Old Tamil writing", "தமிழி எழுத்து ஆய்வில் “இரா. நாகசாமி” யார்? அவரது பங்களிப்பு என்ன?", "In the study of early Tamil writing, who is/are இரா. நாகசாமி and what is the contribution?", "தமிழ்நாடு தொல்லியல் துறையின் முன்னாள் இயக்குநர். கல்வெட்டுகள், நாணயங்கள், செப்பேடுகள் ஆகியவற்றைப் படித்து வெளியிட்டார்.", "uploaded CSV “jk” – முக்கிய நிபுணர்கள்", "", "medium", "true"], ["OLD-019", "Old Tamil writing", "தமிழி எழுத்து ஆய்வில் “எ.சுப்பராயலு” யார்? அவரது பங்களிப்பு என்ன?", "In the study of early Tamil writing, who is/are எ.சுப்பராயலு and what is the contribution?", "தமிழ்க் கல்வெட்டுகள் மற்றும் தென்னிந்திய வரலாற்றில் கல்வெட்டுச் சான்றுகளைப் பயன்படுத்தி ஆய்வு செய்த அறிஞர்.", "uploaded CSV “jk” – முக்கிய நிபுணர்கள்", "", "medium", "true"], ["OLD-020", "Old Tamil writing", "தமிழி எழுத்து ஆய்வில் “கா. இராஜன்” யார்? அவரது பங்களிப்பு என்ன?", "In the study of early Tamil writing, who is/are கா. இராஜன் and what is the contribution?", "கொடுமணல், பொருந்தல் போன்ற அகழ்வாய்வுகளில் ஈடுபட்ட தொல்லியலாளர். பானை ஓடுகளில் கிடைத்த தமிழி எழுத்துகளின் காலம் முந்தையது என்றார்.", "uploaded CSV “jk” – முக்கிய நிபுணர்கள்", "", "medium", "true"], ["OLD-021", "Old Tamil writing", "“கீழடி அகழ்வாய்வுக் குழுவினர்” எதைக் கண்டறிந்தனர்? அதன் முக்கியத்துவம் என்ன?", "In the study of early Tamil writing, who is/are கீழடி அகழ்வாய்வுக் குழுவினர் and what is the contribution?", "மதுரை அருகிலுள்ள கீழடியில் தமிழி எழுத்துப் பொறிப்புகள் உள்ள பானை ஓடுகளைக் கண்டறிந்தனர்; கதிரியக்கக் கரிமக் காலக்கணிப்பு கி.மு. 6ஆம் நூற்றாண்டு.", "uploaded CSV “jk” – முக்கிய நிபுணர்கள்", "", "medium", "true"], ["OLD-022", "Old Tamil writing", "தமிழி எழுத்து ஆய்வில் “ஜேம்ஸ் பிரின்செப்” யார்? அவரது பங்களிப்பு என்ன?", "In the study of early Tamil writing, who is/are ஜேம்ஸ் பிரின்செப் and what is the contribution?", "1830களில் பிராமி எழுத்தை முதன்முதலில் வெற்றிகரமாகப் படித்தறிந்த அறிஞர்.", "uploaded CSV “jk” – முக்கிய நிபுணர்கள்", "", "medium", "true"]];

const tag=s=>`<span class="tag ${s}">${lang=="ta"?ST[s]:s}</span>`;
const tok=s=>(String(s).toLowerCase().match(/[\p{L}\p{M}\p{N}]+/gu)||[]);
const mk=r=>({id:r[0],cat:r[1],q:r[2],qe:r[3],g:r[4],s:r[5],u:r[6],df:r[7],v:String(r[8]).toLowerCase()==="true",idx:(r[0]+" "+r[2]+" "+r[3]).toLowerCase(),gi:String(r[4]).toLowerCase()});
let D=RAW.map(mk);
const byId=id=>D.find(d=>d.id==id);
function search(q){const k=tok(q).filter(x=>x.length>=2);if(!k.length)return[];
 return D.map(d=>({d,s:k.reduce((a,x)=>a+(d.idx.includes(x)?2:0)+(d.gi.includes(x)?1:0),0)+(q.trim()==d.id?50:0)})).filter(r=>r.s>0).sort((a,b)=>b.s-a.s).slice(0,8).map(r=>r.d);}
// Evidence coverage = share of the reference answer's words found in the tested answer. A rough aid, not expert judgement.
function evaluate(d,ans,flag){
 if(flag=="abstain")return{s:"Unverified",cov:0,why:"Model declined to answer"};
 if(!d.g)return{s:"Unverified",cov:0,why:"No reference answer"};
 if(flag=="disputed")return{s:"Disputed",cov:0,why:"Reviewer marked as disputed"};
 const g=[...new Set(tok(d.g).filter(x=>x.length>=3))],a=new Set(tok(ans)),cov=g.length?g.filter(x=>a.has(x)).length/g.length:0;
 return cov>=.6?{s:"Verified",cov,why:"Matches reference answer"}:cov>=.25?{s:"Partially",cov,why:"Only part of the reference is covered"}:{s:"Incorrect",cov,why:"Little overlap with reference"};}
const WH={"Model declined to answer":"மாதிரி பதிலளிக்க மறுத்தது","No reference answer":"மேற்கோள் பதில் இல்லை","Reviewer marked as disputed":"மதிப்பாய்வாளர் கருத்து வேறுபாடு எனக் குறித்தார்","Matches reference answer":"மேற்கோள் பதிலுடன் பொருந்துகிறது","Only part of the reference is covered":"மேற்கோளின் ஒரு பகுதி மட்டுமே உள்ளது","Little overlap with reference":"மேற்கோளுடன் குறைந்த ஒற்றுமை","No matching question":"பொருந்தும் கேள்வி இல்லை"};
const w=s=>lang=="ta"&&WH[s]?WH[s]:s;
const rows=()=>Object.entries(res).map(([id,e])=>({d:byId(id),e})).filter(r=>r.d);
function stats(rs){const n=rs.length,c=s=>rs.filter(r=>r.e.s==s).length;return{n,v:c("Verified"),p:c("Partially"),i:c("Incorrect"),u:c("Unverified"),x:c("Disputed"),ab:rs.filter(r=>r.e.flag=="abstain").length,ref:rs.filter(r=>r.e.s!="Verified").length};}
const pc=(a,n)=>n?Math.round(100*a/n)+"%":"–";
function sh(s){return`<div class="grid">${[[t("Tested","சோதிக்கப்பட்டவை"),s.n],[t("Verified",ST.Verified),s.v],[t("Partial",ST.Partially),s.p],[t("Incorrect",ST.Incorrect),s.i],[t("Unverified",ST.Unverified),s.u],[t("Disputed",ST.Disputed),s.x],[t("Abstention","விலகல் விகிதம்"),pc(s.ab,s.n)],[t("Expert referral","நிபுணர் பரிந்துரை"),pc(s.ref,s.n)]].map(a=>`<div class="stat"><b>${a[1]}</b>${a[0]}</div>`).join("")}</div>`}
const BAN=()=>`<div class="banner">${t("Questions and reference answers come from your CSV files. Only rows with verified_by_expert=true count as expert-verified. Live AI tools are in the AI Studio and AI tools tabs; you can also paste an AI answer to test it.","கேள்விகளும் மேற்கோள் பதில்களும் உங்கள் CSV கோப்புகளிலிருந்து வருகின்றன. verified_by_expert=true உள்ளவை மட்டுமே நிபுணர் சரிபார்த்தவை. நேரடி AI கருவிகள் AI வாசிப்பு, AI கருவிகள் தாவல்களில் உள்ளன; AI பதிலை ஒட்டியும் சோதிக்கலாம்.")}</div>`;
const L={en:{home:"Home",ask:"Ask",answer:"Answer",report:"Reliability",eval:"Evaluation",expert:"Expert review",admin:"Database",sub:"Can AI answer Tamil heritage questions reliably?"},ta:{home:"முகப்பு",ask:"கேள்வி",answer:"பதில்",report:"நம்பகத்தன்மை",eval:"மதிப்பீடு",expert:"நிபுணர் மதிப்பீடு",admin:"தரவுத்தளம்",sub:"தமிழ் கேள்விகளுக்கு AI நம்பகமாக பதிலளிக்குமா?"}};
const V={
home:()=>BAN()+`<div class="card"><h2>${t("Project overview","திட்ட மேலோட்டம்")}</h2><p>${t("TamilTrust AI checks AI answers against reference answers and their sources, and refers weak or missing evidence to an expert.","மேற்கோள் பதில்கள், அவற்றின் மூலங்களுடன் AI பதில்களை TamilTrust AI ஒப்பிடுகிறது; சான்று குறைவாக இருந்தால் நிபுணருக்குப் பரிந்துரைக்கிறது.")}</p></div><div class="card"><h3>${t("Database","தரவுத்தளம்")}</h3><div class="grid">${CATS.map(c=>`<div class="stat"><b>${D.filter(d=>d.cat==c).length}</b>${ct(c)}</div>`).join("")}<div class="stat"><b>${D.filter(d=>d.v).length}</b>${t("Expert-verified","நிபுணர் சரிபார்த்தவை")}</div><div class="stat"><b>${SRCS.length}</b>${t("Sources","மூலங்கள்")}</div></div></div><div class="card"><h3>${t("Test results","சோதனை முடிவுகள்")}</h3>${sh(stats(rows()))}</div>`,
ask:()=>`<div class="card"><label>${t("Search the database (Tamil, English or ID)","தரவுத்தளத்தில் தேடுக (தமிழ், ஆங்கிலம் அல்லது ID)")}</label><input id="q" type="text" value="" name="tt-s-${Date.now()}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-autocomplete="none"><button class="act" onclick="doSearch()">${t("Search","தேடு")}</button><div id="out"></div></div>`,
answer:()=>{if(!cur)return`<div class="card">${t("Pick a question first.","முதலில் ஒரு கேள்வியைத் தேர்ந்தெடுக்கவும்.")}</div>`;const d=cur,e=res[d.id];return BAN()+`<div class="card"><h3>${esc(Q(d))}</h3><p class="mut">${esc(lang=="en"?d.q:d.qe)}<br>${esc(d.id)} · ${esc(ct(d.cat))} · ${esc(d.df)} · ${d.v?t("expert-verified","நிபுணர் சரிபார்த்தது"):t("not expert-verified","நிபுணர் சரிபார்க்கவில்லை")}</p><b>${t("Reference answer","மேற்கோள் பதில்")}</b><div class="ref">${esc(d.g||"–")}</div><p class="mut">${t("Source","மூலம்")}: ${esc(d.s)} ${d.u?`· <a href="${esc(d.u)}" rel="noopener">link</a>`:""}</p></div><div class="card"><h3>${t("Test an AI answer","AI பதிலைச் சோதி")}</h3><textarea id="a" rows="5">${e?esc(e.ans):""}</textarea><select id="f"><option value="">${t("Model answered","மாதிரி பதிலளித்தது")}</option><option value="abstain">${t("Model abstained","மாதிரி விலகியது")}</option><option value="disputed">${t("Disputed interpretation","கருத்து வேறுபாடு")}</option></select><button class="act" onclick="runTest()">${t("Evaluate","மதிப்பிடு")}</button>${e?result(e):""}</div>`},
report:()=>BAN()+(rows().length?rows().map(({d,e})=>`<div class="card"><b>${esc(Q(d))}</b> ${tag(e.s)}<div class="bar"><i style="width:${e.cov*100}%"></i></div><span class="mut">${t("Evidence coverage","சான்று உள்ளடக்கம்")} ${Math.round(e.cov*100)}% · ${esc(w(e.why))}</span></div>`).join(""):`<div class="card">${t("No tests yet. Open a question and paste an AI answer.","இன்னும் சோதனை இல்லை. ஒரு கேள்வியைத் திறந்து AI பதிலை ஒட்டவும்.")}</div>`),
eval:()=>BAN()+`<div class="card"><h3>${t("Overall","மொத்தம்")}</h3>${sh(stats(rows()))}</div><div class="card tbl"><table><tr><th>${t("Category","வகை")}</th><th>${t("DB","தரவு")}</th><th>${t("Tested","சோதனை")}</th><th>${t("Ver.","சரி")}</th><th>${t("Part.","பகுதி")}</th><th>${t("Inc.","தவறு")}</th><th>${t("Unv.","சரிபார்க்கவில்லை")}</th><th>${t("Disp.","வேறுபாடு")}</th></tr>${CATS.map(c=>{const s=stats(rows().filter(r=>r.d.cat==c));return`<tr><td>${ct(c)}</td><td>${D.filter(d=>d.cat==c).length}</td><td>${s.n}</td><td>${s.v}</td><td>${s.p}</td><td>${s.i}</td><td>${s.u}</td><td>${s.x}</td></tr>`}).join("")}</table></div>`,
expert:()=>{const q=rows().filter(r=>r.e.s!="Verified");return`<div class="card"><h3>${t("Review queue","ஆய்வு வரிசை")} (${q.length+miss.length})</h3>${q.map(r=>`<p>${tag(r.e.s)} ${esc(Q(r.d))}<br><span class="mut">${t("Reason","காரணம்")}: ${esc(w(r.e.why))}</span></p>`).join("")}${miss.map(m=>`<p>${tag("Unverified")} ${esc(m)}<br><span class="mut">${t("Reason","காரணம்")}: ${esc(w("No matching question"))}</span></p>`).join("")}<p class="mut">${t("Reviewer login requires a real backend.","மதிப்பாய்வாளர் உள்நுழைவுக்கு உண்மையான பின்தளம் தேவை.")}</p></div>`},
admin:()=>`<div class="card"><h3>${t("Browse database","தரவுத்தளத்தை உலாவு")}</h3><select id="bc" onchange="br()"><option value="">${t("All categories","அனைத்து வகைகள்")}</option>${CATS.map(c=>`<option value="${c}">${ct(c)}</option>`).join("")}</select><input id="bq" placeholder="${t("Filter…","வடிகட்டு…")}" oninput="br()"><div id="bl"></div></div><div class="card"><h3>${t("Sources","மூலங்கள்")} (${SRCS.length})</h3><p class="mut">${t("Online resources for old Tamil writing. Link records only: the pages are not copied, so check each site's terms before reusing text.","பழந்தமிழ் எழுத்து குறித்த இணைய வளங்கள். இணைப்புப் பதிவுகள் மட்டும்; பக்கங்கள் நகலெடுக்கப்படவில்லை, உரையை மறுபயன்படுத்தும் முன் ஒவ்வொரு தளத்தின் விதிகளைப் பார்க்கவும்.")}</p>${SRCS.map(s=>`<div class="hit"><b>${esc(t(s.en,s.ta))}</b> <span class="mut">[${s.k}]</span><br><a href="${esc(s.u)}" target="_blank" rel="noopener">${t("Open link","இணைப்பைத் திற")}</a>${s.n?`<br><span class="warn">${esc(t(s.n,s.nt))}</span>`:""}</div>`).join("")}</div><div class="card"><h3>${t("Import CSV","CSV இறக்குமதி")}</h3><p class="mut">${t("Columns: id, question_ta, question_en, gold_answer, source_name, source_url, difficulty, verified_by_expert (optional: category). Duplicate ids or questions are skipped; imports last for this session.","நெடுவரிசைகள்: id, question_ta, question_en, gold_answer, source_name, source_url, difficulty, verified_by_expert (விருப்பம்: category). நகல் id/கேள்விகள் தவிர்க்கப்படும்; இறக்குமதி இந்த அமர்வு வரை மட்டுமே.")}</p><input type="file" accept=".csv" onchange="imp(this)"><div id="m"></div></div>`};
function result(e){return`<p>${tag(e.s)} <span class="mut">${t("Evidence coverage","சான்று உள்ளடக்கம்")} ${Math.round(e.cov*100)}% · ${esc(w(e.why))}</span></p><div class="bar"><i style="width:${e.cov*100}%"></i></div>${e.s!="Verified"?`<p class="warn">⚠ ${t("Uncertain: expert review recommended.","நிச்சயமின்மை: நிபுணர் ஆய்வு பரிந்துரைக்கப்படுகிறது.")}</p>`:`<p class="mut">${t("Word overlap with the reference only; not a substitute for expert review.","மேற்கோளுடன் சொல் ஒற்றுமை மட்டுமே; நிபுணர் ஆய்வுக்கு மாற்றல்ல.")}</p>`}`}
function doSearch(){const q=document.getElementById("q").value.trim(),h=search(q),o=document.getElementById("out");
 if(!h.length){if(q&&!miss.includes(q))miss.push(q);o.innerHTML=`<p class="warn">${t("No matching question. Added to the expert queue.","பொருந்தும் கேள்வி இல்லை. நிபுணர் வரிசையில் சேர்க்கப்பட்டது.")}</p>`;return}
 o.innerHTML=h.map(d=>`<div class="hit" onclick="openQ('${esc(d.id)}')"><b>${esc(Q(d).slice(0,140))}</b><br><span class="mut">${esc(d.id)} · ${esc(ct(d.cat))}</span></div>`).join("")}
function openQ(id){cur=byId(id);go("answer")}
function runTest(){const a=document.getElementById("a").value,f=document.getElementById("f").value;if(!a.trim()&&!f)return;const e=evaluate(cur,a,f);res[cur.id]={...e,ans:a,flag:f};save();render()}
function br(){const c=document.getElementById("bc").value,q=document.getElementById("bq").value.toLowerCase(),l=D.filter(d=>(!c||d.cat==c)&&(!q||d.idx.includes(q)));
 document.getElementById("bl").innerHTML=`<p class="mut">${l.length} / ${D.length}</p>`+l.slice(0,40).map(d=>`<div class="hit" onclick="openQ('${esc(d.id)}')">${esc(Q(d).slice(0,110))}<br><span class="mut">${esc(d.id)}</span></div>`).join("")}
function csv(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==","){row.push(f);f=""}else if(c=="\n"){row.push(f);r.push(row);row=[];f=""}else if(c!="\r")f+=c}if(f||row.length){row.push(f);r.push(row)}return r}
function imp(el){const fl=el.files[0];if(!fl)return;const m=document.getElementById("m");
 if(fl.size>5e6){m.innerHTML=`<p class="warn">>5 MB</p>`;return}
 fl.text().then(x=>{const r=csv(x.replace(/^\uFEFF/,"")),h=r[0]||[],ix=k=>h.indexOf(k);if(ix("id")<0||ix("question_ta")<0){m.innerHTML=`<p class="warn">${t("Missing id / question_ta columns.","id / question_ta நெடுவரிசைகள் இல்லை.")}</p>`;return}
  let n=0;r.slice(1).forEach(o=>{const id=o[ix("id")],q=o[ix("question_ta")];if(!id||!q||D.some(d=>d.id==id||d.q==q))return;
   const p=id.split("-")[0],cat=CATS.includes(o[ix("category")])?o[ix("category")]:{SANG:"Sangam literature",TOLK:"Tolkāppiyam",OLD:"Old Tamil writing",DIAL:"Tamil dialects"}[p]||"General Tamil",g=k=>ix(k)<0?"":o[ix(k)]||"";
   D.push(mk([id,cat,q,g("question_en"),g("gold_answer"),g("source_name"),g("source_url"),g("difficulty"),g("verified_by_expert")]));n++});
  m.innerHTML=`<p>${n} / ${r.length-1} ${t("imported (rest invalid or duplicate)","இறக்குமதி (மற்றவை தவறு/நகல்)")}</p>`})}
function go(p){page=p;render();if(p=="admin")br()}
function render(){document.documentElement.lang=lang;document.getElementById("sub").textContent=L[lang].sub;
 document.getElementById("nav").innerHTML=Object.keys(V).map(k=>`<button class="${k==page?"on":""}" onclick="go('${k}')">${(IC[k]||"")+" "+L[lang][k]}</button>`).join("")+`<button class="lg" onclick="setLang()">${lang=="en"?"தமிழ்":"EN"}</button>`;

 o.innerHTML=wait();let im=null;if(IMG){const b=await shrink(IMG);if(!b){o.innerHTML=`<p class="warn">${t(...ECODE.image_rejected)}</p>`;return}im=[b]}
 const ul=lang=="en"?"English":"Tamil";
 aiRun(`You are an expert Tamil epigraphist, palaeographer and translator. Script/type: ${sc}.${im?" A picture of the writing is attached: look at it carefully, line by line from top to bottom, and read every readable letter.":""} Also use this pasted text if any. Turn it into clear, readable text and explain it so an ordinary person understands. Answer using EXACTLY these section lines, each on its own line, followed by that section's content:\n## EXTRACTED\n(the text as written, line by line, with Roman transliteration)\n## TAMIL\n(readable modern Tamil with proper spelling and punctuation)\n## ENGLISH\n(faithful English translation)\n## EXPLAIN\n(simple explanation in ${ul}: what it says, who/what/when if known, historical or literary context)\n## WORDS\n(old or difficult words, each with its modern meaning)\n## NOTES\n(confidence high/medium/low, and which letters or words are uncertain)\nRules: never invent letters you cannot see; mark doubtful parts with [?]; if the picture is unreadable or has no text, say so under NOTES and leave the other sections empty.\n\nPASTED TEXT: ${x||"(none, read the picture)"}`,o,im,"AI script reading: "+(x||"image"),true,aiFallback(x))}
L.en.aiset="AI settings";L.ta.aiset="AI அமைப்பு";IC.aiset="⚙️";
const saveCfg=()=>{CFG={p:document.getElementById("cp").value,k:document.getElementById("ck").value.trim(),m:document.getElementById("cm").value.trim()};try{localStorage.setItem("tt_ai",JSON.stringify(CFG))}catch(e){}document.getElementById("cout").innerHTML=`<p class="okb">✓ ${t("Saved in this browser.","இந்த உலாவியில் சேமிக்கப்பட்டது.")}</p>`};
const clearCfg=()=>{CFG.k="";try{localStorage.removeItem("tt_ai")}catch(e){}document.getElementById("ck").value="";document.getElementById("cout").innerHTML=`<p class="mut">${t("Key removed.","key நீக்கப்பட்டது.")}</p>`};
async function testCfg(){saveCfg();const o=document.getElementById("cout");o.innerHTML=wait();try{const r=await remote("Reply with the Tamil word தமிழ் and the English word Tamil only.");o.innerHTML=`<p class="okb">✓ ${t("AI works:","AI செயல்படுகிறது:")} ${esc(r.text.slice(0,80))}</p>`}catch(e){o.innerHTML=`<p class="warn">${AIERR(e)}</p>`}}
V.aiset=()=>`<div class="card"><h3>⚙️ ${t("AI settings","AI அமைப்பு")}</h3><p class="mut">${t("This website runs on its own. To switch on the AI reader, translator and tools, paste your own API key. It is kept only in this browser and sent only to the AI company you pick.","இந்த இணையதளம் தனியாகவே இயங்கும். AI வாசிப்பு, மொழிபெயர்ப்பு, கருவிகளை இயக்க உங்கள் API key-ஐ ஒட்டவும். அது இந்த உலாவியில் மட்டுமே இருக்கும்; நீங்கள் தேர்ந்த AI நிறுவனத்துக்கு மட்டுமே அனுப்பப்படும்.")}</p><label>${t("AI provider","AI வழங்குநர்")}</label><select id="cp"><option value="gemini" ${CFG.p=="gemini"?"selected":""}>Google Gemini (${t("free key available","இலவச key கிடைக்கும்")})</option><option value="anthropic" ${CFG.p=="anthropic"?"selected":""}>Anthropic Claude</option></select><label>API key</label><input id="ck" type="password" autocomplete="off" spellcheck="false" value="${esc(CFG.k)}"><label>${t("Model (optional)","மாதிரி (விருப்பம்)")}</label><input id="cm" autocomplete="off" spellcheck="false" placeholder="gemini-2.5-flash / claude-sonnet-5-5" value="${esc(CFG.m)}"><div class="row"><button class="act" onclick="saveCfg()">${t("Save","சேமி")}</button><button class="act alt" onclick="testCfg()">${t("Test","சோதி")}</button><button class="act alt" onclick="clearCfg()">${t("Remove key","key நீக்கு")}</button></div><div id="cout"></div><p class="mut">🔑 ${t("Get a free Gemini key:","இலவச Gemini key பெற:")} <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> · Anthropic: <a href="https://console.anthropic.com/" target="_blank" rel="noopener">console.anthropic.com</a><br>⚠ ${t("Never publish this page with your key typed in, and do not use a shared computer for your key.","key உள்ளிட்ட நிலையில் இந்தப் பக்கத்தை வெளியிட வேண்டாம்; பகிர்ந்த கணினியில் key-ஐப் பயன்படுத்த வேண்டாம்.")}</p></div>`;
let TESS=null;
const loadTess=()=>window.Tesseract?Promise.resolve():TESS||(TESS=new Promise((res,rej)=>{const e=document.createElement("script");e.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";e.onload=res;e.onerror=()=>{TESS=null;rej()};document.head.appendChild(e)}));
async function ocr(){const o=document.getElementById("aout");if(!IMG){o.innerHTML=`<p class="warn">${t("Choose a picture first.","முதலில் படத்தைத் தேர்வு செய்யவும்.")}</p>`;return}
 o.innerHTML=`<p class="mut"><span class="spin"></span><span id="op">${t("Loading offline reader (first time needs internet)…","Offline வாசிப்பு ஏற்றப்படுகிறது (முதல்முறை இணையம் தேவை)…")}</span></p>`;
 try{await loadTess();const b=(await shrink(IMG,2400))||IMG,r=await Tesseract.recognize(b,"tam+eng",{logger:m=>{const e=document.getElementById("op");if(e)e.textContent=m.status+" "+Math.round((m.progress||0)*100)+"%"}}),x=(r.data.text||"").trim();
  document.getElementById("ain").value=x;
  o.innerHTML=`<div class="res"><button class="cp" onclick="cp(${esc(JSON.stringify(x))})">${t("Copy","நகல்")}</button><h4>${t("Text read offline (OCR)","Offline OCR மூலம் வாசித்த உரை")}</h4>${esc(x)||t("No text found.","உரை கிடைக்கவில்லை.")}</div><p class="mut">${t("OCR suits clear printed or modern Tamil. For inscriptions and manuscripts use the AI button. The text was copied into the box above so you can fix it and run AI on it.","தெளிவான அச்சு / தற்காலத் தமிழுக்கு OCR பொருந்தும். கல்வெட்டு, சுவடிகளுக்கு AI பொத்தானைப் பயன்படுத்தவும். உரை மேலுள்ள பெட்டியில் நகலெடுக்கப்பட்டது; திருத்தி AI-யில் இயக்கலாம்.")}</p>`}
 catch(e){o.innerHTML=`<p class="warn">${t("Offline reader could not load. It needs an internet connection once to download the reader and Tamil data.","Offline வாசிப்பைத் தொடங்க முடியவில்லை. வாசிப்பு மற்றும் தமிழ் தரவைப் பதிவிறக்க ஒருமுறை இணையம் தேவை.")}</p>`}}

const AIT={translate:["Translate (Tamil ⇄ English)","மொழிபெயர் (தமிழ் ⇄ ஆங்கிலம்)","Translate the input: Tamil to English, or English to Tamil. Keep poetic or old words and add a short note on them."],
 explain:["Verse / passage explainer","பாடல் / பகுதி விளக்கம்","Explain this old Tamil verse or passage: (a) simple modern Tamil prose, (b) word-by-word meanings, (c) literary context (work, thinai/turai if Sangam), (d) one-line English summary."],
 word:["Old word → modern meaning","பழந்தமிழ் சொல் → தற்கால பொருள்","For each old Tamil word give: modern equivalent, meaning, root if known, and where it appears. Say clearly when unsure."],
 quiz:["Quiz maker","வினாடி வினா","Make a 5-question multiple-choice quiz (4 options each, correct answers listed at the end) on the topic."],
 check:["Claim checker","கூற்று சரிபார்ப்பு","Judge this claim: Supported / Partly supported / Not supported / Disputed, with reasons, citing database excerpts as [1], [2]; mark general knowledge (பொது அறிவு)."]};
V.aitools=()=>`<div class="card"><h3>✨ ${t("AI tools","AI கருவிகள்")}</h3><select id="atk">${Object.keys(AIT).map(k=>`<option value="${k}">${t(AIT[k][0],AIT[k][1])}</option>`).join("")}</select><textarea id="atx" rows="5" name="tt-a-${Date.now()}" autocomplete="off" spellcheck="false"></textarea><button class="act" onclick="aiTool()">${t("Run","இயக்கு")}</button><div id="atout"></div></div>`;
function aiTool(){const k=document.getElementById("atk").value,x=document.getElementById("atx").value.trim();if(!x)return;
 const h=kbHits(x,5).slice(0,5),ctx=h.map((r,i)=>`[${i+1}] ${r.title}: ${r.text}`).join("\n");
 aiRun(`You are a careful assistant for Tamil language and heritage. Reply in ${lang=="en"?"English":"Tamil, with short English where helpful"}. Never invent sources or quotes. ${AIT[k][2]}\n\nINPUT:\n${x}\n\nDATABASE EXCERPTS:\n${ctx||"none"}`,document.getElementById("atout"),null,"AI tool ("+k+"): "+x.slice(0,80))}
const _a2=V.answer;
V.answer=()=>{const h=_a2();return cur&&cur.g?h+`<div class="card"><h3>🌐 ${t("Translate reference answer","மேற்கோள் பதிலை மொழிபெயர்")}</h3><button class="act" onclick="trRef()">${lang=="en"?"Tamil → English":"தமிழ் → ஆங்கிலம்"}</button><div id="trout"></div></div>`:h};
function trRef(){aiRun(`Translate this Tamil answer into clear English, then give a 2-line plain explanation. Do not add facts.\n\n${cur.g}`,document.getElementById("trout"),null,"Translation: "+cur.id)}
const _sc=V.script;
V.script=()=>`<div class="card"><h3>📷 ${t("AI picture reader","AI படம் வாசிப்பு")}</h3><p class="mut">${t("Upload a photo of an inscription, copper plate or palm-leaf manuscript (or paste text). AI gives the text, modern Tamil, English translation and an explanation.","கல்வெட்டு, செப்பேடு அல்லது ஓலைச்சுவடி படத்தைப் பதிவேற்றவும் (அல்லது உரையை ஒட்டவும்). AI உரை, தற்காலத் தமிழ், ஆங்கில மொழிபெயர்ப்பு, விளக்கம் தரும்.")}</p><div id="ast" class="banner">${t("Checking AI…","AI சரிபார்க்கிறது…")}</div><label class="drop" id="dz" ondragover="event.preventDefault();this.classList.add('on')" ondragleave="this.classList.remove('on')" ondrop="dropImg(event)"><span id="dzt"><span style="font-size:2rem">📷</span><b>${t("Tap to upload or drop a picture","படத்தைப் பதிவேற்ற தட்டவும் அல்லது இழுத்து விடவும்")}</b><span class="mut">JPG · PNG · WEBP · GIF</span></span><input id="fi" type="file" accept="image/*" hidden onchange="setImg(this.files[0]);this.value=''"></label><div class="row"><button class="act alt" onclick="document.getElementById('fi').click()">🖼️ ${t("Choose picture","படத்தைத் தேர்வு செய்")}</button><button class="act alt" onclick="document.getElementById('fc').click()">📸 ${t("Take photo","புகைப்படம் எடு")}</button></div><input id="fc" type="file" accept="image/*" capture="environment" hidden onchange="setImg(this.files[0]);this.value=''"><p class="mut">💡 ${t("Tips: good light, straight-on photo, crop to the writing. You can also paste a picture (Ctrl+V).","குறிப்புகள்: நல்ல வெளிச்சம், நேராக எடுத்த படம், எழுத்துப் பகுதியை மட்டும் வெட்டவும். படத்தை ஒட்டவும் (Ctrl+V) முடியும்.")}</p><select id="asc"><option value="auto-detect">${t("Auto-detect script","எழுத்தை தானாக அறி")}</option><option value="Tamil-Brahmi (Tamili)">${t("Tamil-Brahmi (Tamili)","தமிழி (தமிழ்-பிராமி)")}</option><option value="Vatteluttu">${t("Vatteluttu","வட்டெழுத்து")}</option><option value="Grantha">${t("Grantha","கிரந்தம்")}</option><option value="Pallava / early Chola Tamil">${t("Pallava / Chola-era Tamil","பல்லவ / சோழர்கால தமிழ்")}</option><option value="Palm-leaf manuscript (Olaichuvadi)">${t("Palm-leaf manuscript","ஓலைச்சுவடி")}</option></select><textarea id="ain" rows="3" name="tt-i-${Date.now()}" autocomplete="off" spellcheck="false" placeholder="${t("Optional: paste old text or a Roman transcription…","விருப்பம்: பழைய உரை / ரோமன் எழுத்துப்பெயர்ப்பை ஒட்டவும்…")}"></textarea><button class="act" onclick="aiRead()">✨ ${t("Read, translate & explain (AI)","வாசி, மொழிபெயர், விளக்கு (AI)")}</button><button class="act alt" onclick="ocr()">🔤 ${t("Read text offline (no key)","உரையை offline வாசி (key வேண்டாம்)")}</button><div id="aout"></div></div>`+_sc();
const _hm=V.home;
V.home=()=>`<div class="hero"><div class="hl"><img alt="TamilTrust AI logo" width="84" height="84" src="${LOGOURI}"></div><h2>${t("Read old Tamil. Understand it instantly.","பழந்தமிழை வாசியுங்கள்; உடனே புரிந்துகொள்ளுங்கள்.")}</h2><p>${t("Upload a picture of an inscription or manuscript and get the text, translation and explanation.","கல்வெட்டு அல்லது சுவடி படத்தைப் பதிவேற்றினால் உரை, மொழிபெயர்ப்பு, விளக்கம் கிடைக்கும்.")}</p><div class="chips"><span>📷 ${t("Picture reader","படம் வாசிப்பு")}</span><span>🌐 ${t("Translate","மொழிபெயர்ப்பு")}</span><span>✨ ${t("Explain","விளக்கம்")}</span><span>❓ ${t("Quiz","வினாடி வினா")}</span></div><button class="act" onclick="go('script')">📷 ${t("Try the AI reader","AI வாசிப்பைத் தொடங்கு")}</button></div>`+_hm();

render();
