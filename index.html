s this sutra state?", "நெட்டெழுத்துக்களில் ஐகாரம், ஔகாரம் காரச்சாரியைகளோடு முன் விலக்கிய கான் சாரியையையும் பெறும். எ.டு.: ஐகான், ஔகான்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.57, நூ. 137", "", "easy", "false"], ["TOLK-138", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 138: “புள்ளி ஈற்று முன் உயிர் தனித்து இயலாது மெய்யொடும் சிவணும் அவ்இயல் கெடுத்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 138: “புள்ளி ஈற்று முன் உயிர் தனித்து இயலாது மெய்யொடும் சிவணும் அவ்இயல் கெடுத்தே.” — What does this sutra state?", "இது மெய்யீற்றின்முன் உயிர்வருங்கால் நிகழும் புணர்ச்சி விதிகளைக் கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.57, நூ. 138", "", "easy", "false"], ["TOLK-139", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 139: “மெய்உயிர் நீங்கின் தன்உரு ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 139: “மெய்உயிர் நீங்கின் தன்உரு ஆகும்.” — What does this sutra state?", "சேர்ந்த உயிர் நீங்கியவழி, மெய்யும், குற்றியலுகரமும் எய்தும் நிலைமையினை இந்நூற்பா விளக்குகின்றது. தன்னொடு கூடிய உயிர் நீங்கின் மெய ;தன் இயல்பான புள்ளியினைப் பெற்று வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.57, நூ. 139", "", "easy", "false"], ["TOLK-140", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 140: “எல்லா மொழிக்கும் உயிர்வரு வழியே உடம்படு மெய்யின் உருபுகொளல் வரையார்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 140: “எல்லா மொழிக்கும் உயிர்வரு வழியே உடம்படு மெய்யின் உருபுகொளல் வரையார்.” — What does this sutra state?", "புள்ளியீற்று உயிர்வரின் புணரும் நிலையினைக் கூறிய ஆசிரியர், உயிரீற்றுமுன் உயிர்வரின் புணருந்திறனை இந்நூற்பாவான் கூறுகின்றார். இகர ஈகார ஐகாரங்கள் யகரத்தினையும், அகர உகர எகார ஓகார ஔகாரங்கள் வகரத்தினையும், ஆகார, ஏகாரங்கள் யகரம், வகரம் இரண்டனையும் உடம்படுமெய்களாய்ப் பெறும் என்று கொள்க. எ-டு.: மணியழகிது, தீயெழுந்தது - இகர ஈகார, ஒகாரங்கள் யகர தாமரையழகிது உடம்படுமெய் பெற்றன. விளவழகிது, கடுவழகிது, பூவழகிது,- அகர, உகர, எகார, ஓகார, சோவடைந்தது, கௌவழகிது ஔகாரங்கள் வகர உடம்படுமெய் பெற்றன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.58, நூ. 140", "", "medium", "false"], ["TOLK-141", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 141: “எழுத்து ஓரன்ன பொருள்தெரி புணர்ச்சி இசையின் திரிதல் நிலைஇய பண்பே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 141: “எழுத்து ஓரன்ன பொருள்தெரி புணர்ச்சி இசையின் திரிதல் நிலைஇய பண்பே.” — What does this sutra state?", "இஃது எழுத்துக்கள் மாறாத நிலையில் ஓசைத்திரிபான் பொருள்சிலவாதலை உணர்த்துகின்றது. அதாவது, எழுத்துக்களால் இணைந்து நின்று பொருள் தருகின்ற புணர்நிலைகள், சொல்லுவானது எடுத்தல், படுத்தல், ஆகிய ஒலி வேறுபாட்டால் பொருள் வேறுபடும் என்பதாம். எ-டு.: செம்பொன்பதின்றொடி, குன்றேறாமா என வரும். மேற்கூறிய புணர்மொழிகள் குறிப்பான் உணரும் பொருண்மையை உடையன. புணர்ச்சிக்கண் இத்தன்மையன என்னும் எழுத்து முறைமையினை உடையன அல்ல. அப்பொருள் வேறுபாடுகள் குறிப்பால் பொருளை உணரும் தன்மைய. எழுத்து முறைமையுடையன அல்ல.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.58, நூ. 141", "", "medium", "false"], ["TOLK-142", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 142: “அவைதாம் முன்னப் பொருள் புணர்ச்சிவாயின் இன்ன என்னும் எழுத்துக் கடன் இலவே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 142: “அவைதாம் முன்னப் பொருள் புணர்ச்சிவாயின் இன்ன என்னும் எழுத்துக் கடன் இலவே.” — What does this sutra state?", "ஒரு தொடர் சில பொருள்படுங்கால், குறித்த பொருளினை அறியும் திறனை இது கூறுகிறது. எ-டு.: செம்பொன்பதின்றொடி- செம்பொன்+பதின்தொடி எனவும் செம்பூஒன்பதின்தொடி எனவும் வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.59, நூ. 142", "", "easy", "false"], ["TOLK-143", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 143: “க ச த ப முதலிய மொழிமேல் தோன்றும் மெல்லெழுத்து இயற்கை சொல்லிய முறையான் ங ஞ ந ம என்னும் ஒற்று ஆகும்மே அன்ன மரபின் மொழிவயினான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 143: “க ச த ப முதலிய மொழிமேல் தோன்றும் மெல்லெழுத்து இயற்கை சொல்லிய முறையான் ங ஞ ந ம என்னும் ஒற்று ஆகும்மே அன்ன மரபின் மொழிவயினான.” — What does this sutra state?", "அதாவது, வருமொழி முதல் எழுத்தாக க, ச, த, ப வந்தால் அதற்கு இனமான மெல்லெழுத்துக்கள் வரும். இதுவே மொழியின் மரபு என்பதாம். எ-டு.: மரம்+குறிதுஸ்ரீமரங்குறிது, சிறிது, தீது, பெரிது எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.63, நூ. 143", "", "easy", "false"], ["TOLK-144", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 144: “ஞ ந ம ய வ என்னும் முதல் ஆகுமொழியும் உயிர்முதல் ஆகிய மொழியும், உளப்பட அன்றி அனைத்தும் எல்லா வழியும் நின்ற சொல் முன் இயல்பு ஆகும்மே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 144: “ஞ ந ம ய வ என்னும் முதல் ஆகுமொழியும் உயிர்முதல் ஆகிய மொழியும், உளப்பட அன்றி அனைத்தும் எல்லா வழியும் நின்ற சொல் முன் இயல்பு ஆகும்மே.” — What does this sutra state?", "இருபத்துநான்கு ஈற்று முன்னரும், அல்வழி, வேற்றுமை இருவழியினும், வன்கணம் ஒழிந்த கணங்கள் வரின் முடியும் முடிபினை இது கூறுகிறது. எ-டு.: விளஞான்றது - உயிரீற்றுமுன் அல்வழிக்கண் ஞ, ந, ம விளநீண்டது இயல்பாய் முடிந்தன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.63, நூ. 144", "", "medium", "false"], ["TOLK-145", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 145: “அவற்றுள் மெல்லெழுத்து இயற்கை உறழினும் வரையார் சொல்லிய தொடர்மொழி இறுதியான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 145: “அவற்றுள் மெல்லெழுத்து இயற்கை உறழினும் வரையார் சொல்லிய தொடர்மொழி இறுதியான.” — What does this sutra state?", "இது மேற்கூறிய முடிபிற் சிலவற்றிற்கு எய்தியது விலக்கிப் பிறிது விதி கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.64, நூ. 145", "", "easy", "false"], ["TOLK-146", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 146: “ணன என புள்ளிமுன் யாவும் ஞாவும் வினையோ ரனைய என்மனார் புலவர்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 146: “ணன என புள்ளிமுன் யாவும் ஞாவும் வினையோ ரனைய என்மனார் புலவர்.” — What does this sutra state?", "இது ணனவழி வரும் ஞகர யகரத்திற்குச் சிறப்புவிதி கூறுகிறது. எ-டு.: மண்யாத்த எனவும், பொன்யாத்த எனவும், மண்ஞாத்த எனவும், பொன்ஞாத்த எனவும் வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.64, நூ. 146", "", "easy", "false"], ["TOLK-149", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 149: “லன எனவரூஉம் புள்ளி முன்னர் தந எனவரின் றன ஆகும்மே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 149: “லன எனவரூஉம் புள்ளி முன்னர் தந எனவரின் றன ஆகும்மே.” — What does this sutra state?", "இது புள்ளிமயங்கியலை நோக்கி வருமொழிக் கருவித் திரிபு கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.66, நூ. 149", "", "easy", "false"], ["TOLK-152", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 152: “ஔ என வரூஉம் உயிர் இறுசொல்லும் ஞ ந ம வ என்னும் புள்ளி இறுதியும் குற்றியலுகரத்து இறுதியும் உள்பட முற்றத் தோன்றா வல்லெழுத்து வரினே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 152: “ஔ என வரூஉம் உயிர் இறுசொல்லும் ஞ ந ம வ என்னும் புள்ளி இறுதியும் குற்றியலுகரத்து இறுதியும் உள்பட முற்றத் தோன்றா வல்லெழுத்து வரினே.” — What does this sutra state?", "இது முன்னிலை வினைக்கண் வாராத ஈறுகளைத் தொகுத்தோதுகிறது. அதாவது, கௌ எனவரும் ஔ ஈற்று முன்னிலை வினைச்சொல்லும், உரிஞ், பொருந், திரும், தெவ் என்ற புள்ளியிறுதி முன்னிலை வினைச்சொற்களும் முற்கூறிய இயல்பு முழுமைபெறத்தோன்றா. மாறியும் வரும். வல்லெழுத்து மிகுதலும் உண்டு என்பதாம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.67, நூ. 152", "", "medium", "false"], ["TOLK-153", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 153: “உயிர்ஈறு ஆகிய உயர்திணைப் பெயரும் புள்ளி இறுதி உயர்திணைப் பெயரும் எல்லா வழியும் இயல்பு என மொழிப.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 153: “உயிர்ஈறு ஆகிய உயர்திணைப் பெயரும் புள்ளி இறுதி உயர்திணைப் பெயரும் எல்லா வழியும் இயல்பு என மொழிப.” — What does this sutra state?", "இஃது உயர்திணைப் பெயர் நாற்கணத்துக்கண்ணும், அல்வழி வேற்றுமை இருவழியும் முடியுமாறு கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.68, நூ. 153", "", "easy", "false"], ["TOLK-154", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 154: “அவற்றுள் இகர ஈற்றுப் பெயர் திரிபுஇடன் உடைத்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 154: “அவற்றுள் இகர ஈற்றுப் பெயர் திரிபுஇடன் உடைத்தே.” — What does this sutra state?", "இஃது உயர்திணைப் பெயர்களுள் சிலவற்றுக்கு எய்தாத விதியினை எய்துவிக்கிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.68, நூ. 154", "", "easy", "false"], ["TOLK-155", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 155: “அஃறிணை விரவுப்பெயர் இயல்புமார் உளவே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 155: “அஃறிணை விரவுப்பெயர் இயல்புமார் உளவே.” — What does this sutra state?", "இது விரவுப்பெயர் முடியுமாறு கூறுகிறது. எ-டு.: சாத்தன் குறியன், சாத்தன் குறிது, சாத்தன் கை சாத்தன், சாத்தி என்பன முறையே எருதினையும் ஆவினையும் உணர்த்துங்கால், அஃறிணைக்கண் ஒருமையினையும், பன்மையினையும் உணர்த்தும் ஈறுகள் அன்றி, ஆண்பாலையும், பெண்பாலையும் உணர்த்தும் ஈறுகள் இன்மையின், உண்டு அஃறிணைப் பெயர்கள் உயர்திணைக்கண் சென்று விரவிற்று எனப்படும். அதனான், இவை போன்றன அஃறிணை விரவுப்பெயர்கள் எனப்படும். இவை அஃறிணையைக் குறித்து வந்தாலும் உயர்திணை போன்றே இயல்பாய் முடியும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.69, நூ. 155", "", "medium", "false"], ["TOLK-156", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 156: “புள்ளி இறுதியும் உயிர்இறு கிளவியும் வல்லெழுத்து மிகுதி சொல்லிய முறையான் தம்மின் ஆகிய தொழிற்சொல் முன்வரின் மெய்ம்மை ஆகலும் உறழத் தோன்றலும் அம்முறை இரண்டும் உரியவை உளவே வேற்றுமை மருங்கிற் போற்றல் வேண்டும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 156: “புள்ளி இறுதியும் உயிர்இறு கிளவியும் வல்லெழுத்து மிகுதி சொல்லிய முறையான் தம்மின் ஆகிய தொழிற்சொல் முன்வரின் மெய்ம்மை ஆகலும் உறழத் தோன்றலும் அம்முறை இரண்டும் உரியவை உளவே வேற்றுமை மருங்கிற் போற்றல் வேண்டும்.” — What does this sutra state?", "இது மூன்றாம் வேற்றுமைத் திரிபினைக் கூறுகிறது. எ-டு.: நாய்கோட்பட்டான், புலிகோட்பட்டான், சாரப்பட்டான், தீண்டப்பட்டான், பாயப்பட்டான் என இவை இயல்பு. சூர்கோட்பட்டான், சூர்க்கோட்பட்டான், வளிகோட்பட்டான், வளிக்கோட்பட்டான் என - இவை உறழ்ச்சி.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.69, நூ. 156", "", "medium", "false"], ["TOLK-158", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 158: “வேற்றுமை அல்வழி இ ஐ என்னும் ஈற்றுப் பெயர்க் கிளவி மூவகை நிலைய அவைதாம் இயல்பு ஆகுநவும், வல்லெழுத்து மிகுநவும் உறழாகுநவும் என்மனார் புலவர்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 158: “வேற்றுமை அல்வழி இ ஐ என்னும் ஈற்றுப் பெயர்க் கிளவி மூவகை நிலைய அவைதாம் இயல்பு ஆகுநவும், வல்லெழுத்து மிகுநவும் உறழாகுநவும் என்மனார் புலவர்.” — What does this sutra state?", "இஃது இகர ஐகாரவீற்று அஃறிணைப் பெயர்களுக்கு அல்வழி முடிபு கூறுகிறது. எ-டு.: பருத்தி குறிது, பருத்தி சிறிது, பருத்தி தீது, பருத்தி பெரிது என்புழி இகர ஈற்றுப்பெயர் எழுவாய்த் தொடர்க்கண் இயல்பாயிற்று. தாமரை குறிது, தாமரை சிறிது, தாமரை தீது, தாமரை பெரிது என்புழி, ஐகார ஈற்றுப்பெயர் எழுவாய்த் தொடர்க்கண் இயல்பாயிற்று. செடிகொடி, தாமரைகுவளை என்புழி இகர, ஐகார ஈற்றுப் பெயர்கள் உம்மைத் தொகைக்கண் இயல்பாயின. மாசித்திங்கள், சித்திரைத்திங்கள் என்புழி இகர, ஐகார ஈற்றுப்பெயர்கள் பண்புத்தொகைக்கண் மிக்கு முடிந்தன. காவிதிக்கண், குவளைக்கண் என்புழி இகர, ஐகார ஈற்றுப்பெயர்கள் உவமைத்தொகைக்கண் மிக்கு முடிந்தன. கிளிகுறிது, தினை குறிது, கிளிக்குறிது, தினைக்குறிது என்புழி இகர, ஐகார ஈற்றுப் பெயர்கள் உறழ்ந்து முடிந்தன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.71, நூ. 158", "", "hard", "false"], ["TOLK-159", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 159: “சுட்டு முதலாகிய இகர இறுதியும் எகர முதல் வினாவின் இகர இறுதியும் சுட்டுச்சினை நீடிய ஒ என் இறுதியும் யாவென் வினாவின் ஒ என் இறுதியும் வல்லெழுத்து மிகுநவும் உறழாகுநவும் சொல்லியல் மருங்கின் உளஎன மொழிப.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 159: “சுட்டு முதலாகிய இகர இறுதியும் எகர முதல் வினாவின் இகர இறுதியும் சுட்டுச்சினை நீடிய ஒ என் இறுதியும் யாவென் வினாவின் ஒ என் இறுதியும் வல்லெழுத்து மிகுநவும் உறழாகுநவும் சொல்லியல் மருங்கின் உளஎன மொழிப.” — What does this sutra state?", "இஃது அவ்விகர ஒகார ஈற்றுள் ஏழாம் வேற்றுமை இடப்பொருளறியநின்ற இடைச்சொல் முடிபு கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.72, நூ. 159", "", "easy", "false"], ["TOLK-160", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 160: “நெடியதன் முன்னர் ஒற்றுமெய் கெடுதலும் குறியதன் முன்னர் தன்னுருபு இரட்டலும் அறியத் தோன்றிய நெறிஇயல் என்ப.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 160: “நெடியதன் முன்னர் ஒற்றுமெய் கெடுதலும் குறியதன் முன்னர் தன்னுருபு இரட்டலும் அறியத் தோன்றிய நெறிஇயல் என்ப.” — What does this sutra state?", "இது புள்ளிமயங்கியலை நோக்கியதோர் நிலைமொழிக் கருவி கூறுகிறது. நெடிலின் முன்னர் நின்ற ஒற்றுக் கெடுதலும், குறிலின் முன்னர் நின்ற ஒற்று இரட்டுதலும் அறியுமாறு முறையாய் வந்த இயல்பின என்பர் தொல்லாசிரியர். எ-டு.: கோல் +தீது ஸ்ரீகோறீது, கோல் +நன்று ஸ்ரீகோனன்று என இவை நெடியதன் முன்னர் ஒற்றுக் கெட்டன. மண்ணகல், பொன்னகல் என இவை குறியதன் முன்னர்த் தன்னுருபு இரட்டின.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.72, நூ. 160", "", "medium", "false"], ["TOLK-161", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 161: “ஆறன் உருபினும் நான்கன் உருபினும் கூறிய குற்றொற்று இரட்டல் இல்லை ஈறுஆகு புள்ளி அகரமொடு நிலையும் நெடுமுதல் குறுகும் மொழிமுன் ஆன.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 161: “ஆறன் உருபினும் நான்கன் உருபினும் கூறிய குற்றொற்று இரட்டல் இல்லை ஈறுஆகு புள்ளி அகரமொடு நிலையும் நெடுமுதல் குறுகும் மொழிமுன் ஆன.” — What does this sutra state?", "இஃது உருபியலை நோக்கிய நிலைமொழி பற்றிய விதியினைக் கூறுகிறது. எ-டு.: தம்+அதுஸ்ரீதமது; தன்+குஸ்ரீதமக்கு எனவரும். தம் என்பது தம என்று நிற்கும். இங்கு தாம் என்ற நெடில் தம் என்று வந்துள்ளமை காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.73, நூ. 161", "", "easy", "false"], ["TOLK-162", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 162: “நும் என்னும் இறுதியும் அந்நிலை திரியாது.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 162: “நும் என்னும் இறுதியும் அந்நிலை திரியாது.” — What does this sutra state?", "இது நீயிர் என்பதன் வேற்றுமை வடிவாய நும் என்பதும் அவ்விதியினைப் பெறும் என்று கூறுகிறது. நும் என்ற சொல்லும் ஒற்று இரட்டாது. அகரம் பெறும். எ-டு.: நுமது, நுமக்கு எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.73, நூ. 162", "", "easy", "false"], ["TOLK-163", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 163: “உகரமொடு புணரும் புள்ளி இறுதி யகரமும் உயிரும் வருவழி இயற்கை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 163: “உகரமொடு புணரும் புள்ளி இறுதி யகரமும் உயிரும் வருவழி இயற்கை.” — What does this sutra state?", "இது புள்ளிமயங்கியலை நோக்கி நிலைமொழிச் செய்கை கூறுகிறது. உகரப்பேற்றோடு முடியும் உரிஞ், பொருந் போன்ற புள்ளி ஈறுகள், யகரமும் உயிரும் வருமொழியாய் வருங்கால், அவ்வுகரம் பெறாது இயல்பாய் முடியும். எ-டு.: உரிஞ்யானா, உரிஞ் அனந்தா, பொருந்யானா, பொருந்அனந்தா, உறிஞ்ஆதா, பொருந்ஆதா என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.73, நூ. 163", "", "medium", "false"], ["TOLK-164", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 164: “உயிரும் நிறையும் இறுதி ஆகி அளவும் நிறையும் எண்ணும் சுட்டி உள எனப்பட்ட எல்லாச் சொல்லும் தத்தம் கிளவி தம்மகப்பட்ட முத்தை வரூஉம் காலம் தோன்றின் ஒத்த தென்ப ஏ என் சாரியை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 164: “உயிரும் நிறையும் இறுதி ஆகி அளவும் நிறையும் எண்ணும் சுட்டி உள எனப்பட்ட எல்லாச் சொல்லும் தத்தம் கிளவி தம்மகப்பட்ட முத்தை வரூஉம் காலம் தோன்றின் ஒத்த தென்ப ஏ என் சாரியை.” — What does this sutra state?", "இஃது அளவுப்பெயரும், எண்ணுப்பெயரும் தம்மிற் புணருமாறு கூறுகிறது. அதாவது, அளத்தல், நிறுத்தல், எண்ணுதல் ஆகிய அளவு நிறை எண்ணுப்பெயர்கள் உயிர் இறுதி ஆனாலும் புள்ளி இறுதியானாலும் தமக்குக் கீழளவைகள் வரும்போது ஏ என்ற சாரியை பெற்றுவரும் என்பதாம். எ-டு.: உழக்கே யாழாக்கு, கலனே பதக்கு- அளவுப்பெயர்கள் ஏகாரச் சாரியை பெற்றன. தொடியே கஅசு, கொள்ளே ஐயவி - நிறைப்பெயர்கள் ஏகாரச் சாரியை பெற்றன. ஒன்றேகால், காணியே முந்திரிகை, காலே காணி-எண்ணுப்பெயர்கள் ஏகாரச் சாரியை பெற்றன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.74, நூ. 164", "", "medium", "false"], ["TOLK-165", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 165: “அரைஎன வரூஉம் பால்வரை கிளவிக்குப் புரைவது அன்றால் சாரியை இயற்கை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 165: “அரைஎன வரூஉம் பால்வரை கிளவிக்குப் புரைவது அன்றால் சாரியை இயற்கை.” — What does this sutra state?", "இஃது எய்திய விதியினை விலக்குகிறது. எ-டு.: உழக்கரை, தொடியரை, ஒன்றரை என்பதில் ஏ சாரியை பொருந்தாது நிற்றல் காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.74, நூ. 165", "", "easy", "false"], ["TOLK-166", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 166: “குறை என் கிளவி முன்வருகாலை நிறையத் தோன்றும் வேற்றுமை இயற்கை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 166: “குறை என் கிளவி முன்வருகாலை நிறையத் தோன்றும் வேற்றுமை இயற்கை.” — What does this sutra state?", "இது எய்திய விதியை விலக்கிப் பிறிது விதி கூறுகிறது. எ-டு.: உரிக்குறை, தூணிக்குறை - அளவுப்பெயர்கள் முன் வேற்றுமைப் பொருட்புணர்ச்சி முடிபு பெற்றது. தொடிக்குறை, கொட்குறை - நிறைப்பெயர்கள் முன், வேற்றுமைப் பொருட்புணர்ச்சி முடிபு பெற்றது. காணிக்குறை, காற்குறை - எண்ணுப்பெயர்கள் முன் வேற்றுமைப் பொருட்புணர்ச்சி முடிபு பெற்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.75, நூ. 166", "", "medium", "false"], ["TOLK-167", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 167: “குற்றியலுகரக்கு இன்னே சாரியை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 167: “குற்றியலுகரக்கு இன்னே சாரியை.” — What does this sutra state?", "இது குற்றியலுகர ஈற்று அளவு, நிறை, எண்ணுப்பெயர்களுக்குக் குறை வருங்கால் எய்திய விதியினை விலக்கிப் பிறிது விதி வகுக்கிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.75, நூ. 167", "", "easy", "false"], ["TOLK-168", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 168: “அத்து இடை வரூஉம் கலம் என் அளவே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 168: “அத்து இடை வரூஉம் கலம் என் அளவே.” — What does this sutra state?", "இஃது அளவுப்பெயர்களுள் கலம் என்பதற்கு எய்தியது விலக்கிப் பிறிது விதி கூறுகிறது. எ-டு.: கலத்துக்குறை.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.75, நூ. 168", "", "easy", "false"], ["TOLK-169", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 169: “பனை என் அளவும் காவென் நிறையும் நினையுங்காலை இன்னொடு சிவணும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 169: “பனை என் அளவும் காவென் நிறையும் நினையுங்காலை இன்னொடு சிவணும்.” — What does this sutra state?", "இது பனை எனும் அளவுப்பெயர்க்கும், கா எனும் நிறைப்பெயர்க்கும் குறை வருங்கால் எய்தியது விலக்கிப் பிறிது விதி கூறுகிறது. எ-டு.: பனையின் குறை, காவின் குறை எனவரும். அளவுப்பெயர், நிறைப்பெயர்களின் மொழிமுதல் எழுத்துக்கள் அளவுப்பெயர்க்கும் நிறைப்பெயர்க்கும் மொழிமுதலாகி வருவன ஒன்பது எழுத்துக்கள் ஆகும். அவை கசதப எனும் நான்கு வல்லினமும், நம என்னும் இரண்டு மெல்லினமும், வகரமாகிய ஓர் இடையினமும், அகர உகரங்களாகிய இரண்டு உயிரினமும் ஆகும் என்பர் தொல்லாசிரியர்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.76, நூ. 169", "", "medium", "false"], ["TOLK-170", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 170: “அளவிற்கும் நிறையிற்கும் மொழிமுதல் ஆகி உள எனப்பட்ட ஒன்பதிற்று எழுத்தே அவைதாம் க ச த ப என்றா ந ம வ என்றா அகர உகரமொடு அவைஎன மொழிப.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 170: “அளவிற்கும் நிறையிற்கும் மொழிமுதல் ஆகி உள எனப்பட்ட ஒன்பதிற்று எழுத்தே அவைதாம் க ச த ப என்றா ந ம வ என்றா அகர உகரமொடு அவைஎன மொழிப.” — What does this sutra state?", "இஃது அளவுப்பெயர்க்கும் நிறைப்பெயர்க்கும் முதலாகும் எழுத்துக்களை வரையறுக்கின்றது. எ-டு.: கலம், சாடி, தூதை, பானை - கசதபக்கள் முதலாயின. நாழி, மண்டை - நமக்கள் முதலியன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.76, நூ. 170", "", "easy", "false"], ["TOLK-173", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 173: “அ ஆ உ ஊ ஏ ஔ என்னும் அப்பால் ஆறன் நிலைமொழி முன்னர் வேற்றுமை உருபிற்கு இன்னே சாரியை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 173: “அ ஆ உ ஊ ஏ ஔ என்னும் அப்பால் ஆறன் நிலைமொழி முன்னர் வேற்றுமை உருபிற்கு இன்னே சாரியை.” — What does this sutra state?", "இஃது அகர, ஆகார, உகர, ஊகார, ஏகார, ஔகார ஈற்றுப் பெயர்களோடு உருபு புணருமாறு கூறுகிறது. அஃதாவது அ, ஆ, உ, ஊ, ஏ, ஔ என்னும் ஆறு எழுத்துக்களையும் ஈறாக உடைய நிலைமொழிகளின் முன்னர் வேற்றுமை உருபுகள் வரும்போது இடையில் இன் சாரியை நிற்கும் என்பதாம். எ-டு.: விளூஇன்ஸ்ரீஐ→விளவினை, விளவினொடு, விளவிற்கு, விளவினது, விளவின்கண் - என்பதில் அகர ஈற்றுப் பெயரோடு உருபு புணருங்கால் இன் சாரியை பெற்று நின்றுள்ளமை காண்க. பலா+இன்ஸ்ரீஐ→பலாவினை பலாவினொடு, பலாவிற்கு, பலாவினது, - பலாவின்கண் என்பதில் ஆகார ஈற்றுப்பெயரோடு உருபு புணருங்கால் இன் சாரியை பெற்று நின்றுள்ளமை காண்க. கடூஇன்ஸ்ரீஐ→கடுவினை கடுவினை, கடுவினொடு, கடுவிற்கு, கடுவினது, கடுவின்கண்... - என்பதில் ஈகார ஈற்றுப் பெயரோடு உருபு புணருங்கால் இன் சாரியை பெற்று நின்றுள்ளமை காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.79, நூ. 173", "", "hard", "false"], ["TOLK-174", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 174: “பல்லவை நுதலிய அகர இறுபெயர் வற்றொடு சிவணல் எச்சம் இன்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 174: “பல்லவை நுதலிய அகர இறுபெயர் வற்றொடு சிவணல் எச்சம் இன்றே.” — What does this sutra state?", "இது மேற்கூறிய ஈறுகளுள் பலவற்றுக்கு பலவற்றுக்கு எய்திய விதியினை விலக்கிப் பிறிது விதி கூறுகிறது. பல, பல்ல என்னும் அகர ஈற்றுப் பெயர்கள் உருபேற்கும்போது வற்றுச் சாரியை பெற்று நிற்கும். எ-டு.: பல்லூவற்றுஸ்ரீஐ→பல்லவற்றை, பல்லவற்றோடு, பல்லவற்றுக்கு, பல்லவற்றின், பல்லவற்றது, பல்லவற்றுக்கண்... - என்பதில் பல்ல என்னும் அகர ஈற்றுப் பெயரொடு உருபு புணருங்கால் வற்றுப் பெற்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.80, நூ. 174", "", "medium", "false"], ["TOLK-175", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 175: “யா என் வினாவும் ஆயியல் திரியாது.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 175: “யா என் வினாவும் ஆயியல் திரியாது.” — What does this sutra state?", "இது ஆகார ஈற்றுள் ஒன்றனுக்கு எய்தியது விலக்கிப் பிறிது விதி வகுக்கின்றது. யா என்னும் ஆகார ஈற்று வினாப்பெயரும் முன்னர்க் கூறியதைப் போன்றே வற்றுச் சாரியை பெற்று வரும். எ-டு.: யாவற்றை, யாவற்றோடு, யாவற்றுக்கு, யாவற்றின், யாவற்றது, யாவற்றுக்கண்... - என்பதில் யா என்னும் ஆகர ஈற்றுப் பெயரொடு உருபு புணருங்கால் வற்றுப் பெற்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.80, நூ. 175", "", "medium", "false"], ["TOLK-176", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 176: “சுட்டு முதல் உகரம் அன்னொடு சிவணி ஒட்டிய மெய் ஒழித்து உகரம் கெடுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 176: “சுட்டு முதல் உகரம் அன்னொடு சிவணி ஒட்டிய மெய் ஒழித்து உகரம் கெடுமே.” — What does this sutra state?", "இது உகர ஈற்றுள் ஒன்றனுக்கு எய்திய விதி விலக்கிப் பிறிது விதி வகுக்கின்றது. சுட்டு முதல் உகரமாகிய அது, இது, உது என்பன உருபேற்கும்போது அன் சாரியை பெற்று வரும். தான் பொருந்திய மெய்யெழுத்தை நிறுத்தி உகரம் கெடும். எ-டு.: அதனை, அதனொடு, அதற்கு, அதனின், அதனது, அதன்கண்", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.81, நூ. 176", "", "medium", "false"], ["TOLK-177", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 177: “சுட்டு முதல் ஆகிய ஐ என் இறுதி வற்றொடு சிவணி நிற்றலும் உரித்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 177: “சுட்டு முதல் ஆகிய ஐ என் இறுதி வற்றொடு சிவணி நிற்றலும் உரித்தே.” — What does this sutra state?", "இது சுட்டுமுதல் ஐகார ஈறு உருபொடு புணருமாறு கூறுகிறது. சுட்டெழுத்தை முதலாக வரும் எழுத்தின் ஈற்றிலுள்ள ஐயெனும் இறுதி வற்றுச் சாரியை பெறும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.81, நூ. 177", "", "easy", "false"], ["TOLK-178", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 178: “யா என் வினாவின் ஐ என்இறுதியும் ஆயியல் திரியாது என்மனார் புலவர் ஆவயின் வகரம் இசையொடும் கெடுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 178: “யா என் வினாவின் ஐ என்இறுதியும் ஆயியல் திரியாது என்மனார் புலவர் ஆவயின் வகரம் இசையொடும் கெடுமே.” — What does this sutra state?", "இஃது வினா முதலாய ஐகார ஈற்றுச்சொல் உருபொடு புணருமாறு கூறுகிறது. யாவை என்னும் வினாவின் இறுதியில் அமையும் ஐ என்னும் சொல் முற்கூறிய சுட்டு முதல் ஐகாரம் போன்றே வற்றுச் சாரியை பெறும். அப்போது வகரம் ஐயொடும் கெட்டு நிற்கும். எ-டு.: யா+வற்றுஸ்ரீஐ→யாவற்றை, யாவற்றொடு.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.82, நூ. 178", "", "medium", "false"], ["TOLK-179", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 179: “நீஎன்ஒருபெயர் நெடுமுதல் குறுகும் ஆவயின் னகரம் ஒற்று ஆகும்மே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 179: “நீஎன்ஒருபெயர் நெடுமுதல் குறுகும் ஆவயின் னகரம் ஒற்று ஆகும்மே.” — What does this sutra state?", "இஃது ஈகார ஈற்றுச் சொற்களுள் ஒன்றனொடு உருபு புணருமாறு கூறுகிறது. எ-டு.: நின்னை, நின்னொடு, நினக்கு, நின்னின், நினது...எனவரும். நின்னைஸ்ரீநீ+ஐ.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.82, நூ. 179", "", "easy", "false"], ["TOLK-180", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 180: “ஓகார இறுதிக்கு ஒன்னே சாரியை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 180: “ஓகார இறுதிக்கு ஒன்னே சாரியை.” — What does this sutra state?", "இஃது ஓகார ஈற்றுச் சொல்லோடு உருபு புணருமாறு கூறுகிறது. எ-டு.: கோஒனை, கொஒனோடு, கோனொற்கு, கோஒனின், கோஒனது, கோஒன்கண், என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.82, நூ. 180", "", "easy", "false"], ["TOLK-181", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 181: “அஆ என்னும் மரப்பெயர்க் கிளவிக்கு அத்தொடும் சிவணும் ஏழன் உருபே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 181: “அஆ என்னும் மரப்பெயர்க் கிளவிக்கு அத்தொடும் சிவணும் ஏழன் உருபே.” — What does this sutra state?", "இந்நூற்பா, அகர ஆகார ஈற்று மரப்பெயர்களுக்கு எய்தியதன்மேல் சிறப்புவிதி கூறுகிறது. அ, ஆ என்னும் இறுதிகளை உடைய மரப்பெயர்க் கிளவிகள் ஏழாம் உருபினை ஏற்கும்போது அத்துச்சாரியை பெற்று நிற்கும். எ-டு.: விளவத்துக்கண், பலாவத்துக்கண் எனவரும். விளூவ்+அத்தூகண் எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.83, நூ. 181", "", "medium", "false"], ["TOLK-182", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 182: “ஞந என் புள்ளிக்கு இன்னே சாரியை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 182: “ஞந என் புள்ளிக்கு இன்னே சாரியை.” — What does this sutra state?", "இது ஞகர, நகர ஈற்றுப் பெயர்களோடு உருபு புணருமாறு கூறுகிறது. எ-டு.: உரிஞினை, உரிஞினொடு. பொருநினை. பொருனொடு எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.83, நூ. 182", "", "easy", "false"], ["TOLK-183", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 183: “சுட்டு முதல் வகரம் ஐயும் மெய்யும் கெட்ட இறுதி இயல் திரிபு இன்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 183: “சுட்டு முதல் வகரம் ஐயும் மெய்யும் கெட்ட இறுதி இயல் திரிபு இன்றே.” — What does this sutra state?", "சுட்டெழுத்தினை முதலாக உடைய அவ், இவ், உவ் என்னும் வகர ஈற்றுச்சொல் ஐகாரமும், அதனால் பற்றப்பட்ட மெய்யும் கெட்டு வற்றுச்சாரியை பெற்று முடிந்த சுட்டு முதல் ஐகார ஈற்றினைப் போன்று வற்றுச்சாரியை பெற்று முடியும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.83, நூ. 183", "", "medium", "false"], ["TOLK-184", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 184: “ஏனை வகரம் இன்னொடு சிவணும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 184: “ஏனை வகரம் இன்னொடு சிவணும்.” — What does this sutra state?", "இது சுட்டுமுதல் வகர ஈற்றுப்பெயர் மூன்றனொடு உருபு புணருமாறு கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.84, நூ. 184", "", "easy", "false"], ["TOLK-186", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 186: “இன்இடை வரூஉம் மொழியுமார் உளவே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 186: “இன்இடை வரூஉம் மொழியுமார் உளவே.” — What does this sutra state?", "இது மகர ஈற்றுப்பெயர்கள் சிலவற்றுக்கு எய்திய விதி விலக்கிப் பிறிது விதி கூறுகிறது. எ-டு.: உருமினை, உருமினொடு உருமிற்கு, உருமினது, உருமின்கண்...எனவரும். உருமினைஸ்ரீஉரும்+இன்+ஐ எனவரும். (உரும்-இடி.)", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.84, நூ. 186", "", "easy", "false"], ["TOLK-187", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 187: “நும் என் இறுதி இயற்கை ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 187: “நும் என் இறுதி இயற்கை ஆகும்.” — What does this sutra state?", "இது மகர ஈற்றுப்பெயர்களுள் ஒன்றனுக்கு எய்திய விதி விலக்கிப் பிறிது விதி கூறுகிறது. எ-டு.: நும்மை, நும்மொடு, நுமக்கு, நும்மின், நுந்து, நுங்கண் எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.85, நூ. 187", "", "easy", "false"], ["TOLK-188", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 188: “தாம் நாம் என்னும் மகர இறுதியும் யாம் என் இறுதியும் அதன் ஓரன்ன ஆஎ ஆகும் யாம் என் இறுதி ஆவயின் யகர மெய் கெடுதல் வேண்டும் ஏனை இரண்டும் நெடுமுதல் குறுகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 188: “தாம் நாம் என்னும் மகர இறுதியும் யாம் என் இறுதியும் அதன் ஓரன்ன ஆஎ ஆகும் யாம் என் இறுதி ஆவயின் யகர மெய் கெடுதல் வேண்டும் ஏனை இரண்டும் நெடுமுதல் குறுகும்.” — What does this sutra state?", "இது நெடுமுதல் குறுகும் மகர ஈற்றுப்பெயர்கள் மூன்றனை முன் நூற்பாவோடு மாட்டேற்றி, அவற்றுள் ஒன்றனுக்கு மேலும் சிறப்புவிதி கூறுகிறது. தாம், நாம் என்னும் மகர ஈறும், யாம் என்னும் மகர ஈறுகளும் நும்மென்னும் மகர ஈறு போல அத்தும் இன்னும் பெறாது முடியும். யாம் என்னும் மகர ஈற்றுச் சொல்லில் உள்ள ஆகாரம், ஏகாரமாகும். அவ்விடத்தில் யகரமாகிய மெய் கெடுதல் வேண்டும். ஏனைய தாம், நாம் என்னும் இரண்டும் நெடுமுதல் குறுகித் தம், நம் என வரும். எ-டு.: தம்மைஸ்ரீதாம்+ஐ - தம்மை, தம்மொடு, தமக்கு, தம்மின், தமது, தங்கண் நம்மை, நம்மொடு, நமக்கு, நம்மின், நமது, நங்கண் எம்மை, எம்மொடு, எமக்கு, எம்மின், எமது, எங்கண் எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.85, நூ. 188", "", "medium", "false"], ["TOLK-189", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 189: “எல்லாம் என்னும் இறுதி முன்னர் வற்று என் சாரியை முற்றத் தோன்றும் உம்மை நிலையும் இறுதியான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 189: “எல்லாம் என்னும் இறுதி முன்னர் வற்று என் சாரியை முற்றத் தோன்றும் உம்மை நிலையும் இறுதியான.” — What does this sutra state?", "மகர ஈற்று விரவுப்பெயர் ஒன்றனுக்கு எய்தியது விலக்கிப் பிறிது விதி கூறுகிறது. எ-டு.: எல்லாம்+வற்றூஉம்→எல்லாவற்றையும், எல்லாவற்றொடும் எல்லாவற்றுக்கும், எல்லாவற்றதும் எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.85, நூ. 189", "", "easy", "false"], ["TOLK-190", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 190: “உயர்திணை ஆயின் நம்இடை வருமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 190: “உயர்திணை ஆயின் நம்இடை வருமே.” — What does this sutra state?", "எ-டு.: எல்லா நம்மையும், எல்லா நம்மொடும், எல்லாநமக்கும், எல்லாநம்மினும்,", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.86, நூ. 190", "", "easy", "false"], ["TOLK-192", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 192: “தான், யான் என்னும் ஆயீர் இறுதியும் மேல்முப் பெயரொடும் வேறுபாடு இலவே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 192: “தான், யான் என்னும் ஆயீர் இறுதியும் மேல்முப் பெயரொடும் வேறுபாடு இலவே.” — What does this sutra state?", "இது சில னகர ஈற்றுப் பெயர்களுக்கு முடிபு கூறுகிறது. எ-டு.: தன்னை, தன்னொடு, தனக்கு, தன்னின், தனது, தன்கண். என்னை, என்னொடு, எனக்கு, என்னின், எனது, என்கண் தான்+ஐஸ்ரீதன்னை; யான்+ஐஸ்ரீஎன்னை.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.87, நூ. 192", "", "easy", "false"], ["TOLK-193", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 193: “அத்தும் இன்னும் உறழத் தோன்றல் ஒத்தது என்ப உணரு மோரே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 193: “அத்தும் இன்னும் உறழத் தோன்றல் ஒத்தது என்ப உணரு மோரே.” — What does this sutra state?", "அழன், புழன் ஆகிய இரு சொற்களும் அத்துச்சாரியையும், இன் சாரியையும் மாறிப்பெற்று வருதல் இயல்பாகும். எ-டு.: அழத்தை, அழத்தொடு, அழத்துக்கு, அழத்தது, அழத்துக்கண்", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.87, நூ. 193", "", "easy", "false"], ["TOLK-194", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 194: “அன்என் சாரியை ஏழன் இறுதி முன்னர்த் தோன்றும் இயற்கைத்து என்ப.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 194: “அன்என் சாரியை ஏழன் இறுதி முன்னர்த் தோன்றும் இயற்கைத்து என்ப.” — What does this sutra state?", "இது ழகார ஈற்று மொழி ஒன்றனொடு உருபு புணருமாறு கூறுகிறது. எ-டு.: ஏழனை, ஏழனொடு, ஏழற்கு, ஏழனின், ஏழனது, ஏழன்கண் ஏழனைஸ்ரீஏழ்+அன்+ஐ எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.88, நூ. 194", "", "easy", "false"], ["TOLK-195", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 195: “குற்றியலுகரத்து இறுதி முன்னர் முற்றத் தோன்றும் இன்என் சாரியை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 195: “குற்றியலுகரத்து இறுதி முன்னர் முற்றத் தோன்றும் இன்என் சாரியை.” — What does this sutra state?", "இது குற்றியலுகர ஈற்றுப்பெயரோடு உருபு புணருமாறு கூறுகிறது. எ-டு.: நாகூஇன்+ஐ→நாகினை, நாகினொடு, நாகிற்கு, நாகினது, நாகின்கண் வரகினை, வரகினொடு, வரகிற்கு, வரகினது, வரகின்கண் கொக்கினை, கொக்கினொடு, கொக்கிற்கு, கொக்கினது, கொக்கின்கண் குரங்கினை, குரங்கினொடு, குரங்கிற்கு, குரங்கினது, குரங்கின்கண், மார்பினை, மார்பினொடு, மார்பிற்கு, மார்பினது, மார்பின்கண், எஃகினை, எஃகினொடு, எஃகிற்கு, எஃகினது, எஃகின்கண் என வருதல் காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.88, நூ. 195", "", "medium", "false"], ["TOLK-196", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 196: “நெட்டெழுத்து இம்பர் ஒற்று மிகத்தோன்றும் அப்பால் மொழிகள் அல்வழியான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 196: “நெட்டெழுத்து இம்பர் ஒற்று மிகத்தோன்றும் அப்பால் மொழிகள் அல்வழியான.” — What does this sutra state?", "இது சில ஈறுகளுக்கு ஒற்று இரட்டுதலைக் கூறுகிறது. எ-டு.: யாடூஐ→யாட்டை, யாட்டொடு, யாட்டுக்கு, யாட்டின், யாட்டினது, யாட்டுக்கண், யாற்றை, யாற்றொடு, யாற்றுக்கு, யாற்றின், யாற்றது,", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.88, நூ. 196", "", "easy", "false"], ["TOLK-197", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 197: “அவைதாம் இயற்கைய ஆகும் செயற்கைய என்ப.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 197: “அவைதாம் இயற்கைய ஆகும் செயற்கைய என்ப.” — What does this sutra state?", "இது இரட்டியமொழிகள் சாரியை பெறாது என்று கூறுகிறது. இன ஒற்று இரட்டித்து நிற்பது இன் சாரியை பெறாது இயல்பாய் முடியும். எ-டு.: யாடூஇன்+ஐ→யாட்டினை, யாட்டினொடு, முயிற்றினை, முயிற்றினொடு எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.89, நூ. 197", "", "easy", "false"], ["TOLK-198", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 198: “எண்ணின் இறுதி அன்னொடு சிவணும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 198: “எண்ணின் இறுதி அன்னொடு சிவணும்.” — What does this sutra state?", "இது குற்றுகர ஈற்று எண்ணுப்பெயர்களோடு உருபு புணருமாறு கூறுகிறது. எ-டு.: ஒன்றனை, ஒன்றனொடு, இரண்டனை, இரண்டனொடு எனவரும். ஒன்று முதல் பத்து வரையுள்ள சொற்கள் ஆன் சாரியை பெறுதல் பத்தனொடு சேர்ந்து வரும் ஒன்று முதலாய் எட்டு ஈறாய் உள்ள எல்லா பெயர்களுக்கும் முடிபு கூறுங்கால், அன் சாரியையே அன்றி ஆன் சாரியை இடைவரினும் குற்றமில்லை. அவ்வாறு ஆன் சாரியை பெற்றவழி அஃது என்னும் சொல்கெட, அஃதூர்ந்த பகர மெய் கெடாது நிற்கும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.89, நூ. 198", "", "medium", "false"], ["TOLK-199", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 199: “ஒன்று முதல் ஆகப் பத்து ஊர்ந்து வரூஉம் எல்லா எண்ணும் சொல்லும் காலை ஆன்இடை வரினும் மானம் இல்லை அ‡து என் கிளவி ஆவயின் கெடுமே உய்தல் வேண்டும் பஃகான் மெய்யே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 199: “ஒன்று முதல் ஆகப் பத்து ஊர்ந்து வரூஉம் எல்லா எண்ணும் சொல்லும் காலை ஆன்இடை வரினும் மானம் இல்லை அ‡து என் கிளவி ஆவயின் கெடுமே உய்தல் வேண்டும் பஃகான் மெய்யே.” — What does this sutra state?", "இந்நூற்பா, பத்தனொடு சேர்ந்துவரும் ஒன்று முதலாய எட்டு ஈறாய எல்லா எண்ணுப் பெயரொடும் உருபு புணருமாறு கூறுகிறது. ஒன்று முதலாகப் பத்து ஊர்ந்து வரும் ஒருபஃது முதலாகிய எல்லா எண்களுக்கும் முடிவு சொல்லும்போது அன் சாரியை இல்லாது, ஆன் சாரியை வந்தாலும் குற்றமில்லை. ஆன் சாரியை வந்தால் பஃது என்னும் எண்ணில் உள்ள அஃது என்னும் சொல் கெட்டுப் போகும். அவ் அகரத்தால் ஊரப்பட்ட மெய் கெடாது நிற்றல் வேண்டும். எ-டு.: ஒருபானை, ஒருபானொடு, ஒருபாற்கு, ஒருபானின், ஒருபானது, ஒருபான்கண், ஒருபஃதனை, ஒருபஃதனொடு, ஒருபஃதற்கு, ஒருபஃதனின், ஒருபஃதனின், ஒருபஃதனது, ஒருபஃதன்கண்", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.89, நூ. 199", "", "medium", "false"], ["TOLK-200", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 200: “யாது என் இறுதியும் சுட்டு முதல் ஆகிய ஆய்த இறுதியும் அன்னொடு சிவணும் ஆய்தம் கெடுதல் ஆவயினான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 200: “யாது என் இறுதியும் சுட்டு முதல் ஆகிய ஆய்த இறுதியும் அன்னொடு சிவணும் ஆய்தம் கெடுதல் ஆவயினான.” — What does this sutra state?", "இது குற்றுகர ஈற்றுவினா, ஆய்தச் சுட்டுப்பெயர்களோடு உருபு புணருமாறு கூறுகிறது. அஃதாவது, யாது என வரும் குற்றுகர ஈறும், சுட்டெழுத்தினை முதலாக உடைய ஆய்தத் தொடர்மொழிக் குற்றுகர ஈறும் அன் சாரியை பெறும். அவ்விடத்தில் ஆய்தம் கெட்டொழியும் என்பதாம். எ-டு.: யாதனை, யாதனொடு, யாதற்கு, யாதனின், யாதனது, யாதன்கண் அதனைஸ்ரீஅஃதூஅன்+ஐ அதனை, அதனொடு, அதற்கு, அதனின், அதனது,", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.90, நூ. 200", "", "medium", "false"], ["TOLK-201", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 201: “ஏழன் உருபிற்கு திசைப்பெயர் முன்னர் சாரியைக் கிளவி இயற்கையும் ஆகும் ஆவயின் இறுதி மெய்யொடும் கெடுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 201: “ஏழன் உருபிற்கு திசைப்பெயர் முன்னர் சாரியைக் கிளவி இயற்கையும் ஆகும் ஆவயின் இறுதி மெய்யொடும் கெடுமே.” — What does this sutra state?", "இது குற்றுகர ஈற்றுத் திசைப்பெயர்களோடு ஏழன் உருபு புணருமாறு கூறுகிறது. அஃதாவது, திசைப்பெயர்களின் முன்னர் வந்த கண் எனும் ஏழன் உருபிற்கு முடிபு கூறும்போது மேற்குறித்த இன் சாரியையாகிய சொல் நின்று முடிதலே அன்றி, இயல்பாகவும் முடியும். அப்போது திசைப்பெயரின் இறுதிக் குற்றுகரம் தன்னால் இயையப்பெற்ற மெய்யொடும் கெடும் என்பதாம். எ-டு.: வடக்கின்கண், தெற்கின்கண், கிழக்கின்கண், மேற்கின்கண், குடக்கின்கண், குணக்கின்கண் - என்பதில்இன் சாரியை பெற்று முடிந்தன. வடக்கண், தெற்கண், கிழக்கண், மேற்கண், குடக்கண், குணக்கண் - என்பதில் சாரியை பெறாமலும் இறுதிக்குற்றியலுகரம் மெய்யொடும் கெட்டது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.90, நூ. 201", "", "medium", "false"], ["TOLK-202", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 202: “புள்ளி யிறுதியும் உயிரிறு கிளவியும் சொல்லிய அல்ல ஏனைய வெல்லாம் தேருங்காலை உருபொடு சிவணிச் சாரியை நிலையுங் கடப்பா டிலவே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 202: “புள்ளி யிறுதியும் உயிரிறு கிளவியும் சொல்லிய அல்ல ஏனைய வெல்லாம் தேருங்காலை உருபொடு சிவணிச் சாரியை நிலையுங் கடப்பா டிலவே.” — What does this sutra state?", "இந்நூற்பா இவ்வியலில் முடியாது நின்றவற்றிற்கு விதி கூறுகிறது. அதாவது, இலக்கணம் கூறப்பெறாத புள்ளி ஈறுகளாய ண, ய, ர, ல, ள வும் உயிரீறாகிய இ யும் உருபுகள் ஏற்கும்போது சாரியை பெற்று வர வேண்டும் என்ற கடப்பாடுடையன அல்ல. பெற்றும் பெறாதும் வரும் என்பதாம். எ-டு.: மண்ணினை, மண்ணை, வேயினை, வேயை, நாரினை நாரை ; கல்லினை, கல்லை,; முள்ளினை, முள்ளை எனவும், தாழினை, தாழை எனவும், பொன்னினை, பொன்னை எனவும், தாழினை, தாழை, தீயினை, தீயை, கழையினை, கழையை என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.91, நூ. 202", "", "medium", "false"], ["TOLK-203", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 203: “அகர இறுதிப் பெயர்நிலை முன்னர் வேற்றுமை அல்வழி க ச த ப தோன்றின் தம்தம் ஒத்த ஒற்றுஇடை மிகுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 203: “அகர இறுதிப் பெயர்நிலை முன்னர் வேற்றுமை அல்வழி க ச த ப தோன்றின் தம்தம் ஒத்த ஒற்றுஇடை மிகுமே.” — What does this sutra state?", "இந்நூற்பா அகரஈற்றுப்பெயர் அல்வழிக்கண், வன்கணத்தோடு புணருமாற்றைக் கூறுகிறது. எ-டு.: விளக்குறிது, விளச்சிறிது, விளப்பெரிது, விளத்தீது - இவற்றில் அகர ஈற்றுப்பெயர் அல்வழிக்கண் வல்லெழுத்து மிக்கு முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.94, நூ. 203", "", "medium", "false"], ["TOLK-204", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 204: “வினைஎஞ்சு கிளவியும் உவமக் கிளவியும் என என்எச்சமும் சுட்டின் இறுதியும் ஆங்க என்னும் உரையசைக் கிளவியும் ஞாங்கர்க் கிளந்த வல்லெழுத்து மிகுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 204: “வினைஎஞ்சு கிளவியும் உவமக் கிளவியும் என என்எச்சமும் சுட்டின் இறுதியும் ஆங்க என்னும் உரையசைக் கிளவியும் ஞாங்கர்க் கிளந்த வல்லெழுத்து மிகுமே.” — What does this sutra state?", "இது அகர ஈற்று வினையெச்சமும், நான்கு சொற்களும் புணருமாறு கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.95, நூ. 204", "", "easy", "false"], ["TOLK-205", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 205: “சுட்டின்முன்னர் ஞ ந மத் தோன்றின் ஒட்டிய ஒற்று இடைமிகுதல் வேண்டும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 205: “சுட்டின்முன்னர் ஞ ந மத் தோன்றின் ஒட்டிய ஒற்று இடைமிகுதல் வேண்டும்.” — What does this sutra state?", "எ-டு.: அஞ்ஞாலம்;, அந்நூல், அம்மணி -அகரச்சுட்டு மெல்லெழுத்து மிக்கு முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.95, நூ. 205", "", "easy", "false"], ["TOLK-206", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 206: “யவ முன்வரினே வகரம் ஒற்றும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 206: “யவ முன்வரினே வகரம் ஒற்றும்.” — What does this sutra state?", "இஃது அகரச்சுட்டு இடையெழுத்தோடு புணருமாற்றைக் கூறுகிறது. இது அல்வழி முடிபு.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.96, நூ. 206", "", "easy", "false"], ["TOLK-207", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 207: “உயிர்முன் வரினும் ஆயியல் திரியாது.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 207: “உயிர்முன் வரினும் ஆயியல் திரியாது.” — What does this sutra state?", "இது அகரச்சுட்டு உயிரோடு புணருமாறு கூறுகிறது. இது அல்வழி முடிபு. எ-டு.: அவ்வடை, அவ்வாடை, அவ்விலை, அவ்வீ, அவ்வுரல், அவ்வூர்தி, அவ்வெலி, அவ்வேரி, அவ்வையர், அவ்வொலி, அவ்வோடை, அவ்வெளவியம் எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.96, நூ. 207", "", "easy", "false"], ["TOLK-208", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 208: “நீட வருதல் செய்யுளில் உரித்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 208: “நீட வருதல் செய்யுளில் உரித்தே.” — What does this sutra state?", "இஃது அகரச் சுட்டு செய்யுளுள் முடியுமாறு கூறுகிறது. இது அல்வழி முடிபு. எ-டு.: ஆயிரு திணையின் இசைக்குமன சொல்லே - என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.96, நூ. 208", "", "easy", "false"], ["TOLK-209", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 209: “சாவ என்னும் செயஎன் எச்சத்து இறுதி வகரம் கெடுதலும் உரித்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 209: “சாவ என்னும் செயஎன் எச்சத்து இறுதி வகரம் கெடுதலும் உரித்தே.” — What does this sutra state?", "இது மேற்கூறிய வினையெஞ்சு கிளவியுள் ஒன்றனுக்கு எய்தியன்மேல் சிறப்புவிதி கூறுகிறது. இது அல்வழி முடிபு. எ-டு.: சாக்குத்தினான், சாச்சீறினான், சாத்தகர்த்தான், சாப்புடைத்தான் - இதில் வன்கணம் வர இறுதி அகரமும், இகரமும் கெட்டு இயைபு வல்லெழுத்து மிக்கு முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.96, நூ. 209", "", "medium", "false"], ["TOLK-211", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 211: “வாழிய என்னும் சேயென் கிளவி இறுதி யகரம் கெடுதலும் உரித்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 211: “வாழிய என்னும் சேயென் கிளவி இறுதி யகரம் கெடுதலும் உரித்தே.” — What does this sutra state?", "இது ஏவல் கண்ணிய வியங்கோள் கிளவி ஒன்றனுக்கு எய்தியதன்மேல் சிறப்பு விதி கூறுகிறது. இது அல்வழி முடிபு.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.97, நூ. 211", "", "easy", "false"], ["TOLK-212", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 212: “உரைப்பொருட் கிளவி நீட்டமும் வரையார்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 212: “உரைப்பொருட் கிளவி நீட்டமும் வரையார்.” — What does this sutra state?", "இது அம்ம என்பதற்கு எய்தியதன் மேல் சிறப்புவிதி கூறுகிறது. இது அல்வழி முடிபு.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.98, நூ. 212", "", "easy", "false"], ["TOLK-213", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 213: “பலவற்று இறுதி நீடுமொழி உளவே செய்யுள் கண்ணிய தொடர்மொழியான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 213: “பலவற்று இறுதி நீடுமொழி உளவே செய்யுள் கண்ணிய தொடர்மொழியான.” — What does this sutra state?", "இது மேற்கூறியவற்றுள் பல, சில என்பனவற்றுக்குச் செய்யுள் முடிபு கூறுகிறது. எ-டு.: பலாஅஞ் சிலாஅம்-பலவும் சிலவும்-செவ்வெண்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.98, நூ. 213", "", "easy", "false"], ["TOLK-214", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 214: “தொடர்அல் இறுதி தம்முன் தாம் வரின் லகரம் றகர ஒற்று ஆதலும் உரித்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 214: “தொடர்அல் இறுதி தம்முன் தாம் வரின் லகரம் றகர ஒற்று ஆதலும் உரித்தே.” — What does this sutra state?", "இது பலசில என்பனவற்றுக்கு எய்தியதன் மேல் சிறப்புவிதி கூறுகின்து. இஃது அல்வழி முடிபு. எ-டு.: பற்பல கொண்டான், தம்முன் தாம் வர அகரம் கெட்டு லகரம் றகர சிற்சில வித்தி - ஒற்றாயிற்று.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.98, நூ. 214", "", "easy", "false"], ["TOLK-215", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 215: “வல்லெழுத்து இயற்கை உறழத்தோன்றும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 215: “வல்லெழுத்து இயற்கை உறழத்தோன்றும்.” — What does this sutra state?", "இந்நூற்பா மேற்கூறியவற்றிற்கு மேலும் ஒரு முடிபு கூறுகிறது. முற்கூறிய பலசில இரண்டற்கும் பொதுவிதியான் எய்திய வல்லெழுத்து இயல்பு, மிகுதலும், மிகாமையுமாய் உறழ்ந்து வரும். எ-டு.: பலப்பல, சிலச்சில - பலபல, சிலசில - பொதுவிதியான் மிகாது உறழ்ந்து முடிந்தன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.99, நூ. 215", "", "medium", "false"], ["TOLK-216", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 216: “வேற்றுமைக் கண்ணும் அதனோ ரற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 216: “வேற்றுமைக் கண்ணும் அதனோ ரற்றே.” — What does this sutra state?", "இது அகர ஈற்றுப்பெயர் வேற்றுமைக்கண் வன்கணத்தோடு புணருமாறு கூறுகிறது. இது பொது முடிபு.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.99, நூ. 216", "", "easy", "false"], ["TOLK-217", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 217: “மரப்பெயர்க் கிளவி மெல்லெழுத்து மிகுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 217: “மரப்பெயர்க் கிளவி மெல்லெழுத்து மிகுமே.” — What does this sutra state?", "இது அகர ஈற்றுள் மரப்பெயர்க்கு எய்தியது விலக்கிப் பிறிதுவிதி வருதல் கூறுகிறது. எ-டு.: விளங்கோடு, விளஞ்செதில், விளந்தோல், விளம்பூ என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.99, நூ. 217", "", "easy", "false"], ["TOLK-218", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 218: “மகப்பெயர்க் கிளவிக்கு இன்னே சாரியை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 218: “மகப்பெயர்க் கிளவிக்கு இன்னே சாரியை.” — What does this sutra state?", "எ-டு.: மகவின்கை, மகவின்செவி, மகவின் தலை, மகவின் புறம்-இதில் மக என்னும் பெயர் வேற்றுமைக்கண் இன் சாரியை பெற்றதைக் காண்க. முற்கூறிய மகவின்கண், இன்னே அன்றி அத்துச்சாரியையும் வருதல் உண்டு.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.100, நூ. 218", "", "easy", "false"], ["TOLK-219", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 219: “அத்து அவண் வரினும் வரைநிலை இன்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 219: “அத்து அவண் வரினும் வரைநிலை இன்றே.” — What does this sutra state?", "மக என்னும் அகர ஈற்றுப்பெயர்க்கு மேலும் ஒரு விதியினை இந்நூற்பா கூறுகிறது. எ-டு.: மகத்துக்கை, மகத்துச்செவி, மகத்துத்தலை, மகத்துப்புறம் எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.100, நூ. 219", "", "easy", "false"], ["TOLK-220", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 220: “பலவற்று இறுதி உருபுஇயல் நிலையும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 220: “பலவற்று இறுதி உருபுஇயல் நிலையும்.” — What does this sutra state?", "பன்மைப் பொருளை உணர்த்தும் அகர ஈற்றுச் சொற்கள் உருபியற்கண் கூறியவாறு வற்றுச்சாரியை பெற்று வரும். எ-டு.: பலவற்றுக்கோடு, பலவற்றுச்செவி, பலவற்றுத்தலை, பலவற்றுப்புறம்-பன்மைப் பொருளினை உணர்த்தும் அகர ஈற்றுப்பெயர்கள் வற்றுச்சாரியை பெற்றன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.100, நூ. 220", "", "medium", "false"], ["TOLK-221", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 221: “ஆகார இறுதி அகர இயற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 221: “ஆகார இறுதி அகர இயற்றே.” — What does this sutra state?", "இது ஆகார ஈறு அல்வழிக்கண் முடியுமாறு கூறுகிறது. இது பொது முடிபு. எ-டு.: தாராக்கடிது, தாராச்சிறிது, தாராத்தீது, தாராப்பெரிது - ஆகார ஈற்றுப்பெயர் அல்வழிக்கண் வல்லெழுத்து மிக்கு முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.100, நூ. 221", "", "easy", "false"], ["TOLK-222", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 222: “செய்யா என்னும் வினைஎஞ்சு கிளவியும் அவ்இயல் திரியாது என்மனார் புலவர்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 222: “செய்யா என்னும் வினைஎஞ்சு கிளவியும் அவ்இயல் திரியாது என்மனார் புலவர்.” — What does this sutra state?", "இது ஆகார ஈற்று வினைச்சொல் ஒன்றுக்கு விதி கூறுகிறது. இது அல்வழி முடிபு.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.101, நூ. 222", "", "easy", "false"], ["TOLK-224", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 224: “ஆவும் மாவும் விளிப்பெயர்க் கிளவியும் யாஎன் வினாவும், பலவற்று இறுதியும் ஏவல் குறித்த உரையசை மியாவும் தன்தொழில் உரைக்கும் வினாவின் கிளவியொடு அன்றி அனைத்தும் இயல்புஎன மொழிப.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 224: “ஆவும் மாவும் விளிப்பெயர்க் கிளவியும் யாஎன் வினாவும், பலவற்று இறுதியும் ஏவல் குறித்த உரையசை மியாவும் தன்தொழில் உரைக்கும் வினாவின் கிளவியொடு அன்றி அனைத்தும் இயல்புஎன மொழிப.” — What does this sutra state?", "இது ஆகார ஈற்றுச் சொற்களுள் நான்கனுக்கு எய்தாதது எய்துவித்தலும், மூன்றனுக்கு எய்தியது விலக்கலும் கூறுகிறது. எ-டு.: ஆ குறிது, மா குறிது- ஆ, மா இயல்பாயின. ஊரா கொள் - விளிப்பெயர் இயல்பாயிற்று. யா குறிய - யா வினா இயல்பாயிற்று. உண்ணா குதிரை - ஆகார ஈற்று முற்று இயல்பாயிற்று கேண்மியா கொற்றா - உரையசை மியா இயல்பாயிற்று. உண்கா கொற்றா - தன் தொழில் உரைக்கும் வினா இயல்பாயிற்று.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.101, நூ. 224", "", "medium", "false"], ["TOLK-225", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 225: “வேற்றுமைக்கண்ணும் அதனோரற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 225: “வேற்றுமைக்கண்ணும் அதனோரற்றே.” — What does this sutra state?", "இது ஆகார வேற்றுமை முடிபு கூறுகிறது. எ-டு.: தாராக்கால், தாராச்சிறகு, தாராத்தலை, தாராப்புறம் - ஆகார ஈறு வேற்றுமைக்கண் வல்லினம் மிக்கு முடிந்தது. குறிற்கீழ் வரும் ஆகார ஈறும், தனிமொழி ஆகார ஈறும்", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.102, நூ. 225", "", "easy", "false"], ["TOLK-226", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 226: “குறியதன் முன்னரும் ஓரெழுத்து மொழிக்கும் அறியத்தோன்றும் அகரக் கிளவி.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 226: “குறியதன் முன்னரும் ஓரெழுத்து மொழிக்கும் அறியத்தோன்றும் அகரக் கிளவி.” — What does this sutra state?", "இது ஆகார ஈற்றுக்கு மேலும் ஒரு சிறப்புவிதி கூறுகிறது. குறிலின் முன் நின்ற ஆகார ஈற்றுக்கும், ஓரெழுத்தொருமொழியாகிய ஆகார ஈற்றுக்கும் அகரமாகிய எழுத்து நிலைமொழிக்கண் விளங்கத் தோன்றும். எ-டு.: பலாஅக்கோடு, பலாஅச்செதிள், பலாஅத்தோல், பலாஅப்பூ - குறில்முன் நின்ற ஆகாரம் வேற்றுமைக்கண் அகரம் பெற்றது. காஅக்குறை, காஅச்செய்கை, காஅத்தலை, காஅப்புறம்-ஓரெழுத்தொரு மொழியாகிய ஆகாரம் வேற்றுமைக்கண் அகரம் பெற்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.102, நூ. 226", "", "medium", "false"], ["TOLK-227", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 227: “இராஎன் கிளவிக்கு அகரம் இல்லை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 227: “இராஎன் கிளவிக்கு அகரம் இல்லை.” — What does this sutra state?", "இரா என்னும் சொல்லுக்கு முன்னர்க்கூறிய அகரப்பேறு வருதல் இல்லை. எ-டு.: இராக்கொண்டான், இராவிற்கொண்டான் எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.102, நூ. 227", "", "easy", "false"], ["TOLK-228", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 228: “நிலாஎன் கிளவி அத்தொடு சிவணும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 228: “நிலாஎன் கிளவி அத்தொடு சிவணும்.” — What does this sutra state?", "எ-டு.: நிலாஅத்துக் கொண்டான் நிலாஅத்துச் சென்றான். - இவற்றில் நிலா என்னும் கிளவி", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.103, நூ. 228", "", "easy", "false"], ["TOLK-229", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 229: “யாமரக் கிளவியும் பிடாவும் தளாவும் ஆமுப்பெயரும் மெல்லெழுத்து மிகுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 229: “யாமரக் கிளவியும் பிடாவும் தளாவும் ஆமுப்பெயரும் மெல்லெழுத்து மிகுமே.” — What does this sutra state?", "இது ஆகார ஈற்று மரப்பெயர்கள் மூன்றனுக்கு எய்தியது விலக்கிப் பிறிது விதி கூறுகிறது. எ-டு.: யாஅங்கோடு, பிடாஅங்கோடு, தளாஅங்கோடு- யா, பிடா, தளா எனும் மூன்று மரப்பெயர்களும் மெல்லெழுத்து மிக்கன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.103, நூ. 229", "", "easy", "false"], ["TOLK-230", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 230: “வல்லெழுத்து மிகினும் மானமில்லை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 230: “வல்லெழுத்து மிகினும் மானமில்லை.” — What does this sutra state?", "மேற்கூறியவற்றுள் சிறுபான்மை வல்லெழுத்து மிகுந்தும் வரும். எ-டு.: மா, பிடா, தளா என்னும் மூன்று மரப்பெயர்களும் மெல்லெழுத்தே அன்றிப் பொதுவிதியான் வல்லெழுத்து மிக்கு முடியினும் குற்றம் இல்லை என்பதாம். யாஅக்கோடு, பிடாஅக்கோடு, தளாஅக்கோடு - என்பதில் யா, பிடா, தளா எனும் முப்பெயரும் மெல்லெழுத்தே அன்றிப் பொதுவிதியான் வல்லொற்றும் மிக்கு முடிந்தமை காண்க. மா என்னும் மரப்பெயரும், ஆ, மா என்னும் விலங்குப்; பெயர்களும் மா என்னும் மரப்பெயர்ச்சொல்லும், ஆ, மா என்னும் விலங்குப் பெயர்ச்சொற்களும் ஆகிய அம்முப்பெயர்ச்சொற்களும், யா, பிடா, தளா என்பவற்றோடு ஒரு தன்மை உடையனவாய் மெல்லெழுத்துப் பெற்று முடியும். ஆ, மா என்னும் இரண்டிலும் அகரமும், வல்லெழுத்தும் ஆகிய அவை நிலையாதிருக்க, னகர ஒற்றுப் பெற்று முடியும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.103, நூ. 230", "", "hard", "false"], ["TOLK-231", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 231: “மாமரக் கிளவியும் ஆவும் மாவும் ஆமுப் பெயரும் அவற்று ஓரன்ன அகரம் வல்லெழுத்து அவைஅவன் நிலையா னகரம் ஒற்றும் ஆவும் மாவும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 231: “மாமரக் கிளவியும் ஆவும் மாவும் ஆமுப் பெயரும் அவற்று ஓரன்ன அகரம் வல்லெழுத்து அவைஅவன் நிலையா னகரம் ஒற்றும் ஆவும் மாவும்.” — What does this sutra state?", "இது மா (மரம்), ஆ (விலங்கு), மா (விலங்கு)ச் சொற்களுள் முன்னதற்கு எய்தியது விலக்கலும், ஏனையன இரணடனுக்கும் எய்தியது விலக்கி எய்தாதது எய்துவித்தலும் கூறுகிறது. எ-டு.: மாங்கோடு, மாஞ்செதிள், மாந்தோல், மாம்பூ-மாமரக் கிளவி எய்தி நின்ற வல்லொற்றும் அகரமும் கெட்டு முடிந்தது. ஆன்கோடு, ஆன்செவி, ஆன்றலை, ஆன்புறம்- ஆ எனும் பெயர் (விலங்கு) மெல்லொற்றும், வல்லொற்றும் அகரமும் கெட்டு னகரம் பெற்று முடிந்தது. மான்கோடு, மான்செவி, மான்றலை, மான்புறம்- மா எனும் பெயர் (விலங்கு) மெல்லொற்றும் வல்லொற்றும் அகரமும் கெட்டு னகரம் பெற்று முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.104, நூ. 231", "", "medium", "false"], ["TOLK-232", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 232: “ஆன்ஒற்று அகரமொடு நிலையிடன் உடைத்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 232: “ஆன்ஒற்று அகரமொடு நிலையிடன் உடைத்தே.” — What does this sutra state?", "இது மேற்கூறியவற்றுள் ஆகார ஈற்றுக்குச் சிறப்புவிதி கூறுகின்றது. எ-டு.: ஆன்பால், ஆனெய், ஆன்மணி எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.104, நூ. 232", "", "easy", "false"], ["TOLK-234", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 234: “குறியதன் இறுதிச் சினைகெட உகரம் அறிய வருதல் செய்யுளுள் உரித்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 234: “குறியதன் இறுதிச் சினைகெட உகரம் அறிய வருதல் செய்யுளுள் உரித்தே.” — What does this sutra state?", "இது ஆகார ஈற்றுள் சிலவற்றிற்குச் செய்யுள் முடிபு கூறுகிறது. எ-டு.: இறா, இறவு; கனா-கனவு, நிலவு-நிலா எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.104, நூ. 234", "", "easy", "false"], ["TOLK-235", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 235: “இகர இறுதிப் பெயர்நிலை முன்னர் வேற்றுமை ஆயின் வல்லெழுத்து மிகுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 235: “இகர இறுதிப் பெயர்நிலை முன்னர் வேற்றுமை ஆயின் வல்லெழுத்து மிகுமே.” — What does this sutra state?", "இது இகர ஈற்றுப்பெயர்க்கு அல்வழி முடிபு தொகைமரபின்கன் கூறிப் போந்தமையின் வேற்றுமை முடிபு கூறுகிறது. இது பொதுவிதி. எ-டு.: கிளிக்கால், கிளிச்சிறகு, கிளித்தலை, கிளிப்புறம் - வேற்றுமைக்கண் வல்லெழுத்து மிக்கு முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.105, நூ. 235", "", "medium", "false"], ["TOLK-236", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 236: “இனி, அணி என்னும் காலையும் இடனும் வினை எஞ்சு கிளவியும் சுட்டும் அன்ன.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 236: “இனி, அணி என்னும் காலையும் இடனும் வினை எஞ்சு கிளவியும் சுட்டும் அன்ன.” — What does this sutra state?", "சில வினைச்சொற்களுக்கும், இடைச்சொற்களுக்கும் முடிபு கூறுகின்றது இந்நூற்பா. எ-டு.: இக்கொற்றன், இச்சாத்தன், இத்தேவன், இப்பூதன் - இகரச்சுட்டிடைச்சொல் வல்லொற்று மிக்கது. இன்றிக்கெடும், அன்றிக்கெடும்-என்பதில் எதிர்மறைக் குறிப்பு வினையெச்சங்கள் வல்லெழுத்து மிக்கன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.105, நூ. 236", "", "medium", "false"], ["TOLK-237", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 237: “இன்றி என்னும் வினைஎஞ்சு கிளவி நின்ற இகரம் உகரம் ஆதல் தொன்றுஇடம் மருங்கின் செய்யுளில் உரித்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 237: “இன்றி என்னும் வினைஎஞ்சு கிளவி நின்ற இகரம் உகரம் ஆதல் தொன்றுஇடம் மருங்கின் செய்யுளில் உரித்தே.” — What does this sutra state?", "இது இகர ஈற்று எதிர்மறைக் குறிப்பு வினையெச்சம் ஒன்றனுக்குச் செய்யுள் முடிபு கூறுகிறது. எ-டு.: நாளன்று போகிப் புள்ளிடை நட்ப. (புறம். 124) எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.105, நூ. 237", "", "easy", "false"], ["TOLK-238", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 238: “சுட்டின் இயற்கை முன் கிளந்தற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 238: “சுட்டின் இயற்கை முன் கிளந்தற்றே.” — What does this sutra state?", "இது இகரச் சுட்டுப்பெயர், ஒழிந்த கணங்களோடு புணருமாறும், செய்யுட்கண் நீளுமாறும் கூறுகிறது. எ-டு.: இஞ்ஞாலம், இந்நூல். இம்மணி- மென்கணம் வர மெல்லெழுத்துப் பெற்றது. இவ்யாழ், இவ்வெட்டு, இவ்வடை, இவ்வாடை-இடையினமும் உயிரினமும் வர உகர ஒற்றுப்பெற்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.106, நூ. 238", "", "medium", "false"], ["TOLK-239", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 239: “பதக்கு முன்வரினே தூணிக் கிளவி முதல்கிளந்து எடுத்த வேற்றுமை இயற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 239: “பதக்கு முன்வரினே தூணிக் கிளவி முதல்கிளந்து எடுத்த வேற்றுமை இயற்றே.” — What does this sutra state?", "இது அளவுப்பெயர்களுள் ஒன்றனுக்கு எய்தியது விலக்கிப் பிறிது விதி கூறுகிறது. எ-டு.: தூணிப்பதக்கு. தூணிக்கொள், தூணிச்சாமை, தூணித்துவரை, தூணிப்பயறு- பிற பெயர் வருங்கால் வல்லெழுத்து மிக்கது. தூணித்தூணி-தன்முன் தான் வர வல்லெழுத்து மிக்கது. தூணிக்குத் தூணி-தன்முன் தான் வர இக்குச்சாரியை பெற்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.106, நூ. 239", "", "medium", "false"], ["TOLK-241", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 241: “பனிஎன வரூஉம் காலவேற்றுமைக்கு அத்தும் இன்னும் சாரியை ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 241: “பனிஎன வரூஉம் காலவேற்றுமைக்கு அத்தும் இன்னும் சாரியை ஆகும்.” — What does this sutra state?", "இந்நூற்பா பனி என்னும் காலப்பெயர்க்குச் சிறப்புவிதி கூறுகிறது. எ-டு.: பனியத்துக்கொண்டான்- அத்துச்சாரியை பெற்றது பனியிற் கொண்டான் - அன்சாரியை பெற்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.107, நூ. 241", "", "easy", "false"], ["TOLK-244", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 244: “புளி மரக்கிளவிக்கு அம்மே சாரியை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 244: “புளி மரக்கிளவிக்கு அம்மே சாரியை.” — What does this sutra state?", "எ-டு.: புளியங்கோடு, புளியஞ்செதில், புளியந்தோல், புளியம்பூ- என புளிமரக்கிளவி அம்முச்சாரியை பெற்று வந்தது. புளி+அம்+கோடுஸ்ரீபுளியங்கோடு.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.108, நூ. 244", "", "easy", "false"], ["TOLK-245", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 245: “ஏனைப் புளிப்பெயர் மெல்லெழுத்து மிகுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 245: “ஏனைப் புளிப்பெயர் மெல்லெழுத்து மிகுமே.” — What does this sutra state?", "இது புளி என்னும் சுவைப்பெயர்க்குரிய சிறப்புவிதி உணர்த்துகின்றது. எ-டு.: புளிங்கூழ், புளிஞ்சோறு, புளிந்தயிர், புளிம்பழம் எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.108, நூ. 245", "", "easy", "false"], ["TOLK-246", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 246: “வல்லெழுத்து மிகினும் மானம் இல்லை ஒல்வழி அறிதல் வழக்கத்தான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 246: “வல்லெழுத்து மிகினும் மானம் இல்லை ஒல்வழி அறிதல் வழக்கத்தான.” — What does this sutra state?", "சுவைப்பெயர்முன் மெல்லெழுத்தே அன்றி, பொதுவிதியான் எய்திய வல்லெழுத்து மிக்கு முடியினும் குற்றம் இல்லை. அது வழக்கின்கண் பொருந்தும் இடத்தினை அறிதல் வேண்டும். எ-டு.: புளிக்கூழ், புளிச்சோறு, புளித்தயிர், புளிப்பாதம்- இங்கு சுவைப்புளிப்பெயர் வல்லெழுத்து மிக்கது காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.108, நூ. 246", "", "medium", "false"], ["TOLK-247", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 247: “நாள்முன் தோன்றும் தொழில்நிலைக் கிளவிக்கு ஆன்இடை வருதல் ஐயம் இன்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 247: “நாள்முன் தோன்றும் தொழில்நிலைக் கிளவிக்கு ஆன்இடை வருதல் ஐயம் இன்றே.” — What does this sutra state?", "இது இகரஈற்று நாட்பெயர்முன் வினை வருங்கால் முடியும் முடிபினைக் கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.108, நூ. 247", "", "easy", "false"], ["TOLK-248", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 248: “திங்கள் முன் வரின் இக்கே சாரியை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 248: “திங்கள் முன் வரின் இக்கே சாரியை.” — What does this sutra state?", "இது திங்கட்பெயர்முன் வினைவருங்கால் முடியும் முடிபினைக் கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.109, நூ. 248", "", "easy", "false"], ["TOLK-249", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 249: “ஈகார இறுதி ஆகார இயற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 249: “ஈகார இறுதி ஆகார இயற்றே.” — What does this sutra state?", "இஃது ஈகார ஈற்றுப்பெயர்கள் அல்வழிக்கண் முடியுமாறு கூறுகிறது. இது பொதுவிதி. எ-டு.: ஈக்கடிது, ஈச்சிறிது, ஈத்தீது, ஈப்பெரிது - அல்வழிக்கண் வல்லெழுத்து மிக்கு முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.109, நூ. 249", "", "easy", "false"], ["TOLK-251", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 251: “இடம்வரை கிளவி முன் வல்லெழுத்து மிகூஉம் உடன்நிலை மொழியும் உளஎன மொழிப.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 251: “இடம்வரை கிளவி முன் வல்லெழுத்து மிகூஉம் உடன்நிலை மொழியும் உளஎன மொழிப.” — What does this sutra state?", "இது மீ என்னும் கிளவிக்குச் சிறப்புவிதி கூறுகிறது. எ-டு.: மீக்கோள், மீப்பல்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.110, நூ. 251", "", "easy", "false"], ["TOLK-252", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 252: “வேற்றுமைக் கண்ணும் அதன் ஓரற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 252: “வேற்றுமைக் கண்ணும் அதன் ஓரற்றே.” — What does this sutra state?", "இது ஈகார ஈற்றுப்பெயர் வேற்றுமைக்கண் முடியுமாறு கூறுகிறது. ஈகார ஈற்றுப்பெயர் வேற்றுமைப் புணர்ச்சிக்கண்ணும், ஈகார ஈற்று அல்வழியோடு ஒருதன்மைத்தாய் வல்லெழுத்து மிக்கு முடியும். எ-டு.: ஈக்கால், ஈச்சிறகு, ஈத்தலை, ஈப்புறம் - ஈகார ஈற்றுப்பெயர் வேற்றுமைக்கண் வல்லெழுத்து மிக்கது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.110, நூ. 252", "", "medium", "false"], ["TOLK-253", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 253: “நீஎன் ஒருபெயர் உருபியல் நிலையும் ஆவயின் வல்லெழுத்து இயற்கை ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 253: “நீஎன் ஒருபெயர் உருபியல் நிலையும் ஆவயின் வல்லெழுத்து இயற்கை ஆகும்.” — What does this sutra state?", "இது நீ என்னும் முன்னிலை ஒருமைப்பெயர்க்கு எய்திய விதி விலக்கிப் பிறிது விதி கூறுகிறது. நீ என்னும் முன்னிலை ஒருமைப்பெயர் உருபு புணர்ச்சிக்கண் கூறியவாறு நெடுமுதல் குறுகி, னகர ஒற்றுப்பெற்று முடியும். அவ்வாறு முடியும்வழி இயைபு வல்லெழுத்து மிகாது. எ-டு.: நின்கை, நின்செவி, நின்தலை, நின்புறம் என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.110, நூ. 253", "", "medium", "false"], ["TOLK-254", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 254: “உகர இறுதி அகர இயற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 254: “உகர இறுதி அகர இயற்றே.” — What does this sutra state?", "இது முற்றுகர ஈறுகள் வன்கணத்தோடு முடியுமாறு கூறுகிறது. குற்றுகர ஈறுகளைக் குற்றியலுகரப் புணரியலுள் கூறுவார் ஆசிரியர். எ-டு.: கடுக்குறிது, கடுச்சிறிது, கடுத்தீது, கடுப்பெரிது - இதில் உகர ஈற்றுப்பெயர் அல்வழிக்கண் வல்லெழுத்து மிக்கு முடிந்தமை அறிக.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.111, நூ. 254", "", "medium", "false"], ["TOLK-255", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 255: “சுட்டின் முன்னரும் அத்தொழிற்றாகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 255: “சுட்டின் முன்னரும் அத்தொழிற்றாகும்.” — What does this sutra state?", "இது உகரச்சுட்டு வன்கணத்தோடு முடியுமாறு கூறுகிறது. எ-டு.: உக்கொற்றன், உச்சாத்தன், உத்தேவன், உப்பூதன் - உகரச்சுட்டு வல்லெழுத்து மிக்கு முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.111, நூ. 255", "", "easy", "false"], ["TOLK-256", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 256: “ஏனவை வரினே மேல்நிலை இயல்பே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 256: “ஏனவை வரினே மேல்நிலை இயல்பே.” — What does this sutra state?", "உகரச் சுட்டின் முன்னர் உயிர், மெலி, இடைக்கணங்கள் வருமாயின் அவை மேல் அகரச்சுட்டு முடிந்துநின்ற இயல்பினவாகும். எ-டு.: உஞ்ஞாண், உந்நூல், உம்மணி - மெல்லினம் மிக்கன. உவ்வாய், உவ்வட்டி, உவ்வடை, உவ்வாடை- இடையினமும், உயிரினமும் மிக்கன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.111, நூ. 256", "", "medium", "false"], ["TOLK-257", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 257: “சுட்டுமுதல் இறுதி இயல்பாகும்மே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 257: “சுட்டுமுதல் இறுதி இயல்பாகும்மே.” — What does this sutra state?", "சுட்டினை முதலாக உடைய முற்றுகர ஈற்றுப்பெயர் முற்கூறியவாறு வல்லெழுத்து மிகாது இயல்பாகும். எ-டு.: அது குறிது, அது சிறிது, அது தீது, அதுபெரிது-சுட்டு முதல் முற்றுகர ஈற்றுப்பெயர் அல்வழிக்கண் இயல்பாயிற்று.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.111, நூ. 257", "", "easy", "false"], ["TOLK-258", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 258: “அன்று வருகாலை ஆ ஆகுதலும் ஐவரு காலை மெய்வரைந்து கெடுதலும் செய்யுள் மருங்கின் உரித்தென மொழிப.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 258: “அன்று வருகாலை ஆ ஆகுதலும் ஐவரு காலை மெய்வரைந்து கெடுதலும் செய்யுள் மருங்கின் உரித்தென மொழிப.” — What does this sutra state?", "இது சுட்டு முதலாக உடைய உகர ஈற்றுப்பெயர்க்குச் செய்யுள் முடிபு கூறுகிறது. எ-டு.: அதாஅன்றம்ம, இதாஅன்றம்ம, உதாஅன்றம்ம - அன்று வருங்கால் உகரம் ஆகாரமாயிற்று. அதைமற்றம்ம, இதைமற்றம்ம, உதைமற்றம்ம - ஐகாரச்சாரியை வருங்காலத்து உகரம் தான் ஊர்ந்த மெய்யினை விடுத்துக் கெட்டது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.112, நூ. 258", "", "medium", "false"], ["TOLK-259", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 259: “வேற்றுமைக் கண்ணும் அதனோ ரற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 259: “வேற்றுமைக் கண்ணும் அதனோ ரற்றே.” — What does this sutra state?", "இது உகர ஈற்றுப்பெயர் வேற்றுமைக்கண் முடியுமாறு கூறுகிறது. எ-டு.: கடுக்காய், கடுச்செதிள், கடுத்தோள், கடுப்பூ-உகர ஈறு வேற்றுமைக்கண் வல்லெழுத்து மிக்கு முடிந்தது. கடுக்குறுமை, கடுச்சிறுமை, கடுத்தீமை, கடுப்பெருமை - இதில் உகர ஈறு குணவேற்றுமைக் கண்ணும் வல்லெழுத்து மிக்கு முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.112, நூ. 259", "", "medium", "false"], ["TOLK-260", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 260: “எருவும் செருவும் அம்மொடு சிவணித் திரிபிட னுடைய தெரியுங்காலை அம்மின் மகரம் செருவயின் கெடுமே தம்மொற்று மிகூஉம் வல்லெழுத்து இயற்கை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 260: “எருவும் செருவும் அம்மொடு சிவணித் திரிபிட னுடைய தெரியுங்காலை அம்மின் மகரம் செருவயின் கெடுமே தம்மொற்று மிகூஉம் வல்லெழுத்து இயற்கை.” — What does this sutra state?", "இது உகர ஈற்றுள் ஒன்றனுக்கு வல்லெழுத்து விலக்கிச் சாரியைப்பேறும் ஒன்றனுக்கு வல்லெழுத்தினொடு சாரியைப் பேறும் விதிக்கிறது. எ-டு.: எருவங்குழி, எருவஞ்சேறு, எருவந்தாது, எருவம்பூழி-எரு என்பது வல்லெழுத்து விலக்குண்டு அம்முச்சாரியை பெற்றது. செருவக்களம், செருவச்சேனை, செருவத்தானை, செருவப்பாறை - செரு என்பது அம்முச்சாரியை பெற்று அதன் மகரம் கெட, வல்லெழுத்து மிக்கு முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.113, நூ. 260", "", "medium", "false"], ["TOLK-261", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 261: “ழகர உகரம் நீடிடன் உடைத்தே உகரம் வருதல் ஆவயினான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 261: “ழகர உகரம் நீடிடன் உடைத்தே உகரம் வருதல் ஆவயினான.” — What does this sutra state?", "ழகர உகரத்திற்குச் சிறப்புவிதியினை இந்நூற்பா கூறுகிறது. எ-டு.: எழுக்கதவு, எழுச்சிறை, எழுத்தானை, எழுப்படை - ழகர உகரம் வழக்கின்கண் நீண்டு உகரம் பெற்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.113, நூ. 261", "", "easy", "false"], ["TOLK-262", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 262: “ஒடு மரக்கிளவி உதி மர இயற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 262: “ஒடு மரக்கிளவி உதி மர இயற்றே.” — What does this sutra state?", "இது உகர ஈற்று மரப்பெயர் ஒன்றனுக்கு வல்லெழுத்து விலக்கி, மெல்லெழுத்து விதிக்கின்றது. எ-டு.: ஒடுங்கோடு, ஒடுஞ்செதிள், ஒடுந்தோல், ஒடும்பூ - ஒடு மரப்பெயர் மெல்லெழுத்து மிக்கது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.113, நூ. 262", "", "easy", "false"], ["TOLK-263", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 263: “சுட்டு முதல் இறுதி உருபியல் நிலையும் ஒற்றுஇடை மிகாஅ வல்லெழுத்து இயற்கை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 263: “சுட்டு முதல் இறுதி உருபியல் நிலையும் ஒற்றுஇடை மிகாஅ வல்லெழுத்து இயற்கை.” — What does this sutra state?", "இது முற்றுகர ஈற்றுச் சுட்டுப்பெயர்களுக்கு எய்தியது விலக்கிப் பிறிது விதி வகுக்கிறது. எ-டு.: அதூஅன்+கோடு →அதன்கோடு, அதன்செதிள், அதன்தோல், அதன்பூ - என்பதில் சுட்டுமுதல் முற்றியலுகரம் அன் சாரியை பெற்று உகரம் கெட்டு வல்லெழுத்து மிகாது முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.114, நூ. 263", "", "medium", "false"], ["TOLK-265", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 265: “வினைஎஞ்சு கிளவிக்கும் முன்னிலை மொழிக்கும் நினையும் காலை அவ்வகை வரையார்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 265: “வினைஎஞ்சு கிளவிக்கும் முன்னிலை மொழிக்கும் நினையும் காலை அவ்வகை வரையார்.” — What does this sutra state?", "இஃது ஊகார ஈற்று வினையெச்சத்திற்கு எய்தாதது எய்துவித்தலும், முன்னிலை வினைக்கு எய்தியது விலக்கிப் பிறிது விதி வகுத்தலும் கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.114, நூ. 265", "", "easy", "false"], ["TOLK-268", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 268: “பூஎன்ஒரு பெயர் ஆயியல்பு இன்றே ஆவயின் வல்லெழுத்து மிகுதலும் உரித்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 268: “பூஎன்ஒரு பெயர் ஆயியல்பு இன்றே ஆவயின் வல்லெழுத்து மிகுதலும் உரித்தே.” — What does this sutra state?", "எ-டு.: பூங்கொடி, பூஞ்சோலை, பூந்தாமம், பூம்பந்து என்பதில் பூ என்னும் எகார ஈற்றுப் பெயர் மெல்லெழுத்து மிக்கது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.115, நூ. 268", "", "easy", "false"], ["TOLK-269", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 269: “ஊ என்ஒரு பெயர் ஆவொடு சிவணும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 269: “ஊ என்ஒரு பெயர் ஆவொடு சிவணும்.” — What does this sutra state?", "ஊகார ஈற்று ஊ என்னும் ஒருபெயர் ஆகார ஈற்றுள் ஆ என்னும் சொல்லோடு பொருந்தி, உகரமும் வல்லெழுத்தும் பெறாது னகரம் பெற்று முடியும். எ-டு.: ஊன்குறை, ஊன்செய்கை, ஊன்றலை, என்புறம்- ஊ எனும் பெயர் உகரமும் வல்லெழுத்தும் பெறாது னகரம் பெற்றது. (ஊன்-தசை.)", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.115, நூ. 269", "", "medium", "false"], ["TOLK-270", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 270: “அக்கு என் சாரியை பெறுதலும் உரித்தே தக்கவழி அறிதல் வழக்கத்தான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 270: “அக்கு என் சாரியை பெறுதலும் உரித்தே தக்கவழி அறிதல் வழக்கத்தான.” — What does this sutra state?", "ஊ என்னும் பெயர் முற்கூறிய னகரத்தோடு அக்குச் சாரியையினைப் பெற்று முடிதலும் உரித்து. வழக்கின்கண் அம்முடிபிற்குத் தக்க இடம் அறிக. எ-டு.: ஊனக்குறை, ஊனச்செய்கை, ஊனத்தலை, ஊனப்புறம்- என்பதில் ஊ என்னும் பெயர் உகரம் பெறாது, னகரமும் அக்குச்சாரியையும் பெற்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.116, நூ. 270", "", "medium", "false"], ["TOLK-271", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 271: “ஆ^உ மக^உ ஆயிரு பெயர்க்கும் இன்இடை வரினும் மானமில்லை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 271: “ஆ^உ மக^உ ஆயிரு பெயர்க்கும் இன்இடை வரினும் மானமில்லை.” — What does this sutra state?", "எ-டு.: ஆ^உவின் கை, ஆ^உவின் செவி, ஆ^உவின்றலை, ஆ^உவின்புறம் - என்பதில் ஆ^உ என்பது இன்சாரியை பெற்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.116, நூ. 271", "", "easy", "false"], ["TOLK-272", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 272: “எகர ஒகரம் பெயர்க்கு ஈறுஆகா முன்னிலை மொழிய என்மனார் புலவர் தேற்றமும் சிறப்பும் அல்வழியான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 272: “எகர ஒகரம் பெயர்க்கு ஈறுஆகா முன்னிலை மொழிய என்மனார் புலவர் தேற்றமும் சிறப்பும் அல்வழியான.” — What does this sutra state?", "இஃது எகர, ஒகரம் ஈறாகும் இடத்தினைக் கூறுகிறது. எ-டு.: அவனேஎ செய்தான், உண்டேஎ மறுமை - எகரம் படர்க்கைப்பெறா, வினை ஈரிடத்தும் தேற்றப்பொருட்கண் அளபோசையின் ஈறாயிற்று. ஓஒசாத்தன், ஓஒசெம்பொன், ஓஒபெரியன், ஓஒபெரிது, ஓஒஉவமன் - ஒகரம் படர்க்கைப்பெயர், வினை ஈரிடத்தும் உயர்வு சிறப்புப் பொருட்கண் அளபோசையின் ஈறாயிற்று. ஓஒகொடியன், ஓஒதியன்-ஓகரம் படர்க்கை வினையிடத்து இழிவு சிறப்புப் பொருட்கண் அளபோசையின் ஈறாயிற்று.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.116, நூ. 272", "", "medium", "false"], ["TOLK-273", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 273: “தேற்ற ஏகாரமும் சிறப்பின் ஒவ்வும் மேற்கூறு இயற்கை வல்லெழுத்து மிகா.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 273: “தேற்ற ஏகாரமும் சிறப்பின் ஒவ்வும் மேற்கூறு இயற்கை வல்லெழுத்து மிகா.” — What does this sutra state?", "மேற்கூறிய இயல்பின்படி படர்க்கைப்பெயர், வினைக்கண் வரும் தேற்றப் பொருள் எகரமும் சிறப்புப்பொருள் ஒகரமும் வல்லெழுத்து மிகப்பெறா. எ-டு.: அவனேஎ செய்தான், உண்டேஎ மறுமை - தேற்றப்பொருளில் வந்த எகரம் இயல்பாயிற்று. ஓஒ சாத்தன், ஓஒசெம்பொன், ஓஒபெரியன், ஓஒபெரிது-சிறப்புப்பொருளில் வந்த ஒகரம் இயல்பாயிற்று. ஏஎக்கொற்றா, ஓஒக்கொற்றா-முன்னிலை வினைக்கண் வந்த எகர ஒகரங்கள் மிக்கன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.117, நூ. 273", "", "medium", "false"], ["TOLK-274", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 274: “ஏகார இறுதி ஊகார இயற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 274: “ஏகார இறுதி ஊகார இயற்றே.” — What does this sutra state?", "இஃது ஏகார ஈற்று அல்வழி முடிபு கூறுகிறது. எ-டு.: ஏக்கடிது, ஏச்சிறிது, ஏத்தீது, ஏப்பெறிது - ஏகார ஈறு அல்வழிக்கண் வல்லெழுத்து மிக்கது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.117, நூ. 274", "", "easy", "false"], ["TOLK-275", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 275: “மாறுகொள் எச்சமும் வினாவும் எண்ணும் கூறிய வல்லெழுத்து இயற்கை ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 275: “மாறுகொள் எச்சமும் வினாவும் எண்ணும் கூறிய வல்லெழுத்து இயற்கை ஆகும்.” — What does this sutra state?", "இது ஏகார ஈற்று இடைச்சொல் முடிபு கூறுகிறது. எ.டு.: யானே கொண்டேன்? - மாறுகொள் எச்சப்பொருளில் ஏகாரம் இயல்பாயிற்று. யான் கொண்டிலேன் என்பது பொருள். நீயே கொண்டாய்?-வினாப்பொருளில் வந்த ஏகாரம் இயல்பாயிற்று.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.117, நூ. 275", "", "easy", "false"], ["TOLK-276", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 276: “வேற்றுமைக் கண்ணும் அதனோ ரற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 276: “வேற்றுமைக் கண்ணும் அதனோ ரற்றே.” — What does this sutra state?", "இது ஏகார ஈறு வேற்றுமைக்கண் முடியுமாறு கூறுகிறது. எ-டு.: வேக்குடம், வேச்சாடி, வேத்தூதை, வேப்பானை - என்பதில் ஏகார ஈறு வேற்றுமைக்கண் வல்லெழுத்து மிக்கு முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.118, நூ. 276", "", "easy", "false"], ["TOLK-277", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 277: “ஏஎன் இறுதிக்கு எகரம் வருமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 277: “ஏஎன் இறுதிக்கு எகரம் வருமே.” — What does this sutra state?", "ஏகார ஈற்றுப்பெயர்க்கு வேற்றுமைக்கண் வல்லெழுத்தொடு எகரம் வரும். எ-டு.: ஏஎக்கொட்டில், ஏஎச்சாலை, ஏஎத்துளை, ஏஎப்புழை-ஏகார ஈற்றுப்பெயர் வேற்றுமைக்கண் வல்லெழுத்தொடு எகரம் பெற்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.118, நூ. 277", "", "easy", "false"], ["TOLK-278", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 278: “சேஎன் மரப்பெயர் ஒடு மர இயற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 278: “சேஎன் மரப்பெயர் ஒடு மர இயற்றே.” — What does this sutra state?", "சே என்னும் மரப்பெயர் ஒடு மர இயல்பிற்றாய் மெல்லெழுத்து மிக்கு முடியும். எ-டு.: சேங்கோடு, சேஞ்செதிள், சேந்தோல், சேம்பூ.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.118, நூ. 278", "", "easy", "false"], ["TOLK-279", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 279: “பெற்றம் ஆயின் முற்ற இன் வேண்டும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 279: “பெற்றம் ஆயின் முற்ற இன் வேண்டும்.” — What does this sutra state?", "முன்னர்க்கூறிய சே என்பது விலங்கினைக் (பெற்றம்) கூறுமாயின் முற்ற இன் சாரியை செற்று வருதல் வேண்டும். எ-டு.: சேவின்கோடு, சேவின்செவி, சேவின்றோல், சேவின்புறம்-சே என்னும் விலங்கின் பெயர் இன் சாரியை பெற்று வந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.118, நூ. 279", "", "medium", "false"], ["TOLK-280", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 280: “இகார இறுதிப் பெயர்நிலை முன்னர் வேற்றுமை ஆயின் வல்லெழுத்து மிகுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 280: “இகார இறுதிப் பெயர்நிலை முன்னர் வேற்றுமை ஆயின் வல்லெழுத்து மிகுமே.” — What does this sutra state?", "இஃது ஐகார ஈறு வேற்றுமைக்கண் முடியுமாறு கூறுகிறது. எ-டு.: யானைக்கோடு, யானைச்செவி, யானைத்தலை, யானைப்புறம் என்பதில் ஐகார ஈற்றுப்பெயர் வேற்றுமைக்கண் வல்லெழுத்து மிக்கு முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.118, நூ. 280", "", "easy", "false"], ["TOLK-282", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 282: “விசைமரக் கிளவியும் ஞெமையும் நமையும் அவை முப்பெயரும் சேமர இயல.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 282: “விசைமரக் கிளவியும் ஞெமையும் நமையும் அவை முப்பெயரும் சேமர இயல.” — What does this sutra state?", "விசை, ஞெமை, நமை என்னும் மூன்று மரப்பெயர்ச் சொற்களும் சே மரத்தைப் போல் வல்லெழுத்து மிகாது, மெல்லெழுத்து மிக்கு முடியும். எ-டு.: விசைங்கோடு, விசைஞ்செதிள், விசைந்தோல், விசைம்பூ - விசை மரக்கிளவி வேற்றுமைக்கண் மெல்லெழுத்து மிக்கு முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.119, நூ. 282", "", "medium", "false"], ["TOLK-283", "Tolk
