ஆற்றும் மழை தலைஇ; மரன் ஆற்றும் மலர் நாற்றம், தேன் ஆற்றும் மலர் நாற்றம், செறு வெயில் உறு கால கான் ஆற்றும் கார் நாற்றம் கொம்பு உதிர்த்த கனி நாற்றம்; 10 தான் நாற்றம் கலந்து உடன் தழீஇ வந்து தரூஉம் வையை. தன் நாற்றம் மீது, தடம் பொழில் தான், யாற்று வெந்நாற்று வெசனை நாற்றம் குதுகுதுப்ப, ஊர் ஊர் பறை ஒலி கொண்டன்று; உயர் மதிலில் நீர் ஊர் அரவத்தால் துயில் உணர்பு எழீஇ, 15 திண் தேர்ப் புரவி வங்கம் பூட்டவும், வங்கப் பாண்டியில் திண் தேர் ஊரவும், வயமாப் பண்ணுந மதமாப் பண்ணவும், கயமாப் பேணிக் கலவாது ஊரவும், மகளி;ர் கோதை மைந்தர் புனையவும், 20 மைந்தர் தண் தார் மகளிர் பெய்யவும், முந்துறல் விருப்பொடு முறை மறந்து அணிந்தவர், ஆடுவார் பொய்தல் அணி வண்டு இமிர் மணல் கோடு ஏறு எருத்தத்து இரும் புனலில் குறுகி, மாட மறுகின் மருவி மறுகுற, 25 கூடல் விழையும் தகைத்து தகை வையை புகை வகை தைஇயினார் பூங்கோதை நல்லார், தகை வகை தைஇயினார் தார்; வகைவகை தைஇயினார் மாலை மிக மிகச் சூட்டும் கண்ணியும் மொட்டு வலையமும் 30 இயல் அணி அணி நிற்ப ஏறி; அமர் பரப்பின் அயல் அயல் அணி நோக்கி ஆங்கு ஆங்கு வருபவர் இடு வளை ஆரமோடு ஈத்தான் உடனாக, கெடு வளை பூண்டவள் மேனியில் கண்டு நொந்து “அவள் மாற்றாள் இவள்” என நோக்க, 35 “தந்த கள்வன் சமழ்ப்பு முகம் காண்மின்; செருச் செய்த வாளி சீற்றத்தவை அன்ன நேர் இதழ் உண்கணார் நிரை காடாக, ஓடி ஒறித்து ஒய்யப் போவாள் நிலை காண்மின்”; என ஆங்கு, 40 ஒய்யப் போவாளை. “உறழ்ந்தோள் இவ் வாணுதல்” வையை மடுத்தால் கடல் எனத் தெய்ய, நெறி மணல் நேடினர் செல்ல, சொல் ஏற்று செறி நிரைப் பெண் வல் உறழ்பு “யாது தொடர்பு?” என்ன மறலினாள் மாற்றாள் மகள். 45 வாய் வாளா நின்றாள், செறி நகை சித்தம் திகைத்து, ஆயத்து ஒருத்தி, அவளை, “அமர் காமம் மாயப் பொய் கூட்டி மயக்கும் விலைக் கணிகை! பெண்மைப் பொதுமைப் பிணையிலி! ஐம்புலத்தைத் 50 துற்றவ துற்றும் துணை இதழ் வாய்த் தொட்டி! முற்றா நறு நறா மொய் புனல்ஆட்டி, காரிகை நீர் ஏர், வயல் காமக் களி நாஞ்சில், மூரி தவிர முடுக்கு முது சாடி மட மதர் உண்கண் கயிறாக வைத்துத் 55 தட மென் தோள் தொட்டு தகைத்து, மட விரலால் இட்டார்ககு ; யாழ் ஆர்;த்தும் பாணியில், எம் இழையைத் தொட்டு, ஆர்த்தும் இன்பத் துறைப் பொதுவி! கெட்டதைப் பொய்தல் மகளிர் கண் காண இகுத்தந்து, இவ் வையைத் தொழுவத்துத் தந்து, வடித்து இடித்து 60 மத்திகை மாலையா மோதி, அவையத்துத் தொடர்ந்தேம் எருது தொழில் செய்யாது ஓட விடும் கடன் வேளாளர்க்கு இன்று படர்ந்து, யாம், தன் மார்பும் தண்டம் தரும் ஆரத்தாள் மார்பும் நின் மார்பும் ஓர் ஒத்த நீர்மைய கொல்?” என்னாமுன், 65 தேடினாள் ஏச, சில மகளிர் மற்று அதற்கு ஊடினார், வையை யகத்து, “சிந்திக்க தீரும் பிணியாட் செறேற்க் மைந்து உற்றாய் வெஞ்சொல்; மட மயிற் சாயலை வந்திக்க வார்” என, மனத் தக்க நோய் இது 70 “வேற்றாரை வேற்றார் தொழுதல் இளிவரவு; போற்றாய் காண் அன்னை! புரையோய்! புரை இன்று மாற்றாளை மாற்றாள் வரவு” “அ……. சொல் நல்லவை நாணாமல் தந்து முழவின் வருவாய் நீ வாய்வாளர் 75 எந்தை எனக்கு ஈத்த இடு வளை, ஆரப் பூண் வந்த வழி நின்பால் மாயக் களவு அன்றேல், தந்தானைத் தந்தே தருக்கு”. “மாலை அணிய விலை தந்தான்; மாதர் நின் கால சிலம்பும் கழற்றுவான்; சால 80 அதிரல் அம் கண்ணி! நீ அன்பன் எதற்கு அன்பன்; கதுவாய் அவன் கள்வன் கள்வி நான் அல்லேன்”. என ஆங்கு, “வச்சிய மானே! மறலினை மாற்று; உமக்கு நச்சினார் ஈபவை நாடு அறிய நும்மவே” 85 “சேக்கை இனியார் பால் செல்வான் மனையாளால் காக்கை கடிந்து ஒழுகல் கூடுமோ? கூடர் தகவுடை மங்கையர் சான்றாண்மை சான்றார் இகழினும் கேள்வரை ஏத்தி இறைஞ்சுவார்; நிகழ்வது அறியாது நில்லு நீ, நல்லாய் 90 மகளிரை மைந்துற்று அமர்பு உற்ற மைந்தர் அகலம் கடிகுவேம் என்பவை யார்கக ; hணும் முடி பொருள் அன்று முனியல் முனியல்! கடவரை நிற்குமோ காமம்? கொடி இயலாய்” என ஆங்கு, 95 இன்ன துனியும் புலவியும் ஏற்பிக்கும் தென்னவன் வையைச் சிறப்பு கொடி இயலார் கை போல் குவிந்த முகை, அரவு உடன்றவை போல் விரிந்த குலை, குடை விரிந்தவை போலக் கோலும் மலர். 100 சுனை கழிந்து தூங்குவன நீரின் மலர் சினை விரிந்து உதிர்ந்த வீ, புதல் விரி போதொடும், அருவி சொரிந்த திரையின் துரந்து, நெடு மால் சுருங்கை நடுவழிப் போந்து. கடு மா களிறு அணத்துக் கை விடு நீர் போலும் 105 நெடு நீர் மலி புனல், நீள் மாடக் கூடல் கடி மதில் பெய்யும் பொழுது. நாம் அமர் ஊடலுரும் நட்பும் தணப்பும்,. காமமும் கள்ளும் கலந்து உடன் பாராட்ட, தாம் அமர் காதலரொடு ஆடப் புணர்வித்தல், பூ மலி வையைக்கு இயல்பு. 111 தெளிவுரை : (1-5) : சூல் முதிர்ந்த மேகம், மலை ஒழுங்கைச் சூழ்ந்து சினம் கொள்ளும் இடியேற்றுக் கூட்டம் ஆராவரிக்கும் படி கடல் வற்றிப்போக முகந்து கொண்டு வந்த நீரை அம்மலையின்து கற்கள் துண்டாகும்படி வீசிப் பெய்து தன்னுடன் போரிட்டு மாறுப்ட்ட புலியைக் குத்திப் பிளந்த பொலிவுடைய நெற்றியை உடைய கொம்பில் உள்ள குருதியால் மிக்க களங்கத்தை அக்கோடு தெளிவு பெறுமாறு கழுவியது. (6-11) : வையை ஆறு மேகமானது காலையில் கடலில் படிந்து அது குறையுமாறு மொண்ட நீருடன், காயும் ஞாயிறு போனவழியே மேற்குத் திசைக்குப் போய், மாலை நேரத்தில் மலையை அடைந்து வாழும் உயிர் எல்லாம் உறங்கும் இரவில் தான் உறங்காமல் மழை பெய்தலால் அந்நீருடன் மரங்கள் தரும் மலரின் மணமும், மலர்கள் தரும் தேனின் மணமும், சினந்து சுடும் வெயிலையும் மிக்க காற்றையும் உடைய காடுகள் அளிக்கு; ம் வெங்கார் மணமும், மரத்தின் கொம்புகள் கனிகளின் மணமும் ஆகிய இம் மணங்களை ஒருசேரக் கலந்து கொண்டு வந்து பிறர்க்குத் தரும். (12-32) : வையை ஆற்றின் இரண்டு கரைகளிலுதம் உள்ள சோலையின் மணத்துக்கு மேலாக அந்த வையையின் வெம்மையால் தோன்றும் வெங்கார் மணத்தை அனுபவித்துக் ஊர்கள் தோறும் அந்த புதுநீர் வருகையை மக்களுக்கு உணர்துவதற்காகப் பறை ஒலித்தது. மதுரை நகரத்ல் உள்ள மக்கள் உயர்ந்த மதிலிடத்தில் உள்ள சுருங்கையில் புகுந்து ஓடியது. அப்போது ஏற்பட்ட ஒலியால் உறக்கம் நீங்கி எழுந்தனர். திண்ணிய தேரில் வேண்டிய குதிரையை பூட்டி அதில் ஏற முயன்றனர். பள்ளியோட வண்டியில் ஏற எண்ணுபர் எருதுகளைத் தேரில் பூட்டி அதில் ஏறிச் செலுத்தினர். வலிய குதிரைகளை அலங்கரித்தற்குரிய கலனை யானைகளுக்கு ஒப்பனை செய்தனர். சிலர் இவற்றை ஒப்பனை செய்யாமல் ஏறிச்செலுத்தினர். பெண்டிர் அணியும் அணியை ஆடவர் அணிந்தனர். ஆடவர் அணியும் அணியை பெண்டிர் அணிந்தனர். இப்படிப் புதுநீர் வருகையை ஆசையால் ஊரும் மரபும் அணியும் மரபும் மறந்துவிட்டனர் மக்கள் எல்லாம். (23-36) : விளையாடும் மகளிர் இழைத்த சிற்றில் வண்டுகள் மொய்ககு ; ம். முன்பு உரைத்தப்படி முறை மறந்து அணிந்து கொண்டு முன்னால் சென்றவர் போக மற்ற மதுரை மக்கள் மாடங்கள் உள்ள தெருவில் வந்தனர். போக முடியாமல் வருந்தினர். பூமாலை மணம் பெறுதற்குப் புகை ஊட்டிய வகையால் சூடிய மகளிரும் மலர் மாலைகளை அணிந்து கொண்ட மைந்தரும். பலவகையான மாலைகளை அணிந்து உச்சிச் சூட்டும் கண்ணியும் பெரிய வளையமுமாய் ஆன அணிகளை உடைய கூட்டம் மேலும் கரைப் பரப்பில் ஏறினர். அவ்வாறு நின்றவருள் சிலர் மற்றவர் அணிந்துள்ள அணிகளை சுற்றி வந்து பார்த்தனர். அவர்களுள் ஒரு தலைவன் தலைவிக்குரிய அணிகளை ஒரு பரத்தைக்கு தன் தலைவி அறியாமல் தந்திருந்தான். ஆனால் காணமால் போனதாகச் சொல்லப்பட்ட தலைவியின் அணிகளை தோழிகள் பரத்தையிடத்தே கண்டனர். அதைச்சுட்டிக்காட்டி தம்முள் உரையாடினர். இதோ இந்த அணிகலன்களைத் திருடி இவளுக்குக்கொடுத்த கள்வனின் முகத்தையும் பாருங்கள்! இவை நம் தலைவியின் அணிகலன்களே! ஐயம் இல்லை! என்றனர். (37-47) : மேற்கண்ட தலைவனின் நிலை பற்றத் தோழியர் பேசிக் கொண்டிருக்கும் போதே. அதை அறிந்த பரத்தை அம்பு போன்ற கண்களை உடைய மங்கையர் கூட்டத்துடன் தான் மறைந்து பொள்வதற்குரிய காடாக் கருதி புகுந்தாள். ஆனால் தோழியர், அப்பரத்தையின் நிலைமையையும் காணுங்கள், அவள் அணிந்துள்ள அணிகள் நம் தலைவியினுடையதே! என்று கூறினர். அவ்விடத்தில், வையை யாறு கடலில் சென்று புகுந்தது போல் செறிந்த அம்மங்கையர் கூட்டத்துள் நுழைந்த பரத்தையே தலைவிக்கு மாற்றாள் என்று ஐயம் தெளிந்தனர். தோழியர் பின் தொடர்வதைக் கண்ட பரத்தை துணிவுடன் பேச முனைந்தாள். அவளின் துணிவானப் பேச்சைக் கேட்ட தலைவி உள்ளம் திகைத்து நின்றாள். (48-54) : அவ்வாறு எதிர்த்தபோது ஒரு தோழி, அப்பரத்தையை விரும்பும் காம இன்பத்தைப் பெரிய பொய்யுடன் கலந்து அதைக் கொள்ள வரும் காமுகரை மயக்கம் விலைத் தொழிலை உடைய கணிகையே! நின் பெண் இன்பம் பலருக்கம் பொதுவுடையது. ஆதலால் ஒருவராலும் பேணப்படாதவளே! ஐந்து பொறிகளால் அனுபவிக்கப்படும் ஐந்து புலன்களை மட்டுமே நுகரும் இயல்பு கொண்ட காமப்பன்றிகள் நுகர்தற்குரிய இரண்டு உதடுகளை உடைய தொட்டி போன்றவளே காம நெறியான கலப்பையைக் கட்டி எம் எருது சோம்பிக் கிடக்காமல் உழும் படைச்சாலே! (55-63) : மடப்பம் பொருந்திய மதர்த்த மை பூசப்பட்ட கண்களைக் கயிறாகக் கொண்டு தறியில் கட்டித் தடுத்து நிறைய பொருள் தந்தவர்க்குக் காம இன்பத்தைத ஊட்டடும் போதே, எம் அணிகளை அணிந்து கொண்டு ஆன அழகையும் காமுகர்க்கு ஊட்டும் இன்பம் அளித்தலில்; இந்த வையைத் துறையைப் போல்ல பொதுவானவளே! ஏடி!தீய எண்ணம் உடைய எருதைத் தேடிக் கண்டுபிடித்து இந்த விளையாட்டு மகளிர் கண்கள் காணும்படி அதனை வணங்கி கொணர்ந்த இந்த வையை ஆறு உரப்பி. மாலையினையே சம்மட்டியாய்க் கொண்டு அடித்து, இந்த வழக்கை உரைத்தற்குரிய அறங்கூறு அவையத்தில் உள்ளவர் எல்லாம் அஃது எம் எருது என்பதை அறியும்படி செய்ய யாம் நின்னைத் தொடர்ந்து வந்தோம். ஏனென்றால்; வேளாளார்க்குத் தம்தம் எருதைத் தொழில் செய்யாது பிறரிடம் போய் தொழில் செய்யும்படி ஓடவிடுவது முறை அன்று. (64-73) : தனக்குரிய தலைவன் மார்பை நினக்குத் தண்டமாகத் தரும் முத்துமாலையை உடைய எதம் தலைவியின் மார்பும் அவனது முத்துமாலையைக் களவினால் அணிந்து கொண்டிருக்கும் நின் மார்பும் ஒத்த தன்மை கொண்டனவோ? என்று தோழி ஒருத்தி கூறினாள். அவள் அப்படிக் கூறுவதற்கு முன்பு, அத்தோழியால் தேடப்பட்ட பரத்தை அவளது வசையைப் பொறுக்காமல் தலைவியின் மேல் வசைப்பாடினாள். அப்போத அந்தத உரையாடலைக் கேட்டபடி நின்ற முது மகளிருள் சிலர், பரததையை வெறுத்தவராய் ஏடி, கற்புடைமையால் எண்ணிய அளவில் பாவரம் நீங்கம் தன்மை கொண்ட குலமகளை இங்ஙனம் சினவாதே! நீ கொடிய சொல்லைச் சொல்லிப் பேதைமை ஆயினாய். இந்தப் பாவம் நீங்கும் பொருட்டு மடப்பம் உடைய மயில் போன்ற தலைவியை வணங்க செய்வாய்! என்றாள். அப்பரத்தை இது என்றைக்கும் நிலைத் துன்பமாய் முடிந்தது எனத் தனக்குள் கூறினாள். பின்னர், அம்முது மகளிருள் ஒருத்தியை நோக்கி, அன்னையே! பகைவரைப் பகைவர் வணங்குதல் இழிந்த செயலாகம். அப்படியே மாற்றாளை மாற்றாள் வணங்குதல் பெருமையற்ற செயலே ஆகும். என்றாள். (74-83) : ஏடி! வெட்கம் ஒன்றும் இல்லாது அவையில் சொல்லிக் கூத்தாடுதற்கு மத்தளத்துடனே வரும் தன்மை உடையாய் நீ! நின் பெருமையை எடுத்துக் கூற வேண்டா! எமக்குச் சீதனமாக வந்த அணிகள் உமக்குத் வந்த முறையினை கூறு. மேலும் உனக்குத் தந்தவன் ஒருவன் இருக்க வேண்டுமன்றோ! அவனை எமக்குக் கூறிப் பின்பு நீ மேம்பாடு உடைய ஆயின் ஆகுக! என்றாள் தலைவி. அழகிய மோசி மல்லிகை மாலையை அணிந்த மங்கையே! நீ பெரிதும் அன்பு பூண்டவன் என்னிடம் அன்பு கொண்டவன். ஆதலால் இவ்வளையலையும் முத்துமலையையும் புணர்ச்சிக்கு விலையாய் எனக்குத் தந்தான். அழகுடையவளே! நான் கள்வி அல்லேன். அறிவாய்! நின் காலில் உன்ன சிலம்புகளையும் எனக்குத் தரும் பொருட்டுக் கழற்றும் தன்மை உடையவன் அவனே கள்வன். நீ அவனை பிடிப்பாயாக! என்று பரத்தை உரைத்தாள். (84-97) : ஆடவரை வசியப்படுத்தும் மான் போன்றவளே நீ எதிர்த்தலைக் கைவிடுவாய். உம்மை விரும்பிய காமுகர் உமக்குத் தந்த பொருள்க்ள உமக்கு உரியவே ஆகும் என்று பரத்தையிடம் ஒருத்தி ஒரைத்தாள். நங்கையே! உலக இயல்பை அறியாமல் பரத்தையை சினவாதே! ஆடவரின் காமம் நிற்கக்கூடிய இடத்திலேயே நிற்கக் கூடியது இல்லை. புணர்சச ; p இனிமை மிக்க பரத்தையிடமே செல்வர். தாம் காமத்தால் மயக்கம் அடைந்து பரத்தையரை விரும்பி அவரைச் சேர்ந்த ஆடவரின் மார்பை இனித் தழுவோம் என இருத்தல் குலமகளிர் எவர்ககு; ம் முடியக் கூடிய செயல் அன்று, என்று அவள் தலைவியை ஆற்றுவித்தாள். இவ்வில்புடைய துனியையும் ஊடலையும் பாண்டினின் வையை ஆற ஏற்க செய்யும சிறப்புக்கொண்டதாகும். (98-108) : பூங்கொடி போன்ற அழகையுடைய மகளிரின் குவிந்த கை போன்ற காந்தள் அரும்புகளும், பாம்ப சினந்து படம் விரித்தாற் போல் இதழ் விரிந்த காந்தள் மலரும். குடை விரித்தாற்போல் விரிநித காந்தள் மலரால் சுனைகளினின்றும் கழிந்து கீழே விழுவனவாய நீர்ப்புக்களும், மரக் கொம்புகளில் மலர்ந்த உதிர்ந்த பூக்களும். புதர்களில் மலர்ந்து மல்களும் ஆகிய மலையினின்றும் வீழும் அருவி கொணர்ந்து தன்னம் சொரிந்த மல்லகளை வையை ஆறு மதுரைக்கு காப்பாய் உள்ள மதிலில் உள்ள பெரிய சுருங்கையூட வந்து மிக்க நீரைச் சொரியம் போது அந்த நீர் கடிய விலங்காகிய யானை தன் கையை உயரத் தூக்கிக் கீழே விடும் நீரை ஒத்து விளங்கியது. (108-111) : ஊடலும் கூடலும் தலைவியன் அச்சம் தங்குவதற்கு இடமான பிரிவும் ஆகியவற்றைக் காமத்தையும் கள்ளையும் யாவரும் பாராட்டும்படி தாம் விரும்பின காதலரோடு அன்பால் நீராடும்படி முன்பு பிரிந்தவரைக் கூட்டுதல், மலர்கள் மிக்க இந்த வையை ஆற்றுக்கு இயல்பாகும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 11, section 11.9, p.236", "", "hard", "false"], ["SANG-11-10", "Sangam literature", "சங்க இலக்கியம் – பரிபாடல் – வையைப் பாடல்கள்: “பாடல் : 22” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – பரிபாடல் – வையைப் பாடல்கள்: Explain the poem/passage titled “பாடல் : 22” (section 11.10).", "பாடியவர் மற்றும் பண் அமைத்தவர் பெயர் அறியப்படவில்லை ஒளிறு வாட் பொருப்பன் உடல் சமத்து இறுத்த களிறு நிரைத் தவைபோல் கொண்மூ நெரிதர, அரசு படக் கடந்த ஆனாச் சீற்றத்தவன் முரசு அதிர்பவை போல் முழங்கு இடி பயிற்றி, ஒடுங்கார் உடன்றவன் தானை வில்விசை 5 விடும் கணை ஒப்பின் கதழ் உறை சிதறூஉ கண் ஒளிர் எஃகின் கடிய மின்னி, அவன் வண்மைபோல் வானம் பொழிந்த நிரு; மண் மிசை ஆனாது வந்து தொகுபு ஈண்டி மற்று அவன் தானையின் ஊழி தாவூக்கத்தின் 10 போன நிலம் எல்லாம் போர் ஆர் வயல் புகுத …………. நீக்கிப் பு ……………… கான மலைத்தரை கொன்று மணல் பினறி வான மலைத்த…..வ. ……………. லைத்தவ மண முரசு எறிதர, 15 தானைத் தலைத்தலை வந்து மைந்து உற்று பொறிவி யாற்றுறி, துவர், புகை, சாந்தம் எறிவன எக்குவ ஈரணிக்கு ஏற்ற நறவு அணி பூந்துகில் நன் பல ஏந்தி, பிற தொழின…ம் பின் பின் தொடர 20 செறி வினைப் பொலிந்த செம் பூங் கண்ணியர், ஈர் அமை வெட்சி இதழ் புனை கோதையர், தார் ஆர் முடியர், தகைகெழு மார்பினர், மாவும் களிறும் மணி அணி வேசரி காவு நிறையக் கரை நெரிபு ஈண்டி; 25 வேல் ஆற்றும் மொய்ம்பனின் விரை மலர் அம்பினோன் போல் ஆற்று முன்பின் புனை கழல் மைந்தரொடு தார் அணி மைந்தர் தவப் பயன் சான்ம் எனக் கார் அணி கூந்தல், கயற்கண், கவிர் இதழ், வார் அணி கொம்மை, வகை அமை மேகலை, 30 ஏர் அணி இலங்கு எயிற்று இன்னகையவர், சீர் அணி வையைக்கு அணி கொல்லோ? வையை தன் நீர் அணி நீத்தம் இவர்க்கு அணி கொல்? எனத் தேருநர் தேருங்கால், தேர்தற்கு அரிது காண் தீரமும் வையையும் சேர்கின்ற கண் கவின். 35 மண் கணை முழவின் இன் கண் இமிழ்விற்கு எதிர்வ பொருவி…ம் ஏறு மாறு இமிழ்ப்ப, கவர் தொடை நல் யாழ் இமிழ, காவில் புகர் வரி வண்டினம் பூஞ்சினை இமிர, ஊது சீர்த் தீம் குழல் இயம்ப மலர் மிசைத் 40 தாது ஊது தும்பி தவிர்பு அல இயம்ப, துடிச் சீர் நடத்த வளி நடன் மெல் இணர்ப் பூங்கொடி மேவர நுடங்க, ஆங்கு அவை தத்தம் தொழில் மாறு கொள்ளும், தீம் புனல் வையைத் திருமருதமுந்துறையால், 45 கோடுளர் குரல் பொலி ஒலி துயல் இருங்கூந்தல், புரை தீர் நெடு மென் தோள் தாழ்பு தழை மலர் துவளா வல்லியின், நீள் தாழ்ப தோக்கை, நித்தில வரிச் சிலம்பு, தெளிவுரை : (1-11) : வெற்றி வாளையுடைய பாண்டிய மன்னன் பகைவர் இறைப் பொருளாகத் தந்த களிற்று யானைகளை வரிசையாய் நிறுத்தியதைப் போல் மேகம் வானில் நெருங்கும். அம்மேகங்கள், சினம் உடைய பாண்டியனின் வெற்றி முரசுகள் போல் முழங்கம். பாண்டியனின் வில்லினின்றும் விசையுடன் செல்லும் அம்புக்கு ஒப்பாகும்படி நீர்த் துளிகளை அம்மேகங்கள் சிதறும். அவன் ஏந்திய வேல்போன்று மின்னும், அவன் கொடைத் தன்மையைப் போல் வானித்தினின்று பெய்த மழை நீரை உள்ளத்து எழுச்சியால் பகைவர் நாட்டில் போர் முறைமையால் சென்ற அப்பாண்டியனின் படைகளைப் போன்று பாண்டிய நாட்டில் மேன்மேலும் வந்து கூடிப்பெருகி அந்நாட்டு வயல்களில் உள்ள நிலம் எங்கம் வைக்கோற் போர்வை போன்று கழனிகளில் புகும். (12ஆம் அடி முதல் 17 ஆம் அடியின் முதல் இரண்டு சீர் வரையுள்ள சொற்க்ள பெரிதும் சிதைந்தும் காணப்பட்டுள்ளதால் அவற்றிற்கு உரை இல்லை) (17-25) பத்து வகைப்பட்ட துவரால் ஆக்கப்பட்ட நீர், அகில் முதலிய நறுமணப் புகைக்கு ஏற்ற பொருள்கள். சந்தனம் குங்கும் முதலியவற்றின் குழம்ப என்னும் மணப்பொருள்கள், சீசத் தக்கவையும் ஆன நீராடுதற்க ஏற்ற கருவிகள், நல்ல பல மற்றப்பொருள்கள், கள்ளும் அணிகலன்களும் பூத்தெதாழில்; அமைந்த ஆடைகள் என்ற இவற்றை ஆடவரும் பெண்டிரும் கைக் கொண்டனராகப் பின்னே வர, மலரைச் செறிய வைத்துத் தொடுத்த செயலால் அழகுடைய சிவந்த மலர் மாலைகளை அணிந்தவரும், குளிர்ந்த வெட்சி மலரால் தொடுக்கப்படட மாலையையும். அழகு பொருந்திய மார்பை உடையவர் ஆகிய மதுரையில் உள்ள ஆடவரும் பெண்டிரும் மணியால் அலங்காரம் செய்யப்பட்ட குதிரை யானை கோவேறு கழுதை முதலிய ஊர்த்திகளில் ஏறி ஊர்ந்து nவையை கரையானது நெறியும்படி வந்து சோலைகளில் புகுந்து நிரம்பின. (26-35) : வேற்போரைச்செய்யும் தோளை உடைய முருகப்பெருமானைப் போல் வலியையும் வீரக்கழலையும் கட்டிய கால்களையும் உடைய ஆடவரும், பூக்களை அம்பாக் கொண்டு காமனைப் போன்று மாலையை உடைய ஆடவரும், மேகத்தின் அழகை; கொண்ட கூந்தலையும் கயல்மீன போன்ற கண்ணையும் முருக்கம் பூப்போன்ற சிவந்த உதடுகளையும் கச்சினை அணிந்த கொங்கைகளையும் பல வகையானம கோத்த மேகலையையம் வரிசையாய் அமைந்த பற்கைளும் இனிய புன்முறுவலையும் உடைய மகளிரும் இயற்றிய தவத்தின் பயன் பெரிது எனப்பார்த்தவர் சொல்ல. இவ்வையை ஆற்றின் நீரால்ஆழகுற்ற வெள்ளம் இவர்ககு; அழகினை அளித்ததோ? என்ற ஐயம் கொண்டு தெளிவ கொள்ள முயல்பவர் ஆராயுங்கால் இரண்டடில் ஒன்றைத் தெளிநத: கொள்வதற்கு அரியதாகும். (36-45) : இனிய நீரையுடைய வையை ஆற்றில் உன்ள திருமருத முன்றுறையில் மண்ணாலாகிய திரண்ட குடமுழாவினது இனிய கண்ணில் எழும் ஒலிக்கு எதிர்வது போன்று முழங்கியது. கேட்பவரின் உள்ளம் கவரும் இயல்பை உடைய பாலைப் பண் கோவையையுடைய யாழ் இசைத்திட அந்த இசைக்கு மாறாகப் பூத்த கிளைகளில் புள்ளி வரி என்பனவற்றை உடைய வண்டுக் கூட்டங்கள் இசைக்கும். இசை வாணர்களால் எழுப்பப்படும் இனிய இசையையுடைய வேய்ங்குழல் ஒலிக்க, அதற்கு மாயறாக மல்களில் உள்ள தாதினைப்பாடும் தும்பிகள் இடைவிடாமல் ஒலிக்கும். ஆடும் மகளிரின் தாளத்துக்கு ஏற்பக் கூத்தாடுவதை நிகழ்த்த, அதற்க மாறாகக் காற்று என்ற கூத்தன் மென்மையான கொத்துக்களை உடைய மலர்க்கொடியைக் கண்டவர்க்கு விருப்பம் ஊற்பட ஆடும் . அங்குள்ள அக்கலைகள் ஒவ்வொன்றும் தத்தம் தொழிலுக்கு மாறான ஒவ்வொன்று கொண்ணட விளங்கும். (46-49) : மரத்தினது கொம்பில் தோன்றி அசையும் மலர்கn; காத்துகளால் பொலிந்து தழைத்த அசையும் கருமையான கூந்தலையுடைய குற்றம் இல்லாத தோளில் தாழ்ந்து தளிரும் பூவும் பொருந்திய ஆடும் கொடியைப் போன்று நீண்டு தாழ்ந்த தொங்கலுடன முத்தாகிய பரலை உடைய சிலம்பு…", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 11, section 11.10, p.243", "", "hard", "false"], ["SANG-12-3", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 151” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 151” (section 12.3).", "பாடியவர் : பெருந்தலைச் சாத்தனார் பாடப்பட்டோன் : இளவிச்சிக்கோ திணை : பாடாண் துறை : இயன்மொழி வாழ்த்து விச்சி என்பது நாடு. இளவிச்சிக்கோ என்பவன் அந்நாட்டின் அரசன். இவனும் இளங்கண்டீரக் கோவும் ஒருகால் ஒன்றாய் இருந்தனர். அப்போது அங்குப் வந்த புலவர் சாத்தனார் இளங்கண்டீரக்கோவை மட்டும் தழுவிக்கொண்டார். இந்நிகழ்வை அடிப்படையாகக் கொண்டது இச்செய்யுள். பண்டும் பண்டும் பாடுநர் உவப்ப, வின்தோய் சிமைய விறல் வரைக் கவாஅன் கிழவன் சேண் புலம் படரின், இழை அணிந்து, புன்தலை மடபப்பிடி பரிசிலாகப், பெண்டிரும் தம் பதம் கொடுக்கும் வண் புகழ்க் கண்டீரக்கோன் ஆகலின், நன்றும் முயங்கல் ஆன்றிசின் யானே, பொலந்தேர் நன்னன் மருகன் அன்றியும் நீயும் முயங்கற்கு ஒத்தனை மன்னே, வயங்கு மொழிப் பாடுநர்ககு ; அடைத்த கதவின் ஆடு மழை அணங்கு சால் அடுக்கம் பொழியும் நும் மணங்கமழ் மால் வரை வரைந்தனர் எமரே. முன்னெல்லாம் பாடுமு; புலவர் விரும்ப வானை அளாவிய உச்சியுடைய சிறந்த மலைப்பக்கத்தில், தம் கணவன் நெடுந்தொலை சென்றிருந்தால், அணியை அணிந்து புன்மையான தலையையுடைய மென்மையான பெண் யானையைப் பெரிசிலாக்க் கொண்டு மகளிரும் தம் தரத்தில் பரிசிலைத் தருவர். இத்தகைய வளமான் புகழ் பெருந்தியவன் காண்டீரக்கோ. பொன்னாலே செய்ப்பட்ட தேரையுடைய நன்னனின் மரபில் வந்தவன் நீ, இத்தகைய நீயும் தழுவிக் கொள்வதற்குப் பெருத்தமானவனே! ஆயினும் விளங்கும் மொழியுடைய பாடும் புலவர்ககு ; அடைத்த கதவுடையது உன் நாடு.. அக்காரணத்தாலே, இயங்கம் மேகத்தையும் தெய்வத்தையும் உடைய பக்க மலையில், சொரியும் மணம் கமழும் உயர்ந்த மலையை எம் போன்ற புலவர் பாடாது விலக்pனார். எனவே உன்னை நான் தழுவவிலலை!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.3, p.247", "", "medium", "false"], ["SANG-12-4", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 152” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 152” (section 12.4).", "பாடியவர் : வன்பரணர் பாடப்பட்டோன் : வல்வில் ஓரி திணை : பாடாண் துறை : பரிசில் விடை வல்வில் ஓரி என்பவன் வள்ளல்களுள் ஒருவன். கொல்லி மலைக்கும் அதனைச் சார்ந்த பகுதிக்கும் தலைவன். இவன்பெயர் ஆதன் ஓரி எனவும் வழங்கம். இவனது கொல்லி மலை சேர நாட்டில் நாமக்கல்லைச் சார்ந்த சேந்தமங்கலத்துக்கு அருகில் உள்ளது. இப்பாடலில் ஓரியின் வில்லாற்றலும் கொடைத் திறமும் புலவரால் பாடப்பட்டுள்ளது. வேழம் வீழ்த்த விழத் தொடைப் பகழி பேழ்வாய் உழுவையைப் பெரும் பிறிது உறீஇப், புழல்தலை புகர்க் கலை உருட்டி, உரல் தலைக் கேழல் பன்றி வீழ, அயலது ஆழல் புற்றத்து உடும்பில் செற்றும் வல்வில் வேட்டம் வலம்படுத்திருந்தோன், புகழ் சால் சிறப்பின் அம்பு மிகத் திளைக்கும் கொலைவன் யார் கொலோ? கொலைவன் மற்று இவன் விலைவன் போலான் வெறுக்கை நன்கு உடையன்; ஆரம் தாழ்ந்த அம் பகட்டு மார்பின், சாரல் அருவிப் பய மலைக் கிழவன் ஓரி கொல்லோ? அல்லன் கொல்லோ? பாடுவல் விறலி! ஓர் வண்ணம் நீரும் மண் முழா அமைமின்! பண் யாழ் நிறுமின்! கண் விடு தூம்பின் களிற்று உயிர் தொடுமின்! எல்லரி தொடுமின் ஆகுளி தொடுமின்! பதலை ஒருகண் பையொன இயக்குமின் மதலை மாக்கோல் கைவலம் தமின்! என்று இறைவன் ஆகலின், சொல்லுபு குறுகி மூவேழ் துறையும் ழுறையுளிக் கழிப்பிக், கோவெனப் பெயரிய காலை, ஆங்கு அது தன் பெயர் ஆகலின் நாணி மற்று யாம் நாட்டிடன் நாட்டிடன் வருதும், ஈங்கு ஓர் வேட்டுவர் இல்லை நின் ஒப்போர் என, வேட்டது மொழியவும் விடாஅன், வேட்டத்தில் தான் உயிர் செகுத்த மான் நிணப் புழுக்கோடு, ஆன் உருக்கு அன்ன வேரியை நல்கித் தன் மலைப் பிறந்த தாஇல் நன் பொன், பன் மணிக்குவை யொடும் விரைஇக் கொண்ம், எனச் சுரத்து இடை நல்கியோனே, விடர்ச் சிமை ஓங்கு இருங்கொல்லிப் பொருநன், ஓம்பா ஈகை விறல் வெய்யோனே. யானையைக் கொன்று வீழ்த்திய சிறந்த அம்பு, பெரிய வாயை உடைய புலியை இறக்கச் செய்தது. பின் துளையுடைய கொம்பு பொருந்திய தலையைக் கொண்ட புள்ளி மான் கலையை உருட்டியது. அதன் பின் உரல் போன்ற தலையைக் கொண்ட பன்றியை விழச்செய்தது. பின்னும் அதற்குப் பக்;கதில் இருந்த ஆழமான வலிய வில்லலல் உணடான வேளட்டையைச் செய்திருப்பவன். புகழ் பொருந்திய சிறப்புடைய அம்புத் தொழில்ல் மிகச் சிறப்புடையவன் யாரோ? அந்தக் கொலையில் வல்லவன் விலை காரணமாகக் கொன்றவன் இல்லை. அவன் மிக்க செல்வத்தை உடையவன் ஆவான். சந்தனம் பூசி உலர்ந்த அழகிய மார்பை உடையவன். விறலியே ! நான் பாடுவேன். ஒரு வண்ணம் நீங்களும் முழாவின் ஒரு பக்கத்தை டித்து வாசியுங்கள். யாழில் பண்ணை நிறுத்துங்கள். கண் திறக்கப்பட்ட தூம்பான ஆண்யானையின் கை போன்ற பெருவங்கியத்தை முழக்குங்கள். எல்லரி வாசியுங்கள். சிறு பறையை அடியுங்கள். பதலை எடின்ற வாத்தியத்தி;ல் ஒரு பக்கத்தை மெல்லத் தட்டுங்கள், பிறப்புணர்த்தும் நம் கரிய கோலைக் கையில் கொடுங்கள், என்று இப்படிச் சொல்லி, (பாடப்படும் அவன்) தலைவனனாதலால், இருபத்தோரு பாடல் துறையையும் பாடி முடித்துப்பின் கோவே உச்சிகளைக் கொண்ட உயர்ந்த கொல்லி மலைக்குத் தலைவனான பாதுகாவாத கொடைக் குணம் உடைய வெற்றியை விரும்பும் அந்த ஓரி, நாங்கள் உரைத்த பெயர் தன்னுடையதாதலால் நாணம் அடைந்தான். பின்பு நாங்கள் நாட்டின் இடந்தோறும் சென்று வருவோம். உன்னைப் போன்ற வேட்டுவர் ஒருவர் இங்கு எங்கும் இல்லை என்று நாங்கள் விரும்பியதைச் சொன்னோம். அதற்கு அவன் காலம் தாராதவனாய் வேட்டையில் தான் அடைந்த மானின் நிணத்துடன் கூடிய தசையின் புழுக்குடனே, பசு நெய்யை உருக்கியதைரப் போன்2 மதுவைத் தந்து, தன் மலையில் பிறந்த குற்றமற்ற நல்ல பொன்னைப் பல மணிக் கூட்டத்துடன் கலந்து இவற்றைப் பெற்று கொள்ளுங்கள் எனக் கூறி கரத்தில் எங்களுக்குத் தந்தான்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.4, p.248", "", "hard", "false"], ["SANG-12-5", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 153” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 153” (section 12.5).", "பாடியவர் : வன்பரணர் பாடப்பட்டோன் : வல்வில் ஓரி திணை : பாடாண் துறை : இயன்மொழி மழை அணி குன்றத்துக் கிழவன், நாளும் இழை அணி யானை இரப்போர்க்க ஈயும், சுடர்விடு பசும்பூண் சூர்ப்பு அமை முன் கை அடு போர் ஆனா ஆதன் ஓரி மாரி வண் கொடை காணிய, நன்றும் சென்றது மன் எம் கண்ணுளங் கடும்பே, பனி நீர்ப் பூவா மணிமிடை குவளை வால் நார்த் தொடுத்த கண்ணியும் கலனும் யானை இனத்தொடு பெற்றனர், நீங்கிப் பசியார்ஆகல் மாறு கொல், விசி பிணிக் கூடு கொள் இன் இயம் கறங்க, ஆடலும் ஒல்லார் தம் பாடலும் மறந்தே? மேகம் தவழும் மலைக்குத் தலைவன் நாற்தோறும் பட்டம் முதலிய அணிகளை அணிந்த யானையை இரப்பவர்க்கு அளிக்கும் கதிர் வீசும் பசிய பொன்னால் ஆன அணியையும் கடகம் சூடிய முன் கையையும் உடைய கொல்லும் போரையுடைய ஆதன் ஓரியினது, மழை போன்ற கொடையைக் காண்பதற்கு என் கூத்தர் சுற்றம் சென்றது. ;சென்ற பின்பு குளிர்ந்த நீரிலே பூவாத மணிகள் பதிக்கப் பெற்ற குவளைப் பூவை வெள்ளி நாரால் தொடுக்கப்பட்ட பொன்னரி மாலையையும் மற்ற அணிகளையும் யானை அணிகளுடனே பெற்று நீங்கினர். பசவியாதவர் ஆயினர். ஆதலால், வாரால் வலித்துக் கட்டப்பட்ட பல இசைக் கருவிகளின் தொகுதி கொண்ட இனிய இயங்கள் ஒலிக்க, ஆடுதiயும் பாடுதலையும் செய்யாதவரானார். பாடுதலையும் மறந்தார்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.5, p.250", "", "medium", "false"], ["SANG-12-6", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 154” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 154” (section 12.6).", "பாடியவர் : மோசிகீரனார், பாடப்பட்டோன் : கொண்கானங்கிழான் திணை : பாடாண் துறை : பரிசில் துறை திரை பொரு முந்நீர்க் கரை நணிச் செலினும் அறியுநர்க் காணின் வேட்கை நீக்கும் சின்னீர் வினவுவர் மாந்தர், அதுபோல் அரசர் உழையராகவும். புரைதபு வள்ளியோர்ப் படர்குவர் புலவர், அதனால், “யானும் பெற்றது ஊதியம் பேறு யாது?” என்னேன், உற்றனென் ஆதலின் உள்ளி வந்தனனே ஈயென இரத்தலோ அரிதே நீ அது நல்கினும் நல்காய் ஆயினும் வெல்போர் எறி படைக்கு ஓடா ஆண்மை அறுவைத் தூ விரி கடுப்பத் துவன்றி மீமிசைத் தண் பல இழிதரும் அருவி நின் கொண்டு பெருங்கானம் பாடல் எனக்கு எளிதே. அலைகள் அலைகின்ற கடலின் கலையில் சென்றாலும் (நீர் உள்ள இடத்தை) அறிந்தவரைக் கண்டால்,, நீர் வேட்கையைத்தணிக்கும் சிறியள நீரையே மக்கள் கேட்பர், அதுபோல, அறிவுடையார், வேந்தரிடத்தில் பகப்கத்தில் இருப்பவராயினும் குற்றம் அற்ற கொடைத் தன்மை கொண்டவரையே நாடிக்செல்வர். அதனால்ல, நானும் பெற்றதைப் பயனாக் கொண்டு, பெற்ற பொருள் சிறியதாக இருந்தாலுரும் இவலன் கொடுத்தது என்ன? என்று இகழ்ந்து பேசமாட்டேன். வறுமை அடைந்ததால் உன்னை நினைத்து வந்தேன். நீ அப்பரிசிலைத் தந்தாலும் தாராது போயினும்., எனக்குத் தருவாயாக என இரப்பது அரியதாகுமடஃ வெல்லும் போரில் எறியும் வடைக்கலத்துக்குப் புறங்கொடுத்து ஓடாத ஆண்மையையும் தூய் துகிலை விரித்தாற் போன்று நெருங்கி உச்சியினின்று பலவாக இறங்கும் குளிர்ந்த அருவியையுமுடைய நின் கொண்கானத்தைப் பாடுதல் எனக்கு எளியதாகும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.6, p.250", "", "medium", "false"], ["SANG-12-7", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 155” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 155” (section 12.7).", "பாடியவர் : மோசிகீரனார் பாடப்பட்டோன் : கொண்கானங்கிழான் திணை : பாடாண் துறை : பாணாற்றுப்படை வணர் கோட்டுச் சீறியாழ் வாடு புடைத் தழீஇ உணர்வோர் யார் என் இடும்பை தீர்க்க எனக், கிளக்கும் பாண! கேள் இனி! நயத்தின் பாழ் ஊர் நெருஞ்சிப் பசலை வான் பூ ஏர்தரு சுடரின் எதிர் கொண்டாஅங்கு, இhலம்படு புலவர் மண்டை விளங்கு புகழ்க் கொண்பெருங்காலத்துக் கிழவன் தண் தார் அகலம் நோக்கின மலர்ந்தே. வளைந்த கொம்பினையுடைய சிறிய யாழை உலர்ந்த இடைப்பக்கத்தில் வைத்துக் கொண்டு, ;என் துன்பத்தைப் போக்க அறிபவர் யார் என்று நயமாகக் கூறும் பாணனே! நான் சொல்வதைக் கேள். பாழான ஊரில் நெருஞ்சியின் பொன் போன்ற நிறமுடைய பூ. தோன்றி வரும் ஞாயிற்றை எதிர் கொண்டதுபோல். வறுமையுடைய யாழ்ப்புலவரின் கையில் உள்ள ஏற்கும் பாத்திரம். விளங்கும் புகழினை உடைய மார்பை மலர்ந்து பார்த்தன.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.7, p.251", "", "medium", "false"], ["SANG-12-8", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 156” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 156” (section 12.8).", "பாடியவர் : மோசிகீரனார் பாடப்பட்டோன் : கொண்கானங்கிழான் திணை : பாடாண் துறை : இயன்மொழி ஒன்று நன்குடைய பிறர் குன்றம்; என்றும் இரண்டு நன்கு உடைத்தே கொண்பெருங்கானம்; நச்சிச் சென்ற இரவலர்ச் சுட்டித் தொடுத்து உணக் கிடப்பினும் கிடக்கும்; அஃதான்று நிறை அருந் தானை வேந்தரைத் திறை கொண்டு பெயர்க்குஞ் செம்மலும் உடைத்தே. மற்றவரின் மலைகள் கொடைத்தன்மை அல்லது விமை என்ற இரண்டில் ஒன்றினை உடையன. ;ஆனால், காண்கான மலை இரண்டு நன்மையை உடையது. அது, தன்னிடம் பரிசிலை விரும்பிப் போன இரப்பவர் காரணமாகத் தான் முன்பு அவர்ககு ; க் கடன் கொடுத்தாராலே வளைத்துக் டிகொள்ளப்பட்டுக் கிடந்தாலுர்ம் கிடக்கும். (இரவலர்க்கு கடன் தந்தவர், இரவலர் பரிசிலர் பெற்றதும் அதைத் தாம் பெற்றுச் செல்வதன் பொருட்டாகச் சூழ்ந்திருப்பர்;.) அதுவே அல்லாது தடுத்து நிறத்துவதற்கரிய படையையுடைய மன்னரிடமிருந்து திறையைப் பெற்றுக் கொண்டு அவரைத் திரும்பிச் செல்லவிடுக்கும் தலைமையையும் உடையது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.8, p.251", "", "medium", "false"], ["SANG-12-9", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 157” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 157” (section 12.9).", "பாடியவர் : குறமகள் இளவெயினி பாடப்பட்டோன் : ஏறைக்கோன் திணை : பாடாண் துறை : இயன்மொழி ‘ஏழற’ எனவும் இவன் வழங்கப்பெறுவான். இப்பெயர் இயற்பெயர் என்பர். இவன் குறிஞ்சி நிலத்துக்குத் தலைவன். காந்தள் மலர் மாலை சூடுதல் இவனுக்கு இயல்பு. குறவர்களுக்குத் தலைவன். தமர் தன் தப்பின் அது நோன்றல்லும், பிறர் கையறவு தான் நாணுதலும், படைப்பழி தாரா மைந்தினன் ஆகலும், வேந்துடை அவையத்து ஓங்குபு நடத்தலும், நம்மோர்க்குத் தகுவன அல்ல் எம்மோன், சிலை செல மலர்ந்த மார்பின், கொலை வேல் கோடல் கண்ணிக் குறவர் பெருமகன், ஆடு ழை தவிர்ககு ; ம் பயங்கெழு மீமிசை, எல்படு பொழுதின் இனம் தலைமயங்கிக் கட்சி காணாக் கட மான் நல் ஏறு மட மான் நாகு பிணை பயிரின், விடர் முழை இரும்புலிப் புகர்ப் போத்து ஓர்ககு ; ம் பெருங்கல் நாடன் எம் ஏறைக்குத் தகுமே. தனக்கு நெருங்கியவர் பிழையைத் தனக்குச் செய்தால் அதைப் பொறுத்துக் கொள்ளுதலும், பிறரது வறுமைக்குத் தான் நாணம் கொள்ளுதலும் படையில் பிறரால் பழித்துக் கூறப்படாத வன்மை உடையவனாதலும், மன்னர் கூடிய அவைக் களத்தில் மேம்பட நடத்தலும்ம, உம்மால் மதிக்கப்படும் தலைவர்க்குத் தக்கவை அல்ல. எம் தலைவன், அம்பு எய்யவில்லை வளைத்தலால் அகன்றுள்ள மார்iபாயும், கொல்லும் வேலையும் காந்தள் மலரால் ஆன மாலையையும் கொண்ட குறவர்க்குத் தலைவன். திரியும் மேகத்தைத் தன் உயரத்தால் தடுக்கும் பயன் மிக்பக மலை உச்சியில் கதிரவன் மறையும் மாமலைப் போதில், தன் இனத்தினின்று பிரிந்து போய்த் திரும்பத் தான் சேரும் இடத்தைக் காணாத காட்டில், ஆண் மான் இளமையுடைய தன் பெண் மானை அழைத்தால், அந்த ஓசையை மலைக்குகையில் இருக்கும் பெரும்புலியான புகர் நிறத்தையுடைய ஆண்புலி தன் காதுகளைத் தாழ்த்துக் கேட்கும். இத்தகைய இயல்புடைய பெரிய மலை நாடனான ஏறைக்கோனுக்கு அந்த இயல்புகள் பொருந்துவனவாகும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.9, p.252", "", "hard", "false"], ["SANG-12-10", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 158” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 158” (section 12.10).", "பாடியவர் : பெருஞ்சித்திரனார் பாடப்பட்டோன் : குமணன் திணை : பாடாண் துறை : வாழ்த்தியியல், பரிசில், கடாநிலை குமணன் வள்ளல், முதிர மலையின் தலைவன். குறுநில மன்னன். முதிர மலை என்பது பழனி மலைத் தொடருள் ஒன்று. உடுமலைப்பேட்டையைத் தன்னகத்தே கொண்டது இந்நாடு. இவனைப் பெருஞ்சித்திரனார் பாடியுள்ளார். இப்பாடலில் பாரி முதலான வள்ளல்கள் எழுவர்ககு; ப் பின்பு கொடை பூண்டவனாக உள்ளான் குமணன் என்று பாராட்டியுள்ளார். முரசு கடிப்பு இகுப்பவும் வால் வளை துவைப்பவும், அரசுடன் பொருத அண்ணல் நெடுவரைக், கறங்கு வெள் அருவி கல் அலைத்து ஒழுகும் பறம்பின் கோமான் பாரியும், பிறங்கு மிசைக் கொல்லி ஆண்ட வல்வில் ஓரியும், காரி ஊர்ந்து பேர் அமர்க் கடந்த மாரி ஈகை மறப்போர் மலையனும், ஊராது ஏந்திய குதிரைக் கூர் வேல் கூவிளங்கண்ணிக் கொடும் பூண் எழினியம், ஈர்ந்தண் சிலம்பின் இருள் தூங்கும் நளி முழை அருந்திறல் கடவுள் காக்கும் உயர் சிமைப் பெருங்கல் நாடன் பேகனும், திருந்து மொழி மோசி பாடிய ஆயும், ஆர்வமுற்று உள்ளி வருநர் உவைல நனி தீரத், தள்ளாது ஈயும் தகை சால் வண்மைக், கொள்ளார் ஓட்டிய நள்ளியும், என ஆங்கு எழுவர் மாய்ந்த பின்றை; அழி வரப் பாடி வருநரும் பிறருங் கூடி இரந்தோர் அற்றம் தீர்க்கு என விரைந்து, இவண் உள்ளி வந்தனென் யானே, விசும்புறக் கழை வளர் சிலம்பின் வழையொடு நீடி, ஆசினிக் கவினிய பலவின் ஆர்வுற்று, முள் புற முது கனி பெற்ற கடுவன் துய்த்தலை மந்தியைக் கையி^உப் பயிரும், அதிரா யாணர் முதிரத்துக் கிழவ! இவண் விளங்கு சிறப்பின் இயல் தேர்க் குமண! இசை மேந் தோன்றிய வண்மையொடு பகை மேம்படுக, நீ ஏந்திய வேலே. முரசு அடிக்கப்படசுவம், வெண்மையான சங்கு ஒலிக்கவும், மன்னருடனே போரிட்ட தலைமையுடைய பெரிய மலையில் ஒலிக்கும் வெண்மையான அருவி கல்லை உருட்டி ஓடுகின்ற பறம்பு மலைக்குத் தலைவனான பாரியும், உயரமான மலையுச்சியையுடைய கொல்லி மலையை ஆண்ட வலிய வில்லை உடைய ஓரியும், காரி என்ற பெயருடைய குதிரையைச் செலுத்திப் பெரிய போரை வென்ற மேகத் போன்ற கொடைத் தன்மையையும் மிக்க போரையுமுடைய மலையனும், செலுத்தப்படாத குதிரை என்னும் மலையையும் கூர்மையான வேலையும் ;வில்வ மாலையையும் வளைவான மாலையையுடைய எழினி அதியமானும், மிகக் குளிர்ந்த மலையில் இருள் மிக்க குகையையும் அரிய வலிமையையும் உடைய தெய்வத்தால் காக்கப்படும் உயர்ந்த உச்சிகளையுடைய பெரிய மலை நாடனான பேகனும், தமிருந்திய மொழியை உடைய மோசி கீரனாரால் பாடப்பட்ட ஆய் என்பவனும், ஆசை கொண்டு தன்னை நினைத்து வருபவரின் வறுமையானது நீங்கத் தவறாது கொடுக்கும் இயல்ப கொண்ட கொடைத் தன்மையையுடைய பகைவரை ஓட்டிய நள்ளியும், என்று கூறப்பட்ட எழுவலரும் இறந்த பின்பு, நான் கண்டவலர்க்கு இரக்கம் வரப் பாடி வருபவரும் மற்றவரும் கூடி இரந்தவரின் துன்பத்தைத் தீர்க்கக் கடவேன் என்று நீ உள்ளாய். ஆதலால், நான், விரைவாக உன்னை நினைத்துப் பரிசில் பெற வந்தேன். வானத்தை அளாவி மூங்கில் வளர்ந்த மலையில் சுரபுன்னையுடன் ஓங்கி ஆசினியொடு அழகு பெற்ற பலாவினை ஆசைப்பட்டு, முள்ளை வெளியே கொண்ட முதிர்ந்த பலாப்பழத்தைப் பெற்ற ஆண் குரங்கு, பஞ்சி போல மயிரை உடைய தலையையுடைய பெண் குரங்கைக் கையால் குறிசெய்து அழைக்கின்ற தளர்ச்சியற்ற புதிய வருவாயைக் கொண்ட முதிர மலையின் தலைவ! உலகம் முழுவதும் விளங்கும் தலைமையையும் இயற்றப்பட்ட தேரையும் உடைய குமணனே! புகழ் மேம்பட்ட கொடைத் தன்மையுடனே பகையிடத்து நீ எடுத்த வேல் உயர்வதாகுக.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.10, p.253", "", "hard", "false"], ["SANG-12-11", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 159” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 159” (section 12.11).", "பாடியவர் : பெருஞ்சித்திரனார் பாடப்பட்டோன் : குமணன் திணை : பாடாண் துறை : பரிசில், கடாநிலை “வாழும் நாளோடு யாண்டு பல உண்மையின், தீர்தல் செல்லாது என் உயிர்” எனப்பல புலந்து, கோல் கால் ஆகக் குறும் பல ஒதுங்கி, நூல் விரித்தன்ன கதுப்பினள் கண் துயின்று முன்றில் போகா முதுர்வினள் யாயும்; பசந்த மேனியொடு படர்அட வருந்தி மருங்கில் கொண்ட பல் குறுமாக்கள் பிசைந்து தின வாடிய முலையள், பெரிது அழிந்து, குப்பைக்கீரைக் கொய்கண் அகைத்த முற்றா இளந்தளிர் கொய்து கொண்டு உப்பு இன்று, நீர் உலையாக ஏற்றி மோர் இன்று, அவிழ் பதம் மறந்து பாசடகு மிசைந்து, மாசொடு குறைந்த உடுக்கையள் அறம் பழியாத் துவ்வாள் ஆகிய என் வெய்யோளும், என்றாங்கு இருவர் நெஞ்சமும் உவப்பக் கானவர் கரி புனம் மயக்கிய அகன் கண் கொல்லை ஐவனம் வித்தி மையுறக் கவினி, ஈனல் செல்லா ஏனற்கு இழுமெனக் கருவி வானம் தலைஇ யாங்கும், ஈத்த நின் புகழ் ஏத்தித் தொக்க என் பசி தினத் திரங்கிய ஒக்கலும் உவப்ப, உயர்ந்து ஏந்து மருப்பின் கொல் களிறு பெறினும் தவிர்ந்து விடு பரிசில் கொள்ளலென் உவந்து, நீ இன்புற விடுதியாயின், சிறிது குன்றியும் கொள்வல் கூர் வேல் குமண! அதற்பட அருளல் வேண்டுவல் விறல் புகழ் வசையில் விழுத்திணைப் பிறந்த இசை மேந்தோன்றல், நிற் பாடிய யானே. கூர்மையான Nலையுடைய குமணனே! வெற்றியால் உண்டான புகழை உடைய குற்றம் இல்லாத சிறந்த குடியில் தோன்றிய புகழ் மிக்கு விளங்கும் அண்ணலே! உன்னைப் பாடிய நான் மேல் நோக்கிய கொம்பை உடைய கொல்ர்லும் தன்மையையுடைய யானையைப் பரிசிலாகத் தந்தாலும் முகம் மாறித் தரும் பரிசிலைக் கொள்ளேன். என் தாய், ஆண்டுகள் பல கழிந்துவிட்டால் வயது முரிர்ந்து, என் உயிர் இன்னும் போகவில்லையே! என்று கூறிக் கொண்டு தன் உயிர் வாழும் நாளைப் பலவாறு வெறுப்பவள். தான் கையில் பிடித்த கோலையே வைத்து நடப்பவள். வெண்மையான நூலை விரித்தாற் போன்ற நரைமயிரை உடையவள். கண் ஒளி குறைந்தவள், முற்றத்துக்குக் கூட செல்ல இயலாத முதுமை உடையவள். என் மனைவி, வெளிறிய மேனியுடன் நினைவு வருத்த வருந்தி இடையில் வைத்துக் கொண்டுள்ள இளம்பிள்ளைகள் பிசைந்து மெல்லுவதனால் வாட்டம் கொண்ட முலையையுடையவள், மிகவும் பவசியால் வருந்தியவள், குப்பையில் தானே முறைத்த கீரையில் முன்னம் கிள்ளிய கணுக்களில் தளிர்த்த கீரையின் இளந்தளிரைப் பறித்து வலந்து உப்பில்லாமல் நீரையே உலையாய் வைத்துவிட்டு மோர் இல்லாமலும் சோறு இல்லாமலும் அந்தக் கீரையாகிய உணவை உண்பவலள், அறக்கடவுளைப் பழித்து நொந்து கொள்பவள், உண்ணாது இருப்பவள். இந்த இருவர் உள்ளங்களும் மகிழும்படியும், வேடர் மரங்களைச் சுட்டதனால் கரிந்த புனத்தை நன்கு உழுத அகன்ற இடத்தை உடைய கொல்லையில்;, ஐவன நெல் உடன் விதைத்து, இருளின் நிறம் பொருந்த அழகு பெற்று, வெப்பத்தார் கதிரை ஈனாத தினைப் பயிர்க்கு, இழும் என்ற ஓசையுடன் மின்னல் இடி முதலான தொகுதியைக் கொண்ட மேகம் மழைத் துளியைச் சொரிந்தாற்போல் பரிசிலர்க்கு வழங்கிய உன் புகழை என் உறவினர் வாழ்த்துவர். அவர்கள் பசி தின்னுதலால் வருந்தி உள்ளனர். இவர்கள் மகிழும்படியும், நீ உவந்த, நான் இன்பம் அடைய எனக்குப் பரிசிலைத் தந்து அனுப்பினாயானால் அப்பரிசிலானது குன்றிமணி அளவு சிறியதாயினும் விருப்பத்துடனே ஏற்றுக்கொள்வேன். எனவே, அவ்வாறு இன்பம் அடைய அருள் செய்ய வேண்டும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.11, p.254", "", "hard", "false"], ["SANG-12-12", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 160” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 160” (section 12.12).", "பாடியவர் : பெருஞ்சித்திரனார் பாடப்பட்டோன் : குமணன் திணை : பாடாண் துறை : பரிசில், கடாநிலை “உருகெழு ஞாயிற்று ஒண் கதிர் மிசைந்த முளி புல் கானம் குழைப்பக் கல்லென அதிர் குரல் ஏறோடு துளி சொரிந்தாங்குப், பசி தினத் திரங்கிய கசிவுடை யாக்கை அவிழ் புகுவு அறியாதாகலின், வாடிய நெறி கொள் வரிக் குடர் குளிப்பத் தண்ணெனக், குய் கொள் கொழுந்துவை நெய்யுடை அடிசில், மதி சேர் நாள்மீன் போல, நவின்ற சிறு பொன் நன் கலஞ் சுற்ற இரீஇக் கேடின்றாக பாடுநர் கடும்பு என, அரிது பெறு பொலங்கலம் எளிதினின் வீசி நட்டோர் நட்ட நல்லிசைக் குமணன் மட்டார் மறுகின் முதிரத்தோனே, செல்குவையாயின் நல்குவன் பெரிது” எனப் பல் புகழ் நுவலுநர் கூற, வல் விரைந்து உள்ளம் துரப்ப வந்தனென், எள் உற்று இல் உணாத் துறத்தலின் இல் மறந்து உறையும் புல் உளைக் குடுமிப் புதல்வன் பன் மாண் பாலில் வறுமுலை சுவைத்தனன் பெறாஅன், கூழும் சோறம் கடைஇ, ஊழின் உள்இல் வருங்கலம் திறந்து அழக் கண்டு, மறப் புலி உரைத்தும் மதியம் காட்டியும், நொந்தனள் ஆகி நுந்தையை உள்ளிப் பொடிந்த நின் செவ்வி காட்டு எனப் பலவும் வினவல் ஆனாளாகி, நனவின் அல்லல் உழப்போள் மல்லல் சிறப்பச் செல்லாச் செல்வம் மிகுத்தனை, வல்லே விடுதல் வேண்டுவல் அத்தை படுதிரை நீர் சூழ் நில வரை உயர, நின் சீர் கெழு விழுப் புகழ் ஏத்துகம் பலவே. வெம்மையால் அச்சத்தைதத் தரும் கதிரவனின் ஒளிக்கதிரால் தின்னப்பட்ட உலர்ந்த புல் பொருந்திய காடானது தளிர்க்கும் படி கல் என்ற ஓசை உண்டாக நடுக்கத்தைத் தரும் ஒலியுடன் கூடிய பேரிடியுடன் மேகம் மழைத்துளியை பொழிந்தது போல, தாளிக்கப்பட்ட கொழுமையான துவையலுடன் கூடிய நெய் கலந்த உணவை , சந்திரனைச் சுற்றியுள்ள நட்சத்திரங்களைப் போல விளங்கும் பொன்னால் ஆன சிறிய நல்ல வட்டில்களைச் சுற்றிலும் பரப்பி வைத்து, பசியால் வாடியதும் வேர்வையைக் கொண்டதுமான உடல், சோறு உண்பதை அறியாததால் வாடி முடங்கியுள்ள பல வரிகளையுடைய குடரில் மூழ்குமாறு உண்ணச் செய்து, நம்மைப் பாடுகின்ற பாணர் சுற்றம் கேடின்றி வாழ்க என்று ;சொல்லி, பொன்னால் ஆன அணிகலன்களை எளிதாகத் தந்து, தன் நண்பர்களைவிட எம்முடன் மிக்க நட்புடைய புகழ் பொருந்திய குமணன், கள் மிக்க தெருக்களையுடைய முதிய மலையில் உள்ளான்! நீ அவனிடம் செல்வாயனால், உனக்கு அவன் மிக்க செல்வங்களை அளிப்பான் என்று உன் புகழ் பலவற்றையும் புகழ்ந்து சொல்பவர் என்னிடம் உரைத்தனர். அதைக் கேட்டு, என் மனம், உன்னிடம் விரைவாகச் செலுத்துவதால் நான் இங்கு வந்தேன். என் வீட்டிஎல் உண்தற்குரியது எதுவும் இ;ல்லாததால், அந்த வீட்டை இகழ்ந்து, அதை நினைக்காமல் இருக்கின்ற குதிரையின் தலைரயாட்டத்தைப் போன்ற மயிர் பொருந்திய குடுமியை உடைய என் மகன், பால் இல்லாததால், வற்றிய தன் தாயின் மார்பைப் பல முறையும் சுவைத்துப் பார்த்துப் பாலைப் பெறாதவனானான், கூழையோ சோற்றையோ உண்ண விரும்பி விரைந்து சென்று முறை முறையே உணவுக் கலங்களைத் திறந்து பார்த்தும் அவற்றில் ஒன்றும் இல்லாததால் அழுதான். அழ, அதைக் கண்டு மறத்தை உடைய புலி வருகின்;றது என்று அச்சுறுத்தியும் வானத்தில் உள்ள சந்திரனைக் காட்டியும் மகனின் அழுகையை நிறுத்த இயலவில்லை. ஆதலால் வருந்தி உன் தந்தையை நினைந்து வெறுத்த நின் அழகைக் காட்டு எனக் கூறினாள். அதனுடன் நில்லாது நனவிலும் துன்பம் அடையும் என் மனைவியின் வளப்பம் மிகுமாறு அழிவில்லாத செல்வத்தை மிகுதியாக விரைவாகத் தந்து அனுப்புவதை நான் விரும்புகின்றேன். ஒலிக்கும் அலைகள் பொருந்திய நீரால் சூழப்பட்ட இந்த நிலவெல்லையில் ஓங்கும்படி உன் சிறப்பையுடைய மேலான புகழைப் பலவாக யாம் வாழ்த்துவோம்!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.12, p.256", "", "hard", "false"], ["SANG-12-13", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 161” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 161” (section 12.13).", "பாடியவர் ; பெருஞ்சித்திரனார் பாடப்பட்டோன் : குமணன் திணை : பாடாண் துறை : பரிசில் நீண்டொலி அழுவம் குறைய முகந்து கொண்டு ஈண்டு செலல் கொண்மூ வேண்டு வயின் குழீஇப், பெரு மலையன்ன தோன்றல் சூன் முதிர்பு, உரும் உரறு கருவியொடு, பெயல் கடன் இறுத்து, வள மழை மாறிய என்றூழ்க் காலை, மன்பதை யெல்லாம் சென்று உண கங்கைக் கரை பொரு மலி நீர் நிறைந்து தோன்றியாங்கு எமக்கும் பிறர்க்கும் செம்மலையாகலின் அன்பு இல் ஆடவர் கொன்று, ஆறு கவரச், சென்று தலைவருந அல்ல அன்பின்று வன் கலை தெவிட்டும், அருஞ்சுரம் இறந்தோர்க்கு, இற்றை நாளொடும் யாண்டு தலைப் பெயர எனக் கண்பொறி போகிய கசிவொடு உரன் அழிந்து, அருந்துயர் உழக்கம் என் பெருந் துன்புறுவி நின் தாள் படு செல்வம் காண்டொறும் மருளப் , உயர் மருப்பு ஏந்திய வரை மருள் நோன் பகடு ஒளி திகழ் ஓடை பொலிய, மருங்கில் படுமணி இரட்ட ஏறிச் செம்மாந்து, செலல் நசைஇ உற்றனென் விறல் மிக குருசில்! இன்மை துரப்ப இசை தர வந்து, நின் வண்மையில் தொடுத்த என் நயந்தனை கேண்மதி! வல்லினும் வல்லேன் ஆயினும், வல்லே, என் அளந்து அறிந்தனை நோக்காது, சிறந்த நின் அளந்து அறிமதி பெரும! என்றும் வேந்தர் நாணப் பெயர்வேன் சாந்தருந்திப் பல் பொறிக் கொண்ட ஏந்து எழில் அகலம் மாண் இழை மகளிர் புல்லுதொறும் புகல, நாள்முரசு இரங்கும் இடனடை வரைப்பின் நின் தாள் நிழல் வாழ்நர் நன் கலம் மிகுப்ப, வாள் அமர் உயர்ந்த நின் தானையும் சீர் மிகு செல்வமும் ஏந்துகம் பலவே. வெற்றி மிக்க மன்ன! மிக்கு ஒலிக்கின்ற கடல் குறையுமாறு நீரை மொண்டு கொண்டு விரைவாகப் போகும் மேகங்கள் வேண்டிய இடத்தில் திரண்டு கூடிப் பரிய மலை போன்ற தோற்றம் உடையதாகி நீர் மிகுதியாகக் கருக்கொண்டு இடி மின்னல் முதலியவற்றுடன் கூடி மழை பெய்தலைச் செய்து வானத்தை அளிக்கும் மழை நீங்கப்பெற்றுக் கதிரவன் வெப்பம் மிக்க கோடை காலத்தில், ஊயிர்க்கூட்டங்கள் எல்லாம் போய் நீரைக் குடிப்பதற்குக் கங்கையாற்றின் கரையை மோதுகின்ற மிக்க நீர் நிறைந்து தோன்றுவதைப் Nபுhல நீ எங்;களு;ககும் மற்றவர்க்கும் உதவி செய்கின்ற தலைவனாக உள்ளாய். ஆதலால், எவரிடத்தும் அன்பு இல்லாத கொன்று அவரது பொருளைப் பறித்துக் கொள்வதால் வலிய கலை மான்கள் அசை போட்டுக் கொண்டிருப்பதும். வலிய கலை மக்கள் நடந்து போவதற்கு அரியதும் ஆன அந்தப் பாலைநிலம் அன்பின்றிப் பிரிந்து சென்றவருக்குப் போய் முடியக் கூடிய இயல்பு கொண்டதன்று. அத்தகைய அரிய சுரத்தில் சென்றவர்க்கு இன்றைய நாளடன் கூடி யாண்டு கழிக என்று சொல்லி என் பிpரிவுக்கு ஆற்றாது கண் ஒளி மங்கிய இரக்கத்துடனே வலிமை குன்றிப் பொறுக்க இயலாத துன்பத்துள் வருந்துபவன் மிக்க வறுமையுற்ற என் மனைவி, உன் முயற்சியால் உண்டான செல்வத்தைப் பார்க்குந்தோறும் வியக்குமாறு பனை போன்ற துதிக்கையுடனே முத்துக்கள் உண்டாகுமாறு முதிர்ந்த தந்தங்களையடைய யானை மீது ஒளிமிகும் அதன் நெற்றிப்பட்டம் ;விளங்கும்படியாக, இரண்டு பக்கங்களிலும் உள்ள மணிகள் ஒன்றுடன் ஒன்று மாறி மாறி ஒலிக்கும்படி ஏறித் தலைமை விளங்க அமர்ந்து என் ஊருக்குப் போவதை நான் விரு;ம்பினேன். என் வறுமை பின்னே இருந்து என்னைத் துரத்த, உன் புகழானது என்னை அழைத்துக்கொண்டு வர, நான் உன்னிடம் வந்தேன். வந்த. உன் கொடைப் பண்பில் சிலவற்றைப் புகழ்ந்து கூறினேன். என் சொற்களை விரும்பிக் கேட்பாயாக! உன் கொடை இயல்புகளுள் சிலவற்றைச் சொல்ல அறிவேனாயினும் அறியேனாயினும். விரைவாக என் கல்வியறிவை அறிந்து கொண்டவனாய், என் தகுதிக்கு ஏற்ற பரிசிலை அளித்தலைப் பற்றி ஆராயாது, சிறந்த நின் தகுதியையே ஆராய்வாயாக. பெருமானே! என்றும் என் பரிசுப் பெருள் மிகுதியைக் கண்டு அரசர் நாணும்படி திரும்பிச் செல்வேன். சாந்து பூசப்பட்டுப் பல நல்ல இலக்கணம் உடைய மார்பை அணிகள் அணிந்த மகளிர் தழுவுந்தோறும் விருபவும், நாட்காலையில் முரசு ஒலிக்கும்படியான இடத்தை உடைய எல்லையில், உன் அடி நிழலில் வாழ்பவர் நல்ல அணிகளை மிகுதியாக்கவும், வாளால் செய்யும் போரில் வருந்தி உன் படையையும், உன் சிப்புடைய செல்வத்தையும் யாம் பலவாறு புகழ்வோம்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.13, p.258", "", "hard", "false"], ["SANG-12-14", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 162” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 162” (section 12.14).", "பாடியவர்; : பெருஞ்சித்திரனார் பாடப்பட்டுடோன் : இளவெளிமான் திணை : பாடாண் துறை : பரிசில் விடை இரவலர் பாவலை நீயும் அல்லை; புரவலர் இரவலர்க்கு இல்லையும் அல்லர்; இரவலர் உண்மையம் காண் இனி! இரவலர்க்கு ஈவோர் உண்மையும் காண் இனி! நின் ஊர்க் கடி மரம் வருந்தத் தந்து யாம் பிணித்த நெடுநல் யானை எம் பரிசில், கடுமான் தோன்றல்! செல்வல் யானே. விரைவாக ஓடும் குதிரையையுடைய தலைவ! இரப்பவரை, வேண்டுவனவற்றைத் தந்து பாதுகாப்பவன் நீதான் என்பதும் இல்லை. வேண்டியவற்றைத் தந்து பாதுகாப்பவர் இரவலர்க்கு உன்னையல்லாது வேறு ஒருவர் இல்லாமலும் இல்லை. இன்னமும், வரிசை அறிந்து தாராது உன்னைப் போன்றவர் தோன்றிய பின்பும் இரவலர் இவ்வுலகத்தில் இருப்பதையும் நீ காண்பாயாக! இனி இரவலர்க்கு வேண்டியவற்றைத் தந்து பாதுகாக்கும் வள்ளல் இருப்பதையும் காண்பாயாக! உன் ஊரில் உள்ள காவல் மரம் வருந்தும் படி கொணர்ந்து நாம் கட்டியுள்ள பெரிய நல்ல யானை, நாம் இப்போது பெற்று வந்த பரிசிலாகும். இதை நீ அறிவாய். நான் இனிச்செல்வேன்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.14, p.259", "", "medium", "false"], ["SANG-12-15", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 163” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 163” (section 12.15).", "பாடியவர் : பெருஞ்சித்திரனார் பாடப்பட்டோன் : புலவரின் மனைவி துறை : பாடாண் துறை : பரிசில் குமணனிடம் பெரும் பரிசில் பெற்ற புலவர் பெருஞ்சித்திரனார் தாம் பெற்ற பரிசிலை எல்லார்க்கும் தருமாறு தம் மனைவியிடம் கூறுவதை இதில் காணலாம். நின் நயந்து உறைநர்க்கும், நீ நயந்து உறைநர்க்கும், பன் மாண் கற்பின் நின் கிளை முதலோர்க்கும், கடும்பின் கடும் பசி தீர யாழ நின் நெடுங்குறி எதிர்ப்பை நல்கியோர்க்கும் இன்னோர்க்கு என்னாது என்னோடும் சூழாது, வல்லாங்கு கொடுமதி மனை கிழவோயே! பழந்தூங்கு முதிரத்துக் கிழவன் திருந்து வேல் குமணன் நல்கிய வளனே. மனைக்கு உரியவளே! பலாப்பழம் முதலான கனிக்ள பழுத்துத் தொங்கும் முதிரம் என்ற மலைக்குத் தலைவனாகிய திருந்திய வேலையுடைய குமணன் எனக்குக் கொடுத்த செல்வத்தை, உன்னை விரும்பி வாழ்கின்ற மகளிர்க்கும், உன்னாலர் அன்பு காட்டப்பட்ட மகளிர்க்கும் பல மாட்சிமையுடைய கற்புடைய உன் உறவினரான மூத்த மகளிர்க்கும், நெடுநாளாக உனக்குக் கடனாகப் பொருளைத் தந்து உதவி செய்தவர்க்கும். இன்ன தன்மை உடையவருக்குதான் தரவேண்டும் என்பதன்றி, இன்னவர்க்கு இதனை தரலாமா? என்று என்னுடன் கூடி எண்ணிப் பார்க்காமலும், இதை வைத்துக் கொண்டு நன்றாக வாழலாம் என்று எண்ணாமலும் நீயும் எல்லாருக்கும் அளிப்பாயாக. (நானும் எல்லார்க்கும் அளிப்பேன்).", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.15, p.260", "", "medium", "false"], ["SANG-12-16", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 164” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 164” (section 12.16).", "பாடியவர் : பெருந்தலைச் சாத்தனார் பாடப்பட்டோன் : குமணன் திணை : பாடாண் துறை : பரிசில், கடாநிலை பெருந்தலைவர் சாத்தனார் குமணனைக் கண்டு பெரும் பரிசில் பெற எண்ணினார். முதிர மலைக்கு வந்தார். ஆனால் அங்குக் குமணன் இல்லை. இளங்குமணன் நாட்டைக் கவர்ந்து ஆண்டு வந்தான். அது மட்டுமன்று. குமணனைக் கொல்லவும் எண்ணியிருந்தான். இத்தகைய பகைமையைப் போக்கி அவ்விருவருக்குள் ஒற்றுமையை உண்டாக்கச் சாத்தனார் குமணனிடம் சென்றார். தம் உண்மை எண்ணத்தைப் புலப்படுத்தவில்லை. தமது வறுமையைச் சொல்லிப் பரிசில் வேண்டினார். ஆடு நனி மறந்த கோடு உயர் அடுப்பின் ஆம்பி பூப்பத், தேம்பு பசி உழவாப் பாஅல் இன்மையின் தோலொடு திரங்கி, இல்லி தூர்த்த பொல்லா வறுமுலை சுவைத்தொறும் அழும்தன் மகத்து முகம் நோக்கி, நீரொடு நிறைந்த ஈர் இதழ் மழைக் கண் என் மனையோள் எவ்வம் நோக்கி, நினைஇ நிற் படர்ந்திசினே நற்போர்க் குமண! என் நிலை அறிந்தனை ஆயின் இந்நிலைத் தொடுத்தும் கொள்ளாது அமையலென் அடுக்கிய பண் அமை நரம்பின் பச்சைந ல் யாழ், மண் அமை முழவின், வயிரியர் இன்மை தீர்க்கும் குடிப் பிறந்தோயே. நல்ல போரைச் செய்யும் குமணனே! பலவாக அடுக்கப்பட்ட பண்ணுதல் அமைந்த நரம்புடைய தோலால் போர்க்கப்பட்ட நல்ல யாழையும் மார்ச்சனையை உடைய மத்தளத்தையும் உடைய கூத்தரின் வறுமையைப் போக்கும் குடியில் பிறந்தவன் நீ. சமைத்தல் தொழிலைப் பெரிதும் மறந்துவிட்ட பக்கம் உயர்ந்த என் வீட்டு அடுப்பில் காளான் பூத்துள்ளது. உடலை மெலியச் செய்யும் பசியால் வருந்தி, பால் இல்லாததால் தோல் சுருங்கப் பெற்று, துளை மூடப்பெற்ற வறிய முலையை, வறிதே சுவைக்கும் போதெல்லாம் அழும் குழந்தையின் முகத்தைப் பார்த்து, நீரால் நிறைந்த ஈரமான இமைகளையுடைய கண்ணை உடையவள் என் மனைவி. அவளது வருத்தத்தைக் கண்டு, இந்த வருத்தத்தைப் போக்கக் கூடியவன் நீ என எண்ணி, உன்னிடம் வந்தேன். என் இந்த நிலையை அறிந்து கொண்டாயானால், இந்த வறிய நிலையில் உன்னை வளைந்து வற்புறுத்தியேனும் நின்னிடமிருந்து பரிசிலைப் பெற்றுக் கொள்ளாமல் விடேன்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.16, p.260", "", "hard", "false"], ["SANG-12-17", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 165” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 165” (section 12.17).", "பாடியவர்; : பெருந்தலைச் சாத்தனார் பாடப்பட்டோன் : குமணன் திணை : பாடாண் துறை : பரிசில் விடை பெருந்தலைச் சாத்தனார் காட்டில் குமணனைக் கண்டு தன் வறிய நிலையை மொழிந்தார். அவன் தன் தலையைக் கொய்து கொண்டு போகுமாறு தன் வாளைத் தந்தான். அவ்வாளைக் கையில் கொண்டவராக இளங்குமணனிடம் சென்றார். யான் உன் தமையனைக் கண்டு பாடினேன். அவன் தான் நாடிழந்த துன்பத்தைவிட எனக்குப் பொருள் இல்லாததால், தன் தலையைக் கொய்து கொள்ளுமாறு வாளைத் தந்தான். அதனுடன் வந்தேன். காண்! என்றார். பின்னர், இவ்வுலகத்தில் நிலைபெற விரும்பியவர் புகழை நிலை நிறுத்திச் சென்றனர். மற்றவர் இரந்தவர்க்கு வேண்டியன தராது, இவ்வுலகத்தில் தொடர்பின்றி மறைந்தனர் என்று உரைத்தார். இளங்குமணன் மனம் திருந்தினான். தன் அண்ணனை அணுகித் தன் மனமாற்றத்தை உரைத்துத் திரும்ப அழைத்து வந்து நாட்டை ஆளச் செய்தான். மன்னா உலகத்து மன்னுதல் குறித்தோர் தம் புகழ் நிறீஇத்தா மாய்ந்தனNர் துன் அருஞ் சிறப்பின் உயர்ந்த செல்வர் இன்மையின் இரப்போரக்கு ஈஇயாமையின் தொன்மை மாக்களின் தொடர்பு அறியலNர் தாள் தாழ் படுமணி இரட்டும் பூநுதல் ஆடியல் யானை பாடுநர்ககு ; அருகாக் கேடு இல் நல்லிசை வயமான் தோன்றலைப் பாடி நின்றனென் ஆகக் கொன்னே, பாடு பெறு பரிசிலன் வாடினன் பெயர்தல் என் நாடு இழந்ததனினும் நனி இன்னாது என, வாள் தந்தனனே தலை எனக்கு ஈயத் தன்னின் சிறந்தது பிறிது ஒன்ற இன்மையின், ஆடு மலி உவகையோடு வருவல், ஓடாப் பூட்கை நின் கிழமையோன் கண்டே. இளங்குமணனே! எதுவும் நிலைத்து நிற்காத தன்மையுடைய இந்த உலகத்தில், நிலைபெற வேண்டும் என்று எண்ணியவர். தம் புகழை நாட்டித் தாம் இறந்து போயினர். நெருங்குவதற்குரிய தலைமைத் தன்மை கொண்ட பெருஞ்செல்வர் வறுமையால் தம்மிடம் வந்து இறந்தவர்க்குக் கொடாததால், பழைய கொடைத் தன்மை கொண்ட மக்கள் போலத் தம் பெயரை நிறுத்தி உலகத்துடன் தொடர்ந்து நிலைத்து இருத்தலை அறியாதவர் ஆவார். போரில் புறங்காட்டி ஓடாத கொள்கையை உடைய நின் தமையன் குமணனைப் பார்த்துவிட்டு இங்கு வருகின்றேன். காலில் தாழ்ந்து மணிகள் ஒலிக்pன்ற புள்ளிகளையுடைய வெற்றி பொருந்திய யானைகளைப் பரிசிலாகப் பாடும் இரவலர்க்கு அளிக்கும் குற்றமில்லாத நல்ல புகழையுடைய வலிய குதிரையையுடைய அவனைப் பாடி நின்றேன். நிற்க. பரிசிலன் ஒருவன் பயன் இல்லாமல் வீணே வாடித் திரும்புதல் என் நாட்டை இழந்ததைவிட மிகவும் துன்பம் தரத் தக்கது என்று எண்ணி, அங்குத் தருவதற்குத் தன் தலையைத் தவிர வேறொன்று இல்லாததால் தன் தலையை எனக்ஃகுத் தருவதற்காக வாளைத் தந்தான். அதைப் பெற்றுக் கொண்டு வெற்றி மிகுந்த மகிழ்வுடன் இங்கு வந்தேன்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.17, p.261", "", "hard", "false"], ["SANG-12-18", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 166” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 166” (section 12.18).", "பாடியவர் : ஆவூர் மூலங்கிழார் பாடப்பட்டோன் : சோணாட்டுப் பூங்சாற்றுப் பார்ப்பான் கௌணியன் விண்ணந்தாயன் திணை : வாகை துறை : பார்ப்பன வாகை கேட்கத் தக்கவற்றைக் கேட்டுத் தலை சான்ற யாகத்தால் வெற்றியைப் பெருக்குதல். நன்று ஆராய்ந்த நீள் நிமிர் சடை முது முதல்வன் வாய் போகாது. ஒன்று புரிந்த ஈர் இரண்டின், ஆறுணர்ந்த ஒரு முதுநூல் இகல் கண்டோர் மிகல் சாய்மார், மெய் அன்ன பொய் உணர்ந்து, பொய் ஓராது மெய் கொளீஇ, மூவேழ் துறையம் முட்டின்று போகிய உரை சால் சிறப்பின் உரவோர் மருக! வினைக்கு வேண்டி நீ பூண்ட புலப் புல்வாய்க் கலைப் பச்சை சுவல் பூண் ஞாண் மிசைப் பொலிய, மறங்கடிந்த அருங்கற்பின். அறம் புகழ்ந்த வலை சூடிச், சிறு நுதல் பேர் அகல் அல்குல், சில சொல்லின், பல கூந்தல் நின் நிலைக்கு ஒத்த நின் துணைத் துணைவியர் தமக்கு அமைந்த தொழில் கேட்பக், காடு என்றா நாடு என்ற ஆங்கு ஈர் ஏழின் இடம் முட்டாது நீர் நாண நெய் வழங்கியும், எண் நாணப் பலவேட்டும், மண் நாணப் புகழ் பரப்பியும் அருங்கடிப் பெருங்காலை, விருந்துற்ற நின் திருந்து ஏந்துநிலை, என்றும் காண்க தில் அம்ம யாமே! குடாஅது பொன்படு நெடுவரைப்புயல் ஏறு சிலைப்பின் பூ விரி புது நீர்க் காவிரி புரக்கும் தண் புனல் படப்பை எம்ஊர் ஆங்கண். உண்டும் தின்றும் ஊர்ந்தும் ஆடுகம்; செல்வல் அத்தை யானே, செல்லாது மழை அண்ணாப்ப நீடிய நெடுவரைக் கழை வளர் இமயம் போல, நிலீஇயர் அத்தை நீ நில மிசையானே. நன்றாக ஆராயப்பட்ட நீளமான சடையுடைய முதிய சிவபெருமானின் வாக்கைவிட்டு நீங்காது, அறம் ஒன்றையே பொருந்திய, நான்கு பகுதியுடையதாகி ஆறு அங்கங்களாலும் உணரப்பட்ட ஒரு பழைய நூலான வேதத்துக்கு மாறுபட்ட நூலைக் கண்ட புத்தர் முதலிய மதத்தாரின் மிகுதியைச் சாய்க்க, அவர்களின் மெய் போன்ற பொய்யை மெய் என்று எண்ணாது, உண்மையான பொருளை அவர்களுக்குத் தக்கவாறு சொல்லி, இருபத்தொரு வேள்வித் துறைகளையும் குறைவு இல்லாது செய்து முடித்த புகழ் பொருந்திய அறிவுடையோரின் மரபில் வந்தவனே! வேள்வித் தொழிலுக்கு வேண்டி நீ போர்த்திக் கொண்ட காட்டில் வாழும் புல்வாய்க் கலையின் தோல், உன் தோளின் மீது இடப்பட்ட பூணூல் மீது சிறந்து விளங்க, தீமை நீங்கிய பெறுவதற்கரிய கற்பையும், அற நூலில் கூறப்பட்ட சாலகத்தைச் சூடி, சிறிய நெற்றியையும் அகன்ற அல்குலையும் மென்மையான சொல்லையும் அகன்ற அல்குலையும் மென்மையான சொல்லையும் கூந்தலையும் உடைய உன் நிலைமைக்கு உள்ளம் ஒத்த உன் துணைவியாரான மனைவியர் தாங்கள் தங்கட்கு ஏற்ற உன் துணைவியாரான மனைவியர் தங்கள் தங்கட்கு ஏற்ற ஏவல் தொழிலைக் கேட்டுச் செய்ய, காடு என்றும் நாடு என்றும் சொல்லப்படும் அங்கே, காடடுள் வாழும் ஏழுவகையான பசுவாலும் நாட்டுள் வாழும் ஏழு வகையான பசுவாலும் முட்டாது நீரானது வெட்கமடையுமாறு நெய்யைச் சொரிந்தும், அளவில்லாத பல வேள்விகளைச் செய்தாய், மண்ணின் இடம் போதாத வகையிலே புகழைப் பரப்பினாய். அப்படிப் பெறுவதற்கரிய வேள்வி முடிந்த காலத்தில், விருந்தினர் பொருந்திய உன் மேம்பட்ட நிலையை யாம் இன்று போல என்றும் காண்போமாக. மேற்குத் திக்கில் பொன் விளையும் பெரிய குடகு மலையில் மேகத்தில் இடி இடித்தால், மலர் பரந்த புதிய நீரையுடைய காவிரி, உலகத்தைக் காக்கின்ற குளிர்ந்த நீர்ப் பகுதியை உடைய எம் ஊரில், உண்ண வேண்டியவற்றை உண்டும் தின்ன வேண்டியவற்றைத் தின்றும் ஏறப்படும் ஊர்திகளில் ஏறியும் கொண்டாடச் செல்வேன் யான். நீ, மழை தலை எடுக்க உயர்ந்த நீண்ட பக்கமலைகளையுடைய மூங்கில் வளரும் இமய மலைபோல நிலத்தின் மீது நிலை பெறுவாயாக.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.18, p.263", "", "hard", "false"], ["SANG-12-19", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 167” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 167” (section 12.19).", "பாடியவர் : கோனாட்டு எறிச்சலூர் மாடலன் மதுரைக் குமரனார் - பாடப்பட்டோன் : ஏனாதி திருக்கிள்ளி, திணை : வாகை துறை : அரச வாகை சோழ நாட்டுக் குறுநில மன்னர்களுள் ஏனாதி திருக்கிள்ளி ஒருவன். அவன் சோழ மன்னர்க்குப் படைத்துணையாகிப் பல போர்களைச் செய்தவன். படைக்கலங்களால் புண்பட்ட மேனியன். ஏனாதி என்பது முடி மன்னரால் கொடுக்கப்படும் பட்டப் பெயர். நீயே அமர் காணின் அமர் கடந்து, அவர் படை விலக்கி எதிர் நிற்றலின், வாஅள் வாய்த்த வடு வாழ் யாக்கையொடு, கேள்விக்கு இனியை, கட்கு இன்னாயே, அவரே நிற் காணின் புறங்கொடுத்தலின், ஊறு அறியா மெய் யாக்கையொடு, கண்ணுக்கு இனியர் செவிக்கு இன்னாNர் அதனால் நீயும் ஒன்று இனியை அவரும் ஒன்று இனியர்; ஒவ்வா யாவுள மற்றே வெல் போர்க் கழல் புனை திருந்தடிக் கடு மான் கிள்ளி! நின்னை வியக்கம் இவ்வுலகம்; அஃது என்னோ பெரும? உரைத்திசின் எமக்கே. வெல்கின்ற போரையும் வீரக்கழல் அணிந்த திருந்திய அடியினையும் விரைவாக ஓடும் குதிரையையும் உடைய கிள்ளியே! நீ போரைக் கண்டால் அந்தப் போரை வென்று அப்பகைவரது படையை விலக்கி எதிர் நிற்பதால், வாள் ஏற்படுத்திய வடுப்பொருந்திய உடலுடனே கேட்கும் செவிக்கு இனியனாய் உள்ளாய். ஆனால் கண்ணுக்கு இனியனாய் இல்லை. நின் பகைவர். உன்னைக் கண்ட அளவில் புறம் காட்டி ஓடுகின்றனர். அதனால் புண் படாத உடல் தோற்றத்துடனே கண்ணுக்கு இனியராக உள்ளனர். செவிக்கு இனியர் அல்லர். எனவே, நீயும் ஒன்றில் இனியை. அவரும் ஒன்றில் இனியர். அவர் ஒவ்வாதவை யாவை உள்ளன? இங்ஙனம் இருக்க, உலகம் உன்னை மதிக்கும். அதன் காரணம் யாது? பெருமானே. எனக்குச் சொல்வாய்!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.19, p.264", "", "medium", "false"], ["SANG-12-20", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 168” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 168” (section 12.20).", "பாடியவர் : கருவூர்க் கதப்பிள்ளைச் சாத்தனார் பாடப்பட்டோன் : பிட்டங்கொற்றன் திணை : பாடாண் துறை : பரிசில், இயன்மொழி, அரச வாகை இவன் குதிரை மலைத் தலைவன். சேர மன்னனின் படைத் தலைவன். அருவி ஆர்க்கும் கழை பயில் நனந்தலைக் கறி வளர் அடுக்கத்து மலர்ந்த காந்தள் கொழுங்கிழங்கு மிளிரக் கிண்டிக் கிளையொடு கடுங்கண் கேழல் உழுத பூமி, நன்னாள் வருபதம் நோக்கிக், குறவர் உழாஅது வித்திய பரூஉக்குரற் சிறு திணை முந்து விளை யாணர் நாள் புதிது உண்மார் மரையான் கநற்த நுரை கொள் தீம் பால், மான்தடி புழுக்கிய புலவு நாறு குழிசி, வான் கேழ் இரும் புடை கழாஅது, ஏற்றிச் சாந்த விறகின் உவித்த புன்கம் கூதளங் கவினிய குளவி முன்றில், செழுங்கோள் வாழை அகல் இலைப் பகுக்கும் ஊராக் குதிரைக் கிழவ கூர் வேல், நறை நார்த் தொடுத்த வேங்கை அம் கண்ணி, வடி நவில் அம்பின் வில்லோர் பெரும! கைவள் ஈகைக் கடு மான் கொற்ற! வையக வரைப்பில் தமிழகம் கேட்பப் பொய்யாச் செந்நா நெளிய ஏத்திப் பாடுப என்ப பரிசிலர், நாளும், ஈயா மன்னர் நாண, வீயாது பரந்த நின் வசை இல் வான் புகழே அருவிகள் ஒலிக்கின்ற மூங்கில்கள் வளர்ந்த அகன்ற மலைச்சாரலில்; மிளகுக்கொடி வளர்ந்துள்ளது. அங்கு மலர்ந்த காந்தளின் கொழுவிய கிழங்கை அஞ்சாமையுடைய கேழல் பன்றி தன் இனத்துடன் உழுவதுபோலக் கிளறுகிறது. அவ்வாறு அவை கிளறித் தோண்டிய நிலத்தில் நல்ல நாள் வந்த காரணத்ததால், அதைப் பார்ததுக் குறவர் உழாமலேரயே விதைத்த பருத்த தோகையையுடைய சிறிய திணை விளைந்தது. விளைந்த அந்தக் கதிரை, நல்ல நாளில் புதிதாக உண்ண வேண்டி, காட்டுப்பசுவின் துரையுடன் கூடிய இனிய பாலை, மான் தசை வேக வைத்த புலால் நாறும் பானையின் பக்கத்தைக் கழுவாமல் உலைநீராக வார்ப்பர். சந்தன விறகால் எரித்துச் சோறு சடைப்பர். அந்தச் சோற்றைக் கூதாளியினால் அழகு பெற்ற மலை மல்லிகையின் மணம் கமழும் வீட்டு முன் பக்கத்தில், வாழையின் அகன்ற இலையில் பரிமாறிப் பலருடன் பகுத்து உண்ணும் ஊர்ந்து செல்லப்படாத குதிரை மலைக்குத் தலைவ! கூர்மையான வேலையும் நறை என்ற கொடியின் நாரால் கட்டப்பட்ட வேங்கைப் பூமாலையையும் தீட்டப்பட்ட அம்பையும் உடைய வில் வீரர்களுக்குத் தலைவனே! கையால் கொடுக்கும் கொடைத் தன்மையையும் விரைவாக ஓடும் குதிரையையும் உடைய கொற்றவனே கொடாத மன்னர் நாணம் அடையப் பரந்த நினது வசையில்லாத புகழை, நாற்தோறும், உலகத்து எல்லைக்குள் தமிழ்நாடு கேட்கப் பொய்யாத நல்ல நாக்கு வருந்தும்படி வாழ்த்திப் பாடுவர் என்று பரிசிலர் சொல்லுவர். அதனால் நானும் உன்னிடம் பரிசில் பெற்றுப் பாடுபவனாதல் வேண்டும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.20, p.265", "", "hard", "false"], ["SANG-12-21", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 169” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 169” (section 12.21).", "பாடியவர் : காவிரிபூம்பட்டினத்துக் காரிக்கண்ணனார் பாடப்பட்டோன் : பிட்டங்கொற்றன் திணை : பாடாண் துறை : பரிசில் கடாநிலை நும் படை செல்லுங்காலை, அவர் படை எறித்தெறி தானை மன்னரை எனாஅ, அவர் படை வருஉங் காலை நும் படைக் கூழை தாங்கிய அகல் யாற்றுக் குன்று விலங்கு சிறையின் நின்றனை எனாஅ, அரிதால் அத்தை என் கடும்பினது இடும்பை, இன்னே விடுமதி பரிசில், வென்வேல் இளம்பல் கோசர் விளங்கு படை கன்மார் இகலினர் எறிந்த அகல் இலை முருக்கின் பெருமரக் கம்பம் போலப், பொருநர்ககு ; உலையா நின் வலன் வாழியவே பெரும! உம் படை படையானது பகைவர் மீது போகும்போது அவரது ஆயுதங்களான வேல் முதலானவற்றை உயர்த்தி வீசும் படைக்கு முன்பு நிபாய். பகைவிரன் படை உதிர்த்து வரும்போது உம் படையின் அணியைத் தாங்கி நிற்க வேண்டி, அகலாமான அற்றின் குறுக்கே தடுத்துக் கிடக்கும் மலைபோல அதை; தடுத்து நின்றாய். ஆதலாலர் எந்நாளும் உன்னைக் காணும் காலத்தைப் பெறுவது அரிது. என் சுற்றத்தின் துன்பம் பெரிது. ஆதலால் நீ இப்போதே எனக்குப் பரிசில் தந்து அனுப்புவாயாக. வெற்றிவேலை உடைய இளைய பல கோசர் விளங்கிய படைக்கலம் பற்பவர் மாதறுபட்டு வீசிய அகன்ற இலையுடைய முள் முருங்கை மரமான பெரிய மரத்தால் ஆன தூணாகிய இலக்கைப் போன்று போர’ செய்வார்க்கு அழியாத நின் வெற்றி வாழ்க.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.21, p.266", "", "medium", "false"], ["SANG-12-22", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 170” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 170” (section 12.22).", "பாடியவர் : உறையூர் மருத்துவன் தாமோதரனார் பாடப்பட்டோன் : பிட்டங்கொற்றன் திணை : வாகை துறை : வல்லாண் முல்லை, தானை மறம் மரை பிரித்து உண்ட நெல்லி வேலிப் பரல் உடை முன்றில். அம்குடிச் சீறூர். எல் அடிப்படுத்த கல்லாக் காட்சி வில் உழுது உண்மார் நாப்பண், ஒல்லென இழிபிறப்பாளன் கருங்கை சிவப்ப, வலி துரந்து சிலைக்கும் வண்கண் கடுந்துடி புலி துஞ்சு நெடுவரைக் குடிஞையோடு இரட்டும் மலை கெழு நாடன் கூர் வேல் பிட்டன், குறுகல் ஓம்புமின். தெவ்விர்! அவனே சிறுகண் யானை வெண்கோடு பயந்த ஒளி திகழ் முத்தம் விறலியர்க்கு ஈத்து, நார் பிழிக் கொண்ட வெங்கள் தேறல் பண் அமை நல் யாழ்ப் பாண் கடும்பு அருத்தி, நசைவர்ககு ; மென்மை அல்லது பகைவர்க்கு இரும்பு பயன்படுக்குங் கருங்கைக் கொல்லன் விசைத்து எறி கூடமொடு பொரூஉம் உலைக்கல் அன்ன வல்லாளன்னே. காட்டுப்பசுவால் சிதை நீக்கி உண்ணப்பட்ட நெல்லி மரவேலி கொண்டதாய், அந்நெல்லியில் விதையான பரல் பெருந்திய முற்றம் கொண்ட அழகிய குடிகள் பொருந்திய சிறிய ஊர். அதில் பகல்பொழுது முழுவதும் வேட்டை ஆடித் திரிந்த கல்வியற்ற காட்சியுடைய வில்லாகிய ஏரால் உழுது உண்ணும் வேடர் நடுவில், இழிந்த பிறப்பை உடைய புலையன், தன் வலிய கையானது சிக்க வன்மையுடைய முக்கிக் கொட்டும் கண்ணையுடைய அச்சம் பொருந்திய துடி என்ற கருவி, புலி இருக்கும் மலையில் பேராந்தையுடன் கூடி ஒலிக்கும் இத்தகைய மலைபொருந்திய நாட்டையும் கூரிய Nலையுமுடையவன் பிட்டங் கொற்றன். அவன் சிறிய கண் உடைய யானைக்கொம்பில் பிறந்த ஒளியுடைய முத்துக்களை விறலியர்;க்குப் பரிசிலாக அளிப்பான். நாரால் வடித்து எடுக்கப்பட்ட விரும்பத்தக்க கள்ளைப் பண் அமைந்த நல்ல யாழை உடைய பாணர் சுற்றத்தை அருந்தச் செய்வான். இப்படித் தன்னிடம் பரிசில் பெற விரும்பி வந்தவர்க்கு மென்மையானவனாக இருப்பானே அல்லாது, அவன் பகைவர்க்கு இரும்பைப் பயன்படுத்தும் வலிய கையினனான கொல்லன் விசையுடனே அடித்த சம்மட்டி அடியை டீஏற்று மாறுபடும் (கொல்லன்) உலைக்களத்தில் உள்ள அடைகல் போன்ற வன்மையான ஆண்மையுடையவன். எனவே, பகைவரே, அவனை நெருங்குவதினின்று உங்களைப் பாதுகாத்துக்கொள்ளுங்கள். 12.23 .பாடல் : 171 பாடியவர் : காவிரிப்பூம்பட்டினத்துக் காரிக்கண்ணனார் பாடப்பட்டோன் : பிட்டங்கொற்றன் திணை : பாடாண் துறை : இயன்மொழி இன்ற செலினும் தருமே, சிறுவரை நின்று செலினும் தருமே, பின்னும் முன்னே தந்தனென் என்னாது, துன்னி வைகலும் செலினும், பொய்யலன் ஆகி யாம் வேண்டியாங்கு எம் வறுங்கலம் நிறைப்போன், தான் வேண்டியாங்குத் தன் இறை உவப்ப அருந்தொழில் முடியரோ திருந்து வேல் கொற்றன், இன மலிகதச் சேக் களனொடு வேண்டினும். கள மலி நெல்லின் குப்பை வேண்டினும், அருங்கலம் களிற்றொடு வேண்டினும் பெருந்தகை பிறர்க்கும் அன்ன அறத் தகையன்னே அன்னன் ஆகலின், எந்தை உள்ளடி முள்ளும் நோவ உறாற்க தில்ல, ஈவோர் அரிய இவ் உலகத்து, வாழ்வோர் வாழ அவன் தாள் வாழியவே. திருந்திய வேலையுடை யகொற்றன், பெருந்தகையாளன்! இனமான மிக்க எருதுகளைத் தொழுவத்துடன் தரவேண்டும் என வேண்டினாலும், களத்த்pல் உள்ள மிக்க நெற்குவியலைத் தரவேண்டும் என வேண்டினாலும், அரிய அணிகளை ஆண் யானைகளும் தரவேண்டும் என வேண்டினாலும், நமக்கே அல்லாமல் மற்றவர்க்கும் அவற்றை எல்லாம் அளிக்கும் இயல்புடையவன். இன்று சென்றாலும் வேண்டியவற்றை தருவான். சிறிது நாள் கழித்:துச் சென்றாலும் வேணடியவற்றைத் தருவான். முன்னே தந்தோம் என்று எண்ணாமல், நாள்தோறும் பழகிச் சென்றாலும் பொய்யாதவனாய் யாம் விரும்பியபடியே எம் வெற்றுக் கலத்தை நிரப்புவான். அவன், தான் விரும்பியபடியே தன் அரசன் மகிழச் செய்வதற்கரிய போர்ச் செயல்களை முடிப்பானாக! இத்தகைய எம் தலைவனின் உள்ளங்காலிலே முள்ளும் வருந்தச் சென்று தைக்காது இருத்தல் வேண்டும். இவ்வுலகத்தில் உயிர் வாழ்வோர் வாழுமாறு அவன்தாள்கள் வாழ்க..", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.22, p.267", "", "hard", "false"], ["SANG-12-24", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 172” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 172” (section 12.24).", "பாடியவர் : வடம வண்ணக்கன் தாமோதரனார் பாடப்பட்டோன் : பிட்டங்கொற்றன் திணை : பாடாண் துறை : இயன்மொழி வடமவண்ணக்கன் தாமோதரனார். ஒரு கால் இப்புலவர் பிட்டங் கொற்றனிடம் பரிசில் பெற்றார். அவர் தாம் பெற்ற அவ்வின்பத்தைப் பாணன் ஒருவன் தன் உறவினர்ககு ; உரைப்பது போல விள்க்கியுள்ளார். ஏற்றுக உலையே! ஆக்குக சோறே! கள்ளும் குறைபடல் ஓம்புக! ஒள்ளிழைப் பாடுவல் விறலியர் கோதையும் புனைக! அன்னவை பலவும் செய்க என்னதூஉம் பரியல் வேண்டா, வருபதம் நாடி ஐவனங் காவல் பெய் தீ நந்தின், ஒளி திகழ் திருந்து மணி நளி இருள் அகற்றும் வன்புல நாடன் வயமான் பிட்டன், ஆர் அமர் கடக்கும் வேலும் அவன் இறை மா வள் ஈகைக் கோதையும், மாறு கொள் மன்னரும் வாழியர் நெடிதே ஐவன நெல்லைக் காப்பவர் காவலுக்கு இட்ட தீ அங்கு அழிந்தNபுhது, ஒளி விளங்கும் மாணிக்கம் இருளை விலக்கும் வலிய நிலமான மலை நாடன் பிட்டங்கொற்றன். அவரன் வலிய குதிரையை உடையவன். அவனுடைய போரை வெல்லும் வேலும், அவனுடைய தலைவனான ;பெரிய வள்ளன்மையுடைய சேரமான் கோதை என்பானும், அவனுடன் பகை கொண்ட மன்னரும் நீண்ட காலம் வாழ்க என வாழ்த்துவதே நாம் செய்ய வேண்டுவது. இனிமேல் உணவு எவ்வாறு கிடைக்கும் என்றுஞ நீங்கள் வருந்த வேண்டா. எனவே, உலை வைக்க! சோறாக்குக. மதுவை நிரம்ப உண்டாக்குக. விளங்கும் அணிகளை அணிந்த பாடுவதில் வல்ல விறலியரே! மாலையைச் சூடுக. அத்தகைய பிற செயல்களையும் செய்க! என பாணன் உரைத்தான்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.24, p.269", "", "medium", "false"], ["SANG-12-25", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் :173” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் :173” (section 12.25).", "பாடியவர் : சோழன் குளமுற்றத்துத் துஞ்சிய கிள்ளிவளவன் - பாடப்பட்டோன் : சிறுகுடி கிழான் பண்ணன் திணை : பாடாண் துறை : இயன்மொழி சிறுகுடி என்பது சோழ நாட்டில் உள்ள ஓர் ஊர். இப்பண்ணன் வேளாளர் தலைவன். சோழப் பேரரசன் குளமுற்றத்துத் துஞ்சிய கிள்ளிவளவன். தான் பேரரசனாயினும் பண்ணன் எளியன் என்று எண்ணாது அவனுடன் நட்புக் கொண்டிருந்தான். பண்ணனின் கொடைச் சிறப்பு இம்மன்னனைக் கவர்ந்தது. அதை விளக்குகின்ற பாடல் இது. யான் வாழும் நாளும் பண்ணன் வாழிய! பாணர் காண்க, இவன் கடும்பினது இடும்பை! யாணர்ப் பழுமரம் புள் இமிழ்ந்தன்ன ஊண் ஒலி அரவம் தானும் கேட்கும், பொய்யா எழிலி பெய்விடம் நோக்கி, முட்டை கொண்டு வன்புலம் சேரும் சிறுநுண் எறும்பின் சில் ஒழுக்கு ஏய்ப்பச், சோறுடைக் கையர் வீறு வீறு இயங்கும் இருங்கிளைச் சிறாஅர்க் காண்டும் கண்டும், மற்றும் மற்றும் வினவுதும், தெற்றெனப், பசிப் பிணி மருத்துவன் இல்லம் அணித்தோ சேய்த்தோ, கூறுமின் எமக்கே? நான் வாழக்கூடிய வாழ்நாளையும் பெற்றுப் பண்ணன் வாழ்வானாக. பாணரே! இந்தப் பாணனது சுற்றத்தின் வறுமையைக் காணுங்கள்! புதிய விளைவை உடைய பழுத்த மரத்தில் பறவைக் கூட்டம் ஒலித்தாற் போன்ற. உணவால் உண்டாகும் ஆரவாரம் கேட்கும். தவறாது மழை பெய்யப் போகும் காலத்தைப் பார்த்துத் தம் தம் முட்டைகளைக் கொண்டு மேட்டு நிலத்தை அடையும் சிறிய நுட்பமான எறும்பு வரிசை கோ, சோற்றைச் சுற்றத்துடன் கூடிய கையினராய் வௌ;வேறாகப் போகின்ற பெரிய சுற்றத்துடன் கூடிய பிள்ளைகளைக்காண்போம். இப்படிப் பார்த்த பின்பும் பவசி வருத்தத்தாலும் வழி நடந்து வந்த வருத்தத்தாலும் மேலும் மேலும் விருப்புக் கொண்டு கேட்கின்றோம். பசிப்பிணியைப் போக்கும் ;மருத்துவனின் மனை அருகில் உள்ளதோ தொலைவில் உள்ளதோ எங்களுக்குச் சொல்லுங்கள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.25, p.270", "", "medium", "false"], ["SANG-12-26", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 174” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 174” (section 12.26).", "பாடியவர் : மாறோக்கத்து நப்பசலையார் பாடப்பட்டோன் : மலையமான் சோழிய வேனாதி திருக்கண்ணன் திணை : வாகை துறை : அரச வாகை அணங்குடைஅ வுணர் கணம் கொண்டு ஒளித்தெனச் சேண் விளங்கு சிறப்பின் ஞாயிறு காணாது, இருள் கண் கெடுத்த பருதி ஞாலத்து இடும்பை கொள் பெருவரல் தீரக், கடுந்திறல் அஞ்சன உருவன் தந்து நிறுத்தாங்கு, அரசு இழந்து இருந்த அல்லல் காலை முரசு எழுந்து இரங்கும் முற்றமொடு, கரை பொருது இரங்கு புனல் நெரிதரு மிகு பெருங்காவிரி மல்லல் நன்னாட்டு அல்லல் தீரப், பொய்யா நாவிற் கபிலன் பாடிய மையணணி நெடுவரை ஆங்கண், ஒய்யெனச் செருப் புகல் மறவர் செல் புறங்கண்ட எள் அறு சிறப்பின் முள்@ர் மீமிசை, அருவழி இருந்த பெருவிறல் வளவன் மதி மருள் வெண்குடை காட்டி, அக்குடை புதுமையின் நிறுத்த புகழ் மேம்படுந! விடர்ப்புலி பொறித்த கோட்டைச் சுடர்ப் பூண், சுரும்பு ஆர் கண்ணிப், பெரும் பெயர் நும் முன் ஈண்டுச் செய் நல்வினை யாண்டுச் சென்று உணீஇயர், உயர்ந்தோர் உலத்துப் பெயர்ந்தனன் ஆகலின், ஆறு கொள் மருங்கின் மாதிரம் துழவும் கவலை நெஞ்சத்து அவலந்தீர, நீ தோன்றினையே, நிரைத்தார் அண்ணல்! கல் கண் பொடியக் கானம் வெம்ப, மல்கு நீர் வரைப்பில் கயல் பல உணங்கக் கோடை நீடிய பைதறு காலை, இரு நிலம் நெளிய ஈண்டி, உரும் உரறு கருவிய மழை பொழிந்தாங்கே மற்றவரை வருத்தும் அச்சம் பொருந்திய அசுரர் ஞாயிற்றை எடுத்துக் கொண்டு போய் மறைத்தனர். தெலைவில் விளங்கக்கூடிய அஞ்ஞாயிற்றைக் காணாததால் இருளானது உலகத்தாரின் கண்ணை மறைத்த வட்டமான உலகத்தின் நோய் கொண்ட துன்பம் நீங்குமாறு, மிகுந்த வன்மையுடைய மை போன்ற கரிய நிறம் கொண்ட மேனியனான திருமால் அந்த ஞாயிற்றைக்கொண்டு வந்து இந்த உலகத்தின் இரள் நீங்குவதற்காக வானத்தில் நிறுத்தினான். அதுபோலப் பகை மன்னருடன் போரிட்டுத் தோற்றுப் போனதால், மன்னன் நாட்டை விட்டு மறைந்தான். ஆதலால் தம் மன்னனை இழந்த நாடு வருந்தியது. அக்காலத்தில் முரசு ஒலிக்கும் அரண்மனையின் கரையை மோதிடும் நீரால் உடைந்து ஆழ்ந்து ஓடும் மிக்க நீரையுடைய காவிரியையுடைய நாட்டில் துன்பம் நீங்கப் பொய்க்காத நாவையுடைய கபிலனால் புகழ்ந்து பாடப்பட்ட மேகம் பொருந்திய பெரிய மலையில், விரைவாகப் போரை விரும்பும் மறவர் புறங்காட்டி ஓடுதலைக் கண்ட குற்றம் இல்லாத,. மற்றவரால் பார்ப்பதற்கு அரிய இடத்த்pல் இருந்த சோழனின் திங்கள் போன்ற வெண் குடையை வெளிப்படுத்தித் தோற்றுவித்து அக்குடைக்குப் புதுமை உண்டாக்கி நிலை பெறச் செய்தாய்! புகழ் மேம்படும் இயல்பு கொண்டவனே! மாலை சூடியவனே! மலைக்குகையில் வாழும் புலியின் வடிவான இலாஞ்சனை எழுதப்பட்ட கோட்டையையும், வண்டுகள் ஒலிக்கும் மாலையையும் மிக்க புகையையும் உடைய உன் தன்தை, இந்த உலகத்தில் செய்யப்பட்ட அறத்தின் பயனைத் தெய்வ உலகில் சென்று அனுவிக்க வேண்டிச் சென்றான். ஆதலால் நல்ல நெறியை அழித்த பக்கம் உடைய திசைகளில் எல்லாம் சூழ்ந்த கவலையுடைய மனதில் வருத்தம் கெட, மலையானது அழிய, காடு தீ மிக, மிக்க நீர் எல்லையையுடைய நீர்நிலைகள் பலவும் வற்ற, பெரிய கோடை பொருந்திய பசுமை எங்கும் நீங்கப் பெற்ற காலத்தில், நிலம் குழிந்து போகும்படி திரண்டு இடி இடித்து மின்னல் முதலியவற்றை உடைய மழை பெய்தாற் போல நீ தோன்றினாய். ஆதலால் இந்த உலகத்துக்குக் குறை யாது இருக்கின்றது? ஒன்றுமில்லை.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.26, p.270", "", "hard", "false"], ["SANG-12-27", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 175” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 175” (section 12.27).", "பாடியவர் : கள்ளில் ஆத்திரையனார் பாடப்பட்டோன் : ஆதனுங்கன் திணை : பாடாண் துறை : இயன்மொழி இவன் ஒரு குறுநில மன்னன். வேங்கடத்தைச் சார்ந்த நாடு இவனுடையது. இப்போது திருமால் கோயில் கொண்டுள்ள பகுதியே ஆதன் நுங்கன் ஆண்ட பகுதி என்பர். இவனைக் கள்ளில் ஆத்திரையனார் என்ற புலவர் பாடியுள்ளார். கள்ளில் என்பது தொண்டை நாட்டில் உள்ள ஊர். எந்தை வாழி ஆதனுங்க! என் நெஞ்சம் திறப்போர் நின் காண்குவரே! நின் யான் மறப்பின், மறக்குங் காலை, என் உயிர் யாக்கையின் பிரியும் பொழுதும், என் யான் மறப்பின், மறக்குவென்,, வென்வேல் விண் பொரு நெடுங்குடைக் கொடித்தேர் மோரியர் திண் கதிர்த் திகிரி திரிதரக் குறைத்த உலக இடை கழி அறைவாய் நிலைஇய மலர்வாய் மண்டிலத்து அன்ன, நாளும் பலர் புரவு எதிர்ந்த அறத்துறை நின்னே ஆதன் நுங்கன் என்ற பெயர் உடையவனே! என் தலைவனே! வெள்ளிவேல், உயர்ந்த குடை, கொடிகள் கட்டப்பட்ட தேர் ஆகியவற்றை உடைய மோரிய மன்னரின் திண்மையான சக்கரம் இயங்குவதற்காக வெட்டப்பட்ட வெள்ளி மலைக்கு அப்பால் உள்ள உலகத்துக்குச் செல்லும் இடை வழியான அந்தப் பிளவுபட்ட வாயினில், தேவர்கள் நிறுத்தப்பட்டு இருபொழுதும் நிலையாக விளங்கும் சூரிய மண்டலத்தைப் போல், நாள்தோறும் இரவு பகல் என்னாது பலரையும் காக்கும் அறத்துறை நீ ஆவாய். நான் ஒன்றைச் சொல்ல நினைத்தால் உன் புகழே அல்லாது சொல்லாததால் என் நெஞ்சத்தை வெளிப்படுத்திக் காண்பவர் அங்கு உன்னையே காண்பர். உன்னை நான் மறப்பதாயின், மறக்குங் காலத்தைச் சொல்வேன்., கேட்பாயாக, என் உயிர் என் உடலை விட்டு நீங்கும் காலத்தில் என்னை மறக்கும் நிலை உண்டாயின், அப்போது மறப்பேன், அதுவன்றி மற்றைப் போதில் மறவேன். நீ வாழ்க!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.27, p.272", "", "medium", "false"], ["SANG-12-28", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 176” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 176” (section 12.28).", "பாடியவர்; : புறத்திணை நன்னாகனார் பாடப்பட்டோன் : ஓய்மான் நல்லியக்கோடன் திணை : பாடாண் துறை : இயன்மொழி ஓய்மான் நாடு என்பது திண்டிவனத்தைச் சார்ந்த பகுதி. ஓய்;மான் என்பது ஓய்மான் நாட்டை உடையவன் என்று பொருள்படும். நல்லியங்கோடன் என்பது இயற்பெயர். ஓவியர் குடியில் தோன்றியவன். ஓரை ஆயத்து ஒண்தொடி மகளிர் கேழல் உழுத இருஞ்சேறு கிளைப்பின், யாமை ஈன்ற புலவு நாறு முட்டையைத் தேன் நாறு ஆம்பல் கிழங்கொடு பொறூஉம் இழுமென ஒலிக்கும் புனலம் புதவின் பெரு மாவிலங்கைத் தலைவன், சீறியாழ் இல்லோர் சொன்மலைi நல்லியக்கோடனை உடையை வாழி என் புணர்ந்த பாலே! பாரி பறம்பின் பனிச் சுனைத் தெண்ணீர் ஓரூர் உண்மையின் இகழ்ந்தோர் போலக் காணாது கழிந்த வைகல், காணா வழிநாட்கு இரங்கும் என் நெஞ்சம் அவன் கழிமென் சாயல் காண்தொறும் நினைந்தே வள்ளல் பாரியினது பறம்பு நாட்டில் குளிர்ந்த சுனையின் தெளிந்த நீர், ஊரில் உள்ளதால், அதனை விரும்பும் போது அருந்தலாம் என்று மனம் நெகிழ்ந்திருப்பவரைப் போல, என் நெஞ்சம் அவன் (நல்லியக்கோடன்) சாயலைக் காணும்போதெல்லாம் (அவனை) காணாமல் கடந்த சில நாட்கள், நாட்கள் அல்ல என்று நினைத்து, அவனுடன் உண்டான நட்பு இன்று போல என்றும் இருக்க வேண்டுமே என்று ;வரும் நாட்களுக்காக இரங்குகின்றது. என்னுடன் சேர்ந்த விதியே! விளையாட்டுக் கூட்டத்தில் வளையலை அணிந்த மகளிர் கேழல் பன்னி தோன்டிய கரிய சேற்றினைக் கிளறினால் அதில் ஆமை இட்ட புலால் நாற்றம் வீசும் முட்டையைத் தேன் மணம் கமழும் ஆம்பல் கிழங்குடனே பெறும் இயல்புடையது மாவிலங்கை. அது இழும் என ஒலிக்கும் ;ஓடுகின்ற மதகுகளையுடையது. மாவிலங்கை என்ற ஊர்க்குத் தலைவனும் சிறிய யாழையுடைய வறியவர் பாடும் புகழ் மாலை சூடுபவனுமான நல்லியக் கோடனைத் துணையாக உடையாய்! ஆதலால் உனக்கு என்ன குறை? நீ வாழ்வாயாக!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.28, p.273", "", "medium", "false"], ["SANG-12-29", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் :177” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் :177” (section 12.29).", "பாடியவர் : ஆவூர் மூலங்கிழார் பாடப்பட்டோன் : மல்லிகிழான் காரியாதி திணை : பாடாண் துறை : இயன்மொழி மல்லி என்ற ஊரன் தலைவன் காரியாதி. இவன் பரிசிலர்க்கு, வேண்டுவனவற்றை அளிப்பவன். ஆவூர் மூலங்கிழார் அவனுடைய கை வண்மையைக் கண்டார். அதனை இப்பாடலில் விரித்துரைத்துள்ளார். ஒளிறு வாள் மன்னர் ஒண் சுடர் நெடுநகர் வெளிறு கண் போகப் பன்னாள் திரங்கிப், பாடிப் பெற்ற பொன் அணி யானை, தமர் எனின், யாவரும் புகுப, அமர் எனின் திங்களும் நுழையா எந்திரப்படு பழைக், கள் மாறு நீட்ட நணி நணி இருந்த குறும்பல் குறும்பின் ததும்ப வைகிப், புளிச் சுவை வேட்ட செங்கண் ஆடவர் தீம் புளிக் களாவொடு துடரி முனையின், மட்டு அறல் நல் யாற்று எக்கர் எறிக், கருங்கனி நாவல் இருந்து கொய்து உண்ணும் பெரும் பெயர் ஆதி, பிணங்கு அரில் குடநாட்டு எயினர் தந்த எய்ம்மான் எறிதசைப் பைஞ்ஞிணம் பெருத்த பசு வெள் அமலை, வருநர்க்கு வரையாது தருவனர் சொரிய, இரும் பனம் குடையின் மிசையும் பெரும் புலர் வைகறைச் சீர் சாலாதே. காரியாதிக்கு வேண்டியவரானால் எல்லாரும் எளிதில் புகுவர். போர் என்றால் சந்திரனும் உள்ளே நுழைய முடியாது. எந்திரப் பொறிகள் பல ஒணுருவர் நீட்டிக் கொடுக்கும் படியாக ஒன்றுக்கு ஒன்று குறுகிய பல அரண்களையுடையது. அத்தகைய அரணில் இருந்து அக்கள்ளை நிறைய உண்டு காலம் கழித்து, பின்பு செருக்கால் புளிச்சுவையை விரும்பும் ஆண் மக்கள் இனிய களாப்பழத்துடன் துடரிப் பழத்தையும் தின்பர். அதிலும் வெறுப்பு ஏற்பட்டால், கரையில் உள்ள மரத்தின் தேன் சிந்துகின்ற நல்ல காட்டாற்றின் மணல் திட்டல் ஏறிக்கரிய நாவல் பழத்தைப் பறித்து உண்பர். இத்தகைய ஊரின் தலைவன் புகழ்பெற்ற ஆதி. அவனது செடி கொடிகள் பின்னிக் கிடக்கின்ற நாட்டை உடைய குடநாட்டில் வேடர் எய்து கொண்டு வந்த எய்ப்பன்னறியின் தசை கலந்த செவ்விய சோற்றுக் கட்டியை வருபவர்க்கு எல்லாம் வரையாது கொண்டு வந்து அவன் கொடுப்பான். கொடுக்க, இரவலர் பெரிய பனை ஓலையால் ஆன குடையிலே பெற்று உண்டு, மகிழ்வர். இத்தகைய இயல்புடைய விடியற்காலையில் காணும் அவனதுத கொடைக் காட்சிக்கு, விளங்கும் வாளையுடைய மன்னரின் ஒளி பொருந்திய அரண்மனையில் கண் ஒளி கெப் பலநாள் நின்று உலர்ந்து அங்குப் பாடிப்பெற்ற பொன் அணி அணிந்த யானை நிகராகாது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.29, p.274", "", "hard", "false"], ["SANG-12-30", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 178” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 178” (section 12.30).", "பாடியவர் :ஆவூ;;ர் மூலங்கிழார் பாடப்பட்டோன் : பாண்டியன் கீரஞ்சாத்தன் திணை : வாகை துறை : வல்லாண் முல்லை பாண்டியர்க்குக் கீழ்ப்பட்ட குறுநிலத் தலைவன். சாத்தன் என்பது இயற்பெயர். கீரன் என்பது தந்தையின் பெயர். எனவே, கீரன் சாத்தன் என வழங்கப் பெற்றான். கந்து முனிந்து உயிர்ககு ; ம் யானையொடு, பணை முனிந்து கால் இயல் புரவி ஆலும் ஆங்கண், மணன் மலி முற்றம் புக்க சான்றோர் உண்ணார் ஆயினும் தன்னொடு சூளுற்று, உண்மென இரக்கும் பெரும் பெயர்ச் சாத்தன் ஈண்டோர் இன் சாயலனே, வேண்டார் எறிபடை மயங்கிய வெருவரு ஞாட்பின், கள்ளுடைக் கலத்தர் உள்@ர்க் கூறிய நெடுமொழி மறந்த சிறுபேராளர் அஞ்சி நீங்கும் காலை, ஏமமாகத் தான் முந்துறுமே. தான் கட்டியிருக்கும் கட்டுத்தறியை வெறுத்துப் பெருமூச்சுவிடும் யானையுடன், தான் உள்ள பந்தியை (கொட்டிலை) வெறுக்கின்ற காற்றைப்போன்று விரைவாக ஓடும் குதிரை ஆராவாரம் செய்யும். அங்கு மணல் மிக்க வீட்டு முன் பக்கத்தில் புகுந்த சான்றோர், அப்போது உள்ளார் ஆயினும் தன்னைச்சார்த்திச் சூள் உரைத்து உண்க என வேண்டிக் கொள்ளும் பெரும்புகழ் உடையவன் சாத்தன். இத்தகைய அவன் எம் போன்றவரிடத்தில் மென்மையான இயல்புடையவன். ஆயினும், பகைவர் எறியும் படைக்கலம் மிக்க அஞ்சதக்க போர்க்களத்தில் வீர பானத்தையுடைய கலம் கொண்டவராய், அதனை உடைய செருக்கினாலே ஊரினுள் சொன்ன வீரமுடைய சொல்லைப் போரில் மறந்த சிறிய பேராண்மையுடையவர், அச்சம் கொண்டு போர்க்களத்தினின்று புறம்காட்டி ஓடும்போது அவர்ககு ; அரணாக, அவன் முன் நின்று காப்பான்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.30, p.275", "", "medium", "false"], ["SANG-12-31", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 179” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 179” (section 12.31).", "பாடியவர் : வடநெடுந்தத்தனார் பாடப்பட்டோன் : நாலை கிழவன் நாகன், திணை : வாகை துறை : வல்லாண் முல்லை நல்லூர் என்பது நாலை என்று மருவியது. பாண்டிய நாட்டில் உள்ளது நாலூர். அருப்புக்கோட்டைப் பகுதியில் உள்ளது என்பர். அந்த ஊருக்குத் தலைவன் ‘நாலை கிழான்’ எனப் பெற்றான். நாகன் என்பது இயற்பெயர். “ஞால மீமிசை வள்ளியோர் மாய்ந்தென, ஏலாது கவிழ்ந்த என் இரவல் மண்டை மலர்ப்போர் யார்?” என வினவலின், மலைந்தோர் விசி பிணி முரசமொடு மண் பல தந்த திருவீழ் நுண் பூண் பாண்டியன் மறவன், படை வேண்டுவழி வாள் உதவியும் வினை வேண்டுவழி அறிவு உதவியும், வேண்டுப வேண்டுப வேந்தன் தேஎத்து அசை நுகம் படாஅ ஆண் தகை உள்ளத்துத் தோலா நல்லிசை நாலை கிழவன் பருந்து பசி தீர்க்கும் நற்போர்த் திருந்து வேல் நாகன் கூறினர் பலரே. இந்த உலகத்தில் கொடைத் தன்மையுடையவர் இறந்துபோக, அதனார் பிறரிடம் செ;னறு ஏற்காமல் கவிழ்நதுபோன என் உண்கலத்தை, உண்ணும் உணவை இட்டு மலர்த்த வல்லவர் யார் என்று கேட்டோம். அப்போது. பகைவரின் வலித்துக் காட்டப்பட்ட முரசத்துடன் நாடு பலவற்றை வென்று கொண்ட திருமகள் விரும்புனம் நுட்பமான அணி பலவற்றையும் உடைய பாண்டியனின் மறவன், பாண்டியனுக்குப் படை வேண்டும் போது படை உதவியும், அரசியல் கருமச் சூழ்சச ; p வேண்டும்பொதுஅமைச்சியலுடன் நின்று அறிவு உதவியும் வருபவன். இவ்வாறு பல விதமாக உதவி, தான் பூண்ட நுகம் ஒரு பக்கத்தில் சாய்ந்து தாழ்ந்து தளராமல் செலுத்தும் பகட்டைப் போல் வீரத்திர்லும் சூழ்சச ; pயிலும் தளர்ச்சி அடையாத வீரம் பொருந்திய ஊக்கத்தையும், தோலவி காணாத நல்ல புகழையும் உடைய நாலை கிழவனும் பருந்தின் பசி தீர்க்கும் நல்ல போihச் செய்யும் திருந்திய வேலைக் கொண்ட நாகனுமான வள்ளல் உள்ளான் என்று பலரும் கூறினர். அதனார் உன்னிடம் யாம் வந்தோம்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.31, p.275", "", "medium", "false"], ["SANG-12-32", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 180” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 180” (section 12.32).", "பாடியவர் : கோனாட்டு எறிச்சலூர் மாடலன் மதுரைக் குமரனார் - பாடப்பட்டோன் : ஈர்ந்தூர் கிழான் தோயன் மாறன் திணை : வாகை துறை : வல்லாண் முல்லை, பாணாற்றுப்படை நிரப்பாது கொடுக்கும் செல்வமும் இலனே இல்லென் மறுக்கும் சிறுமையும் இலனே இறையுறு விழுமம் தாங்கி அமர் அகத்து இரும்பு சுவைக் கொண்ட விழுப்புண் நோய் தீர்ந்து மருந்து கொள் மரத்தின் வாள் வடு மயங்கி வடுவின்றி வடிந்த யாக்கையன் கொடையெதிர்ந்து ஈர்ந்தையோனே, பாண் பசிப் பகைஞன், ஈர்ந்தையோனே, பாண் பசிப் பகைஞன், இன்மை தீர வேண்டின் எம்மொடு நீயும் வம்மோ முதுவாய் இரவல! யாம் தன் இரக்கும் காலைத் தான் எம் உண்ணா மருங்குல் காட்டித் தன் ஊர்க் கருங்கைக் கொல்லனை இரக்கும் திருந்து இலை நெடுவேல் வடித்திசின் எனவே. பாணரின் பசியைப்பொக்குபவன் ஈர்ந்தை என்ற ஊரிலே உள்ளான். அவன் நாள்தோறும் தொடர்ந்து கொடுக்கும் செல்வம் பெற்றவன் அல்லன். இங்ஙனம் வறியவனாயினும் தன்னிடம் வந்து இரந்தவர்க்கு இல்லை என்று ;சொல்லி மறுக்குடம் கீழான குணம் கொண்டவன் இல்லை. மற்ற மன்னர்ககு; ப் போரால் வந்த துன்பத்தைத் தான் பொறுத்து, அந்தப் போரில் படைக்கலங்கள் ஏற்படுத்திய சிறந்த புண்ணான நோய் நீங்கி, மருந்து எடுத்த (பால் எடுக்கப்பட்ட அத்தி) மரத்தினைப் போல வாளால் உண்டான வடுக்கள் ஒன்றுடன் ஒன்று கலந்து விளங்கும் ஆண்மைக் குறைவின்மை உடையவன். வசையில்லாத உடலை உடையவன். கொடைத் தன்மையை மேற்கொண்டவன். அவனிடம் சென்று அவனை இரந்தால், அவன்எம் பசித்த வயிற்றைக்காட்டித் தன் ஊரில் உள்ள கருங்கையையுடைய கொல்லனைத் திருந்திய வேலை வடித்துத் தருவாயாக என்று வேண்டிக் கொள்வான். முதிய வாயையுடைய இரவல! உன் பசி நீங்க வேண்டுமானால்என்னுடன் வா!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.32, p.276", "", "medium", "false"], ["SANG-12-33", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 181” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 181” (section 12.33).", "பாடியவர் : சோணாட்டு முகையலூர்ச் சிறுகருந்தும்பியார். பாடப்பட்டோன் : வல்லார் கிழான் பண்ணன், திணை : வாகை துறை : வல்லாண் முல்லை மன்ற விளவின் மனை வீழ் வெள்ளில், கருங்கண் எயிற்றி காதல் மகனொடு, கான இரும் பிடிக் கன்று தலைக்கொள்ளும் பெருங்குறும்பு உடுத்த வன்புல இருக்கைப் புலாஅ அம்பின் போர் அருங்கடி மிளை வலாஅரோனே, வாய்வாள் பண்ணன், உண்ணா வறுங்கடும்பு உய்தல் வேண்டின், இன்னே சென்மதி நீயே, சென்று அவன் பகைப்புலம் படரா அளவை நின் பசிப் பகைப் பரிசில் காட்டினை கொளற்கே. மன்றத்தினிடையே (பொதுவிடத்தில்) வளர்ந்துள்ள விளாமரத்தின் மனையில் எழுந்த விளாம்பழத்தைக் கரிய கண்ணையுடைய மறத்தியரின் புதல்வனுடனே, காட்டில் வாழும் கரிய யானையினது கன்றும் வந்து எடுக்கும் இயல்புடை பெரிய அரண் சூழ்ந்த வன்மையான நிலத்தின் ஊரான இருப்பினையும், புலால் நாறம் அம்பையும் உடைய வல்லார் என்ற ஊரில் உள்ளான், தப்பாத வாளையுடைய பண்ணன், உணவு உண்ணாத நின் வறி ச
