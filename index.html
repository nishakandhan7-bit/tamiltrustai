கை – பாலை (1–50): “பாடல் : 8(27) : தலைவி தோழியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (1–50): Explain the poem/passage titled “பாடல் : 8(27) : தலைவி தோழியிடம் கூறியது” (section 7.10).", "பாடியவர் : வெள்ளிவீதியார் கன்றும் உண்ணாது, கலத்தினும் படாது, நல்ஆன் தீம்பால் நிலத்து உக்காஅங்கு, எனக்கும் ஆகாது, என் ஐக்கும் உதவாது, பசலை உணீஇயர் வேண்டும் திதலை அல்குல் என் மாமைக் கவினே. நல்ல பசுவின் இனிய பாலை கன்றும் உண்ணாமருலும், அதனைப் பராமரிக்கும் உடையவரும் தன் பாத்திரத்தில் கறக்காமலும் பயனின்றி மண்ணில் சிந்தி அழிவதைப் போல் படர்ந்த அல்குலையுடைய என்னுடைய, மாமையாகிய பேரழகு, எனக்கு அழகு தருவதாகவோ, என் தலைவனுக்கு இன்பம் பயப்பதாகவோ இல்லாமல், பசலையால் விரும்பி உண்ணப்படுகின்றது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 7, section 7.10, p.154", "", "medium", "false"], ["SANG-7-11", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (1–50): “பாடல் : 9(28) : தலைவி தோழியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (1–50): Explain the poem/passage titled “பாடல் : 9(28) : தலைவி தோழியிடம் கூறியது” (section 7.11).", "பாடியவர் : ஒளவையார் முட்டுவேன் கொல், தாக்குவேன் கொல், ஓரேன் யானும் ஓர் பெற்றி மேலிட்டு ஆஅ ஒல்லெனக் கூவுவேன் கொல், அலமரல் அசை வளி அலைப்ப, என் உயவு நோய் அறியாது துஞ்சும் ஊர்க்கே? சுழன்று அசைந்து வீசும் தென்றல் காற்று என்னை வருத்துகின்றது. என் துன்பத்திற்குக் காரணமாகிய காமநோயின் கொடுமையை உணராமல் இவ்வூராரும் கவலையின்றித் தூங்குகின்றனர், அவர்கட்கு என் நிலையை அறிவிப்பதற்காக, யான் முட்டுவேனா? தாக்குவேனா? ஏதோ ஒரு காரணத்தை மேலிட்டுக் கொண்டு ‘ஆ’ என்றும் ‘ஒல்’ என்றும் ஒலி எழுப்பிக் கூப்பிடுவேனா? எதைச் செய்வது என்று அறியேன்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 7, section 7.11, p.155", "", "medium", "false"], ["SANG-7-12", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (1–50): “பாடல் : 10(30) : தலைவி கூற்று” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (1–50): Explain the poem/passage titled “பாடல் : 10(30) : தலைவி கூற்று” (section 7.12).", "பாடியவர் : கச்சிப்பேட்டு நன்னாகையார் கேட்டிசின் வாழி தோழி, அல்கல் பொய்வலாளன் மெய்யுறல் மரீஇய வாய்த்தகைப் பொய்க் கனா மருட்ட ஏற்று எழுந்து அமளி தைவந்தனனே குவளை வண்டுபடு மலரின் சாஅய்த் தமியேன் மன்ற, அளியேன் யானே. தோழி! கேட்பாயாக பொய்யை மெய்போலக் கூறுவதில் வல்லவன் என்னுடைய உடம்பின் ஊற்றின்பத்தைப் பெறுவதற்காக, இரவுக் காலத்தில் பொய்யாகிய கனவில் வந்து மயக்கியதை உண்மை நிகழ்சச ; p போல் நினைத்தேன். என் மயக்கம் நீங்கித் துயிலெழுந்து, சேக்கையில் அவன் இருப்பதைக் கையால் தடவிப் பார்த்தேன், வண்டுகளால் தேன் உறிஞ்சப்பட்ட குவளை மலரைப் போல நிலைகுலைந்த நான், அவரைக் காணாது, தனித்தவளாய் ஆயினேன், உறுதியாக நான் ஒருத்தியே இரங்கத் தக்கவள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 7, section 7.12, p.155", "", "medium", "false"], ["SANG-7-13", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (1–50): “பாடல் : 11(37) : தோழ்p தலைவியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (1–50): Explain the poem/passage titled “பாடல் : 11(37) : தோழ்p தலைவியிடம் கூறியது” (section 7.13).", "பாடியவர் : சேர மன்னன் பாலை பாடிய பெருங்கடுங்கோ நசை பெரிது உடையர், நல்கலும் நல்குவர், பிடி பசி களைஇய பெருங்கை வேழம் மென் சினை யாஅம் பொளிக்கும் அன்பின தோழி, அவர் சென்ற ஆறே. தோழி! தலைவன் உன்னிடத்தில் மிகுந்த விருப்பம் உடையவர். அவர், உன்னிடத்தில் நிறைந்த அன்பையும் காட்டக் கூடியவர். அவர் உன்னைப் பிரிந்து சென்ற நெறிகள், பெண் யானையின் பசியை நீக்குவதற்காகப் பெரிய கையையுடைய ஆண்யானையானது, மெல்லிய கிளைகளையுடைய யா மரத்தின் பட்டையை உரித்து, அதன் நீரை பெண் யானை பருகச் செய்யும் காட்சிகளை உடைய வழியே தலைவன் சென்றுள்ளான்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 7, section 7.13, p.155", "", "medium", "false"], ["SANG-7-14", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (1–50): “பாடல் : 12(39) : தலைவி தோழியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (1–50): Explain the poem/passage titled “பாடல் : 12(39) : தலைவி தோழியிடம் கூறியது” (section 7.14).", "பாடியவர் : ஒளவையார் வெந்திறல் கடு வளி பொங்கர் போந்தென நெற்று விளை உழிஞ்சில் வற்றல் ஆர்க்கும் மலையுடை அருஞ்சுரம் என்ப, நம் முலை இடை முனிநகர் சென்ற ஆறே. தோழி நம் முலையிடைக் கிடந்து துயிலும் தூக்கத்தை வெறுத்தவர், பிரிந்து சென்ற வழியானது, வெம்மையான, வலிமையுடைய விரைவான காற்று, மரக்கிளைகளில் வீசுவதால், வாகை மரத்தின், நெற்றுக்களின் முற்றிய வற்றல்கள் ஒலித்தற்கு இடனாக உள்ள மலைகளையுடைய சுரமாகும் என்று கூறுவர்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 7, section 7.14, p.156", "", "medium", "false"], ["SANG-7-15", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (1–50): “பாடல் : 13(41) : தலைவி தோழியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (1–50): Explain the poem/passage titled “பாடல் : 13(41) : தலைவி தோழியிடம் கூறியது” (section 7.15).", "பாடியவர் : அணிலாடு முன்றிலார் காதலர் உழையர் ஆகப் பெரிது உவந்து சாறு கொள் ஊரின் புகல்வேன் மன்ற, அத்த நண்ணிய அம் குடிச் சீறூர் மக்கள் போகிய அணில் ஆடு முன்றில் புலம்பில் போலப் புல்லென்று அலப்பெண் தோழி, அவர் அகன்ற ஞான்றே. (பிரிவிடை வேறுபாடு கண்டு கூறிய தோழிக்கு தலைவி உரைத்தது) தோழி! காதலர் நம் பக்கத்தில் உள்ளபோது, மிகவும் மகிழ்சச ; pயுற்று, விழாக் கொண்ட பேரூர் போல மிகவும் விருப்பத்தையுடையவளாக விளங்குவேன். பாலை நிலத்தில் காணப்படும் அழகிய வீடுகளையுடைய சிற்றூரில், உறைவோர் அனைவரும், அவ்வூரைவிட்டு நீங்கிச் சென்ற போது அங்குள்ள, அணில் விளையாடும் முற்றத்தையுடைய தனிமை பொருந்திய வீட்டினைப் போல, அவர் என்னைப் பிரிந்த அன்றே வருந்துவேன்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 7, section 7.15, p.156", "", "medium", "false"], ["SANG-7-16", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (1–50): “பாடல் : 14(43) : தலைவி தோழியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (1–50): Explain the poem/passage titled “பாடல் : 14(43) : தலைவி தோழியிடம் கூறியது” (section 7.16).", "பாடியவர் : ஒளவையார்; செல்வார் அல்லர் என்று யான் இகழ்ந்தனனே, ஒல்வாள் அல்லள் என்று அவர் இகழ்ந்தனரே, ஆயிடை இரு பேர் ஆண்மை செய்த பூசல் நல்அராக் கதுவியாங்கு, என் அல்லல் நெஞ்சம் அலமலக்குறுமே. (பிரிவிடையால் மெலிந்த (இளைத்த) கிழத்தி(தலைவி) கூறியது.) தோழி! தலைவர் நம்பைப் பிரிந்து செல்லமாட்டார் எனக் கருதி, நான் அவர் செலவினை விலக்காமல் சோர்ந்திருந்தேன். அவர், நம் பிரிவினை இவளுக்கு அறிவித்தால், அதற்கு உடன்படமாட்டாள் எனக் கருதி, என்னிடம் சொல்லாமல் சோர்ந்திருந்தார். இருவர் தங்களுடைய பேராற்றலை வெளிப்படுத்தச் செய்யும் போர் நிகழும் அவ்விடத்தில், ஒருவரை நல்ல பாம்பு தீண்டினாற்போல, என் நெஞ்சத்தைப் பிரிவுத் துன்பம், மிகவும் கலக்கமுறச் செய்தது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 7, section 7.16, p.156", "", "medium", "false"], ["SANG-7-17", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (1–50): “பாடல் : 15(44) : செவிலித்தாய் கூற்று” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (1–50): Explain the poem/passage titled “பாடல் : 15(44) : செவிலித்தாய் கூற்று” (section 7.17).", "பாடியவர் : வெள்ளிவீதியார் காலே பரி தப்பினவே, கண்ணே நோக்கி நோக்கி வாள் இழந்தனவே அகல் இரு விசும்பின் மீனினும் பலரே மன்ற, இவ் உலகத்துப் பிறரே. (இடைச்சுரத்துச் செவிலித்தாய் கையற்றுச் சொல்லியது) இருகால்களும் நடந்து, நடந்து செலவு தடுமாறின. இரு கண்களும், தேடிப் பார்த்துத் தனக்குரிய புலமாகிய ஒளியை இழந்தன. அகன்ற, பெரிய ஆகாயத்தின்கண் விளங்கும் விண்மீன்களைக் காட்டிலும் பலராய ஆடவர் இவ்வுலகத்தில் உள்ளனர்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 7, section 7.17, p.157", "", "easy", "false"], ["SANG-7-18", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (1–50): “பாடல் : 16(48) : தோழி கூற்று” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (1–50): Explain the poem/passage titled “பாடல் : 16(48) : தோழி கூற்று” (section 7.18).", "பாடியவர் : பூங்கணுத்திரையார் தாதின் செய்த தண் பனிப் பாவை காலை வருந்தும் கையாறு ஓம்பு என ஓரை ஆயம் கூறக் கேட்டும், இன்ன பண்பினினை பெரிது உழக்கும் நன்னுதல் பசலை நீங்கவன்ன, நசையாகு பண்பின் ஒரு சொல் இசையாது கொல்லோ காதலர் தமக்கே? (பகற்குறிக்கண் காணும் பொழுதிலும் காணாப் பொழுத பெரிதாகலின், வேறுபட்ட தலைவினது வேறுபாடு கண்டு, தொழி உரைத்தது) பூந்தாது முதலிய பொடிகளால் செய்யப்பட்டு, மிக்க குளிர்;ச்சியையுடைய பனியில், தூங்கவிடப்பட்ட விளையாட்டுப் பாவையானது, காலை வெயிலில் கிடந்து வருந்தும் நிலைகண்டு, நீ செயலற்றுக் கிடக்கும் நிலையை நீக்குக எனத் தன்னுடன் விளையாடும் மகளிர் கூறுவர். அதனைக் கேட்ட பின்னரும், இவ்வாறு பெரிதும் துன்புற்று வருந்தும், நல்ல நுதலையுடைவளது (நெற்றியை) பசலை நீங்கும்படி, அப்பசலைதான், தலைவனிடம் இவளுக்கு விருப்பமாகும் ஒரு சொல்லைக் கூறுதற்கு உடன்படாதோ.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 7, section 7.18, p.157", "", "medium", "false"], ["SANG-8-3", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (51–93): “பாடல் : 1(56) : தலைவன் கூற்று” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (51–93): Explain the poem/passage titled “பாடல் : 1(56) : தலைவன் கூற்று” (section 8.3).", "பாடியவர் : சிறைக்குடி ஆந்தையார் (தலைமகன் உடன்போக்கிற்கு இசையாமல் மறுத்துத் தானே போகின்ற இடைச் சுரத்தின் வழிப்பற்றி கூறியது) வேட்டச் செந்நாய் கிளைத்து ஊண் மிச்சில் குளவி மொய்த்த அழுகல் சில் நீர் வளை உடைக் கையள் எம்மொடு உணீஇயர் வருகதில் அம்ம தானே அளியளோ அளியல், என் நெஞ்சு அமர்ந்தோளே வேட்டை மேற்கொண்டு சென்ற செந்தாய், தன் கால்களால் நிலத்தைத் தோண்டி, உண்டு, எஞ்சியதாகிய, காட்டு மல்லிகையின் சருகுகளால் மூடப்பட்ட, அழுகல் நாற்றத்தையுடைய சிலவாகிய நீரை, வளையணிந்த கையையுடையவளாய், எம்மொடு சேர்ந்து உண்பதற்கு என்னுடன் வருவாளாகுக. அவ்வாறு உடன் வந்தால் என் நெஞ்சத்தில் விரும்பித் தங்கியுள்ள அத்தலைவி, மிகவும் இரங்கத்தக்கவள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 8, section 8.3, p.159", "", "medium", "false"], ["SANG-8-4", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (51–93): “பாடல் : 2 (59) : தோழி தலைவியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (51–93): Explain the poem/passage titled “பாடல் : 2 (59) : தோழி தலைவியிடம் கூறியது” (section 8.4).", "பாடியவர் : மோசிகீரனார் ளுநடக -ஐளெவசரஉவழையெட (தலைவனின் பிரிவால் வருந்தும் தலைவிக்கு தோழி ஆறுதல் ஆயவநசயைட கூறியது) பதலைப் பாணிப் பரிசிலர் கோமான் அரலைக் குன்றத்து அகல்வாய்க் குண்டு சுனைக் குவளையொடு பொதிந்த குளவி நாறு நின் நறுநுதல் மறப்பரோ மற்றே முயலவும், சுரம் பல விலங்கிய அரும் பொருள் நிரம்பா ஆகலின் நீடலோ இன்றே. ஒரு கண் மரக்கிணையை இயக்குகின்ற, தாளத்தையுமடைய, பாணர் முதலிய இரவலர்களைப் பாதுகாக்கின்ற அரசனின் அதலை என்னும் குன்றத்தின்கண, அகன்ற வாயினையுடைய ஆழமான சுனைகளில் பூத்த குவளை மலர்களோடு சேர்த்துக் கட்டிய காட்டு மல்லிகையின் மணம் வீசுகின்ற உன்னுடைய நல்ல நெற்றியைத் தலைவல் மறப்பாரோ!. பலநாள் வருந்தி முயன்றாலும், பாலை நிலங்கள் பல குறுக்கிட, அவற்றைக் கடந்து தேடும் கிடைத்தற்கரிய பொருள், முற்றவும் கைகூடாது, எனவே அப்பொருள்களைப் பெற்றே மீண்டு வருவேன் எனக் கருதி தலைவன் அந்நாட்டில் நீண்டநாள் தங்கமாட்டார்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 8, section 8.4, p.159", "", "medium", "false"], ["SANG-8-5", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (51–93): “பாடல் : 3(63) : தலைவன் தன் நெஞ்சிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (51–93): Explain the poem/passage titled “பாடல் : 3(63) : தலைவன் தன் நெஞ்சிடம் கூறியது” (section 8.5).", "பாடியவர் : உகாய்க்குடிகிழார் (பொருள் தேட முயலும் தலைவன் தன் நெஞ்சிடம் கூறுவது) ஈதலும் துய்த்தலும் இல்லோர்க்கு இல்லெனச் செய்வினை கைம்மிக எண்ணுதி; அவ்வினைக்கு அம் மா அரிவையும் வருமோ? எம்மை உய்த்தியோ? உரைத்திசின் நெஞ்சே. அறம் பெற ஈதலும், இன்பம் பெறத் துய்த்தலும், ஆகிய காரியங்கள், அவற்றின் காரணமாகிய பொருள் இல்லாத வறியவனிடம் காணப்படுவதில்லை. ஆதலின், பொருள் தேடுவதற்குரிய செயல்களை, ஏனைய தொழில்களை விடச் சிறப்புடையதாக நீ மிகவும் நினைத்தனை, அதனைத் தேடுவதற்குத் துணையாக அழகிய மாமை நிறத்தையுடைய, நம் காதலியும் உடன் வருவாளோ? அவளின்றி;த் தனியாக என்னைச் செல்லவிடுவாயோ? நெஞ்சே! யாது நின் கருத்து எனக் கூறுக.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 8, section 8.5, p.160", "", "medium", "false"], ["SANG-8-6", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (51–93): “பாடல் : 4(67) : தலைவி கூற்று : தலைவனின் பிரிவால்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (51–93): Explain the poem/passage titled “பாடல் : 4(67) : தலைவி கூற்று : தலைவனின் பிரிவால்” (section 8.6).", "வருந்துதல் : பாடியவர் : அள்@ர் நன்முல்லையார் உள்ளார் கொல்லோ தோழி, கிள்ளை வளைவாய்க் கொண்ட வேப்ப ஒண் பழம் புது நாண் நுழைப்பான் நுதி மாண் வள் உகிர்ப் பொலங்கல ஒரு காசு ஏய்க்கும், நிலங்கரி கள்ளியங் காடு இறந்தோரே? தோழி! கிளி தன்னுடைய வளைந்த அலகிடத்தே பற்றிக் கொண்டுள்ள, வேம்பினது ஒள்ளிய பழம், புதிய நூலை நுழைக்கும் பொருட்டு, மகளிர் தங்கள் விரல் நுனிகளில் அழகாக விளங்கும் கூர்மையான நகங்களுக்கிடையே வைக்கப்பட்டுள்ள பொற்காசு போலக் காட்சியளிக்கும், நிலம் கரிந்துள்ள, கள்ளிச் செடிகள் மிகுந்துள்ள இத்தகைய காட்டினைக் கடந்து சென்ற நம் காதலர், நம்மை நினைப்பாரோ?.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 8, section 8.6, p.160", "", "medium", "false"], ["SANG-8-7", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (51–93): “பாடல் : 5 (71) : தலைவன் கூற்று” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (51–93): Explain the poem/passage titled “பாடல் : 5 (71) : தலைவன் கூற்று” (section 8.7).", "பாடியவர் : கருவூர் ஓதஞானியார் (பொருள் தேடச் சென்ற தலைவன் தன் நெஞ்சிற்கு உரைத்தது) மருந்தெனின் மருந்தே, வைப்பெனின் வைப்பே, அரும்பிய சுணங்கின் அம் பகட்டு இள முலைப்ப பெருந்தோள் நுணுகிய நுசுப்பின் கல் கெழு கானவர் நல்குறு மகளே. மார்பில் தோன்றிய சுணங்கினையும், அழகிய பருத்த இளமையுடைய முலையினையும், பெரிய தோளினையும் நுண்ணிய இடையையும் உடைய, கற்கள் பொருந்திய கானவர் நல்கிய மகள், பிரிந்து போய்த் தேடிய பொருளால் அறம் செய்து, அவ்வுலகில் இன்பமாக இருப்பது மருந்து என்றால் இவளே அம்மருந்து ஆவாள். அப்பொருளினால் இவ்வுலகில் இன்பமாக அனுபவப்பதற்குரியச் செல்வம் என்றால், இவளே அச்செல்வம் ஆவாள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 8, section 8.7, p.161", "", "medium", "false"], ["SANG-8-8", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (51–93): “பாடல் : 6 (77) : தலைவி தோழியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (51–93): Explain the poem/passage titled “பாடல் : 6 (77) : தலைவி தோழியிடம் கூறியது” (section 8.8).", "பாடியவர் : மதுரை மருதன் இளநாகனார் பிரிவின் கண் ஆற்றாளாகிய தலைமகள் தோழிக்கு உரைத்தது, அம்ம வாழி தோழி, யாவதும் தவறு எனின் தவறோவிலவே, வெஞ்சுரத்து உலந்த வம்பலர் உவல் இடு பதுக்கை நெடு நல் யானைக்கு இடு நிழலாகும் அரிய கானம் சென்றோர்க்கு எளியவாகிய, தட மென் தோளே. தோழி! நீ வாழ்க! ஒன்று கூறுவேன். கேட்பாயாக. கொடிய பாலை நிலத்து வழியல் இறந்த வழிப்போக்கருடைய உடல்களை மறைத்துத் தழையால் மூடப்பட்டுள்ள கற்குவியலானது, உயர்ந்த நல்ல யானைக்கு, அமைக்கப்பட்ட நிழலாகப் பயன்படும். இத்தகைய கடத்தற்கரிய பாலை நிலத்தில் என்னைப் பிரிந்து சென்ற தலைவன் திறத்து மெலரிந்தனவாகிய என்னுடைய பெரிய மெல்லிய தோள்களை தவறு உடையன என்று நீ கூறினால் சிறிதும் தவறு இல்லையாகும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 8, section 8.8, p.161", "", "medium", "false"], ["SANG-8-9", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (51–93): “பாடல்; : 7(79) : தலைவி கூற்று” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (51–93): Explain the poem/passage titled “பாடல்; : 7(79) : தலைவி கூற்று” (section 8.9).", "பாடியவர் : குடவாயில் கீரனக்கனார் பொருள் தேடுவதற்காக பிரிந்த தலைமகனை நினைத்து தலைமகள் தோழிக்கு உரைத்தது. கான யானை தோல் நயந்து உண்ட பொரி தாள் ஓடை வளி பொரு நெஞ்சினை அலங்கல் உலவை ஏறி ஒய்யெனப் புலம்புதரு குரல புறவுப் பெடை பயிரும் அத்தம் நண்ணிய அம் குடிச் சீறூர்ச் சேந்தனர் கொல்லோ, தாமே யாம் தமக்கு ஒல்லேம் என்ற தப்பற்குச் சொல்லாது அகறல் வல்லுவோரே? நாம் தலைவன் பிரிவினைத் தாங்கமாட்டோம் என்று கூறிய தவறால், அவர் நம்மிடம் சொல்லாமல் நீங்குதலில் உறுதியுடையவராய் விளங்கினார். பொரிந்த அடிமரத்தையுடைய ஓமை மரத்தின் பட்டைகளைக் காட்டு யானைகள் விரும்பித் தின்னும். காற்று மோதுகின்ற அம்மரத்தின் நெடிய கிளைகளில் உள்ள அசைகின்ற வற்றிய கொம்பில் ஏறி, ஒய்யென, தனிமையையும், வருத்தத்தையும் வெளிப்படுத்தும் குரலை உடையனவாய், ஆண்புறாக்கள், பெண்புறாக்களை அழைக்கும். இத்தகைய பாலை நிலத்தில் அமைந்த அழகிய குடிகளையுடைய சிற்றூரில் அவர் தங்கினாரே.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 8, section 8.9, p.161", "", "medium", "false"], ["SANG-8-10", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (51–93): “பாடல் : 8(84) : செவிலித்தாய் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (51–93): Explain the poem/passage titled “பாடல் : 8(84) : செவிலித்தாய் கூறியது” (section 8.10).", "பாடியவர் : மோசிகீரனார் பெயர்த்தனென் முயங்க யான் வியர்த்தனென் என்றனள், இனி அறிந்தேன் அது துனி ஆகுதலே, கழல் தொடி ஆய் மழை தவழ் பொதியில் வேங்கையும் காந்தளும் நாறி ஆம்பல் மலரினும் தான் தண்ணியளே. கழலுமாறு அணிந்துள்ள தோள் வளையினை உடையவன் ஆய் என்ற வள்ளர் ஆவன். அவனுடைய மலை, மேகங்கள் தவழும் பொதியில் மலை ஆகும். ஆண்டு வளர்ந்துள்ள வேங்கையின் மலர், காந்தளின் மலர் ஆகியவற்றின் மணத்தை உடையவளாய், ஆம்பல் மலரைவிட குளிர்ச்சியுடையவளாய் விளங்குபவள் தலைவி, அவளை நான் ஒருமுறை தழுவியதோடு அமையாமல், மீண்டும் தழுவும்போது, அதற்கு உடன்படாது அவள் ‘நான் வியர்ந்தேன்’ என்றாள். நான் அங்ஙனம் தழுவியபோது அவளுக்கு வெறுப்பு உண்டாதற்குக் காரணமாயிற்று என்பதை, அவள் உரைத்த போது உணரவில்லை. ஆனால், அவள் உடன்போக்கில் சென்ற இப்பொழுது அறிந்துகொண்டேன்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 8, section 8.10, p.162", "", "medium", "false"], ["SANG-9-3", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 1 : தலைவி தோழியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 1 : தலைவி தோழியிடம் கூறியது” (section 9.3).", "திணை : குறிஞ்சித் திணை பாடியவர் : கபிலர் நின்ற சொல்லர், நீடு தோறு இனியஒர், என்றும் என்தோள் பிரிபு அறியலரே, தாமரைத் தண் தாது ஊதி மீமிசைச் சாந்தில் கொடுத்த தீம் தேன் போலப் புடைய மன்ற, புரையோர் கேண்மை, நீர் இன்று அமையா உலகம் போலத் தம் இன்று அமையா நம் நயந்து அருளி, நறுநுதல் பசத்தல் அஞ்சிச் சிறுமை உறுபவோ? செய்பு அறியலரே. நம் காதலர் நிலைத்த செல்லையுடையவர். நீண்ட நாள் இனிமை இருக்கச் செய்பவர். என் தோளை என்றும் பிரிய அறியாதவர். தாமரையின் குளிர்ந்த தாதினை வண்டு ஊதி, மலை மேலுள்ள சந்த மரத்தில் இனிய தேனைச் சேர்த்து வைக்கும். அத்தேன்போல் அவ்வுயர்ந்தோர் நட்பு உறுதியாக உயர்வுடையது. நீர் இல்லாமல் உலகம் வாழ் முடியாது. அதுபோல அவர் இல்லாமல் நாம் வாழ முடியாது. அவ்வாறாய நம்மை அவர் விரும்பி அருள்செய்து நமது நறிய நெற்றியில் பசவலை படர்தலைக் கண்டு அஞ்சுவர். செய்வதை அறியாதவராய் உள்ளார். அவர் என்னைப் பிரிந்து சிறுமை அடைவாரோ? மாட்டார். துறை விளக்கம் : தலைவன் பிரிவான் என்பதை அறிந்த தோழி தலைவியிடம் கூற அவள் தலைவனைப் புகழ்;ந்தது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.3, p.164", "", "medium", "false"], ["SANG-9-4", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 2 : கண்டோர் கூற்று” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 2 : கண்டோர் கூற்று” (section 9.4).", "திணை : பாலைத் திணை பாடியவர் : பெரும்பதுமனார் அழுந்து பட வீழ்ந்த பெருந்தண் குன்றத்து, ஒலி வல் ஈந்தின் உலவையங்காட்டு ஆறு செல் மாக்கள் சென்னி எறிந்த மெ;மறுத் தலைய, நெய்த்தோர் வாய, வல்லியப் பெருந்தலைக் குருளை, மாலை, மடரல் நோக்கு இண்டு இவர் ஈங்கைய சுரணே வை எயிற்று ஐயள் மடந்தை முன் உற்ற எல் இடை நீங்கும் இளையோன் உள்ளம், காலொடு பட்ட மாரி மால் வரை மிளிர்க்கும் உருமினும் கொடிதே நெடுங்காலம் வழங்கி வந்தது பெரிய குளிர்ந்த மலை. அதில் தழைத்த வலிய ஈந்து மரத்தின் கிளைகள் விளங்கம். அழகிய அக்காட்டு வழியில் நடந்து செல்லும் மக்களின் தலையைப் புலிக்குட்டிகள் மோதும். தலை, சிவந்த மறுப்பட்டதலை, குருதி படிந்த வாய். பெரிய தலை இவற்றையுடையனவாய் விளங்கம். மாலைக் காலத்தில் பதுங்கியிருக்கும் மரலின் தூறுகளை நிமிர்ந்து நோக்கும், அங்கே இண்டங்கொடி படர்ந்திருக்கும், ஈங்கை மரமுள்ள காடு உள்ளது. அக்காட்டு வழியல். கூர்மையான பற்களைக் கொண்ட, தலைமையுடைய மடந்தையை முன்னே நடக்கச் செய்து, பின்னேநடந்து செல்கிறான் தலைவன். ஞாயிறு தோன்றி நிலம் தெளிந்த நேரத்தில் ஊரை விட்டு நீங்கிக் கொண்டிருக்கிறான். இந்தத் தலைவன். இவன் உள்ளம் கடியது. காற்றோடு சேர்ந்த மழையிடத்துத் தோன்றிய பெரிய மலையைப் புரட்டும் இடியைக்காட்டிலும் அது கடியது. துறை விளக்கம் : களவொழுக்கத்தில் சிறந்த தலைவன், தலைவியருள் சிலர் மணம் செய்து கொள்ளத் தலைவன் ஊருக்கு உடன்போவார். அவரை வழியின் நடுவே கண்டார் கூறியது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.4, p.165", "", "medium", "false"], ["SANG-9-5", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 3 : தலைவன் தன் நெஞ்சிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 3 : தலைவன் தன் நெஞ்சிடம் கூறியது” (section 9.5).", "திணை : பாலைத் திணை பாடியவர் : இளங்கீரனார் ஈன் பருந்து உயவும் வான் பொரு நெடுஞ்சினைப் பொரி அரை வேம்பின் புள்ளி நீழல், கட்டளை அன்ன இட்டு அரங்கு இழைத்துக் கல்லாச் சிறாஅர் நெல்லி வட்டு ஆடும், வில்ஏல் உழவர் வெம்முனைச் சீறூர்ச் சுரன் முதல் வந்த உரன் மாய் மாலை உள்ளினென் அல்லலெனோ யானே, உள்ளிய வினை முடித்தன்ன இனியோள் மனை மாண் சுடரொடு படர் பொழுது எனவே? நெஞ்சே! ஈன்ற பருந்து அடைகாக்க உட்கார்ந்து வரும்தும்படியானதும், வானத்தைத் தொடுமு; உயர்ந்த கிளைகளையுடையதும், பொரிந்த அடிமரத்தையுடையது மான வேப்ப மரத்தின் புள்ளிகளை உடைய நிழலிலே, பொன்னை உரைக்கும் கல்லைப் போல வடடமான அரங்கு அமைத்து, தம் தொழில் கல்லாத சிறுவர்கள் நெல்லிக்காயை விளையாட்டுக் கருவியாகக் கொண்டு ஆடுவர். அங்கே வில்லை ஏராகக் கொண்டு உழும் உழவர் உள்ளனர். அவர் வழிப்பறி செய்வோர். அவரது வெயய் குடியிருப்பினையுடைய சீறூர் உண்டு. அந்த காட்டின் வழியாக முன்னொரு சமயம் யான் சென்றபோது என் வலிமையைத் தொலைத்த மாலைக் காலத்திலே யான் நினைத்த செயல் ஒன்றுண்டு. கருதிய செயல் முடிந்தபோது ஏற்படும் இன்பம் போன்றவளான இனிய என் காதலி, மனையில் மாட்சிமைப்பட்ட விளக்கை ஏற்றி வைத்து அன்போடு என்னை நினைக்கும் மாலைக்காலம் இது - என்று நினைத்தேன் அல்லவா? அதனால் நெஞ்சே! இப்போது நான் வாரேன். துறை விளக்கம் : முன்னொரு காலத்தில் பொருள் தேடப்பிரிந்த தலைவன் பின்னும் பொருள் தேட நினைத்த நெஞ்சிற்குச் சொல்லியது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.5, p.165", "", "medium", "false"], ["SANG-9-6", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 4 : தலைவி கூற்று” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 4 : தலைவி கூற்று” (section 9.6).", "திணை : நெய்தல் பாடியவர் : அம்மூவனார் கானலஞ் சிறுகுடிக் கடல் மம் பரதவர் நீல் நிறப் புன்னைக் கொழு நிழல் அசைஇத் தண் பெரும் பரப்பின் ஒண் பதம் நோக்கி, அம் கண் அரில் வலை உணக்கும் துறைவனொடு, அலரே அன்னை அறியின் இவண் உறை வாழ்க்கை அரிய ஆகும் நமக்கு எனக் கூறின் கொண்டும் செல்வர் கொளல் தோhழி, உமணர் வெண்கல் உப்பின் கொள்ளை சாற்றிக் கண நிரை கிளர்க்கும் நெடு நெறிச் சகடம் மணல் மடுத்து உரறும் ஓசை கழனிக் கருங்கால் வெண்குருகு வெரூஉம் இருங்கழிச் சேர்ப்பின் தம் உறைவின் ஊர்கN ; க? தோழி! கடற்கரையிலுள்ள அழகிய சிறுகுடியில் வாழும் பரதவர் கடல் மேற்சென்று மீன்பிடித்து வாழ்க்கை நடத்தும் இயல்பினர். நீலநிறப் புன்னை மரத்தின் கொழுவிய நிழலிலே தங்கியிருப்பர். அந்நேரத்தில் அழகிய கண்களையுடைய முறுக்குள்ள கயிற்றால் பின்னிய வலையை உலர்த்திக் கொண்டிருப்பர். அவ்வாறாய துறைவனிடம், ‘ஊரில் எழுந்த அலரை அன்னை அறிந்துவிட்டால் இங்கே வாழும் இன்பவாழ்க்கை நமக்கு இல்லாமற் போகும்’ என்று எடுத்துரைத்தால் அவர் நம்மை அழைத்துக் கொண்டு சென்றாலும் செல்வார். உப்பு வணிகர் வெண்கல் போன்ற உப்பை விலைபேசிப் பெறுவர். தம் நீண்ட தொடர் வண்டிகளில் ஏற்றி விற்க ஓட்டிச் செல்வர். அப்போது வழியில் படுத்திருக்கும் கூட்டமான ஆநிரையை விலக்க ஓசை எழுப்புவர். மணல் வழியில் செலுத்தி முழக்கமிடுவர். இந்த ஓசைகளை வயல்களிலிருக்கும் கரிய கால் வெள்ளை நாரைகள் கேட்டு அஞ்சும். அவ்வாறாய கடற்கரையிலிருக்கும் தாம் வாழும் ஊர்க்கே நம்மை அழைத்துச் செல்வர். துறை விளக்கம் : தலைவன் சிறைப்புறமாக இருந்தான். தோழி அலர் அச்சம் தோன்றச் சொல்லி வரைவு கடாயது", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.6, p.166", "", "medium", "false"], ["SANG-9-7", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 5 : தோழி கூற்று” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 5 : தோழி கூற்று” (section 9.7).", "திணை : குறிஞ்சித் திணை பாடியவர் : கபிலர் நிலம் நீர் ஆரக், குன்றம் குழைப்ப, அகல்வாய்ப் பைஞ்சுனைப் பயிர் கால்யாப்பக் , குறவர் கொன்ற குறைக் கொடி நறைப் பவர் நறுங்காழ் ஆரம் சுற்றுவன அபை;பப் பெரும் பெயல் பொழிந்த தொழில எழிலி தெற்கு ஏர்பு இரங்கும் அற்சிரக் காலையும் அரிதே, காதலர்ப் பிரிதல் இன்று செல் இகுபெயல் தரூஉம் வாடையொடு மயங்கு இதழ் மழைக் கண் பயந்த தூதே. நிலத்தில் நீர் நிரம்பவும், மலையானது மரம் செடிகளால் தழைப்பவும், அகன்ற வாயையுடைய பசிய சுனையை அடுத்த இடங்களில் பயிர்கள் முளைத்து வெளியே வரவும், குறவர்கள் வெட்டிக் குறைத்த வாசனைக் கொடிகள் நறிய வயிரம் பொருந்திய சந்தன மரங்களைத் தழைக்கவும் பெரும் பெயல் பொழிந்த தொழிலையுடைய மேகம் தென்திசையில் எழுந்து சென்றது. இந்த முன்பனிக்காலத்தில் காதலரைப் பிரிந்து வாழ்தல் அரிதே ஆகும். இன்னுங்கேள்! வாடையால் வருந்திய இமைகளை உடைய உன் கண்கள் உண்டாக்கிய நீர்த் துணிகளாகிய தூதே இன்றும் செல்லும் இளைஞரைப் போகாது தடுத்து திரும்பும்படி செய்யும். ஆதலால், கவலை விடுக. துறை விளக்கம் : தலைவன் பிரிந்து செல்லவிருக்கும் குறிப்பை அறிந்து வெறுப்பட்ட தலைவிக்குத் தோழ்p சொல்லியது. மேகம் பெரும் பெயல் பொழ்ந்ததனால் ஏற்பட்ட பயன்கள் சொல்லப்படுகின்றன.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.7, p.167", "", "medium", "false"], ["SANG-9-8", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 6 : தலைவன் தன் நெஞ்சிடம் தோழி கேட்கும்படி” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 6 : தலைவன் தன் நெஞ்சிடம் தோழி கேட்கும்படி” (section 9.8).", "கூறியது : திணை : குறிஞ்சித் திணை பாடியவர் : பரணர் நீர் வளர் ஆம்பல் தூம்புடைத் திரள் கால் நார் உரித்தன்ன மதன் இல் மாமைக் குவளை அன்ன ஏந்து எழில் மழைக் கண் திதலை அல்குல், பெருந்தோள் குறுமகட்கு, எய்தச் சென்று செப்புநர்ப் பெறினே, இவர் யார்? என்குவள் அல்லள், முனாஅது அத்தக் குமிழின் கொடு மூக்கு விளை கனி எறிமட மாற்கு வல்சி ஆகும்ஷ வல்வில் ஓரி கானம் நாறி, இரும் பல் ஒலிவரும் கூந்தல் பெரும் பேதுறுவள் யாம் வந்தனம் எனவே. நீரிலே வளரும் ஆம்பலின் (அல்லியின்) உள் துளையுடைய திரண்ட தண்டுகளின் நார் உரித்தது போன்ற அழகு குறைந்த மாமையை (மாந்தளிர் நிறத்தை)யம், குவளை மலர் போன்ற மிக்க அழகுள்ள குளிர்ந்த கண்களையும், தேமலுள்ள அல்குலையும், பெரிய தோள்களையும் உடைய என் காதலியாகிய இளை மகளுக்கு, அவள் இருக்குமிடம் பொருந்தச் சென்று என்னைப் பற்றிச் சொல்லுவார் உண்டானால், இவர் யார் என்று கேட்கமாட்டாள். வெறுத்திருப்பாள். காட்டிலிருக்கும் குமிழ மரத்தின் வளைந்த மூக்குடைய விளைந்த பழங்கள், துள்ளிக் குதித்து விளையாடும் இளைய மானுக்கு உணவாகும். வலிய வில்லை உடைய ஓரி என்பானின் அக்காடு மணக்கும். அம்மணத்தோம் கருமையோடும் கூடிய பலவாகத் தழைத்த கூந்தலை உடையவள் என் காதலி. அவள், நான் வந்துள்ளேன் என்பதை எண்ணி, மகிழ்சச ; pயால் பெரும் மயக்கம் அடைவாள். துறை விளக்கம் : களவொழுக்கத்தின் போது இரவில் குறித்தவிடத்தில் தலைவன் தலைவியைகச் சந்திக்க செல்லுதல். அங்கே தலைவியைக்காண முடியாத தலைவன் ஆற்றானாய்த் தோழி கேட்கும்படி தன் நெஞ்சிற்குச் சொல்வது உண்டு. வல்வில் ஓரி என்பான் ஏழு வள்ளல்களில் ஒருவன். அவன் கானத்தில் குமிழப் பழம் மானுக்கு உணவாகும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.8, p.168", "", "medium", "false"], ["SANG-9-9", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 7 : தோழி தலைவியிடம் கூறுதல்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 7 : தோழி தலைவியிடம் கூறுதல்” (section 9.9).", "திணை : பாலைத் திணை பாடியவர் : நல்வெள்ளியார் குருடை நனந்தலைச் சுனை நீர் மல்கப் பெருவரை அடுக்கத்து அருவி ஆர்ப்பக் கல் அலைத்து இழிதருமு; கடுவரல் கான் யாற்றுக் கழை மாய் நீத்தம் காடு அலை ஆர்ப்பத் தழங்கு குரல் ஏரொடு முழங்கி வானம் இன்னே பெய்ய மின்னுமால் தோழி வெண்ணெல் அருந்திய வரி நுதல் யானை தண் நறுஞ்சிலம்பில் துஞ்சும் சிறியிலைச் சந்தின் வாடு பெருங்காட்டே. வெண்மையான மூங்கிலின் நெல்லை உண்ட, வரிகளை உடைய நெற்றியைக் கொண்ட யானைகள் குளிர்ந்த நறிய மலையில் தூங்கும். சிறிய இலைகளையுடைய சந்தன மரங்கள் வெப்பத்தால் வாடும்;படியான பெரிய காட்டில், அச்சமுள்ள, அகன்ற இடத்திலுள்ள சுனையில் நீர் நிறையவும், பெருமலையின் வரிசைகளில் அருவிகள் ஒலிக்கவும், கற்களை உருட்டிக் கொண்டு இறங்கிக் கடுமையாக வரும் காட்டாற்றில் மிதந்து வரும் மூங்கில்களை ஒடிக்கும் வெள்ளம் காடுகளை அலைத்து ஓசையிடவும், முழங்கும் ஓசை உடைய இடியோடு முழங்கி மேகம் இப்பொழுதே மழை பெய்ய மின்னுவதைப் பார். துறை விளக்கம் : களவுக்குப்பின், திருமணம் செய்யப்பொருள் N;தடப் பிரிந்தான் தலைவன். அப்பிரிவிற்கு ஆற்றாதவளாய் இருந்த தலைவிக்கு தோழி உரைத்தது. பெருங்காட்டில், நீர் மல்க, அருவி ஆர்ப்ப, நீத்தம் காடு அலைப்ப, மழை பெய்ய, மேகம் முழங்கும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.9, p.168", "", "medium", "false"], ["SANG-9-10", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 8 : தலைவன் கூற்று” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 8 : தலைவன் கூற்று” (section 9.10).", "திணை : குறிஞ்சித் திணை பாடியவர் : பெயர் கிடைக்கப்பெறவில்லை அல்கு படர் உழந்த அரி மதர் மழைக்கண், பல்பூம் பகைத் தழை நுடங்கும் அல்குல் திரு மணி புரையும் மேனி மடவோள் யார் மகள் கொல்? இவள் தந்தை வாழியர்! துயரம் உறீஇயினள் எம்மே; அகல்வயல் அரிவனர் அரிந்தும் தருவனர்ப் பெற்றும் தண்சேறு தாஅய் மதனுடை நோன் தாள் கண்போல் நெய்தல் போர்வில் பூக்கும் திண் தேர்ப் பொறையன் தொண்டி தன் திறம் பெறுக இவள் ஈன்ற தாயே. நிலையாகத் துன்புறுத்தும்படியான, செவ்வரி பரந்த, செழித்த, குளிர்ந்த கண்கள், பல பூக்களால் மாறுபத் தொடுக்கப்பட்ட தழையை உடைய பூண்ட அல்குல், அழகிய நீலமணி போன்ற மேனி, இவற்றையும் மடப்பத்தையும் உடைய இப்பெண் என்னைத் துயரம் அடையும்படி செய்தாள். இவள் யார் மகளோ? இவள் தந்தை வாழ்க. திண்ணிய தேரை உடைய பொறையன் என்பானின் தொண்டி என்னும் ஊரின் அகன்ற வயல்களில் மகளிர் கண்கள் போலப் பூப்பூக்கும் நெய்தலின் அழகிய வலிய தண்டுகளையும் சேர்த்துக் கதிர்ப் போராகக் கட்டிக்கொண்டு வந்து சேர்ப்பவர் சேர்ப்பர். அக்கதிர்ப் போரில் நெய்தல் பூ கண் போலப் பூத்திருக்கும். அத்தொண்டி மூதூர் எல்லா வளமும் பெற்றுத் திகழ்வது போல இவளைப் பெற்றெடுத்த தாயும் பெறுவாளாக. துறை விளக்கம் : முதல் சந்திப்பின் இறுதியில் தலைவி தன் கூட்டத்தோடு சேர்ந்ததைக் கண்ட தலைவன் சொல்லியது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.10, p.169", "", "medium", "false"], ["SANG-9-11", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 9 : தலைவன் தலைவியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 9 : தலைவன் தலைவியிடம் கூறியது” (section 9.11).", "திணை : பாலைத் திணை பாடியவர் : சேரன் பாலைப் பாடிய பெருங்கடுங்கோ அழிவிலர் முயலும் ஆர்வ மாக்கள் வழிபடு தெய்வம் கண் கண்டாஅங்கு அலமரல் வருத்தம் தீர, யாழ நின் நலமென் பணைத்தோள் எய்தினம் ஆகலின் பொரிப்பூம் புன்கின் அழல் தகை ஒண் முறி சுணங்கு அணி வனமுலை அணங்கு கொளத் திமிரி, நிழல் காண்தோறும் நெடிய வைகி, மணல் காண்தோறும் வண்டல் தைஇ, வருந்தாது ஏகுமதி வால் எயிற்றோயே, மா நனை கொழுதி மகிழ் குயில் ஆலும் நறுந்தண் பொழில் கானம் குறும் பல் ஊர, யாம் செல்லும் ஆறே. வெண்மையான பற்களை உடையவளே! நிலைத்த நற்செயல்களை முயன்று செய்து முடிக்கும் ஆர்வமுள்ள மக்கள் தாம் வழிபடும் தெய்வத்தைக் கண்ணெதிரே கண்டது போல என் மனச்சுழற்சித் துன்பம் நீங்க உனது அழகிய மெல்லிய பருத்த தோள்களை அடைந்துவிட்டேன். ஆகையால் பொரி போன்ற பூக்களை உடைய புன்க மரத்தின் அழல் போன்ற ஒள்ளிய தளிர்களை உன் தேமல் படர்ந்த அழகிய கொங்கைகளில் அழகு உண்டாகும்படி பூச்க் கொள்க. நிழலைக்காணும் தோறும் நீண்ட நேரம் நின்று தங்கி வருக. மணலைக் காணும் தோறும் சிற்றில் இழைத்து விளையாடி வருக. இவ்வாறு செயல்பட்டு வருந்தாது என்னோடு வருக. மாமரத்தின் அரும்புகளைக் கோதிமகிழும் குயில்கள். அவை கூவும் நறிய குளிர்ந்த பொழில்களை உடைய கானகத்தில் யாம் இருவரும் செல்வோம். அவ்வழியில் சிறிய ஊர்கள் பல உள்ளன. துறை விளக்கம் : உடன்போக்கு என்பது தலைவன் தன் ஊருக்குத் தலைவியைக் கொண்டு செல்லுதல்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.11, p.170", "", "medium", "false"], ["SANG-9-12", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 10 : தோழி தலைவனிடம் சொன்னது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 10 : தோழி தலைவனிடம் சொன்னது” (section 9.12).", "திணை : பாலைத் திணை பாடியவர் : பெயர் கிடைக்கவில்லை அண்ணாந்து ஏந்திய ளவன முலை தளரினும், பொன்நேர் மேனி மணியின் தாழ்ந்த நல் நெடுங்கூந்தல் நரையொடு முடிப்பினும், நீத்தல் ஓம்புமதி, பூக்கேழ் ஊர! இன் கடுங்கள்ளின் இழை அணி நெடுந்தேர்க் கொற்றச் சோழர் கொங்கர்ப் பணீஇயர் வெண்கோட்டு யானைப் போஓர் கிழவோன் பழையன் வேல் வாய்த்தன்ன, நின் பிழையா நல் மொழி தேறிய இவட்கே. பூக்களின் ஒளிமயமான ஊரனே! குடிப்பதற்;கு இனிமையும் குடித்த பின் வெறியூட்டும் கடுமையும் உடைய கள்ளினையும் அணிகள் அணிந்த நெடிய தேர்களையும் உடையவர் வெற்றிச் சோழர். அவர் கொங்கர் என்பாரை அடக்கி வைக்க விரும்பினர். வெண்மையான கொம்பானைகளை உடையவனும் ‘போஓர்’ என்னும் ஊருக்கு உரியவனுமான பழையன் என்னும் தானைத் தலைவனிடம் தெரிவித்தனர். பழையனின் வேல் தப்பாது வாய்க்கும் தன்மையுடையது. அவ்வேல் போன்ற உன் பிழையாத நல்ல சொற்கை நம்பித் தெளிந்தவள் இவள். இவளது அண்ணாந்து நிமிர்ந்துள்ள அழகிய கொங்கைகள் தளர்ந்து சாய்ந்த காலத்திலும், பொன் போன்ற இவளது மேனியிலே கருமணி பொலத் தாழ்ந்து தொங்கம் நல்ல நீண்ட கூந்தல் நரையோடு முடிக்கப்படும் முதுமைக் காலத்திலும் இவளைக் கைவிடாது காப்பாயாக. துறை விளக்கம் : உடன்போக்கில் தலைவனுடன் அனுப்பி வைக்கும் தோழி அவன் கையில் தலைவியை ஒப்படைத்துக் கூறியது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.12, p.170", "", "medium", "false"], ["SANG-9-13", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 11 : தோழி கூற்று” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 11 : தோழி கூற்று” (section 9.13).", "திணை : நெய்தல் திணை பாடியவர் : உலோச்சனார் பெய்யாது வைகிய கோதை போல மெய் சாயினை, அவர் செய் குறி பிழைப்ப உள்ளி நொதுமலர் நேர்பு உரை தௌ;ளிதின் வாரார் என்னும் புலவி உட்கொளல், ஒழிக மாள நின் நெஞ்சத்தானே புணரி பொருத பூ மணல் அடைகரை ஆழி மருங்கின் அலவன் ஓம்பி வலவன் வள்பு ஆய்ந்து ஊர, நிலவு விரிந்தன்றால் கானலானே. தலைவியே ! தலைவர் செய்த இரவுக்குறி தவறிப் போக, அணியாமலிருந்த பூமாலை போல நீ உடல் மெலிந்தாய். அயலார், உறுதியாக அவர் வாரார் என்று சொன்ன உரையை நினைத்து உனத நெஞ்சத்தில் வெறுப்புக் கொள்ளுதலை விடுக. அலை மோதிய, இள மணல் பரந்த கரையினை உடைய கடலின் பக்கத்தில் திரியும் நண்டுகள் தேராழியால் நசுங்கிப் போகாமல் பாதுகாத்துத் தேர்ப்பாகன் கடிவாள வாரைப் பிடித்துக் கவனித்து ஊர்ந்து வரக் கானலில் நிலவு விரிந்தது காண்பாயாக. துறை விளக்கம் : காவல் மிகுதியால் தடைகள் ஏற்பட்ட போது துயரம் தாங்காத தலைவிக்கு தோழி, தலைவன் அருகில் மறைவாயிருந்த நேரத்தில் கூறியது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.13, p.171", "", "medium", "false"], ["SANG-9-14", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 12 : தோழி தலைவனிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 12 : தோழி தலைவனிடம் கூறியது” (section 9.14).", "திணை : பாலைத் திணை பாடியவர் : கயமனார் விளம்பழம் கமழும் கமஞ்சூல் குழிசிப் பாசம் தின்ற தேய் கால் மத்தம் நெய் தெரி இயக்கம் வெளில் முதல் முழங்கும் வைகு புலர் விடியல் மெய் கரந்து, தன் கால் அரி அமை சிலம்பு கழீஇ, பல் மாண் வரி புனை பந்தொடு வைஇய செல்வோள் இவை காண்தோறும் நோவர் மாதோ அளியரோ அளியர் என் ஆயத்தோர் என நும்மொடு வரவு தான் அயரவும் தன் வரைத்து அன்றியும் கலுழ்ந்தன கண்ணே. நிறைந்த கருப்பம் காணப்படும் வயிறு போன்ற தாழிப் பானையில் விளாம்பழம் கமழும். அத்தாழியில் தயிர் கடைய மத்திட்டு எதிரே வெளில் என்னும் தூணில் தேய்வு காணப்படும். வெண்ணெய் தெரியும் இயக்கத்தின் போது முழக்கம் கேட்கும். இது, வைகறைப் பொழுது புலர்ந்து கொண்டிருக்கும் விடியல் காலை ஆகும். இந்த நேரத்தில் தலைவனோடு உடன்போக்கில் செல்ல விரும்பிய தலைவி தன்னைப் பிறர் பார்த்துவிடாதபடி மறைத்துத் தன் காலில் அணிந்திருந்த பரலொடு சேர்ந்த சிலம்பைக் கழற்றிப் பல மாட்சிமைப்பட்ட வரிகள் செய்த பந்தொடு சேர்த்து வீட்டின் ஓரிடத்தில் வைத்து வரச் சென்றவள் நினைத்து விட்டாள். நான் பிரிந்தால் என்னை நினைத்து வருந்துவர். அவர் இரக்கப்படத தகுந்தவர். அவர் வருந்தும்படியான செயல் என்னால் செய்ய முடியாது’ என்று தீர்மானித்தாள். அவள் கண்கள் கண்ணீர் விட்டன. ஆதலால் தலைவ! உன்னோடு உடன்வர அவள் விரும்பியும் தன் அளவில் நில்லாமல் ஆயத்தார் வருத்தத்தை நினைத்து அவள் கண்கள் கலங்கின. துறை விளக்கம் : தலைவி உடன்போக்கிற்கு உடன்பட்டாலும் அவள் நிலைகளால் தடுக்கப்படுகிறாள். ஆகவே திருமணம் செய்து அழைத்துச் செல்லுதலே மேலானது என்று தோழி தலைவனிடம் கூறுகிறாள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.14, p.172", "", "medium", "false"], ["SANG-9-15", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 13 : தோழி தலைவியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 13 : தோழி தலைவியிடம் கூறியது” (section 9.15).", "திணை : குறிஞ்சித் திணை பாடியவர் : கபிலர் எழாஅ ஆகலின் எழில் நலம் தொலைய அழாஅதீமோ, நொதுமலர் தலையே! ஏனல் காவலர் மா வீழ்த்துப் பறித்த பகழி அன்ன சேயரி மழைக் கண் நல்ல பெருந்தோளோயே! கொல்லன் எறி பொன் பிதிரின் சிறு பல தாஅய் வேங்கை வீ உகும் ஓங்கு மலைக் கட்சி மயில் அறிபு அறியா மன்னோ, பயில் குரல் கவரும் பைம்புறக் கிளியே. தினைப்புனம் காவல் செய்வோர் விலங்குகளை எய்து வீழ்த்திப்பிடுங்கி எடுக்கும் அம்பு போன்ற சிவந்த அரிபடர்ந்த குளிர்ந்த கண்களையும் நல்ல பெரிய தோள்களையும் உடையவளே! கொல்லன் உலைக் களத்தில் அடிக்கும் இரும்பின் பொறிகளைப் போலச் சிறிய பலவாகப் பரந்த வேங்கை மரத்தின் மலர்கள் உதிரும்படியான பெரிய மலையிலுள்ள கூட்டிலிருக்கும் மயில் அறியவும், தினையின் விளைந்த கதிர்களைப் பசிய முதுகையுடைய கிளிகள் பிற உயிர்கள் அறியா என்று தின்னும். அது கண்டும் நீ எழுந்து கிளிகளை விரட்டாமலிருந்தாய். ஆயினும் அயலவர் இருக்கும் இடத்திலிருந்து உன் அழகின் நலம் தொலைந்து போக அழாமல் இருப்பாயாக. துறை விளக்கம் : முதல் சந்திப்பின் பிற்றை ஞான்று தலைவி தலைவன் நினைவாகவே இருந்ததால் உடல் வேறுபட்டிருக்கிறாள். தினைக்கதிர்களைக் கிளிகள் கவர்ந்து செல்வதையும் கவனியாமலிருந்தாள். ஆனால் அழுது கொண்டிருந்தாள். அது கண்ட தோழி, அழுகையைக் கண்டால் அயலாhர் ஐயுறுவர். எனவே அழாமல் இருக்கும்படி எடுத்துச் சொன்னாள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.15, p.172", "", "medium", "false"], ["SANG-9-16", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 14 : தலைவி தோழியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 14 : தலைவி தோழியிடம் கூறியது” (section 9.16).", "திணை : பாலைத் திணை பாடியவர் : மாமூலனார் தொல்கவின் தொலைய, தோள் நலம் சாஅய் நல்கார் நீத்தனர் ஆயினும் நல்குவர் நட்டனர் வாழி தோழி, குட்டுவன் அகப்பா அழிய நூறி செம்பியன் பகல் தீ வேட்ட ஞாட்பினும் மிகப் பெரிது அல் எழச் சென்றனர் ஆயினும், மலர் கவிழ்ந்து மா மடல் அவிந்த காந்தள் அம் சாரல் இனம் சால் வயக் களிறு பாந்தள் பட்டென, துஞ்சாத் துயரத்து அஞ்சு பிடிப் பூசல் நெடு வரை விடரகத்து இயம்பும் கடு மான் புல்லிய காடு இறந்தோரே தோழி! என் பழைய அழகு தொலையவும் என் தோள் நலம் கெடவும் இப்போது அருள்செய்யாது என் தலைவர் கைவிட்டாரெனினும், அவர் அருள் செய்வார் என்பது உறுதி. குட்டுவனது மதில் அழியும் படி இடித்தொடித்துப் பகலில் தீ வைத்துப் போர் செய்தவன் செம்பியன். மலர் தலை கவிழ்ந்து பெரிய இதழ் விரிந்த காந்தள் மணக்கும் அழகிய மலைச்சாரலில் தன் இனம் அமைந்த வலிய ஆண்யானை பெரும் மலைப்பாம்பின் வாய்ப்பட்டது. அதனையறிந்த பெண்யானை நீங்காத துயரொடு அச்சம் கொண்டு ஒலிக்கும் பேரொலி நீண்ட மலையின் பிளப்புகளில் எதிரொலிக்கும். அவ்வாறானதும் கடிய விலங்குகள் பொருத்தியதுமான காட்டைக் கடந்து சென்றவர் (அன்பராதலால் அவர் குறித்த பருவத்து வருவர்) அவர் வாழ்க. துறை விளக்கம் : தலைவின் இயல்பைப் பழித்துக் கூறினாள் தோழி. அதுகேட்ட தலைவி, தலைவர் தலையளி செய்து நல்குவர் என்று அவரது நல்ல இயல்புகளை எடுத்துக் கூறினாள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.16, p.173", "", "medium", "false"], ["SANG-9-17", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 15 : தோழி தலைவனிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 15 : தோழி தலைவனிடம் கூறியது” (section 9.17).", "திணை : நெய்தல் திணை பாடியவர் : பாண்டிய மன்னன் அறிவுடை நம்பி முழங்கு திரை கொழீஇய மூரி எக்கர் நுணங்கு துகில் நுடக்கம் போல கணம் கொள ஊதை தூற்றும் உரைவு நீர்ச் சேர்ப்ப! பூவின் அன்ன நலம் புதிது உண்டு நீ புணர்ந்த அனையேம் அன்மையின் யாமே நேர்புடை நெஞ்சம் தாங்கத் தாங்கி மாசு இல் கற்பின் மடவோள் குழவி பேஎய் வாங்கக் கைவிட்டாங்கு சேணும் எம்மொடு வந்த நாணும் விட்டேம் அலர்க இவ் ஊரே. முழங்கும் அலைகள் ஒன்று சேர்த்த பெரிய மணல் மேட்டில் நுண்ணிய ஆடையின் அசைவு போல, கூட்டமான மாலை வாடைக்காற்று தூற்றும்படியான கடற்கரைத் தலைவனே! பூவை ஒத்த புதிய எம் நலத்தை நீ உண்டாய். ஆனால் நீ ஒன்றிய நட்புக் கொண்டாய் இல்லை. யாம், நேர்மையான நெஞ்சத்தால் துயரத்தைத் தாங்கிக் கொண்டு இருக்கின்றோம். குற்றமற்ற கற்புடைய பெண் ஒருத்தி தன் குழந்தையைப் பேய் கவர்ந்து கொண்டு போகக் கைவிட்டு இருப்பது போல் நெடுங்காலமாக எம்மோடு உள்ள நாணத்தையும் யாம் கைவிட்டு விடுகிறோம். இவ்வூரில் அலர் பரவுவதாக. துறை விளக்கம் : திருமணம் செய்தல் நீட்டித்தபோது தோழி திருமணம் செய்து கொள்ளத் தூண்டியது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.17, p.174", "", "medium", "false"], ["SANG-9-18", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 16 : தலைவன் கூற்று” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 16 : தலைவன் கூற்று” (section 9.18).", "திணை : பாலைத் திணை பாடியவர் : சிறைக்குடி ஆந்தையார் புணரின் புணராது பொருளே, பொருள்வயின் பிரியின் புணராது புணர்வே, ஆயிடைச் செல்லினும், செல்லாய் ஆயினும், நல்லதற்கு உரியை வாழி என் நெஞ்சே! பொருளே வாடாப் பூவின் பொய்கை நாப்பண் ஓடு மீன் வழியின் கெடுவ் யானே விழுநீர் வியல் அகம் தூணி ஆக எழு மாண் அளக்கும் விழுநிதி பெறினும், கனங்குழைக்கு அமர்த்த சேயரி மழைக் கண் அமர்ந்து, இனிது நோக்கமொடு செகுத்தன எனைய ஆகுக! வாழிய பொருளே! பொருள், காதலியோடு இருந்தால் வந்தடையாது. பொருள் வயின் பிரிந்தால் காதலியோடிருக்கும் இன்பம் கிடையாது. என் நெஞ்சே பொருளுக்குச்செல்வதும் செல்லாதிருப்பதுமாகிய இரண்டில் ஒன்றை - நல்லதை - தேர்ந்தெடுத்தற்கு நீ உரிமையுடையவை ஆதலால் வாழ்க. பொருள்களோ, வாடாத பூக்கடைளயுடைய பொய்கையின் நடுவில் ஓடும் மீனின் வழி மறைந்து அழிவது போல இருந்த இடம் தெரியாமல் அழிந்து போகும். யானோ, சிறந்த கடல் சூழ்ந்த அகன்ற உலகமே அளக்கும் கருவியாகக் கொண்டு ஏழுமுறை அளக்கத்தக்க சிறந்த செல்வத்தைப் பெற்றுக் கொள்ள முடிந்தாலும் அதனை விரும்பேன். இக்கனங்குழையாகிய என் காதலியின் மாறுப்ட்ட செவ்வரி பரந்த குளிர்ந்த கண்கள்பொருந்தி இனிதாகப் பார்க்கும் பார்வையால் யான் ஆற்றலழிந்தேன். ஆதலால், பொருளே! நீ எத்தன்மையானாலும் ஆகுக. நீ வாழ்க. துறை விளக்கம் : பொருள் தேடப்போதல் என்று முடிவு செய்த நெஞ்சினை நோக்கிச் சொல்லித் தலைவன் தலைவியை விட்டுப் பிரிதலைத் தவிர்த்தல்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.18, p.174", "", "medium", "false"], ["SANG-9-19", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 17 : தலைவி தோழியிடம் சிறைப்புறத்தே இருந்த” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 17 : தலைவி தோழியிடம் சிறைப்புறத்தே இருந்த” (section 9.19).", "தலைவன் கேட்கும்படி கூறியது : திணை : குறிஞ்சித் திணை பாடியவர் : நொச்சி நியமங்கிழார் நாள் மழை தலைஇய நல் நெடுங்குன்றத்து மால் கடல் திரையின் இழிதரும் அருவி அகல் இருங்கானத்து அல்கு அணி நோக்கித் தாங்கவும் தகைவரை நில்லா நீர் சுழல்பு ஏந்து எழில் மழைக் கண் கலுழ்தலின், அன்னை, எவன் செய்தனையோ? நின் இலங்கு எயிறு உண்கு என மெல்லிய இனிய கூறலின் வல் விரைந்து உயிரினும் சிறந்த நாணும் நனி மறந்து உரைத்தல் உய்ந்தனனே தோழி! சாரல் காந்தள் ஊதிய மணி நிறத் தும்பி தீம் தொடை நரம்பின் இமிரும் வான் தோய் வெற்பன் மார்பு அணங்கு எனவே காலையில் மழை பெய்தது. நல்ல நெடிய மலையில் சேர்ந்த நீர்பெரிய கடலின் அலைபோல அருவியாக வீழ்ந்தது. அகன்ற பெரிய காட்டில் அது தங்கி ஓடிச் செல்லும் அழகை நோக்கிக் கொண்டிருந்தேன். அப்போது எனக்குப் பழைய நினைவுகள் வந்தன. முதன் முதல் யான் அவரைச் சந்தித்த இடம் அதுதான். அதனால் தாங்கிக் கொள்ளவும் தடுத்து நிறுததவும் நில்லாத என் கண்ணீர் கலங்கி அழகு மிக்க குளிர்ந்த கண்கள் அழுதன. அதைக் கண்ட என் தாய், ‘என்ன செய்தாய் அழாதே! உன்னை முத்தம் கொள்வேன்’ என்று மென்மையான இனிய சொற்களால் கூறினாள். அப்போது, தோழி! யான் மிக விரைந்து உயிரினும் சிறந்த நாணினையும் மிக மறந்து உண்மையைச் சொல்லவிருந்தேன். ஆனால் சாரலிலுள்ள காந்தள் மலரின் தேனை உண்ட அழகிய நிறத்தை உடைய தும்பி வண்டு யாழில் கட்டிய இனிய நரம்புபோல ஒலிக்கும் படியான வான் அளாவிய வெற்பன் மார்பால் வந்த துன்பம் இது என்று சொல்லத் தோன்றியதை எப்படியோ சொல்லாமல் தவிர்த்து விட்டேன். துறை விளக்கம் : பகற்குறியில் தலைவன் வந்து மறைவாக இருந்தபோது, அவன் வந்துள்ளதை அறிந்து கொண்ட தலைவியோ தோழியோ அவன் கேட்டுக் கொள்ளும்படி தாங்கள் இருவரும் பேசிக் கொள்ளுதலை முன்னிலைப் புறமொழி என்பர். அருவியைப் பார்த்து நின்ற இடம் தான், அவர்ள காதலனைக் கண்டு மயங்கிய இடம். அந்த நினைவு வரவே அவள் கண்கள் கலங்கின. உண்மையைச் சொல்லவிருந்த அவள் எப்படியோ சொல்லாமல் தவிர்த்தாள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.19, p.175", "", "hard", "false"], ["SANG-9-20", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 18 : தோழி தலைவியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 18 : தோழி தலைவியிடம் கூறியது” (section 9.20).", "திணை : பாலைத் திணை பாடியவர் : பொய்கையார் பருவரல் நெஞ்சமொடு பல் படர் அகல வருவர், வாழி தோழி, மூவன் முழு வலி முள் எயிறு அழுத்திய கதவின் கானல் அம் ;தொண்டிப் பொருநன், வென்வேல் தெறல் அருந்தானைப் பொறையன் பாசறை நெஞ்சம் நடுக்குறூஉம் துஞ்சா மறவர் திரை தபு கடலின் இனிது கண்படுப்ப கடாஅம் கழீஇய கதன் அடங்கு யானைத் தடாஅ நிலை ஒரு கோட்;டன்ன ஒன்று இலங்கு அருவிய குன்று இறந்தோரே தோழி! வருத்தம் நிறை;நத நெங்சத்தோடு பல நினைவாலும் ஏற்பட்ட உன் துன்பங்கள் யாவும் நீங்கத் தலைவன் வருவர். நீ வாழ்வாயாக! மூவன் என்பவன் முழு வலிமையையும் தொலைத்து அவனது முள் பொன்ற பல்லைப் பிடுங்கிப் பதித்த கதவையுடைய - கடற்கரைச் சோலையுடைய - அழகிய தொண்டி நகரின் தலைவனும், வெற்றி தரும் வேற்படையை உயைவனும், பகைவரால் வெல்ல முடியாத தானையை உடையவனுமான பொறையன் என்பானின் பாசறையில், யானை ஒன்றால் நெஞ்சம் நடுங்குற்றுத் தூங்காத வீரர்கள், அது மதம் நீங்கிச் சினம் அடங்கியதால், அலை அடங்கிய கடல்போல இனிமையாகக் கண்மூடி உறங்கினர். அதன் பெரியதான நிலையிலுள்ள ஒற்றைக் கொம்பு போல ஒன்றாகி விளங்கும் அருவியை உடைய குன்றைக் கடந்து சென்றவர் வருவர். நீ வருந்தாதே. துறை விளக்கம் : தலைவி பிரிவிடை தாங்காமல் இருப்பதனைக் கண்டு தோழி அவளை ஆற்றுப்படுத்தல்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.20, p.176", "", "medium", "false"], ["SANG-9-21", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 19 : தோழி தலைவனிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 19 : தோழி தலைவனிடம் கூறியது” (section 9.21).", "திணை : நெய்தல் திணை பாடியவர் : நக்கண்ணையார் இறவுப் புறத்து அன்ன பிணர்படு தடவு முதல் சுறவுக் கோட்டன்ன முள் இலைத் தாழை, பெருங்களிற்று மருப்பின் அன்ன அரும்பு முதிர்பு நன்மான் உழையின் வேறுபடத் தோன்றி, விழவுக் களம் கமழும் உரவு நீர்ச் சேர்ப்ப! இன மணி நெடுந்தேர் பாகன் இயக்கச் செலீஇய சேறி ஆயின், இவளே வருவை ஆகிய சில்நாள் வாழாள், ஆதல் நற்கு அறிந்தனை சென்மே. தாழையானது இறா மீனின் முதுகு போன்ற சருச்சரை பொருந்திய பெரிய அடியையுடையது.. சுறா மீனின் கொம்பு போன்ற விளிம்பில் முள்ளைக் கொண்ட இலையை உடையது. பெரிய ஆண்யானையின் மருப்புப் போன்ற அரும்புகளை உடையது. அந்த அரும்புகள் முதிர்ந்து நல்ல குதிரையின் பிடரி மயிர் போல வேறுபடத் தோன்றி, விழாவின் களம் எங்கும் கமழும். இவ்வளத்தோடு நீர்ப்பெருக்குள்ள சேர்ப்பனே! பலமணிகளை உடைய நெடிய தேரை, பாகன் செலுத்த உன் உர் திரும்பும் நினைப்பொடு புறப்படுவாயானால், இவள் நீ திரும்பி வரும் எல்லையாகிய சில நாள்கள் கூட வாழமாட்டாள். அதனை நீ நன்றாக அறிந்து கொண்டு செல்வாயாக. துறை விளக்கம் : வரைவு கடாயத என்பது தோழி தலைவனிடம் தலைவியை மணம் செய்து கொள்ளத் தூண்டியது.. புணர்ந்து நீங்கிய தலைமகன் என்பது தலைவியோடு பேசி அளவளாவித் திரும்பச் செல்லும் தலைமகனைக் குறிக்கும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.21, p.177", "", "medium", "false"], ["SANG-9-22", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – முதல் இருபது பாடல்கள்: “பாடல் : 20 : தலைவி தலைவனிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – முதல் இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 20 : தலைவி தலைவனிடம் கூறியது” (section 9.22).", "திணை : மருதம் திணை பாடியவர் : ஓரம்போகியார் ஐய! குறுமகள் கண்டிகும்; வைகி மகிழ்நன் மார்பில் துஞ்சி, அவிழ் இணர்த் தேம் பாய் மராஅம் கமழும் கூந்தல் துளங்கு இயல் அசைவர, கலிங்கம் துயல் வரச் செறி தொடி தெளிர்ப்ப வீசி, மறுகில் பூப்போல் உண்கண் பெயர்ப்ப நோக்கிச் சென்றனள், வாழிய மடந்தை! நுண் பல் சுணங்கு அணிவுற்ற விளங்கு பூணள், மார்புறு முயக்கடை ஞெமிர்ந்த சோர் குழைப் பழம் பிணி வைகிய தோள் இணைக் குழைந்த கோதை கொடி முயங்கலளே. ஐய! ஒரு இளைய மகளைக் கண்டேம். அவள் மருத நிலத்தலைவனாகிய உன்னிடம் தங்கி, உன் மார்பில் துயின்று எழுந்து வண்கள் பாய்ந்த மராமரத்தின் அவிழ்ந்த பூங்கொத்துகள் மணக்கும் கூந்தல் அசையும் இயல்போடு அசைந்துவர, ஆடை அசைய, செறிந்த வளையல்கள் ஒலிக்கக் கைவீசி, மலர் போன்ற மையுண்ட கண்களால் உலாவிப் பார்த்து நேற்றுத் தெருவில் சென்றனள். அம்மடந்தை வாழ்க! அவள் நுண்ணிய பலவாகிய தேமல் அழகு செய்யப்பெற்றவள். விளங்கிய அணிகளை உடையவள். உன் மார்பு உற்ற முயக்கத்தினிடையே நெரிந்த காதணியையும், பழைய வருத்தம் தங்கிய இரு தோள்களையும், துவண்ட மாலையை உடைய அவள். கொடிபோல் உன் முயக்கமில்லாது இன்று தெருவில் சென்றனள். துறை விளக்கம் : பரத்தையிடமிருந்து பிரிந்த வந்த தலைவனைப் பார்த்து வினவியபோது, அவன் பரத்தையர் யாரையும் யான் அறியேன் என்றான். அதற்குப் பதில் கூறுவது போல இப்பாட்டு அமைந்துள்ளது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 9, section 9.22, p.177", "", "medium", "false"], ["SANG-10-3", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த இருபது பாடல்கள்: “பாடல் : 21 : தலைவன் தேர்ப்பாகனிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 21 : தலைவன் தேர்ப்பாகனிடம் கூறியது” (section 10.3).", "விரைப் பரி வருந்திய வீங்கு செலல் இளையர் அரைச் செறி கச்சை யாப்பு அழித்து அசைஇ, வேண்டு அமர் நடையர் மென்மெல வருக தீண்டா வை முள் தீண்டி நாம் செலற்கு ஏமதி வலவ தேரே! உதுக்காண்! உருக்குறு நறு நெய் பால் விதிர்த்தன்ன, அரிக்குரல் மிடற்ற அம் நுண் பல் பொறிக் காமரு தகைய கான வாரணம் பெயல் நீர் போகிய வியல் நெடும் புறவில் புலரா ஈர் மணல் மலிரக் கெண்டி, நாள் இரை கவர மாட்டித் தன் பேடை நோக்கிய பெருந்தகு நிலையே! திணை : முல்லைத் திணை பாடியவர் : மருதன் இளநாகனார் தேர்;பபாக! விரைவாக நடத்தற்கு வருந்திய நீண்ட பயணத்தையுடை யநம் வீரர்கள் தம் இடுப்பில் கட்டிய கட்டை அவிழ்த்து ஆங்காங்குத் தங்கி வேண்டியபடி இளைபப்hறி நடந்து மெல்ல மெல்ல வருவாராக. நாம் முன்னே செல்ல இதுவரையில் தீண்டாமல் வைத்திருந்த கூரிய தாற்றுக்கோலால் குரையைத் தீண்டி தேரைச் செலுத்துக. ஏனென்றால் உருக்கிய நல்ல நெய்யைப் பாலில் சிதறினாற் போல ஒலி நிரம்பாத ஓசையை உடைய கழுத்தினையும், அழகிய நுண்ணிய பல புள்ளிகளையும், விரும்பத் தகுந்த அழகையும் உடைய காட்டுக்கோழி, மழை நீர் ஓடிய அகன்ற நெடிய முல்லைக் காட்டிலே உலராத ஈர மணலை நன்கு கிளறி அன்றைய இரையைக் கவர்ந்து வைத்துக் கொண்டு, தன் பெட்டையை நோக்கி அழைக்கும் பெருமை தங்கிய நிலையை அதோ பார்! துறை விளக்கம் : தலைவன் சென்ற வேலை வெற்றிகரமாக முடிந்தது. மகிழ்சச ; pயோடு திரும்பினான். தன் தேர்ப்பாகனைப் பார்;த்து விரைவாகத் தேரை ஓட்டும்படி கூறினான்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.3, p.180", "", "medium", "false"], ["SANG-10-4", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த இருபது பாடல்கள்: “பாடல் : 22 : தோழி தலைவியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 22 : தோழி தலைவியிடம் கூறியது” (section 10.4).", "கொடிச்சி காக்கும் அடுக்கல் பைந்தினை முந்து விளை பெருங்குரல் கொண்ட மந்தி கல்லாக் கடுவனொடு நல்வரை ஏறி, அங்கை நிறைய ஞெமிடிக் கொண்ட தன் திரை அணல் கொடுங்கவுள் நிறைய முக்கி, வான் பெயல் நனைந்த புறத்த நோன்பியர் கைஊண் இருக்கையின் தோன்றும் நாடன் வந்தனன், வாழி தோழி, உலகம் கயம்கண் அற்ற பைது அறு காலைப் பீளொடு திரங்கிய நெல்லிற்கு நள்ளென் யாமத்து மழை பொழிந்தாங்கே திணை : குறிஞ்சித் திணை பாடியவர் : பெயர் கிடைக்கவில்லை தோழி! மலைவாழ் கொடிச்சியற் காக்கப்படும் வரிசையான செவ்விய தினைகளில் முன்னே விளைந்த பெரிய கதிர்களைக் கைக்கொண்டது மந்தி. தன் தொழில் தவிரப் பிற கல்லாத ஆண்குரங்கோடு அது நல்ல மலையில் ஏறி அகங்கை நிறையக் கசக்கிக் கொண்டு தனது வளைவான தாடியையுடைய வளைந்த கன்னம் நிறைய வாயிலிட்டுத் தின்றது. மழையின் பெயலால் ;நனைந்த முதுகை உடையதாய் இருந்தது. இது நீரில் குளிpத்த நோன்புடையார் நீர் துளிர்கக ; க் கையிலுள்ள உணவை ஏந்தி உண்பது பொலத் தோன்றிது. அவ்வாறாய நாடன், உலகத்துக் குளங்கள் வரண்டு, ஈரமற்று பொழுது, இளங்கதிரோடு கூடிய உலர்ந்த நெல்லிற்கு நடு யாமத்து மழை பொழிந்தது போல, நம்மிடம் வரைவொடு வந்தனன், அவன் வாழ்க! துறை விளக்கம் : வரைவு மலிதல் என்பது திருமணம் செய்து கொள்வதற்காகத் தலைவன் வரக் கண்ட தோழி, தலைவியிடம் சென்று இப்பொழுது வந்தனன் என்று ;கூறி மகிழ்வது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.4, p.181", "", "medium", "false"], ["SANG-10-5", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த இருபது பாடல்கள்: “பாடல் : 23 : தோழி தலைவனிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 23 : தோழி தலைவனிடம் கூறியது” (section 10.5).", "தொடி பழி மறைத்தலின் தோள் உய்ந்தனவே; வடிக்கொள் கூழை ஆயமோடு ஆடலின் இடிப்பு மெய்யது ஒன்று உடைத்தே; கடிக் கொள அன்னை காக்கும் தொல் நலம் சிதையக், காண்தொறும் கலுழ்தல் அன்றியும், ஈண்டு நீர் முத்துப்படு பரப்பின் கொற்கை முன்துறைச் சிறு பாசடைய செப்பு ஊர் நெய்தல் தெண் நீர் மலரின் தொலைந்த கண்ணே காமம் கரப்பு அரயவ்வே. திணை : குறிஞ்சித் திணை பாடியவர் : கணக்காயனார் வாரி முடித்தலைக் கொண்ட கூந்தலையுடைய தலைவி, வளையல்களைக் கழன்று விழாமல் வைத்துக் கொள்வதினாலே அவள் தோள்கள் வாட்டம் தெரிவதாயின. அவள் தோழிகளோடு விளையாடுதலாலே உடற்களைப்பு அதனால் ஏற்பட்டதாகக் கருதப்பட்டது. மிக்க காவலையுடைய அன்னை காக்கும் பழைய நலம் சிதையத் தலைவனையோ, தன்னையோ பார்க்குந்தோறும் அவள் அழும், நெருங்கிய நீர் மிக்க முத்துக்கள் விளையும் கடற் பரப்பையுடைய கொற்கை நகரத்தின் முன் துறையிலுள்ள சிறிய பசிய இலைகளை உடைய அழகு மிக்க நெய்தலின் தெளிந்த நீரிலுள்ள மலலைரப் போன்றன அவள் கண்கள். அவற்றின் அழகு கெட்டுப் போயின. ஆனால், அவை காமத்தை மறைக்க முடியாதனவாய் உள்ளன. துறை விளக்கம் : தலைவியின் நலம் சிதைய, அவள் ஆற்றாளாய் இருக்கும் நிலை அறிந்த தோழி தலைவனிடம் வரைந்து கொள்ள வற்புறுத்;தியது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.5, p.181", "", "medium", "false"], ["SANG-10-6", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த இருபது பாடல்கள்: “பாடல் : 24 தலைவி கூற்று” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 24 தலைவி கூற்று” (section 10.6).", "பார் பக வீழ்ந்த வேருடை விழுக் கோட்;டு உடும்பு அடைந்தன்ன நெடும் பொரி விளவின் ஆட்டு ஒழி பந்தின் கோட்டு மூக்கு இறுபு, கம்பலத்து அன்ன பைம் பயிர்த் தாஅம் வெள்ளில் வல்சி வேற்று நாட்டு ஆர் இடைச் சேறும் நாம் எனச் சொல்ல சேயிழை, நன்று எனப் புரிந்தோய், நன்று செய்தனையே; செயல்படு மனத்தர் செய் பொருட்கு அகல்வர் ஆடவர், அது அதன் பண்பே. திணை : பாலைத் திணை பாடியவர் : பெயர் கிடைக்கவில்லை சேயிழை! நிலம் பிளவுபட இறங்கிய வேர், பெரிய கிளை, உடும்பு பிடித்திருப்பது போன்ற அடிமரம், இவற்றையுடைய நெடிய விளாமரத்தின் கிளைகளில் மூக்கு ஊழ்த்து விழுந்த பழங்கள், கம்பளம் விரித்தாற் போன்ற பசிய பயிரில், விளையாட்டடொழிந்த பந்துகள் கிடப்பன போலப் பரவிக் கிடக்கும். அவ்விளாம் பழங்களை உணவாக் கொண்டு வேற்று நாட்டிற்கு அரிய வழிகளில் யாம் சேறும் என்று தலைவர் கூறலும், அது நன்று என விருப்பத்தோடு நீ கூறினாய். அவ்வாறு கூறியதனால் நீ நன்று ஒன்றைச் செய்தாய். ஆடவர் செயல்படும் மனத்தர். ஆகவே பொருள் ஈட்ட அகல்வர். பொருள் ஆடவரைக் கவர்வது அதன் பண்பாகும். துறை விளக்கம் : செய்பொருட்கு ‘யாம் செல்வோம்’ என்றான் தலைவன். ‘செல்க’ என்றாள் தோழி. இதனை ‘நன்று’ என்றான் தலைவன். இது உவந்து கூறியது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.6, p.182", "", "medium", "false"], ["SANG-10-27", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த இருபது பாடல்கள்: “பாடல் : 25 தோழி தலைவியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 25 தோழி தலைவியிடம் கூறியது” (section 10.27).", "அவ் வளை வெரிநின் அரக்கு ஈர்த்தன்ன செவ்வரி இதழ சேண் நாறு பிடவின் நறுந்தாது ஆடிய தும்பி பசுங்கேழ்ப் பொன் உரை கல்லின் நல் நிறம் பெறூஉம் வளமலை நாடன் நெருநல் நம்மொடு கிளை மலி சிறு தினைக் கிளி கடிந்து அசைஇச், சொல்லிடம் பெறாஅன் பெயர்ந்தனன், பெயர்ந்தது அல்லல் அன்று அது காதல் அம் தோழி, தாது உண் வேட்கையின் போது தெரிந்து ஊதா வண்டு ஓரன்ன அவன் தண்டாக் காட்சி கண்டும், கழல் தொடி வலித்த என் பண்பு இல் செய்தி நினைப்பு ஆகின்றே. திணை : குறிஞ்சித் திணை பாடியவர் : பேரி சாத்தனார் அன்புமிக்க தோழி! அழகிய சங்கின் முகில் அரக்கை எழுதியது போலச் சிவந்த வரியுள்ள இதழைக் கொண்டது நெடுந்தூரம் கமழும் பிடவத்தின் பூ. அதன் நறுந்தாதை நுகர்ந்த வண்டு. பசுமையான நிறத்தையுடைய பொன்னை உரைக்கும் கல்லைப் போல நல்ல நிறம் பெறும். அவ்வளம் பெற்ற மலைநாடன், நேற்று நம்மோடு சேர்ந்து கிளைத்தல் மிக்க சிறிய தினையில் வீழ்ந்த கிளிகளை விரட்டித் தங்கியிருந்த போது தன் குறையைச் சொல்ல இடம் பெறாது போயினன். அவன் பெயர்ந்து போன வருத்தம் குறித்து நான் உன்னிடம் வரவில்லை. தேனை உண்ணும் விருப்பத்தாலே பூவைத் தெரிந்து ஊதாத வண்டின் தன்மையை ஒத்த அவன் தோற்றத்தை பார்த்ததும் கழலும் வளையல்களைக் செறி;ததுக்கொண்ட எனது பண்பில்லாத செயல் நினைவுக்கு வருகிறது. துறை விளக்கம் : தலைவியை நோக்கித் தோழி, தலைவனின் வருத்தத்தைக் கூறி அவன் தலைவியை விரும்புவதையும் ;குறிப்பால் கூறுதல் குறை நயப்பாகும். அவன், வண்டு போன்றவன். யான் செல்லும் செய்தி பண்பில் செய்தி என என் உள்ளம் ;கருதுகிறது என்றாள் தோழி.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.27, p.183", "", "medium", "false"], ["SANG-10-8", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த இருபது பாடல்கள்: “பாடல் : 26 தோழி தலைவனிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 26 தோழி தலைவனிடம் கூறியது” (section 10.8).", "நோகோ யானே, நெகிழ்ந்தன வளையே, செவ்வி சேர்ந்த புள்ளி வெள் அரை விண்டுப் புரையும் புணர் நிலை நெடுங்கூட்டுப் பிண்ட நெல்லின் தாய் மனை ஒழியச், சுடர் முழுது எறிப்பத் திரங்கிச் செழுங்காய் முடமுதிர் பலவின் அத்தம் நும்மொடு கெடு துணை ஆகிய தவறோ, வை எயிற்றுப் பொன் பொதிந்தன்ன சுணங்கின் இருஞ்சூழ் ஓதிப் பெருந்தோளாட்கே? திணை : பாலைத் திணை பாடியவர் : சாத்தந்தையார் தலைவ! உம் பிரிவு உணர்ந்து தலைவியன் வளையல்கள் கழன்றன. அதற்கு வருந்துகிறேன். அழகு சேர்ந்த அடியையுடைய, மலை போன்ற, தொடர்ந்த நிலையிலுள்ள, நெடிய நெறி கூட்டில் போட்டு வைக்கப்பட்ட தொகுதியான நெல்லை உடையது தாய்வீடு. அந்தச் செழிப்பை விட்டு, ஞாயிறு தன் வெயிலை முழுதும் வீச, செழித்த பலாக் காய்கள் வாட, முடம்பட்ட முதிர்ந்த பலா மரங்களுடைய காட்டில் உம்மோடு வந்தாள். அவள் உடன்போக்கில் கெடு துணையாகி உம்மோடு வந்த தவறோ? அவள் வளையல்கள் கழன்றன. கூர்மையான பற்கள், பொன் பொதிந்தது பொன்ற சுணங்குகள். கருமை சூழ்ந்த கூந்தல், பெரிய தோள்கள் இவற்றையுடைய தலைவிக்குக் கைவளையல்கள் நெகிழ்ந்தன. நான் வருந்துகிறேன். துறை விளக்கம் : தலைவின் பிரிந்து போவான் என்று உணர்ந்து தலைவி வேறுபட்டிருப்பதைத் தலைவனுக்குச் சொல்லித் தோழி பயணம் தவிர்த்தது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.8, p.183", "", "medium", "false"], ["SANG-10-9", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த இருபது பாடல்கள்: “பாடல் : 27 : தோழி தலைவியிடம் சிறைப்புறமிருக்கும்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 27 : தோழி தலைவியிடம் சிறைப்புறமிருக்கும்” (section 10.9).", "தலைவனுக்கு கேட்கும்படி கூறியது : நீயும் யானும், உரைக்கும் வண்டினம் ஓப்பி, ஒழிதிரை வரித்த வெண்மணல் அடைகரைக் கழிசூழ் கானல் ஆடியது அன்றிக் கரந்து நாம் செய்தது ஒன்று இல்லை, உண்டு எனின் பரந்து பிறர் அறிந்தன்றும் இலரே, நன்றும் எவன் குறித்தனள் கொல் அன்னை, கயந்தோறு இறஆர் இனக் குறுகு ஒலிப்ப சுறவம் கழிசேர் மருங்கின் கணைக்கால் நீடிக் கண் போல் பூத்தமை கண்டு நுண் பல சிறு பாசடைய நெய்தல் குறுமோ சென்று எனக் கூறாதோளே? திணை : நெய்தல் திணை பாடியவர் : குடவாயிற் கீரத்தனார் தோழி! நீயும், நானும் நேற்று பூவின் நுண்ணிய தாதுக்களில் வீழும் வண்ணடுகளை ஓட்டி, ஓய்ந்து போன அலைகள் அழகுபடுத்திய வெண்மணல் நிறைந்த கரையில் உப்பங்கழி சூழ்ந்த சோலையில் விளையாடியது தவிர மறைத்து நாம் செய்தது ஒன்றுமில்லை. ஒரு கால் ஏதேனும் உண்டு எனின், அது வெளிப்பட்டுப் பிறர் அறிந்ததுமம் இல்லை.. அப்படியிருக்க, பொய்கைதோறும் இறா மீனைத் தின்னும் குருகுக் கூட்டம் ஒலிப்பச் சுறா மீன் கழி சேர்ந்த இடத்தில் திரண்ட நண்டு நீண்டு, நுண்ணிய பலவாகிய சிறிய பசிய இலைகளை உடைய நெய்தல், கண்போலப் பூத்திருப்பதைக் கண்டும், அன்னை நம்மை நோக்கி, சென்று ;அவற்றைப் பறித்துச் சூடுக! என்று கூறாதவள் என்ன கருதியொ? தெரியவில்லையே. துறை விளக்கம் : புறமாகத் தோழி ;செறிப்பறிவுறீயது பகற் குறியில் தலைவன் வந்து மறைந்திருந்ததைக் குறிப்பால் அறிந்த தோழி, தலைவியை இல்லத்தில் அடைந்திருபப்தைத் தலைவனுக்குத் தெரியும்படி சொல்வது. நெய்தல் கண்போல் பூத்தது கண்டும் சென்று பறித்துச் சூடுங்கள் என்று அன்னை நம்மைப் பார்த்துக் கூறாதது ஏனோ என்ற கேள்வி மூலம் அன்னையின் சினத்தைக் குறித்தாள் தோழி.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.9, p.184", "", "medium", "false"], ["SANG-10-10", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த இருபது பாடல்கள்: “பாடல் : 28 : தலைவிக்குத் தோழி கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 28 : தலைவிக்குத் தோழி கூறியது” (section 10.10).", "என் கைக் கொண்டு தன் கண் ஒற்றியும், தன் கைக் கொண்டு என் நன்னுதல் நீவியும், அன்னை போல இனிய கூறியும், கள்வர் போலக் கொடியன் மாதோ, மணி என இழிதரும் அருவி பொன் என வேங்கை தாய ஓங்கு மலை அடுக்கத்து ஆடு கழை நிவந்த பைங்கண் மூங்கில் ஓடு மழை கிழிக்கும் சென்னிக் கோடு உயர் பிறங்கல் மலை கிழவோனே. திணை : பாலைத் திணை பாடியவர் : முதுகூற்றனார் என் கையைக் கொண்டு தன் கண்ணை ஒற்றியும், தன் கையைக் கொண்டு என் நல்ல நெற்றியைத் தடவியும், தாய் போல இனிய சொற்களைக் கூறியும் தலைவர் களவுக் காலத்தில் தலையளி செய்தார். இப்போது கள்வர் போலக் கொடியவராய் உள்ளார். நீலமணி போலவீழும் அருவியுடைய மலையில் பொன்போல வேங்கை மாலர் பரவிக் கிடக்கும். உயர்ந்த மலைத்தொடர்சச் pயில் ஆடும் மூங்கில், ;தண்டுயர்ந்த பசிய கணுக்களையுடைய மூங்கில், வானில் ஓடும் மேகத்தைக் கிழிக்கும். மலைச் சிகரத்தால் உயர்ந்த மலைக்கு உரிமையுடைய. மலை கிழவோனே அக்கொடியவர் ஆவார். துறை விளக்கம் : பிரிவில் ஆற்றாத தலைவிக்குத் தோழி சொல்லியது. ஒற்றுதலும், நீவுதலும், இனிய கூறுதலும் தலைவனின் தலையளிச் செயல்கள். தலைவியின் நலத்தைக் கைப்பற்றிச் சென்றதால் தலைவன் கள்வன் ஆகிறான்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.10, p.185", "", "medium", "false"], ["SANG-10-11", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த இருபது பாடல்கள்: “பாடல் : 29 : நற்றாய் கூறியது : (தலைவியின் தாய்)” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 29 : நற்றாய் கூறியது : (தலைவியின் தாய்)” (section 10.11).", "நின்ற வேனில் உலந்த காந்தள் அழல் அவிர் நீள் இடை நிழலிடம் பெறாஅது, ஈன்று கான் மடிந்த பிணவுப் பசி கூர்ந்தென, மான்ற மாலை வழங்குநர்ச் செகீஇய புலி பார்த்து உறையும் புல் அதர்ச் சிறுநெறி யாங்கு வல்லுநநள் கொல் தானே? யான் தன் வனைந்து ஏந்து இளமுலை நோவ கொல்? என நினைந்து கைந்நெகிழ்ந்த அனைத்தற்குத் தான் தன் பேர் அமர் மழைக் கண் ஈரிய கலுழ, வெய்ய உயிர்க்கும் சாயல், மை ஈர் ஓதி பெரு மடத்தகையே. திணை : பாலைத் திணை பாடியவர் : பூதனார் நிலைத்த வேனிற் காலத்தில் வாடிய காந்தளுடைய. அழல் வீசும் நீண்ட வழியல், நிழலிருக்குமிடம் கிடைக்காமல் குட்டிகளை ஈன்று அவற்றோடு கிடந்த பெண்புலி மிகவும் பசித்ததென்று மயங்கின மாலை வேளையில் வழிப்போhவாரைக் கொல்லும் பொருட்டு ஆண்புலி வழியைப் பார்த்துத் தங்கியிருக்கும் புல்லிய வழியாகிய சிறிய பாதையில் எப்படி அவள் போக முடிந்தவளாய் இருப்பாளோ? அவள் யாரெனில் என் மகள். அழகிய நிமிர்ந்த இளைய கொங்கை வருந்துமோ என்று நினைத்து யான் படுக்கையில் அணைத்திருந்த கை நெகிழ்ந்துவிட்ட அதற்கே அவள் தனது பெரிய அமர்ந்த குளிர்ந்த கண்கள் நீர் வடிய அழுது வெய்ய பெருமூச்சு விடுவாள். அவள் மென்மையோடு கரிய கூந்தலையும் பெரிய மடப்பத்தையும் உடைய தகுதி நிறைந்தவள். துறை விளக்கம் : தலைவனம் தலைவியும் உடன்போக்கில் போயினர். இவ்வாறு தன் மகளைப் போக்கிய தாய் தன் மகளுக்கு இரங்கிக் கூறியது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.11, p.185", "", "medium", "false"], ["SANG-10-12", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த இருபது பாடல்கள்: “பாடல் : 30 : தோழி தலைவனிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 30 : தோழி தலைவனிடம் கூறியது” (section 10.12).", "கண்டனென் மகிழ்ந! கண்டு எவன் செய்கோ? பாணன் கையது பண்புடைச் சீறியாழ் யாணர் வண்டின் இம்மென இமிரும் ஏர்தரு தெருவின், எதிர்ச்சி நோக்கி நின் மார்பு தலைக்கொண்ட மாணிழை மகளிர், கவல் ஏமுற்ற வெய்து வீழ் அரிப் பனி கால் ஏமுற்ற பைதரு காலைக் கடல்மரம் கவிழ்ந்தெனக் கலங்கி உடன் வீழ்பு பலர் கொள் பலகை போல, வாங்க வாங்க நின்று ஊங்கு அஞர் நிலையே திணை : மருதம் திணை பாடியவர் : கொற்றனார் மகிழ்ந! பாணன் கையிலிருக்கும் மிக நல்ல சீறி யாழ் புதுவண்டு போல இம் என ஒலிக்கும். அழகிய தெருவில் எதிர்பார்த்து உன் மார்பைத் தமக்கிடமாக்கிக் கொண்டனர் மாட்சி மிக்க அணிகலன்களை உடைய பரத்தையர். அவர் ஆசையால் இன்புற்று, நீ பிரிந்த போது வெய்யதாகக் கண்ணீர் வடித்தனர். கடலில் புயல்காற்று வீசியதால் கப்பல் கவிழ்ந்து விட்டது, துன்புற்ற காலமாகிய அப்போது கலக்கமடைந்த கப்பலோடு வீழ்ந்த பலரும் அங்கு மிதந்த பலகை ஒன்றைப் பிடித்துக் கொண்டனர். அப்பலகையை ஒவ்வொருவரும் தனித்தனி இழுப்பது போலப் பரத்தையர் ஒவ்வொருவரும் உன்னை இழுக்க, இழுக்க, உன் செறிந்த துன்பத்தின் நிலையை யான் கண்டேன். கண்டு என் செய்ய வல்லேன்? துறை விளக்கம் : பரத்தையிடமிருந்து பிரிந்து வந்த தலைவனைப் பார்த்து வினவியபோது.அவன் பரத்தையர் யாரையும் யான் அறியேன் என்றான். அதற்குப் பதில் கூறுவது போல இப்பாட்டு அமைந்துள்ளது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.12, p.186", "", "medium", "false"], ["SANG-10-13", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த இருபது பாடல்கள்: “பாடல் : 31 : தலைவி தோழியிடம் சிறைப்புறமாக இருந்த” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 31 : தலைவி தோழியிடம் சிறைப்புறமாக இருந்த” (section 10.13).", "தலைவன் கேட்கும்படி கூறியது : மா இரும் பரப்பு அகம் துணிய நோக்கிச் சேயிறா எறிந்த சிறுவெண் காக்கை பாய் இரும் பனிக் கழி துழைஇ, பைங்கால் தான் வீழ் பெடைக்குப் பயிரி^உ, சுரக்கும் சிறுவீ ஞாழல் துறையுமார் இனிதே; பெரும் புலம்பு உற்ற நெஞ்சமொடு பல நினைந்து, யானும் இனையேன் ஆயின், ஆனாது வேறு பல் நாட்டில் கால் தரவ ந்த பல உறு பண்ணியம் இழிதரு நிலவு மணல் நெடுஞ்சினை புன்னை கடுஞ்குல் வெண்குருகு உலவுத் திரை ஓதம் வெரூஉம் உரவு நீர்ச் சேர்ப்பனொடு மணவா ஊங்கே திணை : நெய்தல் திணை பாடியவர் : நக்கீரனார். வேறு பல நாட்டிலிருந்து ஓயாமல் மரக்கலங்கள் காற்றால் செலுத்தப்பட்டு வந்து, பலவகைப் பண்டங்களும் இறங்கம் நிலாப்போன்ற மணற் பரப்பிலேயுள்ள நெடிய புன்னை மரக்கிளையிலிருக்கும் முதி;ர்ந்த கருவையுடைய வெள்ளையான குருகு, உலவும் அலைவெள்ளத்திற்கு அஞ்சும்படியான வலிய நீர்ப்பரப்பையுடைய சேர்ப்பனோடு நட்புக் கொள்வதற்கு முன்பு மிகப்பெரிய நீர்ப்பரப்பில் தெளிவாகப் பார்த்து வௌ;விய இறாமீனைக் கவ்விய சிறு வெண்காக்கை இரையைக் கொண்டு வந்து, பரவிய பெரிய குளிர்ந்த உப்பங்கழியில் துழாவி தான் விரும்பும் பசிய காலையுடைய தன் பெடையை அழைத்து அதற்குக் கொடுக்கும்படியான சிறிய பூவையுடைய ஞாழல் துறையும் எனக்கு இனிமையாய் இருந்தது. ஆனால் சேர்ப்பன் கைவிட்ட பின் அத்துறையும் இனிமையற்றதாயிற்று. பெரிய வருத்தமடைந்த நெஞ்சத்தோடு பல பல நினைந்து யானும் இவ்வாறு ஆயினேன். துறை விளக்கம் : தலைவன் மறைவாக இருந்தபோது தலைவி தோழியின் வற்புறுத்தலுக்கு மாறாக வருந்தியது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.13, p.187", "", "medium", "false"], ["SANG-10-14", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த இருபது பாடல்கள்: “பாடல் : 32 : தோழி தலைவியிடம் சொன்னது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 32 : தோழி தலைவியிடம் சொன்னது” (section 10.14).", "மாயோன் அன்ன மால் வரைக் கவாஅன், வாலியோன் அன்ன வயங்கு வெள் அருவி, அம்மலை கிழவோன் நம் நயந்து என்றும் வருந்தினன் என்பது ஓர் வாய்ச் சொல் தேறாய், நீயும் கண்டு நுமரொடும் எண்ணி அறிவு அறிந்து அளவல் வேண்டும்; மறுத்தரற்கு அரிய, வாழி தோழி, பெரியோர் நாடி நட்பின் அல்லது நட்டு நாடார் நம் ஒட்டியோர் திறத்தே. திணை : குறிஞ்சித் திணை பாடியவர் : கபிலர் திருமால் போன்ற பெரிய மலை. அம்மலைப் பக்கத்தில் பலதேவன் போன்ற வெண்மையான அருவி வீழ்ந்தது. அந்த மலைக்கு உரியவன் தலைவன். அவன் நம்மைப் பெரிதும் விரும்பி எப்போதம் வருந்துகிறான். இந்த உண்மையை நான் சொலலுகிறேன். என் வாய்ச் சொல்லை நீ நம்பாது, தெளிவடையாது உள்ளாய். ஆனால் ஒன்று செய். நீயும் எண்ணிப்பார். என்னைத் தவிர உனக்கு வேண்டிய தோழிமாரோடும் எண்ணிப்பார் அறிவால் ஆராய்ந்து அறிந்து கொண்ட பின்னரே ஒருவரோடு அளவளாவுதல் வேண்டும். தலைவன் வேண்டுகோள்கள் மறுத்தற்கு அரியனவாய் உள்ளன. (பெரியோர் நம்மிடத்து யாராவது அன்பு கொண்டு ஒட்டிக்கொள்ள வந்தால், வந்தவர் பண்புகளை ஆய்ந்தே நட்புக்கொள்வர். அப்படித் செய்வதைத் தவிர நட்புக் கொண்டுவிட்டு, வந்தவர் குணங்களைப் பின்பு ஆராய்ந்து கொண்டிருக்க மாட்டார்.)", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.14, p.187", "", "medium", "false"], ["SANG-10-15", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த இருபது பாடல்கள்: “பாடல் : 33 : தோழிp தலைவனிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 33 : தோழிp தலைவனிடம் கூறியது” (section 10.15).", "படுசுடர் அடைந்த பகுவாய் நெடு வரை, முரம்பு சேர் சிறுகுடி பரந்த மாலை, புலம்பு கூட்டுண்ணும் புல்லென் மன்றத்துக் கல்லுடை படுவில் கலுழி தந்து, நிறை பெயல் அறியாக் குறை ஊண் அல்லில், துவர்செய் ஆடை செந்ரொடை மறவர் அதர் பார்த்து அல்கும் அஞ்சுவரு நெறியிடை, இறப்ப எண்ணுவர் அவர் எனின், மறுத்தல் வல்லுவம் கொல்லோ, மெல்லியல் நாம்? என விம்முறு கிளவியள் என் முகம் நோக்கி, நல்அக வன முலைக் கரை சேர்பு மல்கு புனல் பரந்த மலர் ஏர் கண்ணே. திணை : பாலைத் திணை பாடியவர் : இளவேட்டனார் தலைவ! இறங்கும் ஞாயிறு சேர்ந்த பிளந்த வாயையுடைய உயர்ந்த மலையில் மேட்டு நிலத்திலுள்ள சிறிய குடியிலே பரந்த மாலை நேரத்தில் தனிமை சேர்ந்திருக்கும் பொலிவிழந்த மன்றத்திலே கல்லையுடைய மடுவிலே ஊறிய கலங்கல் நீரைக் கொண்டு வந்து தந்து நிறைந்த மழையை அறியாத குறைந்த உணவையுடைய இரவு நேரத்தில், துவர் நிறம் செய்த ஆடையையும் செவ்விய அம்புத்தொடையும் உடைய மறவர் (வழிப்பறி செய்வோர்) வழிபார்த்துத் தங்கியிருக்கும் அச்சம் தோன்றும் பாதையில் செல்ல எண்ணுவாரென்றால் நாம் மறுத்தல் செய்ய முடிந்தவர்களாய் உள்ளோமா? மெல்லியல் சொல் என்று கேட்டாள் அப்போது, விம்முற்ற சொல்லையுடையவளாய்என் முகதர்தைப் பாரத்த போது அவளது மலர்போன்ற கண்களிலிருந்து நல்ல மார்பிலுள்ள அழகிய கொங்கையின் முகட்டில் விழுந்து பரக்கும்படி நிறைந்த கண்ணீர் பரந்தன. துறை விளக்கம் : பிரிவு உணர்த்தப்பட்டது. அப்போது தலைவியின் குறிபஃபு எவ்வாறு இருந்தது என்று தோழி அறிந்தாள். அறிந்ததைத் தோழி தலைவனுக்குச் சொல்லியது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.15, p.188", "", "medium", "false"], ["SANG-10-16", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த இருபது பாடல்கள்: “பாடல் : 34 : தோழி முருகனிடம் சிறைப்புறமாக இருந்த” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 34 : தோழி முருகனிடம் சிறைப்புறமாக இருந்த” (section 10.16).", "தலைவன் கேட்கும்படி கூறியது : கடவுட் கற்களை அடை இறந்து அவிழ்ந்த பறியாக் குவளை மலரொடு காந்தள் குருதி ஒண்பூ உரு கெழக் கட்டிப் பெருவரை அடுக்கம் பொற்பச் சூர்மகள் அருவி இன் இயத்து ஆடும் நாடன் மார்புதர வந்த படர் மலி அரு நோய், நின் அணங்கு அன்மை அறிந்தும், அண்ணாந்து கார் நறுங்கடம்பின் கண்ணி சூடி வேலன் வேண்ட வெறிமனை வந்தோய் கடவுள் ஆயினும் ஆக மடவை மன்ற வாழிய முருகே! திணை : குறிஞ்சித் திணை பாடியவர் : பிரமசாரி முருகனே! கடவுள் தன்மையுடைய மலைச்சுனையில் உள்ள இலைகளைக் கடந்து மலர்ந்த, பறியாத குவளை மலரோடு குருதி போன்ற ஒள்ளிய மலராகிய காந்தளையும் சேர்த்து அழகுப்படக் கட்டி, பெரிய மலைப்பக்கத்தில் அழகுறச் சூடிக்கொண்டு சூர்மகள், மலையருவியாகிய இனிய கருவிக்குத் தகுந்த முறையில் ஆடுவாள். அச்சிறந்த மலைநாடனது மார்பு தரவ ந்த நினைத்து வருந்தும் மிகுந்த துன்பமாகிய அரிய நோய் இது. உன்னால் வந்த நோய் அன்று . இதை நீ நன்கு அறிந்திருந்தும ;கார்காலத்து மலரும் நறிய கடம்பின் மலர்கக ; ண்ணியைச் சூடிக்கொண்டு ஆடும் வேலன் வேண்டிக் கொள்ள வெறியோடு களத்திற்கு நீ தலை நிமிர்ந்து வந்தோய். நீ கடவுள் ஆயினும் ஆகுக. நீ உறுதியாய் அறியாமை உடையாய், வாழிய. துறை விளக்கம் : வெறியாடல் களவுக்காலத்தில் பிரிவினால் வேறுபட்ட தலைவியை நோக்கி இது முருகனால் ஆயதோ என முருகனுக்குப் பலி, பூசனை செய்வதை வெறியாடடு என்பர்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.16, p.189", "", "medium", "false"], ["SANG-10-17", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த இருபது பாடல்கள்: “பாடல் : 35 : தோழி தலைவனிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 35 : தோழி தலைவனிடம் கூறியது” (section 10.17).", "பொங்கு திரை பொருத வார் மணல் அடைகரைப் புன்கால் நாவல் பொதிப் புற இருங்கனி கிளை செத்து மொய்த்த தும்பி பழம் செத்துப் பல்கால் அலவன் கொண்ட கோட்கு அசாந்து கொள்ளா நரம்பின் இமிரும் பூசல் இரை Nர் நாரை எய்தி விடுக்கும் துறை கெழு மரந்தை அன்ன இவள் நலம், பண்டும் இற்றே; கண்டிசின் தெய்ய் உழையின் போகாது அளிப்பினும் சிறிய ஞெகிழ்ந்த கவின் நலம் கொல்லோ, மகிழ்ந்தோர் கள் களி செருக்கத்து அன்ன காமம் கொல் இவள் கண் பசந்ததுவே? திணை : நெய்தல் திணை பாடியவர் : அம்மூவனார் மேலெழும் அலைகள் தாக்கிய, நீண்ட மணல் பரந்த கரையிலே புல்லிய காம்புடைய நாவலின் கரியகனி, களிபொதிந்த மேற்புறமுள்ளதொன்று உதிர்ந்தது, அதைத் தும்பி வண்டுகள் தம் இனம் எனக் கருதி மொய்த்தன. பல கால்களையுடைய அலவன் என்னும் நண்டு அதனைப் பழம் எனக் கருதிக் கைக் கொள்ளச் சென்றது. அக்கொள்கைக்கு வண்டுகள் வருந்தி கைக்கொள்ள விடாமல் யாழ் நரம்பிசை போல மிக்கு ஒலித்தன. அந்த ஆரவாரத்தை அங்கே இரைதேடும் நாரை கேட்டு கனி கிடக்குமிடம் அடைந்து பூசலைத் தீர்த்தது. அவ்வாறாய கடற்றுறை மிக்க மரந்தை என்னும் ஊர் போன்ற இவள் நலம் பண்டும் இவ்வாறே இருந்தது. நீ காண்பாயாக. பக்கத்திலிருந்து விலகிப்போகாமல் நீ தலையளி செய்தாலும், இவள்கண் பசந்தது. சிறிது நெகிழ்ந்த அழகின் மிகுதியோ? கள் உண்டார்ககு ; க் கள்ளின் களிப்பால் ஏற்படும் மயக்கம் போன்ற காமமமோ? தெரியவில்லை. துறை விளக்கம் : திருமணம் நடந்த பின் தலைவி கணவன் இல்லம் சென்றாள். சில நாள் சென்ற பின் தோழி, தலைவின் இல்லத்தைப் பார்த்துவரப் போனாள். அங்கு தலைவன், தன் இல்லத் தலைவியைக் களவுக் காலத்து ஆறுதல் கூறி நன்கு ஆற்றுவித்தாய் என்று புகழ்ந்து கூறினான். அப்போது தோழி சொல்லியது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.17, p.189", "", "medium", "false"], ["SANG-10-18", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த இருபது பாடல்கள்: “பாடல் : 36 : தோழி தலைவியிடம் சிறைப்புறமாக இருந்த” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 36 : தோழி தலைவியிடம் சிறைப்புறமாக இருந்த” (section 10.18).", "தலைவன் கேட்கும்படி கூறியது : குறுங்கை இரும்புலக் கோள் வல் ஏற்றை பூ நுதல் இரும் பிடி புலம்ப தாக்கித் தாழ் நீர் நனந்தலை பெருங்களிறு அ^உம் கல்லக வெற்பன் சொல்லின் தேறி, யாம் எம் நலன் இழந்தனமே; யாமத்து அல்வாய்ப் பெண்டிர்அம்பலொடு ஒன்றிப் புரைஇல் தீமொழி பயிற்றிய உரை எடுத்து ஆனா கௌவைத்து ஆகத் தான் என் இழந்தது, இல் அழுங்கல் ஊரே? திணை : குறிஞ்சித் திணை பாடியவர் : சீத்தலைச் சாத்தனார் குறுகிய முன் கால்களையுடைய - பாய்தலில் வல்ல - பெரிய ஆண்புலி, அழகிய நுதலையுடைய கரி பெண்யானை வருந்துமாறு தாழ்ந்த நீருள்ள அகன்ற இடத்திலே பெரிய ஆண்யானையைத் தாக்கிக் கொல்லும். அம்மலையிடத்தை உடைய வெற்பன் சொல்ல, தெளிந்து யாம் எமது நலத்தை இழந்தோம். யாமத்திலும் துயிலாது பழிமொழி கூறும் வாயையுடைய பெண்கள் சிலர் அறியும் அம்பலோடு ஒன்று சேர்ந்துரு மேன்மையற்ற தீயமொழி சேர்ந்த உரையை எடுத்து அமையாத பழமொழியாகக் (அலராக) கூறுவர். இந்த ஆராவாரமிக்க ஊர்தான் என்ன இழந்தது? இப்படி அலர் தூற்றுகின்றதே! துறை விளக்கம் : சிறைப்புறமாக இருத்தல் என்பது ஒரு மறைவான இடத்தில் இருத்தலாகும். ஆண்யானையைப் புலி தாக்கிக் கொல்லும் மலை வழி இரவில் தலைவன் வரக்கூடாது என்பது குறிப்பு. ஊரில் பழிமொழி பரவியதால் திருமணம் செய்து கொள்ள வேண்டும் என்பதும் குறிப்பு.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.18, p.190", "", "medium", "false"], ["SANG-10-19", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த இருபது பாடல்கள்: “பாடல் : 37 : தோழி தலைவனிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 37 : தோழி தலைவனிடம் கூறியது” (section 10.19).", "பிணங்கு அரில் வாடிய பழவிறல் நனந்தலை உணங்கு ஊண் ஆயத்து ஓர் ஆன் தௌ; மணி பைபய இசைக்கும் அத்தம், வை எயிற்று இவளொடும் செலினோ நன்றே; குவளை நீர் சூழ் மா மலர் அன்ன கண் அழக் கலை ஒழி பிணையின் கலங்கி மாறி அன்பு இலிர் அகறிர் ஆயின், என் பரம் ஆகுவது அன்று இவள் அவலம் நாகத்து அணங்குடை அருந்தலை உடலி, வலன் ஏர்பு ஆர்கலி நல் ஏறு திரிதரும் கார் செய் மாலை வரூஉம் போழ்தே. திணை : பாலைத் திணை பாடியவர் : பேரி சாத்தனார். பின்னிய சிறுகாடு வாட்டமடைந்தது. ஆனால் பழைமையான சிறப்புடையது. அகன்ற இடத்தையுடையது. உலர்ந்த புல் உணவு பெற்ற ஒரு கூட்டத்தில் ஓர் ஆவின் தெளிந்த மணியோசை மெல்ல ஒலிக்கும். அந்தக் காட்டு வழியில் கூரிய பற்கையுடைய இவளோடும் செல்வீரானால் நன்று. அவ்வாறன்றி, நீர் அன்பில்லாது பிரிந்து செல்வீராயின், கலைமானால் ஒழிக்கப்பட்ட பெண்மான் போன்று இவள் கலக்கமடைந்து நீர் சூழ்ந்த சிறந்த குவளை மலர்போன்ற இவள் கண்களிலிருந்து நீர் வடிய அழுவாள். இன்னும் கேளும், பாம்பின் அச்சமுடைய அரிய தலை துணிந்து விழும்படி சினந்து வலப்பக்கமாக எழுந்து ஆரவாரமிக்க நல்ல இடியேறு திரியும். மழைபெய்த மாலைக் காலம் வரும் பொழுது இவள் அவலம் பெரிதாகும். அப்போது அவைளக் காப்பது என் பொறுப்பு ஆகாது. துறை விளக்கம் : திருமணத்தை இடையிலே வைத்துப் பொருளுக்காகப் பிரியும் காலை, தோழி கூறியது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.19, p.191", "", "medium", "false"], ["SANG-10-20", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த இருபது பாடல்கள்: “பாடல் : 38 : தலைவி தோழியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 38 : தலைவி தோழியிடம் கூறியது” (section 10.20).", "வேட்டம் பொய்யாது வலை வளம் சிறப்ப பாட்;டம் பொய்யாது பரதவர் பகர, இரும் பனந்தீம் பிழி உண்போர் மகிழும் ஆர்கலி யாணர்த்து ஆயினும், தேர் கெழு மெல்லம்புலம்பன் பிரியின், புல்லெனப் புலம்பு ஆகின்றே தோழி! கலங்கு நீர்க் கழி சூழ் படப்பை காண்டவாயில் ஒலி கா ஓலை முள் மிடை வேலி பெண்ணை இவரும் ஆங்கண், வெள் மணல் படப்பை எம் அழுங்கல் ஊரே திணை : நெய்தல் திணை பாடியவர் : உலோச்சனார் தோழி! கலங்கிய நீரையுடைய கழிகள் சூழ்ந்த கொல்லைகளையுடைய தாழைத்துறையில் தழைத்து வளர்ந்த முற்றிய பனை ஓலையோடு முட்களையும் சேர்த்துக் கட்எடிஎய வேலியின் பக்கத்தில் பனைமரங்கள் வளர்ந்திருக்கும். அவ்விடத்தில் வெள்ளை நிறமான மணற் கொல்லைகளையுடைய ஆரவாரமிக்க நம்ஊரில், மீன் வேட்டை பொய்யாது, வலைவளம் சிறப்பாக உள்ளது. மேகம் பொய்யாது என்று பரதவர் பகர்கின்றனர். கரிய பனையின் இனிய கள்ளை உண்போர் மகிழ்கின்றனர். இவ்வாறு ஆரவாரதிக்க புது வருவாயை உடையதெனினும், தேர்மிக்க நெய்தல் நிலத் தலைவன் நம்மை விட்டுப் பிரியின் பொலி விழுந்தாற்போலக் காணப்பட்டு வருத்தம் தருகின்றது. துறை விளக்கம் : திருமணத்தை இடையிலே வைத்துப் பொருளுக்காகப் பிரியும் காலை, தோழி கூறியது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.20, p.192", "", "medium", "false"], ["SANG-10-21", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த இருபது பாடல்கள்: “பாடல் : 39 : தலைவன் தலைவியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 39 : தலைவன் தலைவியிடம் கூறியது” (section 10.21).", "சொல்லின் சொல் எதிர் கொள்ளாய், யாழ நின் திரு முகம் இறைஞ்சி நாணுதி கதுமெனக் காமம் கைம்மிகின் தாங்குதல் எளிதோ? கொங்கேழ் இரும் புறம் நடுங்கக் குத்திப் புலி விளையாடிய புலவு நாறு வேழத்தின் தலை மருப்பு ஏய்ப்ப, கடைமணி சிவந்த நின் கண்ணே கதவ அல்ல் நண்ணார் அரண்தலை மதிலர் ஆகவும், முரசு கொண்டு, ஓம்பு அரண் கடந்த அடு போர் செழியன் பெரும் பெயர்க் கூடல் அன்ன நின் கரும்புடைத் தோளும் உடையவால் அணங்கே. திணை : குறிஞ்சித் திணை பாடியவர் : மருதன் இளநாகனார் பெண்ணே! என் இனிய சொல்லிற்கு எதிர்ச்சொல் சொல்லாமலிருக்கின்றாய். ஆனால், உன் அழகிய முகம் கவிழ நின்று விரைவாக நாணம் கொள்கிறாய். காமம் கைகடந்து போனால் காத்துக் கொள்ளுதல் எளிதாகுமோ? புலியின் வளைந்த வரிகளையுடைய பெரிய முதுகில் நடுங்கும்படி குத்தி விளையாடிய யானையின் புலால் நாறும் கொம்பின் நுனி பொலக் கடைமணி சிவந்த உன் கண்கள் சினத்தையுடையன. அவை மட்டுமல்ல. பபைவர் பாதுகாப்பான இடமாகிய கோட்டைச் சுவரின் உள்ளே இருப்பவராகவும் அவர் பாதுகாப்பான அரணை வென்று முரசைக் கைக்கொண்டு அடும்போரைச் செய்யும் செழியனின் பெரும்புகழையுடைய கூடல் நகரம் போன்ற உன் கரும்பு எழுதப்பட்ட தோள்களும் என்னை வருத்தம் செய்ய உள்ளனவே. துறை விளக்கம் : இரண்டாம் நாள் சந்திப்பில் எதிர்ப்பட்ட போது தலைவன் சொல்லியது. உன் கண்ணும் தோளும் என்னை வருத்தின. என் சொல்லிற்கு எதிர்ச்சொல் சொல்லாது உள்ளாய்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.21, p.192", "", "medium", "false"], ["SANG-10-22", "Sangam literature", "சங்க இலக்கியம் – நற்றிணை – அடுத்த
