ுற்றம் உண்டு பிழைக்க வேண்டின், அவன் அயலூரக்குச் செல்லாதபோதே, உன் பசிக்குப் பகையான பரிசிலை, உன் வறுமையைக் காட்டிப் பெற்றுக்கொள்வதற்கு, இப்போதே நீ செல்வாயாக!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.33, p.277", "", "medium", "false"], ["SANG-12-34", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 182” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 182” (section 12.34).", "பாடியவர் : கடலுள் மாய்ந்த இளம்பெருவழுதி திணை : பொதுவியல் துறை : பொருண்மொழிக் காஞ்சி பாண்டிய நாட்டு மக்கள் அயல்நாட்டுக்ககுச்சென்று வாணிகம் செய்து வந்தனர். மன்னர் அயல்நாட்டுக்குச் சென்று போர் தொடுத்தனர். அவ்வாறு செல்லும் படைவீரர் கொண்ட கலங்களுள் அரசகுமரரும் செல்வது வழக்கம். பாண்டிய அரசகுமரருள் இளம்பெருவழுதி ஒருகால் கலத்தில் சென்றான். கல் கவிழ மாண்டான். அவ்வாற அவன் மாள்வதற்கு முன்னம் சான்றோரின் இயல்பை வியந்து விதந்து பாடுவானாயினன். உண்டால் அம்ம இவ்வுலகம். இந்திரர் அமிழ்தம் இயைவதாயினும் இனிது, எனத் தமியர் உண்டலும் இலNர் முனிவிலர் துஞ்சலும் இலர் பிறர் அஞ்சுவது அஞ்சிப், புகழ் எனின் உயிரும் கொடுக்குவர், பழியெனின் உலகுடன் பெறினும் கொள்ளலர், அயர்விலர், அன்ன மாட்சி அனையராகித், தமக்கென முயலா நோன் தாள், பிறர்க்கென முயலுநர் உண்மையானே. தேவர்க்ள உண்ணும் அமிழ்தமே கிடைப்பதாயினும ;அதைத் தனித்திருந்து உண்ணார். யாரையும் வெறுக்க மாட்டார், மற்றவர் அஞ்சுவதற்றுகுத் தாமும் அஞ்சுவர். சோம்பி இரார், புகழ் பொருட:டு உயிரையும் தருவர். பழியுடன் வருவதாயின் உலகம் முழுவரையும ;ஆள்வதாயினும் அதனை வே;ணடார். கவலை கொள்ளார். இத்தகைய சான்றோர் - பிறர் நல் பேணும் இயல்புடையோர் உள்ளதால் இவ்வுலகம் உளதாகின்றது என்று பாடினார்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.34, p.278", "", "medium", "false"], ["SANG-12-35", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 183” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 183” (section 12.35).", "பாடியவர் : ஆரியப்படை கடந்த நெடுஞ்செழியன் திணை : பொதுவியல் துறை : பொருண்மொழிக் காஞ்சி சிலப்பதிகாரக் கோவலனைக் கொல்வித்தவன் இவனே ஆவான். இவன் புலி மன்னனாய் விளங்கியதுடன் கவிமன்னனாகவும் விளங்கினான். கல்வியின் சிறப்பை இதில் அவன் விளக்குகிறான். உற்றுழி உதவியும் உறுபொருள் கொடுத்தும் பிற்றை நிலை முனியாது கற்றல் நன்றே, பிறப்பு ஓரன்ன உடன் வயிற்று உள்ளும், சிறப்பின் பாலால் தாயும் மனம் திரியும், ஒரு குடிப் பிறந்த பல்லோருள்ளும் ‘மூத்தோன் வருக என்னாது’ அவருள் அறிவுடையோன் ஆறு அரசம் செல்லும் வேற்றுமை தெரிந்த நாற்பால் உள்ளும், கீழ்ப்பால் ஒருவன் கற்பின், மேற்பால் ஒருவனும் அவன் கண் படுமே. பிறப்பினால் ஒரே தன்மை கொண்ட ஒரு தாய் வயிற்றில் பிறந்தவர்களுக்குள்ளும் கல்விச்சிறப்புக் காரணமாகப் பெற்றெடுத்த தாயும் மனம் வேறுபடுவாள். ஒரு குடியிலே பிறந்த பலருள்ளும் கல்வி கற்காத காரணத்தாhலர் மூத்தவனை வருக என்று அழைக்காமல், அவர்களுக்குள் அறிவுடையவன் செல்லும் வழியிலேயே அரசன் தன் அரசியலை நடத்துவான். வேறுபாடுள்ள நான்கு குலங்களுள்ளும், கீழ்க்குலத்துள் பிறந்த ஒருவன் அகல்வி கற்றால் மேல் குலத்திலுள்ள ஒருவனும் அவனை வணங்கவான். ஆதலால் ஒருவன் தன் ஆசிரியர்க்குத் துன்பம் நேர்ந்துவிடத்து அவர்ககு ; உதவி செய்தும், மிக்க பொருளைத் தந்தும் அவர்ககு ; வழிபாடு செய்யும் தன்மையை வெறுக்காமலும் கற்பது நலம்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.35, p.278", "", "medium", "false"], ["SANG-12-36", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 184” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 184” (section 12.36).", "பாடியவர் : பிசிராந்தையார் பாடப்பட்டோன் : பாண்டியன் அறிவடைநம்பி திணை : பாடாண் துறை : செவியறிவுறூஉ காய் நெல் அறுத்துக் கவளங்கொளினே, மா நிறைவு இல்லதும் பன் நாட்கு ஆகும்; நூறு செறு ஆயினும் தமித்துப் புக்கு உணினே, வாய் புகுவதனினும் கால் பெரிது கெடுக்கும்; அறிவுடை வேந்தன் நெறி அறிந்து கொளினே. கோடி யாத்து நாடு பெரிது நந்தும்; மெல்லியன் கிழவன் ஆகி, வைகலும் வரிசை அறியாக் கல்லென் சுற்றமொடு பரிவு தப எடுக்கும் பிண்டம் நச்சின், யானை புக்க புலம் போலத், தானும் உண்ணான், உலகமும் கெடுமே. ஒரு மா என்னும் அளவை விடக்குறைந்த நிலமேயாயினும் விளைந்த நெல்லைக்கொண்டு வந்து யானைக்குக் கவளமாக்கிக் கொடுக்கப் பெற்றால், அது யானைக்குப் பல நாட்களு;ககு உணவாக ஆகும். நூறு செய் அளவுடைய பெரிய நிலமாயினும் அதனுள் யானை தானே தனியாய்ப் புகுந்து உண்ணத் தொடங்கினால், அந்த யானையின் வாயினால் உண்ணும் நெல்லைக் காட்டிலும் பன்மடங்கு அதிகமான நெல்லை அதன் கால் மிதித்து மிகுதியானதைக் கெடுத்துவிடும். அவ்வாறே அறிவுடைய மன்னன் ஒருவன் குடி மக்களிடமிருந்து வரி வாங்கம் நெறியை அறிந்து வாங்குவானானால், அவனது நாட்டில், வாழும் குடிமக்கள் அவனுக்குக் கோடிக்கணக்கான பொருளை த் தந்து தாங்களும் மிகுதியாய்த் தழைப்பர். மன்னன் அந்நெறியை அறியும் அறிவற்றவனாகி நாள்தோறும் தகுதி அறியததவரும் உறுதி கூறாதவருமான, மன்னன் விரும்பியதையே விரும்பிப் பேசும் இயல்புடைய ஆரவாரம் உடைய அமைச்சர்களுடன் கூடி, கொண்ட அன்பு கெடும்படி வாங்கும் வரியை விரும்புவானாயின், அந்த யானை புகுந்த விளைநிலத்தைப் போல, தானும உண்ணப் பெறான், உலகமும் அழியும்", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.36, p.279", "", "medium", "false"], ["SANG-12-37", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 185” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 185” (section 12.37).", "பாடியவர் : தொண்டைமான் இளந்திரையன் திணை : பொதுவியல் துறை : பொருண்மொழிக் காஞ்சி கால் பார் கோத்து ஞாலத்து இயக்கும் காவல் சாகாடு உகைப்போன் மாணின், ஊறு இன்றாகி ஆறு இனிது படுமே; உய்த்தல் தேற்றான் ஆயின், வைகலும் பகைக் கூழ் அள்ளல் பட்டு, மிகப் பல் தீ நோய் தலைத்தலைத் தருமே. சக்கரத்தையும் பாரையும் கோத்து உலகத்தில் செலுத்தப்படும் காவலையுடைய வண்டி, அதனைச் செலுத்துபவன் மாட்சிமை உடையவனாக விளங்கினால், இடர்ப்பாடில்லாது வழியில் இனிதாகச் செல்லும். அவ்வண்டியை நன்கு செலுத்துதலை அவன் அறியானாயின். அது நாள்தோறும் பகையான செறிந்த சேற்றிலே அழுந்தி மிகப்பல தீய துன்பத்தை மேன் மேலும் கொடுக்கும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.37, p.280", "", "medium", "false"], ["SANG-12-38", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 186” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 186” (section 12.38).", "பாடியவர் : மோசி கீரனார் திணை : பொதுவியல் துறை : பொருண்மொழிக் காஞ்சி நெல்லும் உயிர் அன்றே; நீரும் உயிர் அன்றே; மன்னன் உயிர்த்தே மலர்தலை உலகம்; அதனால் ‘யான் உயிர்’ என்பது அறிகை, வேல் மிகு தானை வேந்தற்குக் கடனே. பரந்த இடத்தையுடைய இந்த உலகம் மன்னன் என்ற உயிரை உடையது. அதனால், இவ்வுலகத்தவர்க்கு நெல் என்பது உயிர் அன்று. நீரும் உயிர் அன்று. நான் இந்த உலகத்துக்கு உயிர் என்பதை அறிதல், வேல்கள் மிக்க படையை உடைய மன்னனுக்குக் கடமையாகும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.38, p.280", "", "medium", "false"], ["SANG-12-39", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 187” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 187” (section 12.39).", "பாடியவர் : ஒளவையார் திணை : பொதுவியல் துறை : பொருண்மொழிக் காஞ்சி நாடாக ஒன்றோ, காடாக ஒன்றோ, அவலாக ஒன்றோ, மிசையாக ஒன்றோ, எவ்வழி நல்லவர் ஆடவர், அவ்வழி நல்லை வாழிய நிலனே. நிலமே! நீ ஒன்றில் நாடே ஆகுக. அதுவன்றி ஒள்றில் காடே ஆகுக. ஒன்றில் பள்ளமே ஆகுக! அதுவன்றி ஒன்றில் மேடே ஆகுக. அஃது எவ்வறாயினும் எவ்விடத்தில் ஆண் மக்கள் நல்லவரோ, அவ்விடத்தில் நீயும் நல்லை! அதுவன்றி நினக்கு என ஒரு நலமும் உடையை அல்லை! நீ வாழ்க!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.39, p.280", "", "medium", "false"], ["SANG-12-40", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 188” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 188” (section 12.40).", "பாடியவர் : பாண்டியன் அறிவுடை நம்பி, திணை : பொதுவியல் துறை : பொருண்மொழிக் காஞ்சி படைப்புப் பல படைத்துப் பலரோடு உண்ணும் உடைப் பெருஞ் செல்வர் ஆயினும், இடைப்படக் குறுகுறு நடந்து, சிறு கை நீட்டி, இட்டும், தொட்டும், கவ்வியும், துழந்தும், நெய்யுடை அடிசில் மெய்பட விதிர்த்தும், மயக்குறு மக்களை இல்லோர்க்குப், பயக்குறை இல்லைத் தாம் வாழு நாளே. பெறக்கூடிய செல்வங்கள் பலவற்றையும் பெற்றுப் பலருட்ன உடனிருந்து உண்ணும் உடைமை மிக்க செல்வராக இருப்பினும், குறுகக் குறுக நடந்து சென்று சிறிய கையினை நீட்டிக் கலத்தில் உள்ளதைத் தரையிலே இட்டும் பிசைந்து தோண்டியும் வாயால் கவ்வியும் கையால் துழாவியும் நெய் கலந்த சோற்றை உடம்பில் படுமாறு சிதறியும், இங்ஙனம் அறிவை இன்பத்தார் மயக்கும் மைந்தரைப் பெறாதவர்க்குத் தாம் வாழ்கின்ற நாளில் பயனாகிய முடிக்கப்படும் பொருள் இல்லை.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.40, p.281", "", "medium", "false"], ["SANG-12-41", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 189” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 189” (section 12.41).", "பாடியவர் : மதுரைக் கணக்காயனார் மகனார் நக்கீரனார் திணை : பொதுவியல் துறை : பொருண்மொழிக் காஞ்சி தெண்கடல் வளாகம் பொதுமை இன்றி, வெண்குடை நிழற்றிய ஒருமையோர்ககு ; ம், நடுநாள் யாமத்தும் பகலும் துஞ்சான் கடு மாப் பார்க்கும் கல்லா ஒருவற்கும், உண்பது நாழி, உடுப்பவை இரண்டே, பிறவும் எல்லாம் ஓரொக்குமே, அதனால் செல்வத்துப் பயனே ஈதல், துய்ப்பேம் எனினே, தப்புந பலவே. தெளிவான நீரால் சூழப்பட்ட இவ்வுலகம் முழுவதையும் மற்ற மன்னவர்க்ககும் பொது வாதலன்றித் தமக்கே உரியதாக ஆண்டு வெண்கொற்றக் குடையால் நிழல் செய்யும் ஒரு தன்மை கொண்டர்ககு; ம். நள்ளிரவிலும் பகலிலும் உறங்காதவனாய் விரைவாக ஓடுகின்ற விலங்ககளை வேட்டையாடி வீழ்த்த எண்ணுகின்ற கல்வியில்லாத ஒருவனுக்கும் (ஆகிய அவ்விருவர்க்கும்) உண்ணப்படும் பொருள் நாழி அளவாகும். உடுக்கப்படும் உடை மேலே ஒன்றும் இடையிலே ஒன்றுமாக இரண்டேயாகுமட் மற்றவை எல்லாமும் இப்படியே ஒக்கும். ஆகவே, ஒருவன் தான் படைக்கும் செல்வத்தால் பெறும் பயன் மற்றவர்க்குக் கொடுத்தலாகும். அவ்வாறன்றி யாமே அனுபவிப்போம் என்று எண்ணினால் தவறுவன பலவாகும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.41, p.281", "", "medium", "false"], ["SANG-12-42", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 190” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 190” (section 12.42).", "பாடியவர் : சோழன் நல்லுருத்திரன் திணை : பொதுவியல் துறை : பொருண்மொழிக் காஞ்சி விளை பதச் சீறிடம் நோக்கி, வளை கதிர் வல்சி கொண்டு அi ளமல்க வைக்கும் எலி முயன்றனையர் ஆகி, உள்ள தம் வளன் வலி உறுக்கும் உளம் இலாளரோடு இயைந்த கேண்மை இல்லாகியரோ! கடுங்கண் கேழல் இடம்பட வீழ்ந்தென, அன்று அவண் உண்ணாதாகி வழிநாள், பெருமலை விடரகம் புலம்ப வேட்டெழுந்து,. இருங்களிற்று ஒருத்தல் நல் வலம்படுக்கும் புலி பசித்தன்ன மெலிவு இல் உள்ளத்து, உரனுடையாளர் கேண்மையொடு இயைந்த வைகல் உளவாகியரோ. விளைந்த விளைவையுடைய சிறிய இடத்தைப் பார்த்து வளைந்த நெற்கதிரான உணவைக்கொண்டு தன் வளையில் வைக்கும் எலி முயன்றாறர்போன்ற சிறிய முயற்சியையுடையவராகித் தம்மிடம் உள்ள செல்வத்தை, அனுபவிக்காது இறுப் பிடித்துச் சேர்த்து வைக்கும் ஊக்க உயர்வு இல்லாதவருடன் பொருந்திய நட்பு! இலலையாகுக. அஞ்சாமை கொண்ட கேழல் பன்றியானது (காட்டுப்பன்றி) தன் இடப் பக்கமாக வீழ்ந்ததால், அன்று அதனை உண்ணாமல் நீங்கிப் பின்நாள், பெரிய மலையில் தன் குடையில் தனிமைப்பட உணவை விரும்பி எழுந்து பெரிய ஆண் யானை நல்ல வலப் பக்கத்தி வீழ்த்தும் தன்மையுடைய புலி பசிததாற் போன்ற குறையில்லாத மேற்கோளையுடைய வன்மையுடையவர் நட்புடன் பொருந்திய நாட்கள் எனக்கு உள்ளனவாகுக.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.42, p.282", "", "medium", "false"], ["SANG-12-43", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 191” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 191” (section 12.43).", "பாடியவர் : பிசிராந்தையார் திணை : பொதுவியல் துறை : பொருண்மொழிக் காஞச்p யாண்டு பலவாக நரையில ஆகுதல் யாங்கு ஆகியர் என வினவுதிர் ஆயின், மாண்ட என் மனைவியொடு மக்களும் நிரம்பினர், யான் கண்ட அனையர் இளையரும், வேந்தனும் அல்லவை செய்யான் காக்கும், அதன்தலை ஆன்று அவிந்து அடங்கிய கொள்கைச் சான்றோர் பலர், யான் வாழும் ஊரே பிசிராந்தையாரே! உங்களுள்ககு வயது பலவாக இருக்கவும் நடை உண்.hகாது இருப்பதை எவ்வாறு பெற்றீர்? என்று என்னை நோக்கிக் கேட்பீரானால், சிறந்த தலால் நன்மையால் சிறந்து விளங்கும் பெரியோரை மதிப்பதும் இல்லை. சிறியவரை அவமதித்தல் பெரியவரை மதித்தலைக் காட்டிலும் அதிகமாக உடையோம் இல்லை. ஆதலால் எங்கட்கு எல்லா ஊர்களும் எம் ஊர்களாகும். எல்லாரும் உறவினரே ஆவர்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.44, p.283", "", "medium", "false"], ["SANG-12-45", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 193” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 193” (section 12.45).", "பாடியவர் : ஓர் ஏர் உழவனார் திணை : பொதுவியல் துறை : பொருண்மொழிக் காஞ்சி அதள் எறிந்தன்ன நெடுவெண்களரின் ஒருவன் ஆட்டும் புல்வாய் போல, ஓடி உய்தலும் கூடும் மன், ஒக்கல் வாழ்க்கை தட்குமா காலே. தோலைத் திருப்பி வைத்தாற் போன்ற பெரிய வெண்மையான களர் நிலத்தில் ஒருவனால் துரத்தப்படும் மானானது தப்பிச் சென்று பிழைக்குமாறு போல் யானும் நல்ல நெறியில் போய்ப் பிழைக்கவும் கூடும். ஆனால் உறவினருடன் கூடி வாழும் வாழ்க்கை மேலே செல்லவொட்டாது காலைத் தடுக்கும். ஆதலால் உய்தல் முடியாததாக உள்ளது!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.45, p.284", "", "medium", "false"], ["SANG-12-46", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 194” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 194” (section 12.46).", "பாடியவர் : பக்குடுக்கை நன்கணியார் திணை : பொதுவியல் துறை : பொருண்மொழிக் காஞ்சி ஓரில் நெய்தல் கறங்க, ஓர் இல் ஈர்ந் தண் முழவின் பாணி ததும்பப், புணர்ந்தோர் பூ அணி அணியப், பிரிந்தோர் பைதல் உண்கண் பனி வார்பு உறைப்பப், படைத்தோன் மன்ற அப் பண்பிலாளன், இன்னாது அம்ம இவ்வுலகம், இனிய காண்க இதன் இயல்பு உணர்ந்தோரே. ஒரு வீட்டிலே சாவுக்குரிய பறையானது ஒலிக்கவும், மற்றொரு வீட்டில் திருமணத்துக்குரிய முரசு மிகுந்து ஒலிக்கவும், தம் தம் கணவருடன் கூடிய மகளிர் பூவணியை அணியவும், தம் தம் தலைவரைப் பிரிந்த மகளிரின் வருத்தத்தையுடைய கண்கள் நீர் வடிந்து துளிக்கவும், அந்த நல்ல இயல்பு இல்லாத நான்முகன் படைக்கும்; போதே இவ்வாறு இருவேறு நிலைகளை உறுதியாய்;ப் படைத்துவிட்டான். இத்தகைய இயல்புடைய இந்த உலகத்து இயற்கை கொடியது. இந்த உலகத்தின் இயல்பை உணர்ந்தவர் வீட்டின்பத்தை அளிக்கும் நல்ல செயல்களை அறிந்து செய்வார்களாக!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.46, p.284", "", "medium", "false"], ["SANG-12-47", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 195” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 195” (section 12.47).", "பாடியவர் : நரிவெரூஉத்தலையார் திணை : பொதுவியல் துறை பொருண்மொழிக் காஞ்சி பல் சான்றீரே! பல் சான்றீரே! கயல் முள் அன்ன நரை முதிர் திரை கவுள், பயன் இல் மூப்பின் பல் சான்றீரே! கணிச்சிக் கூர்ம் படைக் கடுந்திறல் ஒருவன் பிணிக்கும் காலை இரங்குவிர் மாதோ, நல்லது செய்தல் ஆற்றீர் ஆயினும், அல்லது செய்தல் ஓம்புமின், அது தான் எல்லாரும் உவப்பது அன்றியும், நல் ஆற்றுப்ப^உம் நெறியுமார் அதுவே. பல நல்ல குணங்களை உடையவர்களே! பல நல்ல குணங்களை உடையவர்களே! கயல் மீனின் முள்ளைப் போன்ற நரை மயிர் மிக்க, சுருங்கிய கன்னங்களையும் பயன் இல்லாத முதுமையையும் உடைய பல நற்குணங்களையுடையவரோ! மழு என்ற கூர்மையான படைக்கலத்தையும் மிகுந்த வலிமையiயும் உடைய கூற்றுவன் உங்களைப் பாசக்கயிற்றால் கட்டிக்கொண்டு போகுங் காலத்தில் நீங்கள் மற்றவர்க்கு நன்மைகளைச் செய்யாது போயினும் தீவினையைச் செய்வதைக் கைவிடுங்கள். அதுதான் எல்லாராலும் புகழ்ந்து போற்றப்படுவதாகும். அன்றியும் உங்களை நல்ல நெறியில் செலுத்தும் வழியும் அதுவேயாகும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.47, p.284", "", "medium", "false"], ["SANG-12-48", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 196” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 196” (section 12.48).", "பாடியவர் : ஆவூர் மூலங்கிழார் பாடப்பட்டோன் : பாண்டியன் இலவந்திகைப் பள்ளித் துஞ்சிய நன்மாறன் திணை : பாடாண் துறை : பரிசில் கடாநிலை ஒல்லுவது ஒல்லும் என்றலும், யாவர்ககு ; ம் ஒல்லாது இல்லென மறுத்தலும், இரண்டும் ஆள் வினை மருங்கின் கேண்மைப் பாலே; ஒல்லாது ஒல்லும் என்றலும், ஒல்லுவது இல்லென மறுத்தலும், இரண்டும் வல்லே; இரப்போர் வாட்டல் அன்றியும், புரப்போர் புகழ் குறைப^உம் வாயில் அத்தை, அனைத்தாகியர் இனி; இதுவே எனைத்தும் சேய்த்துக் காணாது கண்டனம்,. அதனால், நோயிலர் ஆகநின் புதல்வர், யானும் வெயிலென முனியேன், பனியென மடியேன், கல் குயின்றன்ன என் நல்கூர் வளி மறை நாணலது இல்லாக் கற்பின் வாணுதல் மெல்லியல் குறுமகள் உள்ளிச் செல்வல் அத்தை; சிறக்க நின் நாளே! ஒருவர் தம்மால் கொடுக்கக் கூடியதைக் கொடுக்க இயலும் இயலாததைக் கொடுக்க இயலாது என்று சொல்லி மறுத்தலும் என்ற இந்த இவ்விரண்டும ;கொடைத் தன்மையுடையவரின் இயல்புகள், தம்மால் கொடுக்க முடியாதவற்றைக் கொடுக்க முடியும் என்று கூறுவதலும், கொடுக்க முடியாது மறுத்தலும் என்ற இந்த இரண்டும் இரப்பவரை வருந்தச் செய்வனவாகும். அதுவே அல்லாமலும் கொடுக்கும் கொடையாளரின் புகழும் குறைகின்ற வழியுமாகும். இப்போது என்னிடம் நீ செய்த செயலும் அத்தன்மையுடையதே! இச்செயல் எம்மவர் முன்பு காணாதது. இதனை யாம் கண்டோம். நின் மக்கள் நோயில்லாது இருப்பாராக! நானும் வெயிலாக உள்ளது என்று எண்ணி (என் ஊருக்குச் செல்வதை) வெறுக்காமல், பனி என்று கருதிச் செல்வதை விடுத்துச் சோம்பியிராமல், கல்லால் செய்தது போன்ற என் வறுமை மிகுதியால் காற்று மறைவிடமான வீட்டில், நாணம் அல்லாது வேறில்லாத கற்பினையும் ஒளியுடைய நெற்றியையும் மென்மையான இயலையும் உடையவளை எண்ணிச் செல்வென். நின் ஆயுள் சிறப்பதாகுக!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.48, p.285", "", "medium", "false"], ["SANG-12-49", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் :197” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் :197” (section 12.49).", "பாடியவர் : கோனாட்டு எறிச்சலூர் மாடலன் மதுரைக் குமரனார். - பாடப்பட்டோன் : சோழன் குராப்பள்ளித் துஞ்சிய பெருந்திருமாவளவன் திணை : பாடாண் துறை : பரிசில் கடாநிலை வளி நடந்தன்ன வாஅய்ச் செலல் இவுளியொடு கொடி நுடங்கு மிசைய தேரினர் எனாஅக், கடல் கண்டன்ன ஒண் படைத் தானையொடு மலைமாறு மலைக்கும் களிற்றினர் எனாஅ, உரும் உடன்றன்ன உட்குவரு முரசமொடு செரு மேம்ப^உம் வென்றியர் எனாஅ, மண்கெழு தானை ஒண் பூண் வேந்தர் வெண்குடைச் செல்வல் வியத்தலோ இலமே, எம்மால் வியக்கப்ப^உமோரே, இடு முள் படப்பை மறி மேய்ந்து ஒழிந்த குறு நறு முஞ்ஞைக் கொழுங்கண் குற்றடகு புன்புல வரகின் சொன்றியொடு பெறூஉம், சீறூர் மன்னர் ஆயினும் எம் வயின் பாடறிந்து ஒழுகும் பண்பினோரே, மிகப் பேர் எவ்வம் உறினும் எனைத்தும் உணர்ச்சியில்லோர் உடைமை உள்ளேம், நல்லறிவுடையோர் நல்குரவு உள்ளுதும் பெரும, யாம் உவந்து நனி பெரிதே. பெரு! காற்று வீசுவதைப்போன்று தாசி சலெ;லும் வேக் கதியையுடைய (ஒட்டத்தையுடைய) குதிரையுடன், கொடி அசையும் உச்சியையுடைய தேர்களை உடையவர் என்றும் , கடலைப் பார்த்தாற் போல் ஒளியுடைய ஆயுதங்களையுடைய படைகளுடனே, மலையுடனே சினந்து போரிடுகின்ற யானைகளையுடையவர் என்றும். இடி இடித்தாற் போன்ற அச்சம் பெருந்திய முரசடனே போரில் மேம்படும் வெற்றியினை உடையவர் என்றும், நிலத்தைப் பொருந்தியபடையையுடைய ஒளியுடைய பூணையுடைய மன்னரின் வெண்கொற்றக்குடை நிழல் செய்கின்ற அரச செல்வத்தை யாம் மதிக்கமாட்மோட். கட்டப்பட்ட முள்வேலியை உடைய தோட்டத்து, மறியானது தின்றது போக மிஞ்சி நின்ற குறுகிய மணத்தையுடைய முஞ்ஞை என்ற செடியினது கொழுமையான கணுவில் தோன்றிய சிறிய இலையை, புன்மையான நிலத்தில் விளைந்த வரகரிசிச் சோற்றுடன் பெறுகின்ற சிறிய ஊரையுடைய மன்னரேயாயினும், எம்மிடத்தில் செய்யும் முறையை அறிந்து நடக்கும் குணத்தையுடையவர்களே எம்மால் மிக்கப்படுபவர்கள் ஆவார்கள். யாம் மிகப் பெரிய துன்பம் அடைந்தாலும் சற்றும் அறிவற்றவரின் செல்வம் பயன்படாததால் அச்செல்வத்தை நினைக்க மாட்டோம். நல்லறிவுடையோரின் வறுமையானது, பயன்படுவதால் அதனையே யான் விரும்பி மிகவும் நினைப்போம்", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.49, p.286", "", "hard", "false"], ["SANG-12-50", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 198 பாடியவர் : வடம வண்ணக்கன்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 198 பாடியவர் : வடம வண்ணக்கன்” (section 12.50).", "பேரிசாத்தனார் பாடப்பட்டோன் : பாண்டியன் இலவந்திகைப் பள்ளித் துஞ்சிய நன்மாறன். திணை : பாடாண் துறை : பரிசில் கடாநிலை “அருவி தாழ்ந்த பெரு வரை போல ஆரமொடு பொலிந்த மார்பின் தண்டாக், கடவுள் சான்ற கற்பின், சேய் இழை மடவோள் பயந்த மணி மருள் அவ்வாய்க் கிண்கிணிப் புதல்வர் பொலிக” என்று ஏத்தித், திண் தேர் அண்ணல் நின் பாராட்டிக், காதல் பெருமையின் கனவினும் அரற்றும் என் காமர் நெஞ்சம் ஏமாந்து உவப்ப, ஆல் அமர் கடவுள் அன்ன நின் செல்வம், வேல் கெழு குருசில் கண்டேன்; ஆதலின் விடுத்தனென், வாழ்க நின் கண்ணி! தொடுத்த தண் தமிழ் வரைப்பு அகம் கொண்டியாகப், பனித்துக் கூட்டுண்ணும் தணிப்பு அருங் கடுந்திறல் நின்னோரன்ன நின் புதல்வர், என்றும் ஒன்னார் வாட அருங்கலம் தந்து, நும் பொன்னுடை நெடுநகர் நிறைய வைத்த நின் முன்னோர் போல்க, இவர் பெருங்கண்ணோட்டம்! யாண்டும் நாளும் பெருகி ஈண்டு திரைப் பெருங்கடல் நீரினும் அக்கடல் மணலினும், நீண்டு உயர் வானத்து உறையினும், நன்றும் இவர் பெறும் புதல்வர்க் காண்தொறும் நீயும் புகன்ற செல்வமொடு புகழ் இனிது விளங்கி, நீடு வாழிய நெடுந்தகை! யானும் கேள் இல் சேஎய் நாட்டின் எந்நாளும், துளி நசைப் புள்ளின் நின் அளி நசைக்கு இரங்கி நின் அடி நிழல் பழகிய அடி உறை கடு மான் மாற மறவாதீமே. திண்ணிய தேரையடைய மன்ன! அருவியானது பொருந்தி யமலை போல மாலையுட்ன் விளங்கம் நின்மார்பில், வேட்கை தணியாத தெய்வத் தன்மை பொருந்திய கற்பையும், சிவந்த அணிகளையும் அணிந்த உன் மனைவி பெற்ற, பவழத்தைப் போன்ற அழகிய வாயையும் கிண்கிணி என்ற அணியையும் அணிந்த நின் மைந்தர் மேன்மையுடன் விளங்கக என்று வாழ்ததி நின்னைப் பாராட்டி நீ தரும் பரிசில் மீது வைத்த அன்பு பெரியதாதலால் கனவினும் உன் புகழையே என் விருப்பம் பொருந்திய நெஞ்சம் கூறும். இத்தகைய என் நெஞ்சம் மகிழ ஆல இலையில் பள்ளி கொண்ட திருமால் போன்ற உன் செல்வத்தை எல்லாம், வேலையுடைய தலைவ! நான் பார்த்தேன். ஆதலால், உன்னிடம் இப்போது விடை பெற்றேன். நின் தலைமாலை வாழ்க! தொடர்புடைய தமிழகம் முழுதும் கொள்ளையாகக்கொண்டு, நின் பகைவரை வென்று அவர்கள் பொருள் களையும் பெற்று உண்ணும் குறைக்க இயலாத மிக்க வன்மை உடைய உன்னைப் போன்ற வன்மை உடைய உன் மைந்தர், எக்காலத்தும் பகைவர் வருந்த வென்ற அவர்களடைய செல்வத்தைக்கொணர்ந்து உன் பொன்னுடைய நகரத்த்pல் நிறந்திருக்குமாறு வைத்த உன்னுடைய முன்னோரைப் போல இவர்களின் கண்ணோட்டமும் அமைவதாகுக. எப்போதும் எந்நாளும் மிக்கு விளங்கம் செறிந்த அலையை உடைய கடல் நீரை விடவம், அக்கடல் கொழித்த மணலை விடவம், நீண்ட உயர்ந்த மழைத்துளியை விடவம். பெரிதும், இவர்கள் பெறம் மைந்தரைக் காணுந்தோறும், நீயும் விரும்பிய செல்வத்துடனே புகழும் இனிதாக விளங்கி நீண்ட காலம் வாழ்க! பெருந்தகுதியுடையவனே! நானும் உறவல்லாத nhலைவான நாட்டில் நாள்தோறும் மழைத்துளியை விரும்பும் வானம்பாடி என்ற பறவையைப் போல நின் கொடைத்தன்மை மீது உண்டான விருப்பத்தால் இரங்கி நின் அடி நிழலில் பழகியஅடியில் வாழ்வேன்! விரைவான ஓட்டத்மைதயுடைய கதிரையுடைய நன்மாறனே! நீ எனக்குச் செய்த செயலை மறவாதே!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.50, p.287", "", "hard", "false"], ["SANG-12-51", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 199 பாடியவர் : பெரும்பதுமனார்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 199 பாடியவர் : பெரும்பதுமனார்” (section 12.51).", "திணை : பாடாண் துறை : பரிசில் கடாநிலை கடவுள் ஆலத்துத் தடவுச்சினைப் பல் பழம் நெருநல் உண்டனம் என்னாது, பின்னும் செலவு ஆனாவே கலிகொள் புள்ளினம் அனையர் வாழியோ இரவலர், அவரைப் புரவு எதிர் கொள்ளும் பெருஞ் செய் ஆடவர் உடைமை ஆகும் அவர் உடைமை, அவர் இன்மை ஆகும் அவர் இன்மையே . தெய்வம் வாழ்கின்ற ஆலமர்த்தினது பெரிய கொம்பில் உள்ள பல பழங்களை நேற்றும் உண்டோம் என எண்ணாது மேலமு; அவ்விடத்துக்குப் பறவை இனம் போகும். அத்தகைய இயல்பையுடையவரே இரப்பவர். அத்தகைய இரவலரை எதிர்கொள்ளும் மிக்க செயலையுடைய ஆண்மகனின் செல்வம் அந்த இரப்பவரின் செல்வமாகும். அந்த ஆடவரின் வறுமை இரப்பவரின் வறுமையாகும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.51, p.288", "", "medium", "false"], ["SANG-12-52", "Sangam literature", "சங்க இலக்கியம் – புறநானூறு 151–200: “பாடல் : 200 பாடியவர் : கபிலர் பாடப்பட்டோன்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – புறநானூறு 151–200: Explain the poem/passage titled “பாடல் : 200 பாடியவர் : கபிலர் பாடப்பட்டோன்” (section 12.52).", "விச்சிக்கோ திணை : பாடாண் துறை : பரிசில் விச்சிக்கோ, இளம் விச்சிக்கோவுக்கு முன்னவன், பாரி மூவேந்தர் சூழ்சசியால் இறந்தனன். அதன் பின் கபிலர் பாரியின் மகளிரைத் திருக்கோவலூரில் வாழ்நச்த பார்ப்பனிடத்தே அடைக்கலப்படுத்தினார். பின் அவர்களைத் தக்க அரசிளங்குமரர்க்கு மணம் செய்விக்க எண்ணி விச்சிக்கோவை அடைந்தார். அவன் கபிலரை வரவேற்றுச் சிறப்பித்தான் அவர் அப்போது விச்சிக்கோவை நோக்கித் தம்முடன் வந்த பாரி மகளிரையும் தம்மையும் அறிமுகப் படுத்திக்கொண்ட அவர்களை மணந்துகொள்ள வேண்டுவது இப்பாடலாகும். பனி வரை நிவந்த பாசிலைப் பலவின் கனி கவர்ந்து உண்ட கருவிரல் கடுவன் செம்முக மந்தியொடு சிறந்து சேண் விளங்கி, மழை மிசை அறியா மால் வரை அடுக்கத்துக் கழை மிசைத் துஞ்சும் கல்லக வெற்ப! நிணந் தின்று செருக்கிய நெருப்புத்தலை நெடுவேல், களங் கொண்டு கனலும் கடுங்கண் யானை, விளங்கு மணி கொடும் பூண் விச்சிக்கோவே! இவரே, பூத்தலை அறாஅப் புனை கொடி முல்லை நாத் தழும்பு இருப்பப் பாடாது ஆயினும், “கறங்கு மணி நெடுந்தேர் கொள்க” எனக் கொடுத்த பரந்து ஓங்கு சிறப்பின் பாரி மகளிர்; யானே பரிசிலன் மன்னும் அந்தணன்; நீயே வரிசையில் வணக்கும் வாள் மேம்படுநன்; நினக்கு யான் கொடுப்பக் கொண்மதி, சினப்போர் அடங்கா மன்னரை அடக்கும் மடங்கா விளையுள் நாடு கிழவோயே. குளிர்ச்சியான மலையில் ஓங்கி வளரந்துள்ள பசுமையான இலையையுடைய பலா மரத்தின் பழத்தைப் பறித்து உண்ட கரிய விரலையுடைய ஆண் குரங்கு, சிவந்த முகத்தை உடைய தன் பெண் குரங்குடனே பொலிந்து தொலைவில் விளங்கி, மேகத்தாலும் உச்சியானது அறியப்படாத உயர்ந்த மலைப்பக்கத்தில் மூங்கிலின் உச்சியில் உறங்கம் தன்மையுடைய மலையை உடையவனே! ஊனைத் தின்று கறித்த, தீயைப் போன்ற தலையையுடைய நீண்ட வேலையும் களத்தைத் தனதாக்கிக் கொண்டு சிநன்து கொள்ளும் அஞ்சாமையுடைய யானைகளையும் விளங்கும் மணிகளால் செய்யப்பட்ட வளைந்த அணிகளையும் தலையில் அலங்காரம் செய்ததைப் போல் விளங்கும் முல்லைக்கொடி, நாத்தழும்பு உண்டாகப்பாடாதாயினும் ஒலிக்கின்ற மணிகட்டப்பெற்ற பெரிய தேரைக் கொள்க என்று கூறித் தந்த பரவிய மேம்பட்டு விளங்கும் தலைமைத் தன்மை கொண்ட பாரி மன்னனின் மகளிர். நானோ, பரிசிலன். அதுவே அன்றி நிலைபெற்ற அந்தணன் நீயோ பகைவரைப் போர் செய்கின்ற முறைப்படி போரிட்டுத் தாழச் செய்கின்ற வாளால் மேன்மை அமைபவன். எனவே, சினத்தையுடைய போராலே வேந்தரை அடக்கம் குறைவு படாத மிக்க விளைச்சலையுடைய நாட்டையடையவனே, நான் இவர்களை மணத்தில் கொடுக்கக் கொள்வாயாக!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 12, section 12.52, p.289", "", "hard", "false"], ["SANG-13-3", "Sangam literature", "சங்க இலக்கியம் – பதிற்றுப்பத்து – ஐந்தாம் பத்து: “பாடல் 41 : சுடர் வீ வேங்கை துறை : காட்சி” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – பதிற்றுப்பத்து – ஐந்தாம் பத்து: Explain the poem/passage titled “பாடல் 41 : சுடர் வீ வேங்கை துறை : காட்சி” (section 13.3).", "வாழ்த்து புணர் புரி நரம்பின் தீம் தொடை பழுனிய வணர் அமை நல் யாழ் இளையர் பொறுப்ப, பண் அமை முழவும் பதலையும் பிறவும், கண் அறுத்து இயற்றிய தூம்பொடு சுருக்கிக் காவில் தகைத்த துறை கூடு கலப்பையர் கைவல் இளையர் கடவுள் பழிச்ச, மறப்புலிக் குழுஉக் குரல் செத்து வயக் களிறு வரை சேர்பு எழுந்த “சுடர் வீ வேங்கைப்” பூவுடைப் பெருஞ்சினை வாங்கிப் பிளந்து, தன் மா இருஞ் சென்னி அணி பெற மிலைச்சிச் ஷசேஎர் உற்ற செல்படை மறவர் தண்டு உடை வலத்தர் போர் எதிர்ந்ததாங்கு, வழை அமல் வியன் காடு சிலம்பப் பிளிறும் மழை பெயல் மாறிய கழை திரங்கு அத்தம் ளுநடக -ஐn ஒன்று இரண்டு அலபல கழிந்து திண்தேர் ஆயவநசi வசை இல் நெடுங்தகை காண்கு வந்திசினே, தாவல் உய்யுமோ மற்றே தாவாது வஞ்சினம் முடித்து ஒன்றுமொழி மறவர் முரசு உடைப் பெருஞ்சமத்து அரசு படக் கடந்து, வௌ;வர் ஓச்சம் பெருகத் தெவ்வர் மிளகு எறி உலக்கையின் இருந்தலை இடித்து, வைகு ஆர்ப்பு எழுந்த ;மைபடு பரப்பின் எடுத்தேறு ஏய கடிப்பு உடை வியன் கண் வலம்படு சீர்த்தி ஒருங்கு உடன் இயைந்து, கால் உளைக் கடும் பிசிர் உடைய வால் உளைக் கடும் பரிப் புரவி ஊர்ந்த நின் படுந்திரைப் பனிக்கடல் உழந்த தாளே துறை விளக்கம் : சேரன் ஆற்றிய கடல் போரால அவன் கால்கள் வருந்தலினின்று தப்பாது எனவுரைத்த இச் சிறப்பு நோக்கிக் காட்சி வாழ்த்து ஆயிற்று. தெளிவுரை : இசையை எழுப்புதற்கு உரிய முறுக்கிய நரம்பினையுடைய இனி யஇசையைச் செய்யும் யாழ்களை ஏவல் இளைஞர் சுமந்த வண்ணமாய் வர, பண்ணுடன் பொருந்துமாறு அமைந்த முழவு என் றகருவியும் ஒருகண் மாக்கிணை என்ற கருவியும் பிற இசைக் கருவிகளும் மூங்கிற் கணுவை இடையிட்டு அறுத்துச் செய்த பெருவங்கியம் என்னும ;கருவியுடன் சேர்த்துக் கட்டிக் காவடித் தண்டின் ஒரு பக்கத்தே தொங்க விட்டனர். மறுபக்கத்தில் ஆடல் துறைக்கு வேண்டிய கருவிகள் எல்லாம் கூடிய மூட்டையை அமைத்துச் சுமந்தனர். இத்தகைய இயல்பு உடையவராய் இசைத் துறையில் வல்ல இளையவர்கள் போகும் வழியில் தீங்கு வாரமை குறிததுக் கடவுளைப் பரவினர். வலிமை மிக்க யானை, மலைப் பக்கத்தே சேர எழுந்து உணர்ந்து நின்ற ஒளி உடைய பூக்களை உடைய வேங்கை மரத்தை. மறம் பொருந்திய புலியின் மயிர்த் தொகுதியின் தோற்றமாய் எண்ணியது. சினங் கொண்டு பூக்கள் பொருந்திய பெரிய வேங்கை மரக் கிளையை வளைத்து இழுத்துப் பிளந்து தன் பெரிய தலையில் அழகு விளங்க அணிந்து கொண்டு, பலராகத் திரண்டு பகைவர் மீது படைதொடுத்துப் போகும் விரர் வலக்கையில் தண்டு ஏந்திக் கொண்டு சென்று பகைவரின் முன் நின்று போர்க்களத்தில் ஆரவாரம் செய்வதைப் போன்று சுரபுன்னை மரங்கள் வளர்ந்துள்ள காட்டடில் எல்லாம் எதிரொலிக்கும் படி பிளிறும். மழை பெய்யாமையால் மூங்கில்கய் பசையற்று உலர்ந்து போய் விள்ங்குகின்ற வழிகள் பலவற்றையும் கடந்து திண்மையான தேர்களை உடைய குற்றம் இல்லாத பெருந்தகையாளனான நின்னைக்காணும் பொருட்டாக வந்தேன். தாம் சொல்லிய வஞ்சினம் தப்பாது முடித்த வாய்மையுடைய வீரர் முரசுக்ள ஒலிக்கின்ற பெரிய போரில் எதிர்ப்பட்ட மன்னர் எல்லாம் இறந்து அழியுமாறு வஞசிக்காமல் போரிட்டு வெற்றி பெறுவர். நட்புடைய அரசரிடம் ஆக்கம் பெருகவும். பகை மன்னரின் பெரிய தாலைகளை உலக்கையால் இடிக்கப்பட்ட மிளகைப் போன்று தாம் கைக் கொண்ட தோமர் என்ற கருவியால் இடித்துச் சிதைப்பர். இடையறாத ஒலி உண்டாகிய கரிய நிறத்தையுடைய கடல் போல் எடுத்து எறிதலைத் தெரிவிக்கும் கற்தடியால் அடிக்கப்படும் அகன்ற கண்ணையுடைய முரசு வெற்றியால் உண்மான மிக்க புகழுடன் ஒருங்கே கூடி அப்போர்களத்தில் விளங்கும் வெண்மையான தலைப்பட்டத்தை அணிந்த விரைவான ஓட்;டத்தை உடைய குதிரையை ஊர்ந்த நின் ஒலிக்கும் அலைகளை உடைய குளிர்ந்த கடலில் போய், அந்த அலைகள் காற்றால் உடைந்து சிறு சிறு கடிய தளிகளாய் ஆகும்படி போர் செய்த கால்கள் வருத்தப்படுவதினின்று தப்புமோ! கூறுக!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 13, section 13.3, p.292", "", "hard", "false"], ["SANG-13-4", "Sangam literature", "சங்க இலக்கியம் – பதிற்றுப்பத்து – ஐந்தாம் பத்து: “பாடல் : 42 : “தசும்பு துளங்கு இருக்கை” துறை” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – பதிற்றுப்பத்து – ஐந்தாம் பத்து: Explain the poem/passage titled “பாடல் : 42 : “தசும்பு துளங்கு இருக்கை” துறை” (section 13.4).", "செந்துறைப் பாடாண் பாட்டு துறை : செந்துறைப் பாடாண் பாட்டு இரும் பனம் புடையல் ஈகை வான் கழல், மீன்தேர் கொட்பின் பனிக்கயம் மூழ்கிச் சிரல் பெயர்ந்தன்ன நெடு வெள் ஊசி நெடு வசி பரந்து வடு ஆழ் மார்பின், அம்பு சேர் உடம்பினர்ச் சேர்ந்தோர் அல்லது தும்பை சூடாது மலைந்த மாட்சி அன்னோர் பெரும நன்னுதல் கணவ! அண்ணல் யானை அடு போர்க் குட்டுவ! மைந்து உடைநல் அமர்க் கடந்து வலம் தரீஇ இஞ்சி வீ விராய பைந்தார் பூட்டிச் சாந்து புறத்து எறித்த “தசும்பு துளங்கு இருக்கைத்” தீம் சேறு விளைந்த மணி நிற மட்டம் ஓம்ப ஈகையின் வண் மகிழ் சுரந்து, கோடியர் பெரும் கிளை வாழ, ஆடு இயல் உளை அவிர் ககலிமாப் பொழிந்தவை எண்ணின் மன்பதை மருள அரசுபடக் கடந்து, முந்து வினை எதிர் வரப் பெறுதல் காணியர் ஒளிறு நிலை உயர் மருப்பு ஏந்திய களிறு ஊர்ந்து மான மைந்தரொடு மன்னர் ஏத்தநின் தேரொடு சுற்றம் உலகு உடன் மூய, மாஇரும் தௌ; கடல் மலி திரைப் பௌவத்து, வெண்தலைக் குரூஉப்பிசிர் உடையத் தண் பல வரூஉம் புணரியின் பலவே. தௌ;pவுரை : கருமையான பனந் தோட்டால் கட்டப்பட்ட மாலையையும் பொன்hனால் இயன்ற வீரக்கழலையும் உடையவராய், மீனைப் பிடிக்கும் மணிச்சிரல் என்ற பறவை குளத்துள் பாய்ந்து முழுகி மேலே எழும் காலத்து அதன் வாய் அலகு விளங்குவதைப் போன்று மார்பில் புண்களைத் தைக்கும் காலத்து அப்புண்ணின் இரத்த்தினால் மூழ்கி மறைந்து எழும் நீண்ட வெண்மையான ஊசியால் ஆன நீண்ட தழும்பும் பரந்த வடுவும் பொருந்திய மார்பையும் அம்புகளால் புண்பட்ட உடம்பையும் உடையவராய்ப் போரிட வந்தவருடன் து;ம்பை மலர் மாலை சூடிப் போரிடுவது அல்லாமல் மற்றவருட்ன Nபிhரிடமாம் புறக்கணித்துப் போய் வீரரின் தலைவனே! நல்ல நெற்றியை உடைய இளங்கோ வேண்மானின் கணவனே! பெரிய யானைகளையும் வெல்லும் போரையும் உடைய செங்குட்டுவனே! பகைவரின் வலிமை கெட்டு விடுவதற்குக் காரணமான நல்ல போலைர வஞ்சியாமல் எதிர்நின்று போர் செய்து வெற்றியைத் தந்தாய்! இஞ்சியும் நறுமணப் பூவும் கலந்து கட்டப்பட்ட பசிய மாலை சூடி, புறத்தே சந்தனம் பூசப்பட்ட கள்குடங்கள் அசையும் இருக்கைகளில் வைக்கப்பட்ட அவற்றின் இனிய சுவை நிறைந்த நீல மணியைப் போன்றுள்ள கள்ளை, தனக்குச் சிறிதும் வைத்துக் கொள்ளாது. கொடுக்கும் இயல்பால் மிக்க மகிழ்சச ; pயை வீரர்க்கும் போர்க்களத்தைப்பாடும் பாணர் பொருநர் முதலியவர்க்கும் தந்து, கூத்தரின் பெரிய சுற்றம் மகிழும் படியாக வழங்கப்பட்டவையான அசையும் இயல்புடைய தலை ஆட்டத்தை அணிந்து விளங்கும் குதிரைகளை அளித்தாய் அவற்றை எண்ணத் தொடங்கினால், பார்ப்பவர் வியப்பை அடையும் வண்ணம் பகை மன்னரை வென்றமையால், முன்னேறிப் போய்ச் செய்யும் போர்ச்செயல் இல்லாமையால் அது எதிர்வரப் பெறுவதை விரும்பியவராய், நின் தேர் வீரரும் உலகம் எல்லாம் பரவி நெருங்கி நிற்க. விளங்கும் நிலையையுடைய உயர்ந்த கொம்புகளை ஏந்திய யானை மீது அமர்ந்து செல்லும் மானவீரரும் வேந்தரும் அஞ்சி ஏத்திப் பாராட்ட, பெரிய கரிய தெளிந்த கடலின் மிக்க திரைகளையுடைய நீர்ப்பரப்பில் வெண்மையான நுரையான தலை சிறு சிறு திவலைகளாய் உடைந்து கெட, குளிர்ந்த பலவாக மேன்மேல்வரும் அலைகளைவிடப் பலவாகும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 13, section 13.4, p.294", "", "hard", "false"], ["SANG-13-5", "Sangam literature", "சங்க இலக்கியம் – பதிற்றுப்பத்து – ஐந்தாம் பத்து: “பாடல் : 43 : “ஏறா ஏணி” துறை : இயன்மொழி” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – பதிற்றுப்பத்து – ஐந்தாம் பத்து: Explain the poem/passage titled “பாடல் : 43 : “ஏறா ஏணி” துறை : இயன்மொழி” (section 13.5).", "வாழ்த்து துறை : இயன்மொழி வாழ்த்து கவரி முச்சிக் கார் விரி கூந்தல், ஊசல் மேவல், சேய் இழை மகளிர் உரல் போல் பெருங்கால், இலங்கு வாள் மருப்பின் பெருங்கை மத மாப் புகுதரின், அவற்றுள் விருந்தின் வீழ் பிடி எண்ணு முறை பெறாஅக் கடவுள் நிலைய கல் ஓங்கு நெடுவரை வடதிசை எல்லை இமயமாகத் தென்னங் குமரியொடு ஆயிடை அரசர் முரசு உடைப் பெருஞ்சமம் ததைய ஆர்ப்பு எழச், சொல் பல நாட்டைத் தொல் கவின் அழித்த போர் அடு தானைப் பொலந்தார்க் குட்டுவ! இரும் பணை திரங்கப் பெரும் பெயல் ஒளிப்பக் குன்று வறம் கூரச் சுடர் சினம் திகழ, அருவி அற்ற பெருவறல் காலையும், அருஞ்செலல் பேராற்று இருங்கரை உடைத்துக் கடிஏர் பூட்டுநர் கடுக்கை மலைய, வரைவில் அதிர் சிலை முழங்கியப் பெயல் சிறந்து, ஆர்கலி வானம் தளி சொரிந்தாஅங்கு, உறுவர் ஆர ஓம்பாது உண்டு நகைவர் ஆர நன்கலம் சிதறி, ஆடு சிறை அறுத்த நரம்பு சேர் இன் குரல் பாடு விறலியர் பல் பிடி பெறுக! மன்றம் படர்ந்து மறுகு சிறைப் புக்குக் கண்டிநுண் கோல் கொண்டு களம் வாழ்த்தும் அகவலன் பெறுக மாவே என்றும் இகல் வினை மேவலை ஆகலின், பகைவரும் தாங்காது புகழ்ந்த தூங்கு கொளை முழவின் தொலையாக் கற்ப நின் நிலை கண்டிகுமே, நிணம் சுடு புகையொடு கனல் சினந்து தவிராது நிரம்பு அகல்பு அறியா “ஏறா ஏணி” நிறைந்து நெடிது இராத் தசும்பின். வயிரியர் உண்டு எனத் தவாஅக் கள்ளின் வண் கை வேந்தே, நின் கவி மகிழானே. தெளிவுரை : கவரிமானின் மயிர் முடி கலந்து முடிக்கப்பட்ட கொண்டை, கருமேகம் போன்ற கூந்தல், ஊஞ்சல் ஆடுதலில் விருப்பம் ஆகியவற்றை உடைய நல்ல அணிகளை அணிந்தவர் மகளிர், அவர்ள், உரலைப் போன்ற பெரிய காலையும் ஒளி பொருந்திய கொம்பையும் நீண்ட துதிக்கையையும் மதத்தையும் உடைய யானைகள் தாம் இருக்கும் காட்டில் புகுமானால், அவற்றுள் புதியவயர் வந்த ஆண் யானைகளால் விரும்பப்படும் பெண் யானைகள் இத்தனை என எண்ணத் தொடங்கவர். இத்தகைய இயல்புடையது கடவுளர் தங்கம் நிலைகளையுடைய கற்களால் உயர்ந்த பெரிய மலையான இமயம் அம்லை வடக்குத் திசையில் எல்லையாய், தெற்கு எல்லை குமரியாய் அமைய, இடைப்பட்ட நிலத்தில் பகை மன்னர் செய்யம் முரசு முழங்கம் பெரும் போர் கெடுவதால் வெற்றி ஆரவாரம் உண்டாக அம்மன்னர்களின் புகழ் பொரு;நதிய் நாட்டை அடைந்த அதன் புகழுக்குக் காரணமான பழைய நலத்தைக் கெடுத்து அழித்த, போரில் எதிர்ப்பவரை வெல்வதையே தொழிலாக உடைய படையையும் பொன்மாலையையும் அணிந்த செங்குட்டுவனே! பெருமழை பெய்யாமல் பொய்த்தலால் காடு வாடி உலர்நதது. குன்றுகளில் பசும்புல் இல்லாமல் கெட்டது. ஞாயிற்றின் வெயிலின் வெப்பம் மிக்குத் தோன்றியது. அருவிகள் நீரில்லாது வறண்டு போயின. அக்காலத்தும், கடப்பதற்கு அரிய ஓட்டத்தை உடைய பெரிய ஆற்றிலே நீர் பெருக்கம், பெருங்கரைகளை உடைத்துக்கொண்டு செல்லும்படியும் புதிய ஏரைப்பூட்டும் உழவர் கொன்றைப்பூவைச்சூடி கொள்ளும்படியும். நிறைந்த முழக்கம் உடைய மழiமேகம் பல முறை மின்னி அதிர்கின்ற இடியொலியைச் செய்து மிக்கமழை நீரைப்பெய்யும். அங்ஙனம் பெய்தது பொல், பெரும! உன்னை நாடி வ்த புலவர்கள் உண்பனவற்றை ஓம்பாது உண்ணச்செய்தனை அவருடன் அமர்நதது உண்டனை. இன்பச்சவை நல்கும் பாணர் கூத்தர் முதலியவர் நிரம்பப் பெறுமாறு நீ நல்ல பொன் அணிகளை எல்லை இல்லாது தந்தனை. அசைகின்ற இறகையுடைய கின்னரம் என்ற பறைவையை இசையால் வென்ற யாட் நரம்பின் இசையுடன் ஒன்றாய் இசைந்து செல்லும் இனிய மிடற்றால் பாடுமம் இயல்படைய விறலியர் பல பெண் யானைகளைப் பெறுக என்ற ஈந்தனை. துய்யினை உடைய வாகைப்பூவும், நுண்ணிய கொடியானம உழிஞை மலரும் சூடும் வெற்றி விருப்பமும், பகைவர்க்கு அச்சத்தைத் தரும் சிறப்பும், பகைவர் நாட்டில் கொள்ளை இடுதலுமுடைய வீரர் கொலலும் ஆண் யானைகளைப் பெறுவராக எனத் தந்தனை. கணுக்களை உடைய நுட்பமான கோலைக் கைக்கொண்டு ஊர்மன்றத்தில் இருந்து, பாடற்குரிய தலைவன் புகழ்களை எண்ணித் தெருக்களின் இரண்ட பக்கத்தும் போய்த், தலைவன் போரிட்டு வென்ற போர்க்களத்தை வாழ்த்திப்பாடும் பாணன் குதிரைகளைப்பெறுவானாக எனக்கொடுப்பாய். இங்ஙனம் கொடுக்கம் கொடைத் தொழிலை விரும்பிஇருப்பதே அல்லாது போர்ச் செயலையும் நீ விரும்பி இருக்கின்றாய்! ஆதலால், பகைவரும் தங்கள் உள்ளத்தில் எழுந்த வியப்பைத் தாங்க மாட்டாமல்ல புகழ்ந்து பாராட்டும கெடாத கல்வியறிவு ஒழுக்கங்களை உடையாய். வளமான கொடையை உடைய மன்ன! தூங்கல் ஓசையுடைய பாட்டுக்க ஏற்ப முழங்கம் முழவையம், உடையயையாய் நிணத்தைச் சுடும் புகை நாற்றத்துடன் தீயின் வெம்மை நீங்காமல் நிரம்பதலும் அகலுதலும் இலலாத கோக்காலியின் மேல் வைக்கப்பட்டன கள் குடங்கள், அவை வார்த்த கன்னால் நிறைந்தவை. நீண்ட நேரம் அந்த நிறைவு குறையாமல் இருப்பவை. பாணர் முதலியவர் உண்டவிடத்தும் குறையாத கள்ளை உடையவை. இத்தகைய தன்மை பொலிவும் நின் திருவோலக்கத்தில் நின் செல்வப்பெருமை யாவற்றையும் கண்டோம்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 13, section 13.5, p.295", "", "hard", "false"], ["SANG-13-6", "Sangam literature", "சங்க இலக்கியம் – பதிற்றுப்பத்து – ஐந்தாம் பத்து: “பாடல் : 44 : “நோய் தபு நோன் தொடை” துறை” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – பதிற்றுப்பத்து – ஐந்தாம் பத்து: Explain the poem/passage titled “பாடல் : 44 : “நோய் தபு நோன் தொடை” துறை” (section 13.6).", "செந்துறைப் பாடாண் பாட்டு நிலம் புடைப்பு அன்ன ஆர்ப்பொடு விசும்பு துடையூ வான் தோய் வெல் கொடி தேர் மிசை நுடங்கப் பெரிய ஆயினும் அமர் கடந்து பெற்ற அரிய என்னாது ஓம்பாது வீசிக், கலம் செலச் சுரத்தல் அல்லது கனவினும், களைக என அறியாக் கசடு இல் நெஞ்சத்து, ஆடு நடை அண்ணல் நின் பாடுமகள் காணியர் காணிலியரோ, நின் புகழ்ந்த யாக்கை முழு வலி துஞ்சு “நோய் தபு நோன் தொடை” நுண கொடி உழிஞை வெல் போர் அறுகை சேணன் ஆயினும் கேள் என மொழிந்து, புலம் பெயர்ந்து ஒளித்த களையாப் பூசற்கு, அரண்கள் தாவுறீஇ அணங்கு நிகழ்ந்தன்ன மோகூர் மன்னன் முரசம் கொண்டு, நெடுமொழி பணித்து அவன் வேம்பு முதல் தடிந்து, முரசு செய முரச்சிக் களிறு பலபூட்டி, ஒழுகை உய்த்த கொழு இல் பைந்துணி வைத்தலை கவற்றும் குராலம் பறந்தலை முரசுடைத் தாயத்து அரசு பல ஓட்டித் துளங்கு நீர் வியல் அகம் ஆண்டு இனிது கழிந்த மன்னர் மறைத்த தாழி, வன்னி மன்றத்து விளங்கிய காடே. தெளிவுரை : நிலத்தை இடிப்பதைப் போன்ற ஒலியடன் முரசுகள் முழங்க, வானைத் துடைப்பதற்கென எடுத்த கொடிகள் வான் அளாவ உயர்ந்து பறப்பவை போன்று தேரின் மேலம் பறந்த வண்ணம் அசையபந் பல போர்களைச் செய்து பெற்ற பொருளகள் பெரியவை என்றாலும், அவை பெறுவதற்கு அpரயவை என்ற எண்ணாமலும், தனக்க வேண்டும் என் றபேணி வைத்துக் கொள்ளாமலும் பிறர்க்கு நிரம்ப வீசினாய், இங்ஙனம் பல அரிய அணிகளை மிககுதியாய்க் கொடுத்தலே அல்லாமல் கனவிலும் பிறரை இரந்து எனக் கஃஉண்டான துன்பத்தை போக்கியருள வேண்டாம் என வேண்டுதலை அறியாதவன் நீ குற்மில்லாத நெஞ்சத்தையும் வெற்றியால் பிறந்த பெருமித நடையையம் உடைய அண்ணலே! நுட்பமான உழிஞைக்கொடியின் பூவைச் சூடிய வெல்லும் போரைச் செய்பவன் அறுகை என்பவன். அவன் மொவில் இருப்பவைனாயினும் அவ்ன் என் நண்பன் என்று பலரும் அறியக் கூறினாய். பகைவனான மோகூர் மன்னனின் அரண்களைத் தெய்வத்தால் கேடு உண்டானதைப் போல் வலி அழித்தனை, அம்மன்னனின் காவல் முரசத்தைக் கைப்பற்றினாய், அதனால் அவன் உரைத்த வஞ்சினத்தைக் கெடுத்தாய். அவனை நினக்கு பணியும்படி செய்தாய். அவனது காவல் மரமான வேம்பையும் அடியுடன் வெட்டி வீழ்த்தி, முரசு செய்தற்கேற்ற சி றசிறு துண்டுகளாகத் துண்டித்த வண்டியில் ஏற்றி யானைகளை அதனை இழுக்கும் பகடுகளாகப் பூட்;டிச் செலுத்தினாய். நின்னை வீரர் பலரும் புகழ்வதற்குப் பொருளாய் அமைந்த மிக்க வன்மை பெருந்தி யநோய் இல்லாத யாக்கையான பெரிய உடம்பை நின்னைப் பாடும் பாடினி காண்பாளாக! பொழுப்பு இல்லாத பசிய இறைச்சித் துண்டங்களை வைத்த இடத்தை மறந்துவிட்ட உச்சிக் கொண்டையையுடைய தலை பொருந்திய கூகைச் சேவலை, கவலை அடையச் செய்கின்ற பெண் கோட்டானையுடைய இடுகாட்டில், முரசத்தையுடையவரும் வழி தொடர்ந்த உரிமை பெற்று அரசு செலுத்தி வருபவருமான அரசர் பலரை வென்று அசையும் கடல் சூழ்ந்த பரந்த நிலவுலகத்தை ஆட்சி செய்து தம் வாழ்நாளை இனிது கழித்த மன்னரை .இட்டு புதைக்கும் வன்னி மரம் நிற்கும் மன்றத்தால் விளக்கம் பொருந்திய இடுகாட்டில், தாழியானதது நின் நோயற்ற பெரிய உடலைக் காணாது ஒழிக.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 13, section 13.6, p.297", "", "hard", "false"], ["SANG-13-7", "Sangam literature", "சங்க இலக்கியம் – பதிற்றுப்பத்து – ஐந்தாம் பத்து: “பாடல் : 45 : “ஊண் துவை அடிசில்” துறை” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – பதிற்றுப்பத்து – ஐந்தாம் பத்து: Explain the poem/passage titled “பாடல் : 45 : “ஊண் துவை அடிசில்” துறை” (section 13.7).", "செந்துறைப் பாடாண் பாட்டு பொலம் பூந்தும்பைப் பொறி கிளர் தூணிப் புற்று அடங்கு அரவின் ஒடுங்கிய அம்பின், நொசிவு உடை வில்லின் ஒசியா நெஞ்சின், களிறு எறிந்து முரிந்த கதுவாய் எஃகின், விழுமியோர் துவன்;றிய அகன் கண் நாட்பின். எழு முடி மார்பின் எய்திய சேரல்! குண்டு கண் அகழிய மதில் பல கடந்து, பண்டும் பண்டும் தாம் உள் அழித்து உண்ட நாடு கெழு தாயத்து நனந்தலை அருப்பத்துக் கதவம் காக்கும் கணை எழு அன்ன, நிலம் பெறு திணி தோள் உயர ஓச்சிப், பிணம் பிறங்கு அழுவத்துத் துணங்கை ஆடிச், சோறு வேறு என்னா “ஊன் துவை அடிசில்” ஓடாப் பீடர் உள்வழி இறுத்து, முள் இடுபு அறியா ஏணித் தெவ்வர் சிலை விசை அடக்கிய மூரி வெண்தோல் அனைய பண்பின் தானை மன்னர் இனியார் உளரோ, நின் முன்னும் இல்லை மழை கொளக் குறையாது புனல் புக நிறையாது, விலங்கு வளி கடவும் துளங்கு இருங் கமஞ்சூல், வயங்கு மணி இமைப்பின் வேல் இடுபு, முழங்கு திரைப் பனிக்கடல் மறுத்திசினோரே. தெளிவுரை : பொன்னால் செய்யப்பட்ட அழகான் தும்பை மலரையும், பொறிகள் பொருந்திய தூணியில் புற்றில் அடங்கியுள்ள பாம்பைப் போல் ஒடுங்கி இருக்கும் அம்புகளையும், வளைந்த வில்லையும், பகை முதலியவற்றுக்கு அஞ்சி ஒடுங்காத மன எழுச்சியையும் களிறகளைக் கொல்வதால் நுனி மடிந்த வடுப்பட்ட வேலையுமுடைய சீரிய வீரர் நெருங்கிச் செய்யும் அகன்ற கோர்க்களத்தை உடைய பகை மன்னவர் முடிப் பொன்னால் செய்யப்பட்ட மாலையை மார்பில் அணிந்த சேர மன்னனான செங்குட்டுவனே! ஆழமான அகழிகளை உடைய மதில்கள் பலவற்றைக்கடந்து போய் உள்ளே புகுந்தாய்,அங்குள்ள பொருள்களைக் கைக் கொண்டாண். அழித்த நாட்டாட்சிக்குரிய இடத்தையடைய அரண்களின் வாயிற்கதவுக்கு வன்மை உண்டாகக் காக்கின்ற கணைய மரத்தைப்போன்ற பகைவர் நாடுகளைப் பெறும் வன்மையமைந்த திண்மையான நின்தோள்களை உயர எடுத்து வீசிப்பிணங்கள் விழுந்து உயர்ந்து கிடக்கும் போர்க்களத்தில் முன்பே பலகாலங்களில் பலமுறை துணங்கைக் கூத்த ஆடினாய் சோறு வேறு ஊன்; குழைந்த போகும்படி சடைக்கப்பட் சோற்றைப் பகைவர்க்கு புறங்காட்டாத பெருமையடைய வீரரின் மனம் விரும்பும்படி பெருவிருந்து அளிததுச் சிறந்தனை. பகைவரின் குதிரை முதிய படைகளைத் துடுப்பதற்காக முன் வேலி இடுவதை அறியாத எல்லைப் புறத்தையும பகைவரின் வில்லில் தொடுக்கப்படும் அம்பின் கடுமையைக் கெடுத்த வலிமையான வெள்ளிய கேடகத்தையும் அவற்றிற்கு ஏற்ற மறப்பண்பு படைத்த படையையும் உடைய வேந்தருள்ளே. மேகமக் பொருந்தி முகத்தலால் நீர் குறையாமலும் ஆறுகளின் வரவால் நீர ;நிறைந்து கடவாமலும் செல்லும் செலவைத் தடுத்து மோதும் காற்றுத் திpரட்டும். அலைகளால் அசைதலையுடைய மிகவும் நிறைந்த நீரையுடைய முழங்கும் அலைகளுடன் கூடிய குளிர்ந்த கடல். அதில்விளங்கம் மணியைப் போன்ற ஒளி பொருந்திய வேல் படையைச் செலுத்தி அக்கடலில் எதிர்த்தவரைப் போரிட்டு அழித்த வேந்தர் நின் முன்னோருள் எவரும் இலர். இப்போதும் உனக்கு ஒப்பானவர் எவரும் இல்லை.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 13, section 13.7, p.299", "", "hard", "false"], ["SANG-13-8", "Sangam literature", "சங்க இலக்கியம் – பதிற்றுப்பத்து – ஐந்தாம் பத்து: “பாடல் : 46 “கரைவாய்ப் பருதி” துறை” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – பதிற்றுப்பத்து – ஐந்தாம் பத்து: Explain the poem/passage titled “பாடல் : 46 “கரைவாய்ப் பருதி” துறை” (section 13.8).", ":செந்துறைப்பாடாண் பாட்டு இழையர், குழையர், நறுந்தன் மாலையர், சுடர் நிமிர் அவிர் தொடி செறித்த முன் கைத் திறல் விடு திரு மணி இலங்கு மார்பின், வண்டுபடு கூந்தல் முடி புனை மகளிர் தொடைபடு பேரியாழ் பாலை பண்ணிப் பணியா மரபின் உழிஞை பாட, இனிது புறந்தந்து அவர்க்கு இன் மகிழ் சுரத்தலின், சுரம்பல கடவும் “கரைவாய்ப் பருதி” ஊர்பாட்டு எண் இல் பைந்தலை துமியப் பல் செருக் கடந்த கொல் களிற்று யானைக் கோடு நரல் பௌவம் கலங்க வேல் இட்டு உடை திரைப் பரப்பில் படுகடல் ஓட்டிய வெல் புகழ்க் குட்டுவன் கண்டோர் செல்குவம் என்னார், பாடுபு பெயர்ந்தே. தெளிவுரை : அணிகளையும் காதணியையும், நறுமணம் மிக்க குளிர்ந்த மாலையையும், ஒளி மிக விளங்கும் தொடி அணிந்த முன்கையையும் , மிக்க ஒளி திகழும் அழகிய மணிமாலை கிடந்து விளங்கும் மார்பையும் உடைய வண்ட மொய்க்கும் கூந்தலைக் கொண்டையாக முடிதது அலங்கதரித்துக் கொண்டுள்ள பாடல் மகளிர், நரம்பையுடைய பேரியாழில் பாலைப் பண்ணை அமைத்துப் பகைவர்;க்குப் பணியாத முறைமை உடைய உழிஞைத் திணைச் செயலைப்புகழ்ந்து பாட, அவர்களை நன்கு ஓம்பி, அவர்களுக்க மகிழ்சசியைத் தன் கொடையாலும் முக மல்சச ; pயாலும் செய்வதால். காடுகள் பலவற்றிலும் செலுத்தப்படும் குருதிக்கறை தோய்ந்த விளிம்பையுடைய தேர்ச்சக்கரம், தன் போக்கில் செல்லுங்கால், எண்ணற்ற வீரர்களின் தலைகள் கீழே அகப்பட்டு நசுங்க, பல போர்களை வென்ற கொல்லும் யானைகள் பலவற்றையும் உடையவன் குட்டுவன். சங்குகள் ஒலிக்கும் கடல் கலங்கம்படி வேல் படையைச்செலுத்தி உடைந்து அலையும் அலைகளையுடைய நீர்ப்பரப்பான கடலை இடமாக் காண்ட போர் செய்தவரைத் தோற்று ஓடும்படியாகச்செய்த வெற்றியால் உண்டான பெரும் புகழையுடைய செங்கட்டுவனைப்பாடிச் சென்று அவனால்அளிக்கப்பெற்றவர் மீண்டும் தம் ஊருக்குச் செல்வோம் என்று எண்ணிப்பாரார் அவ்ன் பக்கத்திலேயே எப்போதும் இருக்கவே எண்ணுவர்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 13, section 13.8, p.300", "", "hard", "false"], ["SANG-13-9", "Sangam literature", "சங்க இலக்கியம் – பதிற்றுப்பத்து – ஐந்தாம் பத்து: “பாடல் : 47 : “நன்னுதல் விறலியர்” துறை” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – பதிற்றுப்பத்து – ஐந்தாம் பத்து: Explain the poem/passage titled “பாடல் : 47 : “நன்னுதல் விறலியர்” துறை” (section 13.9).", "செந்துறைப் பாடான் பாட்டு அட்டு ஆனானே குட்டுவன்; அடு தொறும் பெற்று ஆனாரே பரிசிலர் களிறே; வரை மிசை இழிதரும் அருவியின் மாடத்து வளி முனை அவிர்வரும் கொடி நுடங்கு தெருவில், சொரி சுரை கவரும் நெய் வழிபு உராலின், பாண்டில் விளக்குப் பரூஅச்சுடர் அழல, “நன்னுதல் விறலியர்” ஆடும் தொல்நகர் வரைப்பின் அவன் உரை ஆனாவே. தெளிவுரை : சேரன்செங்குட்டுவன் பகைவரை அடியுடன் போரிட்டு அழித்தும் அதனுடன் அமைதி பெறாதவன் ஆனான். அதன் காரணமாக அவன் பகைவரை நாடிப்போய்ப் போரிடுந்தோறும் பரிசிலர் களிறுகள் பலவற்றைப் பெற்றனர். அதனுட்ன் அவர்கள் அமையாது அவனது போர்ச் சிறப்பையே பாடலாயினர். மலையிலிருந்து வழியும் அருவியைப் பொல்மாங்களின் மேலிடத்திலிருந்து கொடிகள் அசைகின்ற தெருவில். நெய் வார்கக ; ப்டும் விளக்குச் சுரையில் எரிக்கப்படும் நெய்வழியும்படி வார்தது ; நிரப்புதலால், கால் விளக்கின் பருத்த திரியானதது மிகுந்த ஒளிகாட்டி எரிய, நல்ல நெற்றியை உடைய விறலியர் சூடுகின்ற பழைய மாளிகைகளையுடைய ஊர்களில் அவனைப் புகழ்கின்ற உரைகள் நீங்காமல் நிலவுவனவாயின.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 13, section 13.9, p.301", "", "medium", "false"], ["SANG-13-10", "Sangam literature", "சங்க இலக்கியம் – பதிற்றுப்பத்து – ஐந்தாம் பத்து: “பாடல் : 48 : “பேர் எழில் வாழ்க்கை” துறை” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – பதிற்றுப்பத்து – ஐந்தாம் பத்து: Explain the poem/passage titled “பாடல் : 48 : “பேர் எழில் வாழ்க்கை” துறை” (section 13.10).", "இயன்மொழி வாழ்த்து பைம்பொன் தாமரை பாணர்ச் சூட்டி, ஒண்ணுதல் விறலியர்க்கு ஆரம் பூட்டிக் கெடல் அரும் பல் புகழ் நிலைஇ நீர் புக்குக் கடலொடு உழந்த பனித் துறைப் பரதவ! ‘ஆண்டு நீர்ப் பெற்ற தாரம் ஈண்டு இவர் கொள்ளாப் பாடற்கு எளிதின் ஈயும் கல்லா வாய்மையன் இவன்’ எனத் தத்தம் கைவல் இளையர் நேர் கை நிரைப்ப, வணங்கிய சாயல் வணங்கா ஆண்மை, முனை சுடு கனை எரி எரித்தலின், பெரிதும் இகழ் கவின் அழிந்த மாலையொடு சாந்து புலர் பல்பொறி மார்ப நின் பெயர் வாழியரோ! நின் மலைப் பிறந்து நின் கடல் மண்டும் மலி புனல் நிகழ்தரும் தீ நீர் விழவின், பொழில் வதி வேனில் “பேர் எழில் வாழ்க்கை” மேவரு சுற்றமோடு உண்டு இனிது நுகரும், தீம் புனல் ஆயம் ஆடும், காஞ்சி அம்பெருந்துறை மணலினும் பலவே. தெளிவுரை : பாணர்களுக்குப் பொன்னால் ஆன தாமரைப் பூவைச் சூட்டி ஒளி பொருந்திய நெற்றியை உடைய விறலியர்க்கு முத்து மாலைகளைப் பூணும்படி தந்து கெடாத பல புகழை நிலை நாட்டி, கடலின் நீர்ப்பரப்பில் போய் அங்கிருந்த கடற்பகைவருடன் அரிய போரைச் செய்த குளிர்ந்த துறையை உடைய பரதவனே! அக்கடலில்பகைவரால்கடல் வழியாக்கக்கொணரப்பெற்ற் பொருள்களை இங்கு இப்பரிசிலரின் நின் புகழ் முழுவதையும் தன்னிடத்தே அடக்கிக்கொள்ள மாட்டாத பாட்டிற்காக மிக எளிதாக எண்ணிக்கொடுப்பவன். எததையும் எளிதில் ஈவதே அல்லாமல் தனக்கென அரியவற்றை ஓம்பலைக் கல்லாத வாய்மை வாய்க்கப் பெற்றவன் என்றஇசையில் வல்லா இளையர்கள் பாராட்டித் தங்களுடைய கைகளை வரிசையாக நீட்ட. நண்பர்க்கும் மகளிர்க்கும் வணங்கிய மென்மையினையம் பகைவர்க்கு வணங்காத ஆண்மையையம், பகைவரின் ஊர்களை எல்லாம் சுடுகின்ற மிக்க எரி எரித்தலால், மலர் இதழ்கள் கரிந்து அழகு கெட்ட மாலையையம், உலர்ந்த சாந்தமும் கொண்ட பல பொறிகளை உடைய மார்பு பொருந்தியவனே! நினக்கு உரியதான மலையில் தோன்றி நின் கடலிலே கலக்கும் நீர் நிரம்பிய ஆற்pல் நிகழ்த்தப்படும் புனலாட்டு விழாவும் சோலை இடத்து இனிதாய ;இருந்து செய்யும ;வேனிற் கால விழாவும் உடையாய் நீ இத்தகைய பெரிய அரிய வாழ்வில், நின்னை விரும்பிச் சூழும் சுற்றத்டுமன் உடனிருந்து உண்டு மற்ற இன்பப்பகுதி பலவும் அனுபவிக்கும் இயல்பும் கொண்டவன் நீ . செல்வ மக்கள் கூடி விiயாடும் இனிய நீரையுடைய காஞ்சி என்னம் ஆற்றின் பெருந்துறையில் பரந்த நுண்ணிய மணலைவிடப் பல ஆண்டுகள் நின் பெயர் நிலை பெறுவதாகும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 13, section 13.10, p.302", "", "hard", "false"], ["SANG-13-11", "Sangam literature", "சங்க இலக்கியம் – பதிற்றுப்பத்து – ஐந்தாம் பத்து: “பாடல் : 49 : “செங்கை மறவர்” துறை” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – பதிற்றுப்பத்து – ஐந்தாம் பத்து: Explain the poem/passage titled “பாடல் : 49 : “செங்கை மறவர்” துறை” (section 13.11).", "விறலியாற்றுப்படை யாமும் சேறுக, நீயிரும் வம்மின், துயிலுங் கோதைத் துளங்கு இயல் விறலியர்! கொளை வல் வாழ்க்கை நும் கிளை இனிது உணீஇயர், களிறு பரந்து இயலக் கடுமா தாங்க, ஒளிறு கொடி நுடங்கத் தேர் திரிந்து கொட்ப, எஃகு துரந்த எழுதரும் கை கவர் கடுந்தார் வெல்போர் வேந்தரும் வேளிரும் ஒன்று மொழிந்து, மொய் வளம் செருக்கி மொசிந்து வரு மோகூர் வலம்படு குழு நிலை அதிர மண்டி, நெய்த்தோர் தொட்ட “செங்கை மறவர்” நிறம் படு குருதி நிலம் படர்ந்து ஓடி, மழை நாள் புனலின் அவல் பரந்து ஒழுகப், படுபிணம் பிறங்கப் பாழ் பல செய்து, படுகண் முரசம் நடுவண் சிலைப்ப, வளன் அற நிகழ்ந்து வாழுநர் பலர் படக், கருஞ் சினை விறல் வேம்பு அறுத்த பெருஞ்சினைக் குட்டுவன் கண்டனம் வரற்கே. தெளிவுரை : யானைப்படையில் உள்ள யானைகள் எங்கும் பரவிச்செல்லும் விரைந்த செலவையுடைய குதிரைகள் தம்மைச்செலுத்துவோரின் குறிப்பின் படி அணி சிதையாது அவரைத் தாங்கிச் செலலும் விளங்கம் கொடிகள் அசையத் தேர் தான் செல்லும் நெறிக்கு ஏற்ற வண்ணம் சுழன்று செல்லும் வேற்படையைச் செலுத்தி எழுகின்ற பகைவர் முன்னணிப்படையின் இருபப்பங்களிலும் வரும் பக்ப் படையைப் போர் செய்த கவரும் படையையும் வெல்லும் போரையும் உடைய முடி வேந்தரமரும் குறுநில மன்னரும் தங்களுக்குள் அறுகை என்பானை வெல்லும் ஒன்றையே கூறியபடி உன் வர, மிகுந்த வன்மையால் மனம் செருக்கு; காண்ட அலருடன் கூடி வரும் மோகூர் மன்னனான பழையனுடைய வெற்றி தரும் படைக் கூட்டத்தின் கூட்மட் கலைந்து சிதையமாறு நெருங்கித் தாக்கினவன் செங்குட்டுவன். உடலில் தைத்த கருவிகளைப்பிடுங்கம் பொத குருதியில் பட்டதால் சிவந்த கைகiயுடைய போர் வீரரின் மார்புப் புண்ணிடத்து ஒழுகம் குருதியானது, நிலத்தில் பரநத:து ஓடும், புதுத மழை பொழியும் நாளில் பெருக்கெடுத்தோடும ;கலங்கிய நீரைப் போல் பரவிப் பள்ளம் நோக்கிப் பாயும். இறந்து விழும் பிணங்கள் எங்கும் குவியும்படி நிறைந்தன. இங்ஙனம் பலவற்றையம் பாழ் செய்து படையின் நடுவே முழங்க, அப்பழையனின் செல்வம் முழுவதும் கெட, இருந்து வாழ்வதற்றுகுரியவர் இராது இறந்து பொக, குருமையான கொம்பகளையும் வன்மையையும் கொண்ட காவல் மரமான வேம்பினைச் செங்குட்டுவன் வெட்டி வீழ்த்தியவன். மிக்க சினம் கொண்ட அச்செங்குட்டுவனைக் கண்டு வருவதற்காக, அசையும் கூந்தலையும் அச்சமும் உடைய விறலியர்களே! யாமும் செல்கின்றோம். நீங்களும் வருக! பாடல் வன்மையால் வாழுகின்ற வாழ்க கையை உடைய நும் சுற்றத்தவர் உடுப்பவையும அணிபவையும் பெறுவதே அல்லாமல் உண்பனவற்றையம் மிகுதியாய் பெற்று உண்பார்களாக!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 13, section 13.11, p.303", "", "hard", "false"], ["SANG-13-12", "Sangam literature", "சங்க இலக்கியம் – பதிற்றுப்பத்து – ஐந்தாம் பத்து: “பாடல் : 50 : “வெருவரு புனல் தார்” துறை” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – பதிற்றுப்பத்து – ஐந்தாம் பத்து: Explain the poem/passage titled “பாடல் : 50 : “வெருவரு புனல் தார்” துறை” (section 13.12).", "வஞ்சித்துறைப் பாடாண்பாட்டு வண்ணம் : ஒழுகு வண்ணமும் சொற்சரீ ; வண்ணமும் மா மலை முழக்கின் மான் கணம் பனிப்பக், கால் மயங்கு கதழ் உறை ஆலியொடு சிதறிக், கரும்பு அமல் கழனிய நாடு வளம் பொழிய, வளங்கெழு சிறப்பின் உலகம் புரைஇச், செங்குணக்கு ஒழுகும் கலுழி மலிர் நிறைக் காவிரி அன்றியும் பூவிரி புனலொரு மூன்றுடன் கூடிய கூடல் அனையை! கொல் களிற்று உரவுத் திரை பிறழ, வல்வில் பிசிரப், புரை தோல் வரைப்பின் எஃகு மீன் அவிர் வர விரவுப் பணை முழங்கு ஒலி, வெரீஇய வேந்தர்க்கு அரணம் ஆகிய, “வெருவரு புனல் தார்” கல் மிசையவ்வும், கடலவும் பிறவும் அருப்பம் அமைஇய அமர் கடந்து, உருத்த ஆள் மலி மருங்கின் நாடு அகப்படுத்து, நல் இசைந னந்தலை இரிய, ஒன்னார் உருப்பு அற நிரப்பினை; ஆதரலின், சாந்து புலர்பு வண்ணம் நீவி வகை வனப்புற்ற, வரி ஞிமிறு இமிரும் மார்பு பிணி மகளிர் விரிமென் கூந்தல் மெல் அணை வதிந்து, கொல் பிணி திருகிய மார்பு கவர் முயக்கத்துப் பொழுது கொள் மரபின் மென் பிணி அவிழ, எவன் பல கழியுமோ பெரும, பல் நாள் பகை வெம்மையின் பாசறை மரீஇப், பாடு அரிது இயைந்த சிறு துயில் இயலாது, கோடு முழங்கு இமிழ் இசை எடுப்பும் பீடு கெழு செல்வம் மரீஇய கண்ணே? தெளிவுரை : பெரிpய மலையில் மேக ஒலியால் விலங்கக் கூடடம் அச்சம் கொண்ட நடுங்க. காற்றுக் கலந்த மோதுதலால் பொழிகின்ற மழை ஆலங்கட்டியுடன் சிதறிப்பெய்தது. அதனால் கரும்புகள் நெருங்கிய கழனிகளையுயை நாடுகள் வளம் பெருகிச் சுரக்க, சிறப்பையுடைய நிலவுலகத்தைக் காத்து நேர் கிழக்காக ஓடும் கலங்கிய நிறைந்த வெள்த்தையுடைய காவிரியை ஒப்பதே அல்லாமல், மலர்கள்மலர்நத நீரையுடைய ஆறுகள் மூன்றும் கூடிய முக்கூடலையும் ஒப்பவன்ஆவாய். போரிலே பகைவரைக்கொல்லும் தன்மை கொண்ட களிறுகளாகிய பரந்த கடல் அலைகள் அசைந்து வரும் வலிய வில்லாகிய படையை உடையவர். அவ்வலைகள் பிசிர் போன்று பரவுவர். உயர்ந்த கேடகத்தில் விளிம்பின் மீதுத வேற்படை என்ற மீன்கள் விளங்கும். இத்தகைய போர்ப்பறை முதலியவற்றுடன் கலந்து முழங்கம் முரசொலி கேட்டு அஞ்சிப்புகல் அடைவர் அரசர்கள். அவர்களுக்குப் புகலாகிக்காவலாகுவார். அச்சம் தரும் தூசிப்படை என்ற வெள்ளம் மலையிலும் கடலிலும் மற்ற இடங்களிலும் உள்ளனவான அரணிடம் பொருந்திய பேர்களை வஞ்சியாமல்பேர்pட்டு வென்ற விளங்கும் அச்சம் பொருந்திய வீரர் மிக்குள்ள இடங்கை உடைய நாடுகளைக் கைப்பற்றி அகன்ற இடத்தை ஊடைய இவ்வுலகத்தில் பகைவரின் நல்ல புகழ் கெட்டழிய அவர் தம் சினம் என்ற தீ முற்றும் அவியும்படி செய்தாய். பெரும!ஆகையால் பூசிக்கொண்டள்ள சந்தனம் புலர, நெற்றியில் அணிந்த திலகம் கண்ணில் தீட்டிய மையம் பிறவுமான வண்ணங்கள் நீங்க, வரிகளை உடைய வண்டுக்கூட்டம் ஒலிக்கும் நின் மார்பால் பிணிக்கப்பட்ட மங்கையிரின் மன்மையான கூந்தலான மெல்லிய படுக்கையில் கிடந்து மிக்க வருத்தம். தரும் காமவேட்கை மிகுதலால் மார்ப அடைய முயங்கும் மயக்கத்தால், இரவுப் பொழுதைப் பயன் கொள்ளும் முறைமையை உடைய உறக்கம் பெறாது நீங்கும்படி. நாள் பலவும் எப்படிக் கழியுமோ? பல நாள்கள் பாசறையில் இருத்தலால் சங்கு ஒலிக்கும் ஒலியும பிற கருவிகள் எழுப்பும் ஒலியும் பெருமை பொருந்தியபோர் விளைக்கும் செல்வத்தில் பழகிய நின் கண்கள் பகைவரிடம் உண்மான மிக்க சினத்தால் உறங்குதல் அரிதாச் சிறு துயிலும் மேற்கொள்வதும் இயலாது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 13, section 13.12, p.304", "", "hard", "false"], ["SANG-14-1", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “நூல் அறிமுகம்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “நூல் அறிமுகம்” (section 14.1).", "பத்துப்பாட்டில் மூன்றாம் நூலாக அமையும் ஆற்றுப்படை நூல். சிறிய யாழ் கொண்டிருக்கும் பாணனை ஆற்றுப்படுத்தியமையின் சிறுபாணாற்றுப்படை எனப்பட்டது. ஓய்மா நாட்டு நல்லியக்கோடனைப் பாட்டுடைத் தலைவனாகக் கொண்டு நல்லூர் நத்தத்தனார் பாடியது. 269 அடிகளால் இயன்ற ஆசிரியப்பாவால் பாடப்பட்டது. நூலில் பாலை வழியின் கடுமை, விறலி வருணனை, பாணனைக் காணுதல், வஞ்சி நகரத்தின் வளம், கொற்கை நகரின் வளும், உறையூரின் வளம், கடையெழு வள்ளல்களான பேகன், பாரி, காரி, ஆய், அதியமான், நள்ளி, ஓரி ஆகியோரின் சிறப்புகள், நல்லியக்கோடனின் உபசரிக்கும் பண்பு, எயில் பட்டினத்தின் சிறப்பு, வேலூரின் சிறப்பு, ஆமூரின் சிறப்பு, அரண்மனை வாயில் சிறப்பு, பரிசு வழங்கும் முறைமை, நல்லியக்கோடனின் புகழ் முதலானவை சிறப்பிக்கப்படுகின்றன.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.1, p.307", "", "medium", "false"], ["SANG-14-3", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “நிலமகளின் தோற்றம்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “நிலமகளின் தோற்றம்” (section 14.3).", "மணி மலைப் பணைத்தோள் மாநில மடந்தை அணி முலைத் துயல்வரூஉம் ஆரம் போல, செல்புனல் உழந்த சேய்வரல் கான்யாற்று கொல் கரை நறும் பொழில் குயில் குடைந்து உதிர்த்த புதுப்பூஞ் செம்மல் சூடி, புடை நெறித்து கதுப்பு விரித்தன்ன காழ் அக நுணங்கு அறல் மூங்கில் போன்றதான தோள்களை உடையவளாகிய நிலம் என்றும் பெண்ணினுடைய மாணிக்க மலையாகிய முலைகளின் மீது படர்ந்து அசைந்து கொண்டிருக்கக் கூடியதான முத்து மாலையினைப் போன்றதான, ஓடக்கூடியதான நீரின் காரணமாக வருத்தம் கொண்ட வெகு தொலைவினில் இருந்து ஓடிவரக்கூடியதான காற்றாற்று வெள்ளமானது வந்து மோதுகின்ற கரையினில் அமைந்துள்ள நறுமணம் வீசும் சோலையினில், குயிலின் அலகுகள் குடைந்து பின் உதிர்ந்து வாடியப் பூக்களைச் கூடி, நீரில் அரிக்கப்பட்டு படர்ந்திருந்த நிலம் என்ற பெண்ணின் கருமையான கூந்தல் போன்ற தோற்றம் உடைய மணல், கருப்புத் தங்கத்தினை வெள்ளையாக்கியது போன்றதான மணல் பரப்பில்..", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.3, p.307", "", "medium", "false"], ["SANG-14-4", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “இளைப்பாறும் பாணன்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “இளைப்பாறும் பாணன்” (section 14.4).", "அயில் உருப்பு ;அனைய ஆகி ஐது நடந்து வெயில் உருப்புற்று வெம்பரல் கிழிப்ப, வேனில் நின்ற வெம்ப வழி நாள், காலை ஞாயிற்றுக் கதிர் கடா உறுப்ப, பாலை நின்ற பாலை நெடு வழி, சுரன் முதல் மராஅத்த வரி நிழல் அசைஇ, மெதுவாக நடந்து செல்லும் போதினில் வெப்பம் தாக்குகின்ற கூர்மையான கற்கள் பாதங்களில் குத்தி வருத்தம் தரக்கூடியதான இளவேனில் காலம் முழுமையான வெப்பத்தினைத் தந்து, முதுவேனில் பருவம் நடைபெறும் நாள்களில் சூரியனின் கதிர்கள் காலையிலேயே மிகுந்த வெப்பம் தருவதன் காரணமாக பாலை நிலத்தின் குணத்தை முழுமையாக அடைந்தவை போன்று அந்நிலம் காட்சி பெறும் நீண்ட பாலை நிலத்தின் வழியாக நிற்கக் கூடிய கடம்ப மரத்தின் கிளைகளில் மூலமாகப் பரந்து படர்ந்து வரிய (சிறிய) நிழலில் தங்கி நிற்கின்றனர்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.4, p.308", "", "medium", "false"], ["SANG-14-5", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “விறலியரின் அழகு” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “விறலியரின் அழகு” (section 14.5).", "ஐது வீழ் அகு பெயல் அழகு கொண்டு அருளி, நெய் கனிந்து இருளிய கதுப்பின், கதுப்பு என மணிவயின் கலாபம் பரப்பி பலவுடன் மயில் மயில் குளிக்கும் சாயல், சாஅய் உயங்கு நாய் நாவின் நல் எழில் அசைஇ, வயங்கு இழை உலறிய அடியின் அடி, தொடர்ந்து ஈர்ந்து நிலம் தோயும் இரும் பிடித் தடக் கையின் சேர்ந்து உடன் செறிந்த குறங்கின், குறங்கு என மால் வரை ஒழுகிய வாழை, வாழைப் பூ எனப் பொலிந்த ஓதி நளிச்சினை வேங்கை நாள் மலர் நச்சி களிச் சுரும்பு அரற்றும் சுணங்கின், சுணங்கு பிதிர்ந்து யாணர்க் கோங்கின் அவிர் முகை எள்ளிப் பூண் அகத்து ஒடுங்கிய வெம்முலை, முலை என வண்கோட் பெண்ணை வளர்த்த நுங்கின் இன் சேறு இகுதரும் எயிற்றின், எயிறு என குல்லை அம் புறவில் குவி முகை அவிழ்ந்த, முல்லை சான்ற கற்பின், மெல்இயல், மட மான் நோக்கின், வாணுதல் விறலியர் வானிலிருந்து சிறுசிறு தூறல்கள் விழுகின்றன. அந்த மழைத் துளிகளின் அழகினைத் தன்னருகில் கொண்டிருக்கக் கூடிய குளிர்ச்சியான கூந்தலையும், இவர்களுடைய அழகுக்கு முன்னால் நாம் எந்த வகையிலும் ஈடாக மாட்டோம் என்று நினைத்து மயில் கூட்டங்கள், நீண்ட தோகையினையுடைய ஆண் மயில்கள், பெண் மயில்களின் மத்தியில் தங்கள் முகங்களை மறைத்துக் கொண்டு செல்லக் கூடிய அழகினைப் போன்றும், வேகமாக ஓடி இளைத்த நாயின் தொங்குகின்ற நாக்கினைப் போன்று எந்தவிதமான அணிகலன்களும் இல்லாமல் அழகு குறைந்ததாக காணப்படும் பாதங்களையும், பெண் யானையின் தும்பிக்கையினைப் போன்ற திரண்ட பெரிய அழகானத் தொடைகளையும், வாழைப் பூவினைப் போன்ற தோற்றத்தையுடைய அலங்கரிங்கப்பட்ட கொண்டையினையும், வேங்கை மலர் போன்ற தேமலையும், கோங்க மலரின் மொட்டுகள் போன்ற தன்மையுடன் காட்சியளித்திடும் முலைகளையும், நுங்கின் இனிமையையுடைய நீரினையும், நீர் ஊறும் வாயினையும், முல்லை மலரினைச் சூடிக் கொள்ளத்தக்க சிறப்பினை உடைய கற்பினையும், மென்மையான உடல் வாகினையும், மானினைப் போன்ற மருட்சியான அச்சத் தன்மையும் கொண்ட பார்வையும் உடைய கண்களையும், ஒளி வீசக்கூடியதான நெற்றியினையும் உடைய விறலியர்கள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.5, p.308", "", "hard", "false"], ["SANG-14-6", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “விறலியரின் காலைத் தடவி விடும் இளையர்கள்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “விறலியரின் காலைத் தடவி விடும் இளையர்கள்” (section 14.6).", "நடை மெலிந்து அசைஇய நல்மென் சீறடி, கல்லா இளையர் மெல்லத் தைவரப் அவர்கள் ஊர் ஊராக நடந்து நடந்து களைத்து வருந்தி உடல் இளைத்ததான நிலையில் காணப்பட்ட விறலியர்களின் பாதங்களைக் கல்வி அறிவு என்பது சிறிதும் இல்லாத இளைஞர்கள் மெதுவாக வருடிக் கொண்டிருந்தார்கள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.6, p.309", "", "easy", "false"], ["SANG-14-7", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “பரிசில் பெற்ற பாணன் குடும்பத்துடன் வந்து பாணனைச்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “பரிசில் பெற்ற பாணன் குடும்பத்துடன் வந்து பாணனைச்” (section 14.7).", "சந்தித்தல் பொன் வார்ந்தன்ன புரியடங்கு நரம்பின் இன்குரல் சீறியாழ் இடவயின் தழீஇ, நைவளம் பழுநிய நயந்தெரி பாலை கைவல் பாண்மகன், கடன் அறிந்து இயக்க, இயங்கா வையத்து வள்ளியோர் நசைஇ, துனிகூர் எவ்வமொடு, துயர் ஆற்றுப்டுப்ப, முனிவு இகந்து இருந்த, முதுவாய் இரவல பொன்னால் செய்யப்பட்ட கம்பியினைப் போன்று சிறிதளவும் முறுக்கல் என்பது இல்லாத நரம்பின் இனிய ஓசை எழுப்பும் சிறிய யாழினை தம் இடது புறமாக இருக்கும் படியாக பொருத்திக் கொண்டு, நட்டபாடை என்னும் இனிமை நிறைந்த செம்மையான பண்ணினை இசைத்திட வேண்டிய முறைகளை நன்கு அறிந்தவனாகிய மூத்த பாணன் இசைத்திடவும், வள்ளல்கள் இல்லாத காரணத்தால் பரிசு பெறுவோர் எங்கும் செல்லாமல் இந்த உலகில் பரிசு கொடுக்கக் கூடியதான வள்ளல் தன்மை உடையவர்களை விரும்பித் தேடிச் செல்லக்கூடிய அவசியத்தினை தங்களுடைய வறுமை ஏற்படுத்தியதனால், வழியில் நீண்ட தூரம் நடந்து வந்து துன்பம் தீர்ந்திருந்த முழுமையான அறிவினை உடைய இரவலன்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.7, p.309", "", "medium", "false"], ["SANG-14-8", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “சேர நாட்டின் வளம்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “சேர நாட்டின் வளம்” (section 14.8).", "கொழுமீன் குறைய ஒதுங்கி, வள் இதழ்க கழுநீர் மேய்ந்த கய வாய் எருமை, பைங்கறி நிவந்த பலவின் நீழல், மஞ்சள் மெல் இலை மயிர்ப் புறம் தைவர, விளையா இளங்கள் நாற, மெல்குபு, பெயரா, குளவிப் பள்ளிப் பாயல் கொள்ளும் குட புலம் காவலர் மருமான், ஒன்னார் வட புல இமயத்து வாங்கு வில் பொறித்த, எழு உறழ் திணி தோள், இயல் தேர்க் குட்டுவன், வருபுனல் வாயில் வஞ்சியும் வறிதே, அதாஅன்று கொழுத்துப் பருத்த மீன் துண்டாகச் சிதையும்படியாக அதனை மிதித்துக் கொண்டே சென்று, வளப்பத்துடன் கூடிய இதழ்களை உடைய செங்கழுநீர் மலர்களை உண்ணக்கூடிய எருமைக் கூட்டமும், பசுமையான மிளகுக் கொடிகள் படர்ந்திருக்கும் பலாமரத்தின் நிழலில் மஞ்சள் இலைகள் தன் முதுகைத் தடவிக் கொண்டிருக்கக் காட்டு மல்லிகைக் கொடிகள் மிகுதியாக நிறைந்திருந்த படுக்கையில் தேன் மணம் நிறைய தான் உண்டவற்றை அசை போட்ட வண்ணம் தூக்கத்தினை மேற்கொண்டுள்ள மேற்குத் திசையில் அமைந்துள்ள சேர நாட்டில் அரச மரபில் வந்து உதித்தவனும், கணையமரம் போன்ற வலிமையுடைய தோள்களை உடையவனும், வடதிசையில் அமைந்துள்ள இமயமலையில் தம்முடைய விற்கொடியினை நாட்டியவனும், குட்ட நாட்டினுடைய தலைவனுமாகிய மன்னன் வாழ்ந்திடக் கூடியதான வஞ்சி மாநகர். இக்காலத்தில் இரவலர்களாக வருபவர்களுக்கு வழங்கக்கூடிய பரிசு சிறிய அளவினதாக இருக்கும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.8, p.310", "", "medium", "false"], ["SANG-14-9", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “பாண்டிய நாட்டின் பெருமை” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “பாண்டிய நாட்டின் பெருமை” (section 14.9).", "நறவுவாய் உறைக்கும் நாகு முதிர் நுணவத்து அறைவாய்க் கநற்துணி அயில் உளி பொருத, கை புனை செப்பம் கடைந்த மார்பின், செய்பூங் கண்ணி செவி முதல் திருத்தி, நோன் பகட்டு உமணர் ஒழுகையொடு வந்த மகாஅர் அன்ன மந்தி, மடவோர் நகாஅர் அன்ன நளிநீர் முத்தம், வாள் வாய் எருந்தின் வயிற்றகத்து அடக்கி, தோள் புற மறைக்கும் நல்கூர் நுசுப்பின் உளர் இயல் ஐம்பால் உமட்டியர் ஈன்ற கிளர் பூண் புதல்வரொடு, கிலுகிலி ஆடும் தத்து நீர் வரைப்பின் கொற்கைக் கோமான், தென்புலம் காவலர் மருமான், ஒன்னார் மண் மாறு கொண்ட மாலை வெண்குடை கண்ணார் கண்ணி கடுந்தேர்ச் செழியன், தமிழ் நிலைபெற்ற தாங்கு அரு மரபின், மகிழ்நனை மறுகின் மதுரையும் வறிதே, மேற்சொன்ன வஞ்சி நகரம் மட்டுமின்றி, நுணா மரத்தினை அறுத்துச் செய்யப்பட்ட, மாலையினை அணிந்திருக்கக் கூடிய மார்பினையும் செயற்கையான பல இழைகளைக் கொண்டு செய்யப்பட்ட அழகான பூமாலையினைச் சுற்றிக் கொண்டிருக்கக் கூடிய நெற்றியினையும் உடையவர்களான உப்பு வணிகர்களின் வண்டிகளுடன் வந்த அவர்கள் பெற்ற பிள்ளைப் போன்று, அவர்களுடன் இணைந்தே வாழும் பெண் குரங்கு, மான் போன்றவற்றுடன், வாயினைத் திறந்தப்பn காட்சித் தரக் கூடிய கிளிஞ்சல்களின் உள்ளே முத்துகளை அடைத்து, அதன் வாயினை மூடி, அந்தக் கிளிஞ்சல்களைத் தங்களுடைய குழந்தைகளுக்கு கிலுகிலுப்பையாகக் கொண்ட பெண்கள், தங்களின் இடையினையும் தோளினையும் மறைக்கும் வகையில் தம்முடையக் கூந்தலை ஐந்து வகையான காலெடுத்துச் செய்யும் அலங்காரத்தால் பன்னி முடிக்கப்பட்ட அழகினை உடையவர்களாய், அந்த உப்பு வணிகர்களின் மனைவியர்கள், தாம் பெற்ற குழந்தைகளுடன் விளையாடக் கூடியதான கடற்கரை நகரமாகிய கொற்கை மாநகரின் தலைவனும், தென் திசையில் அமைந்துள்ள பாண்டிய நாட்டினைக் காவல் காத்திடக் கூடிய பாண்டிய மன்னனின் குலத்தோன்றலாகத் தோன்றியவனும், பகைவர்களின் நிலங்களைப் போர் மூலமாகத் தம்முடையதாக்கிக் கொண்டவனும், முத்துக்களால் அலங்கரிக்கப்பட்ட வெண்கொற்றக் குடையினை நடையவனும், மாலை அணிந்தவனும், வலிமை உடைய தேரினை உடையவனுமாகிய பாண்டியன் நெடுஞ்செழியன் தமிழ் நிலைப் பெற்றுத் தங்கி விளங்கிடக் கூடியதான பெருமையினால் அளவற்ற மகிழ்வினை உடைய பெரிய தெருக்களைத் தன்னகத்தில் கொண்டுள்ள மதுரை மாநகரில் பெறக்கூடிய பரிசுகள் மட்டும் சிறிய அளவினதாகவா இருக்கும்?", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.9, p.310", "", "hard", "false"], ["SANG-14-10", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “சோழ நாட்டின் பெருமை” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “சோழ நாட்டின் பெருமை” (section 14.10).", "………………………………அதாஅன்று நறு நீர்ப் பொய்கை அடை கரை நிவந்த துறு நீர்க் கடம்பின் துணை ஆர் கோதை, ஒவத்து அன்ன உண் துறை மருங்கில், கோவத்து அன்ன கொங்கு சேர்பு உறைத்தலின் வருமுலை அன்ன வண்முகை உடைந்து திருமுகம் அவிழ்ந்த தெய்வத் தாமரை, ஆசுஇல் அங்கை அரக்குத் தோய்ந்தன்ன, சேயிதழ் பொதிந்த செம் பொற்கொட்;டை, ஏம இன் துணை தழீஇ, இறகு உளர்ந்து காமரு தும்பி காமரம் செப்பும் தண் பணை தழீஇய தளரா இருக்கை, குணபுலம் காவலர் மருமான், ஒன்னார் ஓங்கு எயில் கதவம் உருமுச்சுவல் சொறியும் தூங்கு எயில் எறிந்த தொடி விளங்கு தடக்கை, நாடா நல்லிசை நற்றேர்ச் செம்பியன், ஓடாப் புட்கை உறுந்தையும் வறிதே, அதாஅன்று மதுரை மாநகரம் மட்டுமின்றி நீர் நிலைகளை அடுத்து மனிதர்களால் உருவாக்கப்படாமல் இயற்கையாகவே அமைந்ததுடன், நறுமணம் வீசிடக் கூடியதான கரையினில் வளர்ந்திருக்கக் கூடியதான செறிவான மாலையினைப் போன்ற தன்மையுடன் திழ்ந்திடக் கூடிய கடம்ப மலர்கள், இந்திரக் கோபப் பூச்சியின் நிறம் போன்ற மகரந்தகளைச் சிந்துகின்ற காரணத்தினால், வரைந்து வைத்தற்கான ஓவியத்தினைப் போலக் காட்சித் தரக்கூடிய அழகு மிகுந்த குடிநீர்த் துறையில் பூத்துக் காட்சி தரக்கூடிய தாமரை மலரின் நிறத்தினை எடுத்துச் சேர்த்ததைப் போன்று சிவந்த நிறத்துடன் காணப்படக் கூடிய அக இதழ்களால் சூழப்பட்டிருக்கும். தங்க நிறத்திலான பொருட்டின் மீது தும்பி தன்னுடைய பெண் துணையினைத் தழுவிக் கொண்டு சிறகுகளை அசைத்துச் சிகாமரம் என்னும் பண்ணினைப் பாடியபடி, மருத நிலங்களால் சூழப்பட்டிருக்கும் வகையில் கிழக்கில் அமைந்துள்ள நிலங்களைப் பாதுகாத்திடக் கூடியதான சோழ மன்னர்களின் பழமையான குலத்தோன்றலாக வந்துதித்தவனும், தொடி என்னும் அழகிய அணியினை அழகுற தம் கைகளில் அணிந்தவனும், சிறப்பு உடைய தேரினை உடையவனும், சோழன் செம்பியனின் குடிமக்கள் தங்கி, தம் நிலத்தினை விட்டு நீங்கிவிடாத வகையில், அவர்கள் விரும்பித் தங்கும் வகையிலான வளமையான வாழ்வினைக் கொடுத்திடக்கூடிய உறையூர் என்னும் ஊரினில் தரக் கூடிய பரிசு சிறிய அளவினதாகவே ஈருக்கும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.10, p.311", "", "hard", "false"], ["SANG-14-11", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “கடையெழு வள்ளல்களின் சிறப்பு” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “கடையெழு வள்ளல்களின் சிறப்பு” (section 14.11).", "பேகன் : வானம் வாய்த்த வளமலைக் கவாஅன் கான மஞ்ஞைக்குக் கலிங்கம் நல்கிய அருந்திறல் அணங்கின் ஆவியர் பெருமகன் பெருங்கல் நாடன் பேகனும் உறையூரில் கிடைத்திடக்கூடிய பரிசும் சிறியதாகவே இருக்கும். அதனால் தக்க பரிசினை வழங்கக் கூடிய இடம் வேறு ஏதும் இல்லை என்பதனாலும், பருவக் காலத்தில் பொழிந்திடக்கூடிய மழையானது பொய்த்து விடாமல், சரியான காலத்தினால் பொழிந்த காரணமாக வளமான மலைப் பகுதியினை ஒட்டிய காட்டினில் வாழ்ந்திடக்கூடிய மயில் அகவியதனைக் கேட்டு, அம்மயிலானது குளிரின் கொடுமை தாங்காமல் தான் நடுங்கிக் கத்துகின்றது என நினைத்து, அதன் காரணமாகத் தன்னுடைய மனதில் உண்டான அருள் தன்மையின் காரணமாகத் தான் அணிந்திருந்த தன்னுடைய போர்வையினை மயிலுக்குப் போர்த்தி அதன் குளிரைத் தடுக்க முயன்றவனும், வலிமை உடைய ஆவியர் குடியில் தோன்றி பெருந்தன்மையும் நற்குணமும் உடையவனுமாகிய, பெரிய மலை நாட்டிற்கு தலைவனுமாகிய பேகன் என்னும் வள்ளல். பாரி : ………… சுரும்பு உண நறுவீ உறைக்கும் நாக நெடு வழிச் சிறுவீ முல்லைக்குப் பெருந்தேர் நல்கிய பிறங்கு வெள்ளருவி வீழும் சாரல் பறம்பின் கோமான் பாரியும் வண்டுகள் அனைத்தும் மகிழ்ந்து தேன் உண்ணும் வகையில் எவ்விதமானக் குறையும் நேராத வகையில் தேன் துளிகளைத் துளிர்த்துக் கொண்டிருக்கக் கூடியதான சுரப்புன்னை மரங்கள் கூழ்ந்துள்ள வழியில் தான் செல்லுகின்ற பாதையில் தான் செல்லக்கூடியதான தேரினைத் தடுத்திட்ட சிறிய உடைய முல்லைக் கொடியினைக் கண்டு, அது தன்னுடையத் தேரின் கால்களைப் போன்று எங்கும் பட்டுச் சிதைந்துவிடாத வகையில் அந்த முல்லைக் கொடிக்குத் தன்னுடையத் தேரினையேக் கொடுத்திட்டவனும், ஓசையுடன் வீழ்ந்திடக் கூடியதான அழகிய அருவிகளால் சூழப்பட்டதான பறம்பு மலைக்கு சொந்தமுடைய மன்னனாகிய பாரி என்னும் வள்ளல். காரி : ……………………. கறங்கு மணி வால் உளைப் புரவியொடு வையகம் மருள ஈர நல்மொழி இரவலர்க்கு ஈந்த, அழல் திகழ்ந்து இமைக்கும் அஞ்சுவரு நெடு வேல் கழல் தொடித் தடக் கை காரியும் ஒலியினை உடையதான இயல்புடைய மலைகளால் கட்டப்பட்டதும் தலைகள் ஆட்டக் கூடியதுமான குதிரைகளையும், தம்முடைய நாட்டினையும் கருணையுடையதான வார்த்தைகளையும் மற்றவர்கள் கேட்டு வியந்து போற்றும் வகையில் தம்மை நாடி வந்த இரவலர்களுக்கு அள்ளக் கொடுத்திட்டவனும், வேலினையும், தொடி என்னும் அணிகலனை கைகளில் அணிந்தவனுமாகிய காரி என்னும் வள்ளல். ஆய் அண்டிரன் : ……….. ……………. நிழல் திகழ் நீல நாகம் நல்கிய கலிங்கம் ஆல் அமர் செல்வற்கு அமர்ந்தனன் கொடுத்த சாவம் தாங்கிய சாந்து புலர் திணி தோள் ஆர்வ நன் மொழி ஆயும் ஒளி வீசக்கூடிய நீல நிறமுடைய வயிரக் கல்லினையும், நாகத்தினால் வழங்கப்பட்ட ஆடையினையும் மிகுந்த மன மகிழ்சச ; pயுடன் ஆலத்தின் அடியில் அமர்ந்தவனாகிய சிவ பெருமானுக்கு வழங்கியவனும், வில்லினைக் கரங்களால் ஏந்தியவனும், சந்தனம் பூசியவுடன் அது உலர்ந்த தன்மையுடன் காட்சி அளித்திடக்கூடிய அழகிய தோள்களை உடையவனும், ஆர்வம் உடையதான இனிய சொற்களைப் பேசிடக்கூடியவனுமாகிய ஆய் என்னும் வள்ளல். அதிகன் (அதியமான்) : …………. மால் வரைக் கமழ்பூஞ் ச titled “நல்லியக்கோடனின் ஈகைச் சிறப்பு” (section 14.12).", "எழுவர் பூண்ட ஈகைச் செந்நுகம், விரிகடல் வேலி வியலகம் விளங்க, ஒரு தான் தாங்கிய உரனுடை நோன் தாள் நறு வீ நாகமும், அகிலும், ஆரமும், துறை ஆடு மகளிர்க்குத் தோள் புணை ஆகிய, பொரு புனல் தரூஉம் போக்கறு மரபின், தொல் மா இலங்கைக் கருவொடு பெயரிய, நல் மா இலங்கை மன்னருள்ளும், மறு இன்றி விளங்கிய வடு இல் வாய்வாள் உறு புலித் துப்பின் ஓவியர் பெருமகன், களிற்றுத் தழும்பு இருந்த கழல் தயங்கு திருந்து அடி பிடிக்கணம் சிதறும் பெயல் மழைத் தடக்கை பல்இயக் கோடியர் புலவலன் பேர் இசை நல்லியக்கோடனை ……………… என்றெல்லாம் பலவாறாகப் புகழ்ந்து எடுத்துரைக்கப்பட்டவர்களும் போர்ச் சூழலில் அளப்பறிய ஆற்றலால் சிறந்தவர்களாகவும் திகழ்ந்த இந்த வள்ளல்கள் எழுவரும் செய்ததான கொடை என்பதான பாரத்தினை உலகம் முழுவதும் அறியும் படியாக தான் ஒருவனாகச் செய்து தாங்கிய மனவலிமையும் தளராத முயற்சியும் உடையவனும், சுரபுன்னை, அகில், சந்தானம் என்ற அனைத்தினையும் கலந்து நீராடக் கூடியவர்களான பெண்களுக்கு தெப்பமாக நீரினை முகர்ந்து வந்து அளித்திடக் கூடிய அழிவற்ற சிறப்பினை உடையதும் பழமையான நிலைத்த புகழினை உடையதுமான இலங்கை மாநகரின் பெயரைத் தன் பெயராகத் தான் தோன்றிய காலத்திலேயே பெற்ற நன்மை பொருந்திய இலங்கையினை ஆண்ட மன்னர்களுள் சிறப்பிற்குரியவனும், வாள் போரினில் சிறந்த வெற்றியினை அடையக் கூடியவர்களும், புலியினை அடையக் கூடியவர்களும், புலியினை அடையக் கூடியவர்களும், ஓவியர் குடியினில் தோன்றியவனும், அழகிய பாதங்களை உடையவனும், பெண் யானைகளை பரிசாக வழங்கும் மழை போன்றதானக் கருணைக் கரங்களை உடையவனும் கூத்தர்களைப் புகழ்ந்து அவர்கள் மகிழும்படியாகக் கொடையினை வழங்குவதில் தலைசிறந்தவனும், பெரும் புகழினை உடையவனுமாகிய நல்லியக்கோடன் என்னும் வள்ளலினைப்பாடிச் செல்கின்றோம். …………நயந்த கொள்கையொடு, தாங்கரு மரபின், தன்னும், தந்தை வான் பொரு நெடு வரை வளனும் பாடி, முன் நாள் சென்றனம் ஆக உயர்ந்த குடியில் பிறந்த சிறப்பினையும் நற்குணங்களையும் மிகுதியாக உடைய நல்லியக் கோடனைக் காண வேண்டும் என்று விரும்பிய மனதுடன் அவனையும் அவன் தந்ததையின் செல்வ வளத்தினையும் புகழ்ந்து பாடிய வண்ணம் அந்த வள்ளலைத் தேடி சில நாள்களுக்கு முன்பு நாங்கள் சென்றோம். அவ்வாறு சென்ற பின்னர்,", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.12, p.315", "", "hard", "false"], ["SANG-14-13", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “நல்லியக்கோடனைக் காணுமுன் இருந்த வறுமை நிலையும்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “நல்லியக்கோடனைக் காணுமுன் இருந்த வறுமை நிலையும்” (section 14.13).", "கண்டபின் வளமை நிலையும் : ……………… ……… இந்நாள் திறவாக் கண்ண சாய் செவிக் குருளை, கறவாப் பால் முலை கவர்தல் நோனாது, புனிற்று நாய் குரைக்கும், புல்லென் அட்டில் காழ் சோர் முது சுவர்க் கணச் சிதல் அரித்த பூழி பூத்த புழல் காளாம்பி, ஒல்கு பசி உழந்த ஒழுங்கு நுண் மருங்குல், வளைக் கை கிணைமகள், வள் உகிர்க் குறைத்த குப்பை வேளை உப்பிலி வெந்ததை, மடவோர் காட்சி நாணிக் கடை அடைத்து, இரும்பேர் ஒக்கலொடு ஒருங்கு உடன் மிசையும், அழி பசி வருத்தம் வீடப் பொழி கவுள் தறுகண் பூட்கைத் தயங்கு மணி மருங்கின் சிறுகண் யானையொடு, பெருந்தேர் எய்தி, யாம் அவண் நின்றும் வருதும். மன்னனை சென்று சந்திப்பதற்கு முன்னால் வந்த கலைஞர்களாகிய பாணர்கள் வாழும் வீடுகளில் புதிதாகப் பிறந்து இன்னும் கண்களைக் கூடத் திறக்க முடியாத சாய்ந்த காதுகளை உடைய நாய்ககு ; ட்டிகள் மற்றவர்கள் எளிதில் கநற்து விடமுடியாத பால் முலையினை உடைய நாயின் (தாயின்) முலைகளைப் பசியால் கடித்துப் பால் உண்ணுவதனைப் பொறுக்க இயலாது பசியினால் வாடும் தாய் நாய் குரைக்கும். இத்தகைய நாய்கள் சிறுமைத் தன்மையுடைய சமையல் அறையில் கட்டப்பட்ட கயிறுகள் இற்று கூரை சரிந்து விழுந்து கிடக்கக் கூடிய பழமையான சுவரினில் உண்டான கரையான்கள் அரிக்கப்பட்ட புழுதிகள் சூழ்ந்த இடத்தினில் காளான்கள் முளைத்தன. இத்தகையதான வறுமையின் காரணமாக ஏற்பட்ட பசியின் காரணமாகத் தளர்ந்த இணைமகள் தன் கைகளால் கிள்ளி எடுத்து வந்த குப்பையில் வளர்ந்த வேளைக் கீரையினை உப்பில்லாமல் வேகவைத்து சமைத்து மற்றவர்கள் தன் வறுமையினை கண்டுவிடாதபடி நாணத்துடன் தன் வீட்டின் வாசலை அடைத்து, பின்னர் தங்களுடைய உறவுகளுடன் அதனைப் பகிர்ந்து உண்கின்றனர். அவ்வாறு அந்த உணவினை; தின்பதற்குக் காரணமான அறிவு முதலானவற்றை அழிக்கும் பசித்துன்பம் என்பதே இல்லாமல் அழிந்து போகும் வகையில் மதம் வழியும் கன்னத்தினையும் கொலைத் தொழிலில் சிறந்து விளங்கிடக் கூடியதான வலிமையினையும் கொண்டதும் சிறிய கண்களை உடையதுமான யானையுடன் கூடிய பெரிய தேர்களையும் பரிசாகப் பெற்று நாங்கள் நல்லியக்கோடனின் அரண்மனையிலிருந்து வந்து கொண்டிருக்கின்றோம்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.13, p.316", "", "hard", "false"], ["SANG-14-14", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “பாணனின் ஆற்றுப்படுத்தும் பண்பு” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “பாணனின் ஆற்றுப்படுத்தும் பண்பு” (section 14.14).", "…… …… .. …………. நீயிரும் இவண் நயந்து இருந்த இரும்பேர் ஒக்கல் செம்மல் உள்ளமொடு செல்குவிர் ஆயின் இது இத்தன்மையுடையதாகத் திகழ்வதனால் நீங்களும் உங்களை விரும்பி வாழும் உறவுகளுடன் எவ்விதமான சந்தேகமுமின்றி அந்த வள்ளல் தன்மை உடையவனான நல்லியக்கோடனை நோக்கிச் செல்லுங்கள். சென்றால்….", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.14, p.317", "", "easy", "false"], ["SANG-14-15", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “எயிற்பட்டினத்திற்குச் செல்லும் வழியும் பரதவர் தரும்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “எயிற்பட்டினத்திற்குச் செல்லும் வழியும் பரதவர் தரும்” (section 14.15).", "விருந்தும் : அலை நீர்த் தாழை அன்னம் பூப்பவும், தலை நாள் செருந்தி தமனியம் மருட்டவும், கடுஞ்சூல் முண்டகம் கதிர் மணி கழா அலவும், நெடுங்கால் புன்னை நித்திலம் வைப்பவும், கானல் வெண் மணல் கடல் உலாய் நிமிர்தர, பாடல் சான்ற நெய்தல் நெடு வழி மணி நீர் வைப்பு மதிலொடு பெயரிய பனி நீர்ப் படுவின் பட்டினம் படரின் ஓங்கு நிலை ஒட்டகம் துயில் மடிந்தன்ன, வீங்கு திரை கொணர்ந்த விரை மர விறகின், கரும் புகைச் செந்தீ மாட்டிப் பெருந்தோள் மதி ஏக்கறூஉம் மாசு அறு திருமுகத்து நுதி வேல் நோக்கின் நுளைமகள் அரித்த பழம் படு தேறல் பரதவர் மடுப்ப, கிளை மலர்ப் படப்பைக் கிடங்கில் கோமான், தளைஅவிழ் தெரியல் தகையோற் பாடி அறல் குழல் பாணி தூங்கியவரொடு, வறல் குழல் சூட்டின் வயின் வயின் பெறுகுவீர் கடற்கரையினால் அன்னப் பறiவியன் நிறத்தினைப் பொன்ற தாழை மலர் மலர்ந்திருப்பதைப் போன்றும், பொன் போன்ற நிறத்தினை உடைய செருந்தி மலர்கள் பூத்திருப்பதனாலும், நீல வயிரக் கல்லின் நிறத்தினை உடையதான சுழி முள்ளிப்பூ மலர்ந்திருந்ததனாலும், புன்னை மரங்கள் முததுக்களைப் போல அரும்புகளைத் தோற்று வித்திருப்பதனாலும் கடல் அலை மலையில் பரவி உயர்ந்து எழுவதனாலும் இனிய இசை அறிந்த புலவர்கள் பாடுவதற்குப் பொருத்தம் உடையதான நெய்தல் நிலத்தின் வழியில் நீல வைரக்கல் போன்ற உப்பங்கழிகள் நிறைந்துள்ள எயிற் பட்டினத்தினைச் சென்று அடைவீர்களாக. அங்குச் சென்றால் ஒட்டகம் உறங்கிக் கிடப்பதனைப் போன்ற தன்மையுடன் அமைந்திருக்கக் கூடிய கடல் கொண்டு வந்து ஒதுக்கியதுமான அகில் மரத்தின் விறகுகளால் எரித்து, பெரிய தோள்களையும் நிலவு போன்ற முகத்தினையும் வேல் போன்ற கூர்மையான நோக்கினையும் உடைய நுளையர் மகள் காய்ச்சி வடிகட்டிய கள்ளனைப் பரதவர்கள் உங்கள் வாயினில் ஊட்டி விடுவார்கள். இதனால் நீங்கள் மகிழ்சச ; p கொண்டு கிடங்கில் பகுதியின் தலைவனாகிய நல்லியக் கோடனைப் புகழ்ந்து பாடிக் குழலின் ஓசைக்கு ஏற்ப ஒலிக்கும் தாளத்திற்கு ஏற்ப ஆடும் உங்கள் விறலியர்களுடன் குழல் மீன் கருவாட்டினையும் பெற்று உண்டு மகிழ்ந்திடுவீர்கள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.15, p.317", "", "hard", "false"], ["SANG-14-16", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “வேலூரின் சிறப்பும் எயினர் தரும் விருந்தும்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “வேலூரின் சிறப்பும் எயினர் தரும் விருந்தும்” (section 14.16).", "பைந்நனை அவரை பவழம் கோப்பவும், கரு நனைக் காயா கண மயில் அவிழவும், கொழுங்கொடி முசுண்டை கொட்டங் கொள்ளவும், செழுங்குலைக் காந்தள் கை விரல் பூப்பவும், கொல்லை நெடு வழிக் கோபம் ஊரவும், முல்லை சான்ற முல்லை அம் புறவின் விடர் கால் அருவி வியன் மலை மூழ்கிச் சுடர் ;கால் மாறிய செவ்வி நோக்கித் திறல் வேல் நுதியின் பூத்த கேணி, விறல் வேல் வென்றி வேலூர் எய்தின் உறுவெயிற்கு உலைஇய உருப்பு அவிர் குரம்பை எயிற்றியர் அட்ட இன் புளி வெஞ்சோறு தேமா மேனி சில் வளை ஆயமொடு, ஆமான் சூட்டின் அமைவரப் பெறுகுவிர் பவளத்தினைக் கோர்த்து வைத்ததைப் போன்று அவரைப் பூக்கள் மலரச் செய்யவும், மயில்களின் கழுத்தில் அமைந்துள்ள நீல நிறத்தினைப் போன்று காணப்படக்கூடிய காயாம் பூக்கள் மலர்ந்திடவும், வளமான கொடியினை உடைய முசுண்டை சிறு சிறு பெட்டிகள் போன்?று கொத்துக் கொத்தாக மலர்ந்திருக்கவும், காந்தள் மலர்கள் செழித்து வளர்ந்த கைவிரல்களைப் போல காட்சி தரவும், கொல்லை நிலத்தில் கிடந்த பாதைகளில் இந்திரகோபப் பூச்சிகள் ஊறித் திரியவும், முல்லை நில ஒழுகலாறுகள் நிறைந்தும் முல்லைக் கொடிகள் படர்ந்துள்ள அழகு பொருந்திய காட்டில் மலையின் பின்னால் சூரியன் மறைந்து அதன் ஒளி மங்கிய மாலை வேலையினை நோக்கி வேலின் நுனியினைப் போன்று அரும்பிய கேணிகளை உடைய வேலினால் வெற்றி மிகும் வேலூரினைச் சென்று சேர்ந்தீர்கள் என்றால் அங்கே வாழ்பவர்கள், வருத்தம் கொள்ள காரணமான வெப்பம் மிகுதியான குடிசைகளில் வாழ்ந்திடக்கூடிய எயினர்களின் குலத்;தில் பிறந்த பெண்கள் தாங்கள் சமைத்த இனிமைத் தன்மையுடைய புளிக்கறியில் அமைந்த சோற்றினை இறைச்சியுடன் பசி நீங்கும் அளவிற்கு நிறைவாகப் பெறுவீர்கள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.16, p.318", "", "medium", "false"], ["SANG-14-17", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “ஆமூர் வளமும் உழத்தியரின் விருந்தோம்பலும்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “ஆமூர் வளமும் உழத்தியரின் விருந்தோம்பலும்” (section 14.17).", "நறும் பூங்கோதை தொடுத்த நாட் சினைக் குறுங்கால் காஞ்சிக் கொம்பர் ஏறி, நிலை அரும் குட்டம் நோக்கி நெடிது இருந்து, புலவுக் கயல் எடுத்த பொன் வாய் மணிச்சிரல், வள்உகிர் கிழித்த வடு ஆழ் பாசடை, முள் அரைத் தாமரை முகிழ் விரி நாட் போது கொங்கு கவர் நீலச் செங்கண் சேவல் மதிசேர் அரவின் மானத் தோன்றும், மருதம் சான்ற மருதத் தண் பணை, அந்தணர் அருகா அருங்கடி வியன் நகர், அம் தண் கிடங்கின் அவன் ஆமூர் எய்தின் வலம்பட நடக்கும் வலி புணர் எருத்தின் உரன் கெழு நோன் பகட்டு உழவர் தங்கை, பிடிக்கை அன்ன பின்னு வீழ் சிறுபுறத்துத் தொடிக் கை மக^உ, மகமுறை தடுப்ப, இருங்காழ் உலக்கை இரும்பு முகம் தேய்த்த அவைப்பு மாண் அரிசி அமலை வெண்சோறு கவைத்தாள் அலவன் கலவையொடு பெறுகுவீர் மணம் வீசக்கூடிய பூமாலைகளைக் கட்டியது போன்ற அழகுடன் மலர்ந்துள்ள பருவம் உடைய கிளைகளையும் சிறிய இலைகளையும் உடையதான காஞ்சி மரத்தின் கிளைகளில் ஏறி இருந்து நீர் எப்போதும்
