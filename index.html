*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Tamil",system-ui,sans-serif}

.tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:.8rem;color:#fff;font-weight:600}
.Verified{background:var(--ok)}.Partially{background:var(--warn)}.Incorrect{background:var(--bad)}.Unverified{background:var(--un)}.Disputed{background:var(--dis)}
input,select,textarea,button.act{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--ink);margin:4px 0 10px}
button.act{background:var(--pri);color:#fff;cursor:pointer;border:0}
label{font-weight:600;font-size:.9rem}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
.tbl{overflow-x:auto}.mut{color:var(--mut);font-size:.85rem}.warn{color:var(--bad);font-weight:600}
.ref{max-height:240px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:8px;background:var(--bg)}

<script>

const RAW=[["SANG-1-3", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “துறை : அறத்தொடு நிற்றல்- திணை : குறிஞ்சித்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “துறை : அறத்தொடு நிற்றல்- திணை : குறிஞ்சித்” (section 1.3).", "தினை அன்னாய், வாழி! வேண்டு, அன்னை! ஒள்நுதல், ஒலி மென்கூந்தல், என்தோழி மேனி விறல் இழை நெகிழ்த்த வீவு அருங்கடு நோய் அகலுள் ஆங்கண் அறியுநர் வினாயும், பரவியும், தொழுதும், விரவு மலர்தூயும் வேறுபல் உருவின் கடவுள் பேணி, நறையும் விரையும் ஓச்சியும், அலவுற்று, எய்யா மையலை நீயும் வருந்துதி தாயே! நீ வாழ்வாயாக! நான் கூறுவதை விருப்பமுடன் கேட்க வேண்டும். தாயே! ஒளிமிக்க நெற்றியினையும் நீண்டு செறிந்து வளர்ந்த மென்மையான தலை முடியினையும் உடைய என் தோழியின் உடலில் அணிந்துள்ள சிறப்பான அணிகலன்கள் நெகிழ்ச்சி அடைந்து விழுந்தது கண்டு இவள் நோயுற்றிருக்கிறாள் என்று நினைத்துப் பெரிய ஊரில் உள்ள குறி கூறுவதில் வல்லவர்களையும், கட்டுவிசிசியையும், வேலனையும் அணுகிச்சென்று என் மகளின் உடல் நோய்கக் hன காரணத்தைக் கூறுங்கள் என்று கூறினாய். அவர்கள் இது தெய்வத்தால் ஏற்பட்டது என்று கூறியதும் இறைவனைப் போற்றி வாழ்த்தியும் வணங்கியும் பலவிதமான மலர்களைத் தூவி வழிபட்டும் நறுமணப் பொருள்களைக் காணிக்கையாகச் செலுத்தியும் அவளுடைய நோய் நீங்காத காரணத்தால் வருத்தமுடன் இருக்கிறாய்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.3, p.16", "", "medium", "false"], ["SANG-1-4", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “தலைவி தோழியிடம் ரகசியம் பகிரல்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “தலைவி தோழியிடம் ரகசியம் பகிரல்” (section 1.4).", "நல்கவின் தொலையவும், நறுந்தோள் நெகிழவும், புள்பிறர் அறியவும், புலம்பு வந்து அலைப்பவும், உள் சுரந்து உறையும் உய்யா அரும் படர் செப்பல் வன்மையின் செறித்து, யான் கடவலின். என் தோழியின் அழகிய உடல் அழகு கெடவும், நறுமணம் மிகுந்த தோள்கள் மெலியவும், அவளுடைய வளையல்கள் கழன்று விழுவதைப் பிறர் பார்க்கவும், தனிமை எண்ணம் தோன்றி அவளை அவ்வப்போது துன்பம் கொள்ளச் செய்யுவுமாகிய இவை எல்லாவற்றிற்கும் காரணமாக இருந்து இவள் உயிரைக் கொல்லச் செய்து கொண்டிருக்கும் நோயினை என்னுடைய சிறந்த சொல் வன்மையினால் அவளின் மனத்தின் வழி நின்று அவள் கூறியதுபோல நான் கூறுகின்றேன்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.4, p.16", "", "medium", "false"], ["SANG-1-5", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “நற்குணம் விலகினால் மீண்டும் திரும்பாது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “நற்குணம் விலகினால் மீண்டும் திரும்பாது” (section 1.5).", "முத்தினும் மணியினும் பொன்னினும், அத்துணை, நேர்வரும் குரைய கலம் கெடின், புணரும், சால்பும் வியப்பும் இயல்பும் குன்றின், மாசு அறக் கழீஇ வயங்கு புகழ் நிறுத்தல் ஆசு அறு காட்சி ஐயர்க்கும், அந்நிலை, எளிய என்னார், தொல் மருங்கு அறிஞர்; முத்து, மாணிக்கக் கற்கள், பொன் ஆகியவற்றைச் சேர்க்க வேண்டிய முறையில் கோர்த்துச் செய்யப்பட்ட அணிகலன் ஏதேனும் ஒரு காரணத்தால் நூல் அறுந்து போனால் அதனை மீண்டும் சிறந்த தொழில் நுட்பக் கலைஞரைக் கொண்டு சீர்படுத்திக் கொள்ளலாம். முன்புபோல அழகுடைய அணிகலனாய் ஆக்கிக் கொள்ளலாம். ஆனால் சாந்றாண்மையும், பெருமையும், நல்லொழுக்கமும் ஏதேனும் ஒரு காரணத்தால் வாழ்நாளில் கெட்டுவிடுமானால் அதனால் ஏற்பட்ட குற்றத்தை நீக்கி மீண்டும் அவ்வுயர்வினைப் பெறுதல் மன மயக்கங்களை நீக்கித் துறவு வழி நிற்கும் தலைமைப் பண்புடைய முனிவர்களுக்கும் இயலாத செயலாகும் என்று அறிஞர்கள் கூறுவார்கள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.5, p.17", "", "medium", "false"], ["SANG-1-6", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “தலைவி தன் தாயிடம் காதலைத் தெரிவிக்க நினைத்தல்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “தலைவி தன் தாயிடம் காதலைத் தெரிவிக்க நினைத்தல்” (section 1.6).", "மாதரும் மடனும் ஓராங்குத் தணப்ப, இருவேம் ஆய்ந்த மன்றல் இது என, நாம் அறிவுறாலின் பழியும் உண்டோ? ஆற்றின் வாரார் ஆயினும், ஆற்ற ஏனை உலகத்தும் இயைவதால், நமக்கு என நீங்கள் பொருத்தமானவருக்கு மணம் செய்து கொடுப்போம் எனத் தலைவி மீது கொண்டிருந்த காதலும் எம்முடைய மடமைக் குணமும் நீங்கிச் செல்ல நீண்ட தேரினை உடையவரான தந்தையின் கடப்பதற்கு அரிதான காவலைக் கடந்து சென்று நானும் தலைவனும் செய்துகொண்ட காதல் மணம் இது. நாமே இதனைக் தாய்க்குக் கூறினால் புகழ் அல்லாமல் பழியும் வரும். அவ்வாறு கூறிய பின்பு அவர்கள் நம் வழிக்கு வராவிட்டாலும் எம்முடைய உயிர் நீங்கும் காலம் வரை காத்திருப்போம். அவ்வாறு காத்திருந்தால் இப்பிறவியில் இல்லை எனினும் அடுத்துவரும் பிறிவியிலாவது அவனோடு சேரும் காலம் வருவது உறுதி என்று கூறி.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.6, p.17", "", "medium", "false"], ["SANG-1-7", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “தலைவியின் காதல் நோய்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “தலைவியின் காதல் நோய்” (section 1.7).", "மான்அமர் நோக்கம் கலந்கி, கையற்று, ஆனாச்சிறுமையள் இவளும் தேம்பும் மான்கள் விரும்புவதற்குக் காரணமான அழகினை உடைய அவள் விழிகள் கலங்கி நிற்கவும் ஏதும் செய்ய இயலாதவளாகப் பொறுக்க இயலாத காதல் நோயுடன் மெலிந்து வாடுகின்றாள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.7, p.18", "", "easy", "false"], ["SANG-1-8", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “தோழியின் நிலை” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “தோழியின் நிலை” (section 1.8).", "இகல் மீக்கடவும் இருபெரு வேந்தர் வினையிடை நின்ற சான்றோர் போல, இருபேர் அச்சமோடு யானும் ஆற்றலென்; பகைகொண்டு போருக்குத் தயாராக இருக்கும் இரண்டு மன்னர்களுக்கு இடையே தூது சென்று அவர்களின் பகையை நீக்கும் சான்றோர்களைப் போல, தாயே! உனக்கும் காதல் நோயால் மெலிந்து கொண்டிருக்கும் தலைவியின் காதலுக்கும் இடையே பெரிதும் அச்சம் கொண்டு நானும் வருந்தியிருக்கிறேன்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.8, p.18", "", "easy", "false"], ["SANG-1-9", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “குடும்பத்தை ஒத்திட்டுப் பார்க்காத கூடல் மணம்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “குடும்பத்தை ஒத்திட்டுப் பார்க்காத கூடல் மணம்” (section 1.9).", "கொடுப்பின் நன்கு உடைமையும், குடிநிரல் உடைமையும், வண்ணமும், துணையும், பொரீஇ எண்ணாது, எமியேம் துணிந்த ஏமம் சால் அருவினை நிகழ்ந்த வண்ணம் நீ நனி உணரச் செப்பல் ஆன்றிசின்; சினவாதீமோ! தலைவன் ஒருவனுக்குத் தங்கள் பெண்ணைத் திருமணம் செய்து கொடுக்க நினைப்பவர்கள் திருமணம் செய்து கொடு;த்தால் நன்மை இருக்குமா என்பதை எல்லாம் நன்றாக ஆராய்ந்து அறிந்து தலைவனின் குணநலன்களையும் அவனுடைய உறவினர்களின் குணம் மற்றும் தகுதிகளையும் தலைவியின் குணநலன்களோடு ஒப்பிட்டுப் பார்ப்பார்கள். உங்கள் துணை இல்லாமல் நாங்களாகவே ஏற்றுக் கொண்ட இக்கறவுத் திருமணம் முன்பே நிகழ்ந்து முடிந்தமையை நீ நன்றாக உணர்ந்து கொள்ளும் பொருட்டு நான் கூறுகிறேன். அதனைக் கேட்டு நீ என்மேல் கோபம் கொள்ளக் கூடாது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.9, p.18", "", "medium", "false"], ["SANG-1-10", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “தினைப்புனம் காத்;தல்;” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “தினைப்புனம் காத்;தல்;” (section 1.10).", "“நெல்கொள் நெடு வெதிர்க்கு அணந்த யானை, முத்துஆர் மருப்பின் இறங்குகை கடுப்ப, துய்த்தலை வாங்கிய புனிறுதீர் பெருங்குரல் நல்கோள் சிறு திணைப் படு புள் ஓப்பி, எல்பட வருதியர்” என, நீ விடுத்தலின், நெல்லைத் தன்னிடத்தே கொண்டு விளங்கும் உயர்ந்து வளர்ந்த மூங்கிலைத் தின்பதற்கு மேலே பார்த்தவாறு நின்ற ஆண்யானை அவ்வேதனையைத் தீர்க்கும் பொருட்டு முத்துகள் நிறைந்திருக்கும் தன் கொம்பின் வழியாக இறங்கும் வளைவான தும்பிக்கையினைப் போன்று வறைந்த பெரிய கதிர்களைத் தன்னகத்தே கொண்டிருக்கின்ற தினைப் பயிரில் வந்து தினைக் கதிர் கவர்ந்து செல்லும் பறவைகளை விரட்டிவிட்டுச் சூரியன் மறையும் பொழுதில் வருக என்று நீ கூறியதால் நாங்களும் தினைப்புனம் சென்று…", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.10, p.18", "", "medium", "false"], ["SANG-1-11", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “தினைப்புனக் காவல் : பறவை ஓட்டும் இசைக் கருவிகள்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “தினைப்புனக் காவல் : பறவை ஓட்டும் இசைக் கருவிகள்” (section 1.11).", "கலிகெழு மரமிசைச் சேணோன் இழைத்த புலி அஞ்சு இதணம் ஏறி, அவண, சாரல் சூரல் தகை பெற வலந்த, தழலும் தட்டையும் குளிரும், பிறவும், கிளி கடி மரபின, ஊழ் ஊழ் வாங்கி, உரவுக் கதிர்தெறூஉம் உருப்பு அவிர் அமயத்து பறவைகளின் ஒலி மிகுந்து ஒலிக்கும் மரத்தின் உச்சியில் மலை நாடன் செய்ததும் புலியும் அச்சம் கொள்வதற்குக் காரணமாகிய பரணில் ஏறி அமர்ந ; ;து கொண்டு அந்த மலைச் சரிவுகளில் உள்ள குரல் பிரம்பினால் பின்னிய தழல், தட்டை, குளிர் ஆகிய கருவிகளையும் இவை போன்ற இன்ன பலவற்றையும் கொண்டு கிளிகளை விரட்டும் தொழிலைச் செம்மையாகச் செய்து கொண்டிருந்த சூரியன் காயும் மதியப் பொழுதில்,", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.11, p.19", "", "medium", "false"], ["SANG-1-12", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “பெருமழை” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “பெருமழை” (section 1.12).", "விசும்பு ஆடு பறவை வீழ் பதிப்படர, நிறை இரும் பௌவம் குறைபட முகந்து கொண்டு, அகல்இரு வானத்து வீசு வளி கலாவலின், முரசு அதிர்ந்தன்ன இன்குரல் ஏற்றொடு, நிரைசெலல் நிவப்பின் கொண்மூ மயங்கி, இன் இசை முரசின், சுடர்ப் பணூண், சேஎய் ஒன்னார்க்கு ஏந்திய இலங்கு இலை எஃகின், மின்மயங்கு கருவிய கல்மிசைப் பொழிந்தென, வானில் பறந்து கொண்டிருந்த பறவைகள் எல்லாம் தாங்கள் விருப்பமுடன் தங்கும் கூட்டிற்குச் சென்று அடங்குமாறு நீர் நிறைந்திருக்கின்ற கருமையான கடல் தன் அளவில் குறையுமாறு நீரைக் கவர்ந்து கொண்டு பரந்த ஆகாயத்தில் பரவி, காற்று வீசுவதனால் முரசு போன்று இனிய ஓசையுடன் இடி இடித்து வரிசையாகச் செல்லும் இயல்புடைய மேகம் இனிமையான ஓசை உடைய முரசினையும் தன் பகைவர்களைக் கொல்லும் பொருட்டு முருகப் பெருமான் ஏந்திய வேலின் ஒளியினையும் போல இடி இடித்து மின்னல் மின்னி மலையின்மேல் மழை பொழிந்தது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.12, p.19", "", "medium", "false"], ["SANG-1-13", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “அருவியில் நீராடல்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “அருவியில் நீராடல்” (section 1.13).", "அண்ணல் நெடுங் கோட்டு இழிதரு தௌ;நீர், அவிர் துகில் புரையும், அவ் வெள் அருவி, தவிர்வு இல் வேட்கையேம் தண்டாது ஆடி, பளிங்கு சொரிவு அன்ன பாய் சுனை குடைவுழி, நளிபடு சிலம்பில், பாய் அம்பு அடி, பொன் எறி மணியின்சிறு புறம் தாழ்ந்த எம் பின் இருங் கூந்தல் பிழிவனம் துவரி, உள்ளகம் சிவந்த கண்ணேம், தலைவனுடைய மலை நாட்டு மலையின் உச்சியில் இருந்து குதித்துவரும் தெளிவான நீரினை உடைய வெண்மையான துகில் போன்ற வெண்மை நிறமான அருவியில் நீராடுவதில் நீங்காத விருப்பம் கொண்டு ஓய்வு இல்லாமல் விளையாடினோம். பளிங்கினைக் கரைத்து ஊற்றியது போன்று நீர் நிறைந்த சுனையில் குடைந்து குடைந்து ஆடும்பொழுது எங்கள் மனம் விரும்பியபடி பாடிக்கொண்டிருந்தோம். தங்கத்தில் அழுத்தப்பட்ட நீல நிற வயிரக்கல் போன்ற சிறிய முதுகில் தாழ்ந்து கிடந்த எம்முடைய பின்னி முடிக்கப்பட்ட கூந்தலை ஈரம் காயப் பிழிந்து காய வைத்தோம். தொடர்ந்து நீராடியதனால் செம்மை நிறமான கண்களை உடையவர்கள் ஆனோம்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.13, p.20", "", "medium", "false"], ["SANG-1-14", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “குறிஞ்சித் திணைப் பூக்கள் : தொண்ணூற்றொன்பது வகை” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “குறிஞ்சித் திணைப் பூக்கள் : தொண்ணூற்றொன்பது வகை” (section 1.14).", "மலர்கள் ………… வள் இதழ் ஒண்செங் காந்தள், ஆம்பல், அனிச்சம், தண் கயக்குவளை, குறிஞ்சி. வெட்சி, செங் கொடுவேரி, தேமா, மணிச்சிகை, உரிது நாறு அவிழ் தொத்து உந்தூழ், கூவிளம், எரி புரை எறுழம், சுள்ளி, கூவிரம், வடவனம், வாகை, வான்பூங் குடசம், எருவை, செருவிளை, மணிப் பூங் கருவிளை, பயினி, வானி, பல் இணர்க் குரவம், பசும்பிடி, வகுளம், பல்இணர்க் காயா, விரி மலர் ஆவிரை, வேரல், சூரல், குரீஇப் பூளை, குறுநறுங் கண்ணி, குருகிலை, மருதம், விரி பூங் கோங்கம், போங்கம், த University DDE), Unit 1, section 1.15, p.22", "", "medium", "false"], ["SANG-1-16", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “தலைவனின் வருகையும், அவனின் அழகும்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “தலைவனின் வருகையும், அவனின் அழகும்” (section 1.16).", "எண்ணெய் நீவிய, சுரி வளர் நறுங் காழ், தண்நறுங் தகரம் கமழ மண்ணி, ஈரம் புலர விரல் உளர்ப்பு அவிழா, காழ் அகில்அம் புகை கொளீஇ, யாழ் இசை அணி மிகு வரி மிஞிறு ஆர்ப்ப, தேம் கலந்து மணிநிறம் கொண்ட மா இருங் குஞ்சியின், மலையவும் நிலத்தவும் சினையவும் சுனையவும் வண்ண வண்ணத்த மலர் ஆய்பு விரைஇய தண்நறுந் தொடையல், வெண்போழ்க் கண்ணி, நலம்பெறு சென்னி, நாம் உற மிலைச்சி, பலமுறை எண்ணெ; பூசப்பட்டதால் நன்றாக வளர்ந்து சுருண்டு கருமை நிறமோடு விளங்கும். முடியில் குளிர்சச் pயான மயிர்ச் சந்தனத்தை மணம் வீசுமாறு பூசிக் குளித்து அதன் ஈரம் உலருமாறு கைகளால் கோதிச் சிக்கு எடுத்து, வயிரம் பாய்ந்த அகிலை நெருப்பில் இட்டுப் புகைத்து முடியை உலர்த்துவதனால் அங்கிருக்கும் வண்டுகள் பறந்து ஆரவாரம் செய்ய, அகிலின் புகையைப் பெற்று நீல வயிரக் கல்லின் நிறமுடைய கருமையான தலைமுடியின்மேல் மலை, நிலம், கொம்புகள், சுனைகள் ஆகிய இடங்களில் பூத்த பலவிதமான மலர்களை ஆராய்ந்து தேர்ந்தெடுத்துக் கட்டிய மாலையினையும் வெண்மை நிறமுடைய தாழையின் மடலால் கட்டப்பட்ட மாலையினையும் இவன் முருகனோ என்று காண்பவர்கள் அச்சம் கொள்ளுமாறு சூடிக் கொண்டு,,, பைங் கால் பித்திகத்து ஆய் இதழ் அலரி அம் தொடை ஒரு காழ் வளைஇ, செந் தீ ஒண்பூம் பிண்டி ஒரு காது செரீஇ, அம்தளிர்க் குவவு மொய்ம்பு அலைப்ப, சாந்து அருந்தி, மைந்து இறை கொண்டு, மலர்ந்து ஏந்து அகலத்து, தொன்று படு நறுந் தார் பூணொடு பொலிய, பசுமையான காம்புடைய பிச்சிப்பூவின் சிறிய இதழ்களை உடைய பூக்களால் கட்டப்பட்;ட மாலை ஒன்றைத் தலைமுடியில் சுற்றிச் சிவந்த பொருப்பினைப் போன்ற வெண்மையான பூக்களை உடைய அசோகமரத்தின் அழகிய இளம்தளிரை ஒரு காதில் செருகிக் கொண்டு அத்தளிர் தோளில் கிடந்து புரண்டு கொண்டிருக்க சந்தனம் பூசிய அகன்ற மார்பில் வழக்கமாக அணியும் மாலையை அணிகலன்களோடு சேர்த்து அணிந்துகொண்டு அழகுபெற்ற உருவத்துடன். செம் பொறிக்கு ஏற்ற, வீங்கு இறைத் தடக் கையின் வண்ண வரி வில் ஏந்தி, அம்பு தெரிந்து, நுண் வினைக் கச்சைத் தயக்கு அறக் கட்டி இயல் அணிப் பொலிந்த ஈகை வான் கழல் துயல் வரும் தோறும் திருந்து அடிக் கலாவ முனை பாழ் படுக்கும் துன் அருந் துப்பின் சிறந்த தொழில் நுணுக்கத்தோடு செய்யப்பட்டு கோடுகள் உடைய பூண் என்னும் அணிகலன் இறுகிக் காணப்படும் முன் கையை உடைய பெரிய கையில் வண்ணம் பொருந்திய வில்லையும் ஆராய்ந்து தெரிந்தெடுக்க நல்ல அம்புகளையும் பிடித்துக்கொண்டு, தொழிலால் சிறந்த சோலையினை அழகுறத் தன் இடையில் கட்டிக் கொண்டு இயற்கையான அழகுடன் பாதம் வைத்து நடக்கும்போது காலில் அணிந்துள்ள வீரக்கழல் உயர்ந்தும் தாழ்ந்தும் அசைந்து கொண்டிருக்க…", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.16, p.23", "", "hard", "false"], ["SANG-1-17", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “வேட்டை நாய்களின் தோற்றம்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “வேட்டை நாய்களின் தோற்றம்” (section 1.17).", "பகை புறம் கண்ட பல் வேல் இளைஞரின் உரவுச்சினம் செருக்கி, துன்னுதொறும் வெகுளும், முளை வாள் எயிற்ற, வள் உகிர், ஞமலி திளையாக் கண்ண வளைகுபு நெரிதர, பகைவர்களின் சாட்டைப் பாழ்படுத்தும் கிடைப்பதற்கு அரிதான போர்த்திறம் உடையவனும் பகை கொண்டவர்களைப் புறமுதுகு இட்டு ஓடச் செய்த பல வேல்களைக் கொண்டிருக்கும் இளைமையான போர் வீரனைப் போன்று அதிகரிக்கின்ற கோபத்தினால் செருக்குக் கொண்டு அவனை நெருங்கிச் செல்கின்ற போதெல்லாம் கோபம் கொள்ளும் இயல்புடைய வெண்மையான பற்களும் கூர்மையான நகங்களையும் உடைய நாய்கள் கண்களை இமைக்காமல் எங்களைச் சூழ்ந்துக் கொண்டு நெருங்கி வந்தமையினால்…", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.17, p.24", "", "medium", "false"], ["SANG-1-18", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “தலைவனின் வருத்தம்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “தலைவனின் வருத்தம்” (section 1.18).", "நடுங்குவனம் எழுந்து, நல் அடி தளர்ந்து, யாம் இடும்பை கூர் மனத்தேம் மருண்டு புல் படர மாறு பொருது ஓட்டிய புகல்வின் வேறு புலத்து ஆகாண் விடையின், அணி பெற வந்து எம் அலமரல், ஆயிடை, வெரூஉதல் அஞ்சி, மெல்லிய இனிய மேவரக் கிளந்து, எம் ஐம்பால் ஆய் கவின் ஏத்தி, “ஒண்தொடி அசை மென் சாயல், அவ்வாங்கு உந்தி, மட மதர் மழைக் கண், இளையீர!; இறந்த கெடுதியும் உடையேன்” என்றனன் அதன் எதிர் நாய்கள் அருகே வந்ததைக் கண்டு நாங்கள் மிகுதியான அச்சம் கொண்டு நடுங்கி அமர்ந்திருந்த இடத்தை விட்டு எழுந்து வேகமாகச் செல்ல இயலாதவாறு நடை தடுமாற்pய காரணத்தால் துன்பம் மிகுந்த மனம் கொண்டவர்களாக மயக்கம் கொண்டு வேறு இடம் நோக்கி அகலவும், தனக்குப் பகையான காளைகளை எல்லாம் வென்று மனச் செருக்குடன் திகழ்ந்த காளை வேறு நிலத்திற்குச் சென்று அங்கு பசு ஒன்றைக் கண்டு நின்றதுபோல எங்களை நெருங்கி வந்து நாங்கள் அச்சம் கொண்டதைப் பார்த்துத் தானும் அச்சம் கொண்டவனாக மென்மையும் இனிமையும் நிறைந்த சொற்களால் எங்கள் பயத்தைத் தெளிவித்து ஐந்தாகப் பின்னி முடிக்கப்பட்ட அழகான கூந்தலைப் பார்த்துப் பாராட்டினான். ஒளிமிக்க வளையலையும் அசைந்து நடக்கும் மென்மையான சாயலையும் அழகியதாய்ச் சுழித்து வளைந்திருக்கும் கொப்பூழினையும் குளுமையான கண்களையும் உடைய பெண்களே! நான் இங்கு வந்தமைக்கு இழப்புகள் பல உண்டு என்று கூறினான். நாங்கள் அவனுடைய மொழிக்குப் பதில் கூறாததனால் மிக்க வருத்தம் கொண்டான்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.18, p.25", "", "medium", "false"], ["SANG-1-19", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “தலைவனின் பேச்சு” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “தலைவனின் பேச்சு” (section 1.19).", "சொல்லேம் ஆதலின், அல்லாந்து “கலங்கிக் கெடுதியும் விடீஇர் ஆயின், எம்மொடு சொல்லலும் பழியோ, மெல் இயலீர்?” என, நைவளம் பழுநிய பாலை வல்லோன் கைகவர் நரம்பின், இம்மென இமிரும் மாதர் வண்டொடு, சுரும்பு நயந்து இறுத்த, தாது அவிழ் அலரித் தா சினை பிளந்து, தாறு அடு களிற்றின் வீறு பெற ஓச்சி, கல்லென் சுற்றக் கடுங் குரல் அவித்து, எம் சொல்லல் பாணி நின்றனன் ஆக அவன் ஏமாற்றத்தினால் மன வருத்தம கொண்டு எங்களை நோக்கி உயர்ந்த சாயலை உடைய பெண்களே! நான் இழந்த விலங்குகளை நீங்கள் காட்டிக் கொடுக்கவில்லை என்றாலூம் பராவயில்லை. என்னோடு பேசினால் என்ன? பழி வந்து விடுமா என்று கூறி, நட்ட ராகத்தில் அமைந்த பாடலைப் பாலை யாழ் கொண்டு இசைக்கும் இசைக் கலைஞன் கையில் பட்ட நரம்பினைப் போல ஆண் வண்டும் பெண் வண்டும் ஒலி எழுப்பிக் கொண்டு புணர்ச்சியாகிய சேர்க்கையை விரும்பிப் பறந்து செல்ல அவன் அங்கிருந்த கொம்பு ஒன்றை ஒடித்து ஓசை மிகக் குலைத்துக் கொண்டிருந்த நாய்களின் வலிமையான ஒலியை மாற்றி அமைதிப்படுத்தி எங்களின் பதிலுக்காகக் காத்து நின்றான்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.19, p.26", "", "medium", "false"], ["SANG-1-20", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “யானையின் வருகை” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “யானையின் வருகை” (section 1.20).", "இருவி வேய்ந்த குறுங் காற் குரம்பை, பினை ஏர் நோக்கின் மனையோள் மடுப்ப, தேம் பிழி தேறல் மாந்தி, மகிழ் சிறந்து, சேமம் மடிந்த பொழுதின், வாய்மடுத்து. இரும் புனம் நிழத்தலின், சிறுமை நோனாது, அரவு உறழி, அம் சிலை கொளீஇ, நோய் மிக்கு, உரவுச் சின முன்பால் உடல் சினம் செருக்கி, கணைவிடு(பு), புடையூ கானம் கல்லென, மடி விடு வீளையர் வெடி படுத்து எதிர, தினைகள் களைந்த தாளில்வேயப்பட்ட சிறிய கால்களை உடைய குடிசை வீட்டில் வாழ்கின்ற மானின் பார்வையினை உடைய மனைவி கொடுக்கத் தேனாகச் செய்யப்பட்;ட கள்ளினைப் பருகி மகிழ்சச ; p நிறைந்த மனத்துடன் காவல் செய்பவன் தன்னுடைய தொழிலை மறந்திருந்தபோது, யானை தன் தும்பிக்கையினால் தினைகளை உருவி அழித்துவிடுவதனால் எஞ்சிய தினையின் அளவு கண்டு மன வருத்தம் கொண்டு பாம்பினைப் போன்ற அழகுடைய வில்லை எடுத்து அதில் நாண் ஏற்றி யானை பயிரை அழித்த வருத்தத்தின் மிகுதியினால் உடலில் கோபத்தின் மெய்பாடு தோன்ற அதனால் மயக்கம் கொண்டு அம்பினை எய்து தட்டை முதலிய கருவிகளைக் கொண்டு அவன் துரத்துக் காடெல்லாம் ஓசை பெருகுமாறு வாயைக் குவித்து சீழ்க்கை ஓசை எழுப்பி யானையைத் துரத்துவதனால்…", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.20, p.26", "", "medium", "false"], ["SANG-1-21", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “யானையால் வந்த துயரம்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “யானையால் வந்த துயரம்” (section 1.21).", "கார்ப் பெயல் உருமின் பிளிறி, சீர்த் தக இரும் பிணர்த் தடக் கை இரு நிலம் சேர்த்தி, சினம் திகழ் கடாஅம் செருக்கி, மரம் கொல்பு, மையல் வேழம், மடங்கலின், எதிர்தர, உய்வு இடம் அறியேம் ஆகி, ஒய்யென, திருந்து கோல் எல் வளை தெழிப்ப, நாணு மறந்து, விதுப்புறு மனத்தேம், விரைந்து அவற் பொருந்தி, சூர்உறு மஞ்ஞையின் நடுங்க….. கார் கால மழை பெய்யும் போது இடிக்கும் இடிபோலப் பிளிறி வரிகள் உடைய பெரிய தும்பிக்கையைத் தூக்கிப் பெரிய நிலத்தில் அறைந்து கோபம் கொள்ளக் காரணமாகிய மதத்தால் செருக் கடைந்து வருகின்ற வழியல் மரங்களை உடைத்து எதிர்ப்பட்ட ஆண்யானை, இயமன் போன்று எங்களை நோக்கி வந்தபோது அதனை விடுத்து உயிர் பிழைப்பதற்கான வழியை எவ்வகையிலும் நாங்கள் அறியாமல் கையில் அணிந்த வளையல்கள் ஒலி எழுப்ப நாணத்தை மறந்தவர்களாய் அச்சம் கொண்ட மனத்தோடு வேகமாகச் சென்று அவனை நெருங்கி நின்று நடுங்கினோம்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.21, p.27", "", "medium", "false"], ["SANG-1-22", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “உயிர் காத்தான் தலைவன்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “உயிர் காத்தான் தலைவன்” (section 1.22).", "……………………. வார் கோல் உடுஉறும் பகழி வாங்கி, கடு விசை, அண்ணல் யானை அணி முகத்து அழுத்தலின், புண் உமிழ் குருதி முகம் பாய்ந்து இழிதர, புள்ளி வரி நுதல் சிதைய, நில்லாது, அயர்ந்து புறங்கொடுத்த பின்னர் ……. அவன் உடனடியாக நீண்ட கோலில் நாண் கட்டப்பட்டு வில்லில் அம்பு சேர்த்து அதனை வலிமையாக இழுத்து வேகமாகச் செல்லுமாறு ஏவியவுடன் அந்த அம்பு யானையின் அழகு பொருந்திய முகத்தில் தைத்தது. அதனால் யானையின் முகத்தில் இரத்தம் பெருகி அதன் முகத்தில் வழிந்தது. கோடுகளையும் புள்ளிகளையும் உடைய அழகு மறைந்து அந்த யானை அங்கு நிற்காமல் ஓடிய பின்பு…", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.22, p.27", "", "medium", "false"], ["SANG-1-23", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “தலைவனின் உறுதிச் சொல்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “தலைவனின் உறுதிச் சொல்” (section 1.23).", "……………………………..நெடு வேள் அணங்கு உறு மகளிர் ஆடுகளம் கடுப்ப, திணி நிலைக் கடம்பின் திரள் அரை வளைஇய துணை அறை மாலையின், கை பிணி விடேஎம், நுரையுடைக் கலுழி பாய்தலின், உரவுத் திரை அடும் கரை வாழையின் நடுங்க, பெருந்தகை “அம் சில் ஓதி! அசையல்; யாவதும் அஞ்சல், ஓம்பு; நின் அணி நலம் நுகர்கு” என மாசு அறு சுடர் நுதல் நீவி, நீடு நினைந்து, என் முகம் நோக்கி நக்கனன், யானை ஓடியதும் அந்த இடம் முருக கடவுளுக்குத் தெய்வம் தீண்டித் துன்பமுற்ற பெண்கள் அத்துன்பம் தீரும் பொருட்டு ஆடு வெட்ட பலிகொடுத்து வெறியாட்டு நடத்திய இடம்போல இருந்தது. அங்கு நிற்கும் கடம்ப மரத்தின் அடிப்பகுதியை வளைத்துச் சூடப்பட்ட பெண்களுக்கு ஒப்புமை கூறும் மலர்மாலை போல நாங்கள் அவனைக் கட்டி அணைத்துக் கொண்ட கைகளை விடாதவர்களாக வெள்ளம் பெருக்கெடுக்கும் ஆற்றின் கரையில் நிற்கும் வாழை மரம்போல் நடுங்கினோம். அவ்போது நிறைந்த குணமுள்ள தலைவன் அழகிய கூந்தலை உடைய பெண்ணே! நடுக்கம் வேண்டாம். எதற்காகவும் அச்சம் கொள்ள வேண்டாம். நான் உன் அழகினை எனாக்கிக் கொள்வேன் என்று கூறி ஒளியுடைய தலைவியின் நெற்றியை விரல்களால் துடைத்து நீண்ட சிந்தனைக்குப் பின்பு என் முகத்தை நோக்கிப் புன்னகை செய்தான்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.23, p.28", "", "medium", "false"], ["SANG-1-24", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “தலைவியின் நாணம்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “தலைவியின் நாணம்” (section 1.24).", "……………………………. அந்நிலை, நாணும் உட்கும் நண்ணுவழி அடைதர, ஒய்யெனப் பிரியவும் விடாஅன், கவைஇ ஆகம் அடைய முயங்கலின், ………… தலைவனால் தலைவி தீண்டப்பட்ட நிலையில் தலைவிக்கும் நாணம், அச்சம், மடம் முதலான குணங்கள் தோன்றியதனால் அவனைவிட்டு விரைவாகத் தழுவிய கைகளை விலக்க முயன்றாள். ஆனால் அவன் அவளை விடாமல் தன் கையால் அணைத்துக் கொண்டு அவள் மார்பு அவன் மார்பில் இணையுமாறு தழுவினான்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.24, p.28", "", "easy", "false"], ["SANG-1-25", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “தலைவனின் மரை நாட்டின் வளம்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “தலைவனின் மரை நாட்டின் வளம்” (section 1.25).", "………………………… அவ்வழி, பழு மிளகு உக்க பாறை நெடுஞ் சுனை, முழு முதற் கொக்கின் தீம் கனி உதிர்ந்தென, புள் எறி பிரசமொடு ஈண்டி, பலவின் நெகிழ்ந்து உகு நறும் பழம் விளைந்த தேறல், நீர் செத்து அயின்ற தோகை, வியல் ஊர்ச் சாறு கொள் ஆங்கண் விழவுக் களம் நந்தி, அரிக் கூட்டு இன் இயம் கறங்க, ஆடு மகள் கயிறு ஊர் பாணியின் தளரும் சாரல், வரைஅர மகளிரின் சாஅய், விழைதக, விண் பொரும் சென்னிக் கினைஇய காந்தள் தண் கமழ் அலரி தாஅய், நன் பல வம்பு விரி களத்தின் கவின் பெறப் பொலிந்த குன்று கெழு நாடன், ……………………. அப்பொழுது பழுத்துக் கனிந்த மிளகுகள் உதிர்ந்து கிடந்த பாறையில் உள்ள நீண்ட சுனையில் பெரிய அடியினை உடைய மா மரத்திலிருந்து மாங்கனி உதிர அக்கனியின் சாறும், வண்டுகள் சிதறித் துளிர்த் தேனும், பலாக்கனி கனித்து துளிர்த்த தேனும் கலந்து இருந்த தெளிவான தேனை நீர் என்று நினத்து உண்ட மயிலானது, விழா நடக்கும் இடத்தில் கயிற்றில் ஏறி ஆடுகின்றவள் தாளம் தவற ஆடித் தளர்வது போலத் தளர்கின்ற மலைச் சாரலையும், வரையர மகளிர் ஆடுவதனால் தம்முடைய எழில் சிறிது குறைய மலைச் சிகரங்களில் மலர்ந்திருந்த செங்காந்தள் மலர்கள் விழா நடக்கும் இடங்களில் பல கச்சு அணிகளை வரித்திருந்ததுபோல உதிர்ந்து கிடக்கும் மலை நாட்டை உடைய தலைவன்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.25, p.29", "", "medium", "false"], ["SANG-1-26", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “மணம் கொள்வோம் என்று தலைவன் கூறியமை” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “மணம் கொள்வோம் என்று தலைவன் கூறியமை” (section 1.26).", "……………. எம் விழைதரு பெரு விறல் உள்ளத் தன்மை உள்ளினன் கொண்டு, “சாறு அயர்ந்தன்ன, மிடாஅச் சொன்றி வருநர்;க்கு வரையா, வள நகர் பொற்ப, மலரத் திறந்த வாயில் பலர் உண, பைந் நினம் ஒழுகிய நெய்ம் மலி அடிசில் வசைஇல் வான் திணைப் புரையோர் கடும்பொடு விருந்து உண்டு எஞ்சிய மிச்சில், பெருந்தகை, நின்னோடு உண்டலும் புரைவது” என்று, ஆங்கு அறம் புணை ஆகத் தேற்றி, ……………… எம்மை எப்போதும் விரும்புகின்ற பெரிய வெற்றியை உடையவன் தலைவியை அணைத்துக் கொண்டபோது இவளுடைய மனம் துள்ளியதனை நினைத்து இவளைத் திருமணம் செய்து கொண்டு இல்லறம் நடத்துவதை நினைத்தான். பலரும் வந்து விருந்து உண்டு மகிழவும் திறந்து கிடக்கும் வாயிலை உடைய செல்வ வளம் நிறைந்திருக்கும் இல்லத்தில் இருந்து வருகின்ற அனைவருக்கும் இல்லை என்று கூறாமல் கொடுத்து திருவிழாப்போலக் கொண்டாடும் செல்வம் நிறைந்த வீடு சிறப்படையும்படியாக நெய் வழியும் சோற்றை நீ வழங்குவதனால் உயர்ந்தோர்கள் தங்கள் உறவுகளுடன் இருந்து உண்ண, விருந்திட்டது போக எஞ்சியிருக்கின்ற உணவினை நீ வழங்க நான் உண்ணுவது உயர்ந்ததாகும் என்று தலைவியிடம் கூறி இல்;வாழ்வு நம்மைச் சேர்த்து வைக்கும் என்று கூறினான்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.26, p.29", "", "medium", "false"], ["SANG-1-27", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “யானை தரு புணர்ச்சி” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “யானை தரு புணர்ச்சி” (section 1.27).", "………………………………பிறங்கு மலை மீமிசைக் கடவுள் வாழ்த்தி, கைதொழுது, ஏமுறு வஞ்சினம் வாய்மையின் தேற்றி, அம் தீம் தௌ; நீர் குடித்தலின், நெஞ்சு அமர்ந்து, அருவிடர் அமைந்த களிறு தரு புணர்சச ; p, வான்உரி உறையுள் வயங்கியோர் அவாவும் பூ மலி சோலை, அப் பகல் கழிப்பி, உயர்ந்த மலைமீது வாழ்கின்ற முருக கடவுளை வாழ்த்தி அவன் இருக்கின்ற திசையை நோக்கி கரம் குவித்துத் தலைவி இன்பமடையக் காரணமாகிய உறுதி மொழிகளைக் கூறி அவளுக்குத் தெளிவினை ஏற்படுத்தி மலையில் இருக்கின்ற தெளிவான அருவி நீரை அவன் குடித்து இவளுடைய மனம் அவனுடைய உறுதி மொழியில் ஒன்றுபட்ட அருமைத் தன்மை உடைய காட்டில் ஆண் யானையினால் நிகழ்ந்த உறவினை வானுலகில் உள்ள தேவர்களும் தாங்கள் வாழும் உலகை வெறுத்து இன்பம் பெற நினைப்பதாகிய பூக்கள் நிறைந்து பூத்திருக்கும் சோலையில் அன்றைய மீதிப் பொழுதை அவனோடு இருந்து கழித்து…", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.27, p.30", "", "medium", "false"], ["SANG-1-28", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “மாலைக் காட்சி” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “மாலைக் காட்சி” (section 1.28).", "எல்லை செல்ல, ஏழ் ஊர்பு, இறைஞ்சி பல் கதிர் மண்டிலம், கல் சேர்பு மறைய மான் கணம் மரமுதல் தெவிட்ட, ஆன் கணம் கன்று பயிர் குரல மன்று நிறை புகுதர, ஏங்கு வயிர் இசைய கொடு வாய் அன்றில் ஓங்கு இரும் பெண்ணை அக மடல் அகவ, பாம்பு மணி உமிழ, பல் வயின் கோவலர் ஆம்பல் ஆய் இதழ் கூம்பு விட, வள மனைப் பூந் தொடி மகளிர் சுடர் தலைக் கொளுவி, அந்தி அந்தணர் அயர, கானவர் விண்தோய் பணவை மிசை ஞெகிழி பொத்த, வானம் மா மலை வாய் சூழ்பு கறுப்ப, கானம் கல்லென்று இரட்ட, புள்ளினம் ஒலிப்ப, சினைஇய வேந்தன் செல் சமம் கடுப்பத் துணைஇய மாலை துன்னுதல் காணூஉ பகல் பொழுது கடந்து செல்லுமாறு ஏழு குதிரைகள் பூட்டிய தேரைச் செலுத்தி வழி நடத்திய பல கதிர்களைக் கொண்டு விளங்கும் சூரியன் மேற்கு மலையை அடைந்து மறைந்ததனால் மான்களின் கூட்டம் மரத்தடியில் வந்து கூடவும், பசுக்களின் கூட்டம் தம்முடைய கன்றுக் குட்டிகளை அழைக்கும் குரலை உடையனவாகக் கொட்டிலை அடைந்து நிற்கவும், கொம்புக் கருவியின் ஓசை போன்ற குரலினை உடைய அன்றில் பறவை உயர்ந்த பனை மரத்தின் உள்புற மடலில் அமர்ந்து தன் பெண் துணையினை அழைக்கவும், பாம்பு தன்னிடம் உள்ள மாண்pக்கக் கல்லை உமிழ்ந்து வைத்துவிட்டு இரை தேடவும், பல்வேறு இடங்களிலும்; உள்ள ஆயர்கள் இனிய ஆம்பல் குழல் கொண்டு இசையினை இசைக்கவும், அல்லி மலரின் இதழ்கள் விரிந்து மலரவும், செல்வம் நிறைந்த இல்லங்களில் கையில் வளையல் அணிந்துள்ள பெண்கள் விளக்கேற்றி மாலைக் காலக் கடமைகளைச் செய்தனர். அந்தணர்கள் மாலை நேரத்தில் செய்ய வேண்டிய சடங்குகளைச் சொய்தனர். காட்டில் வாழும் கானவர்கள் வானத்தைத் தொடுமாறு அமைத்திருக்கின்ற பரணியில் இருந்து கொண்டு தீக்கடை கோல் கொண்டு நெருப்பைப் பற்ற வைத்து எரிய வைக்கும் மேகங்கள் சூழ்ந்த மலையில் சூழ்ந்து எரியும் நெருப்பைக் கண்டு காட்டில் வாழ்கின்ற பல்வகை விலங்குகளும் ஓசை எழுப்பி ஒன்றை ஒன்று அழைத்தபடி இருக்கவும், பறவைக் கூட்டங்கள் ஒலி எழுப்புவதனால் பகைவர்கள் மேல் கோபம் கொண்ட அரசன் படை எடுத்துச் சென்றதுபோல விரைவாக மாலைப்பொழுது நெருங்கி வருவதைக் கண்டு…", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.28, p.30", "", "hard", "false"], ["SANG-1-29", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “தலைவன் எங்களை ஊர் சேர்த்தான்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “தலைவன் எங்களை ஊர் சேர்த்தான்” (section 1.29).", "“நேர் இறை முன்கை பற்றி, நுமர் தர, நாடு அறி நல் மணம் அயர்கம்; சில் நாள் கலங்கல் ஓம்புமின், இலங்கு இழையீர்!” என, ஈர நல் மொழி தீரக் கூறி, துணை புணர் ஏற்றின், எம்மொடு வந்து துஞ்சா முழவின் மூதூர் வாயில், உண்துறை நிறுத்துப் பெயர்ந்தனன். ஒளி விளங்கும் அணிகலன்களை அணிந்திருக்கும் பெண்களே! உம்முடைய அழகிய முன் கையைப் பிடித்து உன்னுடைய பெற்றோர்களுமன் உறவினர்களும் எனக்குத் தர நாட்டில் உள்ளவர்கள் எல்லாம் அறியுமாறு நடக்கும் நல்ல திருமணத்தினைப் பின்பு நடத்துவோம். அது நடைபெறுவதற்கு இடையில் உள்ள நாட்களில் உன்னுடைய வருத்தத்தைத் தவிர்ப்பாயாக என்று அவனுடைய இனிய சொற்களால் எங்களுடைய துன்பத்ரதப் போக்கி பசுவைக் கூடிய காளை போன்று விலகாமல் எங்களைப் பின் தொடர்ந்து வந்து நம் ஊரின் நுழைவாயில் எல்லையில் உள்ள உண்ணும் நீர்த் துறையில் விட்டு விட்டுச் சென்றான்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.29, p.32", "", "medium", "false"], ["SANG-1-30", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “தலைவனின் இரவுக்கால வருகை” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “தலைவனின் இரவுக்கால வருகை” (section 1.30).", "……………………………………அதற் கொண்டு, அன்றை அன்ன விருப்போடு, என்றும், இரவரல் மாலையனே; வருதோறும் காவலர் கடுகினும், கத நாய் குரைப்பினும், நீ துயில் எழினும், நிலவு வெளிப்படினும், வேய் புரை மென் தோள் இன் துயில் என்றும், பெறாஅன்; பெயரினும், முனியல் உறாஅன், இளமையின் இகந்தன்றும் இலனே; வளமையின் தன்நிலை தீர்ந்தன்றும் இலனே; ……………. பூஞ்சோலையில் இயற்கைப் புணர்ச்சி நடைபெற்ற பின்பு காதல் வேட்கை குறையாதவனாக அவன் ஒவ்வொரு நாளும் தலைவியைத் தேடி வருபவன் ஆனான். அவன் அவ்வாறு வரும்போது நிறைந்த காவலாலும், நாய் குரைப்பதனாலும், தாயே நீ உறக்கம் கொள்ளாமல் விழித்திருப்பதனாலும், நிலவின் ஒளியினாலும் துன்பம் கொண்டு இவள் தோளில் சாய்வதால் கிடைக்கும் இன்பம் கிடைக்காமல் வெறுமையான மனத்துடன் திரும்பிச் செல்வான். அவ்வாறு செல்ல நேர்ந்தாலும் இவளை வெறுக்கவில்லை. இவ்வாறு வருபவன் இளமைப் பருவத்தைக் கடந்தவனும் இல்லை. செல்வம் நிறைந்தவன் ஆனாலும் கர்வம் சிறிதும் இல்லாதவன்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.30, p.32", "", "medium", "false"], ["SANG-1-31", "Sangam literature", "சங்க இலக்கியம் – குறிஞ்சிப்பாட்டு: “தலைவியின் துன்பம்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறிஞ்சிப்பாட்டு: Explain the poem/passage titled “தலைவியின் துன்பம்” (section 1.31).", "………………………………….. கொன் ஊர் மாய வரவின் இயல்பு நினைஇ, தேற்றி, நீர்ஏறி மலரின் சாஅய், இதழ் சோரா ஈரிய கலுழும், இவள் பெரு மதர் மழைக்கண்; ஆகத்து அரிப் பனி உறைப்ப, நாளும், வலைப் படு மஞ்ஞையின், நலம் செலச் சாஅய், நினைத் தொறும் கலுழுமால், …………… அச்சம் தரத்தக்க நிகழ்வுகளைக் கொண்டிருக்கும் இவ்வூரில் இரவுக் குறியில் வந்து இன்பம் பெறுதல் பொய்யாக இருக்கின்ற காரணத்தினால் இது குற்றம் என்று மனத்தால் நினைத்து அவன் திருமணம் செய்து கொள்ள அவனோடு சேர்ந்து வாழ்க்கை நடத்துவதே சிறந்தது என்று நினைப்பதனால், மழையால் தாக்கப்பட்ட மலர்போல இவளுடைய உடல் அழகெல்லாம் கெட இமைகள் சோர்ந்து கண்ணீரை உடையவளாக் கலங்கியிருக்கிறாள். என் தோழியின் அழகிய கண்களில் இருந்து துளிர்ககு ; ம் கண்ணீர் மார்பில் விழ வலையில் சிக்கிய மயில்போல அவர் வருகின்ற வழி துன்பம் நிறைந்ததாயிற்றே என்று நினைக்கும் போதெல்லாம் இவள் கண் கலங்குவாள். …………………………………இவளே கங்குல், அளைச் செறி உழுவையும், ஆளியும், உளியமும், புழற் கோட்டு ஆமான் புகல்வியும், களிறும், வலியின் தப்பும் வன்கண் வெஞ் சினத்து உருமும், சூரும், இசை தேர் அரவமும், ஒடுங்கு இருங் குடத்து அருங் சுழி வழங்கும் கொடுந் தாள் முதலையும், இடங்கரும் கராமும் நூழிலும், இழுக்கும், ஊழ் அடி முட்டமும், பழுவும், பாந்தளும், உளப்படப் பிறவும், வழுவின் வழாஅ விழுமம், அவர் குழு மலை விடரகம், உடையவால் எனவே, இரவு நேரத்தில் குகையில் வாழும் புலிகளும் சிங்கமும் கரடிகளும் கோடுகள் உடைய கொம்புடைய காட்டு மாடும், யானையும், இடியும், தெய்வமும், இரைதேடும் பாம்பும், நீர் நிலையில் முதலை இடங்கர்கராம் ஆகியனவும், வழிப்பறி செய்யும் கொலைஞர்கள் நிறைந்த இடமும், வழி தெரியாத இடங்களும், பேயும், மலைப் பாம்பும் இவை தவிர பிறவும் அவர் வரும் வழியில் உண்டு. அதனை நினைக்கும் போதெல்லாம் இவள் கண் கலங்கி அழுவாள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 1, section 1.31, p.33", "", "hard", "false"], ["SANG-2-3", "Sangam literature", "சங்க இலக்கியம் – முல்லைக்கலி 1–8: “பாடல் : 1 பாடியவர் : சோழன் நல்லுருத்திரன்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – முல்லைக்கலி 1–8: Explain the poem/passage titled “பாடல் : 1 பாடியவர் : சோழன் நல்லுருத்திரன்” (section 2.3).", "ஏறு தழுவலும் தோழியின் கூற்றும் : தளிபெறு தண் புலத்துத் தலைப்பெயற்கு அரும்பு ஈன்று முளி முதல் பொதுளிய முள் புற பிடவமும், களி பட்டான் நிலையே போல் தடவுபு துடுப்பு ஈன்று ஞெலிபு உடன் நிரைத்த ஞெகிழ் இதழ் கோடலும், மணி புரை உருவின காயாவும் பிறவும், 5 அணிகொள மலைந்த கண்ணியர் தொகுப்பு உடன் மாறு எதிர்கொண்ட தம் மைந்துடன் நிறுமார், சீறு அரு முன்பினோன் கணிச்சி போல் கோடு சீஇ, ஏறு தொழுப் புகுத்தனர் இயைபு உடன் ஒருங்கு. அவ்வழி முழக்கு என இடி என முன் சமத்து ஆர்ப்ப, 10 வழக்கு மாறு கொண்டு வருபு வருபு ஈண்டி, நறையொடு துகள் எழ நல்லவர் அணி நிற்பத் துறையும் ஆலமும் தொல் வலி மராஅமும் முறை உளி பராஅய்ப் பாய்ந்தனர் தொழு. மேல் பாட்டு உலண்டின் நிறன் ஒக்கும் புன் கருக் கண் 15 நோக்கு அஞ்சான் பாய்ந்த பொதுவனைச் சாக் குத்திக், கோட்டு இடைக் கொண்டு குலைப்பதன் தோற்றம் காண்! அம்சீர் அசை இயல் கூந்தல் கை நீட்டியான் நெஞ்சம் பிளந்து இட்டு நேரார் நடுவண், தன் வஞ்சினம் வாய்த்தானும் போன்ம். 20 சுடர் விரிந்தன்ன சுரி நெற்றிக் காரி விடரி அம் கண்ணிப் பொதுவனைச் சாடிக் குடர் சொரியக் குத்திக் கலைப்பதன் தோற்றம் காண்! படர் அணி அந்திப் பசுங்கண் கடவுள் இடரிய ஏற்று எருமை நெஞ்சு இடந்து இட்டுக் குடர் கூளிக்கு ஆர்த்துவான் போன்ம். 25 செவி மறை நேர் மின்னும் நுண் பொறி வெள்ளைக் கதன் அஞ்சான், பாய்ந்த பொதுவனைச்ச சாடி, நுதி நுனைக் கோட்டால் குலைப்பதன் தோற்றம் காண்! ஆர் இருள் என்னான் அருங் கங்குல் வந்து, தன் 30 தாளின் கடந்த அட்டு, தந்தையைக் கொன்றானைத் தோளின் திருகுவான் போன்ம். என ஆங்கு, அணி மாலைக் கேள்வதன் தரூஉமார் ஆயர் மணி மாலை ஊதும் குழல். 35 கடாஅக் களிற்றினும் கண்ணஞ்சா ஏற்றை விடாஅது நீ கொள்குவை ஆயின், படாஅகை ஈன்றன் ஆயமகள் தோள். பகலிடக் கண்ணியன், பைதல் குழலன், சுவல் மிசைக் கோல் அசைத்த கையன், அயலது 40 கொல் ஏறு சாட இருந்தார்ககு ; எம்பல் இருங் கூந்தல் அணை கொடுப்பேம் யாம். கோளாளர் என் ஒப்பார் இல் என நம்ஆன் உள் தாளாண்மை கூறும் பொதுவன் நமக்கு, ஒரு நாள் கேளாளன் ஆகாமை இல்லை; அவன் கண்டு 45 வேளாண்மை செய்தன கண். ஆங்கு ஏறும் வருந்தின! ஆயரும் புண் கூர்ந்தார்! நாறு இருங் கூந்தல் பொது மகளிர் எல்லாரும் முல்லை அம் தண் பொழில் புக்கார், பொதுவரொடு எல்லாம் புணர் குறி கொண்டு. 50 முன்னர் உலர்ந்திருந்த பிடவம். மழை பெறுகின்ற குளிர்ந்த பூமியிலே, முள்ளைப் புறத்தே கொண்ட அரும்புகளையும் ஈன்றது. கள்ளுண்டவனின் நிலையைப் போல ஆடியசையும் துடுப்புகளை ஈன்று, பின்னர்த் தீக்கடை கோலாற் கடைந்து நிரைத்த நெருப்புப் போன்ற ஒளியுடன் செங்காந்தள் பூக்கள் விளங்கின. காயாம்பூக்கள் நீலமணியின் உருவினையும் நிறத்தையும் உடையவாயிருந்தன. இவற்றோடு விற்பமாகிய பூக்களை அழகுறத் தொடுத்துக் கண்ணியாகச் சூட்டியிருக்கின்றனர், ஆயரிளைஞர். அவர்களைத் தொகுதியாகச் சேர்த்துச், சீறுதற்கரிய வலியுடையோனான இறைவனின் கணிச்சி போலக் கொம்புகள் சீவப்பட்ட ஏறுகள் நிற்கின்ற தொழுவினுள், தம்மைப் பகைத்தவரும் அவற்றைத் தழுவித் தம் ஆற்றலைச் சேர நிறுத்துவதற்காக, ஒருங்கே சென்று புகுந்துவிட்டனர் ஆயர்கள். அவ்விடத்திலே, முழக்கென இடியெனத் தம் முன்னே ஆரவாரம் எழ, ஏறுகள் முகாரமிட்டு நின்றன. ‘ஏறு தழுவியவர்க்கே மகளைத் தருவேம்’ என்ற ஆயர்குல வழக்குப்படி, ஏறு தழுவ முன் வந்தார் அனைவரும் வந்து சேர்ந்தனர். ஆரவாரத்தோடு எங்கும் புழுதியும் எழுந்தது. நல்ல மகளிர் திரண்டு ஒரு சார் நின்றனர். நீர் துறைகளிலும், ஆலமரத்தடிகளிலும், பழைய வலியுடைய மராமத்தின் கீழும் உறையும் தெய்வங்களுக்கு முறையாக வழிபாடுகள் செய்தபின், இளைஞரும் தொழுவினுள்ளே சீறிப் பாய்ந்தனர். தோழி கூறுகிறாள் : உயர்ந்த கொம்பிடத்திலே வைத்த பட்டுப் பூச்சியினது நிறத்தைப் போன்ற, கருஞ்சிவப்பு நிறத்தைக் கொண்ட ஏற்றின் பார்வைக்கு அஞ்சாமல், அதன் மேற் பாய்ந்து பற்றினான் ஆயரிளைஞன். அவனைச் சாவுமாறு குத்திக் கொம்பினிடையிலே கொண்டு, அது அவனுடலைக் குலைக்கின்ற காட்சியைப் பார்! அழகிய சீருடைய, அசையும் இயல்பினதான, திரௌபதியின் தலைமயிரிலே கைநீட்டிய துச்சாதனனைப் போரிலே நெஞ்சத்தைப் பிளந்து அழித்துப் பகைவர் நடுவே தன் வஞ்சினத்தை நிறைவேற்றிய வீமசேனனைப் போல,. அதுவும் தோன்றுகின்றதல்லவோ? சந்திரனைப் போன்ற நெற்றிச் சுட்டியையுடைய காரி, மலைப்பூக் கண்ணி சூடிய அப்பொதுவனைச் சாடிக் குடர்சரியக் குத்திக் குலைக்கின்றதைப் பார்! ஊழி முடிவிலே, ஒரு பாகத்தில் பசுமையான உமையையுடைய கடவுள், எருமை வாகனனான கூற்றுவனின் நெஞ்சத்தைப் பிளந்து, குடரைக் கூளிக்குப் பலியாக ஊட்டுவது போன்றிருக்கின்றல்லவோ? செவிப்புறத்திலே மின்னும் நுண்ணிய செம்புள்ளி களையுடைய வெள்ளை ஏற்றின் கோபத்துக்கும் அஞ்சாது, அதன் மேற் பாய்ந்த இளைஞனை, அது சாடித், தன் கூரிய கொம்பு முனையால் குத்திக் குலைப்பதைப் பார். அடர்ந்த இருள் என்றும் கருதானாய். நடு இரவிலே வந்து தன் தந்தையைக் கொன்றவனைத், தன் ஆற்றலின் வலிமையினால், தலையைத் திருகிய அசுவத்தாமனைப் போன்றிருக்கிறதே அது! ஆயர்கள் மணிமாலை அணிந்த குழலினை ஊதுகின்றனர். நல்ல நிமித்தம் இது. அழகிய மாலை அணிந்த உன் காதலனை உனக்குக் கட்டாயம் இன்று கொண்டு தரும். (இவ்வாறு கூறியவள், தலைவனிடம் சென்று அவனை ஊக்கப்படுத்துகின்றாள்) மதங்கொண்ட களிற்றுயானையினும் மிகுந்த வலியுடைய ஏற்றை விடாது பற்றி நீ வெற்றிகொள்வாய். நீ அவ்வாறு செய்தால், எம் ஆயமகள் தோள் பிறரினும் வெற்றிக்கொடியைப் பெற்றதாகும். (பின்னர்த் தலைவியிடம் வந்து) “பகற்போதில் கண்ணியையுடையவன். வருத்தம் ஒலிக்கும் குழலினையுடையவன். தோள்மேல் வைத்த கோலினைப் பற்றி அசைத்துக்கொண்டே இருக்கும் கையன், அயலிலே கொல்லேறு சாட இருந்தானுக்கு, எம் பல்லிரும் கூந்தல் அணையாகப் பயன்பட நாமும் தருவோம்” என்றாள். “ஏறு கொள்ள வல்லார் என்னைப் போன்றவர் எவரும் இலர்” என்று, நம் பசுத்திரளிடையே நின்று வீரம் பேசுகின்ற பொதுவன், நமக்கு ஒரு நாள் உறவினன் ஆகாமற் போவதில்லை. அவனைக் கண்டு எம் கண்களும் காதற் பயிரினை வளர்க்கின்றன என்கிறாள்” தலைவி. தோழியும் தலைவியும் இவ்வாறு பேசி இருக்க, அங்கே தொழுவினுள் ஏறுகளும் வருந்தித் தளர்ந்தன. ஆயர்களிற் பலர் புண்பட்டனர். மணங்கமழும் கூந்தலினரான ஆய மகளிர் எல்லாரும், தம்மைக் காதலித்த பொதுவர்களுடன் சேர்ந்து, களித்து ஆட விரும்பியவர்களாக, முல்லை மலர் நிறைந்த குளிர்ந்த சோலையினுள்ளேயும் சென்று புகுந்தனர். இதனால், ‘நீயும் உன் தலைவனைப் பின்பற்றிச் செல்க’ எனத் தன்னருகே இருந்த தலைவிக்குத் தோழி கூறாமற் கூறியதுமாயிற்று.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 2, section 2.3, p.35", "", "hard", "false"], ["SANG-2-4", "Sangam literature", "சங்க இலக்கியம் – முல்லைக்கலி 1–8: “பாடல் : 2 :ஏறு தழுவி வென்றவன் பாடியவர் : சோழன்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – முல்லைக்கலி 1–8: Explain the poem/passage titled “பாடல் : 2 :ஏறு தழுவி வென்றவன் பாடியவர் : சோழன்” (section 2.4).", "நல்லுருத்திரன் தலைவன் : கண் அகல் இரு விசும்பில் கதழ் பெயல் கலந்து, ஏற்ற தண்நறு பிடவமும், தவழ் கொடித் தளவமும் வண்ண வண் தோன்றியும், வயங்கு இணர்க் கொன்றையும் அன்னவை பிறவும், பல்மலர் துதையத் தழையும் கோதையும் இழையும் என்று இவை 5 தைஇயினர், மகிழ்ந்து திளைஇ விளையாடும் மடமொழி ஆயத்தவருள் இவள் யார், உடம்போடு என் உயிர் புக்கவள், இன்று? தோழன் கூற்று : ஓஒ! இவள் பொரு புகல் நல்ஏறு கொள்பவர் அல்லால், திரு மா மெய் தீண்டலர் என்று கருமமா, 10 எல்லாரும் கேட்ப அறைந்து, எப்பொழுதும் சொல்லால் தரப்பட்டவள். தலைவன் கூற்று : சொல்லுக “பாணியேம்” என்றார்; “அறைக” என்றார்; பாரித்தார் மாண் இழை ஆறு ஆகச் சாறு, சுற்றத்தார் கூற்று : சாற்றுள் பெடை அன்னார் கண் பூத்த நோக்கும் வாய் எல்லாம் 15 மிடை பெறின், நேராத் தகைத்து, தகை வகை மிசை மிசைப் பாயியர் ஆர்த்து, உடன் எதிர் எதிர் சென்றார் பலர். கொலை மலி சிலை செறிசெயிர் அயர் சினஞ் சிறந்து, உருத்து எழுந்து ஓடின்று மேல் 20 எழுந்தது துகள், ஏற்றனர் மார்பு, கவிழ்ந்தன மருப்பு, கலங்கினர் பலர், அவருள் மலர் மலி புகல் எழ, அல் மலி மணிபுரை நிமிர்தோள் பிணைஇ 25 எருத்தோடு இமில் இடைத் தோன்றினன்; தோன்றி, வருத்தினான் மன்ற அவ்ஏறு, ஏறு எவ்வம் காணா எழுந்தார் எவன் கொலோ, ஏறு உடை நல்லார் பகை? மடவரே நல்ஆயர்மக்கள்; நெருநை 30 அடல் ஏற்று எருத்து இறுத்தார்க் கண்டும் இன்றும் உடல் ஏறு கோள் சாற்றுவார்; ஆங்கு, இனித் தண்ணுமைப் பாணி தளராது எழுக, பண் அமைஇன் சீர் குரவையுள், தௌ; கண்ணித், 35 திண்தோள், திறல் ஒளி, மாயப் போர், மாமேனி, அம்துவர்ஆடைப் பொதுவனோடு, ஆய்ந்த முறுவலாள் மென்தோள் பாராட்டிச் சிறுகுடி மன்றம் பரந்தது உரை! தலைவன் : ஏடா! இதோ களிப்புடன் விளையாடும் கன்னியரின் கூட்டத்தைப் பார். பிடவும், முல்லையும், தோன்றியும் பிறவுமான மலர்களைக் கொய்து, தழை, கோதை, இழை என்பனவாகக் கட்டி அமைத்திருக்கின்றனர். களி துள்ள ஆடும் அக்கூட்டத்தினருள், இன்று தன் இடலோடும் என் உயிர் புகுமாறு கவர்ந்து கொண்டு அதோ நிற்கிறாளே, அவள் தான் யாரோ காண்? பாங்கன் : ஓ ஓ! அவளோ? “கொடிய போரெற்றைத் தழுவி வெற்றி பெறுபவரல்லாத பிறர், இவள் அழகு தவழ்கின்ற மேனியைத் தீண்டத்தக்கவர் அல்லர்!” என்று பறையறைந்து, சொல்லால் எங்கும் தரப்பட்டவள் அல்லளோ அவள்! தலைவன் : ‘அவள் பெற்றோர் பாற் சென்று சொல்லுக யான் அந்தக் கொல்லேற்றைத் தழுவுதற்கு முன் வந்தேன்’ என்று, சுற்றத்தார் : சுற்றத்தார் சென்று அவள் பெற்றோர்பால் அவ்வெய்தியைச் சொல்லி, ‘யாங்கள் தாழ்த்திரோம்’ என்றனர். அது கேட்ட அவள் சுற்றத்தார், ‘மாணிழைக்காக நடைபெறும் ஏறு தழுவுதல் நிகழும்’ என்று பலரும் கேட்டு, அறிய எங்கணும் பறையறைவித்தனர். இவ்விழாவிலே, பெண்களெல்லாம் கண்கள் பூக்குமாறு நோக்கும் இடம் எல்லாம் பரணிலே இருக்கப் பெறுவார்களாயின், அதுவும் ஓர் அழகாயிருக்கும் என அமைத்தனர். அழகினை உடைத்தாகிய வகுப்பையுடைய அவ்வேறுகளின் மேலே பாய்வதற்காக, ஆரவாரத்துடன் அவற்றின் எதிர் எதிராகச் சென்றனர் ஆயரிளையுர்கள் பலர், அவர்கள் வரக்கண்ட ஏறுகள், கொலை மிகுந்த வில்லானது செறிந்த போரைச் செய்வது போன்று, சினங்கொண்டு எழுந்து, அவரை நோக்கிப் பாய்ந்து ஓடின. அப்போது, எங்கணும் ஒரே புழுதிப் படலம் எழுந்தது. மார்பைக் காட்டி நின்றனர் ஆயர். ஏறுகளின் கொம்புகள் தரையை ஒட்டிக் கவிந்தன. ஐயோ! என்று கதறிக் கலங்கினர் பலர். அவருள், நீலமணி போன்ற நிறமுடைய நெடுந்தோள் ஏற்றின் கழுத்தை இறுகத் தழுவி, அதன் திமிலிடையிலே தோன்றினான் ஒருவன். தோன்றி, அந் ஏறு பெரிதும் வருத்தமுறும்படி அதனைப் பற்றி இழுத்து அலைத்தான் அவன்! ஏறு படுகின்ற துன்பத்தைக் கண்டவர்கள் எழுந்தனர். ஏற்றின் உரிமையாளர்கள், அவன் செயலுக்குத் தாம் மகிழ்தல் அன்றி ஏனோ அவன்மேற் பகைகொள்கின்றனர். முன்னர் கண்டிருந்தும், இன்றும் வருத்துகின்ற ஏற்றைக் கொள்ளுங்கள் எனச் சொல்லுகின்றனரே இந்த ஆயர் மக்கள்? இவர்கள் மிகவும் அறியாமையை உடையவர்கள் தாமே! ஆங்கு, இனித் தண்ணுமையின் பாணி தளராது எழுக! என்றனர் சுற்றத்தார். பண் அமைந்த இனிய தாளத்தையுடைய குரவையுள் விளங்கிய கண்ணியையும், திண்மையான தோள்களையும், திறலினது விளக்கத்தையும், மாயப் போரினையும், கரிய மேனியினையும், அழகிய துவரூட்டின ஆடையைமணிந்த பொதுவனோடு, சேரும் அழகிய முறுவலாளின் மென் தோள்களையும் பாராட்டிச் சிறுகுடி மன்றத்திலே குரலையாடி மகிழலாம் எழுக’ என்று கூற, அனைவதும் குரவை காண எழுந்தனர்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 2, section 2.4, p.38", "", "hard", "false"], ["SANG-2-5", "Sangam literature", "சங்க இலக்கியம் – முல்லைக்கலி 1–8: “பாடல் : 3 : ஆயமகள் தோள்!” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – முல்லைக்கலி 1–8: Explain the poem/passage titled “பாடல் : 3 : ஆயமகள் தோள்!” (section 2.5).", "பொதுவர் ஏறு தழுவுதல் : மெல் இணர்க் கொன்றையும், மென் மெலர்க் காயாவும், புல் இலை வெட்சியும், பிடவும், தளவும், குல்லையும், குருந்தும், கோடலும், பாங்கரும், கல்லவும், கடத்தவும், கமழ் கண்ணி மலைந்தனர்; பலஆன் பொதுவர், கதழ் விடை கோள் காண்மார் 5 முல்லை முகையும் மருந்தும் நிரைத்தன்ன, பல்லர், பெரு மழைக் கண்ணர்,. மடம் சேர்ந்த சொல்லர், சுடரும் கனம் குழைக் காதினர், நல்லவர் கொண்டார் மிடை, அவர் மிடை கொள, 10 மணி வரை மருங்கின் அருவி போல அணி வரம்பு அறுத்த வெண்கால் காரியும்,. மீன் பூத்து அவிர்வரும் அந்தி வான் விசும்பு போல் வான் பொறி பரந்த புள்ளி வெள்ளையும், கொலைவன் சூடிய குழவித் திங்கள் போல் 15 வலையுபு மலிந்த கோடு அணி சேயும், பொரு முரண் முன்பின் புகல் ஏறு பல பெய்து, அரிமாவும், பரிமாவும், களிறும், கராமும் பெருமலை விடர் அகத்து ஒருங்கு உடன்குழீஇ, படுமழை ஆடும் வரை அகம் போலும், 20 கொடி நறை சூழ்ந்த தொழு. தொழுவினுள், புரிபு புரிபு புக்க பொதுவரைத் தெரிபு தெரிபு குத்தன ஏறு. ஏற்றின் அரி பரிபு அறுப்பன சுற்றி, எரி திகழ் கணிச்சியோன் சூடிய பிறைக்கண் 25 உருவ மாலை போலக் குருதிக் கோட்டோடு குடர் வலந்தன. தோழி தலைவிக்குக் காட்டல் : கோட்டொடு சுற்றிக் குடர் வலந்த ஏற்றின் முன், ஆடி நின்று, அக்குடர் வாங்குவான் பீடு காண்; செந்நூல் கழி ஒருவன் கைப்பற்ற, அந்நூலை 30 முந் நூலாக் கொள்வானும் போன்ம். இகுளை! இ;ஃது ஒன்று கண்டை! இஃது ஒத்தன் கோட்டு இனத்து ஆயர் மகன் அன்றே, மீட்டு ஒரான் போர் புகல் ஏற்றுப் பிணர் எருத்தில் தத்துபு தார் போல் தழீஇயவன்? 35 இகுளை! இஃது ஒன்று கண்டை! இஃது ஒத்தன் கோ இனத்து ஆயர் மகன் அன்றே, ஓவான் மறை ஏற்றின் மேல் இருந்து ஆடித் துறை அம்பி ஊர்வான் போல் தோன்றும் அவன்? தொழீஇஇ! காற்றுப் போல வந்த கதழ் விடைக் காரியை 40 ஊற்று களத்தே அடங்கக் கொண்டு, அட்டு அதன் மேல் தோன்றி நின்ற பொதுவன் தகை கண்டை! ஏற்று எருமை நெஞ்சம் வடிம்பின் இடந்து இட்டுச் சீற்றமொடு ஆர் உயிர் கொண்ட ஞான்று, இன்னன் கொல் கூற்று என உட்கிற்று என் நெஞ்சு. 45 இகுளை! இஃது ஒன்று கண்டை! இஃது ஒத்தன் புல்லினத்து ஆயர் மகன் அன்றே, புள்ளி வெறுத்த வ யவெள் ஏற்று அம்புடைத் திங்கள் மறுப்போல் பொருந்தியவன்? ஓவா வேகமோடு உருத்துத் தன் மேல் சென்ற 50 சேஎச் செவி முதல் கொண்டு, பெயர்த்து ஒற்றும் காயாம் பூங் கண்ணிப் பொதுவன் தகை கண்ட, மேவார் விடுத்தந்த கூந்தல் குதிரையை வாய் பகுத்து இட்டுப் புடைத்த ஞான்று, இன்னன் கொல் மாயோன் என்று உட்கிற்று என் நெஞ்சு. 55 ஆங்கு இரும்புலித் தொழுதியும் பெருங்களிற்று இனமும் மாறு மாறு உழக்கியாங்கு உழக்கிப் பொதுவரும் ஏறுகொண்டு, ஒருங்கு தொழு விட்டனர், விட்டாங்கே, மயில் எருத்து உறழ் அணி மணி நிலத்துப் பிறழப் பயில் இதழ் மலர் உண்கண் 60 மாதர் மகளிரும் மைந்தரும் மைந்து உற்றுத் தாது எரு மன்றத்து அயர்வர் தழு. கொல் ஏற்றுக் கோடு அஞ்சுவானை மறுமையும் புல்லாளே ஆயமகள். அஞ்சார் கொலை ஏறு கொள்பவர் அல்லதை, 65 நெஞ்சு இலார் தோய்தற்கு அரிய, உயிர் துறந்து, நைவாரா ஆயமகள் தோள், வளியா அறியா உயிர் காவல் கொண்டு நளிவாய் மருப்பு அஞ்சும் நெஞ்சினார் தோய்தற்கு எளியவோ ஆயமகள் தோள்? 70 விலை வேண்டார் எம் இனத்து ஆயர் மகளிர், கொலை ஏற்றுக் கோட்டு இடைத் தாம் வீழ்வார் மார்பின் முலை இடைப் போலப் புகின், ஆங்கு,. குரவை தழீஇ, யாம் மரபுளி பாடி, 75 தேயா விழுப்ப புகழ்த் தெய்வம் பரவுதும், மாசு இல் வான் முந்நீர்ப் பரந்த தொல் நிலம் ஆளும் கிழமையொடு புணர்ந்த எங்கோ வாழியர், இம் மலர்தலை உலகே!. பல பசுக்களுக்கு உரிமையுடையவரான பொதுவர்கள், கல்லிடத்தனவும், காட்டிடத்தனவும் ஆகிய மென்மையான கொன்றை, காயா, வெட்சி, பிடவம், முல்லை, கஞ்சங்குல்லை, குருந்தம், கோடல், பாங்கர் முதலிய மலர்களாற் செய்த கண்ணிகளைச் சூடியவராக வந்து கொண்டிருந்தனர். அவர்கள் விரைந்து வந்து ஏறுதழுவுதலைக் காண விரும்பிய ஆயர்மகளிர் பலரும், பரண்களிலே முற்படவே வந்து அமர்ந்தனர். முல்லை முகையும் மயிற்பீலிக் கொழுந்தும் வரிசைப்படுத்தயியது போன்ற பல் வரிசையும், குளிர்ந்த நோக்கும், மடப்பம்பொருந்திய சொல்லும் உடையவரான அந்த ஆயமகளிர், காதுகளிலே பொன்னாற் செய்த மகரக் குழைகளையும் அணிந்து கொண்டிருந்தனர். ஏறுகள் திரண்டிருந்த தொழுவோ ஒரே புழுதிப் படலத்தின் இடையே விளங்கிற்று. பெருமழை பெய்து எங்கும் வெள்ளமான காலத்தி;லே, மலக்குகையிலே சிங்கமும் குதிரையும் யானைகளும் முதலைகளும் ஒருங்கே சேர்ந்திருந்தால் எப்படியோ, அப்படிப்பட்ட ஆரவாரத்துடன் எருதுகள் யாவும் பயங்கரமாச் சுற்றிச் சுழன்று திரிந்தன. ஓர் எருது கருமை நிறமாக வெள்ளை கால்களுடன் காணப்பட்டது. மற்றொன்று அந்தி வானம் போலச் சிவந்த உடலில் புள்ளியுடன் விளங்கிற்று. மற்றொளன்று சிவன் அணிந்த பிறை போல் வளைந்த கொம்புடையதாயிருந்தது. இவற்றோடு வேறு பலவும் ஒன்றோடொன்று முக்காரமிட்டுச் சண்டையிட்டுக் கொண்டிருந்தன. அத் தொழுவினுள், அவ்வேறுகளைத் தழுவிப் பற்றி வெற்றி கொள்ள விரும்பிக் குதித்த ஆரியளைஞரை, அவை தெரிந்து, தம் கொம்புகளால் குத்தின அவ்வாறு அவ்வேறுகள் குத்தின காட்சிகள் பயங்கரமானவை! இறைவனின் பிறையிலே சூடிய சிவந்த மாலையைப் போலப், பகையான எருதுகளை விரும்பிச் சென்று போக்குவனவாகிய ஏற்றினங்கள், குருதி தோய்ந்த கொம்புகளிற் குடர்கள் சுற்றியிருக்க விளங்கின. அப்படி நின்ற ஏற்றின் மன்னர், அஞ்சாது சென்று, நின்று, அக்குடரை வாங்கித் தன் வயிற்றிலே இடுபவன்றன்னைப் பார். சிவந்த நூற்கழிழயஒருவன் இரண்டு கைளிலும் பிடித்துக்கொள்ள, அந்நூலை மூன்று வடமாக நூற்கின்றவனைப் போலத் தோன்றுகின்றானே! அவன் பெருமைதான் என்னேடி? போர்க்குணம் உடைய ஏற்றின் கழுத்திலே பாய்ந்து, அதிலிட்ட மாலைபோலே தழுவிக் கிடப்பவைனைப் பாரடீ! அவன் எருமைத் திரளுக்கு உரிய ஆயனல்லவோ! எனவே, இனி அவன் அதை விடமாட்டான். தோழி! இதோ இஃதொன்று கண்டாயோ? இவன் ஒருவன், கோவினத்தாயர் மகன் அல்லனோ? மறையேற்றின் மேலிருந்து ஆடிவிட்டுத் தெப்பத்திற் கிடந்து அதனைத் தள்ளுவதுபோல, ஏற்றின் மேலிருந்து தழுவிக் கொண்டிருக்கின்றானோ? இவன் தன் முயற்சியைக் கைவிடான்! பார்த்துக் கொண்டிருப்பவளே! காற்றுப்பேல வந்து விரைந்த காரி ஏற்றை, பலரும் வந்து பொருதுகின்ற களத்திலே முழுவதும் வலியடங்குமாறு வருத்தி. அதன்மேல் தோன்றி நிற்கும் பொதுவனின் சிறப்பைக் காணடீ! எருமை ஏற்றிற்கு உரியோனாகிய கூற்றுவனின் நெஞ்சத்தைக் காலாலுதைத்துச், சீற்றமோடு சிவனார் அந்நாளிற் பிளந்தபோது, இப்படித் தானிருந்தாரோ? அதைக் கண்டு, என் நெஞ்சமும் திடுக்குற்றதேடீ! புள்ளி செறிந்த வலிய வெள்ளை ஏற்றைத் திங்களிலே மறுப்போலத் தழுவி ஒருவன் நிற்பதைக் காணடீ! இவன் ஒருவன்! ஆட்டினம் உடைய ஆயர்மகன் அல்லனோ! கட்டுக்கடங்காத வேகத்துடன் வௌ;விதாகத் தன் மேற் சென்ற சிவந்த ஏற்றினைச் செவியடியிற் பற்றிக் கொண்டு, அதனைப் புரட்டி வென்று நிற்கும் காயாம் பூக்கண்ணி சூடியவனைப் பாரடீ! பகைவர் விடுத்த கூந்தற் குதிரையை வாயைப் பிளந்து கொன்ற காலத்திலே, நம் மாயவனும் இப்படித்தான் இருந்திருப்பானோ? என்று என் நெஞ்சம் நடுங்குகின்றதடீ! இப்படியாக, அங்கே கொடிய புலிக்கூட்டமும், பெருங்களிற்றினமும் மாறுமாறு தம்முள் புரண்டு புரண்டு போரிட்டனபோல, ஏறுகளும் பொதுவரும் போரிட்டனர். ஏறு தழுவி வெற்றி கொண்ட பொதுவரனைவரும் ஒருங்கே தொழுவைவிட்டு வெளி வந்தனர். வந்த பின்னர், அங்கே, மயிற் கழுத்திலே புரளும் அழகிய மணி நீலத்தையும் மாறுபடும் மையுண்ட கண்ணினரான, அவர் காதல் கொண்ட மகளிரும், மைந்தரும் காதற் பெருக்காலே மன வலியுற்றுப், பூந்தாதாகிய தாது எருவாக வீழ்ந்து கிடக்கின்ற மன்றத்திற் சென்று, ஒருவரையொருவர் தழுவியாடும் கூத்தினை ஆடுகின்றனர். அங்கே நாமும் சென்றாடுவோம் வா என ஒருத்தியைழைக்க, மகளிர் இருவரும் அங்கே சென்றனர். கொல்லேற்றின் கொம்புக்கு அஞ்சுகின்றவனை, மறுமையிலும் ஆயமகள் தழுவமாட்டாள். அஞ்சாதவராக் கொல்லேற்றைத் தழுவிக் கொள்பவரையல்லாமல், அத்தகைய நெஞ்சில்லாதவர் தழுவுவதற்கு அரியன ஆயமகள் தோள்கள். அவர்கள், ஏன் வீணே காமத்தால் உயிர் துறந்து நைவதற்கு முயல்கின்றனர்? காற்றுப் போலப் போய்விடுவது உயிர் என்றறியாமல், உயிரைக் காவல் காக்கும் அச்சங்கொண்டு, ஏற்றின் மருப்பிற்கு அஞ்சியிருக்கும் நெஞ்சினார் தழுவுவதற்கு, அத்துணை எளியவோ, ஆயமகள் தோள்கள்? எம் இனத்து ஆயர் முலைவிலை வேண்ட மாட்டார்கள். ஆனால், கொல்லேற்றுக் கொம்பினிடையினைத், தாம் காதலிக்கும் பெண்களின் முலையிடையே போலக் கருதி, ஆர்வமுடன் வீழ்ந்து தழுவினால், அவனையே தம் மகட்கேற்றவனாகக் கருதுவார்கள். அங்கே, குரவையை யொட்டியே நாம் எம் மரபுகளைச் சுட்டிப்பாடத் தேயாத புகழை உடைய தெய்வத்தைப் போற்றுவோமாக. மாசற்ற அழகிய கடலிடத்தே பரந்து கிடக்கின்ற பழைய நாட்டை, ஆளும் உரிமையோடு வந்து ஆட்சி செய்கின்ற எங்கோமானான பாண்டியன், இவ்வகன்ற உலகிலே என்றென்றும் நிலைபெற்று வாழ்வானாக!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 2, section 2.5, p.41", "", "hard", "false"], ["SANG-2-6", "Sangam literature", "சங்க இலக்கியம் – முல்லைக்கலி 1–8: “பாடல் : 4 : ஊராரை உச்சி மிதித்து!” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – முல்லைக்கலி 1–8: Explain the poem/passage titled “பாடல் : 4 : ஊராரை உச்சி மிதித்து!” (section 2.6).", "தோழி கூற்று : மலி திரை ஊர்ந்து தன் மண் கடல் வெளவலின், மெலிவு இன்றி மேல் சென்று மேவார் நாடு இடம்படப், புலியொடு வில் நீக்கிப் புகழ் பொறித்த கிளர் கெண்டை,. வலியினான் வணக்கிய வாடாச் சீர் தென்னவன் தொல் இசை நட்ட குடியொடு தோன்றிய 5 நல் இனத்து ஆயர் ஒருங்கு தொக்கு எல்லாரும், வான் உற ஓங்கிய வயங்கு ஒளிர் பனைக் கொடிப் பால் நிற வண்ணன் போல் பழி தீர்ந்த வெள்ளையும், பொரு முரண் மேம்பட்ட பொலம் புனை புகழ் நேமித் திரு மறு மார்பன் போல் திறல் சான்ற காரியும், 10 மிக்கு ஒளிர் தாழ் சடை மேவரும் பிறை நுதல் ஷ முக்கண்ணான் உருவே போல் முரண் மிகு குராலும், மா கடல் கலக்குற மா கொன்றை மடங்காப் போர் வேல் வல்லான் நிறனே போல் வெரு வந்த சேயும், ஆங்கு அப் பொருவரும் பண்பினவ்வையும், பிறவும் 15 உருப் பல் கொண்மூக் குழீஇயவை போலப் புரிபு புரிபு புகுத்தனர் தொழு. அவ்வழி முள் எயிற்று ஏஎர் இவளை பெறும், இது ஓர் வெள் ஏற்று எருத்து அடங்குவான். ஒள்ளிழை வாருறு கூந்தல் துயில் பெறும், வை மருப்பின் 20 காரி கதன் அஞ்சான் கொள்பவன்; ஈர் அரி வெரூஉப் பினை மான் நோக்கின் நல்லாள் பெறூஉம் இக் குரூஉக் கண் கொலை ஏறு கொள்வான்; வரிக் குழை வேய் உறழ் மென் தோள் துயில் பெறும், வெந்துப் பின் சேஎய் சினன் அஞ்சான் சார்பவன் என்று ஆங்கு, 25 அறைவனர், நல்லாரை, ஆயர் முறையினால், நாள்மீன் வாய் சூழ்ந்த மதி போல் மிடை மிசைப் பேணி நிறத்தார் அணி. அவ்வழி பறை எழுந்து இசைப்பப், பல்லவர் ஆர்ப்பக் குறையா மைந்தர் கோள் எதிர் எடுத்த 30 நறை வலம் செய விடா இறுத்தன ஏறு. அவ் ஏற்றின் மேல்நிலை மிகல் இகலின், மிடை கழிபு இழிபு, மேல்சென்று வேல் நுதி புரை விறல் திறன் நுதி மருப்பின் மாறு அஞ்சான், பால்நிற வெள்ளை எருத்தத்து பாய்ந்தானை 35 நோனாது குத்தும் இளம் காரித் தோற்றம் காண், பால் மதி சேர்ந்த அரவினைக் கோள் விடுக்கும் நீல் நிற வண்ணனும் போன்ம். இரிபு எழுபு அதிர்பு அதிர்பு இகந்து உடன் பலர் நீங்க அரிபு அரிபு இறுபு இறுபு குடர் சோரக் குத்தித், தன் 40 கோடு அழியக் கொண்டானை ஆட்டித் திரிபு உழக்கும் வாடில் வெகுளி எழில் ஏறு கண்டை, இஃது ஒன்று, வெருவரு தூமம் எடுப்ப வெகுண்டு திரிதரும் கொல் களிறும் போன்ம். தாள் எழு துணி பிணி இசை தவிர்பு இன்றித் தலைச் சென்று, 45 தோள் வலி துணி பிணி துறந்து இறந்து எய்தி மெய் சாய்ந்து, கோள் வழுக்கித் தன் முன்னர் வீழ்ந்தான் மேல் செல்லாது மீளும் புகர் ஏற்றுத் தேற்றம் காண், மண்டு அமருள், வாள் அகப்பட்டானை ஒவ்வான் எனப் பெயரும் மீளி மறவனும் போன்ம். 50 ஆங்க, செறுத்து அறுத்து உழக்கி ஏற்று எதிர் நிற்ப, மறுத்து மறுத்து மைந்தர் சாரத் தடி குறை இறுபு இறுபு தாயின் கிடப்ப, இடி உறழ் இசையின் இயம் எழுந்து ஆர்ப்பப், பாடு ஏற்றுக் கொள்பவர் பாய்ந்து மேல் ஊர்பவர் 55 கோடு இடை நுழைபவர் கோள் சாற்றுபவரொடு, புரிபு மேல் சென்ற நூற்றுவர் மடங்க, வரிபுனை வல் வில் ஐவர் அட்ட, பொரு களம் போலும் தொழு. தொழுவினுள் கொண்ட ஏறு எல்லாம் புலம் புகத் தண்டாச் சீர் 60 வாங்கு எழில் நல்லாரும் மைந்தரும், மல்லல் ஊர் ஆங்கண் அயெர்வர் தழு. தோழி அழைத்தல் : பாடுகம் வம்மின்! பொதுவன் கொலை ஏற்றுக் கோடு குறி செய்த மார்பு. தலைவி : நெற்றிச் சிவலை நிறை அழித்தான் நீள் மார்பில் 65 செற்றார் கண் சாய யான் சாராது அமைகல்லேன்; பெற்றத்தார் கவ்வை எடுப்ப, அது பெரிது உற்றீயாள் ஆயர்மகள் தொழீஇஇ! ஒருக்கு நாம் ஆடும் குரவையுள், நம்மை அருக்கினான் போல் நோக்கி அல்லல் நோய் செய்தல், 70 குரூஉக் கண் கொலை ஏறு கொண்டேன் யான் என்னும் தருக்கு அன்றோ ஆயர்மகன்? தோழி : நேர் இழாய்! கோள் அரிது ஆக நிறுத்த கொலை ஏற்றுக் காரி கதன் அஞ்சான் பாய்ந்த பொதுவற்கே, ஆர்வுற்று எமர் கொடை நேர்ந்தார், அல் எடுத்த 75 ஊராரை உச்சி மிதித்து, ஆங்கு, தொல் கதிர் திகிரியான் பரவுதும், ஒல்கா உரும் உறழ் முரசின் தென்னவற்கு ஒரு மொழிஅ கொள்க இவ்உலகு உடன் எனவே. முற்காலத்தே கடலலைகள் மிக்குப் பொங்கி எழுந்தன. பாண்டியனின் நாட்டை விழுங்கி;ன் அதனால் பாண்டியன் தளர்ந்துவிடவில்லை. தன் நாட்டை விரிவாக்கும் பொருட்டுத் தன்னுடன் பகைகொண்டிருந்த சேரசோழ நாடுகளை வென்று, அவற்றின் பகுதிகளைச் சேர்த்துப் புதிய பாண்டிய நாட்டைக் கண்டான். தான் வென்ற பகுதிகளிலிருந்த புலி, வில் கொடிகளைப் போக்கி, அங்கெல்லாம் கயற்கொடியினைப் பறக்கச் செய்தான். தன் ஆற்றலினால், இயற்கையின் கொடுமையையும் வென்றுவிட்ட வாடாத சீருடையவன் தென்னவனாகிய அப்பாண்டியன். அவனுடைய பழைய புகழை நிலைபெறுத்திய பல குடிகளோடு, தாமும் புகழுடன் விளங்கிய நல்ல இனத்தோர்கள் ஆயர்கள். அவர்கள் எல்லாரும் ஒரு நாள் ஒன்றாகக் கூடினர். பனைக் கொடியோனான பலராமனைப் போல வெள்ளை வெளேறென்றிருந்தது ஓர் எருது போர்க்கணம் மிகவும் உடையதான மற்றொன்று, திருமாலைப் போலக் கன்னங்கரேலென்றிருந்தது. மற்றொன்று, முக்கண்ணனான சிவபிரானுடைய மேனியைப்போலச் செக்கச் செவேலென்றிருந்தது. இன்னொன்று, கடல் கலங்கச் சென்று சூரனை வென்ற வேலேந்திய முருகனின் நிறம்போல இளஞ்சிவப்பு நிறமுடன் விளங்கிற்று. இப்படியாகப் பெருதற்குணம் உள்ளனவும் இல்லாதனவும்மான பல எருதுகளைகும், மேகங்கள் திரண்டெழுந்து முழங்குவன போல முக்காரமிட்டு அவை திரளும் படியாகத் தொழுவினள் போகவிட்டனர். அவ்விடத்திலே… இஃது ஓர் வெள்ளை நிற எருது. இதன் கழுத்தை அணைத்து அடக்குபவன், முள் எயிற்று அழகியான இவளை மனைவியாகப் பெறுவான். கூரிய கொம்பினையுடைய கரிய ஏற்றினது சினத்துக்கும் அஞ்சாது, அதனைத் தழுவி அடக்குபவன், இந்த ஒள்ளிழையின் வாருதலுள்ள கூந்தலிலே துயிலுகின்ற பேற்றைப் பெறுவான். குரால் நிறத்தவாகிய கண்களை உடைய கொலைக்குணமுடைய ஏற்றைத் தழுவுபவன், மான்பிணை நோக்குப் வேற் கண்களுடைய இந்த நல்லவளைப் பெறுவான். கொடிய வலிமையுடைய செவலை எருதை அஞ்சாது சென்று அடக்குபவன், வரி பொருந்திய குழையும், வேய் போன்ற தோளும் உடைய இவளுடன் துயில்தலைப் பெறுவான். என்று, நல்லாயர், தமக்குரிய முறைப்படி அறிவத்து, விண்மீன்கள் சூழ விளங்கும் மதிபோலத் தத்தம் மகளிரையும், தோழிப்பெண்கள் சூழப் பரண்களிலே ஒப்பித்து நிறுத்தினர். அப்பொழுது பறைகள் மிகுந்த ஓசையுடன் முழங்கின. பலரும் ஆரவார ஒலி செய்தனர் குறையாத வலியுடைய பொதுவர்கள், ஏறு தழுவிக் கொள்ள எதிராகக் காத்து நின்றனர். புகைவலம் விடப்பட்டு நின்ற ஏறுகள், கூக்குரல் பறை முழக்கம் முதலியவையாற் சினந்து, அப்பொதுவர்கள் மேலே சீறிப்பாய்ந்தன (இந்தக் காட்சியை ஒருத்தி தன் தோழிக்குக் காட்டி விளக்குகின்றாள்) ஒரு மாட்டின் மீது தாவி ஏறிய ஒருவன், மேலே இருப்பது மிகவும் கடினமாயிருந்ததால், அங்கிருந்தும் இறங்கி, மேலும் சென்று, அந்த மாட்டின் கொம்புகள் வேல் நுனி பொலக் கூரியவாய் இருந்தும் அங்சாதவனாக, அந்த வெள்ளையின் கழுத்திலே பாய்ந்து அணைத்துத் தழுவினான். அவனை, அண்மையிலிருந்த இளங்காரி இடைவிடாது குத்தும் தோற்றத்தைப் பாராடீ! நிலவை விழுங்க முயன்ற பாம்பினை விடுவிக்கும் நீல நிற வண்ணனைப் போல் இருக்கின்றதன்றோ! எழுந்தெழுந்து வந்த பலரும் அதிர்ந்ததிர்ந்து உடனே ஓடிப்போகுமாறு, எலும்புகள் முறியவும், குடர்கள் சரியவுமாகக் குத்திப் பின்னர் தன் கொம்பின் வலிமை அழியுமாறு தழுவிக் கொண்டிருந்தவனையும், அங்கு மிங்குமாக ஆட்டி, அலைத்துத் திரிந்து வருத்தும், சினங் குறையாத அந்த ஏற்றைப் பார்த்தாயோடீ! வெருவுதல் வருவதற்குக் காரணமான புகையைக் கையிலே எடுத்துவரக் கண்ட கொல்களிறு, அதன் வாடைக் குட்படாமல் வெகுண்டு விலகித் திரிவது போலிருக்கின்றதன்றோ? ஏறு தழுவும் ஆற்றலும் ஆசையும் உடையவனாக இருந்தாலும் அந்த முறையறியாது சென்ற ஒருவன், புகர் நிற ஏற்றைத் தழுவ முயன்று, இயலாது சாய்ந்து நிலத்திலே வீழ்ந்தான். அவன் நிலையைக் கண்ட அந்த எருது, தன் முன்னே புண்பட்டு வீழ்ந்தவன் ஆதலின், அவன்மேற் செல்லாது திரும்பிவிடும் தோற்றம் காணடீ! மிகுந்த கொடும்போரிலே, வாள் எல்லையில் வந்து அகப்பட்ட ஒருவனைக்கூட, என் நிலைக்குத் தகுதியற்றவன் இவன். இவனைக் கொல்லேன் என விட்டச் செல்லும், மறவர் தலைவனைப் போன்றிருக்கின்றதல்லவோ? கொம்பு, மார்பிலே படுதலை மார்பு கொடுத்து ஏற்றுக் கொள்பவர் சிலர். கொம்பின் மேலே பாய்ந்து ஏறுபவர் சிலர், கொம்பினிடையிலே புகுபவர் சிலர், ஏறு கொள்ள வல்லேன் என்று சாற்றுபவர் சிலர். இப்படியாகப் பொதுவர் பலரும் அங்கே விளங்கினர். ஏறுகளோடு பொருது, பின்பும் பொருதற்கு முயல்பவரைத் தடுத்து நிறுத்த முயல்வார் சிலர். அவரையும் விலக்கி விலக்கி அவர் சென்று தழுவுவர். ஏறு தழுவுதலினால் முறிந்து முறிந்து, அற்றுப் பறந்த தலைகள், எங்கும் பரவிக் கிடந்தன. இடி முழக்கம் போன்று ஏறுகள் முக்காரமிட்டு முழங்கின. வாத்தியங்கள் ஆரவாரித்தன. இத்தன்மைகளால், அத்தொழு, துரியோதனாதியர்க்கும் பாண்டவர்ககு ; ம் இடையே நடந்த பாரதப் போர்க்களத்தைப் போலப் பயங்கரமாக விளங்கிற்று. தோழி : தொழுவினுள் விட்ட ஏறுகள் எல்லாம் மேய்சச ; லுக்குப் போக, அமையாத சீரம் கண்கவரும் அழகும் உடைய ஆயர் மகளிரும் மைந்தரும், வளமிகுந்த ஓரிடத்தே சென்று தழுவிக் குரவையாடுவர். பொதுவனுடைய, பொல்லேற்றுக் கொம்பு வடுச் செய்த மார்பினைப் போற்றிப் பாடுவோம் வாருங்களடீ என்றாள் தலைவியிடம். தலைவி : நெற்றிச் செவலையின் ஆற்றலை அழித்தவனின் பரந்த மார்பிலே, முன்பு இகழ்ந்தவரின் கண்கள் சாயுமாறு, யான் தழுவாது அமைந்திருக்க மாட்டேன். ஆய்சச ; pயர் அல் எடுக்கபட்டு? இந்த ஆயர் மகள் அதனை இனிப் பெரிதாக எண்ணவே மாட்டாள். தோழீ! நாமெல்லாரும் ஒருங்கே ஆடும் இக்குரவைக் கூத்தினுள், நம்மை அருக்கினான் போலப் பார்த்து, நமக்கு வருத்தமுறும் நோயைச் செய்தானே, அது கருங்கண்ணுடைய கொலை ஏற்றத்தைத தழுவி யான் உன்னைக் கைக் கொண்டேன் என்னும் தருக்கு அல்லவோ? பாரடீ அந்த ஆயர் மகனை! தோழி : ஒத்த இழையினையுடையவளே! பிறராற் கொள்ளுதல் அரிதாக நின்றங கொல்லேறான காரியின் சினத்திற்கு அஞ்சாது பாய்ந்த பொதுவனுக்கே, ஆர்வமுடன் எம்மவரும் நின்னைக் கொடுக்க முடிவு செய்தனர். அலர் தூற்றிய ஊராரின் உச்சியிலே மித்தது போலல்லவோ செய்தனர்! இனி, ஏனடீ நீயும் வருந்துகிறாய்? கெடாத உருமேற்றை(இடி)யும் விடப் பெரியது முழங்கும் முரசினையுடைய பாண்டியனுக்கே இவ்வுலகு சேர்வதாக! அவனுடைய ஒரு மொழியையே அனைத்துலகும் கேட்பதாக! இவ்வாறு கூறுவோம் பழையதாகிய கதிரையுடைய சக்கரப் படையை உடைய திருமாலைப் போற்றுவேம். நீயம் வருக!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 2, section 2.6, p.45", "", "hard", "false"], ["SANG-2-7", "Sangam literature", "சங்க இலக்கியம் – முல்லைக்கலி 1–8: “பாடல் : 05 : நெஞ்சம் சென்றதடீ!” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – முல்லைக்கலி 1–8: Explain the poem/passage titled “பாடல் : 05 : நெஞ்சம் சென்றதடீ!” (section 2.7).", "தோழி கூற்று : அரைசு படக் கடந்து அட்டு ஆற்றின் தந்த, முரைசு கெழு முது குடி முரண் மிகு செல்வற்குச், சீர் மிகு சிறப்பினோன் தொல் குடிக்கு உரித்து எனப் பார் வளர் முத்தமொடு படு கடல் பயந்த ஆர்கலி உவகையர் ஒருங்கு உடன் கூடித் 5 தீது இன்று பொலிக என தெய்வக் கடி அயர்மார், வீவு இல் குடிப்பின் இருங்குடி ஆயரும், தாஇல் உள்ளமொடு துவன்றி ஆய்பு உடன், வள்உருள் நேமியான் வாய் வைத்த வளை போலத் தௌ;ளிதின் விளங்கும் சுரி நெற்றக் காரியும், 10 ஒரு குழையவன் மார்பில் ஒள் தார் போல் ஒளி மிகப் பொரு அறப் பொருந்திய செம்மறு வெள்ளையும், பெரும் பெயர் கணிச்சியோன் மணி மிடற்று அணி போல இரும் பிணர் எருத்தின் ஏந்து இமில் குராலும், அணங்கு உடை வச்சிரத்தோன் ஆயிரம் கண் ஏய்க்கும் 15 கணம் கொள் பல் பொறிக் கடும் சினப் புகரும் , வேல்வலான் உடைத் தாழ்ந்த விளங்கு வெண்துகில் ஏற்ப்ப வாலிது கிளர்ந்த வெண்கால் சேயுஉம், கால முன்பின் பிறவும் சால மடங்கலும் கணிச்சியும் காலனும் கூற்றும், 20 தொடர்ந்து செல் அமையத்து துவன்று உயிர் உணீஇய இடங்கு கொட்பன போல் புகுத்தனர் தொழு, அவ்வழி, கார் எதிர் கலி ஒலி கடி இடி உருமின் இயம் கறங்க, ஊர்பு எழு கிளர்பு உளர் புயல் மங்குலின் நறை பொங்க 25 நேர் இதழ் நிரை நிரை நெறி வெறிக் கோதையர் அணி நிற்பச், சீர் கெழு சிலை நிலைச் செயிர் இகல் மிகுதியின், சினப் பொதுவர் தூர்பு எழு துதை புதை துகள் விசும்பு உற எய்த, ஆர்பு உடன் பாய்ந்தார் அகத்து, மருப்பில் கொண்டும் மார்பு உற தழீஇயும், 30 எருத்து இடை அடங்கியும் இமில் இறப் புல்லியும், தோள் இடைப் புகுதந்தும் துதைந்து பாடு ஏற்றும், நிரைபு மேல் சென்றாரை நீள் மருப்பு உறச் சாடிக், கொள இடம் கொள விடா நிறுத்தன ஏறு. கொள்வாரைக் கொள்வாரைக் கோட்டுவாய் சாக் குத்திக் 35 கொள்வார் பெறாஅக் குரூஉச் செகில் காணிகா, செயிரின் குறை நாளால் பின் சென்று சாடி உயிர் உண்ணும் கூற்றமும் போன்ம். பாடு ஏற்றவரைப் படக் குத்திச் செங்காரிக் கோடு எழுந்து ஆடும் கண மணி காணிகா 40 நகை சால் அவிழ் பதம் நோக்கி நறவின் முகை சூழும் தும்பியும் போன்ம். இடைப் பாய்ந்து எருத்தத்துக் கொண்டானோடு எய்தி மிடைப் பாயும் வெள் ஏறு கண்டைகா, வாள்பொரு வானத்து அரவின் வாய் கோட்பட்டுப் 45 போதரும் பால் மதியும் போன்ம். ஆங்க ஏறும் பொதுவரும் மாறுற்று மாறா இருபெரு வேந்தரும் இகலி கண்ணுற்ற பொரு களம் போலும் தொழு, தோழி தன் நெஞ்சோடே தலைவி விரும்பக் கூறியது : வெல் புகழ் உயர்நிலைத் தொல் இயல் துதை புதை துளங்கு இமில்50 நல்ஏறு கொண்ட பொதுவன் முகன் நோக்கிப் பாடு இல ஆயமகள் கண். தலைவியை நோக்கித் தோழி கூறுதல் : நறு நுதால்! என் கொல் ஐங்கூந்தல் உளரச், சிறுமுல்லை நாறியதற்கு குறு மறுகி, ஒல்லாது உடன்று எமர் செய்தார் அவன் கொண்ட 55 கொல் ஏறு போலும் கதம்? நெட்டிரும் கூந்தலாய்! கண்டை, இஃது ஓர் சொல் கோட்டு இனத்து ஆயர் மகனொடு யாம் பட்டதற்கு எம் கண் எமரோ பொறுப்பர்; பொறாதார் தம் கண் பொடிவது எவன்? 60 தலைவி கூற்று : ஒண்ணுதால்! இன்ன உவகை பிறிது யாது யாய் என்னைக் கண் உடைக் கோலள் அலைத்ததற்கு, என்னை மலர் அணி கண்ணிப் பொதுவனோடு எண்ணி, அல் செய்து விட்டது இவ் ஊர்? 65 ஒன்றிப் புகர் இனத்து ஆயமகற்கு, ஒள் இழாய்! இன்று எவன் என்னை எமர் கொடுப்பது, அன்று அவன் மிக்குத் தன் மேல் சென்ற செங்காரிக் கோட்டு இடைப் புக்கக்கால் புக்கது என் நெஞ்சு? தோழி கூற்று : பாடு இமிழ் பரப்பு அகத்து அரவணை அசைஇய 70 ஆடு கொள் நேமியான் பரவுதும், நாடு கொண்டு இன் இசை முரசின் பொருப்பின், மன்னி அமைவரல் அருவி ஆர்க்கும் இமையத்து உம்பர் உம் விளங்குக, எனவே. 75 மாற்றானின் அரசுகள் பட்டு வீழும்படியாக அவரைக் கொன்று, அரச நெறியாலே அவர்கள் செல்வங்களைக் கொண்டு வரும். தலைமை மிகுந்த சிறப்புக்களை உடையவன் பாண்டியன். அவனுடைய பழைதாகிய குடிக்கு உரியதென்று கூறப்படும் பாண்டி மண்டலத்து விளைவுகளும், கடல்தரும் முத்தும், பிறவும் என்றும் குறைவின்றிப் பெருக வேண்டும். முரண் மிகுந்த அரசர்களிடையே, சீர் மிகுந்த சிறப்பினோன் அவன். அவன் வாழ்க! என உள்ளத்திலே கொண்டு, தெய்வத்திற்குச் சிறப்புக்களைச் செய்து, ஆயர்கள் வழிப்பட்டனர். புகழ்பெற்ற பாண்டிநாட்டுக் குடிகளுள் ஒருவரான ஆயர். அதன்பின், ஆர்வமுடன் ஏறு தழுவுதல் விழாவுக்கானவற்றையும் செய்தனர் . திருமாலின் சங்கம் போல நெற்றியிலே சங்கு வெள்ளைச் சுட்டியுடன் விளங்கிய கரிய ஏறு ஒன்று, பலராமன் மார்பிலே சிவந்த மாலை விளங்குவது போலச் சிவப்பு மறு விளங்கும் வெள்ளை நிற ஏறு ஒன்று. சிவபிரானின் நீலமணிக் கழுத்துப் போலத் தன் கழுத்தும் கபில் நிறம் கொண்ட ஏறு ஒன்று, ஆயிரங்கண் இந்திரன் போலப் பல புள்ளிகளுடன் விளங்கிய புகர் நிறத்து எருது ஒன்று, முருகன் அணிந்த வெள்ளைத் துகில்போல் வெள்ளைக் கால்களையுடைய சிந்த ஏறு ஒன்று. இவற்றுடன், இவை பேலக்காலனது வலியுடைய பிறவும் ஒருங்கு சேரத், தொழுவுள் ஏறுகளைப் போகவிட்டனர். ஊழியிறுதியிலே, தீயும், கணிச்சியும், காலனும், கூற்றவனும் உயிர்களை வாங்கச் சுழன்று சுழன்று ஒன்றாகத் திரியுமாறு போல, அவை எல்லாம் தொழுவினுள் சுழன்று சுழன்று சுற்றிக்கொண்டிருந்தன. அவ்வேளையிலே, மழைக்காலத்து இடிமுழக்குப் போன்று வாத்தியங்கள் சேர்ந்து ஒலித்தன. வானிலே மேகக்கூட்டம் செல்வனபோலப் புகைப்படலமும் எழுந்தது. மாலையணிந்த ஆயர் மகளிர் வந்து நிரைநிரையாக நின்றனர். பொதுவர்கள் போர்ச் சினம் மூளவரும் ஆரவாரத்தால் எழுந்த புழுதிப்படலம், வானை எழுந்து முட்டியது. அவர்கள் தொழுவினுள் சீறிப் பாய்ந்தனர். அங்ஙனம் பாய்ந்து, ஏற்றின் கொம்பைப் பற்றி மார்புடன் தழுவிக் கொண்டனர் சிலர். கழுத்திலே இறுகப் பற்றிக் கிடந்தனர் சிலர். திமில் முறியும்படி தழுவினர் சிலர், திமில் முறியும்படி தழுவினர் சிலர், தோளுக்குள் கழுத்தைப் புகவிட்டுப் பிடித்தனர் சிலர், கொம்புகள் தம் உடலின் மேல் படுவதை அஞ்சாது ஏற்றுக் கொண்டனர் சிலர். இவ்வாறு ஆயர் ஏறு தழுவுதலைத் தொடங்கியதும், ஏறுகளும் வாளாயிருக்கவில்லை. தம்மைப் பிடித்தவர்களை, ஒவ்வொன்றும் அலைத்தும் குத்தியும் வருத்திற்று. அந்த நிலையிலே, முதலிற் சென்றவனைக் குத்திக் கொன்றுவிட்டுப் பின்னும், யாவரும் அருகே செல்ல அஞ்சுமாறு செல்லும், செவலையைப் பாரடீ! சாவுவேளை நெருங்கியவரிடம் கூற்றம் நெருங்குவது போலல்லவோ அது ஆயரிளைஞரை நெருங்குவதும் தோன்றுகின்றது! தன்னைத் தழுவியவனைச் சாவுமாறு குத்திய செங்காரியானது, தன் கொம்புகளின் மேலே அவனைத் தூக்கி வைத்து ஆடுகின்றது. அதன் கழுத்து மணிகளைப் பாரடீ! குருதியிலே தோய்ந்த அவற்றை, முகையவிழ்ந்த நறவம் பூவென வண்டினம் சென்று மொய்ப்பதையும் காணடீ! இடையே பாய்ந்து கழுத்தைத் தழுவிக் கொண்டவனோடு, பரணின் மீதும் தாவிப் பாய்கின்ற வெள்ளையைப் பாரடீ! கரும்பாம்பினால் சிறிதே விழுங்கப்பட்ட சந்திரன், வானத்திலே செல்வது போன்று அது விளங்குவதையும் காணடீ! இவ்வாறு ஏறுகளும் பொதுவரும் தம்முள் கலந்து போரிட, அத் தொழுவானது, இருபெரும் வேந்தர்கள் மாறுபட்டு எதிர்ப்பட்ட போர்க்களம் போலக் கொடியதாகக் காட்சியளித்தது. (தோழி, இதுவரை தொழுவைக்காட்டிஎ நிகழ்சச ; யைக் கூறினாள். இதன்பின், தன் நெஞ்சுடன் சொல்வதுபோலத் தலைவி கேட்கக் கூறுகிறாள்) கழுத்து முழுதையும் மறைக்கின்ற திமிலுடன் விளங்கும் நல்லேற்றைக் கொண்ட, பொதுவனின் முகத்தை நோக்கி நோக்கி, இந்த ஆயமகளின் கண்களும் இமையாதிருக்கின்றனவே! நறுநுதலாளே! என் கூந்தலிலே கமழ்ந்த வெண்ணெய் மணம் ஒரு நாள் நீங்கி, முல்லை மணம் வீசுதலைக் கண்டதும், என் சுற்றத்தார் சினந்து எழுந்து கடிந்து கொண்டனரே! அஃது இக் கொல்லேற்றுச் சினம் போலிருந்ததடீ! கறுத்து நீண்ட கூந்தலுடையவளே! இஃதோர் சொல். இதனையும் எண்ணுவாய், எருமை இனத்தையுடைய ஆயர் மகனோடு யாம் கூடியதற்கு எம் சுற்றத்தார்கூடப் பொறுப்பார்கள். பொறாத அயலார்களின் கண்கள் அனல் கக்குவது ஏனோடீ! தலைவி : ஒள்ளிய நுதலாய்! என் அன்னை என்னைக் கண்ணை ஒஞறுத்து நேறாக்கி வருந்தினாள். அதனைக் கண்ட இவ்வூர் மலரணி கண்ணிப் பொதுவனோடு தொடர்புடையேன் யான்’ என்றெண்ணி, அல் செய்துவிட்டது. அது தான் ஏனோடி? ஒள்ளிழாய்! அன்று, பசுத்திரளையுடைய ஆயர் மகனுக்கே நின்னைக் கொடுப்பேன் என்றனரே? இன்று என் சுற்றத்தார் என்னைக் கொடுப்பதற்கு என்னடீ இருக்கிறது! தன்மேலம் மிக்குச் சென்ற செங்காரிக் கொம்பிடையிலே அவன் புகுந்து தழுவினானே, அப்பொழுதே என் நெஞ்சமும் அவன்பாற் சென்றுவிட்டதேடீ! “நீங்காத அருவிகள் முழங்கும் இமயத்திற்கு வடபால் உள்ள நாடுகளையும் வெற்றிகொண்டு, இன்னிசை முரசினனான நம் பாண்டியன், சிறப்புற்று விளங்குவானா” என்று முழங்குத் கடற்பரப்பிலே, அரவணையில் துயிலும் வெற்றிச் சக்கரத்தினை உடைய திருமாலைப் பாடிப் பாடி குரவையாடலாம் வாடீ!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 2, section 2.7, p.49", "", "hard", "false"], ["SANG-2-8", "Sangam literature", "சங்க இலக்கியம் – முல்லைக்கலி 1–8: “பாடல் : 6 : முலை வேது ஒற்றுவோம்!” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – முல்லைக்கலி 1–8: Explain the poem/passage titled “பாடல் : 6 : முலை வேது ஒற்றுவோம்!” (section 2.8).", "ஏறு கோடல் : கழுவொடு சுடுபடை சுருக்கிய தோல் கண், இமிழ் இசைம ண்டை உறியொடு தூக்கி, ஒழுகிய கொன்றைத் தீம் குழல் முரற்சியர் வழு சொல் கோவலர், தம் தம் இன நிரை பொழுதொடு தோன்றிய கார் நனை வியன் புலத்தார். 5 அவ்வழி, நீறு எடுப்பவை நிலம் சாடுபவை, மாமறு ஏற்றுச் சிலைப்பவை மண்டிப் பாய்பவையாய்த், துளங்கு இமில் நல் ஏற்று இனம் பல களம் புகும் மள்ளர் வனப்பு ஒத்தன் 10 தாக்குபு தம் உள் பெயர்த்து ஒற்றி எவ்வாயும் வைவயாய் மருப்பினால் மாறாது குத்தலின் மெய் வார் குருதிய ஏறு எல்லாம் பெய் காலைக் கொண்டல் நிரை ஒத்தன. அவ் ஏற்றை, 15 பிரிவு கொண்டு இடைப் போக்கி, இனத்தோடு புனத்து ஏற்றி, இரு திறனா நீக்கும் பொதுவர், உரு கெழு மா நிலம் இயற்றுவான். விரி திரை நீக்குவான் வியன் குறிப்பு ஒத்தனர். அவரைக் கழல உழக்கி எதிர் சென்று சாடி, 20 அழல்வாய் மருப்பினால் குத்தி, உழலை மரத்தைப் போல் தொட்டன ஏறு. தொட்ட தம் புண் வார் குருதியால் கை பிசைந்து மெய் திமிரித், தங்கார் பொதுவர், கடலுள் பரதவர் அம்பி ஊர்ந்தாங்கு ஊர்ந்தார் ஏறு. 25 ஏறு தம் கோலம் செய் மருப்பினால் தோண்டிய வரிக்குடர் ஞாலம் கொண்டு எழும் பருந்தின் வாய் வழீஇ, ஆலும் கடம்பும் அணிமார் விலங்கிட்ட மாலை போல் தூங்கும் சினை. குரவை ஆடுதல் : ஆங்கு, 30 தம் புல ஏறு பரத்தர உய்த்த தம் அன்பு உறு காதலர் கை பிணைந்து ஆய்சச ; pயர் இன்புற்று அயர்வர் தழு. முயங்கிப் பொதிவேம், முயங்கிப் பொதிவேம், முலை வேதின் ஒற்றி முயங்கிப் பொதிவேம். 35 கொலை ஏறு சாடிய புண்ணை, எம் கேளே! பல் ஊழ் தயிர் கடையத் தாஅய் புள்ளி மேல் கொல் ஏறு கொண்டான் குருதி மயக்குறப் புல்லல் எம் தோளிற்கு அணியோ, எம் கேளே! ஆங்கு, போர் ஏற்று அருந்தலை அஞ்சலும், ஆய்சச ; pயர் 40 காரிகை தோள் காமுறுதலும், இவ்விரண்டும் ஓராங்குச் சேறல் இலவோ, எம் கேளே! கொல் ஏறு கொண்டான் இவள் கேள்வன் என்று ஊரார் சொல்லும் சொல் கேளா அளை மாறி யாம் வரும் செல்வம் எம் கேள்வன் தருமோ? எம்கேளே! 45 தென்னவன் வாழ்க எனக் கானத்தைப் பாடுதல் : ஆங்க, அருந்தலை ஏற்றொடு காதலர்ப் பேணிச் சுரும்பு இமிர் கானம் நாம் பாடினம் பரவுதும்; ஏற்றவர் புலங் கெடத் திறை கொண்டு மாற்றாரைக் கடக்க, எம் மறங்கொழு கோவே. 50 கார் காலம் தொடங்கிற்று, நிலமெல்லாம் மழை பெய்தலால் நனைந்து பசுமையோடும் விளங்கிற்று. தம் நிரைகளை ஊருள் மடக்கியவராக் கோவலரும் தத்தம் சேரியிலே வந்து தங்கினர். தோற்பையிலே கழுவோடு சூட்டுக்கோலும் கொண்டவர்களாக செல்வராயினர் சிலர். புகழ் பெற்ற பாற் கலங்கள் பலவும் உறிகளிலே தொங்கின. கொன்றைத் தீங்குழலினை இசைத்து இன்புற்றிருந்தனர் சிலர். வளமான ஏறுகள் நிரையிலே அமைந்திருக்கவில்லை. கொழுத்த திமிலுடன் அந்த நல்லேறுகள் விளங்கின. முன்னர் காலத்திலே தரையைக் கிளறிப் புழுதிப்படலம் எழுப்பியவை, இப்போது ஈரமண்ணைக் கிளறின. ஒன்றுடனொன்று மாமறுகொண்டு, எப்போதும் சண்டையிட்டன. அவையெல்லாம், போர்களம் புகும் வீரமறவரைப் போன்று, பெரிதும் கம்பீரமாக விளங்கின. ஒன்றுடன் ஒன்று தாக்கி, தம்முள் விட்டு நீங்கி, எப்புறத்தும் கூரிய முனையுடைய கொம்புகளால் மீண்டும் மீண்டும் குறி தவறாது குத்துதலால், அவற்றின் உடல் முழுதும் செங்குருதி வெள்ளமாகக் காணப்பட்டது. மழைக்காலத்துக் காலையிலே, செஞ்ஞாயிற்று ஒளியினிலே திகழும் வெண்மேகத்திரளைப் போல அவை தோன்றின. அந்த ஏறுகளைப் பிரித்து, இடையிலே பிற மாடுகளைப் போக்கிப் புனத்திற் செலுத்தி, இரு திறனாக நீக்கும் பொதுவர்கள் எல்லாம். உலகைப் படைக்க எண்ணி முதல்வன், ஆதி நாளிலே விரிகடலை ஒதுக்கும் அதுபோலக் காணப்பட்டனர். அவரைக் கலங்கி ஓடுமாறு மிதித்தும், எதிர் சென்று சாடியும், சுடர்நுனி போன்ற கொம்பினாற் குத்தியும் புண்படுத்திய ஏறுகள், உழலை மரத்தைப்போல அவர்களின் உடல்களைத் தொளைத்தன. தொளைபட்ட புண்களிலிருந்து வழியும் குருதி பட்டுக் கைவழுக்கவே, மணலால் கையைப் பிசைந்து, திமிரி எழுந்து சற்றும் தாழ்வாக நில்லாதவராகிப், பரதவர் சிறு தெப்பம் ஏறியதுபோல் ஏறுகளின்மேற் பாய்ந்து தழுவி அடக்கினர் பொதுவர்கள். ஏறுகளின் கொம்புகளிலே சிக்கி வீழ்ந்த பொதுவரின் குடர்களைப் பருந்துகள் எடுத்துகொண்டு, வானிற் பறந்தன. அவற்றின் வாய்க்குத் தப்பி ஆலமரத்தின் மேலும் கடப்ப மரத்தின் மேலும் வீழ்ந்த குடர்கள் எல்லாம், அவற்றின் கீழ் உறையும் தெய்வட்கு இட்டுப் பின் கழற்றி எறிந்த மாலைகளைப் போல அம்மரக்கிளைகளிலே தொங்கின. அவ்வேளையிலே, ஆய்சச ; pயர். மேயும் புலத்திலே பரவலாக மாடுகளைப் போகவிட்ட தம் அன்புறு காதலரோடு கை கோர்த்து இன்புற்றுத் தழுவியாடுங் குரவைக் கூத்தினையும் ஆடுவார்கள். தோழி! எம் காதலனைக் கொலையேறு சாடிக் குத்திச் செய்த புண்களை யெல்லாம், முலைவேதினாலர் ஒற்றி ஒற்றித் தழுவித் தழுவிப் பொதிவோமடீ! நாம்! தோழி! பலமுறை தயிர் கடையும்போது என் தோளிலே பாய்ந்த தயிர்ப்புள்ளிகளின் மேலே, கொல்லேற்றத்தைத் தழுவிப் புண்பட்டவனின் உடலிலிருந்து வடியுங் குருதி கலந்து மயங்குமாறு தழுவுதலால், என் தோளிற்கு அழகு மட்டுமோடீ! அதனினும் அது சிறந்ததல்லவோடீ! எம் தோழியே! பொருகின்ற ஏற்றினது சேருதற்கரிய தலையைக் கண்டு அஞ்சுதலும், ஆய்சச ; pயரின் அழகுமிக்க தோளினை விரும்புதலும், ஒன்றாகச் செல்லுதல் என்பது என்றுமே இல்லையடி! இவள் கணவன் கொல்லேறும் கொண்டான் என்று ஊரார் சொல்லும் சொல்லினைக் கேட்டவாறே. யான் மோர் விற்று வருகின்ற இன்பத்தை, என் காதலனும் எனக்குத் தருவானோடீ! அரிய தலைமையுடைய ஏற்றையும், நம் காதலரையும் பேணிச், சுரும்பினம் ஒலிப்பது போன்ற கானத்தைப் பாடினோமாகத் திருமாலைப் போற்றுவோம், அதனோடு எதிர்த்தவர் நாடு அழிய அவரை வென்று திரை கொண்டு, மாற்றாரை என்றும் வெல்க எம் மறம் பொருந்திய பாண்டியன்! எனவும் பாடுவோம் வா!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 2, section 2.8, p.53", "", "hard", "false"], ["SANG-2-9", "Sangam literature", "சங்க இலக்கியம் – முல்லைக்கலி 1–8: “பாடல் : 7 : தெய்வம் அல்லவா காட்டிற்று” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – முல்லைக்கலி 1–8: Explain the poem/passage titled “பாடல் : 7 : தெய்வம் அல்லவா காட்டிற்று” (section 2.9).", "தலைவி கூற்று : “எல்லா! இஃது ஒன்று கூறு! குறும்பு இவர் பல் இனத்தார்ககு ; ம், குடம் சுட்டவர்ககு ; ம், எம் கொல் ஏறு கோடல் குறை எனக் கோவினத்தார் பல்ஏறு பெய்தார் தொழு. தொழுவத்து, 5 சில்லைச் செவி மறைக் கொண்டவன் சென்னிக் குவி முல்லை கோட்டம் காழ் கோட்டின் எடுத்துக்கொண்டு, ஆட்டிய ஏழை இரும்புகர் பொங்க, அப் பூ வந்து என் கூழையுள் வீழ்ந்தன்று மன். அதனைக் கெடுத்தது பெற்றார் போல் கொண்டு யான் முடித்தது. 10 கேட்டனள் என்பவோ யாய்?” தோழி கூற்று : “கேட்டால் எவன் செய்ய வேண்டுமோ? மற்றிகா அவன் கண்ணி அன்றோ அது?” தலைவி கூற்று : “பெய் போது அறியாத் தன் கூழையுள் ஏதிலான் கை புனை கண்ணி முடித்தாள் என்று யாய் கேட்பின் 15 செய்வது இல் ஆகுமோ மற்று?” தோழி கூற்று : “எல்லாத் தவறும் அறும்;” தலைவி கூற்று : “ஓஒ அஃது அறும் ஆறுமாறு?” தோழியின் வினாவும் தலைவியின் பதிலும் : “ஆயர்மகன் ஆயின், ஆயமகள் நீ ஆயின், நின் வெய்யன் ஆயின், அவன் வெய்யை நீ ஆயின், 20 அன்னை நோதக்கதோ இல்லை மன்”; “நின் நெஞ்சம் அன்னை நெஞ்சு ஆகப் பெறின்”, தோழி கூற்று : அன்னையோ! ஆயர் மகளையும் காதலை கைம்மிக, ஞாயையும் அஞ்சுதி ஆயின், அரிது அரோ, 25 ; மருந்து”, நீ உற்ற நோய்ககு தலைவி கூற்று : “மருந்து இன்று யான் உற்ற துயர் ஆயின், எல்லா! வருந்துவேன் அல்லனோ யான்?” தோழி : “வருந்தாதி! மண்ணி மாசு அற்ற நின் கூழையுள் ஏறு அவன், 30 கண்ணி தந்திட்டது எனக் கேட்டுத் ‘திண்ணிதாகத் தெய்வ மால் கட்டிற்று இவட்கு’ என, நின்னை அப் பொய் இல் பொதுவற்கு கொடை சூழ்ந்தார் தந்தையோடு ஐயன்மார் எல்லாம் ஒருங்கு”, 35 தலைவி : ஏடீ! இஃதொன்று அறிவாயோ? குறும்புகளிலே திரிகின்ற ஆட்டிடையர்க்கும், குடப்பால் சுரக்கும் பசு என்று சுட்டிக் கூறும் நல்லினத்து ஆயருக்கும், எமன் கொல்லேறு தழுவிக் கொள்ளுதல் செய்தற்குரியது? என்று அறிவித்துக், கோவினத்தார், பல ஏறுகளைத் தொழுவினுள் போக விட்டாரடீ! அவ்விடத்திலே, பெரிய புகரேற்றைத் தழுவினவன் தலையிலிருந்த முல்லைக் கண்ணியை, அந்த ஏறு தன் கொம்பினால் அலைத்து எடுத்துத் துள்ளும்போது, அக்கண்ணி என் கூந்தலுள் வந்து விழுந்ததடீ! அதனைக் கெடுத்தது ஒன்றை மீண்டும் பெற்றவளைப்போல் ஆர்வமுடன், நான் என் கூந்தலுள் கொண்டு முடித்ததை என் தாய் கேட்டுவிட்டாலோடி! இதற்கொரு பதில் சொல்லடீ! தோழி : கேட்டால் என்னடீ. செய்ய வேண்டுமென்கிறாய்? அஃது நின் காதற்குரிய அவன் கண்ணிதானேடீ! தலைவி : என்ன பூ வைத்து முடிப்பதென்றே அறியாதவளோ இவள்? தன் கூந்தலுள் எவனோ ஒருவன் கையாற் புனைந்த கண்ணியை முடித்தாளே? என்று தாய் கேட்டால், நாம் செய்வதற்கு ஏதொன்றும் இல்லையோடீ? தோழி : எல்லாத் தவறுகளும் அப்போதே ஒழிந்துவிடும். தலைவி : ஓஓ! அஃது ஒழிவது தான் எப்படியோ? தோழி : அவனோர் ஆயர்மகன், நீயோ ஆயர்மகள். அவன் உன்னை விரும்புகிறான். நீயம் அவனை விரும்புகின்றாய். அன்னை நொந்து கொள்வதற்கு இதில் எதுவுமே இல்லையேடீ? தலைவி : உன் நெஞ்சமே என் அன்னையின் நெஞ்சமாகப் பெற்றால்தானே, அப்படி? தோழி : அம்மையோ! ஆயர்மகனையும் எல்லை இன்றி காதலிக்கிறாய், தாய்ககு; ம் பயப்படுகிறாய். இப்படியிருந்தால், நீ கொண்ட நோய்ககு ; மருந்து வாய்ப்பதே அரிதுதான். தலைவி : ஏடீ! யான் உற்ற காதல் நோய்ககு ; மருந்தே இல்லையானால், யான் மிகவும் வருந்துவேன் அல்லவோ? தோழி : வருந்தாதே! மாசறக் கழுவப் பெற்ற நின் கூந்தலுள், ஏறு, அவன் கண்ணியை வீசிற்று எனக் கேட்டு, உறுதியாகத் தெய்வமல்லவோ இவன்தான் இவளுக்கு உரியவன் எனக் காட்டிற்று! என்று, உன் தந்தையோடு தமையன்மார் எல்லாரும், உன்னை அப்பொதுவனுக்கே மணஞ் செய்து தர முடிவு செய்துவிட்டனரடீ!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 2, section 2.9, p.56", "", "hard", "false"], ["SANG-2-10", "Sangam literature", "சங்க இலக்கியம் – முல்லைக்கலி 1–8: “பாடல் : 8 : காஞ்சிக்கீழ் வா!” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – முல்லைக்கலி 1–8: Explain the poem/passage titled “பாடல் : 8 : காஞ்சிக்கீழ் வா!” (section 2.10).", "தலைவன் கூற்று : “இகல் வேந்தன் சேனை இறுத்தவாய் போல, அகல் அல்குல் தோள் கண் என மூவழிப் பெருகி, நுதல் அடி நுசுப்பு என மூவழி சிறுகிக் கவலையால் காமனும் படை விடு வனப்பினோடு, அகல் ஆங்கண் அளை மாறி, மலமந்து, பெயருங்கால், 5 நகை வல்லேன் யான் என்று என் உயிரோடு படை தொட்ட இகலாட்டி, நின்னை எவன் பிழைத்தேன், எல்லா யான்?” தலைவி கூற்று : “அஃது அவலம் அன்று மன, ஆயர் எமர் ஆனால் ஆய்த்தியேம் யாம் மிகக் காயாம் பூம் கண்ணிக் கருந்துவர் ஆடையை 10 மேயும் நிரை முன்னர்க் கோல் ஊன்றி நின்றாய், ஓர் ஆயனை அல்லை பிறவோ, அமரர் உள் ஞாயிற்றுப் புத்தேள் மகன்?” தலைவன் கூற்று : “அதனால் வாய்வாளேன், முல்லை முகையும் முருந்தும் நிரைத்தன்ன 15 பல்லும் பணைத் தோளும், பேர் அமர் உண்கண்ணும், நல்லேன் யான் என்று நலம் தகை நம்பிய சொல்லாட்டி, நின்னொடு சொல் ஆற்றுகிற்பார் யார்?” தலைவி கூற்று : “சொல்லாதி” போகாமல் உன்னை விலக்கினேன் என்ற தலைவனுக்குத் தலைவி கூறுதல் :“நின்னை தகைத்தனென்” “அல்லல் காண் மன், 20 மண்டாத கூறி மழ குழக்கு ஆகின்றே, கண்ட பொழுதே கடவரைப் பேல நீ பண்டம் வினாய படிற்றால் தொடீஇய நின் கொண்டது எவன் எல்லா யான்?” தலைவன் கூற்று கொண்டது, 25 அளை மாறிப் பெயர்தருவாய், அறிதியோ? அஞ்ஞான்று தளவ மலர் ததைந்தது ஓர் கானச் சி;ற்றாற்று அயல், இள மாங்காய் போழ்ந்தன்ன கண்ணினால், என் நெஞ்சம் களமாக் கொண்டு ஆண்டாய் ஓர் கள்வியை அல்லையோ?” தலைவி கூற்று : “நின் நெஞ்சம் களமாக் கொண்டு யாம் ஆளல் எமக்கு எவன் எளிது ஆகும்? 30 புனத்து உளான் என் ஐக்குப் புகா உய்த்துக் கொடுப்பதோ? இனத்து உளான் எந்தைக்குக் கலத்தொடு செல்வதோ? தினைக் காலுள் யாய் விட்ட கன்று மேய்க்கிற்பதோ?” தலைவன் கூற்று :
