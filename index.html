āppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 283: “பனையும் அரையும் ஆவிரைக் கிளவியும் நினையுங்காலை அம்மொடு சிவணும் ஐஎன் இறுதி அரை வரைந்து கெடுமே மெய்அவண் ஒழிய என்மனார் புலவர்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 283: “பனையும் அரையும் ஆவிரைக் கிளவியும் நினையுங்காலை அம்மொடு சிவணும் ஐஎன் இறுதி அரை வரைந்து கெடுமே மெய்அவண் ஒழிய என்மனார் புலவர்.” — What does this sutra state?", "பனை. அரை, ஆவிரை என்னும் சொற்கள் ஆராயுங்காலத்து அம்முச் சாரியையொடு பொருந்தி முடியும். அவ்விடத்து ஐகார ஈறு அரை என்னும் சொல்லினை நீக்கி ஏனைய இரண்டன்கண்ணும் தானூர்ந்த மெய்யெழுத்து நிற்கக் கெடும் என்பர் புலவர். எ-டு.: பனங்காய், பனஞ்செதிள், பனந்தோல், பனம்பூ என்பதில் பனை என்பது வல்லெழுத்து மிகாது அம்முச்சாரியை பெற்று, ஈற்று ஐகாரம் கெட்டு முடிந்தது. ஆவிரங்கோடு, ஆவிரஞ்செதிள், ஆவிரந்தோள், ஆவிரம்பூ - ஆவிரை என்பது வல்லெழுத்து மிகாது அம்முச்சாரியை பெற்று, ஈற்று ஐகாரம் கெட்டு முடிந்தது. அரையங்கோடு, அரையஞ்செதிள், அரையந்தோள், அரையம்பூ- அரை என்பது வல்லெழுத்து மிகாது அம்முச்சாரியை பெற்று, ஈற்று ஐகாரம் கெட்டு முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.119, நூ. 283", "", "hard", "false"], ["TOLK-284", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 284: “பனையின் முன்னர் அட்டு வருகாலை நிலையின்றாகும் ஐ என் உயிரே ஆகாரம் வருதல் ஆவயி னான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 284: “பனையின் முன்னர் அட்டு வருகாலை நிலையின்றாகும் ஐ என் உயிரே ஆகாரம் வருதல் ஆவயி னான.” — What does this sutra state?", "பனை என்னும் சொல் முன்னர் அட்டு எனும் சொல் வருங்காலத்து, ஈற்று ஐகாரம் நிற்றல் இன்று. அவ்விடத்திற்கேற்ற ஆகாரம் வரும். எ-டு.: பனை+அட்டுஸ்ரீபனாட்டு. பனாட்டு - பனையினது தீங்கட்டி.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.120, நூ. 284", "", "easy", "false"], ["TOLK-285", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 285: “கொடிமுன் வரினே, ஐஅவண் நிற்பக் கடிநிலை இன்றே வல்லெழுத்து மிகுதி.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 285: “கொடிமுன் வரினே, ஐஅவண் நிற்பக் கடிநிலை இன்றே வல்லெழுத்து மிகுதி.” — What does this sutra state?", "பனை முன்னர்க் கொடி என்னும் சொல் வரின், ஐகாரம் கெடாது நிற்க, வல்லெழுத்து மிக்கு முடியும். எ-டு.: பனை+கொடிஸ்ரீபனைக்கொடி.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.120, நூ. 285", "", "easy", "false"], ["TOLK-287", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 287: “மழை என்னும் கிளவி வளிஇயல் நிலையும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 287: “மழை என்னும் கிளவி வளிஇயல் நிலையும்.” — What does this sutra state?", "மழை என்னும் ஐகார ஈற்றுச்சொல் வளி என்னும் இகர ஈற்றுச் சொல்போல அத்துச் சாரியையினையும் இன் சாரியையினையும் பெற்று முடியும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.121, நூ. 287", "", "easy", "false"], ["TOLK-288", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 288: “செய்யுள் மருங்கின் வேட்கை என்னும் ஐஎன் இறுதி அவாமுன் வரினே மெய்யொடும் கெடுதல் என்மனார் புலவர் டகாரம் ணகாரம் ஆதல் வேண்டும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 288: “செய்யுள் மருங்கின் வேட்கை என்னும் ஐஎன் இறுதி அவாமுன் வரினே மெய்யொடும் கெடுதல் என்மனார் புலவர் டகாரம் ணகாரம் ஆதல் வேண்டும்.” — What does this sutra state?", "இது ஐகார ஈற்றுச்சொல் ஒன்றனுக்குச் செய்யுள் முடிபு கூறுகிறது. எ-டு.: வேணவா நலிய வெய்ய உயிரா (நற். 61) என்று வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.121, நூ. 288", "", "easy", "false"], ["TOLK-289", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 289: “ஓகார இறுதி ஏகார இயற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 289: “ஓகார இறுதி ஏகார இயற்றே.” — What does this sutra state?", "இது ஓகார ஈற்று அல்வழி முடிபு கூறுகிறது. எ-டு.: ஓக்கடிது, ஓச்சிறிது, ஓத்தீது, ஓப்பெரிது-ஓகார ஈற்றுப்பெயர் அல்வழிக்கண் வல்லெழுத்து மிக்கு முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.122, நூ. 289", "", "easy", "false"], ["TOLK-290", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 290: “மாறுகொள் எச்சமும் வினாவும் ஐயமும் கூறிய வல்லெழுத்து இயற்கை ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 290: “மாறுகொள் எச்சமும் வினாவும் ஐயமும் கூறிய வல்லெழுத்து இயற்கை ஆகும்.” — What does this sutra state?", "இது ஓகார ஈற்று இடைச்சொல்லுக்கு அல்வழி முடிபு கூறுகிறது. எ.டு.: யானோ கொண்டேன்? மாறுகொள் எச்சப்பொருளில் ஓகாரம் இயல்பாயிற்று. யான் கொண்டிலேன் என்பது இதன் பொருள். நீயோ கொண்டாய்? - ஐயப்பொருளில் வந்த ஓகாரம் இயல்பாயிற்று. புற்றோ? புதலோ? - ஐயப்பொருளில் வந்த ஓகாரம் இயல்பாயிற்று.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.122, நூ. 290", "", "medium", "false"], ["TOLK-291", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 291: “ஒழிந்ததன் நிலையும் மொழிந்தவற்று இயற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 291: “ஒழிந்ததன் நிலையும் மொழிந்தவற்று இயற்றே.” — What does this sutra state?", "ஒழிந்ததொன்றனைத் தருவதாகிய ஒழியிசைப் பொருளில் வரும் ஓகாரமும், மேற்கூறிய ஓகாரங்களின் இயல்பிற்றாய் வல்லெழுத்து இயல்பாய் முடியும். எ-டு.: கொளலோ கொண்டான் என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.122, நூ. 291", "", "easy", "false"], ["TOLK-293", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 293: “இல்லொடு கிளப்பின் இயற்கை ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 293: “இல்லொடு கிளப்பின் இயற்கை ஆகும்.” — What does this sutra state?", "கோ என்னும் ஓகார ஈற்று மொழியினை இல் எனும் வருமொழியோடு சேர்த்துக் கூறின் ஒகரம் வராது இயல்பாகும். எ-டு.: கோ+இல்ஸ்ரீகோயில் எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.123, நூ. 293", "", "easy", "false"], ["TOLK-294", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 294: “உருபியல் நிலையும் மொழியு மாருளவே ஆவயின் வல்லெழுத்து இயற்கையாகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 294: “உருபியல் நிலையும் மொழியு மாருளவே ஆவயின் வல்லெழுத்து இயற்கையாகும்.” — What does this sutra state?", "கோ என்பது உருபு புணர்ச்சி இயல்பில் நிலைபெறும் மொழியாய் நிற்றலும் உண்டு. அவ்வாறு நிற்குங்கால் வல்லெழுத்து இயல்பாய் முடியும். எ-டு.: கோஒன்கை, கோஒன்செவி, கோஒன்றலை, கோஒன் புறம் - கோ என்பது வேற்றுமைக்கண் வல்லெழுத்து மிகாது ஒன் சாரியை பெற்று வந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.123, நூ. 294", "", "medium", "false"], ["TOLK-295", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 295: “ஔகார இறுதிப் பெயர்நிலை முன்னர் அல்வழியானும் வேற்றுமைக் கண்ணும் வல்லெழுத்து மிகுதல் வரைநிலை இன்றே அவ்இரு ஈற்றும் உகரம் வருதல் செவ்விது என்ப சிறந்திசி னோரே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 295: “ஔகார இறுதிப் பெயர்நிலை முன்னர் அல்வழியானும் வேற்றுமைக் கண்ணும் வல்லெழுத்து மிகுதல் வரைநிலை இன்றே அவ்இரு ஈற்றும் உகரம் வருதல் செவ்விது என்ப சிறந்திசி னோரே.” — What does this sutra state?", "இஃது ஔகார ஈற்றுப்பெயர் அல்வழிக்கண்ணும், வேற்றுமைக்கண்ணும் முடியுமாறு கூறுகிறது. எ-டு.: கௌவுக் கடிது, கௌவுச்சிறிது, கௌவுத்தீது, கௌவுப்பெரிது-ஒளகார ஈற்றுப்பெயர் அல்வழிக்கண் உகரமும் வல்லெழுத்தும் பெற்றது. கௌவுக்கடுமை, கௌவுச்சிறுமை, கௌவுத்தீமை, கௌவுப்பெருமை-ஔகார ஈற்றுப்பெயர் வேற்றுமைக்கண் உகரமும் வல்லெழுத்தும் பெற்று முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.123, நூ. 295", "", "medium", "false"], ["TOLK-296", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 296: “ஞகாரை ஒற்றிய தொழிற்பெயர் முன்னர் அல்லது கிளப்பினும் வேற்றுமைக் கண்ணும் வல்லெழுத்து இயையின் அவ்வெழுத்து மிகுமே உகரம் வருதல் ஆவயினான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 296: “ஞகாரை ஒற்றிய தொழிற்பெயர் முன்னர் அல்லது கிளப்பினும் வேற்றுமைக் கண்ணும் வல்லெழுத்து இயையின் அவ்வெழுத்து மிகுமே உகரம் வருதல் ஆவயினான.” — What does this sutra state?", "இது ஞகர ஈற்றுத் தொழிற்பெயர் இருவழியும் வன்கணத்தோடு புணருமாறு கூறுகிறது. அதாவது, உரிஞ் என்னும் ஞகார ஒற்றிய தொழிற்பெயர் முன்னர் அல்வழியிலும், வேற்றுமையிலும் வல்லெழுத்து இயையின் அவ்வல்லெழுத்து மிகும். உகரம் ஒலித்துணையாக அவ்விடத்தில் நிலைபெறும். எ-டு.: உரிÒக்கடிது. உரிÒச்சிறிது. உரிÒத்தீது, உரிÒப்பெரிது - என்பதில் ஞகர ஈற்றுத் தொழிற்பெயர் வன்கணம் வர, அல்வழிக்கண் உகரமும் வல்லெழுத்தும் பெற்று முடிந்தமை அறிக. உரிÒக்கடுமை, உரிÒச்சிறுமை, உரிÒத்தீமை, உரிÒப்பெருமை- என்பதில் ஞகர ஈற்றுத் தொழிற்பெயர் வன்கணம் வர, வேற்றுமைக்கண் உகரமும் வல்லெழுத்தும் பெற்று முடிந்தமை அறிக.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.125, நூ. 296", "", "medium", "false"], ["TOLK-297", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 297: “ஞ ந ம வ இயையினும் உகரம் நிலையும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 297: “ஞ ந ம வ இயையினும் உகரம் நிலையும்.” — What does this sutra state?", "இது ஞகர ஈற்றுத் தொழிற்பெயர் இருவழியும் மென்கணத்தோடும், இடைக்கணத்து வகரத்தோடும் முடியுமாறு கூறுகிறது. எ-டு.: உரிÒ ஞான்றது. உரிÒ நீண்டது. உரிÒ மாண்டது - என்பதில் ஞகர ஈற்றுத் தொழிற்பெயர் மென்கணம்வர. அல்வழிக்கண் உகரம் பெற்று முடிந்தது. உரிÒ ஞாற்சி, உரிÒ நீட்சி, உரிÒ மாட்சி - என்பதில் ஞகர ஈற்றுத் தொழிற்பெயர் மென்கணம் வர, வேற்றுமைக்கண் உகரம் பெற்று முடிந்தது. உரிÒ வலிது, உரிÒ வலிமை - என்பதில் ஞகர ஈற்றுத் தொழிற்பெயர், வகரம் வர அல்வழி, வேற்றுமை இரண்டன் கண்ணும் உகரம் பெற்று முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.126, நூ. 297", "", "medium", "false"], ["TOLK-298", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 298: “நகர இறுதியும் அதனோ ரற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 298: “நகர இறுதியும் அதனோ ரற்றே.” — What does this sutra state?", "இது நகர ஈற்றுச் சொற்கள் இரண்டும், அல்வழிக்கண் வன்கணத்தோடும், மென்கணத்தோடும், இடைக்கணத்து வகரத்தோடும் முடியுமாறு கூறுகிறது. எ-டு.: பொருநுக்கடிது, பொருநுச்சிறிது, பொருநுத்தீது, பொருநுப்பெரிது - என்பதில் நகர ஈற்றுப் பெயர்களுள் ஒன்றாய பொருந் என்பது அல்வழிக்கண் வன்கணம் வர, உகரமும் வல்லெழுத்தும் பெற்று வரும். பொருநு ஞான்றது, பொருநு நீண்டது, பொருநு மாண்டது, பொருந் வலிது - என்பதில் பொருந் என்பது அல்வழிக்கண் மென்கணமும், இடைக்கணத்து வகரமும் வர, உகரம் பெற்று வரும். பொருந் - பொருநுதல் - ஒருவரைப்போல மற்றொருவர் வேடந்தரித்தல்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.126, நூ. 298", "", "medium", "false"], ["TOLK-299", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 299: “வேற்றுமைக்கு உக்கெட அகரம் நிலையும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 299: “வேற்றுமைக்கு உக்கெட அகரம் நிலையும்.” — What does this sutra state?", "எ-டு.: பொருநக்கடுமை, பொருநச்சிறுமை, பொருநத்தீமை, பொருநப்பெருமை-நகர ஈற்றுத் தொழிற்பெயர் வேற்றுமைக்கண் வல்லினம் வருங்கால் உகரம் கெட அகரமும் வல்லெழுத்தும் பெற்றது. பொருந ஞாட்சி, பொருந நீட்சி, பொருந மாட்சி, பொருந வன்மை-நகர ஈற்றுத் தொழிற்பெயர் வேற்றுமைக்கண் மென்கணமும், இடைக்கணத்து வகரமும் வருங்கால் உகரம்கெட அகரம் பெற்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.127, நூ. 299", "", "medium", "false"], ["TOLK-300", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 300: “வெரிந் என்இறுதி முழுதும் கெடுவழி வரும் இடம் உடைத்தே, மெல்லெழுத்து இயற்கை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 300: “வெரிந் என்இறுதி முழுதும் கெடுவழி வரும் இடம் உடைத்தே, மெல்லெழுத்து இயற்கை.” — What does this sutra state?", "வெரிந் (முதுகு) என்ற சொல்லின் முன்னர் வல்லினம் வந்தால், அதன் இறுதி அழிந்து இன மெல்லெழுத்துத் தோன்றும். எ-டு.: வெரிங்குறை, வெரிஞ்சிறை, வெரிந்தலை, வெரிம்புறம் - என்பதில் வெரிந் எனும் பெயர்ச்சொல்லின் நகரம், தான் பெற்ற உகரத்தோடும் கெட மெல்லெழுத்து மிக்கு நின்றதனைக் காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.127, நூ. 300", "", "medium", "false"], ["TOLK-301", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 301: “ஆவயின் வல்லெழுத்து மிகுதலும் உரித்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 301: “ஆவயின் வல்லெழுத்து மிகுதலும் உரித்தே.” — What does this sutra state?", "இது வெரிந் என்னும் சொல்லுக்கு வேற்றுமைக்கண் மேலும் ஒரு சிறப்புவிதி கூறுகிறது. எ-டு.: வெரிக்குறை, வெரிச்செய்கை, வெரித்தலை, வெரிப்புறம் - இதில் வெரிந் என்னும் பெயர்ச்சொல்லின் நகரம், தான் பெற்ற உகரத்தோடு கெட்டவிடத்து மெல்லெழுத்தே அன்றி வல்லெழுத்தும் மிக்கு வந்துள்ளதனைக் காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.127, நூ. 301", "", "medium", "false"], ["TOLK-302", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 302: “ணகார இறுதி வல்லெழுத்து இயையின் டகாரம் ஆகும் வேற்றுமைப் பொருட்கே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 302: “ணகார இறுதி வல்லெழுத்து இயையின் டகாரம் ஆகும் வேற்றுமைப் பொருட்கே.” — What does this sutra state?", "இது ணகர ஈற்றுச்சொல் வேற்றுமைக்கண் வல்லெழுத்தொடு புணருமாறு கூறுகிறது. எ-டு.: மண்+குடம்ஸ்ரீமட்குடம், மட்சாடி, மட்^தை, மட்பானை - என்பதில் ணகரம் வேற்றுமைக்கண் வல்லினம் வர ணகரம் டகரமாய்த் திரிந்து நின்றமை அறிக.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.128, நூ. 302", "", "medium", "false"], ["TOLK-303", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 303: “ஆணும் பெண்ணும் அஃறிணை இயற்கை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 303: “ஆணும் பெண்ணும் அஃறிணை இயற்கை.” — What does this sutra state?", "இது ஆண்மை, பெண்மை என்னும் முதனிலைகளாகிய ஆண், பெண் என்பவற்றுக்கு வேற்றுமை முடிபு கூறுகிறது. எ-டு.: ஆண்கை, ஆண்செவி, ஆண்டலை, ஆண்புறம்-உயர்திணைக்கண் தனித்து வரும் ஆண், வேற்றுமைக்கண் இயல்பாயிற்று.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.128, நூ. 303", "", "easy", "false"], ["TOLK-304", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 304: “ஆண் மரக்கிளவி அரைமர இயற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 304: “ஆண் மரக்கிளவி அரைமர இயற்றே.” — What does this sutra state?", "ஆண் என்னும் மரப்பெயர் அரை என்னும் மரப்பெயர் போல, அம்முச்சாரியை பெற்று வரும். எ-டு.: ஆணங்கோடு, ஆணஞ்செதிள், ஆணந்தோல், ஆணம்பூ - இதில் ஆண் என்னும் மரப்பெயர் அம்முச்சாரியை பெற்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.128, நூ. 304", "", "easy", "false"], ["TOLK-305", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 305: “விண் என வரூஉம் காயப்பெயர் வயின் உண்மையும் உரித்தே அத்து என் சாரியை செய்யுள் மருங்கின் தொழில் வரு காலை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 305: “விண் என வரூஉம் காயப்பெயர் வயின் உண்மையும் உரித்தே அத்து என் சாரியை செய்யுள் மருங்கின் தொழில் வரு காலை.” — What does this sutra state?", "இது விண் என்னும் சொற்குச் செய்யுளுள் எய்தியது விலக்கிப் பிறிது விதி கூறுகிறது. எ-டு.: விண்;+கொட்கும்ஸ்ரீ விண்ணத்துக் கொட்கும் விண்ணத்துக் கொட்கும்ஸ்ரீவிண்+அத்தூகொட்கும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.129, நூ. 305", "", "easy", "false"], ["TOLK-306", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 306: “தொழிற் பெயர் எல்லாம் தொழிற்பெயர் இயல.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 306: “தொழிற் பெயர் எல்லாம் தொழிற்பெயர் இயல.” — What does this sutra state?", "இது ணகர ஈற்றுத் தொழிற்பெயர் அல்வழி, வேற்றுமை இருவழியும் புணருமாறு கூறுகிறது. மகர ஈற்றுத்தொழிற்பெயர் மண்ணுதல் (கழுவுதல்) என்னும் வினையைக் குறித்துவரும் போது, உகரம் ஏற்றுவரும். எ-டு.: மண்ணுக்கடிது, மண்ணுச்சிறிது, மண்ணுத்தீது, மண்ணுப்பெரிது - என்பதில் ணகர ஈற்றுத் தொழிற்பெயர், வல்லினம் வர உகரமும் வல்லெழுத்தும் பெற்று முடிந்தது. மண்ணு ஞான்றது, மண்ணு நீண்டது, மண்ணு மாண்டது - என்பதில் ணகர ஈற்றுத் தொழிற்பெயர், மெல்லினம் வர உகரமும் வல்லெழுத்தும் பெற்று முடிந்தது. மண்ணு வலிது - என்பதில் ணகர ஈற்றுத் தொழிற்பெயர், இடைக்கணத்து வர உகரம் பெற்று முடிந்தது. மண்ணுக்கடுமை, மண்ணுச்சிறுமை, மண்ணுத்தீமை, மண்ணுப்பெருமை - என்பதில் ணகர ஈற்றுத் தொழிற்பெயர், வேற்றுமைக்கண் வல்லினம் வர உகரமும் வல்லெழுத்தும் பெற்று முடிந்தது. மண்ணு ஞாற்சி, மண்ணு நீட்சி, மண்ணு மாட்சி - என்பதில் ணகர ஈற்றுத் தொழிற்பெயர், வேற்றுமைக்கண் மெல்லினம் வர உகரமும் வல்லெழுத்தும் பெற்று முடிந்தது. மண்ணு வளமை - என்பதில் ணகர ஈற்றுத் தொழிற்பெயர், அல்வழிக்கண் இடைக்கணத்து வர உகரம் பெற்று முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.129, நூ. 306", "", "hard", "false"], ["TOLK-307", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 307: “கிளைப்பெயர் எல்லாம் கொளத் திரிபு இலவே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 307: “கிளைப்பெயர் எல்லாம் கொளத் திரிபு இலவே.” — What does this sutra state?", "ணகர ஈற்றுக் கிளைப்பெயர்கள் (சாதிப்பெயர்கள்) இயல்பாய் முடியும். எ-டு.: உமண்குடி, உமண்சேரி, உமண்டோட்டம், உமண்பாடி- என்பதில் இனப்பெயர் வேற்றுமைக்கண் திரியாது முடிந்தமை காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.130, நூ. 307", "", "easy", "false"], ["TOLK-308", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 308: “வேற்றுமை அல்வழி எண்என் உணவுப்பெயர் வேற்றுமை இயற்கை நிலையலும் உரித்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 308: “வேற்றுமை அல்வழி எண்என் உணவுப்பெயர் வேற்றுமை இயற்கை நிலையலும் உரித்தே.” — What does this sutra state?", "இது எண் எனும் உணவுப்பெயர் ஒன்றனுக்கு அல்வழிக்கண் எய்தியதன்மேல் சிறப்பு விதி கூறுகிறது. எ-டு.: எட்கடிது, எட்சிறிது, எட்டீது, எட்பெரிது - என்பதில் அல்வழிக்கண் எண் எனும் உணவுப்பெயர் வல்லினம் வரத் திரிந்தது. எண்கடிது, எண்சிறிது, எண்டீது, எண்பெரிது - என்பதில் முன்னர்க் கூறியது போல இயல்பாய் முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.130, நூ. 308", "", "medium", "false"], ["TOLK-309", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 309: “முரண்என் தொழிற்பெயர் முதல்இயல் நிலையும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 309: “முரண்என் தொழிற்பெயர் முதல்இயல் நிலையும்.” — What does this sutra state?", "முரண் என்னும் தொழிற்பெயர் உகரம் ஏற்காது இயல்பாக நிற்கும். எ-டு.: முரண்கடிது, முரண்சிறிது, முரண்தீது, முரண்பெரிது - முரண்ஞான்றது, முரண்மாண்டது, முரண்யாது, முரண் வலிது - என்பதில் முரண் என்னும் தொழிற்பெயர் அல்வழிக்கண் நாற்கணங்களும் வர இயல்பாயிற்று.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.131, நூ. 309", "", "medium", "false"], ["TOLK-310", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 310: “மகர இறுதி வேற்றுமை ஆயின் துவரக்கெட்டு வல்லெழுத்து மிகுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 310: “மகர இறுதி வேற்றுமை ஆயின் துவரக்கெட்டு வல்லெழுத்து மிகுமே.” — What does this sutra state?", "இது மகர ஈற்றுச்சொல் வேற்றுமைக்கண் வல்லெழுத்தொடு புணருமாறு கூறுகிறது. எ-டு.: மரக்கோடு, மரச்செதிள், மரத்தோல், மரப்பூ - என்பதில் மகர ஈறு வேற்றுமைக்கண் வன்கணம் வரக் கெட்டு வல்லொற்று மிக்கு முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.131, நூ. 310", "", "easy", "false"], ["TOLK-311", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 311: “அகரஆகாரம் வரூஉம் காலை ஈற்றுமிசை அகரம் நீடலும் உரித்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 311: “அகரஆகாரம் வரூஉம் காலை ஈற்றுமிசை அகரம் நீடலும் உரித்தே.” — What does this sutra state?", "மகர ஈற்றுச்சொற்கள் முன் அகர, ஆகாரம் வரும்போது ஈற்று மகரம் கெட்டு அகரம் நீளுவதும் உண்டு. எ-டு.: மராஅடி, குளாஆம்பல் - என்பதில் அகர, ஆகாரம் வருங்காரத்து ஈற்றுமகரம் கெட, அதனயல் நீளாது நின்றதனைக் காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.131, நூ. 311", "", "easy", "false"], ["TOLK-312", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 312: “மெல்லெழுத்து உறழும் மொழியுமார் உளவே செல்வழி அறிதல் வழக்கத்தான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 312: “மெல்லெழுத்து உறழும் மொழியுமார் உளவே செல்வழி அறிதல் வழக்கத்தான.” — What does this sutra state?", "மகர ஈற்றுப்பெயர்களில் மெல்லெழுத்துப் பெற்று வருவனவும் உள்ளன. அது வழக்கின்வழி அறிந்துகொள்ளலாம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.132, நூ. 312", "", "easy", "false"], ["TOLK-313", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 313: “இல்லம் மரப்பெயர் விசைமர இயற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 313: “இல்லம் மரப்பெயர் விசைமர இயற்றே.” — What does this sutra state?", "இல்லம் என்னும் மரப்பெயர், விசை மரத்தைப் போல மெல்லெழுத்துப் பெற்று முடியும். எ-டு.: இல்லம் +கோடு ஸ்ரீ இல்லங்கோடு, இல்லஞ்செதிள், இல்லந்தோல், இல்லம்பூ- இல்லம் எனும் மரப்பெயர் ஈற்று மகரம் கெட்டு மெல்லெழுத்து மிக்கு முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.132, நூ. 313", "", "medium", "false"], ["TOLK-314", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 314: “அல்வழி எல்லாம் மெல்லெழுத்து ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 314: “அல்வழி எல்லாம் மெல்லெழுத்து ஆகும்.” — What does this sutra state?", "அல்வழியில் மகர ஈற்றுச்சொற்கள் வல்லினச் சொற்களுக்கு எதிராக வரும்போது மகரம் திரிந்து இனவெழுத்தாக அமையும். எ-டு.: மரங்குறிது, மரஞ்சிறிது, மரந்தீது, மரம்பெரிது - என்பதில் மகர ஈறு அல்வழிக்கண் மெல்லெழுத்தாயிற்று காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.132, நூ. 314", "", "medium", "false"], ["TOLK-315", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 315: “அகம் என் கிளவிக்குக் கை முன்வரினே முதல்நிலை ஒழிய முன்னவை கெடுதலும் வரைநிலை இன்றே ஆசிரியர்க்கு மெல்லெழுத்து மிகுதல் ஆவயினான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 315: “அகம் என் கிளவிக்குக் கை முன்வரினே முதல்நிலை ஒழிய முன்னவை கெடுதலும் வரைநிலை இன்றே ஆசிரியர்க்கு மெல்லெழுத்து மிகுதல் ஆவயினான.” — What does this sutra state?", "அகம் என்ற சொல்லுக்கு முன்னர் கை என்னும் சொல் வந்தால் முதல் எழுத்தாகிய அ நீங்கலாக எல்லா எழுத்தும் கெடுதலையும் ஆசிரியர் ஏற்றுக் கொள்வர் என்பதனை அறிக. எ-டு.: அங்கை, அகங்கை எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.133, நூ. 315", "", "easy", "false"], ["TOLK-316", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 316: “இலம் என் கிளவிக்குப் படுவரு காலை நிலையலும் உரித்தே செய்யுளான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 316: “இலம் என் கிளவிக்குப் படுவரு காலை நிலையலும் உரித்தே செய்யுளான.” — What does this sutra state?", "இலம் என்னும் சொல் முன்னர் படு எனும் சொல் வரும்போது மகர ஈறு முன்னர்க் கூறியது போல செய்யுளில் கெடாது நிற்பதற்கு உரியதாகும். எ-டு.: இலம்படு புல ரேற்றகை நிறைய. (மலைபடு. 576) என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.133, நூ. 316", "", "easy", "false"], ["TOLK-317", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 317: “அத்தொடு சிவணும் ஆயிரத்து இறுதி ஒத்த எண்ணும் முன்வரு காலை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 317: “அத்தொடு சிவணும் ஆயிரத்து இறுதி ஒத்த எண்ணும் முன்வரு காலை.” — What does this sutra state?", "இது எண்ணுப்பெயர்களுள் ஒன்றனுக்கு எய்தியது விலக்கிப் பிறிது விதி வகுக்கிறது. ஆயிரம் என்ற எண்ணுப் பெயரின் மகர ஈறு, அதற்குக் குறைந்த எண்ணுப் பெயர் முன்னால் வந்தால் அத்துச்சாரியை பெற்று வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.133, நூ. 317", "", "easy", "false"], ["TOLK-318", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 318: “அடையொடு தோன்றினும் அதன் ஓரற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 318: “அடையொடு தோன்றினும் அதன் ஓரற்றே.” — What does this sutra state?", "ஆயிரம் என்ற எண்ணுப் பெயரின் ஈறு அடையடுத்து நின்றாலும் அத்துச் சாரியை பெற்றுவரும். எ-டு.: ஈராயிரத்தொன்று, மூவாயிரத்தொன்று. நூறாயிரத்தொன்று, இருநூறாயிரத்தொன்று.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.134, நூ. 318", "", "easy", "false"], ["TOLK-319", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 319: “அளவும் நிறையும் வேற்றுமை இயல.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 319: “அளவும் நிறையும் வேற்றுமை இயல.” — What does this sutra state?", "ஆயிரம் என்ற பெயரின் முன்னர் அளவுப்பெயரும் நிறைப்பெயரும் வருமாயின், மகர ஈறு வேற்றுமை போலக் கெட்டு வல்லெழுத்து மிக்கு முடியும். எ-டு.: ஆயிரக்கலம் - அளவுப்பெயர்; சாடி, தூதை, பானை என்பனவற்றோடும் இவ்வாறே ஒட்டுக. ஆயிரக்கழஞ்சு - நிறைப்பெயர்; தொடி, பலம் என்பனவற்றோடும் இவ்வாறே ஒட்டுக. வேற்றுமையில் உயர்திணைப் பெயரும் விரவுப்பெயரும் எல்லாரும் என்னும் படர்க்கைப் பெயரும், எல்லீரும் என்னும் முன்னிலைப் பெயரும், நெடுமுதல் குறுகி முடியும் தாம், நாம், யாம் எனும் பெயர்களும் வேற்றுமைக்கண் உருபு புணர்ச்சிக்கண்ணே கூறிய இயல்பின்கண் நின்று முடியும். அவ்விடத்து மெல்லெழுத்து மிக்கு முடிதல் வேண்டும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.134, நூ. 319", "", "medium", "false"], ["TOLK-320", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 320: “படர்க்கைப் பெயரும் முன்னிலைப் பெயரும் தொடக்கம் குறுகும் பெயர்நிலைக் கிளவியும் வேற்றுமையாயின் உருபு இயல் நிலையும் மெல்லெழுத்து மிகுதல் ஆவயினான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 320: “படர்க்கைப் பெயரும் முன்னிலைப் பெயரும் தொடக்கம் குறுகும் பெயர்நிலைக் கிளவியும் வேற்றுமையாயின் உருபு இயல் நிலையும் மெல்லெழுத்து மிகுதல் ஆவயினான.” — What does this sutra state?", "இது சில உயர்திணைப் பெயர்க்கும், விரவுப்பெயர்க்கும் வேற்றுமைக்கண் உருபியலோடு மாட்டெறிந்து முடிபு கூறுகிறது. எல்லாரும் என்னும் படர்க்கைப் பெயரும், எல்லீரும் என்னும் முன்னிலைப் பெயரும் தாம், நான் என்னும் தொடக்கம் கொண்டு குறுகும் பெயர்களும் (தம், நும்) வேற்றுமைப் புணர்ச்சியின்படி நடக்கும். அவ்விடத்தில் மெல்லெழுத்து மிகும். எ-டு.: எல்லார்தங்கையும், எல்லீர் நுங்கையும், செவியும், தலையும், புறமும் எனவும், தங்கை, நுங்கை, எங்கை, செவி, தலை, புறம் எனவும் ஒட்டுக.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.134, நூ. 320", "", "medium", "false"], ["TOLK-321", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 321: “அல்லது கிளப்பின் இயற்கை ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 321: “அல்லது கிளப்பின் இயற்கை ஆகும்.” — What does this sutra state?", "இது படர்க்கைப் பெயருக்கும், முன்னிலைப் பெயருக்கும், தொடக்கங் குறுகும் பெயர்க்கும் அல்வழி முடிபு கூறுகிறது. அல்வழிப் புணர்ச்சியில் மேற்குறித்த படர்க்கைப் பெயரும், முன்னிலைப் பெயரும், தொடக்கம் குறுகும் பெயர்நிலைக்கிளவியும் சாரியை பெறாது இயல்பாய் முடியும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.135, நூ. 321", "", "medium", "false"], ["TOLK-322", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 322: “அல்லது கிளப்பினும் வேற்றுமைக்கண்ணும் எல்லாம் எனும்பெயர் உருபு இயல் நிலையும் வேற்றுமை அல்வழிச் சாரியை நில்லாது.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 322: “அல்லது கிளப்பினும் வேற்றுமைக்கண்ணும் எல்லாம் எனும்பெயர் உருபு இயல் நிலையும் வேற்றுமை அல்வழிச் சாரியை நில்லாது.” — What does this sutra state?", "எல்லாம் என்னும் விரவுப்பெயர் உருபியலில் குறித்தவாறு வேற்றுமையில் சாரியை பெற்றும், அல்வழியில் இயல்பாகவும் வரும். எ-டு.: எல்லாக்குறியவும், சிறியவும், தீயவும், பெரியவும் எனவும், எல்லாவற்றுக்கோடும், செவியும், தலையும், புறமும் எனவும்", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.136, நூ. 322", "", "medium", "false"], ["TOLK-323", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 323: “மெல்லெழுத்து மிகினும் மானம் இல்லை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 323: “மெல்லெழுத்து மிகினும் மானம் இல்லை.” — What does this sutra state?", "எ-டு.: எல்லாங்குறியவும், சிறியவும், தீயவும், பெரியவும் எனவும், எல்லாங்குறிய, சிறிய, தீய, பெரிய எனவும் வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.136, நூ. 323", "", "easy", "false"], ["TOLK-324", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 324: “உயர்திணை ஆயின் உருபு இயல் நிலையும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 324: “உயர்திணை ஆயின் உருபு இயல் நிலையும்.” — What does this sutra state?", "இது எல்லாம் என்பதற்கு உயர்திணை முடிபு கூறுகிறது. எ-டு.: எல்லாம் என்பது உயர்திணையாய் நிற்குமாயின் உருபு புணர்ச்சியின் இயல்பிற்றாய் இடைக்கண் நம்மும், இறுதிக்கண் உம்மும் பெற்றுவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.136, நூ. 324", "", "easy", "false"], ["TOLK-325", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 325: “நும்என் ஒருபெயர் மெல்லெழுத்து மிகுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 325: “நும்என் ஒருபெயர் மெல்லெழுத்து மிகுமே.” — What does this sutra state?", "இது விரவுப்பெயர் ஒன்றனுக்கு வேற்றுமை முடிபு கூறுகிறது. எ-டு.: நும்+கைஸ்ரீநுங்கை, நுஞ்செவி, நுந்தலை, நும்புறம் - என்பதில் நும் எனும் விரவுப்பெயர் மகரங்கெட்டு மெல்லெழுத்து மிக்கு முடிந்தமை காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.136, நூ. 325", "", "easy", "false"], ["TOLK-326", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 326: “அல்லதன் மருங்கின் சொல்லும் காலை உக்கெட நின்ற மெய்வயின் உவர இஇடை நிலைஇ ஈறுகெட ரகரம் நிற்றல் வேண்டும் புள்ளியொடு புணர்ந்தே; அப்பால் மொழிவயின் இயற்கை ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 326: “அல்லதன் மருங்கின் சொல்லும் காலை உக்கெட நின்ற மெய்வயின் உவர இஇடை நிலைஇ ஈறுகெட ரகரம் நிற்றல் வேண்டும் புள்ளியொடு புணர்ந்தே; அப்பால் மொழிவயின் இயற்கை ஆகும்.” — What does this sutra state?", "இது நும் என்பதற்கு அல்வழி முடிபு கூறுகிறது. நும் என்னும் சொல் அல்வழியில் புணருவதனைக் குறிப்பிடும்போது, அதன் உகரம் கெட்டு மெய்யின் மீது ஈகாரம் வரும். நும் என்பது நீம் என ஆகும். இதன் இடையில் இகரம் நின்று (நீஇம்) பின்னர் மகரம் கெட்டு ரகரம் (நீயிர்) என நிலைபெறும். எ-டு.: நீயிர் குறியீர், நீயிர் சிறியீர், நீயிர் தீயிர், நீயிர் பெரியீர் - என்பதில் நும்மின் திரிபாய நீயிர் என்பதன்முன் மெல்லெழுத்து மிகாது வல்லினம் இயல்பாக நிற்றலைக் காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.137, நூ. 326", "", "medium", "false"], ["TOLK-327", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 327: “தொழிற்பெயர் எல்லாம் தொழிற்பெயர் இயல.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 327: “தொழிற்பெயர் எல்லாம் தொழிற்பெயர் இயல.” — What does this sutra state?", "இது மகர ஈற்றுத் தொழிற்பெயர்க்கு அல்வழி, வேற்றுமை இருவழியும் எய்தியது விலக்கிப் பிறிது விதி வகுக்கிறது. எ-டு.: செம்+கடிது ஸ்ரீ செம்முக்கடிது, செம்முச்சிறிது, செம்முத்தீது, செம்முப்பெரிது -", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.137, நூ. 327", "", "easy", "false"], ["TOLK-328", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 328: “ஈமும் கம்மும் உரும்என் கிளவியும் ஆமுப் பெயரும் அவற்றோ ரன்ன.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 328: “ஈமும் கம்மும் உரும்என் கிளவியும் ஆமுப் பெயரும் அவற்றோ ரன்ன.” — What does this sutra state?", "ஈம், கம், உரும் ஆகிய மூன்று சொற்களும் தொழிற்பெயரோடு ஒத்த தன்மையனவாய் உகரமும் வல்லெழுத்தும் பெற்று முடியும். எ-டு.: ஈம்+கடிது ஸ்ரீ ஈமுக்கடிது, ஈமுச்சிறிது, ஈமுத்தீது, ஈ;முப்பெரிது - வேற்றுமை ஈம்+கடுமை ஸ்ரீ ஈமுக்கடுமை, ஈமுச்சிறுமை, ஈமுத்தீமை, ஈமுப்பெருமை-", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.138, நூ. 328", "", "medium", "false"], ["TOLK-330", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 330: “வகாரம் இசையும் மகாரம் குறுகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 330: “வகாரம் இசையும் மகாரம் குறுகும்.” — What does this sutra state?", "இது மகரம் புணர்மொழிக்கண்ணும் குறுகுமாறு கூறுகிறது. தனிமொழிக்கண் குறுகுதல் மொழிமரபின்கண் (தொல். நூ. 52) கூறப்பட்டமை காண்க. எ-டு.: நிலம் வலிது, வரும் வளவன்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.138, நூ. 330", "", "easy", "false"], ["TOLK-331", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 331: “நாட்பெயர்க் கிளவி மேல்கிளந்தன்ன அத்தும் ஆன்மிசை வரைநிலை இன்றே ஒற்றுமெய் கெடுதல் என்மனார் புலவர்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 331: “நாட்பெயர்க் கிளவி மேல்கிளந்தன்ன அத்தும் ஆன்மிசை வரைநிலை இன்றே ஒற்றுமெய் கெடுதல் என்மனார் புலவர்.” — What does this sutra state?", "இது மகர ஈற்று நாட்பெயருக்கு வேற்றுமை முடிபு கூறுகிறது. மகம், ஓணம் போன்ற நாட்பெயர்க்கிளவிகள் முன்சுட்டியது போல, அன் சாரியைகள் இணையப் பெற்றுவரும். அப்போது அதில் உள்ள ஒற்று மெய்யுடன் கெடும் என்பர் புலவர். எ-டு.: மகத்தாற்கொண்டான்ஸ்ரீமகம்+அத்தூஆன்+கொண்டான்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.139, நூ. 331", "", "medium", "false"], ["TOLK-332", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 332: “னகார இறுதி வல்லெழுத்து இயையின் றகாரம் ஆகும் வேற்றுமைப் பொருட்கே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 332: “னகார இறுதி வல்லெழுத்து இயையின் றகாரம் ஆகும் வேற்றுமைப் பொருட்கே.” — What does this sutra state?", "இது னகர ஈற்றுச்சொல் வேற்றுமைக்கண் வல்லெழுத்தோடு புணருமாறு கூறுகிறது. னகார ஈற்றுப் பெயர் வல்லெழுத்து முதல் மொழி வருமொழியாய் வந்து பொருந்தினால் வேற்றுமையில் றகரமாகத் திரியும். எ-டு.: பொன் +குடம் ஸ்ரீ பொற்குடம், பொற்சாடி, பொற்றூதை, பொற்பானை - என்பதில் வல்லின முதன்மொழி வர, வேற்றுமைக்கண் னகரம் றகரமாயிற்றமையினைக் காண்க. மன், சின், ஆன், ஈன், பின், முன் என்னும் சொற்கள் மன், சின், ஆன், ஈன், பின், முன் என்னும் ஆறு இடைச்சொற்களும், ளகர ஈற்று வினையெச்சமும் முற்கூறிய பெயரீற்று னகரம் போல, ஈற்று னகரம் றகரமாய்த் திரிந்து முடியும் என்றுரைப்பர் புலவர்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.139, நூ. 332", "", "medium", "false"], ["TOLK-333", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 333: “மன்னும் சின்னும் ஆனும் ஈனும் பின்னும் முன்னும் வினைஎஞ்சு கிளவியும் அன்ன இயல என்மனார் புலவர்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 333: “மன்னும் சின்னும் ஆனும் ஈனும் பின்னும் முன்னும் வினைஎஞ்சு கிளவியும் அன்ன இயல என்மனார் புலவர்.” — What does this sutra state?", "இது மன், சின், ஆன், ஈன், பின், முன் என்னும் ஆறு சொற்களுக்கும், னகர ஈற்று வினையெச்சத்திற்கும் அல்வழி முடிபு கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.139, நூ. 333", "", "easy", "false"], ["TOLK-334", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 334: “சுட்டு முதல் வயினும் எகரம் முதல் வயினும் அப்பண்பு நிலையும் இயற்கைய என்ப.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 334: “சுட்டு முதல் வயினும் எகரம் முதல் வயினும் அப்பண்பு நிலையும் இயற்கைய என்ப.” — What does this sutra state?", "இது னகர ஈற்று ஏழாம் வேற்றுமை இடப்பொருள் உணர்த்தும் இடைச்சொற்கு முடிபு கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.140, நூ. 334", "", "easy", "false"], ["TOLK-335", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 335: “குயின் என் கிளவி இயற்கை ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 335: “குயின் என் கிளவி இயற்கை ஆகும்.” — What does this sutra state?", "குயின் என்ற சொல் வல்லெழுத்து மிகாமலும், திரியாமலும் இயல்பாக வரும். (குயின்-மேகம்) எ-டு.: குயின்குழாம், குயின்செலவு, குயின்றோற்றம், குயின்பறைவு - என்பதில் குயின் என்பதன் ஈற்று னகரம் இயல்பாய் முடிந்தமை காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.140, நூ. 335", "", "medium", "false"], ["TOLK-336", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 336: “எகின் மரமாயின் ஆண்மர இயற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 336: “எகின் மரமாயின் ஆண்மர இயற்றே.” — What does this sutra state?", "எகின் என்ற சொல் மரததைக் குறித்து வரமாயின் அது ஆண்மரத்தைப் போன்று இயல்பாக முடியும். எ-டு.: எகினங்கோடு, எகினஞ்செவி, எகினந்தோல், எகினம்பூ - என்பதில் எகின் எனும் மரப்பெயர் அம்முச்சாரியை பெற்று நின்றமை காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.141, நூ. 336", "", "medium", "false"], ["TOLK-337", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 337: “ஏனை எகினே அகரம் வருமே வல்லெழுத்து இயற்கை மிகுதல் வேண்டும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 337: “ஏனை எகினே அகரம் வருமே வல்லெழுத்து இயற்கை மிகுதல் வேண்டும்.” — What does this sutra state?", "எகின் என்ற சொல் பறவையைக் குறிப்பதாயின் (அன்னம்) அது அகரச்சாரியைப் பெற்று, வல்லெழுத்துடன் முடியும். எ-டு.: எகினக்கால், எகினச்செவி, எகினத்தலை, எகினப்புறம் - இதில் மரமல்லாத எகின் என்னும் பெயர் அகரம் பெற்று வல்லெழுத்து மிக்கது அறிக.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.141, நூ. 337", "", "medium", "false"], ["TOLK-338", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 338: “கிளைப் பெயர் எல்லாம் கிளைப்பெயர் இயல.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 338: “கிளைப் பெயர் எல்லாம் கிளைப்பெயர் இயல.” — What does this sutra state?", "னகர ஈற்று இனப்பெயர், ணகர ஈற்றுக் கிளைப்பெயர் போல முடியும். எ-டு.: எயின்குடி, எயின்சேரி, எயின்தோட்டம், எயின்பாடி - என்பதில் னகர ஈற்றுக் கிளைப்பெயர் இயல்பாய் முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.141, நூ. 338", "", "easy", "false"], ["TOLK-339", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 339: “மீன்என் கிளவி வல்லெழுத்து மிகுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 339: “மீன்என் கிளவி வல்லெழுத்து மிகுமே.” — What does this sutra state?", "மீன் என்னும் சொல் வல்லெழுத்துப் பெற்றும், இயல்பாகவும் வருதல் உண்டு. எ-டு.: மீன்கண், மீற்கண், மீன்சினை, மீற்சினை, மீன்றலை, மீற்றலை, மீன்புறம், மீற்புறம் - மீன் என்பதன் னகரம் தன் திரிபு வல்லெழுத்தினொடு உறழ்ந்தும் இயல்பாகவும் நின்றுள்ளமையினைக் காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.141, நூ. 339", "", "medium", "false"], ["TOLK-340", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 340: “தேன் என் கிளவி வல்லெழுத்து இயையின் மேல்நிலை ஒத்தலும் வல்லெழுத்து மிகுதலும் ஆமுறை இரண்டும் உரிமையும் உடைத்தே வல்லெழுத்து மிகுவழி இறுதி இல்லை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 340: “தேன் என் கிளவி வல்லெழுத்து இயையின் மேல்நிலை ஒத்தலும் வல்லெழுத்து மிகுதலும் ஆமுறை இரண்டும் உரிமையும் உடைத்தே வல்லெழுத்து மிகுவழி இறுதி இல்லை.” — What does this sutra state?", "தேன் என்ற சொல் வல்லெழுத்தோடு சேர்ந்தால் மேலே குறித்த, மீன் என்பதற்குரிய திரிபினையும் பெற்றுவரும். அல்லது இறுதி அழிய வல்லெழுத்து மிகலாம். வல்லெழுத்து மிகும்போது இறுதிமெய் கெட்டு நிற்கும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.142, நூ. 340", "", "easy", "false"], ["TOLK-341", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 341: “மெல்லெழுத்து மிகினும் மானம் இல்லை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 341: “மெல்லெழுத்து மிகினும் மானம் இல்லை.” — What does this sutra state?", "எ-டு.: தேங்குடம், தேஞ்சாடி, தேந்தூதை, தேம்பானை எனவரும். மெல்லெழுத்து முதன்மொழி வந்து பொருந்தின் தேன் என்பதன் இறுதி கெடுதலும் கெடாமையுமாகிய உறழ்ச்சியாய் முடியும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.142, நூ. 341", "", "easy", "false"], ["TOLK-343", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 343: “இறாஅல் தோற்றம் இயற்கை ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 343: “இறாஅல் தோற்றம் இயற்கை ஆகும்.” — What does this sutra state?", "இறால் என்னும் சொல் தேன் என்ற சொல்லோடு புணரும்போது ஈற்று னகரம் கெடாது இயல்பாய் நிற்றலும் உண்டு. எ-டு.: தேன்+இறால் ஸ்ரீ தேனிறால் எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.143, நூ. 343", "", "easy", "false"], ["TOLK-344", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 344: “ஒற்றுமிகு தகரமொடு நிற்றலும் உரித்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 344: “ஒற்றுமிகு தகரமொடு நிற்றலும் உரித்தே.” — What does this sutra state?", "தேன் என்பது இறாலொடு புணருமிடத்து மேலும் ஓர் ஒற்றாய் மிகும் தகரத்தோடு நிற்றலும் உண்டு. எ-டு.: தேன்+இறால் ஸ்ரீ தேத்திறால் எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.143, நூ. 344", "", "easy", "false"], ["TOLK-345", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 345: “மின்னும் பின்னும் பன்னும் கன்னும் அந்நாற் சொல்லும் தொழிற்பெயர் இயல.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 345: “மின்னும் பின்னும் பன்னும் கன்னும் அந்நாற் சொல்லும் தொழிற்பெயர் இயல.” — What does this sutra state?", "மின், பின், பன், கன் என்னும் நான்கு சொற்களும் அல்வழியிலும், வேற்றுமையிலும் ஞகர ஒற்றுத் தொழிற்பெயர் போல உகரம் பெற்று வல்லெழுத்து மிக்கு முடியும். எ-டு.: மின்னுக்கடிது, மின்னுச்சிறிது, மின்னுத்தீது, மின்னுப்பெரிது - அல்வழி", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.143, நூ. 345", "", "medium", "false"], ["TOLK-346", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 346: “வேற்றுமை ஆயின் ஏனை எகினொடு தோற்றம் ஒக்கும் கன்என் கிளவி.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 346: “வேற்றுமை ஆயின் ஏனை எகினொடு தோற்றம் ஒக்கும் கன்என் கிளவி.” — What does this sutra state?", "எ-டு.: கன்னக்குடம், கன்னச்சாடி, கன்னத்தூதை, கன்னப்பானை - என்பதில் வேற்றுமைக்கண் வல்லினம் வர அகரமும், வல்லெழுத்தும் பெற்று முடிந்தது. இயற்பெயர் முன்னர்த் தந்தை என்னும் முறைப்பெயர் னகார ஈற்று விரவுப்பெயர் முன்னர்த் தந்தை என்னும் முறைப்பெயர் வருமாயின் அதன்முதற்கண் நின்ற மெய்மட்டும் கெட, அதனை எர்ந்த அகரம் நிலைபெறும். நிறுத்த சொல்லாய் நின்ற அவ்வியற்பெயரின் அன் எனும் இறுதி தானூர்ந்த மெய்யினை விடுத்துக் கெட்டு முடியும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.144, நூ. 346", "", "medium", "false"], ["TOLK-347", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 347: “இயற்பெயர் முன்னர்த் தந்தை முறைவரின் முதற்கண் மெய்கெட அகரம் நிலையும்; மெய்ஒழித்து அன்கெடும் அவ்இயற்பெயரே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 347: “இயற்பெயர் முன்னர்த் தந்தை முறைவரின் முதற்கண் மெய்கெட அகரம் நிலையும்; மெய்ஒழித்து அன்கெடும் அவ்இயற்பெயரே.” — What does this sutra state?", "அதாவது, சாத்தன், கொற்றன், தான், பேன், கோன் என்பன போன்ற னகர ஈற்று இயற்பெயர் முன்னால் தந்தை அல்லது மகன் என்னும் உறவு முறைப்பெயர் வரும்போது முதற்கண் நின்ற மெய்கெட்டு அகரம் நிலைபெறும். இயற்பெயரில் உள்ள மெய் ஒழிந்து, அன் கெட்டு இணையும் என்பதாம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.144, நூ. 347", "", "medium", "false"], ["TOLK-348", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 348: “ஆதனும் பூதனும் கூறிய இயல்பொடு பெயர் ஒற்று அகரம் துவரக் கெடுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 348: “ஆதனும் பூதனும் கூறிய இயல்பொடு பெயர் ஒற்று அகரம் துவரக் கெடுமே.” — What does this sutra state?", "ஆதன் பூதன் என்ற இயற்பெயர்கள் தந்தை என்னும் முறைப்பெயரோடு முடியும்போது முற்கூறிய இயல்போடு பெயர் ஒற்றின் அகரமும் முற்றிலும் கெட்டு நிற்கும் என்பதாம். எ-டு.: ஆந்தை, பூந்தை எனவரும். ஆந்தைஸ்ரீஆதன்+தந்தை.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.145, நூ. 348", "", "easy", "false"], ["TOLK-349", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 349: “சிறப்பொடு வருவழி இயற்கை ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 349: “சிறப்பொடு வருவழி இயற்கை ஆகும்.” — What does this sutra state?", "எ-டு.: பெரியூசாத்தன் +தந்தை ஸ்ரீ பெருஞ்சாத்தன்றந்தை, பெருங்கொற்றன்றந்தை.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.145, நூ. 349", "", "easy", "false"], ["TOLK-350", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 350: “அப்பெயர் மெய்ஒழித்து அன்கெடு வழியே நிற்றலும் உரித்தே அம்என் சாரியை மக்கள் முறை தொகூஉம் மருங்கினான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 350: “அப்பெயர் மெய்ஒழித்து அன்கெடு வழியே நிற்றலும் உரித்தே அம்என் சாரியை மக்கள் முறை தொகூஉம் மருங்கினான.” — What does this sutra state?", "எ-டு.: சாத்தங்கொற்றன், கொற்றங்கொற்றன். சாத்தங்கொற்றி, கொற்றங்கொற்றி எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.145, நூ. 350", "", "easy", "false"], ["TOLK-351", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 351: “தானும் பேனும் கோனும் என்னும் ஆமுறை இயற்பெயர் திரிபுஇடன் இலவே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 351: “தானும் பேனும் கோனும் என்னும் ஆமுறை இயற்பெயர் திரிபுஇடன் இலவே.” — What does this sutra state?", "எ-டு.: தான்றந்தை, பேன்றந்தை, கோன்றந்தை தான்கொற்றன், பேன்கொற்றன், கோன்கொற்றன்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.146, நூ. 351", "", "easy", "false"], ["TOLK-352", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 352: “தான், யான் எனும் பெயர் உருபு இயல் நிலையும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 352: “தான், யான் எனும் பெயர் உருபு இயல் நிலையும்.” — What does this sutra state?", "தான், யான் என்னும் விரவுப்பெயரும், யான் என்னும் உயர்திணைப் பெயரும் உருபியலில் சொல்லியவாறு நெடுமுதல் குறுகி வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.146, நூ. 352", "", "easy", "false"], ["TOLK-354", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 354: “அழன் என் இறுதிகெட வல்லெழுத்து மிகுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 354: “அழன் என் இறுதிகெட வல்லெழுத்து மிகுமே.” — What does this sutra state?", "அழன் என்ற சொல்லின் இறுதியில் உள்ள னகரம் கெட வல்லெழுத்து மிக்கு முடியும். எ-டு.: அழக்குடம், அழச்சாடி, அழத்தூதை, அழப்பானை - என்பதில் அழன் என்னும் சொல்லின் ஈறுகெட வல்லெழுத்து மிக்கு முடிந்து நின்றமை காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.146, நூ. 354", "", "medium", "false"], ["TOLK-355", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 355: “முன்என் கிளவி முன்னர்த் தோன்றும் இல்என் கிளவிமிசை றகரம் ஒற்றும் தொல்இயல் மருங்கின் மரீஇய மரபே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 355: “முன்என் கிளவி முன்னர்த் தோன்றும் இல்என் கிளவிமிசை றகரம் ஒற்றும் தொல்இயல் மருங்கின் மரீஇய மரபே.” — What does this sutra state?", "இது மரூஉச்சொற்களுக்குச் சிறப்பு விதி கூறுகிறது. முன் என்ற சொல்லின் முன்னால் இல் என்னும் சொல் வந்தால் அதனோடு றகர ஒற்று வந்து முடிதல் தொன்மை மரபுகளில் ஒன்றாகும். எ-டு.: முன்றில்ஸ்ரீமுன்+இல் என வந்துள்ளமை காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.147, நூ. 355", "", "medium", "false"], ["TOLK-356", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 356: “பொன்என் கிளவி ஈறுகெட முறையின் முன்னர்த் தோன்றும் லகார மகாரம் செய்யுள் மருங்கின் தொடர் இயலான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 356: “பொன்என் கிளவி ஈறுகெட முறையின் முன்னர்த் தோன்றும் லகார மகாரம் செய்யுள் மருங்கின் தொடர் இயலான.” — What does this sutra state?", "செய்யுளில் பொன் என்னும் சொல்லின் னகரம் கெட, லகார, மகாரம் இணைந்து பொலம் என்றாகி இயல்பாக முடியும். எ-டு.: பொலம்படைப் பொலிந்த கொய்சுவற் புரவி என வரும். (பொன்பூ - பொலம்பூ)", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.147, நூ. 356", "", "easy", "false"], ["TOLK-357", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 357: “யகர இறுதி வேற்றுமைப் பொருள்வயின் வல்லெழுத்து இயையின் அவ்எழுத்து மிகுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 357: “யகர இறுதி வேற்றுமைப் பொருள்வயின் வல்லெழுத்து இயையின் அவ்எழுத்து மிகுமே.” — What does this sutra state?", "இது யகர ஈற்றுப்பெயர் வேற்றுமைக்கண் வன்கணத்தோடு புணருமாறு கூறுகிறது. யகர இறுதிச்சொல், வேற்றுமைப் பொருட்புணர்ச்சிக்கண் வல்லெழுத்து முதன்மொழி வந்து இயைந்தால் அவ்வெழுத்து மிகும். எ-டு.: நாய்க்கால், நாய்ச்செவி, நாய்த்தலை, நாய்ப்புறம் என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.147, நூ. 357", "", "medium", "false"], ["TOLK-358", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 358: “தாய்என் கிளவி இயற்கை ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 358: “தாய்என் கிளவி இயற்கை ஆகும்.” — What does this sutra state?", "தாய் என்ற சொல் இயல்பாக முடியும். எ-டு.: தாய்கை, தாய்செவி, தாய்தலை, தாய்புறம் எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.148, நூ. 358", "", "easy", "false"], ["TOLK-360", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 360: “மெல்லெழுத்து உறழும் மொழியுமார் உளவே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 360: “மெல்லெழுத்து உறழும் மொழியுமார் உளவே.” — What does this sutra state?", "யகர ஈற்றுச் சொற்களில் சில வல்லெழுத்தோடு மெல்லெழுத்து வரப்பெற்று உறழ்ந்து முடியும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.148, நூ. 360", "", "easy", "false"], ["TOLK-362", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 362: “ரகார இறுதி யகார இயற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 362: “ரகார இறுதி யகார இயற்றே.” — What does this sutra state?", "எ-டு.: தேர்க்கால், தேர்ச்செலவு, தேர்த்தலை, தேர்ப்புறம் - வல்லெழுத்து மிக்கது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.149, நூ. 362", "", "easy", "false"], ["TOLK-363", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 363: “ஆரும் வெதிரும் சாரும் பீரும் மெல்லெழுத்து மிகுதல் மெய்பெறத் தோன்றும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 363: “ஆரும் வெதிரும் சாரும் பீரும் மெல்லெழுத்து மிகுதல் மெய்பெறத் தோன்றும்.” — What does this sutra state?", "இது ரகர ஈற்று மரப்பெயர்களுக்குச் சிறப்புவிதி கூறுகிறது. எ-டு.: ஆர்ங்கோடு, வெதிர்ங்கோடு, சார்ங்கோடு, பீர்ங்கோடு- ரகர ஈற்று மரப்பெயர்கள் மெல்லெழுத்து மிக்கு வந்தன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.149, நூ. 363", "", "easy", "false"], ["TOLK-365", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 365: “பீர் என் கிளவி அம்மொடு சிவணும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 365: “பீர் என் கிளவி அம்மொடு சிவணும்.” — What does this sutra state?", "எ-டு.: பீர்+கோடுஸ்ரீபீரங்கோடு, பீரஞ்செதில், பீரந்தோல், பீரம்பூ - மரப்பெயர்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.149, நூ. 365", "", "easy", "false"], ["TOLK-366", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 366: “லகார இறுதி னகார இயற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 366: “லகார இறுதி னகார இயற்றே.” — What does this sutra state?", "எ-டு.: கற்குறை, கற்சிறை, கற்றலை, கற்புறம் நெற்குறை, நெற்சோறு, நெற்றலை, நெற்புறம் எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.150, நூ. 366", "", "easy", "false"], ["TOLK-367", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 367: “மெல்லெழுத்து இயையின் னகாரம் ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 367: “மெல்லெழுத்து இயையின் னகாரம் ஆகும்.” — What does this sutra state?", "லகர ஈற்றுப் பெயர் மெல்லெழுத்து வந்து புணரின் னகரமாய்த் திரிந்து முடியும். எ-டு.: கன்ஞெரி, கன்னுளி, கன்முரி.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.150, நூ. 367", "", "easy", "false"], ["TOLK-369", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 369: “தகரம் வருவழி ஆய்தம் நிலையலும் புகர் இன்று என்மனார் புலமையோரே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 369: “தகரம் வருவழி ஆய்தம் நிலையலும் புகர் இன்று என்மனார் புலமையோரே.” — What does this sutra state?", "எ-டு.: கஃறீது, கற்றீது. நெடிலை யடுத்து இறுதிக்கண் நின்ற லகரம் திரிபு வல்லெழுத்தினொடு உறழ்தலும் ஆய்தமாய்த் திரிதலுமன்றி இயல்பாய் முடியும் சொற்களும் சில உள என்பதாம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.150, நூ. 369", "", "easy", "false"], ["TOLK-370", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 370: “நெடியதன் இறுதி இயல்புமார் உளவே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 370: “நெடியதன் இறுதி இயல்புமார் உளவே.” — What does this sutra state?", "எ-டு.: பால்கடிது, பால்சிறிது, பால்பெரிது. நெல், செல், கொல், சொல் என்னும் சொற்கள் ஏற்கும் முடிபுகள் நெல், செல், கொல், சொல் எனும் நான்கு சொற்களும் வல்லினம் வரின் அல்வழிக் கண்ணும், வேற்றுமை முடிபிற்றாய் லகரம் றகரமாய்த் திரிந்து முடியும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.151, நூ. 370", "", "medium", "false"], ["TOLK-372", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 372: “இல்என் கிளவி இன்மை செப்பின் வல்லெழுத்து மிகுதலும் ஒஇடை வருதலும் இயற்கை ஆதலும் ஆகாரம் வருதலும் கொளத்தகு மரபின் ஆகுஇடன் உடைத்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 372: “இல்என் கிளவி இன்மை செப்பின் வல்லெழுத்து மிகுதலும் ஒஇடை வருதலும் இயற்கை ஆதலும் ஆகாரம் வருதலும் கொளத்தகு மரபின் ஆகுஇடன் உடைத்தே.” — What does this sutra state?", "இல் என்னும் சொல் இன்மை என்ற பொருளில் வந்தால், வல்லெழுத்து மிகுதலும், ஐயிடை வருதலும், இயற்கையாதலும், ஆகாரம் பெற்று வருதலும் உண்டு.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.151, நூ. 372", "", "easy", "false"], ["TOLK-373", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 373: “வல்என் கிளவி தொழிற்பெயர் இயற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 373: “வல்என் கிளவி தொழிற்பெயர் இயற்றே.” — What does this sutra state?", "வல் என்னும் சொல் அல்வழி, வேற்றுமை இரண்டன்கண்ணும் ஞகர ஈற்றுத் தொழிற்பெயரின் இயல்பிற்றாய் வன்கணம் வர, உகரமும் வல்லெழுத்தும் மென்கணமும், இடைக்கணத்து வகரமும் வர உகரமும் பெற்று முடியும். எ-டு. வல்லுக்கடிது, சிறிது, தீது, பெரிது; ஞான்றது, நீண்டது, மாண்டது, வலிது எனவும், வல்லுக்கடுமை, வல்லுச்சிறுமை, வல்லுத்தீமை, பெருமை, ஞாற்சி, நீட்சி, மாட்சி, வலிமை எனவும் வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.152, நூ. 373", "", "medium", "false"], ["TOLK-374", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 374: “நாயும் பகையும் வரூஉம் காலை ஆவயின் உகரம் கெடுதலும் உரித்தே உகரம் கெடுவழி அகரம் நிலையும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 374: “நாயும் பகையும் வரூஉம் காலை ஆவயின் உகரம் கெடுதலும் உரித்தே உகரம் கெடுவழி அகரம் நிலையும்.” — What does this sutra state?", "இது நாய், பலகை வருங்கால் வல் எனும் சொற்கு எய்தியதன்மேல் சிறப்புவிதி கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.152, நூ. 374", "", "easy", "false"], ["TOLK-375", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 375: “பூல்வேல் என்றா ஆல்என் கிளவியொடு ஆமுப் பெயர்க்கும் அம்இடை வருமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 375: “பூல்வேல் என்றா ஆல்என் கிளவியொடு ஆமுப் பெயர்க்கும் அம்இடை வருமே.” — What does this sutra state?", "பூல்;, வேல்;, ஆல் என்னும் மரப்பெயர்கள் வேற்றுமையில் அம் சாரியை பெற்று முடியும். எ-டு.: பூலங்கோடு, வேலங்கோடு, ஆலங்கோடு (ஆல்+கோடுஸ்ரீஆலங்கோடு) எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.152, நூ. 375", "", "easy", "false"], ["TOLK-376", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 376: “தொழிற்பெயர் எல்லாம் தொழிற்பெயர் இயல.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 376: “தொழிற்பெயர் எல்லாம் தொழிற்பெயர் இயல.” — What does this sutra state?", "லகர ஈற்றுத் தொழிற்பெயர்கள் அல்வழியிலும் வேற்றுமையிலும் பிற தொழிற்பெயர்கள் போல உகரம் பெற்று முடியும். எ-டு.: கல்லுக்கடிது, கல்லுச்சிறிது, கல்லுத்தீது, கல்லுப்பெரிது - அல்வழி கல்லுக்கடுமை, கல்லுச்சிறுமை, கல்லுத்தீமை, கல்லுப்பெருமை - வேற்றுமை - இவற்றுள் வன்கணம் வர இருவழியும் உகரமும் வல்லெழுத்தும் பெற்று முடிந்தது. கல்லு ஞான்றது, கல்லுநீண்டது, கல்லுமாண்டது - அல்வழி கல்லுஞாற்சி, கல்லுநீட்சி, கல்லுமாட்சி - வேற்றுமை. மென்கணம் வர இருவழியும் உகரம் பெற்று முடிந்தது அறிக.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.153, நூ. 376", "", "medium", "false"], ["TOLK-377", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 377: “வெயில் என் கிளவி மழைஇயல் நிலையும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 377: “வெயில் என் கிளவி மழைஇயல் நிலையும்.” — What does this sutra state?", "வெயில் என்னும் சொல் மழை என்னும் சொல்லினைப்போல் அத்துச் சாரியையினையும் இன் சாரியையினையும் பெற்று முடியும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.153, நூ. 377", "", "easy", "false"], ["TOLK-378", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 378: “சுட்டு முதல் ஆகிய வகர இறுதி முற்படக் கிளந்த உருபுஇயல் நிலையும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 378: “சுட்டு முதல் ஆகிய வகர இறுதி முற்படக் கிளந்த உருபுஇயல் நிலையும்.” — What does this sutra state?", "இது வகர ஈற்றுப்பெயர்கள் நான்கனுள் சுட்டு முதலாகிய வகர ஈற்றுச் சொற்கள் மூன்றனுக்கு வேற்றுமை முடிபு கூறுகிறது. எ-டு.: அவற்றுக்கோடு, அவற்றுச்செவி, அவற்றுத்தலை, அவற்றுப்புறம்- என்பதில் அகரச்சுட்டினை முதலாக உடைய வகர ஈற்றுப் பெயர் வற்றுச் சாரியை பெற்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.154, நூ. 378", "", "medium", "false"], ["TOLK-379", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 379: “வேற்றுமை அல்வழி ஆய்தம் ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 379: “வேற்றுமை அல்வழி ஆய்தம் ஆகும்.” — What does this sutra state?", "இது சுட்டு முதல் வகர ஈற்றுக்கு அல்வழி முடிபு கூறுகிறது. எ-டு.: அஃகடிய, அஃசிறிய, அஃதீய, அஃபெரிய - வன்கணம் வரச் சுட்டுமுதல் வகரம் ஆய்தமாய்த் திரிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.154, நூ. 379", "", "easy", "false"], ["TOLK-380", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 380: “மெல்லெழுத்து இயையின் அவ்எழுத்து ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 380: “மெல்லெழுத்து இயையின் அவ்எழுத்து ஆகும்.” — What does this sutra state?", "இது சுட்டுமுதல் வகரம் மென்கணத்தோடு புணருமாறு கூறுகிறது. எ-டு.: அஞ்ஞாண், அந்நூல், அம்மணி - சுட்டுமுதல் வகரம் வரும் மெல்லினமாய்த் திரிந்தது. சுட்டு முதலாகிய வகர ஈறு அல்வழிக்கண் ஒழிந்த இடை, உயிர்க்கணங்கள் வந்து புணருமாயின் திரியாது இயல்பாய் முடியும் என்பர் தொல்லாசிரியர்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.154, நூ. 380", "", "medium", "false"], ["TOLK-381", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 381: “ஏனவை புணரின் இயல்புஎன மொழிப.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 381: “ஏனவை புணரின் இயல்புஎன மொழிப.” — What does this sutra state?", "இது சுட்டுமுதல் வகரம் இடை, உயிர்க்கணங்களோடு புணருமாறு கூறுகிறது. எ-டு.: அவ்யாழ், அவ்வட்டு, அவ்வடை, அவ்வாடை எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.154, நூ. 381", "", "easy", "false"], ["TOLK-382", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 382: “ஏனை வகரம் தொழிற்பெயர் இயற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 382: “ஏனை வகரம் தொழிற்பெயர் இயற்றே.” — What does this sutra state?", "ஒழிந்து நின்ற உரிச்சொல்லீற்று வகரம் இருவழியும், ஞகர ஈற்றுத் தொழிற்பெயர் இயல்பிற்றாய் வன்கணத்து உகரமும் வல்லெழுத்தும், மென்கணமும் இடைக்கணத்து வகரமும் வருங்கால் உகரமும் பெற்று முடியும். எ-டு.: தெவ்வுக்கடிது, சிறிது, தீது, பெரிது, ஞான்றது, நீண்டது, மாண்டது, வலிது எனவும், தெவ்வுக்கடுமை, சிறுமை, தீமை, பெருமை, ஞாற்சி, நீட்சி, மாட்சி, வலிமை எனவும் வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.155, நூ. 382", "", "medium", "false"], ["TOLK-383", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 383: “ழகார இறுதி யகார இயற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 383: “ழகார இறுதி யகார இயற்றே.” — What does this sutra state?", "இது ழகார ஈற்று வேற்றுமை முடிபு கூறுதல் நுதலிற்று. ழகர இறுதிப்பெயர்கள் வேற்றுமையில் ரகர ஈற்றுப்போல வல்லினம் வர வல்லெழுத்து மிக்கு முடியும். எ-டு.: பூழ்க்கால், பூழ்ச்சிறகு, பூழ்த்தலை, பூழ்ப்புறம் எனவரும். தாழ் என்னும் சொல்முன் கோல் வரின் பெறும் முடிபு தாழ் என்னும் சொல், கோல் என்னும் சொல்லொடு புணருங்கால் வல்லெழுத்து மிகுதலோடு அக்குச்சாரியை இடையே வருதலும் உரித்தாகும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.155, நூ. 383", "", "medium", "false"], ["TOLK-384", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 384: “தாழ்என் கிளவி கோலொடு புணரின் அக்குஇடை வருதல் உரித்தும் ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 384: “தாழ்என் கிளவி கோலொடு புணரின் அக்குஇடை வருதல் உரித்தும் ஆகும்.” — What does this sutra state?", "இது தாழ் என்னும் கிளவிக்கு எய்தியதன்மேற் சிறப்பு விதி கூறுகிறது. எ-டு.: தாழக்கோல் எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.155, நூ. 384", "", "easy", "false"], ["TOLK-385", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 385: “தமிழ்என் கிளவியும் அதனோ ரற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 385: “தமிழ்என் கிளவியும் அதனோ ரற்றே.” — What does this sutra state?", "எ-டு.: தமிழக்கூத்து, தமிழச்சேரி, தமிழத்தோட்டம், தமிழப்பள்ளி எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.156, நூ. 385", "", "easy", "false"], ["TOLK-386", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 386: “குமிழ்என் கிளவி மரப்பெயர் ஆயின் பீர்என் கிளவியொடு ஓர்இயற்று ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 386: “குமிழ்என் கிளவி மரப்பெயர் ஆயின் பீர்என் கிளவியொடு ஓர்இயற்று ஆகும்.” — What does this sutra state?", "குமிழ் என்னும் சொல் மரப்பெயராகி வந்தால் அது பீர் என்னும் மரப்பெயர்ச் சொல் போல மெல்லெழுத்து மிக்கும், அம் சாரியை பெற்றும் முடியும். எ-டு.: குமிழ்ங்கோடு, குமிழ்ஞ்செதிள், குமிழ்ந்தோல், குமிழ்ம்பூ - என்பதில் குமிழ் என்னும் மரப்பெயர் பீர் என்னும் பெயர்போல மெல்லொற்று மிக்கு முடிந்தது. குமிழங்கோடு, குமிழஞ்செதிள், குமிழந்தோல், குமிழம்பூ - என்பதில் குமிழ் என்னும் சொல் பீர் எனும் சொல்போல அம் சாரியை பெற்று முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.156, நூ. 386", "", "medium", "false"], ["TOLK-388", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 388: “ஏழ் என் கிளவி உருபு இயல் நிலையும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 388: “ஏழ் என் கிளவி உருபு இயல் நிலையும்.” — What does this sutra state?", "இது ஏழ் என்னும் எண்ணுப்பெயர்க்குச் சிறப்புவிதி கூறுகிறது. எ-டு.: ஏழன்காயம், ஏழன்சுக்கு, ஏழன்தோரை, ஏழன்பயறு எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.156, நூ. 388", "", "easy", "false"], ["TOLK-389", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 389: “அளவும் நிறையும் எண்ணும் வருவழி நெடுமுதல் குறுகலும் உகரம் வருதலும் கடிநிலை இன்றே ஆசியர்க்க.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 389: “அளவும் நிறையும் எண்ணும் வருவழி நெடுமுதல் குறுகலும் உகரம் வருதலும் கடிநிலை இன்றே ஆசியர்க்க.” — What does this sutra state?", "ஏழ் என்னும் அளவுப்பெயரும், நிறைப்பெயரும், எண்ணுப்பெயரும் புணரும் போது நெடுமுதல் குறுகி, அகரம் வருவது தவிர்தலில்லை என்பர் ஆசிரியர். எ-டு.: ஏழுகலம், ஏழுசாடி, ஏழுதூதை, ஏழுபானை எனவும், எழுகழஞ்சு, எழுதொடி, எழுபலம், எழுபஃது, எழுமூன்று எனவும், எழுபஃது, எழுமூன்று எனவும் வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.157, நூ. 389", "", "medium", "false"], ["TOLK-390", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 390: “பத்துஎன் கிளவி ஒற்றுஇடை கெடுவழி நிற்றல் வேண்டும் ஆய்தப் புள்ளி.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 390: “பத்துஎன் கிளவி ஒற்றுஇடை கெடுவழி நிற்றல் வேண்டும் ஆய்தப் புள்ளி.” — What does this sutra state?", "ஏழு என்பதற்கு எதிரே பத்து என்ற சொல் வந்தால் பத்தின் இடைஒற்று மறைந்து ஆய்தம் அவ்விடத்தில் நிலைபெறும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.157, நூ. 390", "", "easy", "false"], ["TOLK-391", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 391: “ஆயிரம் வருவழி உகரம் கெடுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 391: “ஆயிரம் வருவழி உகரம் கெடுமே.” — What does this sutra state?", "நெடுமுதல் குறுகி உகரம் பெற்ற எழு என்பதன் முன் ஆயிரம் வருங்கால் முன் பெற்றுநின்ற உகரம் கெடும். எ-டு.: ஏழூஆயிரம்ஸ்ரீஎழாயிரம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.157, நூ. 391", "", "easy", "false"], ["TOLK-392", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 392: “நூறு ஊர்ந்து வரூஉம் ஆயிரக்கிளவிக்குக் கூறிய நெடுமுதல் குறுக்கம் இன்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 392: “நூறு ஊர்ந்து வரூஉம் ஆயிரக்கிளவிக்குக் கூறிய நெடுமுதல் குறுக்கம் இன்றே.” — What does this sutra state?", "நூறு எனும் எண்ணினை ஊர்ந்துவரும் ஆயிரமாகிய சொல்லிற்கு மேற்கூறிய ஏழன் நெடுமுதற் குறுக்கமும் உகரப்பேறும் இல்லை. எ-டு.: ஏழூநூறாயிரம்ஸ்ரீஏழ்நூறாயிரம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.157, நூ. 392", "", "easy", "false"], ["TOLK-393", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 393: “ஐ அம் பல் என வரூஉம் இறுதி அல்பெயர் எண்ணும் ஆயியல் நிலையும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 393: “ஐ அம் பல் என வரூஉம் இறுதி அல்பெயர் எண்ணும் ஆயியல் நிலையும்.” — What does this sutra state?", "ஐ எனவும், அம் எனவும், பல் எனவும் வரும் இறுதிகளையுடைய பொருட்பெயர்கள் அல்லாத தாமரை, வெள்ளம், ஆம்பல் எனும் எண்ணுப்பெயர்கள் (பேரெண்கள்) வருங்காலத்தும் ஏழன் நெடுமுதல் குறுக்கமும் உகரப்பேறும் இன்றி நிற்கும். எ-டு.: ஏழூதாமரைஸ்ரீஏழ்தாமரை, ஏழ்வெள்ளம், ஏழாம்பல்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.158, நூ. 393", "", "medium", "false"], ["TOLK-394", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 394: “உயிர்முன் வரினும் ஆயியல் திரியாது.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 394: “உயிர்முன் வரினும் ஆயியல் திரியாது.” — What does this sutra state?", "அளவுப்பெயரும் எண்ணுப்பெயருமாகிய உயிர்முதன் மொழிகள் வரினும் ஏழ் என்பது நெடுமுதல் குறுக்கமும் உகரப்பேறும் இன்றிமுடியும். எ-டு.: ஏழூஅகல்ஸ்ரீஏழகல், ஏழுழக்கு, ஏழொன்று, ஏழிரண்டு, ஏழைந்து, ஏழாறு, ஏழெட்டு, ஏழொன்பது எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.158, நூ. 394", "", "medium", "false"], ["TOLK-395", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 395: “கீழ்என் கிளவி உறழத் தோன்றும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 395: “கீழ்என் கிளவி உறழத் தோன்றும்.” — What does this sutra state?", "கீழ் என்னும் சொல் இயல்பாகவும், வல்லெழுத்து மிக்கும் முடியும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.158, நூ. 395", "", "easy", "false"], ["TOLK-396", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 396: “ளகார இறுதி ணகார இயற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 396: “ளகார இறுதி ணகார இயற்றே.” — What does this sutra state?", "இது ளகர ஈற்றுப்பெயர் வேற்றுமைக்கண் வன்கணத்தோடு முடியுமாறு கூறுகிறது. எ-டு.: முள்+குறைஸ்ரீமுட்குறை, முட்சிறை, முட்டலை, முட்புறம் எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.159, நூ. 396", "", "easy", "false"], ["TOLK-399", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 399: “ஆய்தம் நிலையலும் வரைநிலை இன்றே தகரம் வரூஉம் காலையான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 399: “ஆய்தம் நிலையலும் வரைநிலை இன்றே தகரம் வரூஉம் காலையான.” — What does this sutra state?", "தகரம் வரும்போது ஆய்தமாகத் திரிவதும் ஏற்றுக்கொள்ளக் கூடியதாகும். எ-டு.: முள்+தீது ஸ்ரீ முஃடீது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.159, நூ. 399", "", "easy", "false"], ["TOLK-400", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 400: “நெடியதன் இறுதி இயல்பு ஆகுநவும் வேற்றுமை அல்வழி வேற்றுமை நிலையலும் போற்றல் வேண்டும் மொழியுமார் உளவே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 400: “நெடியதன் இறுதி இயல்பு ஆகுநவும் வேற்றுமை அல்வழி வேற்றுமை நிலையலும் போற்றல் வேண்டும் மொழியுமார் உளவே.” — What does this sutra state?", "வாள், கோள், நாள் போன்ற நெட்டெழுத்தின் இறுதிச் சொற்கள் இயல்பாகும் என்பதற்கேற்ப, அல்வழியிலும் இயல்பாகவும், சிலநேரங்களில் வேற்றுமை போன்று திரிந்தும் வருவதும் உண்டு. இவற்றை ஏற்றுக் கொள்ளுதல் வேண்டும். எ-டு.: வாள்கடிது, வாள்சிறிது, வாள்பெரிது எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.160, நூ. 400", "", "medium", "false"], ["TOLK-401", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 401: “தொழிற்பெயர் எல்லாம் தொழிற்பெயர் இயல.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 401: “தொழிற்பெயர் எல்லாம் தொழிற்பெயர் இயல.” — What does this sutra state?", "எ-டு.: துள்ளுக்கடிது, துள்ளுச்சிறிது, துள்ளுத்தீது, துள்ளுப்பெரிது எனவும். துள்ளுக்கடுமை, துள்ளுச்சிறுமை, துள்ளுத்தீமை, துள்ளுப்பெருமை எனவும் துள்ளு ஞான்றது, துள்ளு நீண்டது, துள்ளு மாண்டது எனவும், துள்ளு ஞாற்சி, துள்ளுநீட்சி, துள்ளுமாட்சி எனவும் துள்ளு வலிது, துள்ளுவலிமை எனவும் வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.160, நூ. 401", "", "medium", "false"], ["TOLK-402", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 402: “இருள் என் கிளவி வெயில்இயல் நிலையும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 402: “இருள் என் கிளவி வெயில்இயல் நிலையும்.” — What does this sutra state?", "இருள் என்னும் சொல் வெயில் என்ற சொல் போன்று அத்தும், இன்னும் பெற்று முடியும். எ-டு.: இருளத்துக்கொண்டான், இருளத்துச்சென்றான், இருளத்துத்தந்தான், இருளத்துப்போனான் - எனவும்,", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.160, நூ. 402", "", "easy", "false"], ["TOLK-403", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 403: “புள்ளும் வள்ளும் தொழிற்பெயர் இயல.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 403: “புள்ளும் வள்ளும் தொழிற்பெயர் இயல.” — What does this sutra state?", "புள், வள் என்னும் சொற்கள் தொழிற்பெயர் போல உகரம் பெற்றும் வல்லெழுத்து மிக்கும் முடியும். எ-டு.: புள்ளுக்கடிது, புள்ளுச்சிறிது, புள்ளுத்தீது, புள்ளுப்பெரிது எனவும், புள்ளுக்கடுமை, புள்ளுச்சிறுமை, புள்ளுத்தீமை, புள்ளுப்பெருமை எனவும் புள்ளு ஞான்றது, புள்ளு நீண்டது, புள்ளு மாண்டது எனவும், புள்ளு ஞாற்சி, புள்ளு நீட்சி, புள்ளு மாட்சி எனவும் புள்ளு வலிது, புள்ளு வலிமை எனவும் வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.161, நூ. 403", "", "medium", "false"], ["TOLK-404", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 404: “மக்கள் என்னும் பெயர்ச்சொல் இறுதி தக்கவழி அறிந்து வலித்தலும் உரித்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 404: “மக்கள் என்னும் பெயர்ச்சொல் இறுதி தக்கவழி அறிந்து வலித்தலும் உரித்தே.” — What does this sutra state?", "மக்கள் என்னும் பெயர்நிலைக்கிளவி ஈறு, தக்க இடங்களில் வல்லொற்றாய் முடிவதும் உண்டு. எ-டு.: மக்கட்கை, மக்கட்செவி, மக்கட்புறம் எனவும், மக்கள் கை, மக்கள்செவி, மக்கள்புறம் எனவும் வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.161, நூ. 404", "", "easy", "false"], ["TOLK-406", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 406: “ஈர்எழுத்து ஒருமொழி உயிர்த்தொடர் இடைத்தொடர் ஆய்தத்தொடர்மொழி வன்றொடர் மென்றொடர் ஆயிரு மூன்றே உகரம் குறுகு இடன்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 406: “ஈர்எழுத்து ஒருமொழி உயிர்த்தொடர் இடைத்தொடர் ஆய்தத்தொடர்மொழி வன்றொடர் மென்றொடர் ஆயிரு மூன்றே உகரம் குறுகு இடன்.” — What does this sutra state?", "இஃது உகரம் குறுகும் இடத்திற்குப் பெயரும் முறையும் தொகையும் கூறுகிறது. எ-டு.: நாகு, வரகு, தௌ;கு, எஃகு, நாக்கு, குரங்கு எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.166, நூ. 406", "", "easy", "false"], ["TOLK-407", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 407: “அவற்றுள் ஈர்ஒற்றுத் தொடர்மொழி இடைத்தொடர் ஆகா.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 407: “அவற்றுள் ஈர்ஒற்றுத் தொடர்மொழி இடைத்தொடர் ஆகா.” — What does this sutra state?", "இஃது அவ்வாறனுள் ஒன்றனுக் கெய்திய ஐயத்தினை விலக்குகிறது. அல்வழிப்புணர்ச்சிக்கண் கூறினும், வேற்றுமைப்புணர்ச்சிக்கண் கூறினும் ஆறு ஈற்றுக் குற்றியலுகரங்களும் நிறைந்தே நிற்கும். எ-டு.: ஈர்க்கு, மொய்ம்பு எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.167, நூ. 407", "", "medium", "false"], ["TOLK-408", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 408: “அல்லது கிளப்பினும் வேற்றுமைக் கண்ணும் எல்லா இறுதியும் உகரம் நிறையும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 408: “அல்லது கிளப்பினும் வேற்றுமைக் கண்ணும் எல்லா இறுதியும் உகரம் நிறையும்.” — What does this sutra state?", "மொழிமரபின்கண் குற்றியலுகரம், தன் அரை மாத்திரையிற் குறுகும் இடனும் உண்டு ; உம்மையான் குறுகா இடனும் உண்டு என்றார். அவற்றுள் குறுகா இடனை இந்நூற்பாவான் எடுத்துரைக்கின்றார் தொல்காப்பியர். எ-டு.: நாகு கடிது, வரகு கடிது, தௌ;கு கடிது, எஃகு கடிது, குரங்கு கடிது - அல்வழிக்கண் தன் அரைமாத்திரை அளவாய் நின்றது. நாகு கடுமை, வரகுகடுமை, தௌ;கு கடுமை, எஃகு கடுமை, குரங்கு கடுமை - வேற்றுமைக்கண் குற்றியலுகரம் தன் அரைமாத்திரை அளவாய் நின்றது. அல்வழிக்கண்ணும், வேற்றுமைக்கண்ணும் வல்லொற்றுத் தொடர்மொழிக் குற்றியலுகரம், வல்லின முதன்மொழி குறித்துவரு கிளவியாய் வருமிடத்து முன்பு மொழிமரபின்கண் கூறியவாறு தன் அரைமாத்திரையிற் குறுகிநிற்கும் இயல்பில் நிற்றலும் உரித்து.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.167, நூ. 408", "", "hard", "false"], ["TOLK-409", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 409: “வல்லொற்றுத் தொடர்மொழி வல்லெழுத்து வருவழி தொல்லை இயற்கை நிலையலும் உரித்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 409: “வல்லொற்றுத் தொடர்மொழி வல்லெழுத்து வருவழி தொல்லை இயற்கை நிலையலும் உரித்தே.” — What does this sutra state?", "மொழிமரபின்கண் தொடர்மொழிக் குற்றியலுகரம் தன் அரைமாத்திரையின் குறுகும் இடமும் உண்டு; குறுகா இடனும் உண்டு என்றார். அவற்றுள் குறுகும் இடனை இந்நூற்பாவான் வரையறுக்கின்றார்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.167, நூ. 409", "", "easy", "false"], ["TOLK-410", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 410: “யகரம் வருவழி இகரம் குறுகும் உகரக் கிளவி துவரத் தோன்றாது.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 410: “யகரம் வருவழி இகரம் குறுகும் உகரக் கிளவி துவரத் தோன்றாது.” — What does this sutra state?", "இது மொழிமரபின்கண் கூறிய தொடர்மொழிக் குற்றியலுகரம் புணர்மொழிக்கண் வருமாறு கூறுகிறது. எ-டு.: நாகியாது, வரகியாது, தௌ;கியாது, எஃகியாது, கொக்கியாது, குரங்கியாது - அல்வழிக்கண் யகரம் வர அதன் இயைபான் வந்த இகரம் குறுகிற்று.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.168, நூ. 410", "", "medium", "false"], ["TOLK-411", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 411: “ஈர்எழுத்து மொழியும் உயிர்த்தொடர் மொழியும் வேற்றுமையாயின் ஒற்றுஇடை இனமிகத் தோற்றம் வேண்டும் வல்லெழுத்து மிகுதி.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 411: “ஈர்எழுத்து மொழியும் உயிர்த்தொடர் மொழியும் வேற்றுமையாயின் ஒற்றுஇடை இனமிகத் தோற்றம் வேண்டும் வல்லெழுத்து மிகுதி.” — What does this sutra state?", "இஃது ஆறீற்றுக் குற்றுகரங்களுள் முன்நின்ற இரண்டற்கு வேற்றுமை முடிபு கூறுகிறது. எ-டு.: யாட்டுக்கால், பாட்டுக்கால் - நெடிற்றொடர் இனஒற்று இடைமிக ஈற்றில் வல்லொற்று மிக்கு முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.168, நூ. 411", "", "easy", "false"], ["TOLK-412", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 412: “ஒற்றுஇடை இனம்மிகா மொழியுமார் உளவே அத்திறத்து இல்லை வல்லெழுத்து மிகலே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 412: “ஒற்றுஇடை இனம்மிகா மொழியுமார் உளவே அத்திறத்து இல்லை வல்லெழுத்து மிகலே.” — What does this sutra state?", "இது இன ஒற்று இடைமிகாச் சொற்களை வரையறுக்கிறது. பகட்டுக்கால், முயிற்றுக்கால் - உயிர்த்தொடர் இனஒற்று இடைமிக ஈற்றில் வல்லொற்று மிக்கு முடிந்தது. எ-டு.: நாகுகால், நாகுசினை, நாகுதலை, நாகுபுறம்- உகரமூர்ந்த ககர ஈற்று நெடிற்றொடர் இயல்பாயிற்று. வரகுகதிர், வரகுசினை, வரகுதலை, வரகுபுறம் - உகரமூர்ந்த ககர ஈற்று உயிர்த்தொடர் இயல்பாயிற்று.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.169, நூ. 412", "", "medium", "false"], ["TOLK-413", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 413: “இடையொற்றுத் தொடரும் ஆய்தத் தொடரும் நடைஆயியல என்மனார் புலவர்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 413: “இடையொற்றுத் தொடரும் ஆய்தத் தொடரும் நடைஆயியல என்மனார் புலவர்.” — What does this sutra state?", "இஃது ஆறீற்றுக் குற்றுகரங்களுள் இடைக்கண் நின்ற இரண்டனுக்கு வேற்றுமை முடிபு கூறுகிறது. எ-டு.: தௌ;குகால், தௌ;குசிறை, தௌ;குதலை, தௌ;குபுறம் - இடைத்தொடர் வேற்றுமைக்கண் வன்கணம் வர இயல்பாயிற்று.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.169, நூ. 413", "", "easy", "false"], ["TOLK-414", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 414: “வன்றொடர் மொழியும் மென்றொடர் மொழியும் வந்த வல்லெழுத்து ஒற்று இடை மிகுமே மெல்லொற்றுத் தொடர்மொழி மெல்லொற்று எல்லாம் வல்லொற்று இறுதி கிளைஒற்று ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 414: “வன்றொடர் மொழியும் மென்றொடர் மொழியும் வந்த வல்லெழுத்து ஒற்று இடை மிகுமே மெல்லொற்றுத் தொடர்மொழி மெல்லொற்று எல்லாம் வல்லொற்று இறுதி கிளைஒற்று ஆகும்.” — What does this sutra state?", "இஃது ஈறீற்றுக் குற்றுகரங்களுள் இறுதிக்கண் நின்ற இரண்டனுக்கு வேற்றுமை முடிபு கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.169, நூ. 414", "", "easy", "false"], ["TOLK-415", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 415: “மரப்பெயர்க் கிளவிக்கு அம்மே சாரியை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 415: “மரப்பெயர்க் கிளவிக்கு அம்மே சாரியை.” — What does this sutra state?", "இது குற்றியலுகர ஈற்று மரப்பெயர்க்கு எய்தியது விலக்கிப் பிறிது விதி கூறுகிறது. எ-டு.: தேக்கங்கோடு, தேக்கஞ்செதிள், தேக்கந்தோல், தேக்கம்பூ - வன்றொடர் அம் சாரியை பெற்றது. குருத்தங்கோடு, குருத்தஞ்செதிள், குருத்தந்தோல், குருந்தம்பூ-மென்றொடர் அம் சாரியை பெற்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.170, நூ. 415", "", "medium", "false"], ["TOLK-416", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 416: “மெல்லொற்று வலியா மரப்பெயரும் உளவே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 416: “மெல்லொற்று வலியா மரப்பெயரும் உளவே.” — What does this sutra state?", "தொடர்மொழிக் குற்றுகர ஈற்றயல் மெல்லொற்று வல்லொற்றாய்த் திரியாது முடியும் மரப்பெயர்களும் உள்ளன. எ-டு.: வேப்பங்கோடு, வேப்பஞ்செதிள், வேப்பந்தோல், வேப்பம்பூ-அம் சாரியை பெறுதலோடு ஈற்றயல் மெல்லொற்று வல்லொற்றாய்த் திரிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.170, நூ. 416", "", "medium", "false"], ["TOLK-417", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 417: “ஈர்எழுத்து மொழியும் வல்லொற்றுத் தொடரும் அம்இடை வரற்கும் உரியவை உளவே அம்மரபு ஒழுகும் மொழிவயினான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 417: “ஈர்எழுத்து மொழியும் வல்லொற்றுத் தொடரும் அம்இடை வரற்கும் உரியவை உளவே அம்மரபு ஒழுகும் மொழிவயினான.” — What does this sutra state?", "எ-டு.: ஏறங்கோள் - நெடிற்றொடர் அம் சாரியை பெற்றது. வட்டம்போர் - வன்றொடர் (வட்டு) அம் சாரியை பெற்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.170, நூ. 417", "", "easy", "false"], ["TOLK-418", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 418: “ஒற்றுநிலை திரியாது அக்கொடு வரூஉம் அக்கிளை மொழியும் உளஎன மொழிப.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 418: “ஒற்றுநிலை திரியாது அக்கொடு வரூஉம் அக்கிளை மொழியும் உளஎன மொழிப.” — What does this sutra state?", "எ-டு.: குன்றக்கூகை, மன்றப்பெண்ணை. எண்ணுப்பெயர்களாகிய சொற்கள் உருபு புணர்ச்சியின் இயல்பின்கண் நின்று அன் சாரியை பெற்று முடியும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.171, நூ. 418", "", "easy", "false"], ["TOLK-419", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 419: “எண்ணுப் பெயர்க் கிளவி உருபுஇயல் நிலையும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 419: “எண்ணுப் பெயர்க் கிளவி உருபுஇயல் நிலையும்.” — What does this sutra state?", "இது மரப்பெயரொழிந்த நெடிற்றொடர், வன்றொடர் மொழிகள் அம் சாரியை பெறுமாறு கூறுகிறது. எ-டு.: ஒன்றன்காயம், ஒன்றன்சுக்கு, ஒன்றன்றோரை, ஒன்றன்பயறு - என்பதில் எண்ணுப்பெயர் பொருட்புணர்ச்சிக்கண் அன் சாரியை பெற்று நின்றமை காண்க. ஒன்றன்ஞாண், ஒன்றன்னூல், ஒன்றன்மணி - மெல்லினம்", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.171, நூ. 419", "", "medium", "false"], ["TOLK-420", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 420: “வண்டும் பெண்டும் இன்னொடு சிவணும்” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 420: “வண்டும் பெண்டும் இன்னொடு சிவணும்” — What does this sutra state?", "வண்டு, பெண்டு எனும் இருசொற்களும், இன் சாரியையோடு பொருந்தி முடியும். எ-டு.: வண்டின்கால், வண்டின்செவி, வண்டின்றலை, வண்டின்புறம் - எனில் வண்டு இன் சாரியை பெற்றது. பெண்டு என்னும் சொல்லிற்கு இன்னே அன்றி அன் சாரியையும் நீக்கார் ஆசிரியர்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.171, நூ. 420", "", "medium", "false"], ["TOLK-421", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 421: “பெண்டு என் கிளவிக்கு அன்னும் வரையார்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 421: “பெண்டு என் கிளவிக்கு அன்னும் வரையார்.” — What does this sutra state?", "எ-டு.: பெண்டன்கை, பெண்டன்செவி, பெண்டன்றலை, பெண்டன்புறம் - என்பதில் பெண்டு என்னும் சொல் அன் சாரியை பெற்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.171, நூ. 421", "", "easy", "false"], ["TOLK-422", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 422: “யாதுஎன் இறுதியும் சுட்டுமுதல் ஆகிய ஆய்த இறுதியும் உருபு இயல் நிலையும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 422: “யாதுஎன் இறுதியும் சுட்டுமுதல் ஆகிய ஆய்த இறுதியும் உருபு இயல் நிலையும்.” — What does this sutra state?", "இது நெடிற்தொடருள் வினாப்பெயர்க்கும், சுட்டுமுதல் ஆய்தப் பெயர்க்கும் வேறு முடிபு கூறுகிறது. எ-டு.: யாதன்கோடு, யாதன்செவி, யாதன்றலை, யாதன்புறம் - என்பதில் யாது என்னும் வினாப்பெயர் அன் சாரியை பெற்றது. அதன்கோடு, அதன்செவி, அதன்றலை, அதன்புறம் - என்பதில் சுட்டு முதலாகிய ஆய்தப்பெயர் அன் சாரியை பெற்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.172, நூ. 422", "", "medium", "false"], ["TOLK-423", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 423: “முன்உயிர் வரும்இடத்து ஆய்தப்புள்ளி மன்னல் வேண்டும் அல்வழியான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 423: “முன்உயிர் வரும்இடத்து ஆய்தப்புள்ளி மன்னல் வேண்டும் அல்வழியான.” — What does this sutra state?", "இது சுட்டு முதலாகிய ஆய்தப்பெயர்முன் அல்வழிக்கண் உயிர்வருங்கால் முடியும் முடிபு கூறுகிறது. எ-டு.: அஃதடை, இஃதடை, உஃதடை-தனக்குமுன் உயிர் வரச் சுட்டு முதலாகிய ஆய்தத் தொடர்க் குற்றியலுகரத்தின் ஆய்தம் கெடாது நின்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.172, நூ. 423", "", "medium", "false"], ["TOLK-424", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 424: “ஏனைமுன் வரினே தான்நிலை இன்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 424: “ஏனைமுன் வரினே தான்நிலை இன்றே.” — What does this sutra state?", "சுட்டுமுதல் ஆய்தத் தொடர்க் குற்றியலுகரத்தின்முன் உயிர்க்கண்ம் ஒழிந்தவை வரின் அல்வழிக்கண் அவ்வாய்தம் கெட்டு முடியும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.172, நூ. 424", "", "easy", "false"], ["TOLK-425", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 425: “அல்லது கிளப்பின் எல்லா மொழியும் சொல்லிய பண்பின் இயற்கை ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 425: “அல்ல
