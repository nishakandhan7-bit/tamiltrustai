 நிலையாக தங்கி இருப்பது அரிதாக இருக்கும் குளத்தினை உற்று நோக்கி எப்போது பெரிய மீன் வரும் என்று பார்த்திருந்து காத்திருந்து, கயல் மீன்கள் வரும்போது பாய்ந்து சென்று கவர்ந்து உண்ணும் நாரையின் நகம் கிழித்த தழும்புகளை ஆழமாகப் பதித்துக் கொண்ட பசுமையான இலைகளையும் முள் பொருந்தியுள்ள தண்டினையும் உடைய வெண் தாமரை மலரில் தேனினை உண்ணக்கூடிய கருமை நிறத்தின் வண்டுகளின் வரிசை நிலவினை விழுங்கும் கருமை நிறமுடைய பாம்பினைப் போலத் தோன்றும் என்று மருத நிலத்தின் ஒழுக்கங்களைக் குளிர்ச்சி பொருந்திய வயல்களை உடையதும் கல்வி கற்றவர்களான நல்லறிவுடைய சான்றோர்களை உடையதும், அரிதான காவல் இடங்களைக் கொண்டுள்ளதும், அகலமான பரப்புகளை உடைய வீடுகள் கொண்டதும், அகழிகளைக் கொண்டிருப்பதுமான நல்லியக்கோடனின் ஆமூரின்கண் சென்று சேர்வீர்கள். அவ்வாறு வந்து சேர்ந்தால் அங்கு வலம்பட நடக்கும் வலிமை உடைய எருதுகளை உடைய உழவர்கள் தங்கையாகிய பெண் யானையின் தும்பிக்கையினைப் போன்ற சடை கிடக்கும் சிறிய முதுகினையும் தொடி என்னும் அணிகலன் அணிந்த கைகளை உடைய பெண் தன்னுடைய மக்களால் உங்களை தடுத்து நிறுத்தி முறையாக சிறப்பாக அமைந்த வெண்மை நிறமுடைய அரிசியினால் சமைக்கப்பட்ட சோற்றினை நண்டுடன் உங்களுக்கு வழங்க நீங்கள் மகிழ்ந்து உண்பீரக ; ள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.17, p.319", "", "hard", "false"], ["SANG-14-18", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “நல்லியக்கோடனின் ஊர் இருக்குமிடம் தொலைவு” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “நல்லியக்கோடனின் ஊர் இருக்குமிடம் தொலைவு” (section 14.18).", "அருகில்தான் : எரி மறிந்தன்ன நாவின், இலங்கு எயிற்றுக் கரு மறிக் காதின்,;கவை அடிப் Nடீபய் மகள், நிணன் உண்டு சிரித்த தோற்றம் போல, பிணன் உகைத்துச் சிவந்த பேர் உகிர் பணைத்தாள் அண்ணல் யானை அருவி துகள் அவிப்ப, நீறு அடங்கு தெருவின், அவன் சாறு அயர் மூதூர் சேய்த்தும் அன்று, சிறிது நணியதுவே நீங்கள் அனைவரும் ஆமூரை சென்று சேர்ந்த பின்னர், தீயின் ஒளிப்பிழம்பானது காய்ந்து காட்சி தருவதனைப் போன்ற நாக்கினையும் ஒளிவீசும் பற்களையும் உடைய வெள்ளாட்டுக் குட்டிகளை அணிகலனாக அணிந்துள்ள காதுகளையும், பிளந்துள்ளப் பாதத்தினை உடைய பெண் சிரித்ததைப் போன்று தோன்று கின்ற போர் களத்தினில் தம்மால் கொல்லப்பட்ட பிணங்களைக் காலால் உதைப்பதனால் இரத்தம் தோய்ந்து சிவந்த நிறத்துடன் தோன்றும் பெரிய நகங்களை உடைய, பெரிய கால்களை உடையனவும், தலைமைப் பண்புகளை உடைய யானைகளின் மதநீரானது அருவியினைப்போன்று வழிவதனால் துகள் அடங்கிப் புழுதி அடங்கியதும், திருவிழா நிகழ்கின்ற பாதைகளை உடைய வள்ளலின் பழமையான ஊரில் இருந்து மிக தூரமாக உள்ளது என்று எண்ண வேண்டாம் அவை மிக அருகிலேயே உள்ளன.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.18, p.321", "", "medium", "false"], ["SANG-14-19", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “நல்லியக்கோடனின் அரண்மனை வாயில்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “நல்லியக்கோடனின் அரண்மனை வாயில்” (section 14.19).", "பொருநர்ககு ; ஆயினும், புலவர்க்கு ஆயினும், அருமறை நாவின் அந்தணர்க்கு ஆயினும், கடவுள் மால் வரை கண்விடுத்தன்ன, அடைய வாயில் அவன் அருங்கடை குறுகி பொருநர், புலவர், வேதம் ஓதக்கூடிய அந்தணர்கள் முதலான அனைவரும் வருவதன் காரணமாக எப்போதும் அடைக்கப்படாமல் உள்ளதும், இமயமலையானது கண்ணைத் திறந்து பார்ப்பதனைப் போன்ற வாயிலினை உடையதுமான அவனுடைய பெரிய அரண்மனையில் மற்றவர்கள் எளிதில் நுழைவது என்பது எளிதான செயல் அல்ல. அத்தகைய அரண்மனையின் வாயிலினை நீங்கள் சென்று அடைவீர்கள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.19, p.321", "", "medium", "false"], ["SANG-14-20", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “மன்னனைச் சான்றோர் புகழ்தல்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “மன்னனைச் சான்றோர் புகழ்தல்” (section 14.20).", "செய்நன்றி அறிதலும், சிற்றினம் இன்மையும், இன்முகம் உடைமையும், இனியன் ஆதலும், செறிந்து விளங்கு சிறப்பின் அறிந்தோர் ஏத்த, அந்த வள்ளலின் கொடைப் பண்பாகிய செய்நன்றி அறிதலின் சிறப்பினையும், தீயவர்களுடன் தொடர்பு கொள்ளாத சிறப்பினையும், எப்போதும் இனிமை உடையவனாக திகழ்கின்ற சிறப்பினையும், அகம், புறம் இரண்டிலும் சிறந்து விளங்கும் சிறப்பினையும், அவன் மீது மிகுந்த அன்புகொண்டு சான்றோர்கள் எடுத்துரைக்கவும்,", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.20, p.321", "", "easy", "false"], ["SANG-14-21", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “மன்னனின் குணம்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “மன்னனின் குணம்” (section 14.21).", "அஞ்சினர்க்கு அளித்தலும், வெஞ்சினம் இன்மையும் ஆண் அணி புகுதலும், அழிபடை தாங்கலும், வாள் மீக்கூற்றத்து வயவர் ஏத்த அந்த வள்ளலின் வலிமையினைக் கண்டு பயந்து அவனுடைய பாதங்களை வந்து பணிந்து தஞ்சம் அடைந்த பகைவர்களுக்கு இரக்கம் காட்டும் பெருமையினையும், கோபம் கொள்ளாமை என்பதான உயர்ந்த குணத்தினையும், பகைவர்களின் படையினிடையே அச்சம் இன்றி உள்நுழைந்து தன் படைவீரர்களின் வலிமை குன்றிய போது தானே முன் சென்று பகைவர்களை வெற்றி கொள்ளும் வீரத்தையும் போர் வீரர்கள் புகழ்ந்து கொண்டிருந்தனர்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.21, p.322", "", "medium", "false"], ["SANG-14-22", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “ஆளுமைப் பண்பு” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “ஆளுமைப் பண்பு” (section 14.22).", "கருதியது முத்தலும், காமுறப்படுதலும், ஒருவழிப் படாமையும், ஓடியது உணர்தலும், அரிஏர் உண்கண் அரிவையர் ஏத்த அந்த வள்ளலின் மனமானது எதனை எண்ணுகின்றனோ அதனை அவ்வண்ணமே முடிக்கும் இயல்பினையும், பெண்கள் விரும்பக் கூடியதான தன்மைகளையும், அதே சமயம் பெண்களுக்கு அவன் அடிமையாகி விடாததான தன்மையினையும் சிறந்த குணத்துடன் கூடிய பெண்களைப் பாதுகாத்து அருளக் கூடியதான சிறந்த பண்பினையும் செம்மையான கோடுகள் நிறைந்த கண்ணை உடைய பெண்கள் போற்றி உரைத்தனர்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.22, p.322", "", "medium", "false"], ["SANG-14-23", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “பரிசு வழங்கும் சிறப்பு” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “பரிசு வழங்கும் சிறப்பு” (section 14.23).", "அறிவு மடம் படுதலும், அறிவு நன்கு உடைமையும், வரிசை அறிதலும், வரையாது கொடுத்தலும், பரிசில் வாழ்க்கைப் பரிசிலர் ஏத்த நல்லியக்கோடன் பகைவரால் அறியப்படுவதற்கு மிகவும் அரிதாக இருத்தலையும், சான்றோர்களிடம் அறிவுத் திறனில் சிறந்து விளங்குவதனையும் பரிசு வேண்டி வந்தவர்களின் சிறப்பிற்கேற்ப பரிசு வழங்குவதனையும், தகுதி இல்லாதவர்களுக்கும் பசிவு வழங்கிச் சிறப்பிப்பதனையும் பரிசு பெற வந்த இரவலர்கள் புகழ்ந்து கொண்டிருக்கவும்,", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.23, p.322", "", "medium", "false"], ["SANG-14-24", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “நல்லியக்கோடன் அவையில் வீற்றிருக்கும் காட்சி” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “நல்லியக்கோடன் அவையில் வீற்றிருக்கும் காட்சி” (section 14.24).", "பன்மீன் நடுவண் பால்மதி போல இன்நகை ஆயமொடு இருந்தோற் குறுகி வானத்தில் விண்மீன்களின் இடையே தோற்றம் தரக்கூடியதான நிலவினைப் போன்ற இனிமையுடைய மகிழ்வினைத் தரக்கூடிய சான்றோர்கள், வயவர், பெண்கள், இரவலர்கள் ஆகியவர்களின் கூட்டத்திற்கு இடையில் அரசவையில் கொலு மண்டபத்தில் வீற்றிருக்கும் நல்லியக்கோடனின் அருசில் சென்று அணுகி, நீங்கள்,", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.24, p.322", "", "easy", "false"], ["SANG-14-25", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “மன்னனின் விருந்தோம்பல்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “மன்னனின் விருந்தோம்பல்” (section 14.25).", "பைங்கண் ஊகம் பாம்பு பிடித்தன்ன, அம்கோடு செறிந்த அவிழ்ந்து வீங்கு திவவின், மணி நிரைத்தன்ன வனப்பின் வாய் அமைத்து, வயிறு சேர்பு ஒழுகிய வகை அமை அகளத்து, கானக் குமிழின் கனி நிறம் கடுப்ப, புகழ் வினைப் பொலிந்த பச்சையொடு, தேம் பெய்து, அமிழ்து பொதிந்து இலிற்றும் அடங்கு புரி நரம்பின், பாடு துறை முற்றிய பயன் தெரி கேள்விக் கூடு கொள் இன் இயம் குரல் குரல் ஆக, நூல் நெறி மரபின், பண்ணி ஆனாது மன்னனைப் புகழ்ந்து பாடும் தன்மை : முதுவோர்க்கு முகிழ்த்த கையினை எனவும், இளயோர்க்கு மலர்;ந்த மார்பினை எனவும், ஏரோர்க்கு நிழன்ற கோலினை எனவும், தேரோர்ககு; அழன்ற வேலினை எனவும், நீ சில மொழியா அளவை ….. …. பசுமையான கண்களை உடையதான குரங்கு பாம்பின் தலையினைப் பிடித்தபோது, அந்தப் பாம்பானது குரங்கின் கையினைச் சுற்றி இறுக்கிக் கொள்ளும் நெகிழ்வைப் போன்ற அழகான தன்மையுடன் அமைக்கப்பட்ட யாழின் தண்டுகளில் தேவை உள்ளபோது நெகிழ்வு படுத்தவும், இறுக்கிக் கொள்வதற்கும் உரியதான வகையில் அமைக்கப்பட்டதான வார்க்கட்டினையும், வைரக் கற்கள் வரிசையாக வைத்ததனைப் போன்று இரண்டு தலைப்பினையும் ஒன்று சேர்த்து இறுக்கப்பட்ட அழகான ஆணிகளையும் பொருத்தமாக அமைக்கப்பட்ட குடம் போன்ற பிற்பகுதியில் குமிழம் பழத்தின் நிறத்தினைப் போன்று செய்யப்பட்டதான போர்வையினையும், தேன் சொட்டும் இனிமையினைத் தன்னிடம் கொண்டு அமுதம் தன்னிடமிருந்து வெளிப்படுவதனைப் போன்று நல்லதோர் இசையினைத் தந்திக் கூடியதான முறுக்குத் தன்மை அற்றதான நரம்புகளால் நட்டப்பட்ட இசை தரக்கூடிய யாழினை இசை நூல் கூறுகின்ற முறையுடன் மீட்டி செம்பாலைப் பண்ணினைப் பாடி, ஐம்பெரும் குரவர்களுக்கும் வணங்கிய கையுடன் இருப்பவனே, பகைவர்கள் தன் மீது வேலினை வீசுவதற்கு ஆயுத்தமாகின்ற சூழலில் மனமகிழ்சச ; pயுடன் தம்முடைய மார்பினைக் கொடுப்பவனே, உழவர்களுக்கு என்றும் நன்மை புரிந்திடக் கூடிய நல்லாட்சியினை அளித்திடக் கூடிய செங்கோலினை உடையவனே, என்றென்றும் சிறப்புடைய தேர்களைப் பெற்றிருக்கக் கூடியவனான பகை மன்னர்களுக்கும் அச்ச உணர்வினை மிகுவிக்கக் கூடிய கூர்மையான வேலினை உடையவனே என்றும் நீங்கள் மன்னன் நல்லியங்கோடனை மகிழ்ந்து சில வார்த்தைகள் போற்றுவதற்கும் முன்பாகவே,", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.25, p.323", "", "hard", "false"], ["SANG-14-26", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “மன்னன் இரவலருக்கு விருந்தோம்பல் செய்யும் முறை” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “மன்னன் இரவலருக்கு விருந்தோம்பல் செய்யும் முறை” (section 14.26).", "……………………. மாசில் காம்பு ;சொலித்தன்ன அறுவை உடீஇ, பாம்பு வெகுண்டன்ன தேறல் நல்கி, காஎரியூட்டிய கவர் கணைத் தூணிப் பூ விரி கச்சைப் புகழோன் தன் முன் பனி வரை மார்பன் பயந்த நுண் பொருள் பனுவலின், வழாஅப் பல்வேறு அடிசில் வாள் நிற விசும்பின் கோள்மீன் சூழ்ந்த இளங்கதிர் ஞாயிறு எள்ளும் தோற்றத்து, விளங்கு பொற்கலத்தில் விரும்புவன பேணி ஆனா விருப்பின் தான் நின்று ஊட்டி அம்மன்னன் உங்களை எதிர்கொண்டு வரவேற்று மகிழ்ந்து மூங்கிலின் உள்ளே உள்ள பட்டையினை உரித்தது போன்ற தன்மையுடைய மென்மையான உடையினை உடுத்திக் கொள்ளும்படி செய்து, பாம்பின் நச்சுவால் மயக்கம் உண்டானதைப் போன்றதான மயங்கும் தன்மையினைச் செய்திடக் கூடிய கள்ளினை அனைவரும் விரும்பிக் குடிக்கும்படியாகக் கொடுத்து, அருச்சுணனின் மகனாகிய வீமன் எழுதியதான சமையல் கலை நுட்பம் தொடர்பான நூலினுள் கூறப்பட்டுள்ள முறைகளனி;படி எவ்விதமான சிறு தவறுகளும் ஏற்படாத வகையில் சமைக்கப்பட்ட உணவினை, கோள்கள் சுற்றி அழகு செய்ய இளமையான ஒளியினை உடையதான சூரியனின் ஒளியும் தோற்றுப் போகும் வகையிலான ஒளிவீசும் பொன்னால் செய்யப்பட்ட உணவு உண்ணும் பாத்திரங்களால் நீங்கள் விரும்பி உண்ணும் சுவை அறிந்து மகிழ்சச ; pயுடன் தானே முன்னின்று உங்கள் அருகில் வந்து உங்களை உண்ணும்படி செய்வான்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.26, p.324", "", "medium", "false"], ["SANG-14-27", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “நல்லியக்கோடன் பரிசு வழங்கல்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “நல்லியக்கோடன் பரிசு வழங்கல்” (section 14.27).", "திறல் சால் வென்றியொடு, தெவ்வுப் புலம் அகற்றி, விறல் வேல் மன்னர் மன் எயில் முருக்கி, நயவர் பாணர் புன்கண் தீர்த்த பின், வயவர் தந்த வான் கேழ் நிதியமொடு பருவ வானத்துப் பால் கதிர் பரப்பி உருவ வான் மதி ஊர் கொண்டாங்கு, கூர் உளி பொருத வடு ஆழ் நோன் குறட்டு ஆரம் சூழ்ந்த அயில்வாய் நேமியொடு, சிதர் நனை முரக்கின் சேண் ஓங்கு நெடுஞ்சிரைனத் ததர் பிணி அவிழ்ந்த தோற்றம் போல, உள் அரக்கு அறிந்த உருக்குறு போர்வை, கருந்தொழில் வினைஞர் கைவினை முற்றி, ஊர்ந்து பெயர் பெற்ற எழி நடைப் பாகரொடு மா செலவு ஒழிக்கும் மதனுடை நோன் தாள் வாள் முகப் பாண்டில் வலவனொடு தரீஇ அன்றே விடுக்குமவன் பரிசில் வலிமையும், வெற்றியும் ஆற்றலும் உடையதான பகை நாட்டு மன்னர்களை அவர்களுடைய நாட்டினை விட்டுப் போகும்படி செய்து வெற்றியினைக் கொண்டதான வேலினை கைகளில் ஏந்திய முடிமன்னர்களின் பாதுகாப்பிற்குரிய பெரிய அரண்களை அழித்துத் தன்னை நாடி வந்து போற்றும் இரவலர்களுக்குப் பரிசிலர்களுக்கும் வேண்டிய கொடையினை வழங்கிய பின்னர், படைத்தலைவர்கள் கொண்டு வந்து சேர்த்த பொருட் குவியல்களுடன் குளிர் காலத்தில் வானில் ஒளி தரக்கூடியதான நிலவு விரிந்து காட்சி தருவதனைப் போன்றதான சக்கரத்துடன் முருங்கை மரம் மலர்ந்தனைப் போன்று சாதி லிங்கம் கொண்டு நிறமூட்டப்பட்ட போர்வையினையும், தச்சுத் தொழிலில் திறம் படைத்தவர்களால் செய்யப்பட்டு, ஏறிச் செலுத்தி, ஆராய்ந்து அதன் வேகத்தினைப் புகழ்ந்திட்ட நல்ல தேரினையும், வெள்ளை நிறமுடையதான எருதுகளையும் பாகனுடன் சேர்த்து யானை குதிரை அணிகலன்கள் ஆகிய அனைத்தினையும் பிற பரிசுகளையும் வழங்கி அந்நாளிலேயே உங்கள் ஊர்களுக்குச் செல்லுங்கள் என அனுப்பி வைத்திடும் பண்பாளன்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.27, p.324", "", "medium", "false"], ["SANG-14-28", "Sangam literature", "சங்க இலக்கியம் – சிறுபாணாற்றுப்படை: “நல்லியக்கோடனை அடைந்தால் வளம் பெறுதல் உறுதி” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – சிறுபாணாற்றுப்படை: Explain the poem/passage titled “நல்லியக்கோடனை அடைந்தால் வளம் பெறுதல் உறுதி” (section 14.28).", "………………………………. மென் தோள், துகில் அணி அல்குல் துளங்கு இயல் மகளிர், அகில் உண விரித்த அம்மென் கூந்தலின்ஷ மணி மயில் கலாபம் மஞ்சு இடைப் பரப்பி, துண மழை தவழும் துயல் கழை நெடுங்கோட்டு, எறிந்து உரும் இறந்து ஏற்று அருஞ் சென்னிக் குறிஞசிக் கோமான், கொய் தளிர்க் கண்ணி செல் இசை நிலைஇய பண்பின் நல்லியக்கோடனை நயந்தனிர் செலினே. மென்மையான தோள்களும், ஆடை அணியப் பெற்றதான அல்குலும் மென்மைத் தன்மையுடையதான சாயலையும் உடைய பெண்கள், அகில் புகையினை இடுவதற்காக விரித்த கூந்தலைப் போன்றதான மயில் தோகையினை வெண்மேகங்களுக்கிடையில் விரித்துத் தெளிவான மேகம் தவழ்;ந்து கொண்டிருக்கவும், அசைகின்றதான மூங்கில் மரங்கள் நிறைந்ததும், இடி அதனைக் கடந்து செல்ல இயலாமல் இடிஇடித்துச் செல்லப்பட்டதும், எவரும் எளிதில் ஏறிவிட இயலாத உயரத்தினை உடைய மதில்கள் சூழ்ந்த நிலத்தின் தலைவனும் தளிர்களால் கட்டப்பட்ட மாலையினை அணிந்துள்ளவனும், புகழ் நிலைபெறுவதற்கான வள்ளல் குணம் நிறைந்தவனுமாகிய நல்லியக்கோடனை விரும்பி நீங்கள் செல்வீர்கள் என்றால்.. மேற்சொன்ன பரிசுகள் அனைத்தும் பெறுவீர்கள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 14, section 14.28, p.325", "", "medium", "false"], ["TOLK-001", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 1: “எழுத்து எனப் படுப அகரம் முதல் னகர இறுவாய் முப்பஃது என்ப சார்ந்து வரல் மரபின் மூன்றலங் கடையே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 1: “எழுத்து எனப் படுப அகரம் முதல் னகர இறுவாய் முப்பஃது என்ப சார்ந்து வரல் மரபின் மூன்றலங் கடையே.” — What does this sutra state?", "‘சார்ந்து வரல் மரபின் மூன்று’ என்றமையான், ‘அகரமுதல் னகரம் ஈறாய முப்பதும் தனித்து இயங்கும் இயல்புடையன’ என்பது குறிக்கப்பட்டது என்பர் இளம்பூரணர்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.8, நூ. 1", "", "easy", "false"], ["TOLK-003", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 3: “அ இ உ எ ஒ என்னும் அப்பால் ஐந்தும் ஓர்அளபு இசைக்கும் குற்றெழுத்து என்ப.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 3: “அ இ உ எ ஒ என்னும் அப்பால் ஐந்தும் ஓர்அளபு இசைக்கும் குற்றெழுத்து என்ப.” — What does this sutra state?", "இவை ஒவ்வொன்றும் ஒருமாத்திரை அளவினவாய் ஒலிக்கும். மாத்திரை என்பது எழுத்துக்கள் உச்சரிக்கப்படும் கால அளவு. அது கண்ணிமைக்கும்பொழுது, கைநொடிக்கும் அளவும் ஆகும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.8, நூ. 3", "", "easy", "false"], ["TOLK-006", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 6: “நீட்டம் வேண்டின் அவ்வளபு உடைய கூட்டி எழுதல் என்மனார் புலவர்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 6: “நீட்டம் வேண்டின் அவ்வளபு உடைய கூட்டி எழுதல் என்மனார் புலவர்.” — What does this sutra state?", "இது உயிர் அளபெழும் முறைமையினைக் கூறுகிறது. மூன்று மாத்திரை அளபு வேண்டின் நெடிலோடு ஒரு குறிலையும், நான்கு மாத்திரை வேண்டின் நெடிலோடு இரு குறில்களையும் சேர்த்துப் பிளவுபடாமல் ஒலியை எழுப்பிக் கொள்ளுதல் வேண்டும். எ.டு. : சிறாஅஅர் துடியர் பாடுவன் மகாஅஅர் - (புறம். 291:1) என்பதில் எழுத்துக்கள் தமக்குரிய மாத்திரையில் நீண்டு ஒலித்திருத்தலைக் காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.9, நூ. 6", "", "medium", "false"], ["TOLK-007", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 7: “கண்இமை நொடி என அவ்வே மாத்திரை நுண்ணிதின் உணர்ந்தோர் கண்ட ஆறே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 7: “கண்இமை நொடி என அவ்வே மாத்திரை நுண்ணிதின் உணர்ந்தோர் கண்ட ஆறே.” — What does this sutra state?", "மாத்திரையின் இலக்கணத்தை இந்நூற்பா எடுத்துரைக்கின்றது. கண்ணிமைக்கும் காலஅளவும்;, கைநொடிக்கும் கால அளவும்; ஒரு மாத்திரைக்கு உரிய அளவாகும். இது நுட்பமாய் ஒலிஇயலை உணர்ந்த தொல்லாசிரியர் கண்ட முறையாகும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.9, நூ. 7", "", "easy", "false"], ["TOLK-008", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 8: “ஔகார இறுவாய்ப் பன்ஈர் எழுத்தும் உயிர்என மொழிப.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 8: “ஔகார இறுவாய்ப் பன்ஈர் எழுத்தும் உயிர்என மொழிப.” — What does this sutra state?", "சார்ந்து வரல் மரபினை உடைய மூன்றும் அல்லாதவிடத்து அகரம் முதலாய் ஔகாரம் இறுதியாகிய பன்னிரண்டு எழுத்துக்களையும் உயிர் எழுத்துக்கள் என்பர் தொல்லாசிரியர்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.10, நூ. 8", "", "easy", "false"], ["TOLK-009", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 9: “னகார இறுவாய் பதினெண் எழுத்தும் மெய்என மொழிப.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 9: “னகார இறுவாய் பதினெண் எழுத்தும் மெய்என மொழிப.” — What does this sutra state?", "இஃது உயிர்ஒழிந்த பதினெண் எழுத்துக்கும் பெயரீடு செய்கின்றது. பன்னிரண்டு உயிர் எழுத்துக்களும் மெய்எழுத்துக்களோடு கலந்து நின்ற காலத்தும் உயிர் எழுத்துக்கள் தமக்குரிய உயர்நிலையில் இருந்து திரிவது இல்லை.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.10, நூ. 9", "", "easy", "false"], ["TOLK-012", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 12: “அவ்இயல் நிலையும் ஏனை மூன்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 12: “அவ்இயல் நிலையும் ஏனை மூன்றே.” — What does this sutra state?", "குற்றியலிகரம், குற்றியலுகரம், ஆய்தம் என்னும் மூன்றும் மெய்யெழுத்தினைப் போல அரைமாத்திரை அளபினைப் பெறும் என்பதாம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.10, நூ. 12", "", "easy", "false"], ["TOLK-013", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 13: “அரைஅளபு குறுகல் மகரம் உடைத்தே இசைஇடன் அருகும் தெரியும் காலை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 13: “அரைஅளபு குறுகல் மகரம் உடைத்தே இசைஇடன் அருகும் தெரியும் காலை.” — What does this sutra state?", "பிறிதோர் எழுத்தோடு கலந்து நிற்குமிடத்து மகரம் தன் அரை மாத்திரையினும் குறுகி ஒலிக்கும். ஆராயுங்காலத்து அவை சிறுபான்மையாய் வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.11, நூ. 13", "", "easy", "false"], ["TOLK-014", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 14: “உள்பெறு புள்ளி உருவாகும்மே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 14: “உள்பெறு புள்ளி உருவாகும்மே.” — What does this sutra state?", "என்னும் நூற்பா மகரக்குறுக்கத்திற்கு வடிவு கூறுகிறது. ‘புறத்துப் பெறும் புள்ளியொடு உள்ளாற் பெறும்புள்ளி மகரத்திற்கு வடிவாம்’ என்பார் இளம்பூரணர்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.11, நூ. 14", "", "easy", "false"], ["TOLK-015", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 15: “மெய்யின் இயற்கை புள்ளியொடு நிலையல்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 15: “மெய்யின் இயற்கை புள்ளியொடு நிலையல்.” — What does this sutra state?", "இந்நூற்பா தனிமெய்க்கும், உயிர்மெய்க்கும் இடையேயுள்ள வேறுபாட்டினைக் கூறுகிறது. தனிமெய்கள் புள்ளிபெற்று நிற்கும். எ.டு.: க், ங், ச், ஞ், ட், ண், த், ந், ப், ம், ய், ர், ல், வ், ழ், ள, ற், ன் என்றவாறு.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.11, நூ. 15", "", "easy", "false"], ["TOLK-016", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 16: “எகர ஒகரத்து இயற்கையும் அற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 16: “எகர ஒகரத்து இயற்கையும் அற்றே.” — What does this sutra state?", "என்னும் நூற்பா எகர, ஒகரங்களுக்கு ஏகார, ஓகாரங்களோடு வடிவு வேற்றுமை கூறுகிறது. எகர, ஒகரங்கள் மெய்எழுத்துக்களைப் போல புள்ளிபெறும் இயல்பினவாம். எ, எ- எ, ஏ; ஒ, ஒ - ஒ, ஓ என்றவாறு வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.11, நூ. 16", "", "easy", "false"], ["TOLK-017", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 17: “புள்ளி இல்லா எல்லா மெய்யும் உருவு உருவு ஆகி அகரமோடு உயிர்த்தலும் ஏனை உயிரோடு உருவு திரிந்து உயிர்த்தலும் ஆர்ஈர் இயல உயிர்த்தல் ஆறே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 17: “புள்ளி இல்லா எல்லா மெய்யும் உருவு உருவு ஆகி அகரமோடு உயிர்த்தலும் ஏனை உயிரோடு உருவு திரிந்து உயிர்த்தலும் ஆர்ஈர் இயல உயிர்த்தல் ஆறே.” — What does this sutra state?", "இது தனிமெய்யோடு உயிர்மெய்க்கு வேற்றுமை வடிவு செய்கின்றது. அதாவது, ஆகாரத்தோடு சேருங்கால் காலினையும், இகர, ஈகாரத்தோடு சேருங்கால் மேல்விலங்கினையும், உகர, ஊகாரத்தோடு சேருங்கால் கீழ்விலங்கினையும், எகர, ஏகாரத்தோடு சேருங்கால் கொம்பினையும், ஐகாரத்தோடு சேருங்கால் இரட்டைக்கொம்பினையும், ஒகர, ஓகாரத்தோடு சேருங்கால் முறையே பின்னும் பின்னும் கொம்பினையும், காலினையும், ஔகாரத்தோடு சேருங்கால் கொம்பினையும் ஔகாரத்தின் ஒருபகுதியினையும் பெறும் என்பதாம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.12, நூ. 17", "", "medium", "false"], ["TOLK-019", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 19: “வல்லெழுத்து என்ப க ச ட த ப ற.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 19: “வல்லெழுத்து என்ப க ச ட த ப ற.” — What does this sutra state?", "இந்நூற்பா தனிமெய்களுள் ஒரு பகுதிக்குக் காரணவகையான் வேறு ஒரு குறியீடு செய்கிறது. க ச ட த ப ற என்னும் ஆறு எழுத்துக்களும் வல்லெழுத்து (வல்லினம்) ஆகும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.13, நூ. 19", "", "easy", "false"], ["TOLK-020", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 20: “மெல்எழுத்து என்ப ங ஞ ண ந ம ன.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 20: “மெல்எழுத்து என்ப ங ஞ ண ந ம ன.” — What does this sutra state?", "ங ஞ ண ந ம ன என்னும் ஆறு எழுத்துக்களும் மெல்லெழுத்து (மெல்லினம்) ஆகும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.13, நூ. 20", "", "easy", "false"], ["TOLK-021", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 21: “இடையெழுத்து என்ப ய ர ல வ ழ ள.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 21: “இடையெழுத்து என்ப ய ர ல வ ழ ள.” — What does this sutra state?", "ய ர ல வ ழ ள என்னும் ஆறு எழுத்துக்களும் இடையெழுத்து (இடையினம்) ஆகும். இவற்றை முறையே வல்லெழுத்து, வல்லினம், வலி என்றும், மெல்லெழுத்து, மெல்லினம், மெலி என்றும், இடையெழுத்து, இடையினம், இடை என்றும் அழைப்பர் இலக்கண நூலோர்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.13, நூ. 21", "", "medium", "false"], ["TOLK-022", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 22: “அம் மூவாறும் வழங்கியல் மருங்கின் மெய் மயக்கு உடனிலை தெரியுங்காலை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 22: “அம் மூவாறும் வழங்கியல் மருங்கின் மெய் மயக்கு உடனிலை தெரியுங்காலை.” — What does this sutra state?", "இந்நூற்பா தனிமெய் ஒன்று பிறிதொரு மெய்யொடும் தன் மெய்யொடும் மயங்கி (கலந்து) நிற்கும் நிலையினைக் கூறுகிறது. மேற்குறித்த பதினெட்டு மெய்களும், மொழியாய் வழங்கும் நிலைமைக்கண், ஒரு மெய் பிறிதொன்றனோடு மயங்கும் நிலை என்றும், ஒரு மெய் தன் மெய்யுடன் மயங்கும் நிலை என்றும் இருவகைப்படுத்திக் கூறுவர்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.14, நூ. 22", "", "medium", "false"], ["TOLK-023", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 23: “ட ற ல ள என்னும் புள்ளி முன்னர்க் க ச ப என்னும் மூஎழுத்து உரிய.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 23: “ட ற ல ள என்னும் புள்ளி முன்னர்க் க ச ப என்னும் மூஎழுத்து உரிய.” — What does this sutra state?", "ட ற ல ள என்னும் புள்ளிகளின் முன்னர்க் க ச ப என்னும் மூன்று புள்ளிகளும் மயங்கி வரும்;. இவ்வாறு மயங்கும் நிலை வேற்றுநிலை மெய்ம்மயக்கம் எனப்படும். எ-டு.: கட்க, வெட்கம், கட்சிறார், கட்ப - டகரத்தின் முன் க ச ப மயங்கின. கற்க, கற்சிறார், கற்ப - றகரத்தின் முன் ச ச ப மயங்கின. செல்க, செல்சிறார், செல்ப - லகரத்தின் முன் ச ச ப மயங்கின. கொள்க, கொள்சிறார், கொள்ப - ளகரத்தின் முன் ச ச ப மயங்கின.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.14, நூ. 23", "", "medium", "false"], ["TOLK-024", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 24: “அவற்றுள் ல ளஅகான் முன்னர் ய வவும் தோன்றும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 24: “அவற்றுள் ல ளஅகான் முன்னர் ய வவும் தோன்றும்.” — What does this sutra state?", "மேற்குறித்த லகர, ளகரங்களின் முன்னர் கசபக்கள் மயங்குதலோடு யகர வகரங்களும் மயங்கி வருவது உண்டு. எ-டு.: கொல்யானை. கொள்வளை - லகரத்தின்முன்னர் யகர வகரங்கள் மயங்கின. வெள்யானை, வெல்வளை - ளகரத்தின்முன்னர் யகர வகரங்கள் மயங்கின.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.14, நூ. 24", "", "medium", "false"], ["TOLK-025", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 25: “ங ஞ ண ந ம ன எனும் புள்ளிமுன்னர்த் தத்தம் இசைகள் ஒத்தன நிலையே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 25: “ங ஞ ண ந ம ன எனும் புள்ளிமுன்னர்த் தத்தம் இசைகள் ஒத்தன நிலையே.” — What does this sutra state?", "ஙஞணநமன என்னும் ஆறு மெய்களின் முன்னர் நெடுங்கணக்கில் அவை ஒவ்வொன்றுக்கும் மேலுள்ள கசடதபறக்கள் ஆறும் முறையே மயங்குதற்கு உரியனவாகும். ஆறு மெல்லெழுத்துக்களுடனும் ஆறு வல்லெழுத்துக்கள் முறையே மயங்கலின் இந்நூற்பாவால்; ஆறு மயக்கநிலை கூறப்பட்டது. எ-டு.: தெங்கு, மஞ்சு, வண்டு, ஙஞணநமன முன்னர்முறையே பந்து, கம்பு, கன்று - கசடதபற முறையே மயங்கின.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.15, நூ. 25", "", "medium", "false"], ["TOLK-026", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 26: “அவற்றுள் ண ன அ‡கான் முன்னர்க் க ச ஞ ப ம ய வ அவ்ஏழும் உரிய.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 26: “அவற்றுள் ண ன அ‡கான் முன்னர்க் க ச ஞ ப ம ய வ அவ்ஏழும் உரிய.” — What does this sutra state?", "மேற்குறித்த மெல்லெழுத்துக்கள் ஆறனுள் ணகார னகாரங்களின் முன்னர்த் தன்தன் வல்லெழுத்துகளாய டகர, றகரங்கள் முறையே மயங்குதலொடு கசஞபமவய எனும் ஏழு எழுத்துக்களும் மயங்கும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.15, நூ. 26", "", "easy", "false"], ["TOLK-027", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 27: “ஞ ந ம வ என்னும் புள்ளி முன்னர் யஅகான் நிற்றல் மெய் பெற்றன்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 27: “ஞ ந ம வ என்னும் புள்ளி முன்னர் யஅகான் நிற்றல் மெய் பெற்றன்றே.” — What does this sutra state?", "ஞநம எனும் மூன்று மெய்களின் முன்னர்த் தன்தன் வல்லெழுத்துக்கள் மயங்குதலோடு யகரமும் மயங்கும். வகரத்தோடு யகரம் மயங்கி வரும்;. எ-டு.: உரிஞ்யாது, பொருந்யாது, - இதில் ஞ ந ம வக்களின் முன்னர் யகரம் திரும்யாது, தெவ்யாது மயங்கியமை காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.15, நூ. 27", "", "medium", "false"], ["TOLK-028", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 28: “மஅகான் புள்ளிமுன் வவ்வும் தோன்றும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 28: “மஅகான் புள்ளிமுன் வவ்வும் தோன்றும்.” — What does this sutra state?", "மகர மெய்யின் முன்னர் அதன் இனமாகிய பகரமும் யகரமும் மயங்குதலோடு வகரமும் மயங்கி வரும்;. எ-டு.: நிலம்வலிது. - என்பதில் மகர மெய்யின் முன்னர் வகரம் மயங்கியமைஅறிக.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.15, நூ. 28", "", "easy", "false"], ["TOLK-029", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 29: “யரழ என்னும் புள்ளி முன்னர் முதலாகு எழுத்து ங கரமொடு தோன்றும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 29: “யரழ என்னும் புள்ளி முன்னர் முதலாகு எழுத்து ங கரமொடு தோன்றும்.” — What does this sutra state?", "யரழ எனும் புள்ளிகள் ஒவ்வொன்றன் முன்னர், மொழிக்கு முதலாக வரும் க ச த ப ம ஞ ந ம வ ய எனும் ஒன்பது உயிர்மெய்களோடு மொழிக்கு முதலாகாத ஙகரமும் தனித்தனியே மயங்கும். எ-டு.: வேய்கடிது, வேய்சிறிது, வேய்தீது, வேய்பெரிது, வேய்ஞான்றது, வேய்நீண்டது, வேய்யாது, வேய்வலிது, வேய்ங்ஙனம் - என்பதில் யகரத்தின் முன்னர் மொழிமுதலாகும் ஒன்பது உயிர்மெய்களும் ஙகரமும் மயங்கின. வேர்கடிது, வேர்சிறிது, வேர்தீது, வேர்பெரிது, வேர்ஞான்றது, வேர்நீண்டது, வேர்யாது, வேர்வலிது, வேர்ங்ஙனம் - என்பதில் ரகரத்தின் முன்னர் மொழிமுதலாகும் ஒன்பது உயிர்மெய்களும் ஙகரமும் மயங்கின. வீழ்கடிது, வீழ்சிறிது, வீழ்தீது, வீழ்பெரிது, வீழ்ஞான்றது, வீழ்நீண்டது, வீழ்யாது, வீழ்வலிது, வீழ்ங்ஙனம் - என்பதில் ழகரத்தின் முன்னர் மொழிமுதலாகும் ஒன்பது உயிர்மெய்களும் ஙகரமும் மயங்கின.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.16, நூ. 29", "", "hard", "false"], ["TOLK-030", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 30: “மெய்ந்நிலை சுட்டின் எல்லா எழுத்தும் தம்முன் தாம் வரூஉம் ரழஅலங் கடையே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 30: “மெய்ந்நிலை சுட்டின் எல்லா எழுத்தும் தம்முன் தாம் வரூஉம் ரழஅலங் கடையே.” — What does this sutra state?", "இந்நூற்பா உடனிலை மயக்கம் பற்றிக் கூறுகிறது. எ-டு.: காக்கை, அங்ஙனம், பச்சை, மஞ்ஞை, பட்டை, பண்ணை, தந்தை, வெந்நோய், அப்பை, அம்மை, வெய்யர், எல்லி, எவ்வி, கொள்ளி, கொற்றி, கன்னி - இவற்றில் ர ழ ஒழிந்த மெய்கள் தம்முன்தாம் மயங்கியமை அறிக. (ர்ர, ழ்ழ என வருதல் தமிழில் இல்லை என்பதனை அறிக)", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.16, நூ. 30", "", "medium", "false"], ["TOLK-031", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 31: “அஇஉ அம்மூன்றும் சுட்டு” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 31: “அஇஉ அம்மூன்றும் சுட்டு” — What does this sutra state?", "இந்நூற்பா, குறிலெழுத்துக்கள் ஐந்தனுள் (அஇஉஎஒ) சுட்டுப்பொருளைத் தரும் எழுத்துக்கள் (அஇஉ) மூன்றனைக் கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.16, நூ. 31", "", "easy", "false"], ["TOLK-032", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 32: “ஆ ஏ ஓ அம் மூன்றும் வினா” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 32: “ஆ ஏ ஓ அம் மூன்றும் வினா” — What does this sutra state?", "இது நெடில் எழுத்துக்கள் ஏழனுள் வினாப்பொருளைத் தரும் எழுத்துக்கள் மூன்றனைக் கூறுகிறது. இம்மூன்றும் சொற்களின் இறுதியில்நின்று வினாப் பொருளைத் தரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.17, நூ. 32", "", "easy", "false"], ["TOLK-033", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 33: “அளபு இறந்து இசைத்தலும் ஒற்று இசை நீடலும் உள என மொழிப இசையொடு சிவணிய நரம்பின் மறைய என்மனார் புலவர்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 33: “அளபு இறந்து இசைத்தலும் ஒற்று இசை நீடலும் உள என மொழிப இசையொடு சிவணிய நரம்பின் மறைய என்மனார் புலவர்.” — What does this sutra state?", "இஃது இசைநூற்கண் உயிரும் மெய்யும் மாத்திரை நீண்டொலித்தலைக் கூறுகிறது. இசை, விளியின் கண். இவ்வியலில் எழுத்துக்களின் வகை, முதல் எழுத்துக்கள், சார்பெழுத்துக்கள், வரிவடிவம், மாத்திரை, உயிர் எழுத்துக்கள் வகை, மெய்எழுத்துக்கள் வகை, எழுத்துக்கள் மயக்கம், சுட்டு வினா எழுத்துக்கள் குறித்து அறிந்து கொள்ள முடிகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.17, நூ. 33", "", "medium", "false"], ["TOLK-034", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 34: “குற்றியலிகரம் நிற்றல் வேண்டும் யா என்சினை மிசை, உரையசைக் கிளவிக்கு ஆவயின் வரூஉம் மகரம் ஊர்ந்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 34: “குற்றியலிகரம் நிற்றல் வேண்டும் யா என்சினை மிசை, உரையசைக் கிளவிக்கு ஆவயின் வரூஉம் மகரம் ஊர்ந்தே.” — What does this sutra state?", "இது தனிமொழிக்கண் வரும் குற்றியலிகரத்தினை எடுத்துரைக்கிறது. உரையாடும்போது கேண்மியா, சென்மியா என்று கூறுவதில் மியா என்ற சொல்லில் மகரத்தைச் சேர்ந்து குற்றியலிகரம் நிற்கும் என்பதாம். இன்று இவ்வழக்கு இல்லை.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.19, நூ. 34", "", "medium", "false"], ["TOLK-035", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 35: “புணரியல் நிலையிடைக் குறுகலும் உரித்தே உணரக் கூறின் முன்னர்த் தோன்றும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 35: “புணரியல் நிலையிடைக் குறுகலும் உரித்தே உணரக் கூறின் முன்னர்த் தோன்றும்.” — What does this sutra state?", "இது புணர்மொழிக்கண் வரும் குற்றியலிகரத்தினைக் குறிப்பிடுகின்றது. அதன் இடமும் பற்றுக்கோடும் பின்னர்க் குற்றியலுகரப் புணரியலில்; எடுத்துரைக்கப்படும். எ-டு.: நாகியாது, வரகியாது, கொக்கியாது, குரங்கியாது, தௌ;கியாது, எஃகியாது எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.20, நூ. 35", "", "medium", "false"], ["TOLK-036", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 36: “நெட்டெழுத்து இம்பரும் தொடர்மொழி ஈற்றும் குற்றியலுகரம் வல்ஆறு ஊர்ந்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 36: “நெட்டெழுத்து இம்பரும் தொடர்மொழி ஈற்றும் குற்றியலுகரம் வல்ஆறு ஊர்ந்தே.” — What does this sutra state?", "இது தனிமொழிக் குற்றியலுகரத்தினைச் சுட்டுகின்றது. எ-டு.: நாகு, வரகு, கொக்கு, குரங்கு, தௌ;கு, எஃகு", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.20, நூ. 36", "", "easy", "false"], ["TOLK-037", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 37: “இடைப்படின் குறுகும் இடனுமார் உண்டே கடப்பாடு அறிந்த புணரியலான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 37: “இடைப்படின் குறுகும் இடனுமார் உண்டே கடப்பாடு அறிந்த புணரியலான.” — What does this sutra state?", "இது புணர்மொழிக்கண் வரும் குற்றியலுகரத்தினைக் குறிப்பிடுகின்றது. எ.டு.: செக்குக்கணை, சுக்குக்கோடு- குற்றியலுகரம் குறுகி நின்றது. நாகு கடிது, நாகு கடுமை - இதில் குற்றியலுகரம் அரைமாத்திரையாய் நின்றது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.20, நூ. 37", "", "easy", "false"], ["TOLK-038", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 38: “குறியதன் முன்னர் ஆய்தப் புள்ளி உயிரொடு புணர்ந்த வல்லாறன் மிசைத்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 38: “குறியதன் முன்னர் ஆய்தப் புள்ளி உயிரொடு புணர்ந்த வல்லாறன் மிசைத்தே.” — What does this sutra state?", "இந்நூற்பா தனிமொழி ஆய்தத்தினை எடுத்துரைக்கின்றது. எ-டு.: எஃகு, கஃசு - குற்றியலுகரம் (பெரும்பான்மை) பஃறி - பிற உயிருடன் (சிறுபான்மை)", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.21, நூ. 38", "", "easy", "false"], ["TOLK-039", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 39: “ஈறுஇயல் மருங்கினும் இசைமை தோன்றும்” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 39: “ஈறுஇயல் மருங்கினும் இசைமை தோன்றும்” — What does this sutra state?", "இது புணர்மொழிக்கண் ஆய்தத்தினைக் கூறுகிறது. எ-டு.: கஃறீது, முஃடீது, அஃகடிய என்பன போன்று வரும். இவற்றுள் ஆய்தக்குறுக்கம் காட்டப்பட்டது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.21, நூ. 39", "", "easy", "false"], ["TOLK-040", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 40: “உருவினும் இசையினும் அருகித் தோன்றும் மொழிக்குறிப்பு எல்லாம் எழுத்தின் இயலா ஆய்தம் அ‡காக் காலையான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 40: “உருவினும் இசையினும் அருகித் தோன்றும் மொழிக்குறிப்பு எல்லாம் எழுத்தின் இயலா ஆய்தம் அ‡காக் காலையான.” — What does this sutra state?", "இந்நூற்பா ஆய்தத்தின் சிறப்பினை எடுத்துரைக்கின்றது. அதாவது, நிறத்தின் மிகுதியையும், ஓசையின் மிகுதியையும் குறிக்கின்ற பொழுது, அவ்வழிவரும் ஆய்தம் தன் அரை மாத்திரையினின்றும் மிக்கு ஒலிக்கும். அங்ஙனம் மிக்கு ஒலிக்குங்கால் மாத்திரை மிகுதி தோன்றுவதற்காக ஆய்தம் இரட்டித்து (ஃஃ என இரட்டித்து) எழுதப்படுவது தேவையில்லை என்பது இந்நூற்பாவின் கருத்தாகும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.21, நூ. 40", "", "medium", "false"], ["TOLK-041", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 41: “குன்றுஇசை மொழிவயின் நின்றுஇசை நிறைக்கும் நெட்டெழுத்து இம்பர் ஒத்த குற்றெழுத்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 41: “குன்றுஇசை மொழிவயின் நின்றுஇசை நிறைக்கும் நெட்டெழுத்து இம்பர் ஒத்த குற்றெழுத்தே.” — What does this sutra state?", "அதாவது, குறுகிய ஓசையை உடைய சொற்களில் ஓசையை நிரப்ப, நெட்டெழுத்தின் பின்னே அதன் இனமான (ஆஅ) குறில்எழுத்து நின்று ஓசையை நிறைவு செய்யும் என்பதாம். ஐ, ஔ என்பனவற்றிற்கு இனவெழுத்துக்கள் இன்மையால் அவற்றின் இடத்தை இ, உ ஆகிய எழுத்துக்கள் இட்டு நிரப்பும். எ-டு.: ஆஅ, ஈஇ, ஊஉ, ஏஎ ஐஇ, ஓஒ, ஔஉ எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.22, நூ. 41", "", "medium", "false"], ["TOLK-042", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 42: “ஐ, ஔ என்னும் ஆயீர் எழுத்திற்கு இகர உகரம் இசைநிறைவு ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 42: “ஐ, ஔ என்னும் ஆயீர் எழுத்திற்கு இகர உகரம் இசைநிறைவு ஆகும்.” — What does this sutra state?", "இந்நூற்பா ஒத்த குற்றெழுத்தில்லாத ஒகார ஔகாரங்கள் அளபெடுக்குமாறு கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.22, நூ. 42", "", "easy", "false"], ["TOLK-043", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 43: “நெட்டெழுத்து ஏழே ஓர்எழுத்து ஒருமொழி.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 43: “நெட்டெழுத்து ஏழே ஓர்எழுத்து ஒருமொழி.” — What does this sutra state?", "இஃது ஓரெழுத்து ஒருமொழியினைக் கூறுகிறது. நெட்டெழுத்துக்கள் ஏழும் ஓரெழுத்து ஒருமொழிகளாக வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.23, நூ. 43", "", "easy", "false"], ["TOLK-044", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 44: “குற்றெழுத்து ஐந்தும் மொழிநிறைபு இலவே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 44: “குற்றெழுத்து ஐந்தும் மொழிநிறைபு இலவே.” — What does this sutra state?", "ஐந்து குற்றெழுத்துக்களும் மொழியாய் நின்று பொருள்தருவதாய் அமைவது இல்லை. குறில் எழுத்துக்கள் ஐந்தும் தனியாக நின்று பொருள்தருவது இல்லை.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.23, நூ. 44", "", "easy", "false"], ["TOLK-045", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 45: “ஓர்எழுத்து ஒருமொழி ஈர்எழுத்து ஒருமொழி இரண்டு இறந்து இசைக்கும் தொடர்மொழி உளப்பட மூன்றே மொழிநிலை தோன்றிய நெறியே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 45: “ஓர்எழுத்து ஒருமொழி ஈர்எழுத்து ஒருமொழி இரண்டு இறந்து இசைக்கும் தொடர்மொழி உளப்பட மூன்றே மொழிநிலை தோன்றிய நெறியே.” — What does this sutra state?", "இந்நூற்பா தமிழ்ச்சொற்களின் நிலையினையும், அவை தோன்றிய நெறியினையும் விளக்குகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.23, நூ. 45", "", "easy", "false"], ["TOLK-046", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 46: “மெய்யின் இயக்கம் அகரமொடு சிவணும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 46: “மெய்யின் இயக்கம் அகரமொடு சிவணும்.” — What does this sutra state?", "இந்நூற்பாத் தனிமெய் இயங்கும் நிலையினை உணர்த்துகிறது. எ.டு.: க, ங, ச, ஞ ... என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.24, நூ. 46", "", "easy", "false"], ["TOLK-047", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 47: “தம்இயல் கிளப்பின் எல்லா எழுத்தும் மெய்ந்நிலை மயக்கம் மானம் இல்லை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 47: “தம்இயல் கிளப்பின் எல்லா எழுத்தும் மெய்ந்நிலை மயக்கம் மானம் இல்லை.” — What does this sutra state?", "இது மெய்மயக்கத்திற்குப் புறனடையாக அமைந்த நூற்பாவாகும். மேலே மெய்ம்மயக்கத்தில் இன்னின்ன எழுத்துக்கள் இன்னின்ன எழுத்துக்களோடு மட்டும் கூடிவரும் என்று கூறப்படினும், அவை தத்தம் பெயர் கூறுமிடத்து அம்மயக்க நெறியினின்றும் மாறியும் வரும் என்பது இந்நூற்பா எடுத்துரைக்கும் கருத்தாகும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.24, நூ. 47", "", "medium", "false"], ["TOLK-048", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 48: “ய ர ழ என்னும் மூன்றும் முன் ஒற்ற க ச த ப வ ஞ ந ம ஈர்ஒற்று ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 48: “ய ர ழ என்னும் மூன்றும் முன் ஒற்ற க ச த ப வ ஞ ந ம ஈர்ஒற்று ஆகும்.” — What does this sutra state?", "இந்நூற்பா ஈரொற்று உடனிற்றலை உணர்த்துகின்றது. எ-டு.: வேய்க்குறை, - என்பதில் ககர ஙகரங்கள் யகரத்தோடு மயங்கி வேய்ங்குறை ஈறொற்றாய் நின்றன. வேர்க்குறை, - என்பதில் ககர ஙகரங்கள் ரகரத்தோடு மயங்கி வேர்ங்குறை ஈறொற்றாய் நின்றன. வீழ்க்குறை, - என்பதில் ககர ஙகரங்கள் ழகரத்தோடு மயங்கி வீழ்ங்குறை ஈறொற்றாய் நின்றன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.24, நூ. 48", "", "medium", "false"], ["TOLK-049", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 49: “அவற்றுள் ரகார ழகாரம் குற்றொற்று ஆகா.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 49: “அவற்றுள் ரகார ழகாரம் குற்றொற்று ஆகா.” — What does this sutra state?", "யரழ என்னும் மூன்று ஒற்றுகளுள் ரகரமும், ழகரமும் குறிலின்கீழ் ஒற்றாய் வாராது. அதாவது, குறில் எழுத்துக்களின் பின் ர, ழ என்ற மெய்கள் வருதலில்லை. இந்நூற்பா ரகர, ழகரங்களுக்கு எய்திய விதியினை ஒரு மருங்கு மறுத்துரைக்கிறது. தர்மம், கர்மம் போன்றவை -தருமம், கருமம் என வரும். இது தமிழ்வழக்கு.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.24, நூ. 49", "", "medium", "false"], ["TOLK-050", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 50: “குறுமையும் நெடுமையும் அளவின் கோடலின் தொடர்மொழி எல்லாம் நெட்டெழுத்து இயல.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 50: “குறுமையும் நெடுமையும் அளவின் கோடலின் தொடர்மொழி எல்லாம் நெட்டெழுத்து இயல.” — What does this sutra state?", "குறிலாய்த் தொடரும் மொழியிறுதிக்கண் நின்ற ரகர, ழகரம் பற்றியும் பிற ஒற்று பற்றியும் எழுவதோர் ஐயத்தினை இந்நூற்பா அகற்றுகின்றது. தொகுப்பு - தோப்பு, பகுதி-பாதி என்பன போல்வன. எ-டு.: அகர், புகர் - தொடர்மொழிக்கீழ் ரகர ஒற்று வந்தது. அகழ், புகழ் - தொடர்மொழிக்கீழ் ழகர ஒற்று வந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.25, நூ. 50", "", "medium", "false"], ["TOLK-051", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 51: “செய்யுளில் இறுதிப் போலும் மொழிவயின் னகார, மகாரம் ஈர்ஒற்று ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 51: “செய்யுளில் இறுதிப் போலும் மொழிவயின் னகார, மகாரம் ஈர்ஒற்று ஆகும்.” — What does this sutra state?", "இந்நூற்பா செய்யுட்கண் ஈரொற்றுடனிலையாய் நிற்றலை உணர்த்துகின்றது. செய்யுளின் இறுதியில் போலும் என்ற சொல் போன்ம் என வரும். இதனை மொழி இறுதிப்போலி என்றுரைப்பர்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.25, நூ. 51", "", "easy", "false"], ["TOLK-052", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 52: “னகாரை முன்னர் மகாரம் குறுகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 52: “னகாரை முன்னர் மகாரம் குறுகும்.” — What does this sutra state?", "இந்நூற்பா, அரையளபு குறுகல் மகரம் உடைத்தே என்பதற்குப் புறனடையாக அமைந்தது ஆகும். செய்யுளின் இறுதியில் வரும் போலும் என்ற சொல்லின்கண், னகரத்தின் பின்னர் வரும் மகரம், தன் அரைமாத்திரையினின்று குறைந்து ஒலிக்கும். எ-டு.: போன்ம் என்பதிலுள்ள (ம்) மகரம் குறுகி ஒலிக்கும்;.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.25, நூ. 52", "", "medium", "false"], ["TOLK-053", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 53: “மொழிப்படுத்து இசைப்பினும் தெரிந்துவேறு இசைப்பினும் எழுத்துஇயல் திரியா என்மனார் புலவர்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 53: “மொழிப்படுத்து இசைப்பினும் தெரிந்துவேறு இசைப்பினும் எழுத்துஇயல் திரியா என்மனார் புலவர்.” — What does this sutra state?", "இந்நூற்பா, மொழியிடை எழுத்திற்கும் தனிநின்ற எழுத்திற்கும் இடையே வேறுபாடுண்டோ? எனும் ஐயத்தினை விலக்குகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.26, நூ. 53", "", "easy", "false"], ["TOLK-054", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 54: “அகர இகரம் ஐகாரம் ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 54: “அகர இகரம் ஐகாரம் ஆகும்.” — What does this sutra state?", "இது போலி எழுத்தாமாறு கூறுகிறது. எ-டு.: ஐயர்- அஇயர்; வைரம்-வயிரம் என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.26, நூ. 54", "", "easy", "false"], ["TOLK-055", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 55: “அகர உகரம் ஔகாரம் ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 55: “அகர உகரம் ஔகாரம் ஆகும்.” — What does this sutra state?", "அகரமும் உகரமும் கூட்டிச்சொல்ல ஔகாரம் போல் ஆகும். எ-டு.: ஒளவை-அஉவை, கௌந்தியடிகள் -கவுந்தியடிகள் என்று வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.26, நூ. 55", "", "easy", "false"], ["TOLK-056", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 56: “அகரத்து இம்பர் யகரப் புள்ளியும் ஐஎன்நெடுஞ் சினைமெய் பெறத் தோன்றும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 56: “அகரத்து இம்பர் யகரப் புள்ளியும் ஐஎன்நெடுஞ் சினைமெய் பெறத் தோன்றும்.” — What does this sutra state?", "அகரத்தின் பின்னர், இகரமேயன்றி யகரமாகிய புள்ளியும், ஒ எனப்பட்ட நெட்டெழுத்தாம். அதாவது, ஒ என்பதற்குப் பதில் அய் என்றும் வரலாம். எ.டு.: ஐயர்-அய்யர், ஐவனம்-அய்வனம்; ஒளவை-அவ்வை எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.26, நூ. 56", "", "easy", "false"], ["TOLK-057", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 57: “ஓர்அளபு ஆகும் இடனுமார் உண்டே தேரும்காலை மொழிவயினான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 57: “ஓர்அளபு ஆகும் இடனுமார் உண்டே தேரும்காலை மொழிவயினான.” — What does this sutra state?", "இது மேல் தொடர்புற்று நின்ற ஐகாரத்திற்கு மாத்திரை வகையான் சிறப்புவிதி கூறுகிறது. ஐகாரம், ஆராயுமிடத்து மொழிக்கண் ஓரளபாய் நிற்கும் இடமும் உண்டு. அதாவது, ஒ, ஒள சொற்களில் வரும்போது ஒரு மாத்திரையாகவும் ஒலிக்கும் இடமும் உண்டு என்பதாம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.27, நூ. 57", "", "medium", "false"], ["TOLK-058", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 58: “இகர யகரம் இறுதி விரவும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 58: “இகர யகரம் இறுதி விரவும்.” — What does this sutra state?", "இஃது ஐகாரப்போலி பற்றிய ஐயத்தினை அகற்றுகிறது இகரவீற்று மொழிக்கண் யகரமும் இகரமும் விரவிவரும். அதாவது, இகரத்துடன் யகரம் இறுதியில் ஒன்றாக வரும் என்பதாம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.27, நூ. 58", "", "easy", "false"], ["TOLK-059", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 59: “மொழிமுதல் உயிர்கள் பன்னீர் உயிரும் மொழிமுதல் ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 59: “மொழிமுதல் உயிர்கள் பன்னீர் உயிரும் மொழிமுதல் ஆகும்.” — What does this sutra state?", "இஃது உயிரெழுத்து மொழிக்கண் முதலாமாறு உணர்த்துகின்றது. எ-டு.: அடை, ஆடை, இடை, ஈயம், உரல், ஊர்தி, எழு, ஏணி, ஐவனம், ஒளி,", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.27, நூ. 59", "", "easy", "false"], ["TOLK-060", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 60: “உயிர்மெய் அல்லன மொழிமுதல் ஆகா.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 60: “உயிர்மெய் அல்லன மொழிமுதல் ஆகா.” — What does this sutra state?", "இது தனிமெய், உயிர்மெய் எனும் இருவகை மெய்களுள் மொழி முதலாகும் மெய் இஃதெனக் கூறுகிறது. உயிருடன் கூடிய மெய்களே மொழிக்கண் முதலாக வரும்;. தனிமெய்கள் மொழிக்கு முதலில் வருதல் இல்லை.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.28, நூ. 60", "", "easy", "false"], ["TOLK-061", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 61: “க த ந ப ம எனும் ஆவைந்து எழுத்தும் எல்லா உயிரொடும் செல்லுமார் முதலே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 61: “க த ந ப ம எனும் ஆவைந்து எழுத்தும் எல்லா உயிரொடும் செல்லுமார் முதலே.” — What does this sutra state?", "இது மொழி முதலாகும் உயிர்மெய்கட்கு வரையறை கூறுகிறது. எ-டு.: கலை, காலை, கிளி, கீரி, குடு, கூடு, கெண்டை, கேழல், கைதை, கொண்டல், கோடை, கௌவை-எனபதில் ககரம் பன்னீருயிரொடும் மொழிக்கு முதலில் வந்தன. தந்தை, தாய், தித்தி, தீமை, துணி, தூணி, தெற்றி, தேன், தையல், தொண்டை, தோடு, தௌவை-என்பதில் தகரம் பன்னீருயிரொடும் மொழிக்கு முதலில் வந்தன. நந்து, நாரை, நிலம், நீர், நுதல்;, நூல், நெய், நேயம், நைவளம், நொச்சி, நோக்கு, நௌவி-என்பதில் நகரம் பன்னீருயிரொடும் மொழிக்கு முதலில் வந்தன. படை, பால், பிடி, பீடு, புகழ், பூமி, பெடை, பேடை, பைதல், பொன், போது, பௌவம் - என்பதில் பகரம் பன்னீருயிரொடும் மொழிக்கு முதலில் வந்தன. மலை, மாலை, மிடறு, மீளி, முதலை, மூலை, மெல்லிலை, மேனி, மையல், மொழி, மோத்தை, மௌவல்-என்பதில் மகரம் பன்னீருயிரொடும் மொழிக்கு முதலில் வந்தமை காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.28, நூ. 61", "", "hard", "false"], ["TOLK-062", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 62: “சகரக் கிளவியும் அவற்று ஓரற்றே அ ஒ ஔ எனும் மூன்றலங் கடையே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 62: “சகரக் கிளவியும் அவற்று ஓரற்றே அ ஒ ஔ எனும் மூன்றலங் கடையே.” — What does this sutra state?", "இது சகரம் மொழி முதற்கண் ஆமாறு கூறுகிறது. எ-டு.: சாந்து, சினம், சீற்றம், சுரும்பு, சூரர்;, செக்கு, சேவல், சொல், சோறு என்பன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.28, நூ. 62", "", "easy", "false"], ["TOLK-063", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 63: “உ ஊ ஒ ஓ என்னும் நான்கு உயிர் வ என் எழுத்தொடு வருதல் இல்லை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 63: “உ ஊ ஒ ஓ என்னும் நான்கு உயிர் வ என் எழுத்தொடு வருதல் இல்லை.” — What does this sutra state?", "எ-டு.: வளை, வாரி, விளரி, வீடு, வெள்ளி, வேர், வையம், வெளவு என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.29, நூ. 63", "", "easy", "false"], ["TOLK-066", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 66: “முதலா ஏன தம்பெயர் முதலும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 66: “முதலா ஏன தம்பெயர் முதலும்.” — What does this sutra state?", "இது எல்லா எழுத்தும் முதலாகும் இடம் கூறுகிறது. மொழிக்கு முதலாகாத ஒன்பது மெய்களும் தம் பெயர் கூறுங்கால் முதலாவதாக வருதலும் உண்டு. அதாவது, தம்பெயர் கூறும் நிலையில் எல்லா மெய்களும் மொழிக்கு முதலில் வரும் என்பர்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.29, நூ. 66", "", "medium", "false"], ["TOLK-068", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 68: “முற்றிய லுகரமொடு பொருள் வேறுபடாஅது அப்பெயர் மருங்கின் நிலையியலான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 68: “முற்றிய லுகரமொடு பொருள் வேறுபடாஅது அப்பெயர் மருங்கின் நிலையியலான.” — What does this sutra state?", "இது மேலதற்கோர் புறனடை உணர்த்துகின்றது. நுந்தை என்னும் முறைப்பெயரிடத்து நிற்றலாகிய இயல்பின்கண் மொழிமுதற் குற்றியலுகரம், முற்றியலுகரமாய் ஒலிக்குங்கால் வேறுபடும் குற்றியலுகரத்தைப் போலவேப் பொருளால் வேறுபடாது நிற்கும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.30, நூ. 68", "", "medium", "false"], ["TOLK-070", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 70: “கவவொடு இயையின் ஔவும் ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 70: “கவவொடு இயையின் ஔவும் ஆகும்.” — What does this sutra state?", "இது, மேல்விலக்கிய ஒளகாரம் இவ்விடத்து ஆம் எனக் கூறுகிறது. எ-டு.: கௌ, வெள எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.30, நூ. 70", "", "easy", "false"], ["TOLK-071", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 71: “எஎன வரும் உயிர் மெய் ஈறாகாது.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 71: “எஎன வரும் உயிர் மெய் ஈறாகாது.” — What does this sutra state?", "இஃது எகரம் அளபெடைக்கண் ஈறாதலன்றி மெய்யொடு ஈறாகாதெனக் கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.31, நூ. 71", "", "easy", "false"], ["TOLK-072", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 72: “ஒவ்வும் அற்றே ந அலங்கடையே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 72: “ஒவ்வும் அற்றே ந அலங்கடையே.” — What does this sutra state?", "இது ஒகரம் ஈறாதற்கு வரையறை கூறுகிறது. மேற்குறித்தனவற்றுக்குச் சான்றுகள் இல்லை. வழக்கொழிந்துபோயின.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.31, நூ. 72", "", "easy", "false"], ["TOLK-073", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 73: “ஏ ஓ எனும் உயிர் ஞகாரத்து இல்லை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 73: “ஏ ஓ எனும் உயிர் ஞகாரத்து இல்லை.” — What does this sutra state?", "இது ஞகாரத்தோடு ஈறாகும் உயிர்க்கு வரையறை கூறுகினற்து. ஏகார, ஓகார உயிர்கள் தாமே ஈறாவதன்றி ஞகர மெய்யோடு ஈறாவதில்லை. சான்றுகள் வழக்கொழிந்தன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.31, நூ. 73", "", "easy", "false"], ["TOLK-074", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 74: “உ, எ காரம் ந வவொடு நவிலா.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 74: “உ, எ காரம் ந வவொடு நவிலா.” — What does this sutra state?", "இது நகர வகரத்தோடு ஈறாகும் உயிர்க்கும் வரையறை கூறுகிறது. உகர, எகாரங்கள் இரண்டும் முறையே நகர வகரங்களோடு வாரா.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.31, நூ. 74", "", "easy", "false"], ["TOLK-075", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 75: “உச்சகாரம் இருமொழிக்குறித்தே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 75: “உச்சகாரம் இருமொழிக்குறித்தே.” — What does this sutra state?", "இது சகரத்தோடு ஈறாகும் உயிர்க்கு வரையறை கூறுகிறது. சகர மெய்யுடன் கூடிய உகர உயிர் இரண்டு சொற்களில் இறுதியில் வரும். எ-டு.: உசு, முசு (உசு-உளுவின் பெயர். முசு-குரங்கினத்துள் ஒரு வகை.)", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.31, நூ. 75", "", "easy", "false"], ["TOLK-076", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 76: “உப்பகாரம் ஒன்று என மொழிப இருவயின் நிலையும் பொருட்டு ஆகும்மே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 76: “உப்பகாரம் ஒன்று என மொழிப இருவயின் நிலையும் பொருட்டு ஆகும்மே.” — What does this sutra state?", "இது பகரத்தோடு ஈறாகும் உயிர்க்கு வரையறையும், பொருள்பாடும் உணர்த்துகின்றது. உகரத்தோடு கூடிய பகரம் ஒருமொழிக்கண் ஈறாகும். அது தன்வினை, பிறவினை என்னும் ஈஆறிடத்து நிலைபெறும் பொருளினை உடையதாக வரும். எ-டு. தபு - இது தன்வினை, பிறவினை என்னும் இரண்டிடத்தும் வரும். தபு-இது படுத்துச்சொல்ல நீ சா என்பது பொருளாம். எடுத்துச்சொல்லப் பிறிதொன்றனைச் சாவச்செய் என்பது பொருளாம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.31, நூ. 76", "", "medium", "false"], ["TOLK-077", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 77: “எஞ்சிய எல்லாம் எஞ்சுதல் இலவே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 77: “எஞ்சிய எல்லாம் எஞ்சுதல் இலவே.” — What does this sutra state?", "இது ஈறாகா உயிர்மெய்களும், தம் பெயர் கூறும்வழி ஈறாகும் என்று கூறுகிறது. எஞ்சிய உயிர்மெய்யாவன : ஔகாரம், ககார வகாரங்களை ஒழிந்த மெய்யோடு இயைந்த உயிர்மெய்யும், எகரம் எல்லா மெய்யோடும் இயைந்த உயிர்மெய்யும், ஒகரம் நகரம் ஒழிந்த மெய்யோடு இயைந்த உயிர்மெய்யும், ஏகார, ஓகாரம் ஞகாரத்தோடு இயைந்த உயிர்மெய்யும், உகரம், எகாரம் நகர வகரங்களோடு இயைந்த உயிர்மெய்யும் என இவையாகும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.32, நூ. 77", "", "medium", "false"], ["TOLK-078", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 78: “ஞ ண ந ம ன ய ர ல வ ழ ள என்னும் அப் பதினொன்றே புள்ளி இறுதி.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 78: “ஞ ண ந ம ன ய ர ல வ ழ ள என்னும் அப் பதினொன்றே புள்ளி இறுதி.” — What does this sutra state?", "இது தனிமெய்களில் மொழிக்கு ஈறாகுவன கூறுகிறது. எ-டு.: உரிஞ், மண், பொருந், திரும், பொன், வேய், வேர், வேல், தெவ், வீழ், வேள் என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.32, நூ. 78", "", "easy", "false"], ["TOLK-079", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 79: “உச்சகாரமொடு நகாரம் சிவணும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 79: “உச்சகாரமொடு நகாரம் சிவணும்.” — What does this sutra state?", "இஃது ஈறாம் நகாரத்திற்கு ஓர் வரையறை கூறுகிறது. உகரத்தோடு கூடிய சகரத்தைப்போல, நகார ஒற்றும் இருமொழிகளின்கண் ஈறாகும். எ-டு.: பொருந், வெரிந்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.32, நூ. 79", "", "easy", "false"], ["TOLK-080", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 80: “உப் பகாரமொடு ஞகாரையும் அற்றே அப்பொருள் இரட்டாது இவணையான.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 80: “உப் பகாரமொடு ஞகாரையும் அற்றே அப்பொருள் இரட்டாது இவணையான.” — What does this sutra state?", "இது ஞகாரத்திற்கு வரையறை கூறுகிறது. உகரத்தோடு கூடிய பகரம் போல ஞகரமும் ஒருமொழிக்கண் ஈறாகும். அஅது அப்பகரம் போல இவ்விடத்து இருபொருள் படாது என்பதாம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.32, நூ. 80", "", "easy", "false"], ["TOLK-081", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 81: “வகரக் கிளவி நான்மொழி உற்றது.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 81: “வகரக் கிளவி நான்மொழி உற்றது.” — What does this sutra state?", "இது வகரத்திற்கு வரையறை கூறுகிறது. வகரம் நான்குமொழிகளின் கண் ஈறாகும். எ-டு.: அவ், இவ், உவ், தெவ் என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.33, நூ. 81", "", "easy", "false"], ["TOLK-082", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 82: “மகரத் தொடர்மொழி மயங்குதல் வரைந்த னகரத் தொடர்மொழி ஒன்பஃது என்ப புகர்அறக் கிளந்த அஃறிணை மேன.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 82: “மகரத் தொடர்மொழி மயங்குதல் வரைந்த னகரத் தொடர்மொழி ஒன்பஃது என்ப புகர்அறக் கிளந்த அஃறிணை மேன.” — What does this sutra state?", "இஃது ஈற்றெழுத்து மயக்கம் கூறுகிறது. அதாவது, அஃறிணைப் பெயர்களுள் னகர ஈற்றுச் சொற்களாக வருவனவற்றுள் ஒன்பது சொற்கள் தவிர, ஏனையவெல்லாம் மகரத்தோடு மயங்கும் என்பது இந்நூற்பாவின் கருத்தாகும். எ-டு.: நிலன், நிலம், பிலன், பிலம் என்றாற்போன்று மயங்குவன. எகின், செகின், விழன், பயின், அழன், புழன், குயின், கடான், வயான் என மயங்காது வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.33, நூ. 82", "", "medium", "false"], ["TOLK-084", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 84: “அவ்வழி பன்னீர் உயிரும் தம்நிலை திரியா மிடற்றுப் பிறந்த வளியின் இசைக்கும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 84: “அவ்வழி பன்னீர் உயிரும் தம்நிலை திரியா மிடற்றுப் பிறந்த வளியின் இசைக்கும்.” — What does this sutra state?", "இந்நூற்பா, உயிரெழுத்துக்களுக்குப் பொதுப்பிறப்புக் கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.38, நூ. 84", "", "easy", "false"], ["TOLK-085", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 85: “அவற்றுள் ஆ ஆ ஆயிரண்டு அங்காந்து இயலும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 85: “அவற்றுள் ஆ ஆ ஆயிரண்டு அங்காந்து இயலும்.” — What does this sutra state?", "இது உயிரெழுத்துக்களில் சிலவற்றிற்குச் சிறப்புப் பிறப்புக் கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.38, நூ. 85", "", "easy", "false"], ["TOLK-086", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 86: “இ ஈ எ ஏ ஐ என இசைக்கும் அப்பால் ஐந்தும் அவற்று ஓரன்ன அவைதாம் அண்பல் முதல் நா விளிம்பு உறல் உடைய.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 86: “இ ஈ எ ஏ ஐ என இசைக்கும் அப்பால் ஐந்தும் அவற்று ஓரன்ன அவைதாம் அண்பல் முதல் நா விளிம்பு உறல் உடைய.” — What does this sutra state?", "எனும் நூற்பா உயிரெழுத்துக்களில் ஐந்தனுக்குச் சிறப்புப்பிறப்பு கூறுகிறது. இ ஈ எ ஏ ஐ என்னும் ஐந்து உயிரெழுத்துக்களும் முற்கூறிய அகர, ஆகாரங்களைப் போல வாயைத் திறப்பதாலாகிய முயற்சியால் தோன்றும். மேலும், அவை மேற்பல்லின் அடியை நாவினது அடிவிளிம்பு சென்று பொருந்தப் பிறக்கும் என்பதனை அறிக.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.38, நூ. 86", "", "medium", "false"], ["TOLK-088", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 88: “தம்தம் திரிபே சிறிய என்ப.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 88: “தம்தம் திரிபே சிறிய என்ப.” — What does this sutra state?", "மேலே இரண்டும் பலவுமாய்ச் சேர்த்துக்கூறிய எழுத்துக்களிடையே நுண்ணிய வேறுபாடுகள் உள்ளன. அவை மிகச்சிறியன என்பர் தொல்லாசியர். அவ்வேறுபாடு நுண்ணிதின் உணர்தற்குரியனவாகும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.39, நூ. 88", "", "easy", "false"], ["TOLK-091", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 91: “டகார, ணகாரம் நுனிநா அண்ணம்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 91: “டகார, ணகாரம் நுனிநா அண்ணம்.” — What does this sutra state?", "ஐயம் தீர்த்தல் மேலே மூன்று நூற்பாக்களால் கூறிய ஆறு எழுத்துக்களும் மூவகைப் பிறப்பினவாகும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.39, நூ. 91", "", "easy", "false"], ["TOLK-092", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 92: “அவ்ஆறு எழுத்தும் மூவகைப் பிறப்பின.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 92: “அவ்ஆறு எழுத்தும் மூவகைப் பிறப்பின.” — What does this sutra state?", "மேற்கண்ட மூன்று நூற்பாக்களும் நிரல்நிரை வகையானும், பொருள் கொள்ளுமாறு நிற்றலின் அதனை நீக்கற்கு இடம் உள்ளது என்பதனை இந்நூற்பா தெளிவுறுத்துகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.40, நூ. 92", "", "easy", "false"], ["TOLK-093", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 93: “அண்ணம் நண்ணிய பல்முதல் மருங்கில் நாநுனி பரந்து மெய்உற ஒற்ற தாம் இனிது பிறக்கும் தகார நகாரம்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 93: “அண்ணம் நண்ணிய பல்முதல் மருங்கில் நாநுனி பரந்து மெய்உற ஒற்ற தாம் இனிது பிறக்கும் தகார நகாரம்.” — What does this sutra state?", "இது மெய்யெழுத்துக்களில் சிலவற்றுக்குச் சிறப்புப்பிறப்புக் கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.40, நூ. 93", "", "easy", "false"], ["TOLK-094", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 94: “அணரி நுனிநா அண்ணம் ஒற்ற றஅகான் னஅகான் ஆயிரண்டும் பிறக்கும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 94: “அணரி நுனிநா அண்ணம் ஒற்ற றஅகான் னஅகான் ஆயிரண்டும் பிறக்கும்.” — What does this sutra state?", "ர, ழ பிறத்தல் நாநுனி மேல்நோக்கி அண்ணத்தினை வருட, ரகர ழகரம் ஆகிய இரண்டு எழுத்துக்களும் பிறக்கும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.40, நூ. 94", "", "easy", "false"], ["TOLK-095", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 95: “நுனி நா அணரி அண்ணம் வருட ரகார, ழகாரம் ஆயிரண்டும் பிறக்கும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 95: “நுனி நா அணரி அண்ணம் வருட ரகார, ழகாரம் ஆயிரண்டும் பிறக்கும்.” — What does this sutra state?", "ல, ள பிறத்தல் நாவினது விளிம்பு தடித்து மேல்வாய்ப் பல்லடியினை மிகப்பொருந்த லகாரம் பிறக்கும். நாவினது விளிம்பு தடித்து மேல்வாய்ப் பல்லடியினை யடுத்த அண்ணத்தினைத் தடவ ளகாரம் பிறக்கும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.40, நூ. 95", "", "easy", "false"], ["TOLK-096", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 96: “நா விளிம்பு வீங்கி அண்பல் முதல் உற ஆவயின் அண்ணம் ஒற்றவும் வருடவும் வகார, ளகாரம் ஆயிரண்டும் பிறக்கும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 96: “நா விளிம்பு வீங்கி அண்பல் முதல் உற ஆவயின் அண்ணம் ஒற்றவும் வருடவும் வகார, ளகாரம் ஆயிரண்டும் பிறக்கும்.” — What does this sutra state?", "ப, ம பிறத்தல் மெலுதடும், கீழுதடும் தம்முள் பொருந்தப் பகரமும், மகரமும் பிறக்கும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.41, நூ. 96", "", "easy", "false"], ["TOLK-097", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 97: “இதழ் இயைந்து பிறக்கும் பகார மகாரம்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 97: “இதழ் இயைந்து பிறக்கும் பகார மகாரம்.” — What does this sutra state?", "வ பிறத்தல் மேல்வாய்ப் பல்லினைக் கீழிதழ் பொருந்த வகரம் பிறக்கும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.41, நூ. 97", "", "easy", "false"], ["TOLK-099", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 99: “அண்ணம் சேர்ந்த மிடற்று எழு வளியிசை கண்ணுற்று அடைய, யகாரம் பிறக்கும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 99: “அண்ணம் சேர்ந்த மிடற்று எழு வளியிசை கண்ணுற்று அடைய, யகாரம் பிறக்கும்.” — What does this sutra state?", "இது மெய்எழுத்துக்களில் ஒன்றான யகரத்திற்ப் பிறப்புக் கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.41, நூ. 99", "", "easy", "false"], ["TOLK-101", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 101: “சார்ந்து வரின் அல்லது தமக்கு இயல்புஇல எனத் தேர்ந்து வெளிப்படுத்த ஏனை மூன்றும் தம்தம் சார்பின் பிறப்பொடு சிவணி ஒத்த காட்சியின் தம் இயல்பு இயலும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 101: “சார்ந்து வரின் அல்லது தமக்கு இயல்புஇல எனத் தேர்ந்து வெளிப்படுத்த ஏனை மூன்றும் தம்தம் சார்பின் பிறப்பொடு சிவணி ஒத்த காட்சியின் தம் இயல்பு இயலும்.” — What does this sutra state?", "போலும் என்பதில் மகரம் அரை மாத்திரை அளவுடையது. ஆனால் இது போன்ம் எனக் குறுகி வரும்Nபுhது னகரத்தை அடுத்து அல்லது சார்ந்து மகரம் வரும் நிலையில் ½ மாத்திரையிலிருந்து குறைந்து ¼ கால் மாத்திரை அளவினதாகக் குறுகி ஒலிக்கும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.42, நூ. 101", "", "medium", "false"], ["TOLK-103", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 103: “மூன்றுதலை இட்ட முப்பதிற்று எழுத்தின் இரண்டு தலைஇட்ட முதல் ஆகு இருபஃது அறுநான்கு உறொடு நெறிநின்று இயலும் எல்லா மொழிக்கும் இறுதியும் முதலும் மெய்யே, உயிர் என்று ஆயீர் இயல.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 103: “மூன்றுதலை இட்ட முப்பதிற்று எழுத்தின் இரண்டு தலைஇட்ட முதல் ஆகு இருபஃது அறுநான்கு உறொடு நெறிநின்று இயலும் எல்லா மொழிக்கும் இறுதியும் முதலும் மெய்யே, உயிர் என்று ஆயீர் இயல.” — What does this sutra state?", "மொழிமரபுகளின்கண் கூறியவற்றைத் தொகுத்தும், ஒரு மொழிக்கு முதலும் ஈறுமாவன இவை என விதந்தும் கூறுதலோடு, இடைக்கண் எழுந்த ஐயத்தினையும் இந்நூற்பா நீக்குகிறது. அதாவது, தமிழ் எழுத்துக்கள் முப்பத்துமூன்றில் சொல்லில் வரும் முதல் எழுத்துக்கள் 22; சொல்லின் இறுதியில் வரும் எழுத்துக்கள் 24. எல்லாச் சொற்களுக்கும் இறுதியாகவும் முதலாவதாகவும் வருவன மெய், உயிர் என்னும் இருவகை எழுத்துக்களே. அவை உலகவழக்கு, செய்யுள்வழக்கு என்னும் நெறிகளில் பொருந்தி வரும் என்பதாம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.43, நூ. 103", "", "medium", "false"], ["TOLK-104", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 104: “அவற்றுள் மெய்ஈறு எல்லாம் புள்ளியொடு நிலையல்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 104: “அவற்றுள் மெய்ஈறு எல்லாம் புள்ளியொடு நிலையல்.” — What does this sutra state?", "‘இறுதியும் முதலு மெய்யே உயிரென் றாயீ ரியல’ என்றமையின், முதற்கண் நின்ற மெய்யும் ‘மெய்யி னியற்கை புள்ளியொடு நிலையல்’ எனும் தனிமெய்க்குக் கூறிய விதியான் புள்ளிபெறும் என்று எய்திய விதியினை இந்நூற்பா விலக்குகின்றது. எ-டு.: மரம்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.44, நூ. 104", "", "medium", "false"], ["TOLK-105", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 105: “குற்றியலுகரமும் அற்று எனமொழிப.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 105: “குற்றியலுகரமும் அற்று எனமொழிப.” — What does this sutra state?", "மொழிமுதற்கண்ணும், இறுதிக்கண்ணும் வரும் மெய்களுள் இறுதிமெய் புள்ளி பெறுதல்போல, மொழிமுதற்கண்ணும், இறுதிக்கண்ணும் வரும் குற்றியலுகரங்களுள் ஈற்றுக்குற்றியலுகரம் புள்ளிபெறும் என இது மாட்டேற்றிக் கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.44, நூ. 105", "", "medium", "false"], ["TOLK-106", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 106: “உயிர்மெய் ஈறும் உயிர் ஈற்று இயற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 106: “உயிர்மெய் ஈறும் உயிர் ஈற்று இயற்றே.” — What does this sutra state?", "புணர்ச்சி நிலையும் எழுத்துக்களும் எழுத்து வகையில் நான்கு வகைப்படும் இவ்விரு மொழிப்புணர்ச்சி. அந்நான்கு வகையாவன ; 1. உயிர்ஈற்றுச்சொல் முன் உயிர்முதல்மொழி வரும் இடம்; 2. உயிர் ஈற்றுச் சொல்முன் மெய்ம் முதன்மொழி வரும் இடம், 3. மெய்ஈற்றுச் சொல்முன் உயிர் முதன்மொழி வரும் இடம், 4. மெய்ஈற்றுச் சொல்முன் மெய் முதன்மொழி வரும் இடம் என்பதாகும். புணரும் நிலைமைக்கண் இவை நிறுத்த சொல் (நிலைமொழி), குறித்து வரு கிளவி (வருமொழி) என்ற இரண்டு நிலைகளை உடையதாகும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.44, நூ. 106", "", "medium", "false"], ["TOLK-109", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 109: “அவைதாம் மெய்பிறிது ஆதல், மிகுதல் குன்றல் என்று இவ் என மொழிப திரியு மாறே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 109: “அவைதாம் மெய்பிறிது ஆதல், மிகுதல் குன்றல் என்று இவ் என மொழிப திரியு மாறே.” — What does this sutra state?", "இது மொழிபுணர் இயல்பு நான்கனுள் திரிபு மூன்றனை விளக்குகிறது. எ-டு.: பொன்+குடம் ஸ்ரீ பொற்குடம் - மெய் பிறிதாதல்", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.46, நூ. 109", "", "easy", "false"], ["TOLK-110", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 110: “நிறுத்த சொல்லும் குறித்துவரு கிளவியும் அடையொடு தோன்றினும் புணர் நிலைக்குரிய.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 110: “நிறுத்த சொல்லும் குறித்துவரு கிளவியும் அடையொடு தோன்றினும் புணர் நிலைக்குரிய.” — What does this sutra state?", "இந்நூற்பா, நிறுத்தசொல், குறித்துவரு கிளவி இரண்டனுக்கும் ஒரு புறனடை விதியைக் கூறுகிறது. எ-டு.: அறிவியற்கழகம் - நிறுத்த சொல்லும் குறித்துவரு கிளவியும் தனித்தனி நின்று புணர்ந்தன. பொறியியற் கழகம் - நிறுத்த சொல் அடையடுத்து நிற்கப் புணர்ந்தது. கிளை பெரிது - நிறுத்த சொல்லும் குறித்துவரு கிளவியும் தனித்தனி நின்று புணர்ந்தன. மரக்கிளை பெரிது - நிறுத்த சொல் அடையடுத்து நின்றது. கிளை மிகப்பெரிது. - குறித்து வரு கிளவி அடையடுத்து நின்றது. மரக்கிளை மிகப்பெரிது- நிறுத்த சொல்லும் குறித்துவரு கிளவியும் அடையடுத்து நின்றன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.47, நூ. 110", "", "medium", "false"], ["TOLK-111", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 111: “மருவின் தொகுதி மயங்கியல் மொழியும் அடையொடு தோன்றினும் புணர் நிலைக்குரிய.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 111: “மருவின் தொகுதி மயங்கியல் மொழியும் அடையொடு தோன்றினும் புணர் நிலைக்குரிய.” — What does this sutra state?", "இது வழக்குச்சொற்களேயன்றி, மருஉ மொழிகளும் புணர்க்கப்படும் என்பதனைக் கூறுகிறது. இயல்பான சொற்களே அன்றி மருவி வரும் சொற்களும் புணரும் நிலையினை உடையன. எ-டு.: ஆந்தை, பூந்தை, மீகண், முன்றில் என்பன. (இல்முன்-முன்றில்)", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.48, நூ. 111", "", "medium", "false"], ["TOLK-112", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 112: “வேற்றுமை குறித்த புணர்மொழி நிலையும் வேற்றுமை அல்வழிப் புணர்மொழி நிலையும் எழுத்தே சாரியை ஆயிரு பண்பின் ஒழுக்கல் வலிய புணரும் காலை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 112: “வேற்றுமை குறித்த புணர்மொழி நிலையும் வேற்றுமை அல்வழிப் புணர்மொழி நிலையும் எழுத்தே சாரியை ஆயிரு பண்பின் ஒழுக்கல் வலிய புணரும் காலை.” — What does this sutra state?", "இது எழுத்துவகையானும், சொல்வகையானும் கூறிய புணர்ச்சிகள் பிறிதொரு வகையால் இருவகைப்படும் என்பதனையும், நால்வகைப் புணர்ச்சியுள் மிகுதற் புணர்ச்சியின் இயல்பினையும் உணர்த்துகிறது. வேற்றுமைப் புணர்ச்சி, அல்வழிப்புணர்ச்சி என்று புணர்ச்சி இருவகைப்படும். எழுத்து மிகல், வேற்றுமை மிகல் என்று மிகுதி இருவகைப்படும். எ-டு.: விளங்கோடு - எழுத்து மிக்கது. - வேற்றுமைப்புணர்ச்சி", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.48, நூ. 112", "", "medium", "false"], ["TOLK-113", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 113: “ஐ ஒடு கு இன் அது கண் என்னும் அவ்ஆறு என்ப வேற்றுமை உருபே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 113: “ஐ ஒடு கு இன் அது கண் என்னும் அவ்ஆறு என்ப வேற்றுமை உருபே.” — What does this sutra state?", "இது வேற்றுமையினை விளக்குகின்றது. உருபுகள் இடைச்சொற்களாதலின், அவை பெயர்வழி நின்று குறித்துவரு கிளவியொடு புணர்தற்குரியன. அவ்வாறு பெயர்வழி நிற்குங்கால் வல்லெழுத்து முதலாகிய இரண்டு உருபுகள் புணர்தற்கு உரியனவாகும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.49, நூ. 113", "", "medium", "false"], ["TOLK-114", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 114: “வல்லெழுத்து முதலிய வேற்றுமை உருபிற்கு ஒல்வழி ஒற்றுஇடை மிகுதல் வேண்டும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 114: “வல்லெழுத்து முதலிய வேற்றுமை உருபிற்கு ஒல்வழி ஒற்றுஇடை மிகுதல் வேண்டும்.” — What does this sutra state?", "வல்லெழுத்தினை முதலாக உடைய நான்கனுருபு ‘கு’விற்கும் ஏழனுருபு கண்ணுக்கும் பொருந்துமிடத்து வல்லொற்றாயினும் மெல்லொற்றாயினும் மிகுதல் வேண்டும். ஆறு உருபுகளுள் நான்கும், ஏழும் வல்லெழுத்தினை முதலாக உடையனவாகும். ஏனையவை உயிர்எழுத்துக்களை முதலாக உடையன. எ-டு.: நம்பிக்கு, நங்கைக்கு - உயர்திணைக்கண் நான்கனுருபு வல்லெழுத்து மிக்கு முடிந்தது. மணிக்கு, வேய்க்கு - அஃறிணைக்கண் நான்கனுருபு வல்லெழுத்து மிக்கு முடிந்தது. கொற்றிக்கு, கோதைக்கு- விரவுப்பெய்ர்க்கண் நான்கனுருபு வல்லெழுத்து மிக்கு முடிந்தது. மணிக்கண், வேய்க்கண்- அஃறிணைக்கண் ஏழனுருபு வல்லெழுத்து மிக்கு முடிந்தது. நங்கண், தங்கண் - உயர்திணைக்கண் ஏழனுருபு மெல்லெழுத்து மிக்கு முடிந்தது. நுங்கண் - விரவுப்பெயர்க்கண் ஏழனுருபு மெல்லெழுத்து மிக்கு முடிந்தது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.49, நூ. 114", "", "hard", "false"], ["TOLK-115", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 115: “ஆறன் உருபின் அகரக் கிளவி ஈறுஆகு அகர முனைக் கெடுதல் வேண்டும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 115: “ஆறன் உருபின் அகரக் கிளவி ஈறுஆகு அகர முனைக் கெடுதல் வேண்டும்.” — What does this sutra state?", "இந்நூற்பா, உயிரினை முதலாக உடைய நான்கனுருபுகளில் ஆறனுருபுக்குத் தொகைமரபினை நோக்கி ஒரு சிறப்பு விதியைக் கூறுகிறது. எ-டு.: நமது, எமது, தமது, தனது, எனது, நினது என்பன போல்வன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.50, நூ. 115", "", "easy", "false"], ["TOLK-117", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 117: “உயர்திணைப் பெயரே அஃறிணைப் பெயர் என்று ஆஇரண்டு என்ப பெயர்நிலைச் சுட்டே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 117: “உயர்திணைப் பெயரே அஃறிணைப் பெயர் என்று ஆஇரண்டு என்ப பெயர்நிலைச் சுட்டே.” — What does this sutra state?", "பெயர்கள் எவை என்பதனை இந்நூற்பா எடுத்துரைக்கின்றது. ஆ^உ, மக^உ என்பன உயர்திணைப் பெயர்கள். ஒன்று, பல என்பன அஃறிணைப் பெயர்கள் ஆகும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.50, நூ. 117", "", "easy", "false"], ["TOLK-118", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 118: “அவற்று வழி மருங்கின் சாரியை வருமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 118: “அவற்று வழி மருங்கின் சாரியை வருமே.” — What does this sutra state?", "இது சாரியை வரும் இடங்களைக் கூறுகிறது. எ-டு.: ஆ^உவின் கை, மக^உவின் கை, பலவற்றுக்கோடு எனவரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.50, நூ. 118", "", "easy", "false"], ["TOLK-119", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 119: “அவைதாம் இன்னே, வற்றே, அத்தே, அம்மே, ஒன்னே, ஆனே, அக்கே, இக்கே, அன்என் கிளவி உளப்பட பிறவும் அன்ன என்ப சாரியை மொழியே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 119: “அவைதாம் இன்னே, வற்றே, அத்தே, அம்மே, ஒன்னே, ஆனே, அக்கே, இக்கே, அன்என் கிளவி உளப்பட பிறவும் அன்ன என்ப சாரியை மொழியே.” — What does this sutra state?", "இது பெயரின் பின்வரும் சாரியைகள் இவை எனக் கூறுகிறது. பிறவும் என்றதனால் தம், நம், நும், எம், கெழு, ஏ, ஐ, ஞான்று என்பனவற்றையும் கொள்ளுவர்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.51, நூ. 119", "", "easy", "false"], ["TOLK-120", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 120: “அவற்றுள் இன்னின் இகரம் ஆவின் இறுதி முன்னர்க் கெடுதல் உரித்தும் ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 120: “அவற்றுள் இன்னின் இகரம் ஆவின் இறுதி முன்னர்க் கெடுதல் உரித்தும் ஆகும்.” — What does this sutra state?", "இது சாரியைகளில் முதற்கண் நின்ற இன் சாரியை முதல் திரியுமாறு கூறுகிறது.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.51, நூ. 120", "", "easy", "false"], ["TOLK-122", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 122: “வ‡கான் மெய்கெட சுட்டு முதல் ஐம்முன் அ‡கான் நிற்றல் ஆகிய பண்பே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 122: “வ‡கான் மெய்கெட சுட்டு முதல் ஐம்முன் அ‡கான் நிற்றல் ஆகிய பண்பே.” — What does this sutra state?", "இது வற்றுச்சாரியை முதல் திரியுமாறு கூறுகிறது. சுட்டு முதலாகிய ஐகார ஈற்றுச்சொற்களாவன : அவை, இவை, உவை எ-டு.: அவையற்றை, இவையற்றை, உவையற்றை.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.52, நூ. 122", "", "easy", "false"], ["TOLK-123", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 123: “ன‡கான் ற‡கான் நான்கன் உருபிற்கு.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 123: “ன‡கான் ற‡கான் நான்கன் உருபிற்கு.” — What does this sutra state?", "இது னகர ஈற்றுச் சாரியை நான்கும் ஈறு திரியுமாறு கூறுகிறது. னகர ஈற்றுச் சாரியைகளாவன : இன், ஒன், ஆன், அன் என்பனவாகும். எ-டு.: விளவிற்கு, கோஒற்கு, ஒருபாற்கு, அதற்கு என்பன போல்வன. விளவிற்குஸ்ரீவிளூகு→விளூஇன்+கு→விளூவ்+இன்+கு→விளூவ்+இற்+கு ஸ்ரீ விளவிற்கு என வருதல் காண்க.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.52, நூ. 123", "", "medium", "false"], ["TOLK-124", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 124: “ஆனின் னகரமும் அதன் ஓரற்றே நாள்முன் வரூஉம் வல்முதல் தொழிற்கே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 124: “ஆனின் னகரமும் அதன் ஓரற்றே நாள்முன் வரூஉம் வல்முதல் தொழிற்கே.” — What does this sutra state?", "இது ஆனின் னகரம், நான்கன் உருபு புணர்ச்சிக்கண் மட்டுமன்றிப் பொருட்புணர்ச்சிக்கண்ணும் திரிதலைக் கூறுகிறது. எ-டு.: பரணியாற்கொண்டான். பரணியாற்கொண்டான்ஸ்ரீபரணி+கொண்டான்→பரணி+ஆன்+கொண்டான்→", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.52, நூ. 124", "", "easy", "false"], ["TOLK-126", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 126: “இக்கின் இகரம் இகரமுனை யற்றே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 126: “இக்கின் இகரம் இகரமுனை யற்றே.” — What does this sutra state?", "இஃது இக்குச்சாரியை முதல் திரியுமாறு கூறுகிறது. இக்குச் சாரியையின் இகரம் இகரஈற்றுச் சொல் முன்னர் அத்தின் அகரம் போலக் கெடும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.53, நூ. 126", "", "easy", "false"], ["TOLK-127", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 127: “ஐயின் முன்னரும் அவ்இயல் நிலையும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 127: “ஐயின் முன்னரும் அவ்இயல் நிலையும்.” — What does this sutra state?", "இக்கின் இகரம் இகர ஈற்றுச்சொல் முன்னர் அன்றி, ஒகார ஈற்றுச்சொல் முன்னரும் கெடும். எ-டு.: சித்திரைக்குக் கொண்டான். சித்திரைக்குக் கொண்டான் ஸ்ரீ சித்திரை+கொண்டான் → சித்திரை+ இக்கூ கொண்டான் → சித்திரை+க்கூகொண்டான் ஸ்ரீ சித்திரைக்குக் கொண்டான் என வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.53, நூ. 127", "", "medium", "false"], ["TOLK-129", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 129: “அம்மின் இறுதி கசதக் காலை தன்மெய் திரிந்து ஙஞந ஆகும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 129: “அம்மின் இறுதி கசதக் காலை தன்மெய் திரிந்து ஙஞந ஆகும்.” — What does this sutra state?", "இஃது அம்மின் ஈறு திரியுமாறு கூறுகிறது. அம்முச்சாரியையின் இறுதியாகிய மகர ஒற்று, கசத வருங்காலத்துத் தன் வடிவு திரிந்து முறையே ஙஞந ஆகும். எ-டு.: புளியங்கோடு, புளியஞ்செதில், புளியந்தோல்", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.54, நூ. 129", "", "easy", "false"], ["TOLK-133", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 133: “அத்தே, வற்றே ஆயிரு மொழிமேல் ஒற்றுமெய் கெடுதல் தெற்றென்றற்றே அவற்றுமுன் வரூஉம் வல்லெழுத்து மிகுமே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 133: “அத்தே, வற்றே ஆயிரு மொழிமேல் ஒற்றுமெய் கெடுதல் தெற்றென்றற்றே அவற்றுமுன் வரூஉம் வல்லெழுத்து மிகுமே.” — What does this sutra state?", "அத்து, வற்று என்னும் இரண்டு சாரியைகளின்மேல் நின்ற ஒற்று, தன் வடிவு கெடுதல் தெளிவாக உணரப்படும். அவற்றுமுன் வரும் வல்லெழுத்து மிக்கு முடியும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.56, நூ. 133", "", "easy", "false"], ["TOLK-134", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 134: “காரமும் கரமும் கானொடு சிவணி நேரத் தோன்றும் எழுத்தின் சாரியை.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 134: “காரமும் கரமும் கானொடு சிவணி நேரத் தோன்றும் எழுத்தின் சாரியை.” — What does this sutra state?", "எழுத்துச் சாரியைகளைப் பற்றி இந்நூற்பா கூறுகிறது. எ.டு.: பகரம், மகாரம், மஃகான் என்பன போல்வன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.56, நூ. 134", "", "easy", "false"], ["TOLK-135", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 135: “அவற்றுள் கரமும் கானும் நெட்டெழுத்து இலவே.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 135: “அவற்றுள் கரமும் கானும் நெட்டெழுத்து இலவே.” — What does this sutra state?", "இஃது, அவற்றுள் சில நெட்டெழுத்துக்களோடு வாரா என்று விலக்குகின்றது. எ.டு.: ஆகாரம், ஈகாரம், ஔகாரம், ஊகாரம், ஏகாரம் என்று வரும்.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.56, நூ. 135", "", "easy", "false"], ["TOLK-136", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 136: “வரன்முறை மூன்றும் குற்றெழுத்து உடைய.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 136: “வரன்முறை மூன்றும் குற்றெழுத்து உடைய.” — What does this sutra state?", "இது நெடிலுக்குச் சில சாரியைகள் விலக்கியதுபோலக் குறிலுக்கும் விலக்குண்டோ என்றெழும் ஒயத்தினை அகற்றுகின்றது. எ.டு.: அகரம், ஆகாரம், அஃகான் என்பன போல்வன.", "Tolkāppiyam Eluttatikāram textbook (Bharathidasan University), p.57, நூ. 136", "", "easy", "false"], ["TOLK-137", "Tolkāppiyam", "தொல்காப்பியம் எழுத்ததிகாரம் நூற்பா 137: “ஐகார, ஔகாரம் கானொடும் தோன்றும்.” — இந்த நூற்பா கூறும் கருத்து யாது?", "Tolkāppiyam Eluttatikāram sutra 137: “ஐகார, ஔகாரம் கானொடும் தோன்றும்.” — What doe
