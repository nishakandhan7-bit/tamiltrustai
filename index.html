இருபது பாடல்கள்: “பாடல் : 40 : பரத்தைக் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – நற்றிணை – அடுத்த இருபது பாடல்கள்: Explain the poem/passage titled “பாடல் : 40 : பரத்தைக் கூறியது” (section 10.22).", "நெடு நா ஒள் மணி கடி மனை இரட்ட, குரை இலைப் போகிய விரவு மணல் பந்தர்ப் பெரும்பாண் காவல் பூண்டென ஒரு சார்த் திருந்திழை மகளிர் விரிச்சி நிற்ப, வெறி உற விரிந்த அறுவை மெல் அணைப் புனிறு நாறு செவிலியொடு புதல்வன் துஞ்ச, ஐயவி அணிந்த நெய்யாட்டு ஈரணிப் பசு நெய் கூர்ந்த மென்மை யாக்கைச் சீர்கெழு மடந்தை ஈர் இமை பொருந்த, நள்ளென் கங்குல் கள்வன் போல, அகல்துறை ஊரனும் வந்தனன், சிறந்தோன் பெயரன் பிறந்தமாறே திணை : மருதம் திணை பாடியவர் :கோண்மா நெடுங்கோட்;டனார் சிறப்புமிக்க தலைவன் இல்லத்தில் நீண்ட நாவையுடைய ஒள்ளிய மணி ஒலிக்கும். ஒலிக்கும் ஓலைகளால் வேயப்பட்ட பந்தர் மணல் பரப்பில் இருக்கும். பெரிய பாணன் காவல் பூண்டது போல ஒரு பக்கம் இருப்பான். திருந்திய அணிகலன்கள் அணிந்த பெண்கள் நன்னிமித்தம் எதிர்பார்த்து நிற்பர். நறுமணம் உண்டாக விரித்திருந்த நூலாடையுடைய மெல்லிய படுக்கையில் அண்மையிற் பிறந்த புதல்வன் செவிலியருகில் உறங்குகிறான். சிறப்பு மிக்க தலைவி வெண் சிறுகடுகு அணிந்த நெய்யாட்டு நிறைவேறிய அணிமைக் காலத்தில் பசிய நெய் விளங்கும் மெல்லிய உடம்போடு இரு இமைகளும் பொருந்த தூங்கிக் கிடந்தாள். இருள் செறிந்த இரவிலே அகன்ற நீர்த்துறையை உடைய ஊரனாகிய தலைவனும் கள்வன் போலப் புகுந்தான். சிறந்த தன் தந்தையின் பெயரைச் சூட்டிக் கொள்ளப் போகும் மகன் பிறந்தான் என்ற காரணத்தால் தலைவன் தன் இல்லம் போந்தான். துறை விளக்கம் : தலைவிக்கு வேண்டி தோழி சொல்லியது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 10, section 10.22, p.193", "", "medium", "false"], ["SANG-11-3", "Sangam literature", "சங்க இலக்கியம் – பரிபாடல் – வையைப் பாடல்கள்: “பாடல் : 1 (6)” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – பரிபாடல் – வையைப் பாடல்கள்: Explain the poem/passage titled “பாடல் : 1 (6)” (section 11.3).", "பாடியவர் : நல்லந்துவனார் பண் அமைத்தவர்:நல்லச்சுதனார் பண் : பாலை யாழ் துறை : வையை நீர் விழவணியிற் காதற்பரத்தை, இற்பரத்தையுடன் நீராடினன் தலைமகன் எனக் கேட்டுப் புலந்தாளைப்புலவி நீக்கிப் புணர்ந்தான் எனக் கேட்ட மலைமகள், வாயிலாகப் புக்க விறலிக்கு அவ்வையையிடம் விழவணியும் ஆய்குப்பட்ட செய்தியும் கூறி வாயில் மறுத்தது. வைகையில் பெரு வெள்ளம் : நிறை கடல் முகந்து உராய், நிறைந்து நீர் துளும்பும் தம் பொறை தவிர்பு அசைவிடப் பொழிந்தன்று வானம் நிலம் மறைவது போல் மலிர் புனல் தலைத் தலைஇ, மலைய இனம் கலங்க மலைய மயில் அகவ மலை மாசு கழியக் கதழும் அருவி இழியும் 5 மலி நீர் அதர் பல பெழுவு தாழ் வரை மாசு இல் பனுவற் புலவர் புகழ் புல நாவின் புனைந்த நன் கவிதை மாறாமை, ளுநடக -ஐளெவசரஉவழையெட மேவிப் பரந்து விரைந்து வினை நந்தத் ஆயவநசயைட தாயிற்றே தண் அம் புனல் . 10 புதுப் புனலாட முற்படும் மகளிரது செயல் : புகை, பூ, அவி, ஆராதனை, அழல், பல ஏந்தி, நகை அமர் காதலரை நாளணிக் கூட்டும் வகை சாலும் வையை வரவு. தொடி தோள் செறிப்பத், தோள் வளை இயங்கக், கொடி சேரா திருக் கோவை காழ் கொளத், 15 வையையின் கரை உடைதல் : தொகு கதிர் முத்துத் தொடை கலிழ்பு மழுக, உகிரும் கொடிறும் உண்ட செம்பஞ்சியும், நகில் அணி அளறு நனி வண்டல் மண்ட, இலையும் மயிரும் ஈர்ஞ் சாந்து நிழத்த, முலையும் மார்பும் முயங்கு அணி மயங்க, 20 விருப்பு ஒன்றுபட்டவர் உளம் நிறை உடைத்தென, “வரைச்சிறை உடைத்ததை வையை; வையைத் திரைச்சிறை உடைத்தன்று கரைச்சிறை; அறைக” எனும் உரைச்சிறைப் பறை எழ ஊர் ஒலித்தன்று அன்று, போர் அணியின் புகர் முகம் சிறந்தென, 25 மைந்தரும் மகளிரும் நீராடச் செல்லல் : நீரணி அணியின் நிரை நிரை பிடி செல் ஏரணி அணியின் இகல் மிக நவின்று, தணி புனல் ஆடும் தகை மிகு போர்க்கண் துணி புனல் ஆக துறை வேண்டும் மைந்தின், 30 அணி அணி ஆகிய தாரர் கருவியர், அடு புனலது செல அவற்றை அழிவர், கைம்மான் எருத்தர், கலி மட மாவினர், நெய்ம் மாண் சிவிறியர், நீர் மணக் கோட்டினர். வெண்கிடை மிதவையர், நன் கிடைத் தேரினர். 35 ஆற்றினது நீரோட்டம் : சாரிகை மறுத்துத் தண்டா உண்டிகை ஓர் இயவு உறுத்தர ஊர் ஊர்பு இடம் திரீஇச், சேரி இளையர் செல அரு நிலையர் வலியர் அல்லோர் துறை துறை அயர, மெலியர் அல்லோர் விருந்து புனல் அயர, 40 அந்தணர்கள் கொண்ட கலக்கம் : சாறும் சேறும் நெய்யும் மலரும் நாறுபு நிகழும், யாறு வரலாறு நாறுபு நிகழும் யாறு கண்டு, அழிந்து, வேறுபடு புனல் என, விரை மண்ணுக் கலிழை புலம் புரி அந்தணர் கலங்கினர் மருண்டு. 45 பிறரும் சேறு கலந்த புனல் கண்ட நீங்குதல் : மாறு மென்மலரும். தாரும், கோதையும், வேரும், தூரும், காயும், கிழங்கும். பூரிய மாக்கள் உண்பது மண்டி நார் அரி நறவம் உகுப்ப ‘நலன் அழிந்து வேறாகின்று இவ் விரி புனல் வரவு’ என, 50 புனலது செலவு : சேறு ஆடு புனலது செலவு வரை அழி வால் அருவி வா தாலாட்ட, கரை அழி வால் அருவிக் கால் பாராட்ட, ‘இரவில் புணந்தோர் இடை முலை அல்கல் புரைவது பூந்தாரான் குன்று’ எனக் கூடார்ககு ; 55 உரையொடு இழிந்து உராய், ஊரிடை ஓடிச், சலப்படையான் இரவில் தாக்கியது எல்லாம் புலப்படப் புன் அம் புலரியின் நிலப்படத் தான் மலர்ந்தன்றே, தமிழ் வையைத் தண்ணம் புனல். 60 காதற் பரத்தையின் ஐயம் : “விளியா விருந்து விழுவார்க்குக் கொய்தோய்” “தளிர் அறிந்தாய் தாம் இவை” “பணிபு ஒசி பண்ப! பண்டெல்லாம் நனி உருவத்து என்னோ துவள் கண்டீ? எய்தும் களவு இனி; நின் மார்பின் தார் வாடக் 65 கொய்ததும் வாயாளோ? கொய் தழை கை பற்றிச் செய்ததும் வாயாளோ? செப்பு!” “புனை புனை ஏறத் தாழ்த்ததை தளிர். இவை நீரின் துவண்ட சேஎய் குன்றம் காமர் பெருக்கு அன்றோ வையை வரவு?” 70 “ஆம் ஆம் அது ஒக்கும்; காதல் அம் காமம் ஒருக்க ஒரு தன்மை நிற்குமோ? ஒல்லைச் சுருக்கமும் ஆக்கமும் சூள் உறல்! வையைப் பெருக்கு அன்றோ பெற்றாய் பிழை, அருகு பதியாக அம்பியில் தாழ்ப்பிக்கும், 75 குருகு இரை தேரக் கிடக்கும் பொழி காரில், இன் இளவேனில் இது அன்றோ வையை? நின் வையை வயமாக வை. செல் யாற்றுத் தீம் புனலில் செல் மரம் போல, வவ்வு வல்லார் புணை ஆகிய மார்பினை; 80 என்னும் பனியாய் இரவெல்லாம் வைகினை; வையை உடைந்த மடை அடைத்தக் கண்ணும் பின்னும் மலிரும் பிசிர் போல, இன்னும் அனற்றினை துன்பு அவிய நீ அடைந்தக் கண்ணும், பனித்துப் பனி வாரும் கண்ணவர் நெஞ்சம் 85 கனற்றுபு காத்தி வரவு!” “நல்லாள்! கரை நிற்ப நான் குளித்த பைந்தடத்து நில்லாள் திரை மூழ்கி நீங்கி எழுந்து, என் மேல் அல்லா விழுந்தாளை எய்தி எழுந்து, ஏற்று யான் கொள்ளா அளவை எழும் தேற்றாள்; கோதையின் 90 உள் அழுத்தியாள் எவளோ? தோய்ந்தது யாது?” என “தேறித் தெரிய உணர் நீ! பிறிதும் ஓர் யாறு உண்டோ இவ் வையை யாறு?” “இவ் வையை யாறு என்ற மாறு என்னை? கையால் தலை தொட்டேன் தண் பரங்குன்று!” 95 அவள் இல்லத்தின் முதுபெண்டிர் கூறியது : “சினவல்! நின் உண்கண் சிவப்பு அஞ்சுவாற்குத் துனி நீங்கி, ஆடல் தொடங்கு; துனி நனி கன்றிடின் காமம் கெ^உம் மகள்; இவன் அல்லா நெஞ்சம்உறப் பூட்டக் காய்ந்தே வல் இருள் நீயல் அது பிழையாகும்” என 100 தலைவி விறலியிடம் கூறுதல் : இல்லவர் ஆட, இரந்து பரந்து உழந்து வல்லவர் ஊடல் உணர்த்தர, நல்லாய் களிப்பர் குளிப்பர் காமம் கொடி விட, அளிப்ப துனிப்ப ஆங்காங்கு ஆடுப் ஆடுவார் நெஞ்சத்து அல்ந்து அமைந்த காமம் வாடற்க, வையை நினக்கு 106 (1-10) : மேகங்கள் நீர் நிறைந்த கடலில்இருக்கும் நீரை முகந்து கொண்டு வானில் எங்கும் பரவி, நீர் நிறைதலால் துளும்பும் த் பாரம் தீர்ந்து இளைப்பாறும் பnருட்டுப் பெய்பவை போலர்ழை பொழிந்தன. அதனால் மிக்க நீர் ஊழிக்காலத்தில் நிலத்தை மூடப் பெருகுவது பொன்று பெருகி, இடந்தோறும் கூடி, மலையில் வாழும் மான் கூட்டம் முதலிய உயிரினம் கலங்குமாறும, மயில்கள் களித்து அகவவும், மலைகள் மீது பந்துள்ள அழுக்குகள் நீங்கும்படி விரையும் அருவியாய் விழுக்pன்றது வெள்ளம். அது ஓடுதற்குரிய வழிகள் பற்பல பொருந்திய மலைச் hசரலில் குளிர்ந்த அழகிய அந்நீர், குற்றம் இல்லாத நூற் கேள்வியையுடைய நல்லிசைப்புலவர்கள் புகழும் அறிவையடைய தம் நாவால் பாடிய நல்ல செய்யுள்கள் பொய்படாமல் நிலைநிற்கச்செய்ய எங்கும் போய்ப் பரவி உழவு முதலிய தொழில்கள் பெருகும்படி தாவிச் சென்றது. (11-13) : அந்த வெள்ள நீர் வையையாற்றில் வந்த வருகையில் புதுநீரில் ஆடுவதற்கு விரும்பினர் மகளிர். தம் கூந்தலைப் புலரச் செய்வதற்குரிய அகில் மரம் முதலிய புகைப்பதற்குரியவையும், அணிந்து கொள்வதற்குரிய மலர்களும் வையை ஆற்றுக்கு ஆராதனை செய்வதற்கு உரியவையம் தீயும் என்பனவற்றையும் பொன்மீன், பொன் நண்டு முதலிய பற்பல பொருள்களையும் எடுத்துக்கொண்டனர். தம் மகிழ்சச் p பொருந்திய கணவன் மாரைத் திருநாளுக்கு உரிய அணிகள் ஆடைகள் ஆகியவற்றை அணியச் செய்யும் இம்முறை பொருந்தியது. (14-24) : மகிழ்சச ; pயால் மகளிர்க்கு உடல் பூரித்தலால் தொடிகள் தோளில் அழுந்த, தோளில் இட்ட வளையம் முன் கையில் வந்து மோதும். எழுதப்பட்ட தொய்யில் கொடிகள் ஒன்றுடன் ஒன்று கூடிக் கலந்து அழியும். மகளிரின் மேகலை வடங்கள் அற்று உதிர்ந்து அதனது நூல் வெளிப்பட்டுத் தோன்றும். திரண்ட ஒளியை உடைய முத்து மாலை கலங்கிச் சந்தனம் முதலிய பூசப்பட்டதால் ஒளி மழுங்கும். நகத்திலும் கபோலத்திலும் ஊட்டப்பட்ட செம்பஞ்சுக் குழம்பு அழியும். முலையில் பூசப்பட்ட குங்குமக் குழம்பு வண்டல் போல் படிந்து தோன்றும். தளிர் கொண்டு கட்டப்பட்ட படலைமாலையும் கூந்தலும் குளிர்ந்த சந்தனத்தை அழிக்கும். மங்கையர் மார்பிலும் ஆடவர் மார்பிலும் பொருந்திய அணிகலன்கள் தம்முன் கலந்து விளங்கும். மகளிரும் மைந்தரும் அழகிய அவ்விருவர் தம் உள்ளமம் அன்பால் ஒன்றுபட்டு அவர் தம் நிறையை உடைக்கும். அவை போல் வெள்ளம் மலை போன்ற அணைகளை உடைத்தழித்தது. அந்த ஆற்றின் சிறகுகளான அலைகளோ வையையாற்றின் கரையான காவலை உடைத்தது. அக்கரையை அடைத்தற்கு ஆட்கள் வருக என்று காவலர் உரைத்தனர். அவர் தம் சொல்லாகிய காவல் ஒலியுடன் பறையொலித்தது. அவ்வொலியுடன் கிளர்நதது எழும் ஊராரின் ஆரவாரமும் எழுந்தது. (25-37)அங்ஙனம் ஊரார் கிளர்ந்து ஆராவாரம் செய்த அன்று. பொர் செய்வதற்கு அணி வகுக்கப்பட்ட அணியில் களிற்றி யானைகள் அணி அணியாய்ச் செல்வதைப் போல், இந்த நீராட்டு விழாவின் பொருட்டு வகுக்கப்பட்ட அணியில், வரிசை வரிசையாகப்பெண் யானைகள் சிறந்து செல்லலால், அழகிய அணி அணிந்த அணிகலன்களையும் இளைய ஆடவரும் அவருக்கு இளையரான மகளிரும். கரை முதலியவற்றை இடிக்கம் அந்த வையை யாற்றின் வெள்ளத்தினூடு புகுவதற்காக அணிகலன்களை நீக்கி நீராடத் தக்க அணிகளுடனே யானையின் பிடரியிலும் மெல்லிய நடையுடைய குதிரையின் மீதும் விளையாட்டுப் போரைப் பெரிதும் விரும்பினராய்நீராட்டு விழாவுக்குரிய தகுதி மிக்க தெளிந்த வையை நீரே விளையாட்டுப்போரை நிகழ்த்துதற்குரிய போர்க்களமாய்க் குகுறித்தனர். தமக்கு ஏற்ற துறையைத் தேர்ந்து கொள்ளும் விருப்புடன் ஒருவருக்கு ஒருவர் முற்பட்டுக் கூட்டம் கூட்டமான தூசிப்படை போல் விளங்கிச் சென்றனர். உள்ளெ இடப்பட்ட புழுகு நெய்யால் சிறந்த துருத்தியை (நீர் பாய்ச்சும் கருவி) உடையவராய்ச்சென்றனர். உள்ளே இடப்பட்ட பனிநீரால் மணம் மிக்க கொம்புகளை உடையவராய்ச் சொன்றனர். அவர்கள் வெண்மையான நெட்டிகளால் செய்யப்பட்ட தெப்பங்ளை உடையவராய், சென்றனர். செலவு தவிராத யானைக் கூட்டமும் குதிரைக் கூட்டமும் தம் தம் கதியில் செல்வதை ஒழிந்து அந்த ஒரே வழியில் செல்பவரை நெருக்கும்படியாய் மக்கள் சென்றனர். (38-45) : மேற்கண்ட வண்ணம் மதுரை மக்கள் ஆற்றங்கரையில்திரிந்தனர். இதனால் புறஞ்சேரியில் இருந்த இளைஞர் தாம் வெளியே செல்வதற்கும் அரிய நிலையை உடையவர் ஆயினர். எல்லாரும் ஒருவரை ஒருவர் முற்படச்சென்றனர். சென்று துறைகளில் இடம் பிடிக்க முயன்றனர். வலிமை அற்றவர் ஆற்று நீரில் குதித்தாட அஞ்சினர். துறைதுறையாய்த் துறை அருகில் நின்ற நீராடலாயினர். மெலியவர் அல்லாதார் புதிய நீரில் குதித்து நீர் விளையாட்டு ஆடலாயினர். அதனால் அவர்கள் அணிந்திருந்த பத்துத் துவர் முதலியன ஊறின நீரும் சந்தனம் முதலியவற்றின் குழம்பும் நறுமண எண்ணெயும் சூடியிருந்த மலர்களும் மணக்குமாற இந்த வையையாறு விளங்கம். இதனால் வேதத்தை விரும்பும் அந்தணர் இப்படிப் பல்வேறு மணம் மணக்க ஓடும் ஆற்றின் தன்மையை உணர்ந்து மங்கையரும் ஆடவரும் பூசிய மணப்பொருள்கைளக் கழுவி யஅக்கலங்கல் நீரை இது தூய்மை இழந்து விட்டது என எண்ணி மருட்சி அடைந்தனர். நீhடுதலும் ஆசமனம் செய்தலும் செய்யாதவராய்க் கலக்கம் அடைந்தனர். (46-51) ; சூடிக் கழித்ததால் தம் நிறம், மணம் மாறிய மென்மையான மலரும், ஆடவர் அணிந்த மாலைகளும், மங்கையர் அணிந்த மாலைகளும். கரையை இடித்து வருதலாலர் அந்தக் கரையில் உள்ள மரம் செடி கொடிகளின் வேர், த}ர். காய் கிழங்குகள் ஆகியவற்றுடன் கீழ் மக்கள் குடித்து மிஞ்சிய பன்னாடையால் வடித்த கள்ளை வார்த்தலால் அதனையும் மேற்கொண்டு இந்த விரிந்த நீரின் வருகை நலம் கெட்டு மாறுபட்டது என்று அந்த அந்தணரே அல்லாமல் மற்றவரும் அவ்வையை ஆற்றை நீங்கிச் சென்றனர். அக்குழம்பிய நீரின் வரவு இத்தகைய தன்மை உடையது. (52-60) : எல்லை கடந்து இழிகின் வெண்மையான அருவி தாலாட்டவும் தடையில்;லாமல் செல்லும் தூய்மையானதும் உருவம் அற்றதும் ஆன தென்றற்காற்று பாராட்டவும் இரவுக்குறியில்தலைவியைக் கண்டு கூடிய தலைவர் அத்தலைவியின் முலையிடைக் கிடந்து இன்துயில் கொள்வதற்குக் கடப்ப மாலையை அணிந்த முருகப்பெருமானின் திருப்பரங்குன்றம் பொருத்தமானது என்று இவ்வாறு எண்ணி அங்குச் செல்லாத மாந்தரக்குக் கூறும் தொழிலுடன். இழிந்து பரவி மதுரைத் தெருக்களின் இடையே ஓடி வஞ்சனை செய்யும் மல்ர அம்புகளையுடைய காமன் இரவ நேரத்தில் மகளிரையம் மைந்தரையும் மோதியவை எல்லாம் புலனாகும்படி மகளிர் ஊடல் கொண்டு அறுத்து எறிந்த மாலை முதலியவற்றை வாரிக் கொணர்வதால் யாவார்க்கும் புலப்படச் செய்து பொலிவற்ற வைகறைப்பொழுதில் தெருக்கள் யாவும் வறுநிலமாகும்படி பரந்தது. தமிழையுடைய வையை ஆற்றில் வந்த அழகிய புதுநீர் இத்தன்மை உடையது என்று அந்நீரிpல் ஆடிய தலைவன் தன் காதல்; பரத்தைக்குச் சொன்னான். (61-70) : மேற்கண்டவாறு தலைவன் காதற் பரத்தையிடத்துக் கூறினான். காதற்பரத்தை அதைக் கேட்டு ஊடல் கொண்டு அவனைப் பழித்து ஊடல் கொண்டாள். அவரன் அவளது ஊடலைத் தீர்க்க முயன்றான். இதனை விளக்குவது இது. ‘நீ அழைக்கப்படாத விருந்தினனாய்ச் சென்றாய். நின்னை விரும்பும் மகளிர்க்காகவே இத்தளிரைக் கொய்தாய். எனக்காக அத்தளிரைக் கொய்யவில்லை” என்ற காதற் பரத்தை உரைத்தாள். அதைக் கேட்டத் தலைவன், “நீ நன்கு அறிந்தாய், இவை பிற மங்கையர்க்குக் கொய்தவை! உண்மையே! என்றான் அவன். அதைக் கேட்ட காதற் பரத்தை “பணிவான சொற்களைச் சொல்வாயேனும்முறிந்த அன்பை உடையவனே! இச்செயலால் இப்போது நின் களவொழுக்கம் எனக்குப் புலப்படுகின்றது. முன்பு எனக்கு;கொய்து வந்த தளிர் எல்லாம் விரைவில் நீ வருதலால் அத்தளிரின் உருவம் துவளாது. ஆனால் அத்தளிரோ மிகவும் துவண்டுள்ளது. பார்! இதற்குக் காரணம் நீ இது பிறிது ஒருத்திக்குக் கொய்து கொண்டு போய் அவளுக்குத் தர அவள் அதனை மறுக்க அதனால் காலம் நீட்டித்தமையே ! அதில்லையேல் வேறு என்ன? கூறுக! “இனி அந்தப்;பதியவள் தான் நின் மார்பில் அணிந்த மாலை வாடும்படி நெடிது நின்று அத்தளிரைக் கொய்வதற்கேனும் நினக்கு இசைய வில்லையோ! இவ்வாறு பறிக்கப்பட்ட இந்தத் தழையைக் கையுறையாக் கொண்டு போய் அவளடியில் வீழ்ந்து வணங்கியிருப்பாயே! அதற்காகவேனும் அவள் நினக்கு இசையவில்லையோ! ஏன் விழிக்கின்றாய்? சொல்!” என்றாள். அதைக் கேட்ட அத்தலைவன், “வையை ஆற்றில் புதுப்புனல் வருகை அழகான பெருக்கன்றோ, அதனால் அழக கட்டு மரத்தில் ஏறி ஆற்றைக்கடத்தற்குக் காலம் தாழ்ந்தது. ஆதலால் அந்த வையை நீர் காரணமாக இவை துவண்டன. யான் முருகப்பெருமானின் திருப்பரங்குன்றத்தின் மீது ஆணையாக இதைச் சொல்கின்றேன்” என்றான். (71-74) : ஆம்! ஆம்! நீ கூறுவதும் பொருந்தும். காதலையுடைய அழகிய காமமும் ஒருமிக்க ஒரே தன்மை கொண்டதாய் இருத்தல் உண்டோ! சிலரிடம் விரையச் சுருங்கும். சிலரிடம் பெருகும். அதனால் இந்த வையை ஆற்றினது நீர்ப் பெருக்கை அக்காமம் ஒத்ததாய் உள்ளது. நீ தேவையற்றுச் சூள் கூறிப் பிழை செய்தாள். இனி இத்தகைய சூள் உரைக்காதே. (75-78) : “வானம் பெய்யும் கார்காலத்தில எம் ஊர் உம் ஊர்க்கு அருகாயிருக்க, தெப்பம் காரணமாக நின்னைத் தாழ்ப்பிக்கும் இன்னிளவேனில் குருகுகள் இரை தேடும் அளவில் நீர் வற்றிக் கிடக்கும் இத்தகைய இயல்பு கொண்டது அன்றோ வையை ஆறு? அதனால் நின் காமத்தையும் வையை ஆறு அழித்ததாக எண்ணுவாய்! என்றாள். (79-80) : “தனக்கு என இயக்கம் இல்லாது இனிய புனலில் அந்நீர் ஓடும் மரம் போல் நின்னைக் கவர்ந்து கொள்வதில் வல்ல மங்கையர் இயக்கிய வழியே இயங்கினை. அம்மங்கையர் நீராடும் தெப்பமான மார்பையும் உடையை! அவ்வாறு இருத்தற்கு ஒரு சிறிதும் அஞ்சாமலும் இரவுப் பொழுதெல்லாம் அவளோடு தங்கினாய்! இந்த வையை ஆற்றில் உடைந்த மடையை அடைந்த போதும் மீண்டும் ஒழுகும் ஓற்று நீர். அதுபோல் முன்னே உண்டான துன்பம் நீ;ங்கும்படி நீ அவரிடம் தங்கியிருந்தாய். என்றாலும் நினது பிரிவால நீர் ஒழுகும் கண்ணை உடைய அம்மங்கையர் நெஞ்சத்தைப் பின்னரும் வருந்தும் படியாகச்செய்து இப்படி என்னிடம் வந்தனை, இனி இங்ஙனம் வரவேண்டா!” இப்படிக் காதற் பரத்தை சொன்னாள். (87-91) : ஏடி! நான் ஒரு நீர்நிலையில் நீராடினேன். அந்நீரிநிலையின் கரையில் அழகியவள் நின்றிருந்தாள். அங்ஙனம் நின்றிருந்தவள் தன் அறியாமையால் தரையிலேயே நில்லாதவளாய் அக்குளத்தில் பாய்ந்து ஆழ்ந்தாள். பின்பு மேலேஎழுந்தாள். எழுந்தவள் மயங்கி என் மீது விழுந்தாள். விழுந்தவளை நான் என் கையில் எடுத்துக் காக்க முயன்றேன். என்னை விட்டு எழுந்தாள். அதனால்அவள் காம நுகர்வு அறியாத இளமையுடையவள் என அறிந்து கொள்வாய். அவளையெ அல்லாமல் என்மார்பில் மாலை போல என் மார்பில் முயங்க முனைந்தவரள் யாவள்? நான் அவளைத் தழுவிய ஆறுதான் எதுவோ?” என்று கூறினான். அதன்மேல் பரத்தை உரைக்கத் தொடங்கினாள். (92-93) : “அதை நான் சொல்வேன். சொன்ன பின்பு நீயே நன்கு உணர்ந்துகொள். நீ அவளுடன் ஆடுதற்கு ஏற்ற ஆறு மற்றொன்று உண்டோ! நீ நீராடியது இந்த வையை ஆறுதான்” இவ்வாறு காதற் பரத்தை சொன்னாள். (94-95) : அவள் கூறியதைக் கேடடான் அத்லைவன். யான் குளம் ஒன்றில் குறித்தேன். அவங்ஙஉமிருக்க நீ இந்த வைiயாற்றில் தான் ஆடினாய் என்று மாறுபட்ட பேசுகின்றாய். என்ன காரணமோ! இதன் மேலும் நீ ஐயம் பொள்வாயாயின் முன்னகம் சூள் உரைத்தது போல் மீண்டும் திருப்பரங்குன்றின் தலையைத் தொட்டுக் கூறுகின்றேன் என்று சொன்னான். தலைவனும் காதலர் பரத்தையும் .ங்ஙனம் முரண்பட்டுப் பேசிக் கொண்டதைக் காதல் பரத்தை வீட்டில் இருந்த முதிய பெண்டிரில் ஒருத்தி காதற் பரத்தை ஊடியதைக் கடிந்த உரைத்துத் ததணியச்செய்தாள். தலைவன் அக்காதற் பரத்தையைக் கூடிக் களித்தான். இச்செய்தியை எல்லாம் தலைவி அறிந்தாள். ஆதலால் தலைவன் பொருட்டாகத் தன்னிடம் தூதாய் வந்த விறலியிடம் கூறி இத்தையவனை இனிமேல் தான் ஏற்க இயலாது என்று மறுத்துக் கூறினாள். (96-104) : இவ்வாறு ஊடி நின்ற காதற் பரத்தையின் வீட்டில் உள்ள முதுபெண்டிர் அவளை நோக்கி, “நீ இப்படிச் சினம் கொள்ளாதே! தலைவனோ நின் மை பூசப்பட்ட கண் சினந்தாலே அதற்குப் பெரிதும் அஞ்சுகின்றான். அவ்வாறு அஞ்சுபவனிடம் நீ ஊடல் நீங்கி அவனுடன் விளையாடுவதைத் தொடங்குவாயாக! அவ்வாறின்றி நீ தலைவனின் இயல்பை உணராமல் ஊடலில் மிகவாயின் அவன் காம இன்பம் பதனழிந்து கெடும். நீயோ பெண் மகள். இத்தலைவனின் சுழலும் நெஞ்சம் இறுக்கமாகப் பூட்டிக்கொள்ளும்படி சினந்து நின்னை விட்டுப் பிரிந்து நீங்குவது உறுதியாம். பின்பு இவனைத் தேடிக்கொண்டு இருள் மிக்க இரவில் செல்ல நேரும். ஆகவே நீ அவ்வாறு செல்வதை ஒழிவாய். அங்ஙனம் இருளில் செல்வது இடம் அறிந்து ஊடி இனிதாய் உணரும் ஒழுக்கத்துக்குப் பிழையாகும்” என்று கூறித் தேற்றுதலானும் ஊடல் உணர்த்தவல்ல வாயில்களும் இரந்து சொல்லியும் அந்த இருவரும் கூடும்படி ஊடலைத் தணித்தலானும் விறலியே அந்த இருவரும் கள்ளுண்ட களிப்பர். வையை ஆற்றில் நீராடுவர். காம இன்பம் மிகம்படி ஊடிக் கொள்வர். ஊடல் சிறிது மிக்கவுடன் அது தணிந்து கூடுவர். அங்கங்கே போய் விளையாடுவர். (105-106) : வையை ஆறே! நீ நின்னிடம் நீராடுபவரின் மனத்தில் பெருகிப் பொருந்திய இத்தகைய காமத்தை உண்டாக்குகின்ற தன்மை நின்னிடம் என்றும் குறையாதாகுக.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 11, section 11.3, p.195", "", "hard", "false"], ["SANG-11-4", "Sangam literature", "சங்க இலக்கியம் – பரிபாடல் – வையைப் பாடல்கள்: “பாடல் : 7” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – பரிபாடல் – வையைப் பாடல்கள்: Explain the poem/passage titled “பாடல் : 7” (section 11.4).", "பாடியவர் : மையோடக் கோவனார். பண் அமைத்தவர் : பித்தாமத்தர் வையைப் புனலின் வருகை : திரை இரும் பனிப் பௌவம் செவ்விதா அற முகந்து, உர உரும் உடன்று ஆர்ப்ப, ஊர் பொறை கொள்ளாது, கரை உடை குளமெனக் கழன்று, வான் வயிறு அழிபு, வரை வரை தொடுத்த வயங்கு வெள் அருவி? இரவு இருள் பகலாக, ;இடம் அரிது செலவு என்னாது, 5 வலன் இரங்கு முரசின் தென்னவர் உள்ளிய நிலன் உற நிமிர் தானை நெடு நிரை நிவப்பு அன்ன, பெயலான் பொலிந்து பெரும் புனல் பல நந்த, நலன் நந்த நாடு அணி நந்தப் புலன் நந்த வந்தன்று வையைப் புனல். 10 புனலின் செயல் : நளி இருஞ் சோலை நரந்தம் தாஅய், ஒளிர் சினை வேங்கை விரிந்த இணர் உதிரலொடு துளியின் உழந்த தோய்வு அருஞ் சிமைதொறும் வளி வாங்கு சினைய மா மரம் வேர் கீண்டு. உய்ர்ந்துழி உள்ளன் பயனம்பிடைப் பரப்பி; 15 உழவர் களி தூங்க முழவு பணை முரல, ஆடல் அறியா அரிவை போலவும், ஊடல் அறியா உவகையள் போலவும் வேண்டுவழி நடந்து தாங்கு தடை பொருது; விதி ஆற்றான் ஆக்கிய மெய்க் கலவை போலப் 20 வெள்ளப் பெருக்கைக் கண்ட மக்களின் செயல் : பொது நாற்றம் உள்உள் கரந்து புது நாற்றம் செய்கின்றே செம்பூம் புனல். “கவிழ்ந்த புனலின் கயம் தண் கழுநீர் அவிழ்ந்த மலர் மீது உற்றென” ஒரு சார்; “மாதர் மடநல்லார் மணலின் எழுதிய 25 பாவை சிதைத்தது என அழ” ஒரு சார்; “அகவயல் இள நெல் அரிகால் சூடு தொகு புனல் பரந்தெனத் துடி பட” ஒரு சார்; ஓதம் சுற்றியது ஊர்” என ஒரு சார்; 30 “கார் தூம்பு அற்றது வான்” என ஒரு சார்; “பாடுவார் பாக்கம் கொண்டென”, “ஆடுவார் சேரி அடைந்தென”, “கழனி வந்து கால் கோத்தென”, “பழன வாளை பாளை உண்டென”, “வித்து இடு புலம் மேடு ஆயிற்றென”, 35 உணர்த்த உணரா ஒள்ளிழை மாதரைப் புணர்த்திய இச்சத்துப் பெருக்கத்தின் துனைந்து, சினை வளர் வாளையின் கிளையொடு கெழீஇ பழன உழவர் பாய் புனல் பரத்தந்து. வையைப் புனலின் வனப்பு : இறு வரை புரையுமாறு இரு கரை ஏமத்து, 40 வரை புரை உருவின் நுரை பல சுமந்து, பூ வேய்ந்து, பொழில் பரந்து, துனைந்து ஆடுவார் ஆய் கோதையர்; அல் தண் தாரவர், காதில் தளிர் செரீஇ கண்ணி பறித்து; 45 கை வளை, ஆழி, தொய்யகம், புனை துகில், மேகலை, காஞ்சி, வாகுவலயம், எல்லம் கவரும் இயல்பிற்றாய்; தென்னவன் ஒன்னார் உடை புலம் புக்கற்றால் மாறு அட்ட தானையான் வையை வனப்பு 50 புரிந்த தகையினான் யாறு ஆடுவாருள் துரந்து புனல் தூவ, தூ மலர்க் கண்கள் அமைந்தன் ஆங்கண் அவருள் ஒருத்தி, கை புதை இயவளை ஏக்கழுத்து நாணான் கரும்பின் அணை மென்தோள் 55 போக்கிச் சிறைப் பிடித்தாள்; ஓர் பொன் அம் கொம்பு பரிந்து அவளைக் கைப் பிணை நீக்குவான் பாய்வாள்; இரும்பு ஈர் வடி ஒத்து மை விளங்கும் கண் ஒளியால் செம்மைப் புதுப் புனல் சென்று இருளாயிற்றே; வையைப் பெருக்கு வடிவு. 60 விரும்பிய ஈரணி மெய் ஈரம் தீர, சுரும்பு ஆர்ககு ; ம் சூர் நறா ஏந்தினாள் கண் நெய்தல்; பேர் மகிழ் செய்யும் பெரு நறாப் பேணியவே கூர் நறா ஆர்ந்தவள் கண், கண் இயல் கண்டு ஏத்தி காரிகை நீர் நோக்கினைப் 65 பாண் ஆதரித்துப் பல பாட, அப் பாட்டுப் பேணாது ஒருத்தி பேதுற, ஆயிடை என்னை வருவது எனக்கு என்று இனையா, நன் ஞெமர் மார்பன் நடுக்குற நண்ணி, சிகை கிடந்த ஊடலின் செங் கண் சேப்பு ஊர, 70 வகை தொடர்ந்த ஆடலுள் நல்லவர் தம்முள் பகை தொடர்ந்து கோதை பரியூஉ, நனி வெகுண்டு, யாறு ஆடு மேனி அணி கண்ட தன் அன்பன் சேறு ஆடு மேனி திருநிலத்து உய்ப்ப, சிரம் மிதித்து, தீர்வு இலதாகச் செருவுற்றாள், செம் புனல், 75 ஊருடன் ஆடுங்கடை புரி நரம்பு இன் கொளைப் புகல் பாலை ஏழும் எழுப் புணர் யாழும், இசையும் கூட, குழல் அளந்து நிற்ப, முழவு எழுந்து ஆர்ப்ப, மன் மகளிர், சென்னியர், ஆடல் தொடங்க, 80 பொருது இழிவார் புனல் பொற்பு, அஃது உரும் இடி சேர்ந்த முழக்கம் புரையும் திருமருதமுன்துறை சேர் புனற்கண் துய்ப்பார் தாமம் தலைபுனை பேஎம் நீர் வையை நின் பயம் பாடி விடிவுற்று ஏமாக்க, நின் படிந்து நீங்காமை இன்று புணர்ந்தெனவே. 86 விளக்கவுரை : (1-10) : மேகங்கள், அலைகளையம் குளிர்ச்சியையும் உடைய கரிய கடல் வற்றுமாறு நன்கு நீரை மொண்டு வன்மையுடைய இடியானதது ஆரவாரம் செய்ய, தம் மீது ஏறி யபாரம் தாங் கமாட்டாமல் தம் வயிறு கிழிந்ததால் கரை உடையும் குளம் போல சைய மலையின் சிகரங்கள் தோறும் தொடுக்கப்பட்டு விளங்கும் அருவி நீர், அது மழையால் பொலிவு அடைந்த மற்ற நீருடன் கூடி வையை ஆற்றில் நீர் பெருகி வெள்ளமாக உயிரகளுக்கு எல்லாம் மிகுமாறும் மருதநிலைதம் அழகுறுமாறும், குறிஞ்சி முதலிய வன்புலங்கள் வளம் பெருகுமாநும் ஓடி வந்தது. மன்னர்வெற்றி கொள்ள எண்ணி நாட்டை அடைதற்கு நிமிர்நது போகும் பாண்டியரின் படையது பெரிய அணியின் எழுச்சி போல் அவ்வாறு செல்கின்றது. அது யான் போகும் இடம் அடைவதற்கு அரியது என எண்ணுவதில்லை. இரவு பகல் என்று கருதாமலும் அஃது ஓடி வந்தது. (11-15) : அந்த ஆற்று வெள்ளம் கருமையான சோலைகளில் உள்ள நரந்தம் புற்களின் மேலே பரவியது. விளங்கம் கிளைகளையுடைய வேங்கை மரத்தின் மலர்ந்த பூங்கொத்தினின்றும் உதிர்ந்த மலர்களுடன் கூடி மழையில் அலைக்கப்பட்ட அடைவதற்கு அரிய மலையுச்சிகள் தொhறும் உள்ளனவாய்க் காற்றால் வளைக்கப்பட்டு முறிந்த கொம்புகளை உடைய பெருமரங்களை வேருடன் அகழ்ந்து தள்ளி உருட்டிக் கொண்டு வந்து, குறிஞ்சி நிலத்திலும் முல்லை நிலத்திலும் உள்ள பொருள்களை வாரிக்கொண்டு வந்து மருத நிலத்திலும் நெய்தல் நிலத்திலும் பரப்பியது. (16-22) : உழவுத் தொழில் செய்பவர் மகிழ்சச ; p அடைய, முழவுகளும் பெரும்பறைகளும் ஒலிக்க, கூத்தின் இயல்பை அறியாத ஆடல் மகள் தாறுமாறாக நடப்பது போலவும், இடம் அறிந்து ஊடல் கொண்டு இனிதின் உணர்வதான ஊடல் இயல்பை அறியாத உவகையள் செருக்காக நடப்பது போலவும் தான் வேண்டிய இம் எல்லாம் சென்றது, தடை செய்கின்ற அணையை உடைத்துக் கொண்டு போனது. நூல் விதிப்படி செய்யப்பட்ட உடம்பில் பூசுவதற்கான கலiவின் நறுமணம் போல் நறுமணப்பொருள்கள் பலவற்றைக் கூடியதால் பொதுவாய் மணக்கும் மணத்தை உள்ளே வைத்துக் கொண்டு அந்தச் செம்மை நிறம் உடைய வெள்ள நீர் தன் மீது புதிய நறுமணத்தைப் பெற்றது. (23-30) : ஒரு பக்கத்தில் குளம் வெள்ள நீர் பாய்ந்து புகுந்த நீரால்பெருகிச்செங்கழுநீரின் மலர்ந்த மலர்கள் முழுகி விடும்படி பெருகி வந்தது என்று சிலர் கூறினர். ஒரு பக்கத்தில இளைய பெண்கள் தாம் மணல் மீது செய்த பாவையை நீர் அழித்து விடடது என்று கூறி அழுதனர். ஒரு பக்கத்தில வயலில் விளைந்து முற்றிய இள நெல்மீதும் அரிந்து குவித்து வைத்த குவியல் மீதும், வெள்ளம் பெருகிப் பாய்ந்தது என்று அவற்ளைப் பாதுகாக்கும் பொருட்டு துடிகள் முழக்கினர். ஒரு பக்கத்தில் கடலே பெருகி வந்து ஊரை வளைந்து கொண்டது என்று மக்கள் ஆரவாரம் செய்தனர். ஒரு பக்கத்தில் மேகம் துளிப்பதற்குரிய சிறிய துளைகள் உடைந்து பெரிய ஓட்டை ஆயிற்றோ! என்று சிலர் கூறினர். இவ்வாறு நிகழ, (31-39) : ஒரு பக்கத்தில் பாணர்கள் குடியிருந்த பாக்கத்தை வெள்ளம் கவர்ந்து கொண்டது எனக் கூக்குரல்எழுந்தது. ஒரு பக்கத்தில் கூத்தர் குடியிருந்த சேரியை வெள்ள நீர் வளைந்து கொண்டது என்று ஒரு பக்கத்தில் ஆரவாரம் எழுந்தது. ஒரு பக்கத்தில் வெள்ளநீர் கமுகு தென்னை ஆகியவற்றின் கழுத்தை முட்டப் பெருகியது அதனால் வயல்களில் வாழும் வாளைமீன் அவற்றின் பாளையைத் தின்னுகின்றன என்ற வியந்த உரைத்தனர். ஒரு பக்கத்தில் உழவர் எம் நாற்ற்ங்கால் வெள்ளத்தால் வண்டலிடப்பட்டு மேடாயிற்றே! என்று வருந்தினர். ஊடலைத் தாம் நீக்க முயல நீஙாத மகளிரைக் கூட்டுவித்தற்கு முயலும் கணவரின் ஆசை வெள்ளத்தைப் போல், பெருகி விரைந்த பாய்ந்த நீரில், வயல் தொழிலையுடைய வேளாளர், கரு முதிர்ச்சி அடைந்த வாளை மீனைப் போல், விலாப் பருக்கவுண்டு தம் சுற்றத்தாரோடும் கூடித் தம் தொழிலைச் செய்யும் பொருட்டுப் பரவிச் சென்றனர். (40-50) : நீரால் மாதுண்டு அடிப்பக்கம் இடிந்த மலைகளைப் போல் விளங்குவன இருகரைகள். வெள்ளிப பனிமலையின் சிகரங்களைப் போன்ற வடிவம் கொண்டு நுரை பலவற்றையம் சுமந்து கொண்ட வெள்ளம் ஓடியது. மலரால் மூடப்பட்டுச் சோலைகளின் இடையே பரவி ஓடியது. ஓடிய வெள்ளநீரானது தன்னிடத்தில் ஆராய்ந்து தொடுத்த மாலையை உடைய மகளிரின் காதுகளில் தளிரைச் செருகியது. மலர்ந்த குளிர்ந்த மாலை அணிந்த ஆடவரின் தலையில் சூடிய மாலைகளைப் பறித்தது. மங்கையரின் கையில் அணிந்த வளையல்களும் தலையில் அணிந்த தலைப்பாளை என்னும் அணியும் உடுத்த ஆடையும் அந்த ஆடையின் உள்ளே அணியப்படும் மேகலை என்ற அணிகலனும் ஆடையின் வெளியே அணியப்படும் காஞ்சி என்னும் அணிகலனும் மைந்தர் உடுத்த ஆமைடயும் அணிந்த மோதிரங்களும் தோள் வலயங்களும் ஆகியவற்றைக் கவர்ந்து கொண்ட தன்மை உடையதாய் விளங்கியது. பகைவரைக் கொன்ற படையை உடைய பாண்டி மன்னனின் வையை ஆற்றில் வந்த புதிய வெள்ளத்தின் இயல்பு, பாண்டிய மன்னன் பகைவரின் தோற்றத்திற்குரிய நிலத்தில் புகுந்த இயல்பைப் போல் விளங்கியது. (51-60) : மகளிர் சிலர் யாவராலும் விரும்பப்படும் அழகை உடைய பாண்டிய மன்னனின் வையை ஆற்றில் நீராடினர். அம்மகளிருள் சிலர் நீரைத் தூவும் துருத்தி, சிவிறி கொண்டு மற்றவர் மேல் நீரைப் பாய்ச்சினர், மற்றப் பெண்கள் தூய மலர் போன்ற கண்கள் எல்லாம் அந்த நீரைர ஏற்று இமைக்காமல் விளங்கினர். அப்போது அவ்விளையாட்டில் தோற்றுத் தன் கண்களைப் புதைத்தாள் ஒருத்தி. அவ்வாறு கண் புதைத்தவள் வெற்றியால் களித்துத் தன் கழுத்தில் அணிந்த பொன் நாணால் தொய்யில் கரும்பு எழுதப்பட்ட அணை போன்ற மென்மையான தோள்களைக் கட்டிச் சிறைப் பிடித்தாள். கட்டிப்பிடித்தாள். அதைப் பார்த்தாள். பொற்கொடி போன்ற ஒருத்தி, அப்படி அங்குச் சிறைப்பட்டவளுக்கு இரக்கம் கொண்டு அவளைக் கையால் கட்டினின்றம் விலக்கும் பொருட்டுப் பாய்ந்தாள். அப்படிப் பாய்ந்தவளது மாவடுவைப் போன்று மையால் அழுகுபெற்று விளங்கும் கண் பாய்ந்து வருத்துதலால் புதிய அந்நீரின் சிவந்த நிறம் போய் நீல நிறமாக ஆயிற்று. வையை ஆற்றின் புது நீர் வெள்ளத்தின் அழகு இத்தகைய இயல்பு உடையது. (61-64) : இவ்வாறு விரும்பிய நீராடலுக்கு ஏற்ற ஈர அணியை உடைய உடல் ஈரம் நீங்கி உலர்ந்து வெப்பம் உடையதாகும் பொருட்டு. தலைவி வண்டுகள் மொய்ந்து ஆரவாரித்தற்குக் காரணமான கடுப்புடைய கள்ளைக் குடிப்பதற்குக் கையில் எடுத்தாள். அவள் அப்படி எடுத்த போது அவளுடைய கண் நெய்தல் மலரைப் போன்று கறுத்து விளங்கின. மிக்க களிப்பை உடைய கள்ளை அருந்திய பின்பு அவளுடைய கண்கள் சிவந்தன. அவை பார்ப்பவர்க்கு மகிழ்சச ; pயை ஊட்டும் பெரிய நறவ மலரைப் போல் விளங்கின. (65-69) : அவ்வாறு சிவந்த கண்ணின் அழகைக் கண்டு பாராட்டி அந்தக் கண்களின் அழகிய தன்மையை உடைய நோக்கங்களை இசைப்பாட்டில் அமைத்துப்பாட விரும்பித் தலைவன் பற்பல பாடல்களையும் பாட, அப்பாடல்களைக் கேட்ட ஒருத்தி அப்பாடல்கள் பாடுபவன் தன் காதலியைப்பாடும் பாடல்கள் என்பதை அறியாமல் தன்னை விரும்பிப் பாடுகின்ற பாடல் என்று எண்ணி அவனைச் சேரும் கருத்தால் துன்பம் அடைந்தாள். அடைய, அவளது எண்ணத்தை உணர்ந்த விரிந்த மார்பையுடைய தலைவன். இந்நிகழ்வைத் தலைவி அறிந்தாளாயின் எனக்கு எவ்வகைப்பட்ட துன்பம் வருமோ அறியேன் என மனம்வருந்தினர்ன். அவ்விடத்தினின்று அகன்று தலைவியை நெருங்கி அச்சத்தால் உடல் நடுங்கி நின்றான். அங்ஙனம் நிற்ப. (70-76) : முன்னமே குறை பொருந்திளய ஊடல் காரணமாகச் சிவந்துள்ள கண்கள் இந்நிகழ்வால் பெரிதும் சிவக்க, வகுப்புப் பொருந்திய அந்நீராட்டில் வந்த மகளிருள்முன்பு பாடல் போற்றாது துன்பம் கொண்ட அவளுடன் தலைவி பகை கொண்டாள். மிகவும் சினந்து தன் மாலையினை அறுத்து எறிந்தாள். அச்சமயத்தில் நீராட்டினால் பொலிவுள்ள தலையின் மேனியது அழகைக் கூர்ந்து நோக்கி நின்ற அவளுடைய காதலன் அவ்வாறு சினந்த தலைவிக்கு அஞ்சினான். சந்தனம் பூசப்பட்ட தனது மேனியை அழகிய நிலத்தில் கிடத்தி வணங்கினான். அதனாலும் அவளது சினம் தீரவில்லை. அத்தலைவனின் தலையில் உதைத்தாள். ஊடல் கொண்டாள். இவ்வாறு ஊரவருடன் கூடி நீராடல் நிகழ்;ந்தது. அப்போது. (77-86) : விருப்புக்குரிய பாலைப்பண் ஏழினையும் புணர்த்தற்கரிய முறுக்குண்ட நரம்பில் இனியதான அறுதியைத் தரும் யாழ் இசையும் மிடற்றுப்பாடலும் தமக்குள் பொருந்த அவற்றின் சுதியை வங்கியம் அளந்து நின்றது. முழவு ஓசை எழுந்த முழங்கியது. அரசனால் தலைக்கோல் என்ற பட்டத்தைப் பெற்ற மகளிரும் பாணரும் கூத்தாடத் தொடங்கினர். இவற்றால் முழக்கம் மிக்கது. அதனுடன் ஓடும் நீர் கரைகளை இடித்து ஒழுகுதலால் எழுந்த ஒலியும் சேர்ந்து ஆரவாரித்தது, அத்தன்மை உரும் ஏறாகிய இடியுடன் சேர்ந்த முகில் முழக்கத்தைப் போல் விள்ங்கியது. இத்தகைய திரு மருத முன்துறை என்ற பெயர் உடைய துறையை அடைந்து ஆடி இன்பம் அடைபவர் மலர் மாலைகளை வாங்கி, நின் தலையிடத்தே சூட்டி மகிழ்வதற்குக் காரணமான அச்சம் தரும் ஆழமான நீரையுடைய வையை ஆறே! யாம் இன்று நின்னிடம் நீராடி நீங்காத இவ்வின்பத்தை, அடைந்தாற்போல் என்றும் நின்னிடம் நீராடி நின்னால் பெறும் இன்பத்தைப் பாடி விடிவு எய்தி மகிழ்சச ; p அடைவோமாக!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 11, section 11.4, p.204", "", "hard", "false"], ["SANG-11-5", "Sangam literature", "சங்க இலக்கியம் – பரிபாடல் – வையைப் பாடல்கள்: “பாடல் : 10” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – பரிபாடல் – வையைப் பாடல்கள்: Explain the poem/passage titled “பாடல் : 10” (section 11.5).", "பாடியவர் : கரும்பிள்ளை பூதனார் பண் அமைத்தவர் : மருதன் நல்லச்சுதனார் மலைவரை மாலை அழி பெயல் காலை, செல வரை காணாக் கடல்தலைக் கூட நில வரை அல்லல் நிழத்த, விரிந்த பலவுறு போர்வைப் பரு மணல் மூஉய், வரி அரி யாணு முகிழ் விரி சினைய 5 மாந்தீம் தளிரொடு வாழையிலை மயக்கி, ஆய்ந்து அளவா ஓசை அறையூ, உப்பறை அறையப் போந்தது வையைப் புனல். புனல் மண்டி ஆடல் புரிவான், சனம் மண்டி, தாளித நொய்ந் நூல் சரணத்தர், மேகலை 10 ஏணிப்படுகால் இறுகிறுகத் தாள் இடீஇ, நெய்த்தோர் நிற அரக்கின் நீரொக்கி யாவையும் முத்து நீர்ச் சாந்து அடைந்த மூஉய்த் தத்தி, புக அரும் பொங்கு உளைப் புள் இயல் மாவும், மிக வரினும் மீது இனிய வேழப் பிணவும். 15 அகவு அரும் பாண்டியும், அத்திரியும், ஆய் மாச் சகடமும், தண்டு ஆர் சிவிகையும் பண்ணி; வகை வகை ஊழ் ஊழ் கதழ்பு மூழ்த்து ஏறி; முதியர், இளையர், முகைப் பருவத்தர், வதி மண வம்பு அலர் அவிழ்ந்தன்னார். 20 இரு திற மாந்தரும் இன்னினியோரும், விரவு நரையோரும் வெறு நரையோரும், பதிவத மாதர், பரத்தையர், பாங்கர், அதிர் குரல் வித்தகர் ஆக்கிய தாள விதி கூட்டிய இய மென்னடை போல, 25 பதி எதிர் சென்று, பரூஉக் கரை நண்ணி; நீர் அணி காண்போர்; நிரை மாடம் ஊர்குவோர்; பேர் அணி நிற்போர்; பெரும் பூசல் தாக்குவோர்; மா மலி ஊர்வோர்; வயப் பிடி உந்துவோர்; வீ மலி கான் யாற்றின் துருத்தி குறுகி, 30 தாம் வீழ்வார் ஆகம் தழுவுவோர்; தழுவு எதிராது யாமக் குறை ஊடல் இன் நசைத் தேன் நுகர்வோர்; காமக் கணிச்சியால் கையறவு வட்டித்து. சேமத் திரை வீழ்த்து சென்று அமளி சேர்குவோர்; தாம் வேண்டு காதற் கணவர் எதிர்ப்பட, 35 பூ மேம்பாடு உற்ற புனை சுரும்பின். சேம மட நடைப் பாட்டியர்த் தப்பி, தடை இறந்து, தாம் வேண்டும் பட்டினம் எய்திக் கரை சேரும் ஏமுறு நாவாய் வரவு எதிர்கொள்வார் போல், யாம் வேண்டும் வையைப் புனல் எதிர்கொள் கூடல். 40 களிறு பிடியின் அன்பு : ஆங்க அணி நிலை மாடத்து அணி நின்ற பாங்கு ஆம் மடப்பிடி கண்டு. வயக் கரி மால் உற்று, நடத்த நடவாது நிற்ப் மடப் பிடி அன்னம் அனையாரோடு ஆயா நடை, கரி மேல் ஷ செல் மனம் மால் உறுப்ப, சென்று எழில் மாடத்துக் 45 கை புனை கிளர் வேங்கை காணிய வெருவுற்று, மை புரை மடப் பிடி, மட நல்லார் விதிர்ப்புற, செய் தொழில் கொள்ளாது மதி செத்துச் சிதைதர கூம் கை மத மாக் கொடுந் தோட்டி கைந்நீவி நீங்கும் பதத்தால், உருமுப் பெயர்த்தந்து 50 வாங்கி முயங்கி வயப் பிடி கால் கோத்து, சிறந்தார் நடுக்கம் சிறந்தார் களையல் இதையும் கயிறும் பிணையும் இரியச் சிதையும் கலத்தைப் பயினான் திருத்தும் திசை அறி நீகானும்போன்ம். 55 மகளிர் மைந்தர் இவர்கள் செயல் : பருக் கோட்டு யாழ்ப் பக்கம் பாடலொடு ஆடல் அருப்பம் அழிப்ப, அழிந்த மனக் கோட்டையர், ஒன்றோடு இரண்டா முன் தேறார், வென்றியின், பல் சனம் நாணிப் பதை பதைப்பு, மன்னவர் தண்டம் இரண்டும் தலைஇத் தாக்கி நின்றவை; 60 ஒன்றியும் உடம்பாடு ஒலி எழுதற்கு அஞ்சி, நின்ற நிகழ்சச ; pயும் போன்ம், காமம் கனைந்து எழ, கண்ணின் களி எழ, ஊர் மன்னும் அஞ்சி ஒளிப்பார் அவர் நிலை கள்ளின் களி எழக் காத்தாங்கு, அலர் அஞ்சி, 65 உள்ளம் உளை எழ, ஊக்கத்தான் உள் உள் பரப்பி மதர் நடுக்கிப் பார் அல் தூற்றக் கரப்பார், களி மதரும் போன்ம். கள்ளொடு காமம் கலந்து, கரை வாங்கும் வெள்ளம் தரும் இப்புனல். 70 மகளிரது நீர் விளையாட்டு : புனல் பொருது மெலிந்தார் திமில் விட, கனல் பொருத அகிலின் ஆவி காஎழ, நகில் முகடு மெழுகிய அளறு மடை திறந்து திகை முழுது கமழ, முகில் அகடு கழி மதியின் உறை கழி வள்ளத்து உறு நறவு வாக்குநர் 75 அரவு செறி உவவு மதியென அங்கையில் தாங்கி, மகர வலயம் அணி திகழ் நுதலியர், மதி உண் அரமகளென, ஆம்பல் வாய் மடுப்ப, மீப்பால் வெண்துகில் போர்க்குநர்; பூப்பால் வெண்துகில் சூழ்ப்பக் குழல் முறுக்குநர்; 80 செங்குங்குமச் செழுஞ் சேறு, பங்கம் செய் அகில் பல பளிதம், மறுகுபட அறை புரை அறு குழவியின் அவி அமர் அழலென அரைக்குநர்; நத்தொடு, நள்ளி, நடை இறவு, வய வாளை 85 வித்தி அலையில் “விளைக! பொலிக!” என்பார்; இல்லது நோக்கி, இளிவரவு கூறாமுன், நல்லது வெஃகி, வினை செய்வார்; மண் ஆர் மணியின் வணர் குரல் வண்டு ஆர்ப்ப, தண் அம் துவர் பல ஊட்டிச் சலம் குடைவார்; 90 எண்ணெய் கழல இழை துகள் பிசைவார்; மாலையும் சாந்தும் மதமும் இழைகளும், கோலம் கொள நீர்ககு ; க் கூட்டுவார்; அப் புனல் உண்ணா நறவினை ஊட்டுவார்; ஒண்தொடியார் வண்ணம் தெளிர, முகமும் வளர் முலைக் 95 கண்ணுங் கழியச் சிவந்தன வண்ண வகை; ஆட்டு அயர்ந்து, அரி படும் ஐ விரை மாண் பகழி அரம் தின் வாய் போன்ம் போன்ம் போன்ம், பின்னும் மலர்க் கண் புனல். புனல் விளையாட்டால் மெலியாத மைந்தர் : தண்டித் தண்டின் தாய்ச் செல்வாரும், 100 கண்டல் தண் தாது திரை நுரை தூவாரும், வெய்ய திமிலின் விரை புனலொடு ஒய்வாரும், மெய்யது உழவின் எதிர் புனல் மாறு ஆடிப் பைய விளையாடுவாரும், மென் பாவையர் செய்த பூஞ் சிற்றடிசில் இட்டு உண்ண ஏற்பார். 105 இடுவார் மறுப்பார் சிறுகு இடையார் பந்தும் கழங்கும் பல களவு கொண்டு ஓடி, அம் தண் கரை நின்று பாய் வாராய் மைந்தர் ஒளிறு இலங்கு எஃகொடு வாள் மாறு உழக்கி, களிறு போர் உற்ற களம் போல, நாளும் 110 தெளிவு இன்று தீம் நீர்ப் புனல். புனலாடி மீண்டவாறு : மதி மாலை மால் இருள் கால் சீப்ப, கூடல் வதி மாலை, மாறும் தொழிலான், புது மாலை நாள் அணி, நீக்கி, நகை மாலைப் பூ வேய்ந்து தோடு அணி, தோடு சுடர் இழை, நித்திலம்: 115 பாடுவார் பாடல். பரவல், பழிச்சுதல், ஆடுவார் ஆடல் அமர்ந்த சீரப் பாணி, நல்ல கமழ் தேன் அளி வழக்கம், எல்லாமும், பண் தொடர் வண்டு பரிய எதிர் வந்து ஊத, கொண்டிய வண்டு கதுப்பின் குரல் ஊத, 120 தென் திசை நோக்கித் திரிதர்வாய்; மண்டு கால் சார்வா, நளிர் மலைப் பூங்கொடித் தங்குபு உகக்கும் பனி வளர் ஆவியும் போன்ம் மணி மாடத்து உள் நின்று தூய பனி நீருடன் கலந்து, கால் திரிய ஆர்க்கும் புகை. 125 வையையை வாழ்த்துதல் : இலம்படு புலவர் ஏற்ற கை ஞெமரப் பொலம் சொரி வழுதியின், புனல் இறை பரப்பி, செய்யில் பொலம் பரப்பும் செய் வினை ஓயற்க, வருந்தாது, வரும் புனல் விருந்து அயர் கூடல், அருங் கறை அறை இசை வயிரியர், உரிமை ஒருங்கு அமர் ஆயமொடு ஏத்தினர் தொழவே. 131 தெளிவுரை : (1-8) : மாலைப் போதில் மலையில் பெய்த மழையால் மறுநாள் காலையில் வையை ஆற்றிலே நீர் பெருகியது. பெருகிய அந்நீர் நில எல்லைக்குள், பசி முதலிய துன்பங்கள் குறைய, மலர்ந்த பல்வேறு மலர்கள் நெருங்கிய போர்வையுடன், ஆற்றில் முன் பண்டு நீர் இல்லாமையால் வறண்டு கிடந்த பெரிய மணற் பரப்பை மூடிக்கொண்டு, வரிகளையுடைய வண்டுகள்மொய்கக ; ப்டடு ; , அழகிய அரும்புகள் மலர்ந்த மாமரத்pன் காண்பதற்கு இனிய தளிருடன் வாழையின் இலைகளையும் மயக்கி, அளவிட இயலாத பல்வேறு ஓசைகள் ஒலிக்கவும். கரைக் காவலரை அழைக்கும் பறைகள் முழக்கும் படியும் போய் எல்லையற்ற கடலை அடைவதற்கு வந்தது. (9-18) : அங்ஙனம் வரும் புதிய நீரில் மக்கள் புகுந்து ஆடதற்குச் செல்லலாயினர். நீராடை உடுத்த சரணத்தை உடையவராய் ஆயினர். மேகலையிhன ஏணிப்படி காலை மிக இறுக்கமாகத் தாளிட்டுக் கொண்டனர். குருதியைப் பொன்ற செல்வரக்கின் நீரை வீசும் கருவிகள் மதலிய பலவற்றயும் கைக்கொண்டனர். முத்தைப் போன்ற நிறத்தை உடைய பனி நீருடன் கூடிய சந்தனத்துடனே பெட்டியில்ல மூடி எடுத்தனர். தாவுதலால் மேற்கொள்வதற்குரிய மிக்க பிடரி மயிரையும் உடைய பறவை பொன்று விரையும் செலவையும் உடைய குதிரையையம், மிக விரைவாக நடந்தாலும் மேல் அமர்ந்திருக்க இனிதாக விளங்கும் பெண் யானைனையும், பெயர் சொலலி அழைக்கப்படுகின்ற அரிய எருதைப் பூண்ட வண்டியையும் கோவேறு கழுதையையும், ஆராய்ந்து பூட்டப்பட்ட குதிரை வண்டியையும், சுமத்தற்குத் தண்டு பொருந்திய பல்லக்கையும் அழகுபடுத்தினர். முறைமுறையாய் வந்து கூடி விரைந்து அவற்றின் மீது அமர்ந்தனர். (19-26) : மலரும் பருவத்தையுடைய மொட்டைப் போன்ற இயல்பு உடையவரும். நறுமணம் தங்குதற்க இடமான புதிய மல் வாய் விரிந்தாற் போன்ற பருவம் உடையவரும் ஆகிய இளைய மகளிரும், நரை கலந்து விளங்கும் வயதினரும், முழுவதும் நரைத்த முதுமை மகளிரும் என்ஃனம் கற்புடை மகளிரும் பரத்தையரும் ஆகிய முப்பருவத்து மகளிரும், இவர்ககு ; த் தோழியரான சிலரும், இசைப் புலமையில் வல்ல புலவரால் ஆக்கப்பட்ட தாள விதியால் கூட்டப்பட்ட ஒலிக்கும் குரலையுடைய பல்வேறுஇசை;ககருவிகளின் இசையும் மெல்லிய நடையில் சென்றாற் போல் ஊரிலே வாழும் பிற மக்களுடன் கூடி ஆற்றின் எதிரே மெல்லப் போய்ப் பெரிய கடையை அடைந்தனர். (27-34) : அங்ஙனம் வந்தவருள் சிலர் அந்த வையை ஆற்றில் பெருகி ஓடி வரும் புதுநீரின் அழகை; கண்டு நின்றனர். சிலர் வரிசையில் உள்ள நீரணி மாடம் என்னும் ஓடங்களில் ஏறி அவறறைச் செலுத்தினர். சிலர் நீரில் ஆடவருடன் செய்யும் போருக்கு அணிவகுத்து நின்றனர். சில்ர் அப்பெரிய நீராடல் போரில் தூசிப்படையாய்ச் சென்று தாக்கினர். சில்ர் குதிரைகளில் ஏறி அவற்றை நீருள் செலுத்தினர். சிலர் வலிய பெண் யானைகளின மீது ஏறி அவற்றை நீருள் செலுத்தினர். சிலர் குதிரைக் கூட்டத்தில் ஏறி அவற்றை நீரள் செலுத்தினர். மற்றும் சிலர் நறுமணப் பூக்கள் மிகுந்த ஆற்றிடைக் குறையை அடைந்து அங்குத் தம்மால் விரும்பப் பட்ட தம் தலைவர் தம் உடலைத் தழுவ அதனை ஏற்றுக் கொள்ளாது. முதல் நாள் இரவில் ஊடல் கொண்டிட, அந்த ஊடல் குறையாக நின்றதால் அதையே தொடர்ந்து ஊடி, அதனால் விளையும் இனிய விருப்பமான தேனதை; துய்த்தனர். மற்றும் சிலர் தாங்கள் ஊடியிருந்தும் காமம் என்ற கோடரி தம் நிறை என்னும் கதவை உடைத்ததால் மேலும் ஊடல் கொள்வதற்கு வன்மை அற்றவராய்த ம் ஊடலை அகற்றி விட்டுத் தங்கள் கணவரை எதிர் கொண்டு காவலாகிய திரையை இறக்கி விட்டு உட்சென்று அங்குப்படுக்கையில் கிடந்தனர். (35-40) : சூடுதற்குரிய மலரின் மேம்பாட்டை, விரும்பி அதில் வந்து பொருந்தும் வண்டினைப் போல், முகைப்பருவத்துப் பெண்கள் எல்லாம் தாம் விரும்பும் காதலையுடைய கணவர் தம்மை விரும்பி வந்து எதிர் சென்று புணரும் பொருட்டுத் தமக்குக் காவலாக இருந்த பாட்டியரிடமிருந்து தப்பி, அவர் தடுப்பதையும் கடந்து மீறிச் சென்றனர். தம்மால் விரும்பப்பட்ட துறைமுகப்பட்டினத்தை அடைந்து அங்கிருந்து மீண்டும் கரையை அடையும் தாம் இன்பம் அடைவதற்குக் காரணமான மரக்கல வருகையை விரும்பி எதிர்கொள்ளும வணிகரைப் போன்று, அம்மகளிர் வையை ஆற்றினது நீரை எதிர் கொள்வதற்கு இடமானது மதுரை. அதில். (41-48) : அழகிய நிலைகளையுடைய மாடம். அதன் அண்மையில் நின்ற ஒரு வலிய ஆண் யானை, அத தனக்குப் பக்கத்தே உள்ள இளமை உடைய பெண் யானையைக் கண்டு காமத்தால் மயக்கம் அடைந்தது. அது தன் மீது இருந்த பாகன் செலுத்தவும் செல்லாது நின்றது. நிற்ப, அந்த இளமையுடைய பெண் யானையும் அந்த ஆண் யானை மீது சென்ற தன் மனம் மயங்கி நின்றது. தன் மீது இருந்த அன்னப்பறவையை ஒத்த மகளுடன் தன் நடை சுருங்கி அந்த யானை நின்ற இடத்தில் போய் அங்குள்ள அழகிய புலி மாடத்தில் பண்ணி வைத்த பாயும் நிலையில் உள்ள வேங்கையின் வடிவத்தைக் கண்டது. அவ்வளவில் அதனை உண்மையான வேங்கை என்றும் அப்பலி தன் காதல் யானை மீது பாயும் என்றும் எண்ணி மேகத்தைப் போன்ற அந்த பெண் யானை, தன் மீது அமர்ந்திருந்த மடப்பம் உடைய மகளிர் நடுங்கும்படி பாகர் செய்யும் தொழிலை ஏற்றுக் கொள்ளாமல் கட்டுக்கடங்காமல் நின்றது. (49-55) : அவ்வாறு பெண் யானை சிதைந்து நின்றமை பொறக்காமல் பிளிறுகின்ற மதக் களிப்பையடைய அந்த ஆண் யானை, வளைந்த அங்குசத்துக்கு அடங்காமல் போய்ச் சிதையம் அளவில, தன் மீது இருந்த பாகுத் தொழில் வல்ல பாகர். இடி போன்ற அதன் முழக்கம் ஒழியும்படி அதைப் புலி மாடத்தினின்று நீக்கி. அந்தப் பெண் யானை சிதையாதபடி அதைத அணைவித்து அப்பிடியின் மெல் இருந்த மங்கையரின் நடுக்கத்தைக் களைதல், பாயும் கயிறும் மரக்கூட்டமும் கெட்டொழியக் காற்றால் அலைப்புண்டு ஓடும்படியான நாவாயைப் பாயினால் சீரிதிருத்தி அதன் உள்ளே இருப்பவர் நடுக்கத்தைப் போக்கும் திக்கினை அறிந்து செலுத்த வல்ல பீகாமனின் செயலை ஒத்ததாகும். (56-62) : பருத்த தண்டை உயை யாழ் இசையும் கண்டத்துப் பாடலுதம் ஆடலும் என்பன நிகழ. அவை ஆடவர் மைந்திரின் மனத்திண்மையை அழித்தன. அதனால் அழிந்த நெஞ்சமான அரணத்தை உடைய அவர்கள் ஊடலில் வெற்றி அடைய வேண்டாம் என்ற காரணத்தினால் ஒருவரை ஒருவர் முற்பட வேண்டும் என எண்ணாது நாணிக் கூடாமல் உள்ளம் துடித்து நின்றனர். தமக்குள் பகை கொண்டு எழுந்த மன்னவரின் படைகள் இரண்டும் தங்களுக்குள் போர் செய்து வருந்தி நின்றன. அப்போரைக் கைவிட்டுத் தம்முள் உடம்பாடு பெற்றப் போவதற்கு மனம் பொண்டிருந்தும் உலகத்தில் உள்ள பல்வேறு மாந்திடையேயும் இம்மன்னன் படை முன்னால் உடம்பட்டுப் போனது என்று எழுகின்ற சொல்லுக்கு அஞ்சிப் பின்னும போர் செய்யும் துன்பத்துடன் நின்ற செயலைப் போன்றதாகும். (63-68) : மனத்தில் காமம் மிகப்பெற்று எழ, அதனால் தம் கண்கிளில் அக்காமக் களிப்பு nவியார்க்குப்புலம்படும்படி எழ, அதைக் கண்டு ஊரார் அல் தூற்றுவரே என்ற அச்சம் கொண்டு, அக்காமத்தைப் பிறர் அறியாமல் மறைப்பர். அவர் தம் நிலைமை, கள்உண்டவர் தம்மிடம் அந்தக் கள்ளின் களிப்புப் புறத்தார்ககு ; ப் புலப்படுமாறு வெளிபபட, தம் மனம் துன்பம் அடையுமாறு ஊரார் அலர் தூற்றுவதற்கு அஞ்சி, அது பிறர் அறியாமல் முயலும் முயசியினால், அர்தம் களிப்பதைத் தாமே எல்லாரும் அறியும்படி தாமே பரப்பிப் பின்பு, உலகம் பழி தூற்றுவதைக் கேட்டுத் தமக்குள் நடுங்கி, மேலும் கள்ளால் உண்டான களிப்பபை; புறத்தார்க் ;குத் தெரியாத வண்ணம் காத்து மறைப்பவரின் நிலைமையைப் போன்றதாகும் (69-78) : இப்படிக் கள்ளையும் காமத்தையும் பொருந்துதலாலர் அளவற்ற இன்ப வெள்ளத்தைத் தந்தது. வையை ஆற்றில் பெருகிய இந்தப்புதிய நீரு;, ஆளை எறிந்து கொல்லும் தன்மையுடைய மகர மீனின் வடிவுடையதாய்ச்செய்யப்பட்ட மகர வலயம் என்ற தலைக்கோலத்தால் அழகு மேலும் விளங்கும் நெற்றியை உடைய மங்கையர் இந்த வையையின் புதிய நீரில்ஆடி இளைத்தனர். பின்பு தம் புணைகளைக் கைவிட்டுக் கரையேறினர். அவ்வளவில் தம்மால் உண்டாக்கப்பட்ட தீயால் சுடப்பட்ட அகிலினின்று எழுந்த நறுமணப்புகை அக்கரையகத்திருந்த சோலையில் எல்லாம் மணம் கமழுமாறு எழுந்தது. அந்தப்புகையில் ஈரம் புலர்த்திக் கொண்டு தம் கொங்கை முகட்டில் மெழுகப்பட்ட கலவைக் குழம்பு மடை திறந்தாற் போல் நான்கு திக்குகளிலும் கமழ்ந்தது. முகிலின் வயிற்றினின்றும் புறப்பட்டுத் திகழும் வெள்ளிக் கிண்ணத்திலே வெப்பம் மிக்க மதுவை வார்த்தனர். பாம்பினால் விழுங்கப்பட்ட முழுத் திங்கள் தோன்றும் படி அந்தக் கிண்ணத்தைத் தம் அழகிய கையில் எடுத்தனர். திங்களின் ஒளியைப் பருகும் தேவ மகளிரைப் போன்று அக்கிண்ணத்தை செவ்வாம்பல் போன்ற வாயில் வைத்து அருந்தினர். (79-86) : சில மகளிர் தம் உடலின் மேலித்த்ல் வெண்மையான மெல்லிய ஆடையைப் போர்தினர் சில மகளிர் பூத்தொழில் பொருந்திய வெண்மையான ஆடையை த்தம் கூந்தில்ன மேல் போர்த்தினர். சில மகளிர் அதை முறுக்கினர்.சில் சிவந்த குங்குமக் குழம்பையும் சேறாக்கப்பட்ட அகில் குடi;பையும் பல கருப்பூரங்களையும் சாந்து அம்மியில் இட்டு அவை ஒன்றாய் ஆகும்படி குழவியால் யாக குண்டத்தில் எழும் தீயினது நிறம் உண்டாகும்படி அரைத்தனர். மற்றும் சிலர் அந்தப் புதிய நீரில் தாம் கொண்ட வந்த பொன்னால் செய்யப்பட்ட நத்தை, நண்டு, காலையுடைய இறா, வன்மை உடைய வாளைமீன் ஆகியவற்றை இட்டு நாடு விளைவதாக, உலகம் பொலிவதாகுக என்று வாழ்த்தினர். (87-99) : வேறு சிலர் இரப்பவின் வறுமையை அவரது மெய்ப்பாட்டால் உணர்ந்து அவர் ஈயுங்கள் என்று தம்மை இரந்து கூறுவதற்கு முன்னமேயே. அறம் கருதி, அவர் வேண்டுவனவற்றை அளித்தனர். மற்றும் சிலர் தூய்மை செய்யப் பெற்ற நீலமணி போன்ற நிறம் வாய்ந்த வளைந்த தம் கூந்தல்மீது மொய்த்துள்ள வணடுகள் ஆரவாரம் செய்ய அக்கூந்தல் மீது பத்து வகைத் துவர்களையும் தேய்த்துக் கொண்டு நீரில் முழுகினர். வேறு சில மகளிர் தம் தலையில் எண்ணெயை இட்டு அந்த எண்ணெய் நீங்கும்படி நுண்ணிய அரைப்புத் தூளை இட்டுப் பிசைந்தனர். மற்றும் சிலர் மலர் மாலைகளையும் அணிகலன்களையும் அந்த வையை நீரில் இட்டனர். வேறு சில மகளிர் அந்நீர் உண்ண இயலாத மதுவையும் அதில் வார்த்து அதை உண்ணச் செய்தனர். இங்ஙனம் நீர் விளையாடிய மகளிர். நீரில் ஆடியதால் மேலும் ஒளி பெற்றுள்ளனர். அவர் தம் முகமும் முலைகளும் நீரால் புடையுண்டு மிகவம் சிவந்தன. அத்தன்மை கொண்ட நீராடலைத் தம் காதலரோடு ஆடியிருந்தும் பின்னும் அந்நீரினை ஆடும் விருப்பத்தால் வண்டுகள் மொய்க்கும் மணத்தால் சிறந்த ஐந்து காம அம்பினது அரத்தால் கூர்மை செய்யப்பட்ட வாயைப் பெரிதும் ஒத்த விளங்கின. (100-11) : மகளிர் இவ்வாறு நீராடினர். அப்போது நீராடாத மைந்தர் சிலர் நீராடலை விரும்பினர். வாழைத தண்டை தழுவிக் கொண்ட தாவித் தாவிச் சென்றனர். மேலும் சில் அந்நீரின் அலை மேலும் நுரையின் மேலும் தாழம்பூவின் குளிர்ந்த தாதினைத் தூவினர். சிலர் விரiவாக ஓடம் ஓடத்தில் ஏறி, விரைவாக ஓடும் நீர் ஓட்டத்துடனே ஒருசேரச் செலுத்தினர். சிலர் விரைவாய் ஓடும் நீரின் எதிரே அதற்கு மாறாக எதிர் சென்று ஆடித் தம் உடலில் தோன்றிய களைப்பினால் அவ்வாறு எதிர்த்துச் செல்வதை விட்டு நீரோட்டத்தினோடு சேர்ந்து மெல்ல மெல்ல விளையாடினர். மற்றும் சிலர் மெல்லியரான மங்கையர் கட்டிய அழகிய தம் சிற்றில்லில் சமைத்த சிறிய சோற்றை இட, அதை உண்பதற்குக் கரையில்ல ஏறி ஏற்றனர். மற்றும் சிலர்; தம்முடன் விளையாடச் சிறிய இடையை உடைய மகளிரின் பந்துகளையும் கழங்குகளையும் இத்தகைய பிற பொருள்களையும் அவர்கள் அறியாத வண்ணம் கவர்ந்து ஓடிச்சென்று நீர அருகில் நின்றனர். அதை அறிந்த மகளிர் அவரைத் தொடர்ந்து வாங்கச் சென்றபோது அழகிய கரையினின்று மகளிர் கைக்குச் சிக்காமல் நீருக்குள் பாய்ந்தனர். இவ்வாறு ஆடுதல் நிகழ்ந்தது. அதனால் வையை ஆற்றின் இனிய தன்மை கொண்ட புதிய நீர் . ஒளி விடலால், வேலாலும் வாளாலும் வீரர் தம் பகைவருடன் மாறுபட்டு நின்று போர் செய்தலாலும் யானைகள் போர் செய்தலாலும் கலங்கி விளங்கும் போர்க்களத்தைப் போல் இருத்தலால் தெளிவற்றதாய் விளங்கியது. (112-125) : திங்கள் தோன்றி மாலைக் காலத்தில் ஏற்பட்டிருந்த இருளைப் போக்கியது. மதுலைரயில் தங்கும் இயல்பை எண்ணி. எலலாரும் அவ்விடத்தினின்று திரும்பிச் செல்லும், செயலால் புதிய இயல்பு வாய்ந்த அத்திரு நாள் கருதி அணிந்த ஆடை அணிகளை அகற்றினர். அந்த மாலைக் காலத்தில் மலர்ந்த முல்லை முதலிய மலர்களை அணிந்தனர். தோளில் அணியம் பொடியும் தோடும் ஒளி மிக்க அணியாக முத்து வடமம் ஆகிய இத்தகைய அணிகலன்களையும் அணிந்து கொண்டனர். அவர்களுள் பாடும் இயல்புடையார் பாடும் பாடலும், ஆடும் இயல்புடையார் ஆடும் ஆடலும், அந்த ஆடலுக்கு உரிய சீருடன் கூடிய தாளமும் மகளிர் கூந்தலில் ஆரவாரம் செய்கின்ற நறுமணம் கமழ்கின்ற தேனைச் செய்யும் வண்டுகள் வழங்கும் வழக்கமும் என்னும் இவற்றால் எழுந்த ஓசையுடன் பாடும் பண் ஒலியைக் கேட்டுத் தம் இனம் என எண்ணி ஊரினின்று வண்டுகள் வந்தன. அவை பாடுபவர் வருந்துமாறு அவர் எதிரே மொய்த்துப் பாடின. மகளிர் கூற்தலில் அவர் எதிரே மொய்த்துப் பாடின. மகளிர் கூந்தலில் முன்னம் மலர்ந்த மலர்த் தேனை உண்டு வண்டுகளும் மேற் கூறப்பட்ட வண்டுடன் கூடி இனிய குரலுடன் ஆரவாரித்தன. இப்படி எலலாரும் தென் திசையை நோக்கி மீண்டனர். அப்போது மதுரைலயில் உள்ள அழகிய மேனியை மாடங்களின் உள்ளெ இருந்து மங்கையர் தூவிய பனிநீர் மணத்துடன் கலந்து னெ;றற் காற்று மணமுடையதாய் மாறுதற்கு அம்மங்கையர் அம்மாடத்தில் அகில் முதலியவற்றைத் தீயிலிட்டு எழுப்பும் நறுமணப் புகை செறிந்த மலiயில் உள்ள பூங்கொடிகளில் பொருந்திப் பின்பு காற்றுடன் கூடி வானில் ஏறிச் செல்லும் பனியாகிய ஆவியைப் போன்றதாய் விளங்கும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 11, section 11.5, p.209", "", "hard", "false"], ["SANG-11-6", "Sangam literature", "சங்க இலக்கியம் – பரிபாடல் – வையைப் பாடல்கள்: “பாடல் : 11” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – பரிபாடல் – வையைப் பாடல்கள்: Explain the poem/passage titled “பாடல் : 11” (section 11.6).", "பாடியவர் : நல்லந்துவனார் பண் அமைத்தவர் : நாகனார் பண் : பாலை யாழ் மழை பொழிய வையையில் நீர் பெருகி ஓடுதல் : விரி கதிர மதியமொடு, வியல் விசுமபு புணர்ப்ப, எரி, சடை, எழில் வேழம், தலையெனக் கீழ் இருந்து, தெரு இடைப்படுத்த மூன்று ஒன்பதிற்று இருக்கையுள், உருகெழு வெள்ளி வந்து ஏற்றியல் சேர, வருடையைப் படிமகன் வாய்ப்ப, பொருள் தெரி 5 புந்தி மிதுனம் பொருந்த, புலவர் விடியல் அங்கி உயர் நிற்ப அந்தணன் பங்குவின் இல்லத் துணைக்கு உப்பால் எய்த, இறை யமன் வில்லின் கடை மகரம் மேவ பாம்பு ஒல்லை மதியம் மறையவரு நாளில், வாய்ந்த 10 பொதியில் முனிவன் புரை வரைக்கறீ p மிதுனம் அடைய, விரி கதிர் வேனில் எதிர் வரவு மாரி இயைக என இவ் ஆற்றால் புரை கெழு சையம் பொழி மழை தாழ, நெரிதரூஉம் வையைப் புனல். 15 திருமதத் துறையின் சிறப்பு : வரையன புன்னாகமும், கரையன சுரபுன்னையும், வண்டு அறைஇய சண்பக நிரை, தண் பதம் மனை மாமரம் வாள்வரீ ம், சினை வளர் வேங்கை, கணவிரி காந்தள், 20 தாய தோன்ற தீயென மலரா, ஊதை அவிழ்த்த உடை இதழ் ஒள் நீலம், வேய் பயில் சோலை அருவி தூர்த்தரப் பாய் திரை உந்தித் தருதலான், ஆய் கோல் வயவர் அரி மலர்த் துறை என்கோ? 25 அரி மலர் மீப் போர்வை, ஆரம் தாழ் மார்பின், திரை நுரை மென் பொகுட்டுத் தேம் மணச் சாந்தின் அரிவையது தானை என்கோ? கள் உண்ணூஉப் பருகு படி மிடறு என்கோ, பெரிய திருமருத நீர்ப் பூந்துறை? 30 கண்டோர் கூற்று : ஆம் நாள் நிறை மதி அலர்தரு பக்கம் போல், நாளின் நாளின் நளி வரைச் சிலம்பு தொட்டு, நிலவுப் பரந்தாங்கு, நீர் நிலம் பரப்பி, உலகு பயம் பகர் ஓம்பு பெரும் பக்கம் வழியது பக்கத்து அமரர் உண்டி 35 மதி நிறைவு அழிவதின் வரவு சுருங்க் எண் மதி நிறை உவா இருள் மதி போல நாள் குறைபடுதல் காணுநர் யாரே? சேண் இகந்து கல் ஊர்ந்த மாண் இழை வையை வயத் தணிந்து ஏகு நின் யாணர் இறு நாள் பெற! 40 மா மயில் அன்னார் மறையில் புணர் மைந்தர், காமம் கள விட்டு கைகொள் கற்பு உற்றென, மல்லல் புனல் வையை மா மலை விட்டு,. இருத்தல் இல்லத்து நீ தனிச் சேறல் இளிவரல்; என ஆங்கு, 45 கடை அழிய நீண்டு அகன்ற கண்ணாளைக் காளை படையொடுங் கொண்டு பெயர்வானைச் சுற்றம் இடை நெறித் தாக்குற்றது ஏய்ப்ப, அடல் மதுரை ஆடற்கு நீர் அமைந்தது யாறு. வையை போர்க்களத்தை ஒத்தல் : ஆற்று அணி, வெள்வாள் விதிர்ப்போர், மிளிர் குந்தம் ஏந்துவோர், 50 கொள்வார் கோல் கொள்ளக் கொடித் திண் தேர் ஏறுவோர், புள் ஏர் புரவி பொலம் படைக் கைம்மாவை வெள்ள நீர் நீத்தத்துள் ஊர்பு ஊர்பு உழக்குநரும் கண் ஆரும் சாயற் கழித் துரப் போரை வண்ண நீர் கரந்த வட்டு விட்டு எறிவோரும், 55 மணம்வரு மாலையின் வட்டிப் போரைத் துணி பிணர் மருப்பின் நீர் எக்குவோரும், தெரி கோதை நல்லார் தம் கேளிர்த் திளைக்கும் உருகெழு தோற்றம் உரைக்குங்கால், நாளும் பொரு களம் போலும் தகைத்தே பரி கவரும் 60 பாய் தேரான் வையை அகம். நீர் அணி வெறி செறி மலர் உறு கமழ் தண் தார் வரை அகலத்து, அவ் ஏர் அணி நேர் இழை ஒளி திகழ் தகை வகை செறி பொறி புனை வினைப் பொலங் கோதையவரொடு, 65 பாகர் இறை வழை மது நுகர்பு களி பரந்து, நாகரின் நல் வள வினை வயவு ஏற நளி புணர்மார், காரிகை மது ஒருவரின் ஒருவர் கண்ணின் கவர்புற, சீர் அமை பாடற் பயத்தால் கிளர் செவி தெவி, உம்பர் உறையும் ஒளி கிளர் வான் ஊர்பு ஆடும் 70 அம்பி கரவா வழக்கிற்றே, ஆங்கு அதை கார் ஒவ்வா வேனில் கலங்கித் தெளிவரல், நீர் ஒவ்வா வையை நினக்கு. கனைக்கும் அதிகுரல் கார் வானம் நீங்க, பனிப்படு பைதல் விதலைப் பருவத்து, 75 ஞாயிறு காயா நளி மாரிப் பின் குளத்து, மா இருந் திங்கள் மறு நிறை ஆதிரை விரிநூல் அந்தணர் விழவு தொடங்க, புரி நூல் அந்தணர் பொலம் கலம் ஏற்ப, வெம்பாதாக வியல் நில வரைப்பு என 80 அம்பா ஆடலின் ஆய் தொடிக் கன்னியர், முனித்துறை முதல்வியர் முறைமை காட்ட, பனிப் புலர்பு ஆடி, பருமணல் அருவியின் ஊதை ஊர்தர, உறை சிறை வேதியர் நெறி நிமிர் நுடங்கு அழல் பேணிய சிறப்பின், 85 தையல் மகளிர் ஈர் அணி புலர்த்தர, வையை நினக்கு மடை வாத்தன்று மையாடல் ஆடல் மழ புலவர் மாறு எழுந்து, பொய் ஆடல் ஆடும் புணர்ப்பின் அவர், அவர் தீ எரிப் பாலும் செறி தவம் முன் பற்றியோ, 90 தாய் அருகா நின்று தவத் தைந் நீராடுதல்? நீ உரைத்தி வையை நதி! மகளிர் செயல்கள் : ஆயிடை, மா இதழ் கொண்டு,. ஓர் மட மாதர் நோக்கினாள், வேய் எழில் வென்று வெறுத்த தோள்; நோக்கி, சாய் குழை பிண்டித் தளிர் காதில் தையினாள்; 95 பாய் குழை நீலம் பகலாகத் தையினாள்; குவளைக் குழைக்காதின் கோலச் செவியின் இவள் செரீஇநான்கு விழி படைத்தாள் என்று நெற்றி விழியா நிறை திலகம் இட்டாளே, கொற்றவை கோலம் கொண்டு, ஓர் பெண் 100 பவள வளை செறித்தாள் கண்டு அணிந்தாள், பச்சைக் குவளைப் பசுந் தண்டு கொண்டு கல்லகாரப் பூவால் கண்ணி தொடுத்தாளை, நில்லிகா என்பாள் போல், நெய்தல் தொடுத்தாளே, மல்லிகா மாலை வளாய். 105 தண்டு தழுவா, தாவு நீர் வையையுள், கண்ட பொழுதில் கடும் புனல் கை வாங்க, நெஞ்சம் அவள் வாங்க நீடு புணை வாங்க, நேரிழை நின்றுழிக் கண் நிற்ப, நீர் அவன் தாழ்வுழி உய்யாது தான் வேண்டும் ஆறு உய்ப்ப் 110 ஆயத்துடன் நில்லாள் ஆங்கு அவன் பின் தொரூஉ, தாய் அத் திறம் அறியாள், தாங்கி தனிச்சேறல் ஆயத்தில் கூடு என்று அரற்று எடுப்பத் தாக்கிற்றே, சேய் உற்ற கார் நீர் வரவு. “நீ தக்காய் தைந் நீர்! நிறம் தெளிந்தாய்!” என்மாரும் 115 “கழுத்து அமை கை வாங்காக் காதலர்ப் புல்ல விழுத் தகை பெறுக!” என வேண்டுதும் என்மாரும், பூ வீழ் அரியின் புலம்பப் போகாது, யாம் வீழ்வார் ஏமம் எய்துக என் மாரும் கிழவர் கிழவியர் என்னாது, ஏழ்காறும் 120 மழ ஈன்று மல்லல் கேள் மன்னுக” என்மாரும், கண்டார்க்குத் தாக்கு அணங்கு இக் காரிகை; காண்மின்; பண்டாரம் காமன் படை உவள் கண்; காண்மின்; நீல் நெய் தாழ் கோதையவர் விலக்க நில்லாது பூ ஊது வண்டினம் யாழ் கொண்ட கொளை கேண்மின்; 125 கொளைப் பொருள் தெரிதரக் கொளுத்தாமல் குரல் கொண்ட கிளைக்கு உற்ற உழசை; சுரும்பின் கேழ் கெழு பாலை இசை ஓர்மின்; பண் கண்டு திறன் எய்தாப் பண் தாளம் பெறப் பாடிகொண்ட இன் இசைத் தாளம் கொளை சீர்ககு ; ம் விரித்து ஆடும் தண் தும்பியினம் காண்மின்; தான் வீழ் பூ நெரித்தாளை 130 முனை கெழு சின நெஞ்சின் முன் எறிந்து பின்னும், கனை வரல் ஒரு தும்பி காய் சினத்து இயல் காண்மின்; என ஆங்கு, வையை ஆற்றை புகழ்தல் : இன்ன பண்பின் நின் தைந்நீராடல், மின் இழை நறுநுதல் மகள் மேம்பட்ட 135 கன்னிமை கனியாக் கைக்கிளைக் காம இன் இயல் மாண் தேர்ச்சி இசை பரிபாடல், முன் முறை செய் தவத்தின் இம்முறை இயைந்தேம்; மறுமுறை அமையத்தும் இயைக! நறுநீர் வையை நயத்தகு நிறையே! 140 தெளிவுரை : (1-15) : அகன்ற வானில் பரவும் ஒளியுடைய திங்களுடன் கூட்டப்படம் கார்தத ; ;pகையும் திருவாதிரையும் பரணியும் நாள்கள் முதலாய் அமைய , இவற்றின் பெயரால் இடபவீதி, மிதுனவீதி, மேடவீதி என வேறுபடுத்தப்பட்டுக் ககூறப்படும். அம்மூவகை வீதியுள்ளும் ஓர் ஒன் றஒன்பது நாள்களைக்கொண்ட மூவகை இராசிகள். அவற்றுள் வெள்ளிக் கோள் இடபராசியைச் சேர, செவ்வாய்க் கோள் டேராசியைச்சேர, பொருள்களை ஆராய்ந்து அறியும் புந்தி என்ற பெயர் கொண்ட மிதுனராசியில் நிற்க, கார்த்திகை நாள் உச்சமாக இருள் புலர்கின்ற விடியற்காலை உண்டாக, வியாழன் கோள் சனியின் இரட்டை இல்லங்களாகிய மகர கும்பங்களுக்கு மேலே உள்ள மீனராசியைச் சேர, இயமனைத் தமையனாக உடைய சனிக்கோள் தனுராசியின் பின் உள்ள மகர ராசியில் நிற்க, இராகு, தி மழையும் வருகின்ற நாளில் அகத்தியன் என்ற மீன் தன் இடத்தைக் கடந்த மிதுனராசியைச் சேர. மதுவேனில் பருவத்துக்குப் பரின் வருகின்ற கார்காலத்தில் மழை பொழியம் என்று நூலில ;கூறப்பட்டுள்ள இந்த விதியால் உயர்ந்த சைய மலை மீத பெய்த மழை மிகுதிப்பட்டது. பட, வையை ஆற்றில் நீர் பெருகி வந்து கரைகளை நெரித்தது. (16-22) : மலையில் வளர்ந்துள்ள புன்னை மரமும் ஆற்றின் கரையில் உள்ள சுரபுன்னை மரமும், வண்டுகள் இசைபாடுகின்ற சண்பக மரக்கூட்;டமும் குளிர்ந்த தன்மையுடைய தேற்றா மரமும் வாள் வீரமரமும் கொம்புகள் தழைத்து வளரும் வேங்கை மரமும் செவ்வலரி, காந்தளும், தீயைப் போன்று மலரும் தழைத்த தோன்றியும், காற்றால் மலர்த்தப்பட்ட இதழ்களையுடைய நீலமும் ஆகியவற்றின் மலர்களை. (23-30) : மேற் சொல்லப்பட்ட மரங்களை மூங்கில் வளரும் மலைச் சாரலில் சோலையில் அருவி நீர் கொண்டு வந்த குவித்தது. அவற்றைப் பாய்கின்ற வையை ஆற்று நீர் தள்ளிக் கொண்டு வந்த அகன்ற திருமருதத்துறை என்னும் நீராடுதற்கு உரிய அழகிய துறையில் தந்தது, அங்ஙனம் தருதலால் அந்த மருதத்துறையை ஆராய்ந்த மலர் பறித்தற்குரிய சோலையுடைய வெலிய குடிகள் தாங்கள் பறித்த நிறம் உடைய மால்களைக் கொணர்ந்த குவித்து வைக்கும் மண்டபமாகும் எனச்சொல்வேனோ! மலராகிய போர்வையும் மலையில் உள்ள முத்துகள் பொருந்திய மார்பையும் அலையையும் நுரையையும் மென்மையான குமிழிகளையும் நல்ல நறுமணம் உடைய சந்தனச் சாந்தினையும் உடைய வையை என்ற மங்கையின் ஆடையினது முன் தான எனக் கூறுவேனோ கள்ளை வாயில் கொண்டு பருகும ;நில மகளின் மிடறு என்று சொல்லவேனோ! இந்த உவமைகளுள் எதனை எடுத்துத் தேர்ந்து எடுத்துச் சொல்வேன்? (31-40) : பிறை தோன்றிய நாள் தொடங்கி வளர்கின்ற வளர் பாக்கம் போல், நாளுக்கு நாள் பெருகி அதன் ஒளி எங்கும் பரந்ததைப் போன்று, மலைச் சாரல் தொடங்கி நிலம் முழுவதம் நீரைப்பரப்பி உலகத்துக்ககுப் பயனை விளையச்செய்த காத்தனை, பின் தெய்பிறைப் பக்கத்தில் தேவர்க்கு உணவாகிய அம்மதியம் நாள்தோறும் ஒரு கலை அழியும் அதைப் போன்று நின் நீர் வருவாய் சுருங்குதலால் நாளுக்கு நாள் சிறது சிறிது வற்றி வரும் போதும் எட்டாம் திங்களின் அளவாதலன்றி அமாவாசை நாளில் திங்கள் முற்றும் தேய்ந்த ஒழிவத போல் நின்னிடம் நீர் முற்றும் வற்றிப் போய்விட்ட அத்தகைய நாளை இவ்வுலகில் யார் கண்டவர், (எவரும் இலர்) அதனால் நெடுந்தொலைவைக்கடந்து மலைகளிலே ஊர்ந்து வந்த மாட்சிமை உடைய அணிகலன்களை உடைய வையை மகளே! நீ பெருகி வந்த நாளின் வருவாயே அன்றி நின் வற்றிய நாளின் வருவாயையும் இந்த உலகம் அடையும் பொருட்டாக வலி குறைந்து மெல்லச் செல்வாய்! (41-49) : களவில் புணர்கின்ற காதலரையுடைய சிறந்த மயில் போன்ற மகளிர், அவர்கள் காம இன்பச் சிறப்புடைய களவொழுக்கத்தைக் கைவிட்டு இழிந்த கற்பொழுக்கத்தை மேற்கொண்டு அக்கணவனின் இல்லத்தில் போய் அடங்கும். செய்கையைப் போல், நீரான செல்வப் பெருக்கையுடைய வையை மகளே! நீ தோன்றிய பெரிய மலையைவிட்டு நின் தலைவனின் இருப்பிடமான இல்லத்துக்ககுத் தனியே செல்லுதல் இழிவானதாகும். ஆதலால் அங்குச் செல்லாதே! என்று பார்த்தவர் உரைப்ப, எல்லையற்ற நீண்டு அகன்ற கண்ணை உடைய தலைவியைத் தலைவன் உடன் அழைத்துக் கொண்ட படை;கலங்களுடன் செல்ல, அவனை, அத்தலைவியின் சுற்றத்தார் அச்செயலை அறிந்து இடைச் சுரத்தில் போய் அவனுடன் போரிட்டு தடை செய்தாற் பொன்று வெற்றியை உடைய மதுரையில் உள்ள மாந்தர் இடையில் புகுந்து தடை செய்து நீராடுதற்கு ஏற்றது வையை ஆறு. (50-61) : இனி அவ் வையை ஆற்றில் அணி அணியாய் நின்று நெட்டியாற் செய்த வெண்மையான வாளைச் சிலர் சுடற்றினர். சிலர் நெட்டியால் ஆன குந்தப் படையைக் கையில் கொண்டு நின்றனர். மகளிர் அமர்ந்த தேர்ககு ; மகளிர் கோலைக் கைக்கொண்டு நின்றனர். மைந்தர் அமைந்த தேர்ககு ; மைந்தர் கையில் கோலைக் கொண்டு நின்றனர். கொடியை உடைய திண்ணிய தேரில் ஏறியிருந்தனர் சிலர். பறவை பறப்பதைப் போல் விரைந்து போகும் இயல்புடைய குதிரைகளையும் பொன்னால் ஆன பட்டத்தை உடைய பறவைகளையும் ஏறி அவற்றை வையை நீந்துதற்குரிய வெள்ள நீரில் செலுத்திச்செலுத்திக் கலக்கினர். சிலர் கண்ணுக்கு நிறைந்த அழகையுடைய மூங்கில் குழாயில் நீரை எடுத்துத் தம்மீது செலுத்துபவர்களை அரக்கு நீரை வட்டால் எறிந்தனர்; சிலர். தம்மை நல்ல மணம் உடைய மலர் மாலையால் சுழற்றிப் புடைப்ப, அறுக்கப்பட்ட சருச்சரையை உடைய கொம்பில் அடக்கப்பட்ட மண நீரைச் சிலர் வீசினர். ஆராய்ந்து தொடுக்கப்பட்ட மாலையை உடைய மகளிர் தம் காதலருடன் நாள்தோறும் ஆடி மகழ்ந்தனர். அழுகுடைய தோற்றத்தை உவமை காட்டிக் கூறும்போது பகைவரின் குதிரைகளை வென்று கவர்ந்து கொள்ளும் விரைந்து ஓடும் தேரையுடைய பாண்டிய மன்னரின் வையை ஆற்றின் உள் இடம் போர்கக ; ளம் போன்ற தன்மை உடையது எனலாம். (62-71) : நீராடுவதற்கு ஏற்ற அணிகலன்களுடன் மலர்களால் கட்டப்பட்ட மாலையைச் சூடிய மாலை போன்ற மார்பிடத்தேத அந்த அழகிய ஒப்பனையும் அதற்கு ஏற்ற பிற அணிகலன்களையும் ஒளி விளங்கக் கட்டப்பட்டு அமைந்த பொன்னரி மாலை சூடிய மகளிருடன் பாகு தங்கிய இளங்கள்ளைப் பருகிக் களிப்பு மிக விளங்கினர். நல்ல செல்வத்தை உடைய அறவினையைச் செய்த நாகர்களைப் போன்று விருப்பம் மிக இடை விடாது புணர்தற்கு, தாளம் பொருந்திய கிளர்ச்சியை உடைய செவியை நிறைத்ததுக் கொண்டு, ஆடவரும் மகளிரும் அழகு என்ற கள்ளைக் கண்ணால் பருகியபடி விளங்கினர். வானத்தில் வாழும் தேவரின் ஒளிமிக்க வைமானிகர் ஊர்ந்து செல்லும் விமானத்தைத் தெளிவாக வையை நீர் காட்டியது. (72-79) : வையையே! கார் காலத்தில் கலங்கி வேனிற் காலத்தில் தெளிவதாலல் உனக்கு இத்தன்மை எப்போதும் ஒத்திருப்பதில்லை. கார் கால மேகங்கள் முழுங்கும் திசைகள் அதிர்வதற்குக் காரணமான இடி ஒலி நீகிப் பனி மிகும். அதனால் குளிர் நடுங்கும் முன்பனிப் பருவத்தில் ஞாயிறு சுடாத இறுதி மழையை உடைய மார்கழி மாதம். அம் மாதத்தில், மிகப்பெரிய திங்கள் மண்டிலம் வளர்ந்து நிறைந்த திருவாதிரை நாளில் விரிந்த மெய்ந்நூல்களை உடைய அறவோர் திருவாதிரைக்குத் தெய்வமான சிவபெருமானுக்குத் திருவிழாவைத் தொடங்குவர். தொடங்க, முப்புரி பூணூலை உடைய பார்ப்பனர் அந்த விழாவில் இறைவனுக்குப் பலிப் பொருள் இட்ட பொன் கலங்களையும் பிறவற்றையும் ஏந்துகின்றனர். (80-87) : அகன்ற இந்த உலகம் கதிரவனின் வருகையால் வெப்பமடையாமல் மழையால் குளிர்வதாகுக என வாழ்த்தி அம்பா ஆடல் ஆடும் கன்னி மங்கையர். சடங்கினை முதிய பார்ப்பனியர் நோன்பு செய்யும ;முறையை அறிவிக்க, பனியை உடைய விடியற் காலையில் நீரில் ஆடி. பருத்த மணலில் ஓடும் நீரில் குளிர் வாடை தவழ்ந்து வருதலால் நின் நீர் உராய்ந்து சென்ற கரையில் வாழ்கின்ற அந்தணரின் வேத நெறிப்படி வளர்க்கப்பட்ட வளைவாய் எரியும் தீயை வளர்;த்துச் சிறப்புடன், ஒப்பனையுடைய அக்கன்னியர் போய், அத்தீயில் தம் ஈர ஆடையை உலர்த்துவர். வையையே! அத்தீயில் கொடுக்கம் அவி நினக்குப் பொருத்தமானதே! (88-92) : மையோலை பிடித்த இளம் புலவரதுத விளையாட்டுக்கு மாறாய்க் காமக்குறிப்புணர்வு இல்லாத விளையாடும் ஆயத்தையுடைய அக்கன்னியர், அவரவர் அன்னையர் பக்கத்தில் நின்று நோன்புடைய இத் தைந் நீராடலை உன்னிமத்தே பெற்றது. இவ்வாறு நீரில் நின்றன்றி எரியும் தீயின் பக்கத்தில் நின்று பொறி புலன்களை அடக்கிச் செய்தற்கான தவத்தை முன் பிறவிகளில் மேற்கொண்டு செய்ததாலோ, வையையே! இப்பேற்றுக்குரிய காரணத்தை நீயே உரைப்பாயாக! (93-105) : இப்படி அம்மங்கையர் நீராடுங்கால். மூங்கிலின் அழகை வென்று மிகுந்த தோள் அழகையுடையவள் ஒருத்தி, தன் காதில் நீலமலரைச்செருகிக் கொண்ட பக்கத்தில் நின்ற ஒருத்pணை நோக்கினாள். அவளது குறிப்பை அறிந்த அப்போது அந்த மங்கை அசோகம் தளிரைத் தன் காதில் செருகிக் கொண்டாள். தான் சூடிய இளந்தளிர்ச் செம்மையால் நீலமலர் மீது இளவெயில் படர்நதாற் போன்று ஆகும் படி செய்தான் அதைக் கண்ட பின்னவள் முதலாமவளைச் சுட்டிக் குழையணிந்த காதினையுடை யஇவள் தன் செவிகளில் நீல மலர் அணிந்த இப்போது நான்கு விழிகளை உடையவளாக விளங்கினாள் என்று அவள் அழகைப் பாராட்ட, அது கண்ட மற்றொருத்தி மேலும் அழகுக்கு அழகு செய்பவளாய், அந்த அழகி கொற்றவை போல் தோன்ற வேண்டும் என எண்ணி, நெற்றிக் கண் போல் தோன்ற வேண்டும் என எண்ணி, நெற்றிக்கண் பொல் தோன்றும் படி அவளது நெற்றியில் ஒரு திலகத்தை இட்டாள். ஒருத்தி பவள வளையல் அணிந்த ஒருத்தியைப்பார்ததுத் தன் கையில் மரகத மணி போன்ற நிறi; உடைய குவளை மலரின் பசுமையான தண்டினை வளையலாய்ச் செய்து அணிந்த கொண்டாள். ஒருத்தி குளிரிப் பூவால் மாலை தொடுத்தாள், அங்ங்னம் தொடுத்தவளை நி இப்படி மாலை தொடுப்பதை நிறுத்துக எனத் தடையைச் செய்பவளைப் போன்று மற்றொருத்தி அவள் காணுமாறு மல்லிகை மாலையின் இடை இடையே நெய்தல் மலலைக் கலந்து தொடுத்தாள். (106-114) : முன்னம் வாழை மரத் துண்டைத் தழுவி நீரில் பாய்ந்து ஆடினான் ஒருவன். அப்போது அங்கு ஆயத்தாருள் நின்ற ஒருத்தியை அவன் கண்டான். அப்பொழுதில், அவன் மனம் அழிந்தது. அதனாலர்விரைந்து ஓடும் வையைநீர் அவனது கையைத் தன் ஓட்டப்போக்கில் இழுத்துக் கொண்டு சென்றது. அவனது நெஞ்சத்தை இத்மகளிரின் அழகு வலிந்து இழுக்க, அவள் நிற்கும் நிலையிலேயே அவளது கண்கள் நிலை பெற்று நின்றன. நீரோ அவன் விரும்பிய அவளிடத்தில் இழுத்துச்செல்லாமல் தான் விரும்பிய வழியே இழுத்துச் சென்றது. அதைக் கண்ட அம்மங்கை அவன் பிரிவை ஆற்றாதவளாய்த் தன்னுடன் உள்ள மகளிருடன் நில்லாமல் அவன் பின்னே தொடர்நதாள். அவள் அங்ஙனம் செல்வதற்குக் காரணமான அன்பின் தன்மையை அவள் தாய் அறியவில்லை. அவளைத் தடுத்து, ஏடி, நீ தனியெ செல்லாதே! மீண்டம் நின் தோழியருட்ன போய்க் கூடுக! எனக் கூறி விலக்கினாள். அதனால் அப்பெண் அழுதாள். அங்ஙனம் ஆக, கரையினை மோதி வந்தது பார்ப்பருவத்துச்சிவந்து விளங்கிய வையையின் வடிவு. (115-121) : கார் காலத்தில் வரும் நீரைப்போல அன்றி தைந்நீரை, நீ குளிக்கும் அளவு உடையiயாய் விளங்குகிறாய். நிறமும் தெளிந்து விளங்குகிறாய். ஆதலால் நீயே தக்கயர்! எனச் சிலர் பாராட்டினார். எம் கணவர் எம் கழுத்தில்அமைத்துத் தழுவிய கைகளை அகற்றாமல் எம்மைத் தழுவ, அதனால் யாம் வீறு பெறுக என்று நின்னை வேண்டுகின்றோம் எனச் சிலர் உரைத்தனர். எம்மால் விரும்பப்பட்ட தலைவர் மொய்ககு ; ம் வண்டைப் போன்று யாங்கள் தனியாய் இருந்து வருந்தும்படி அஎம்மைவிட்டு நீங்காமல் எம்முடனே இருத்தலால் யாம் இன்பம் அடையம்படி அரள்வாயாக! என்று வேண்டிக் கொண்டனர். எம் கணவரும் யாமும் கிழவர் கிழவியர் என உலகத்தவரால் கூறப்படாமல், எம் ஏழாம் பருத்திற்குரிய ஆண்டு அடையும் வரையிலும் இளமையை இத் தைந்நீர்த்தவம் தர யாம் செல்வத்தோடும் உறவினரோடும் நலை பெறுமாறு அருள் செய்வாயாக! என்று வேண்டினர் சிலர். (122-133) : இம்மங்கை கண்டவரைத் தாக்கி வருத்தும் தெய்வம் ஆவாள். அத்தகையவளை நீங்களும் பாருங்கள். இவளது கண் காமனின் கருவூலமும் படைக்கலங்களும் ஆகும். நீல நிறத்தை உடைய தேன் பொருந்தி யமலர் மாலையை உடைய அம்மகளிர் ஓச்சித தடை செய்யவும் நில்லாமல் அம்மாலையில் தேனை ஊதும் வண்டுகள் யாழ் பொல் பாடுகின்றன. அவற்றைக் கேளுங்கள். பாடலின் பொருள் விளங்கும்படி பாடாதிருக்கவும். குரல் கொண்ட கிளையான இளிக்குக் கிளையாகப் பொருந்தி யஅரும்பாலைப் பண்ணில் தோன்றிய மருதப்பண் என்ற இசையைக் கேளுங்கள். விளரிப்பாலையில் தோன்றும் யாம் யாழினைத் தாளத்துக்கும் கொளைச் சீர்ககு ; ம் அப்பண்ணின் சீர்ககு ; ம ;ஏற்றபடி தம் சிறகுகளை விரித்து ஆடும் குளிர்ந்த இசையை இசைக்கும் தும்பியின் கூட்டத்தைக் காணுங்கள். ஒரு தும்பி தான் பொருந்தி யமலரினை நெரித்தவளான ஒருத்தியைச் சினம் கொண்ட நெஞ்சுடனே முன்னரும் தாக்கிப் nபின்னரும் தாக்குவதற்கு விரைந்து வருவதற்குக் காரணமான அதன் சிநத்தின் தன்மையைக்காணுங்கள் என்று இப்படி அங்கே நிழ்ந்த நிகழ்சிசிகளை மைந்தர் ஒருவருக்கொருவர் சுட்டிக் காட்டி நின்றனர். (134-140) : இனிய தன்மையில் மும்பாடு அடைந்த தேர்ச்சியை உடைய இசையுடன் பொருந்திய பரிபாடலால் வாழ்த்தபபடும் நீரையுடைய வையையெ! ஒளிரும் அணிகலன்களையும் நறுமண நெற்றியையும் உடைய மகள் தன்மை மேம்பட்ட கன்னிமைத் தன்மை முதிராத மகளிடத்தில் மேற் கூறியபடி கை;கிளைக் காமத்தைத் தரும் யாம் முந்தைய பிறவியிலே ஆற்றிய தவத்தால் இப்பிறவியில் நின்னிடம் இந்தத் தைந் நீராடலான தவத்தைப் பெற்றோம். அத்தவத்தை எல்லாரும் விரும்பத் தக்க நின் நீர் நிறைவில் மறு பிறவியிலும் யாம் பெற வேண்டும் அருள்க!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 11, section 11.6, p.218", "", "hard", "false"], ["SANG-11-7", "Sangam literature", "சங்க இலக்கியம் – பரிபாடல் – வையைப் பாடல்கள்: “பாடல் : 12” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – பரிபாடல் – வையைப் பாடல்கள்: Explain the poem/passage titled “பாடல் : 12” (section 11.7).", "பாடியவர் : நல்வழுத்தியார் பண் அமைத்தவர் : நன்னாகனார் பண் : பாலை யாழ் வையையில் நீர் பெருகி வருதல் : வளி பொரு மின்னொடு வான் இருள் பரப்பி, விளிவு இன்று கிளையொடு மேன் மலை முற்றி. தளி பொழி சாரல் ததர் மலர் தாஅய்; ஒளி திகழ் உத்தி உருகெழு நாகம், அகரு, வழை, ஞெமை, ஆரம் இனைய் 5 தகரமும், ஞாழலும்; தாரமும் தாங்கி; நளி கடல் முன்னியது போலும், தீம் நீர் வளிவரல் வையை வரவு. புனல் வரவு காண மகளிர் சென்ற வகை : வந்து மதுரை மதில் பொரூஉம், வான் மலர் தாஅய், அம் தண் புனல் வையை யாறு எனக் கேட்டு 10 மின் அவிர் ஒளி இழை வேயுமோரும், பொன் அடர்ப் பூம் புனை திருத்துவோரும், அகில் கெழு சாந்தம் மாற்றி ஆற்றப் புகை கெழு சாந்தம் பூசுவோரும், கார் கொள் கூந்தல் கதுப்பு அமைப்போரும், 15 வேர் பிணி பல் மலர் வேயுமோரும், புட்டகம் பொருந்துவ புனைகுவோரும், கட்டிய கயில் அணி காழ் கொள்வோரும்; வாச நறு நெய் ஆடிவான் துகள் மாசு அறக் கண்ணாடி வயக்கி வண்ணமும் 20 தேசும் ஒளியும் திகழ நோக்கி, வாச மணத் துவர்வாய்க் கொள்வோரும்; இடு புணர் வளையொடு தொடு தோள் வளையர், கட்டு வடக் கழலினர் மட்டு மாலையர்,. ஓசனை கமழும் வாச மேனியர் 25 மட மா மிசையோர், பிடிமேல் அன்னப் பெரும் பெடை அனையோர்; நீர் வரவு காணச் சென்ற மைந்தர் செயல் : கடு மா கடவுவோரும் களிறு மேல் கொள்வோரும், வடி மணி நெடுந் தேர் மா முள் பாய்ககு ; நரும், விரைபு விரைபு மிகை மிகை ஈண்டி, 30 ஆடல் தலைத்தலை சிறப்ப கூடல் உரைதர வந்தன்று வையை நீர் வையைக் கரைதர வந்தன்று, காண்பவர் ஈட்டம்; நிவந்தது நீத்தம் கரை மேலர் நீத்தம் கவர்ந்தது போலும் காண்பவர் காதல். 35 முன்துறை நிறை அணி நின்றவர் மொழி மொழி ஒன்று அல பல பல உடன் எழுந்தன்று; அவை எல்லாம் தெரியக் கேட்குநர் யார் அவை கில்லா கேள்வி கேட்டன சில சில் ஒத்த குழலின் ஒலி எழ முழவு இமிழ், 40 மத்தரி, தடாரி, தண்ணுமை, மகுளி, ஒத்து அளந்து, சீர் தூக்கி, ஒருவர் பிற்படார், நித்தம் திகழும் நேர் இறை முன்கையால் அத்தக அரிவையார் அளத்தல் காண்மின். கேட்டன கூறல் : நாணாள் கொல், தோழி! “நயன் இல் பரததையின் 45 தோள் நலம் உண்டு துறந்தான்” என, ஒருத்தி யாணர் மலி புனல் நீத்தத்து இரும் பிடி சேண வெரிநின் சிறந்தானோடு ஏறினாள், நாணுக் குறைவு இலள்; நங்கை மற்று? என்மரும் “கோட்டியுள் கொம்பர் குவி முலை நோக்குவோன் 50 ஓட்டை மனவன் உரம் இலி” என்மரும், “சொறிந்ததூஉம் சொற்றதூஉம் பற்றாள்; நிறம் திரிந்தாள்; நெஞ்சத்தை நீத்தாள், நெறி செல்வான் பின் நிறை அஞ்சிக் கழியாமோ, அன்பு உற்றால்?” என்மரும், “பூண் ஆரம் நோக்கிப் புணர் முலை பார்த்தான் உவன்; 55 நாணாள் அவனை இந் நாரிகை” என்மரும். அங்கு நிகழ்ந்தவை : அமிர்து அன நோக்கத்து அணங்கு ஒருத்தி பார்ப்பு, கமழ் கோதை கோலாப் புடைத்து, தன் மார்பில் இழையினைக் கை யாத்து இறுகிறுக்கி வாங்கி, பிழையினை என்ன, பிழை ஒன்றும் காணான், 60 தொழுது பிழை கேட்கும் தூயவனைக் காண்மின். “பார்த்தாள் ஒருத்தி நினை” என, “பார்த்தவளைப் பொய்ச் சூளாள் என்பத அறியேன் யான்” என்று இரந்து மெய்ச் சூள் உறுவானை, மெல்லியல், பொய்ச் சூள் என்று, ஒல்லுவ சொல்லாது, உரை வழுவச் சொல்ல் 65 உறைத்தும் செறுத்தும் உணர்த்துவானைப் புல்லாது ஊடிப் புலந்து நின்றவள் பூ எழில் வண்ண நீர் பூரித்த வட்டு எறிய, வேல் எழில் உண்கண் எறி நோக்கம் பட்ட புண் பாய் குருதி சோர பகை இன்று உளம் சோர, 70 நில்லாது நீங்கி நிலம் சோர் அல்லாந்து மல் ஆர் அகலம் வடு அஞ்சி, மம்மர் கூர்ந்து, எல்லாத் துனியும் இறப்ப, தன் காதலன் நல் ஏர் எழில் ஆகம் சேர்வித்தல், எஞ்ஞான்றும் வல்லதால் வையைப் புனல் 75 என ஆங்கு, மல்லிகை மௌவல் மணம் கமழ் சண்பகம் அல்லி, கழுநீர், அரவிந்தம், ஆம்பல், குல்லை, வகுளம், குருக்கத்தி, பாதிரி, நல்இணர் நாகம் நறவம் சுரபுன்னை 80 எல்லாம் கமழும் இரு சார் கரை கவிழ் தேறித் தெளிந்து செறி இருள் மால் மாலை; பாறைப் பரப்பில் பரந்த சிறை நின்று; துறக்கத் தொழிலைத் தன் நீர் நிழல் காட்டும் கார் அடு காலை கலிழ் செங் குருதித்தே; 85 போர் அடு தானையான் யாறு சுடு நீர் வினைக் குழையின் ஞாலச் சிவந்த கடி மலர்ப் பிண்டி தன் காதில் செரீஇ, விடு மலர்ப் பூங்கொடி போல நுடங்கி, அடிமேல் அடிமேல் ஒதுங்கி தொடி முன் கைக் 90 காரிகை ஆகத் தன் கண்ணி திருத்தினாள், நேர் இறை முன் கை நல்லவள் கேள் காண்மின். துகில் சேர் மலர் போல், மணி நீர் நிறைந்தன்று; புனல் என மூதூர் மலிந்தன்று அவர் உiர் உரையின் உயர்ந்தன்று கவின். 95 போர் ஏற்றன்று நவின்று; தகரம் மார்பு அழி சாந்தின் மணல் அளறு பட்டன்று; துகில் பொசி புனலின் கரை கார் ஏற்றன்று; விசும்பு கடி விட்டன்று விழவுப் புனல் ஆங்க. வையையை வாழ்த்துதல் : இன்பமும் கவினும் அழுங்கல் மூதூர் நன் பல நன் பல நன் பல வையை! நின் புகழ் கொள்ளாது இம் மலர்தலை உலகே. 102 தெளிவுரை : (1-8) : காற்றினால் மோதப்பட் டமேகம் மின்னலையும இருளையும மாறி மாறிப் பரப்பித் தன் இனத்துடன் போய் சைய மலையை அடைந்து அதனைச் சூழ்ந்து. இடைவிடாமல் மழை பெய்தது. அப்புயலால் காட்சிக்கு இனி யஅந்நீர் மலைச் சாரலில் காற்றால் உதிர்ந்த பூக்கள் தன் மீத பரவி விளங்க. ஒளி விளங்கும் பொறியை உடையதம் கண்டவர் அஞ்சுவதுமான நாகப் பாம்பினது பெயரை உடைய அமமலைச் சாரலில் உள்ள நாக மரம், அகில் மரம், சுரபுன்னை மரம், ஞெமை மரம். சந்தன மரம் ஆகிய இவை ருந்தும் படி செய்து, தகர மரம் ஞாழல் மரம் தேவதார மரம் என்பனவற்சை;சாய்த ; ;துத் தன்னுள் கொண்டு காற்றைப் போன்று விரைவாய் வரும் வருகை ஒரு பெருங்கடல் பொங்கி வருவதைப் போல் விளங்கியது. (9-18) : அழகுடைய குளிர்ந்த நீரை உடைய வையை ஆறு முல் உரைத்ததைப் போன்று மலர் பரக்கப்பட்டு வந்து மதுரையின் மதிலை மோதும் என்று கண்டோர் உரைத்தனர். அதைக் ர்கட்டனர் அந்நகர மக்கள். அவர்கள் மின்னலைப் போல் விளங்கும் அணிகலன்களை அணிந்து கொண்டனர். பொன் தகட்டால் ஆன பூவான அணிகளை அணிந்து கொண்டனர். சந்தனச் சாந்தை மாற்றி அகிற்புகையினாலாகிய சாந்தைத் தம் உடம்பில் மிகுதியாய்ப் பூசிக் கொண்டனர். முகில் போன்ற தம் கூந்தலைக் குழலாக முடித்தனர். அந்தக் கூந்தலில் வெட்டி வேரும் விலாமிச்ச வேரும் ஆகிய இரண்டுடன் கட்டப்பட்ட பல மலர் மாலையச் சூடிக் கொண்டனர். நீராடுதற்குப் பொருத்தமான புடைவைகளை உடுத்திக் கொண்டனர். கட்டப்பட்ட கோக்கு வாயானே அழகுடையதாகிய வடங்களைப் பூண்டனர். (19-27) : மகளிர் சிலர் கண்ணாடியின் அழுக்குப் போக நறுமண நெய்யைப்பூசிக் கற்பொடியிட்டுத் துலக்கினர். அக்கண்ணாடியில் தம் இயற்கையழகும் செயற்கை அழகும் ஆடவரைப் புணர்ந்ததால் உண்டான ஒளியும் விளங்க அவற்றைக் கண்டு களித்தனர். பஞ்ச வாசத்தோடு கூட்டி இடித்த பாக்கினை வாயில் இட்டு மெல்பவர், ஆணி இடும் இர்டடை வளையலுடன் செறிக்கப்படும் தோள் வளையை உடையவர. கட்டு வடத்துடன் கால் மோதிரம் அணிந்தவர். தேன்சிந்தும ;மாலையை உடையவர் ஓர் ஓசனை மொலைவு மணம் கமழும் மேனியர். இத்தகைய இயல்புடையவராய் விளங்கிய அம்மகளிருள் சிலர் மெல்லிய நடையை உடைய குதிரையின் மீது ஏறினர். பெரிய பெண் அன்னம் போன்ற சிலர் பெண் யானையின் மீது ஏறினர் . (28-39) : ஆடவருள் சிலர் விரைவான நடையை உடைய குதிரை மீத ஏறிச் செலுத்தபவரும். மற்றும் சிலர் யானை மீது ஏறிச்செலுத்துபவரும் சிலர் தெளிந்த ஓசையை உடைய மணிகள் கட்டப்பட்ட பெரிய தேரில் பூட்டி யகுதிரைகளை முட்கோலால் குத்திச் செலுத்துபவரும் ஆகி, விரைந்து விரைந்த மிக மிக நெருங்கிச் சென்றனர். வையை நீராடல் இடந்தோறும் இடந்தோறும் சிறக்குமாறும் மதுரையில் உள்ள மக்கள் எல்லாலம் தன்னைப் புகழவும் வையை வந்தது. அந்த வையை வெள்ளத்தைக்க காண வந்த மக்கட் கூட்டம் வையையின் இரண்டு பக்கத்தும் அதன் கரையை ஒப்ப வந்து கூடியத. அந்நீர் வெள்ளம் கரைக்கு மேலே உயர்ந்தது. அந்நீர் தன்னைக் காணவந்த மக்களின் ஆசை வெள்ளத்;தையும் கவர்ந்து கொண்டு பெருகியது போல் பெருகிற்று. அப்போது அந்த வையை ஆற்றில் நீராடும் துறையின் முன் நிறைந்த அணி அணியாக நி;ன்ற மக்கள் பேசும் மொழிகள் ஒன்றுடன் ஒன்று பொருந்தாமல் பல பல ஒரே காலத்தில் எழுந்தன. யார் அம்மொழிகளை எல்லாம் பொருள் விளங்கக் கேட்க வல்லவர்! அவற்றைக் கேட்டால் இயலாது. எம்மால் கேட்கப்பட்டவை சிலவே ஆகும். (40-45) : தங்களுக்குள் ஒருவருக்கு ஒருவர் பிற்படாதவராய்க் கூத்தாடுதலில் அழகு பொருந்தத் தம்முள் ஒத்து விளங்கும் ஆடல் மகளிர். இசைக்கருவியினின்று இசை எழ, முழவு, மத்திரி, தடாரி, தண்ணுடை, மகுளி என்னும் இக்கருவிகளின் ஓசையை உடைய தாளத்தை அளந்து தம் நேரிய முன் கையால் தாளக்கை அளத்தலைக் காணுங்கள். (45-56) : தோழியே! கேட்பாயாக! ஒருத்தி நாணத்தில் குறையில்லாதவளாய் இருந்தும் தனக்குச் சிறந்தவனான கணவன் நன்மையற்ற பரத்தையர் இலலத்துக்குப் போண் அவரது தோளின் அழகை அனுபவிக்கும் பெர்ருட்டுத் தன்னை நீஙகிச் சென்றான் என்று அவனுடன் ஊடியிருந்தவள் புதுவருவாயை உடைய வையை வெள்ளத்தில் அந்த ஊடலையம் மறந்து பெரிய பெண் யானையின் முதுகின் மீது நீராடம் விருப்பத்துடன் தன் கணவனடன் உயர் ஏறினாள். அவர்ள நாயம் உடையவளோ என் சிலர் கூறினார்கள். கூட்டத்தில் நின்றே ஒருவன் பூங்கொம்பைப் போன்ற ஒருத்தியின் குவிந்த முலைகளைக் கூ;ர்ந்து பார்;க்கின்றான். அவன் இளகிய நெஞ்சன். திண்மை இல்லாதவன் என்று சிலர் இகழ்ந்தனர்;. இவன் இவட்குப் பண்டு மலர் முதலியனவற்றைக் கையுறையாகத் தந்தம் இலலை. காதல் மொழி பேசியதும் இல்லை. அங்ஙனமாகவும் வழியில் போகும் அயலான் ஒருவன் பின்னே தன் மனத்தைச் செலுத்தி மேனி பசலையூர் நின்றாள். யாம் காதல் கொண்டவிடத்தும் நிறையழிவதற்கு அஞ்சி அதைக் கைவிட வேண்டாவோ! இவன் மங்கை அணிந்துள்ள முத்தாரத்தின் அழகை நோக்குபவன் போல் இவளடைய நெருங்கிய முலைகளைப் பார்தான். இவன் அங்ஙனம் பார்ப்பதனால் இவளும் நாணம் கொள்ளவில்லை எனக் கூறினர். (57-66) : ஒருத்தி தன் கணவனை அமிழ்தம் போன்ற பார்வையால் பார்தாள். அவள் பொறுக்காது தன் மார்பில் அணிந்திருந்த மலர் மாலையை எடுத்து அதையே கோலாகக் கொண்ட தன் கணவனைப் புடைத்துத் தன் மார்பில் உள்ள வடத்தை எடுத்து அவனுடைய கைகளைக் கட்டினாள். இறுக்கி இறுக்கிப் பார்த்தாள் நீ குற்றம் உடையாய்!” என்றாள் அவள் அவ்வாறு தன்னைக் கட்டியதற்குத் தன்னிடம் குற்றம் ஒன்றும் இல்லாமையால், அவன் அவளை வணங்கினான். நல்லாய் யான் செய்த குற்றம் யாது? என்று வினவினான். அவனைக் காணுங்கள்.ஏடா! நின்னை ஒருத்தி நோக்கினாள். அவ்வாறு நோக்கியவள் நின்னால் சூள் பொய்க்கப்பட்டவளாக இருக்க வேண்டும் என்று அவனது பிழையை எடுத்துக் காட்டினாள். காட்ட, அவன், நலலாய், என்னைப் பார்த்தவளை அறியேன். அவள் சூள் பொய்க்கப்பட்டவள் என்பதையும் அறியேன்! என்று சொல்லி பணிந்த சொற்களைச் சொல்லி பணிந்த சொற்களைச் சொல்லி இரைந்து உண்மையாகவே ஆணையிட்டான். அதைக் கேட்ட மெல்லிய சாயலை உடையவள் பொறுக்கக் கூடிய சொற்களைச் சொல்லாமல், ஏடா, நீ இப்போது செய்யும் சூள்தான் என்ன? இதுவும் பொய்யான சூளே! என்று கூறினாள். அதைக் கேட்ட அவன் மீண்டும் சூளில் மிக்கும், சினந்தும் அவளது ஊடலைப் போக்க முயன்றான். (67-76) : இவ்வாற ஊடல் தீர்ந்த போதும் கூடாமல் ஊடி நின்றவள் அந்த நிலையினின்றம் புலவி நிலைமையில் நின்ஃறு மலின் மணத்தையும் அழகையுமுடைய அரக்கு நீர் நிறைந்த வட்டினை அவனது மார்பில் எறிந்தாள். அந்த அரக்குநீர் அவளது அழகிய மையுண்ட கண்ணான வேல்பட்ட புண்ணினின்றும் குருதி சொரிவதைப் போல் சொரிந்தது. அவன் அந்நிலையைப் பொறுக்கவில்லை. அவளிடம் பகைமை இலல்லாதவனாய்த் தன் நெஞ்சம் நெகிழ்தலால் அவள் முன் நில்லாமல் அவ்விடத்தினின்ற நீங்கி நிலத்தில் வீந்தவனைக் கண்ட அவள், அவனது மற்போருக்குப் பெருந்திய மார்பில் தான் வீசிய வட்டால் புண்பட்டு வீழ்ந்தான் எனக்கருதி அஞ்சி மயங்கி முன்னம் தான் கொண்ட எல்லாப் புலவியும் நீங்கிடத் தன் காதலானான அவனுடைய நல்ல மார்பினைத் தழுவிக் கொண்டாள். இங்ஙனம் புலவி கொண்டவரைப் புலவி நீக்கிக் கூடச் செய்தலில், இந்த வையை நீர் இன்றெ அல்லாது எக்காலத்தும் வன்மை உடையது. இந்நிகழ்சியையும் காணுங்கள் என்று காட்டினர். (77-86) : போரில் பகைவரை வெல்லும் படையை உடைய பாண்டியனின் இந்த வையை ஆறு, மல்லிகை மலர், சண்பக மல்ர், முல்லை மலர், தாமரை மலர், வெள்ளல்லி, செங்கழுநீர் மலர், அரக்காம்பல் , கஞ்சங் குல்லை, மகிழம் பூ, குருக்கத்தி, பாதிரி, நல்ல பூங்கொத்துக் களை உடைய நாகமா மலர், நறவ மலர், சுரபுன்னை மலர் என்ற இந்த எல்லா மலரும் மணம் வீசுவதற் கஇடமான இரு பக்கத்தும் உள்ள கரையை மோதிக் கலங்கியது. பின்பு பாறைக் கலலையுடைய நிலம் போன்று அடையாத பரந்த கல்லணையால் தடையுண்டு தேங்கி நின்று இருள் மிக்க மாலையில் மிகவும் தெறிந்து வான் உலகத்தில நிகழும் தொழிலைத் தன் நீர் நிழல் காட்டும். அந்த இருளை ஓட்டும் காலைப் போதில் கலங்கிய சிவந்த குருதியின் தன்மை உடையதாகும். (87-92) : நேரிய இறையான முன் கையை உடைய இம்மங்கை. அசோகின் சிவந்த பது மலரைத் தீயில் இட்டுச் சுட்டமையாலம் ஒளிமிக்க இபல்படைய தொழிற் சிற்ப்புடைய காதணி பொல் தூங்கும் படியாய்த ;தன் செவியில் செருகிக் கொண்டு மலர் மலர்ந்த பூங்கொடி பேதால் ஒல்கி, ஒருவன் இட்டுச் சென்று போனவள் ஒரு பக்கம் ஒதுங்கி வளையல் அணிந்த தனது முன் கையால் தன் தலையில் சூடியள்ள மாலைய அழகாகத் திருத்pனாள். ஆகவே அவன் அவளுடைய காதலனே ஆக வேண்டும். இந்தக் காட்சியையும் காணுங்கள் என்று இப்படித் தாம் விரும்பியவற்றைக் காட்டினார். (93-99) : நீராடிய மகளிர் அணிகளிலிருந்து உதிர்ந்த நீரோட்டத்தை உடைய மனிகள் அவர் ஆடையில் செய்யபட்ட புத்தொழிலைப் போல் நிறைந்த காணப்பட்டன என்று இவ்வாறு நீராடியவர் பலவாய்க் கூறியவை மதுரையில் சென்று மிக்கது. நீராடியவர் சொல்லைவிட அவர் நீராடியதால் எய்திய அழக மிக்கது. அங்ஙனம் மிக்க அந்த அழக பிறர் அழகுடன் மாறுபட்டது. நீராடிய மகளிரின் மார்பினின்றும் வழிந்து வீழ்ந்த தகரச் சாந்தினால்ல வையை ஆற்றின் மணல் சேறாகும் தன்மையை அடைந்தது. அந்த ஆற்றின் கரைகள் நீராடிக் கரைசேர்ந்தாரின் ஆடையினின்றும் ஒழுகும் நீரால் கார் காலத் தன்மை பெற்றத. இந்நீராட்டு விழா இம்மதுரையில் நடத்தலால் வானுலகம் சிறப்பு ஒழிந்தது. (100-102) : வையையே! இவ்வாரவாரம் உடைய பழையதாகிய மதுரையில் வாழும் மக்களுக்கு நின்னால் இன்பமும் அழகும் பல நல்லவை உள்ளன ஆயின. ஆதலாலல் இம்மண்ணுலகம் அகன்ற இடம் உடையது என்றாலுதம் நின் புகழ் மிக விரிந்தது. அதலால் நின் புகழைத் தன்னடம் அடக்க மாட்டாது.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 11, section 11.7, p.226", "", "hard", "false"], ["SANG-11-8", "Sangam literature", "சங்க இலக்கியம் – பரிபாடல் – வையைப் பாடல்கள்: “பாடல் : 16” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – பரிபாடல் – வையைப் பாடல்கள்: Explain the poem/passage titled “பாடல் : 16” (section 11.8).", "பாடியவர் : நல்லழிசியார் பண் அமைத்தவர் : நல்லச்சுதனார் பண் : நோதிறம் வையையில் நீர் வரவு : கரையே, கைவண் தோன்றல் ஈகை போன்ம் என, மைபடு சிலம்பின் கறியொடும், சாந்தொடும், நெய் குடை தயிரின் நுரையொடும், பிறவொடும், எவ் வயினானும், மீதுமீது அழியும், துறையே, முத்து நேர்பு புணர் காழ், மத்தக நித்திலம், 5 பொலம் புனை அவிர்இழை, கலங்கல் அம் புனல் மணி வலம் சுழி உந்திய, திணை பிரி புதல்வர் கயந்தலை முச்சிய முஞ்சமொடு தழீஇ, தம் தம் துணையோடு ஒருங்கு உடன் ஆடும் தத்து அரிக் கண்ணார் தலைத்தலை வருமே. 10 செறுவே, விடு மலர் சுமந்து, பூ நீர் நிறைதலின் படுகண் இமிழ் கொளை பயின்றனர் ஆடும், களி நாள் அரங்கின் அணி நலம் புரையும், காவே, சுரும்பு இமிர் தாதொடு தலைத்தலை மிகூஉம் நரந்த நறு மலர் நன்கு அளிக்கும்மே. 15 கரைபு ஒழுகு தீம் புனற்கு எதிர் விருந்து அயர்வ போல், கானலங் காவும், கயமும், துருத்தியும், தேன் தேன் உண்டு பாடத் திசை திசைப் பூ நலம் பூத்தன்று வையை வரவு. சுருங்கையின் ஆயத்தார் சுற்றும் எறிந்து. 20 குரும்பை முலைப் பட்ட பூ நீர் துடையாள், பெருந்தகை மீளி வருவானக் கண்டே, இருந்துகில் தானையின் ஒற்றி, “பொருந்தலை பூத்தனள், நீங்கு” எனப் பொய் ஆற்றால், தோழியர், தோற்றம் ஓர் ஒத்த மலர் கமழ் தண் சாந்தின் 25 நாற்றத்தின் போற்றி நகையொடும் போத்தந்து, இருங் கடற்கு ஊங்கு இவரும் யாறு எனத் தங்கான், மகிழ களிப் பட்ட தேன் தேறல் மாற்றி, குருதி துடையாக் குறுகி மருவினியர்,. “பூத்தனள் நங்கை பொலிக!” என நாணுதல் 30 வையை வானக் கங்கையை ஒத்து விளங்குதல் : மலையின் இழி அருவி மல்கு இணர்ச் சார்ச் சார்க் கரை மரம் சேர்ந்து கவினி; மடவார் நனை சேர் கதுப்பினுள் தண் போது மைந்தர் மலர் மார்பின் சோர்ந்த மலர் இதழ் தாஅய்; 35 மீன் ஆரம் பூத்த வியன் கங்கை நந்திய வானம் பெயர்ந்த மருங்கு ஒத்தல், எஞ்ஞான்றும், தேன் இமிர் வையைக்கு இயல்பு. வையைக்கு உரிய இயல்பு : கள்ளே புனலே புலவி இம் மூன்றினும், ஒள் ஒளி சேய்தா ஒளி கிளர் உண்கண் கெண்டை, 40 பல் வரி வண்டினம் வாய் சூழ் கவினொடும், செல் நீர் வீவயின் தேன் சோர, பல்நீர் அடுத்து அடுத்து ஆடுவார்ப் புல்ல, குழைந்து வடுப்படு மான்மதச் சாந்து ஆர் அகலத்தான், எடுத்த வேய் எக்கி நூக்கு உயர்பு தாக்கத் 45 தொடுத்த தேன் சோரும் வரை போலும் தோற்றம், கொடித் தேரான் வையைக்கு இயல்பு. வரை ஆர்க்கும் புயல்; கரை திரை ஆர்க்கும் இத் தீம் புனல்; கண்ணியர் தாரர், கமழ் நறுங் கோதையர், 50 பண்ணிய ஈகைப் பயன் கொள்வான், ஆடலால் நாள் நாள், உறையும், நறுஞ் சாந்தும் கோதையும், பூத்த புகையும் அவியும் புலராமை மறாஅற்க, வானம்; மலி தந்து நீத்தம் வறாஅற்க, வைகை நினக்கு! 55 தெளிவுரை : (1-10) : வையை ஆற்றில் வெள்ளமானத பெருகி வரும் வருகையால் மேகங்கள் பொருந்தும் மலையிடம் உள்ள மிளகினோடும் சந்தன மரத்தினோடும், வெண்ணெய் உண்டாதற் பொருட்டுக் கடைவதற்குக் காரணமான தயிர் போல் விளங்கும் நுரையுடனும், மலர் பொன் மணி முதலிய மற்றப் பொருள்களோடும் அந்த நீர் பெருகியது. வையைக் கரையில் எங்கும், அப்பொருள்களை இச்செய்கை பாண்டியனின் கொடைத் தன்மையப் போன்றது என்று கண்டோர் சொல்லும்படி, மேன்மேலும் வாரி வாரித் தன் அலைக் கரங்களால் வீசிக் கரையை அழிக்கும். இனிப் பிற நீராடும் துறைகள் தோறும் வலமாகச் சுழித்துப் பாயும் கலங்கலையுடைய அழகிய அந்நீர். ஆண்டுதோறும் நீராடுபவரின் தம்முள் ஒத்து முத்துச் சேர்ந்த வடம், தலைக்கோல முத்து, பொன்hhல் இயற்றிய விளக்கமுடைய அணிகலன்கள் மணி முதலிய தன்னால் கொண்ட வரப்பட்டவற்றை, தம் இல்லிடத்தினின்றும் பிரிந். தமியராய் நீராடிய சிறுவர்களின் மென்மையான தலை முக்கியிடம் உள்ள முஞ்சம் என்னும் அணிகலனோடு சேரக் கொண்டு செவ்வரிகளுடன் கூடிய கண்களையுடைய மங்கையர் தம் தம் காதல் துணைவருடன் ஒருங்கு கூடி நீராடுகின்ற மதுரையிடத்து நீர்த்துறையில் எல்லாம் வரும். (11-19) : மருத நில வயல்கள். மலர்களைச் சுமந்து பொலிந்த வையை நீர் புகுந்த நிறைதலால், மசை தோன்றுவதற்க இடமான முழவு முதலிய இசைக் கருவிகளில் எழும் ஒலியையும் பாட்டையும் கற்ற ஆடு மகளிர் கூத்தாடும் மகிழ்தற்குரிய நாளில் அமைக்கப்பட்ட கூத்தரங்கின் ஒப்பனை செய்யப்பட்ட அழகைப் போன்று விளங்கும். பூம் பொழிகள் தமக்கு விருந்து அளித்த இனிய வையை நீருக்குக் கைம்மாறாக எதிர் விருந்து அளிப்பவை போல் மேலும் மெலும் நெருங்கிய வண்டகள் ஒலிப்பதற்கக் காரணமான பூந்தாதுகளுடன் நரந்தம் போல் மணம் கமழும் மலர்களை மிகவும் வழங்கும்.நறுமணம் பொருந்திய பூம்பொழில்களிலும் குளங்களிலம் ஆற்றிடைக் குறைகளிலும் வண்டுகள் கள் உண்டு களித்து இசை பாடும்படி. மலர்களால் ஆகிய அழகான திக்குகளில் எல்லாம் விளங்கியது. (20-31) : வையை ஆற்றின் வெள்ள வருகை மேலும் நீராடக்கரையை அடைந்த மகளிர்களுள் தோழியர் ஒரு காதல் பரத்தையைச் சூழ்ந்து நின்று மூங்கிலால் ஆன துருத்தியினால் அரக்கு நீரை வீசினர். அப்பரத்தை தன் தெங்கிளங்காயைப் போன்ற முலைகளின் மீது பட்ட அதனைத் துடையாதவளாய் விள்ங்கினாள். தன் பெரிய ஆடையின் முன்தானையில் ஒற்றினாள். அவ்வமயத்தே அக்காதல் பரத்தையிடம் தலைவன் வந்தனன். அவனை அந்தத் தோழியர் கண்டனர்.. அவர்கள் பொய்யாய் அத்த தலைவனை நோக்கி, யைனே! இவள் பூப்பு எய்தினாள். ஆதலால் அவளை அணுகாதத! நீங்கு என்றனர். ஆயினும் தோழியர் செய்த விளையாட்டால் தோன்றி நடைப்புடனே அவ்விடத்தினின்றும் நீகிப் பெரிய கடலில் புகுதற்கு விரையும் வையை ஆற்று நீர் போல். விரைந்து அப்பரத்தையுடன் இல்லலதில் கூடி மகிழும்படி சென்றான். அவளது மார்பில் பட்ட குருதி நறம் உடைய அரக்கு நீரை நன்க துடைத்தான். அவளைத் தழுவினான். அத்தோழியர் இல்லத்திலர் உன்ன முதிய பரத்தையர்க்கு அந்த விளையாட்டைக் கூறினர். நகைத்தலுக்காக தம் நங்கை பூப்பு எய்தினாள் அவள் பொலிவுடையவள் ஆகுக என வாழ்த்தினர். அதைக் கேட்ட காதற் பரத்தைக்கு நாணம் உண்டாகியது. (32-38) : சைய மலையினின்றும் இழிந்த அரவி போந்து வையாற்றின் இர கரைதோறும் உள்ள மலர்கn ; காத்துகள் நிறைந்த மரத்தைச் சேர்ந்து அவற்றின் மல் உதிர்ந்தமையாலே அழகை அடைந்தது. மேலும் தேன் சேர்ந்த குளிர்ந்த மலர்களும் ஆடவர் அகன்;ற மார்பிலிருந்து சேர்ந்த மலர்களும் இதழ்களும் பொருந்தப்பெற்றது. முத்தைப் பொன்று விளங்கும் மீன்களை உடைய வானத்தில் உள்ள பெருகிய அகன்ற கங்கை ஒழுகும் கூற்றை ஒத்தல் வண்டுகள் இசைபாடும் இயல்பு இவ்வையை ஆற்றுக்கு எக்காலத்திற்கும் பொருந்தும். (39-47) : மங்கையரின் மை பூசப்பெற்ற கண் என்னும் கெண்டை மீகள் உண்ணல், நீரில்ஆடுதல், காதலருடன் ஊடும் என்னும் மூன்று காரணங்களாலும் ஏற்கனவே சிவந்த நிறம் மேலும் சிவக்கும். வண்டுக்கூட்டம் தன் வாயில் சூழ்ந்து மொய்ககு ; ம், கூந்தலில் உள்ள பூவில் இருந்து தேன் துளிக்கவும். ஒரு தலைவன் நீரில் ஆடும் பரத்தையரை மீண்டும் தழுவுவான். பனியால் வளைந்து உலர்ந்தபின் நிமிர்ந்த மூங்கில் காற்றால் தள்ளுதலால் உயர்ந்து தாக்குதலால் தன்னிடத்தே உள்ள தேன் ஒழுகும் மலையினது தோற்றம் போல் விளங்கும். இவ்வாறு தோன்றச் செய்தல் பாண்டியது வையை ஆறின் இயல்பாகும். (48-49) : மேகம் மலையில் முழங்கும் அவ்வளவிலேN யஇவ்வில்புடைய வையை ஆற்றில் பெருகும் இனிய நீரின் அலைகள் கரையில் மோதி ஆரவாரம் செய்யும். (50-53) : வையையாறே! தலையில் மார்பில் மாலையுடையவராய் ஆடவரும் மகளிரும் பெருள்களைத் தானம் பண்ணி, அதன் பயனான போகத்தை அனுபவிக்க வேண்டி நாள்தோறும் தன்னிடம் நீராடுபவர். ஆதலால் அவர் உனக்குக் கொணரும் பொருளான பொன்மீன் சந்தனக்குழம்பு எழுப்பும் அகிற் புகையும் நினக்குத் ரும் உண்டியும் குறையாமல் மழை நிரம்பப் பெய்ய, நினக்கு அம்மழையினால் ஏற்படும் வெள்ளம் பெருகி எக்காலத்தும் வற்றாது நிறைவதாகுக.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 11, section 11.8, p.233", "", "hard", "false"], ["SANG-11-9", "Sangam literature", "சங்க இலக்கியம் – பரிபாடல் – வையைப் பாடல்கள்: “பாடல் : 20” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – பரிபாடல் – வையைப் பாடல்கள்: Explain the poem/passage titled “பாடல் : 20” (section 11.9).", "பாடியவர் : நல்லந்துவனார் பண் அமைத்தவர் : நல்லச்சுதனார் பண் : காந்தாரம் கடல் குறைபடுத்த நீர் கல் குறைபட எறிந்து, உடல் ஏறு உருமினம் ஆர்ப்ப, மலை மாலை முற்றுபு முற்றுபு, பெய்து சூல் முதிர் முகில் பொருது இகல் புலி போழ்ந்த பூ நுதல் எழில் யானைக் குருதி கோட்டு அழி கறை தெளி பெறக் கழீஇயின்று, 5 காலைக் கடல் படிந்து காய் கதிரோன் போய வழி மாலை மலை மணந்து மண் துயின்ற கங்குலான் வான்
