“அனைத்து ஆக, வெண்ணெய்த் தெழி கேட்கும் அண்மையால் சேய்த்து அன்றி, 35 அண்ண அணித்து ஊர் ஆயின், நன்பகல் போழ்து ஆயின், கண் நோக்கு ஒழிக்கும் கவின் பெறு பெண் நீர்மை மயில் எருத்து வண்ணத்து மாயோய்! உது காண்! பிடி துஞ்சு அன்ன அறை மேல நுங்கின் 40 தடி கண் புரையும் குறுஞ் சுனை ஆடிப் பனிப் பூம் தளவொடு முல்லை பறித்துத் தனிக் காயாம் தண்பொழில் எம்மொடு வைகிப், பனிப்படச் செல்வாய் நும் ஊர்க்கு” தலைவி கூற்று : “இனிச் செல்வேம் யாம், மா மருண்டன்ன மழைக் கண் சிற்றாய்த்தியர் 45 நீ மருட்டும் சொற்கண் மருள்வார்க்கு உரை அவை, ஆ முனியா ஏறு போல் வைகல் பதின்மரைக் காமுற்றுச் செல்வாய் ஓர் கண் குத்தி கள்வனை, நீ எவன் செய்தி பிறர்ககு ; ? 50 யாம் எவன் செய்தும் நினக்கு?” தலைவன் கூற்று : “கொலை உண்கண், கூர் எயிற்றுக் கொய் தளிர் மேனி, இனை வனப்பின் மாயோய்! நின்னின் சிறந்தார் நில உலகத்து இன்மை தெளி, நீ வருதி, மலையொடு மார்பு அமைந்த செல்வன் அடியைத் 55 தலையினால் தொட்டு உற்றேன்” “சூள், தலைவி கூற்று : ஆங்கு உணரார் நேர்ப அது பொய்ப்பாய் நீ ஆயின், தேம் கொள் பொருப்பன் சிறுகுடி எம் ஆயர் வேந்து ஊட்டு அரவத்து நின் பெண்டிர் காணாமை, காஞ்சித் தாது உக்கன்ன தாது எரு மன்றத்துத் 60 தூங்கும் குரவையுஉள் நின் பெண்டிர் கேளாமை, ஆம்பல் குழலால் பயிர் பயிர் எம் படப்பைக் காஞ்சிக் கீழ் செய்தேம் குறி” 65 தலைவன் : ஏடி! யான் உனக்கு என்ன தவறு செய்தேன்? ஏன் இவ்வாறு பாராமுகமாயிருந்தாய்? பாண்டியனோடு மாறுபட்ட வேந்தர்களின் சேனைகள் அவன் தாக்குதலுக்கு ஆற்றாவாய் அழிந்துவிடும். அகன்ற அல்குல், தோள், கண் என மூன்றிடங்களும் பெருத்தவளே! நுதல், அடி, நுசுப்பு என மூன்றும் சிறுத்தவளே! மிகவும் கவலை கொண்டவனைப் போலக் காமனும் படை விடுகின்ற வனப்பினோடு, வேற்றூரிலே மோர் விற்று விட்டுக் களைப்புடன் நீ தளர்ந்து நடந்து வரும்போது, நகைத்தே கொல்லற்கு வல்லேன் யான் என இறுமாந்து, என் உயிரோடு படைதொட்டு என்னை வருத்துகின்றவளே! நான், நினக்குச் செய்த தவறுகள் தாம் யாவையோ? தலைவி : மோர் விற்று வருவதான அஃதொன்றும் வருத்தம் அல்லவே! எங்களவர்கள் ஆயர். நாங்கள் ஆய்த்தியர். எங்கள் மரபுதானே அது. அது கிடக்க, காயாம்பூக் கண்ணியும், கருந்துவர் ஆடையும் உடையவனாக, மேய்ந்துகொண்டிருக்கும் ஆநிரையின் முன்னர்க் கோலூன்றி நிற்கின்றாயே! நீயோர் ஆயனன்றி? வேறு யாரோ? ஒருக்கால் தேவர்களுள், ஞாயிற்றுத் தேவனின் மகனோ(சனி)? தலைவன் : அதனால்தான் பேச வாய்வராமல் நிற்கின்றேன். முல்லை மொட்டும், மயிலிறகுக் குருத்தும் வரிசையாக வைத்தது போன்ற பல்லும், பணைத்த தோள்களும், பெரிதும் அமர் செய்யும் மை தீட்டிய கண்களும், நல்லவன் யானே என்று என்னுடைய நல்ல தன்மைகளையே நம்புகின்றன. இருந்தும் ஏதுமே அறியாதவனள் போலப் பேசுபவளே! உன்னோடு பேசிக் கொண்டே நிற்க இனியும் யாரால் முடியும்? தலைவி : அப்படியானால், நீ ஏதும் சொல்லல் வேண்டாம். தலைவன் : உன்னைப் போகவிடாது தடுப்பேன். தலைவி : என்ன அல்லல் பார்? பொருந்தாதன கூறிப் பிடிவாதம் செய்யும் குழந்தையைப் போல் அல்லவோ இருக்கின்றது? கண்டபொழுதே, ஏதோ கடன் கொடு;த்து வைத்தவனைப் போல, அது என்ன இது என்ன என்று, ஒவ்வொன்றாகக் கேட்கின்றாயே! உன்னிடம் நான் என்னதான் கொண்டு போய்விட்டேனோ? தலைவன் : கொண்டு போனதுவா? மோர் விற்றுத் திரும்பி வருபவளே! நீ அறியாயோ? முல்லை மலர் செறிந்த கானச் சிற்றாற்றின் அயலேயுள்ள இடத்திலே, மாவடுவைப் பிளந்தது போன்ற நின் கண்ணினால், என் நெஞ்சைக் கனவாடிக் கொண்டு, உன்னுடன் கொண்டுபோய் வைத்திருக்கிறாயே? நீயும் ஒரு கள்வியே அல்லையோ? தலைவி : உன் நெஞ்சை அடிமையாக் கொண்டு ஆட்சி செநய்தல் எனக்கு எப்படி எளிதாகும், அது, புனத்திலிருக்கிற என் தமையனுக்கு உணவு கொண்டு போகுமோ? ஆவினத்துடனிருக்கின்ற என் தந்தைக்குக் கறவைக் கலம் கொண்டு செல்லுமோ? தினையறுத்த வயலுள் என் தாய் விட்டிருக்கும் கன்றை மேய்த்துக் கொண்டிருக்குமோ? எனக்கேன் உன் நெஞ்சு? தலைவன் : அதுதான் அத்துணையும் செய்யும் ! வெண்ணெய்த் தெழி கேட்கும் அண்மையிலிருக்கிற ஊர் தானே! பொழுதோ உச்சிப் பொழுதாயிருக்கிறது. உன்னைப் பார்த்த கண், வேறொன்றைப் பாராது ஒழிக்கும் கவின் பெற்றது, நின் பெண்தன்மை மயிற் கழுத்துப் போன்ற நிறமுடைய மாயவன் நீ! இந்த வெறியலோடே ஏன் விரைந்து போகின்றாய்? அதோ பார் பிடி தூங்குவது போன்ற பெரும் பாறை. அதற்கு மேலோக நுங்கின் கண்ணிலிருந்து வரும் இளநீர் போன்ற நீருடைய சிறு சுனையிருக்கிறது. அதில் நீராடி, செம்முல்லையும் வெண்முல்லையும் பறித்துத் தனியாக அப்பொழிலிலே என்னோடு சிறிது நேரம் இருந்துவிட்டுப் பொழுது சாய்ந்த குளிர்ந்த நேரத்திலே, உன் ஊருக்குச் செல்வாயாக! தலைவி : இவ்வளவுதானே? நான் இனிப் போகின்றேன் மான் மருண்டது போன்ற கருங்கண்களை உடைய சிற்றாய்த்தியராக, நீ மயக்கும் சொற்களிலே மயங்குவார்ககு ; , அவை எல்லாம் சென்று சொல்வாயாக பசுக்களின் பின்னே திரியும் ஏற்றைப் போலர், ஒரு நாளில் பத்துப் பேரைக் காமுற்றுச் செல்பவனாயிற்றே நீ! கண்குத்திக் கள்வனே! பிறர்க்கு நீ என்னதான் இதுவரை செய்தாய்? அல்ல, நான்தான் உனக்கென்ன செய்ய வேண்டியது இருக்கிறது? தலைவன் : கொலை செய்யுங் கண், கூரிய எயிறு, கொணய் தளிர் மேணி, இத்தகைய வன்புடைய மாயோளே! நின்னிற் சிறந்தார் நிலவுலகத்திலேயே கிடையாது என்பதைத் தெரிந்து கொள். நீ என்னருகே வா! மலை போன்ற மார்பமைந்த திருமாலின் சேவடியை, என் தலையினால் தொட்டுச் சத்தியம் செய்கிறேன். தலைவி : உன்னைப் பற்றி அறியாதவர் தாம் உன்னோடு வருவார். உன் வார்த்தைகளைப் பொய்க்குபவன் தானே நீ! ஆயின், தேங்கொள் பொருப்பானான பாண்டியனின் சிறு குடியிலே வாழும் எம் ஆயர் வேந்தூட்டுச் செய்யும் ஆரவாரப் பொழுதிலே, நின் பெண்டிர்கள் காணாமல், காஞ்சித் தாது உதிர்ந்தாற் போன்ற தாது எரு மன்றத்திலே ஆடுங் கரவையுள், நின் பெண்டிர் கேளாமல், ஆம்பற் குழலாலே இசைத்து எம்மைக் கூப்பிட்டு, அந்தக் காஞ்சி மரத்தின் கீழ் வந்து சேர்வாயாக!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 2, section 2.10, p.58", "", "hard", "false"], ["SANG-3-3", "Sangam literature", "சங்க இலக்கியம் – முல்லைக்கலி 9–17: “பாடல் : 09 : சொல்ல முடியாத வனப்பு” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – முல்லைக்கலி 9–17: Explain the poem/passage titled “பாடல் : 09 : சொல்ல முடியாத வனப்பு” (section 3.3).", "கார் ஆரப் பெய்த கடி கொள் வியன் புலத்துப் பேராது சென்று பெரும் பதவப் புல் மாந்தி, நீர் ஆர் நிழல குடம் சுட்டு இனத்து உள்ளும், போர் ஆரா ஏற்றின் பொரு நாகு இள பாண்டில் தேர் ஊரச் செம்மாந்தது போல் மதை இனள், 5 பெரூரும் சிற்றூரும் கௌவை எடுப்பவள் போல் மோரோடு வந்தாள் தகைக ண்டை, யாரோடும் சொல்லியாள் அன்றே வனப்பு. பண்ணித் தமர் தந்து ஒரு புறம் தைஇய கண்ணி எடுக்கல்லாக் கோடு ஏந்து அகல் அல்குல், 10 புண் இல்லார் புண் ஆக நோக்கும் முழு மெய்யும் கண்ணளோ? ஆயமகள் இவள் தான் திருத்தாச் சுமட்டினள் ஏனைத் தோள் வீசி, வரிக்கூழ வட்டி தழீஇ, அரிக் குழை ஆடல் தகையள், கழுத்தினும் வாலிது, 15 நுண்ணிதாத் தோன்றும், நுசும்ப்பு இடை தெரியா ஏஎர் இருவரும் தம் தம் உடை வனப்பு எல்லாம் இவட்கு ஈத்தார் கொலோ? படை இடுவான் மன் கண்டீர், காமன் மடை அடும் பாலொடு கோட்டம் புகின் 20 இவள் தான் வருந்த நோய் செய்து இறப்பின் அல்லால் மருந்து அல்லள் யார்க்கும் அணங்கு ஆதல் சான்றாள் என்று, ஊர்ப் பெண்டிர் மாங்காய் நறுங் காடி கூட்டுவேம்; யாங்கும் எழு நின் கிளையொடு போக என்று தம் தம் கொழுநரைப் போகாமல் காத்து முழு நாளும், 25 வாயில் அடைப்பவரும் . பெருமழையும் நிலங்குளிரப் பெய்தது. மண்மணமும் எங்கணும் கமழ்ந்தது. அகன்ற புலத்திலே, அதைவிட்டுப் பிரியாது சென்று, பெரிதாயிருக்கின்ற அறுகம்புல்லை மேய்ந்து விட்டு, நீர் போன்ற குளிர்ந்த நிழலிடத்திலே கிடக்கும் குடப் பால் சுரக்கும் ஆவினத்துக்கும், போர்குணம் அமைந்த ஏற்றினுக்கும் பிறந்த இளைய எருதானது, வண்டியிலே பூட்டினாற் செம்மாந்து செல்வது போலச் செம்மாந்து வருகிறாளே! இவள் தாம் யாரோ? பேரூரும் சிற்றூரும் ஒருங்கே ஆரவாரம் எழச் செய்பவளைப்போல, மோரோடு வந்தவனின் தகைமையைக் கண்டாயோ? நெஞ்சமே! யாரோடும் சொல்லி ஒப்பிட முடியாததாக அன்றோ இருக்கிறது, இவளது பெருவனப்பு! இவளை அழகுபண்ணித் தமர் தந்து ஒருபுறம் செருகி வைத்த கண்ணியைச் சுமக்க மாட்டாத, பக்கம் உயர்ந்த பரந்த அல்குல், காமவேட்கை அற்றவர்களையும் புண்படுமாறு பார்க்கின்றதே! இந்த ஆயமகள் மேனி முழுவதுமே கண்ணுடையவளோ? இவன் தான் திருத்தமின்றி இருக்கும் அம்மையை உடையவள். மேலும், தோள்வசீ p, வரிக்கூழ் வட்டியை ஒரு கையால் அணைத்துக் கொண்டே, காதில் குழையாட வருகின்றாளே! அத்தகையவள் கழுத்திலும், அழகாகவும் நுண்ணிதாகவும் தோன்றுகின்றதே அவள் இடை! இடை தெரியா அழகுடைய ஊர்வசி திரேலாத்தமை இருவரும் தத்தம்முடைய வனப்பை எல்லாம் இவளுக்குத் தந்து விட்டார்களோ? நைவேத்தியத்திற்கு பாலோடு இவள் காமகோட்டம் சென்றாளென்றால், அந்தக் காமனே இவளக் கண்டதும் மயங்கிப் படையைக் கைநழுவ விட்டுவிடுவானே? இவள் தான், பிறர் வருந்த நோய் செய்து சாகச் செய்வானேயன்றி, நோய் தீர்ககு ; ம் மருந்தாகுபவள் அல்லள். யார்க்கும் அணங்காகுதல் ஒத்தவள் என்று ஊர்ப் பெண்டிர் ஐயுற்றனர். புளிமாங்காய் கூட்டுவோம். எங்கும் இருக்கும் நின் கிளையோடும் இவ்வூரை விட்டுப் போய்விடம்மா! என்று தத்தம் கொழுநரை வெளியே விடாமல் காத்து, முழு நாளும் வாயிலை அடைந்திருக்கச் செய்தனர். அவ்வாறு எவரையும் வருந்துபவளல்லளோ இவள்!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 3, section 3.3, p.64", "", "hard", "false"], ["SANG-3-4", "Sangam literature", "சங்க இலக்கியம் – முல்லைக்கலி 9–17: “பாடல் : 10 : தேள் கடி மருந்தோ!” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – முல்லைக்கலி 9–17: Explain the poem/passage titled “பாடல் : 10 : தேள் கடி மருந்தோ!” (section 3.4).", "தலைவியை நோக்கித் தலைவன் உரைத்தல் : கடி கொள் இருங்காப்பில் புல்லினத்து ஆயர் குடிதொறும் நல்லாரை வேண்டுதி! எல்லா! இடு தேள் மருந்தோ நின் வேட்கை? தொடுதரத் துன்னித் தந்தாங்கே நகை குறித்து எம்மைத் திளைத்தற்கு எளியமாக் கண்டை அளைக்கு எளியாள் 5 வெண்ணெய்க்கும் அன்னள் எனக் கொண்டாய் ஒண்ணுதால்! ஆங்கு நீ கூறின் அனைத்து ஆக நீங்குக அச்சத்தான் மாறி அசைவினான் போத்தந்து நிச்சம் தடுமாறும் மெல்லியல் ஆய்மகள்! மத்தம் பிணித்த கயிறு போல் நின் நலம் 10 சுற்றிச் சுழலும் என் நெஞ்சு. விடிந்த பொழுதினும் இல் வயின் போகாது, கொடும் தொழுவினுள் பட்ட கன்றிற்குச் சூழும் கடுஞ்சூல் ஆ நாகு போல், நின் கண்டு நாளும் நடுங்கு அஞர் உற்றது என் நெஞ்சு. 15 எவ்வம் மிகுதர எம் திறத்து எஞ்ஞான்றும், நெய் கடை பாலின் பயன் யாதும் இன்று ஆகிக், கை தோயல் மாத்திரை அல்லது, செய்தி அறியாது அளித்து என் உயிர். தலைவி கூற்று : அன்னையோ! மன்றத்துக் கண்டாங்கே சான்றார் மகளிரை 20 இன்றி அமையேன் என்று இன்னவும் சொல்லுவாய்; நின்றாய் நீ சென்றீ! எமர்காண்பர்! நாளையும் கன்றொடு சேறும் புலத்து. தலைவி : ஏடா! கடுமையான காவலுடையவர் ஆட்டிடையர். அவர் குடிதோறும் உள்ள மகளிரை எல்லாம் நீ விரும்புகின்றாயே? உன் வேட்கைதான் என்ன, தேட்க ; டி மருந்தோ? தொட்டுப் போகட்டுமே என்று நினைத்து இசைவு தந்தால், நகையாட நினந்து, எம்மைக் கூடி மகிழ்தற்கும் எளியவள் என நினைத்தாயோ? மோர்தான் தந்தாளே, வெண்ணெயே வேண்டினாலும் அப்படித்தானே மாறாது தருவாள் என்று, நீயும் எண்ணிக் கொண்டாயோ? தலைவன் : ஒண்ணுதலாளே! அப்படி நீ கூறினால், அதுவே யாகுக. நீ என்னை நீங்கிப் போய்விடுக! அச்சத்தால் மறுத்துரைத்து, தன் அசைவினால் என்னருகே வந்து, நித்தமும் தடுமாறும் மெல்லியலான ஆய் மகளே! மத்திலே பிணித்த கயிறுபோல், நின் நலத்தையே சுற்றிச் சுற்றி என் நெஞ்சமும் சுழலுகின்றதேடி? பொழுது விடிந்த பின்னும் வீட்டை விட்டு மேய்சச ; லுக்குப் போகாது, வளைந்த தொழுவினுள் கட்டியிருக்கும் தன் கன்றையே நினைந்து கொண்டிருக்கும் தலையீற்றுப் பசுப்போல, நின்னைக் கண்டு நாளும் நடுங்குகின்ற வருத்தத்தை உடையதாயிருக்கிறதேடீ. என் நெஞ்சி! துயரம் மிகுதியாக, என்னிடத்திலே, நெய் கடைந்து எடுத்துவிட்ட பாலினைப்போலப் பயன் யாதும் இல்லாதாகி விட்டது. கையால் தழுவியது மட்டுமின்றி, உன் உள்ளத்து நினைவு அறியாமலும் தடுமாறுகின்றேன். எடுத்த என் உயிரையாவது என்னிடம் மீளவும் அளித்து விடுவாயடீ! தலைவி : அம்மையே! மன்றத்துப் பார்த்த உடனேயே, சான்றோர் மகளிரைப் பார்த்து, இன்றி அமையேன் என்று இப்படி எல்லாம் சொல்லுகின்றாயே! ஏன் நிற்கின்றாய்? போய்விடு. எம்மவர் பார்த்து விடுவார்கள். நாளைக்குக் கன்றோடு மேய்சச ; ற் காட்டுக்கு வந்து சேருவேன்!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 3, section 3.4, p.66", "", "hard", "false"], ["SANG-3-5", "Sangam literature", "சங்க இலக்கியம் – முல்லைக்கலி 9–17: “பாடல் : 11 : பேச்சுக்குப் பின்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – முல்லைக்கலி 9–17: Explain the poem/passage titled “பாடல் : 11 : பேச்சுக்குப் பின்” (section 3.5).", "தீம் பால் கநற்த கலம் மாற்றக், கன்று எல்லாம் தாம்பின் பிணித்து மனை நிறீஇ, யாய் தந்த பூங்கரை நீலம் புடை தாழ மெய் அசைஇ, பாங்கரும் முல்லையும் தாய பாட்டங்கால் தோழி, நம் புல்லினத்து ஆயர் மகளிரோடு எல்லாம் 5 ஒருங்கு விளையாட, அவ்வழி வந்த குருந்தம் பூங்கண்ணிப் பொதுவன் மற்று என்னை, “முற்று இழை ஏஎர் மட நல்லாய்! நீ ஆடும் சிற்றில் புனைகோ சிறிது?” என்றான்; “எல்லா! நீ பெற்றேம் யாம் என்று பிறர் செய்த இல் இருப்பாய், 10 கற்றது இலை மன்ற காண்” என்றேன்; முற்று இழாய்! தாது சூழ் கூந்தல் தகைபெறத் தைஇய கோதை புனைகோ நினக்கு?” என்றான்; எல்லா! நீ ஏதிலார் தந்த பூக் கொள்வாய் நனி மிகப் பேதையை மன்ற பெரிது” என்றேன்; “மாதராய்! 15 ஐய பிதிர்ந்த சுணங்கு அணி மென் முலை மேல் தொய்யில் எழுதுகோ மற்று?” என்றான்; “யாம் பிறர் செய் புறம் நோக்கி இருத்துமோ நீ பெரிது மையலை மாதோ விடுக” என்றேன்; தையலாய்! சொல்லிய ஆறு எல்லாம் மாறு மாறு யான் பெயர்ப்ப, 20 அல்லாந்தான் போலப் பெயர்ந்தான், அவனை நீ ஆயர் மகளிர் இயல்பு உரைத்து, எந்தையும் யாயும் அறிய உரைத்தீயின் யான் உற்ற நோயும் களைகுவை மன். தோழி! இனிய பாலைக் கறந்த கலமெல்லாம் எடுத்து வைத்தேன். கன்றுகளை எல்லாம் தாம்பிலே பிணித்து வீட்டிற்குக் கொண்டு வந்து கட்டினேன். தாய் தந்த பூங்கரை இட்ட நீலச்சிற்றாடை இடையிலே தவழ, மெய்யை அசைத்துப் பாங்கரும் முல்லையும் பரந்த பாட்டங்காலிலே, ஆட்டினத்து ஆயர் மகளிரோடு சேர்ந்து, எல்லோருமாக விளையாடினோம். அந்த வழியே வந்தான் குருந்தம் பூக் கண்ணி சூடியிருந்தவனான பொதுவன் ஒருவன். அவன் முற்றவும் இழையணிந்த அழகிய மடப்பமுடைய பெண்ணே! நீ ஆடும் சிற்றிலையேனும் சிறிது புனையட்டுமோ? என்றான். ஏடா! நீ, பெற்றோம் யாம் என்று பிறர் செய்த வீட்டிலே இருக்கின்றவன். உனக்கென்று ஒரு வீடு கட்டக் கற்றதில்லை. அதனைக் காண்பாய்! என்றேன். முற்றிழாய்! தாதுசூழ் கூந்தல் தகைபெற முடித்துக் கோதையும் நினக்குப் புனைகின்றேனே! என்றேன். ஏடா! ஏதுமற்றவர் தந்த பூவானாற் கொள்வாய்! நீ மிகவும் பேதையன்று, அதனினும் பெரிது! என்றான். மாதராய்! தேமல் படர்ந்த நின் மென்முலைகளின் மேல் தொய்யில் எழுதட்டுமோ? என்றான். யாம் பிறர் செய்யும் அழகைப் பார்த்துக் கொண்டிருபோமோ! நீ பெரிதும் மையல் கொண்டுள்ளாய். என்னை விட்டு அகன்று போய்விடுக என்றேன். தையலே! அவன் சொன்னதற்கெல்லாம் எதிருக்கு எதிராக நான் திருப்பிச் சொல்லவும். அயர்வுடையவன் போல அங்கிருந்து அவனும் அகன்று சென்றான். அவனிடம் நீ சென்று, ஆயர் மகளின் இயல்பினை உரைத்து, என் தந்தையும் தாயும் அறிய மணம் பேசி வருமாறு சொன்னாயானால், நானுற்ற நோயினையும் களைந்து போக்கியவள் ஆவாயடீ!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 3, section 3.5, p.67", "", "hard", "false"], ["SANG-3-6", "Sangam literature", "சங்க இலக்கியம் – முல்லைக்கலி 9–17: “பாடல் : 12 : தழுவாதே என்றாரோ? : தலைவி கூற்று” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – முல்லைக்கலி 9–17: Explain the poem/passage titled “பாடல் : 12 : தழுவாதே என்றாரோ? : தலைவி கூற்று” (section 3.6).", "யார் இவன் என்னை விலக்குவான்? நீர் உளர் பூம் தாமரைப் போது தந்த விரவுத் தார்க் கல்லாப் பொதுவனை நீ மாறு நின்னொடு சொல்லல் ஓம்பு என்றார் எமர். தலைவன் கூற்று : எல்லா! கடாஅய கண்ணால் கலைஇய நோய் செய்யும் 5 நடாஅக் கரும்பு அமன்ற தோளாரைக் காணின் விடாஅல் ஓம்பு என்றார் எமர். தலைவி கூற்று : கடாஅயார் நல்லாரைக் காணின் விலக்கி நயந்து அவர் பல் இதழ் உண்கண்ணும் தோளும் புகழ் பாட நல்லது கற்பித்தார் மன்ற நுமர், பெரிதும் 10 வல்லர் எமர் கண் செயல். தலைவன் கூற்று : ஓஒ வழங்காப் பொழுது நீ கன்று மேய்ப்பாய் போல் வழங்கல் அறிவார் உரையாரேல் எம்மை இகழ்ந்தாரே அன்றோ எமர்? தலைவி கூற்று : ஒக்கும் அறிவல் யான் எல்லா விடு; 15 தலைவன் : விடேன் யான்; என் நீ குறித்தது இருங்கூந்தால் நின்னை என் முன் நின்று சொல்லல் ஓம்பு என்றமை அன்றி அவனை நீ புல்லல் ஓம்பு என்றது உடையரோ, மெல்ல முயங்கு நின் முள் எயிறு உண்கும், எவன் கொலோ, 20 மாயப் பொதுவன் உரைத்த உரை எல்லாம் வாய் ஆவது ஆயின், தலைப்பட்டாம் பொய் ஆயின், சாயல் இன் மார்பில் கமழ் தார் குழைத்த நின் ஆய் இதழ் உண்கண் பசப்பத் தட மென் தோள் சாயினும் ஏஎர் உடைத்து. 25 தலைவி : யாரோடா இவன்? என்னை வழிமறிக்கின்றானே? நீரிலோ உள்ள பூந்தாமரையின் இதழ்களைத் தந்த, பல மலர் சேர்ந்த மாலையணிந்திருக்கும் முறைகல்லாத பொதுவனே! உன்னோடு பேசாமலிரு என்று என் சுற்றத்தார் சொல்லியுள்ளனர். என் வழியை விட்டு விலகி நின்றுவிடு. தலைவன் : ஏடீ! வேட்கை செலுத்;திய கண்ணால் என் உள்ளம் நிலைகுலைய நோய் செய்கின்றவளே! நடாத கரும்பு போன்ற தோளாரைக் கண்டால், அவரைக் கைந்தழுவ விட்டு விடாதே! என்று என்னவர்கள் சொல்லியிருக்கிறார்களே! யான் என்னேடி செய்வேன்? தலைவி : அங்ஙனம் சொன்னார்களோ? பெண்களைக் கண்டால், வழிமறித்து, அவர்மேல் காமுற்று, அவர்கள் பல் இதழ் உண்கண்ணும் தோளும் புகழ்ந்து பாட நல்ல முறையைத் தான் கற்பித்திருக்கிறார்கள், உன் சுற்றத்தார்! வல்லவரானால், ஏன் என் பெற்றோரிடம் வந்து காட்டுவதுதானே! தலைவன் : ஓஓ! யாரும் வெளியே வராத இந்த உசிச வேளையிலே, நீ கன்று மேய்ப்பவளைப் போல வருவதை அறிந்தவர்கள், அப்படிச் சொல்லாவிட்டால், எம்மை இகழ்சச ; pயாகக் கருதினவர்களாக அல்லவோ போய்விடுவர்? தலைவி : ஒக்கும். எல்லாம் யானும் அறிவேன். ஏடா! வழியை விட்டு விலகி நில் தலைவன் : விடமாட்டேன். கரிய கூந்தலை உடையவளே. நீ என்ன சொன்னாய்? நின்னை என்முன் நின்று சொல்லாடாது தவிர்க என்று நின்னவர் நினக்குச் சொன்னார்களேயன்றி, அவனை நீ தழுவுதல் கூடாது என்றும் சொன்னார்களோ? மெல்ல என்னைத் தழுவிக் கொள். நின் முள்ளெயிற்றில் ஊறிவரும் அமுதத்தை உண்கிறேன். வா. தலைவி : (நெஞ்சுடன் கூறுவாள் போல) என்ன சேய்வேனோ? மாயப் பொதுவன் உரைத்த உரை எல்லாம் உண்மையேயானால், அவனோட வாழ்க்கைப்பட்டோம். பொய்யாயிருந்தால் இனிய சாயலினை உடைய மார்பின் மணமாலையைக் கசக்கிய நின் அழகிய மையுண்ட கண்கள் பசலையால் நிறையும். அகன்ற மென் தோள்கள் தளரும். அதுவும் அழகுடையதுதான்! (இதனால், அவள் இசைகின்றாள் எனக்காட்ட, அவன் மகிழ்ந்தான்.)", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 3, section 3.6, p.68", "", "hard", "false"], ["SANG-3-7", "Sangam literature", "சங்க இலக்கியம் – முல்லைக்கலி 9–17: “பாடல் : 13 : குற்றம் ஏதுமில்லை” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – முல்லைக்கலி 9–17: Explain the poem/passage titled “பாடல் : 13 : குற்றம் ஏதுமில்லை” (section 3.7).", "தலைவன் கூற்று : நலம் மிக நந்திய நயவரு தட மென் தோள், அலமரல் அமர் உண்கண், அம் நல்லாய்! நீ உறீஇ, உலமரல் உயவு நோய்ககு ; உய்யும் ஆறு உரைத்துச் செல். தலைவி கூற்று : பேர் ஏமுற்றார் போல முன் நின்று விலக்குவாய் யார்? எல்லா! நின்னை அறிந்ததூஉம் இல்வழி? தலைவன் கூற்று : தளிர் இயால்! என் அறிதல் வேண்டின், பகை அஞ்சாப் புல்லினத்து ஆயர் மகனேன், மற்று யான். தலைவி கூற்று : ஒக்கும் மன். புல்லினத்து ஆயனை நீ ஆயின், குடம் சுட்டு நல் இனத்து ஆயர் எமர். 10 தலைவன் கூற்று : எல்லா! நின்னொடு சொல்லின் ஏதமோ இல்லை மன். ஏதம் அன்று எல்லை வருவான் விடு. தலைவன் கூற்று : விடேன். உடம்பட்டு நீப்பார் கிளவி மடம் பட்டு, 15 மெல்லிய ஆதல் அறியினும், மெல்லியால்! நின் மொழி கொண்டு யானோ விடுவேன், மற்று என் மொழி கொண்டு என் நெஞ்சம் ஏவல் செயின்? தலைவி கூற்று : நெஞ்சு ஏவல் செய்யாது என நின்றாய்க்கு, எஞ்சிய காதல் கொள் காமம் கலக்குற ஏதிலார் 20 பொய்ம் மொழி தேறுவது என்? தலைவன் கூற்று : தெளிந்தேன், தெரி இழாய் யான்! பல்கால் யாம் கான் யாற்று அவிர் மணல் தண் பொழில் அல்கல் அகல் அறை ஆயமொடு ஆடி, முல்லை குருந்தொடு முச்சி வேய்ந்து எல்லை 25 இரவு உற்றது இன்னும் கழிப்பி, அரவு உற்று உருமின் அதிரும் குரல் போல் பொரு முரண் நல்ஏறு நாகு உடன் நின்றன், பல் ஆன் இன நிரை நாம் உடன் செலற்கே. தலைவன் : நன்மை மிகப்பெருகிய, விருப்பம் வருகின்ற, மென்மையான தோள்களையும், சுழல்கின்ற அமர்த்த கண்களையும், அழகையும் உடைய நல்லவளே! நீ எனக்குற்ற வருத்தும் நோய்க்கு, நான் பிழைக்குமாறு, உறுதியான நெறியை உரைத்துவிட்டுப் போவாயாக! தலைவி : பெரிதும் பித்தனைப்போல என் முன்னே வந்து நின்று வழி மறைக்கின்றாயே, ஏடா? யார் நீ? நின்னை நான் இதன் முன்னே அறிந்ததும் இல்லையேடா? தலைவன் : தளிரைப் போன்ற இயல்பினளே! என்னை யாவனென்று அவியர் வேண்டினார், பகைக்கு அஞ்சாத புல்லினத்து ஆயர் மகன் ஆவேன் யான் என்று அறிவாயாக. தலைவி : புல்லினத்து ஆயனோ நீ! ஆனால், குடப்பால் கறக்கும் நல்லினத்து ஆயரன்றோ எம்மவர்? தலைவன் : ஏடீ! உன்னோடு ஏதும் சொன்னால் குற்றமோ? இல்லையன்றோ? தலைவி : குற்றமேதும் இல்லை. நாளை வருகின்றேன். இவ்வேளை வழியை விட்டுவிடு. தலைவன் : விடேன்! உடன்படுவது போலப் பேசிப் பிரிபவரின் சொற்களைக் கேட்டு, மடம்பட்டு, மென்மையானவை என்று என் காதுகள் அறிகின்றன. மெல்லியலே! என் மொழி கொண்டு உன் மொழியைக் கொள்ளாது, என் நெஞ்சம் என்னைத் தூண்டி விடுகின்றபோது, உன் வார்த்தையைக் கேட்டு நானும் உன்னைப் போகவிடுவேனோ? தலைவி : நெஞ்சுதான் ஏவல் செய்யவில்லை என்றுஞ நிற்கின்றாயே! அதள் பின் காதல் கொள்ளும் காமம் கலக்கத்தைச் செய்ய, உனக்கு உறவற்ற எனது வார்த்தையைப் பொய் மொழியாகத் தெளிவது மட்டும் ஏனோ? தலைவன் : தெரிஇழாய்! இப்போது நீ உண்மையைச் சொன்னாய் என அறிந்தேன். தலைவி : முன்னர்ப் பலமுறை யாம் கானாற்று அவிர் மணல் படர்ந்த தண்மொழியிலேயுள்ள அகன்ற பாறையிலே ஆயத்தோடு மலர்களால் தலையை அலங்காரம் பண்ணியும் வருவதனால், பொழுதோ போயிற்று. இரவும் நெருங்குகின்றது. இன்னமும் நேரங் கடத்தாதே! தலைவன் : பாம்பு கடித்துக் கதறும் ஏற்றின் குரலைப் போல் அதிரும், பொருகின்ற முரண் கொண்ட நல்லேறுகள் பெண் எருமையுடன் சேர்ந்து நின்றன. நம்முடன் வீடு திரும்பப் பல ஆக்கள் கொண்ட நிரையும் புறப்படுகின்றன வா, நாமும் செல்வோம்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 3, section 3.7, p.70", "", "hard", "false"], ["SANG-3-8", "Sangam literature", "சங்க இலக்கியம் – முல்லைக்கலி 9–17: “பாடல் : 14 : இருமணம் இயல்பன்று!” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – முல்லைக்கலி 9–17: Explain the poem/passage titled “பாடல் : 14 : இருமணம் இயல்பன்று!” (section 3.8).", "தலைவி கூற்று : வாரி நெறிப்பட்டு இரும் புறம் தாஅழ்ந்த ஓரிப் புதல்வன் அழுதனன் என்பவோ, புதுவ மலர் தைஇ, எமர் என் பெயரால், வதுவை அயர்வாரை கண்டு? “மதி அறியா ஏழையை” என்று அகல நக்கு வந்தீயாய் நீ 5 தோழி அவன் உழசை; சென்று. தோழ்p கூற்று : சென்று யான் அறிவேன்; கூறுக மற்று இனி. தலைவி கூற்று : சொல் அறியாப் பேதை! “மட்வை! மற்று எல்லா! நினக்கு ஒரூஉம்; மற்று என்று அகல் அகலும்; நீடு இன்று நினக்கு வருவதாக் காண்பாய்”, அனைத்து ஆகச் 10 சொல்லிய சொல்லும் வியங்கொளக் கூறு. தருமணல் தாழப் பெய்து இல் பூவல் ஊட்டி, எருமைப் பெடையோடு, எமர் ஈங்கு அயரும் பெரு மணம் எல்லாம் தனித்தே ஒழிய, வரி மணல் முன்துறைச் சிற்றில் புனைந்த 15 திரு நுதல் ஆயத்தார் தம்முள் புணர்ந்த ஒரு மணம் தான் அறியும்; ஆயின் எனைத்தும் தெருமரல் கைவிட்டு இருக்கோ, அலர்ந்த விரி நீர் உடுக்கை உலகம் பெறினும், அருநெறி ஆயர் மகளிர்க்கு 20 இரு மணம் கூடுதல் இல் இயல்பு அன்றே? தலைவி : தோழி! வாரி நெறிப்பட்டுப் பின்புறம் தாழ்ந்த கூந்தலினையுடைய தம் புதல்வன் அழுதனன் என்று சொல்லுகிறார்களோ, அவனைப் பெற்றோர்? ஏனடீ, அவன் இவ்வாறு என்னை மறந்தான்? அவனிடம் சென்று, புதுமலர் சூடி, என் சுற்றத்தார் என் வதுவையினை நிகழ்த்தப் போவதைக் கண்டும். புத்தியில்லாத கோழையோ நீ என்றுக் கேட்டுப் பெரிதும் நகையாடி வாராயோடி! தோழி : அவன்பாற் சென்று நான் அறிந்து வருகின்றேன். பிறவற்றை நீ இனிக் கூறுக. தலைவி : சொல்லினைச் சொல்லற்கும் அறியாத பேதாய்! மடவோய்! மற்று, ஏடா! நினக்கும் இதுதான் நேரும் என்று சொல்லி வந்துவிடு காலமோ அதிகமில்லை. உனக்கு வருவதாகக் காண்பாய் என்று சொல்வதை மட்டும் நன்கு விளக்கமாக அவன் புரியுமாறு கூறுவாயாக. ஆற்று மணலைக் கீழெல்லாம் கொட்டி, வீட்டுக்குச் செம்மண் பூசி, பெட்டை எருமையோடு எம்மவர் இங்கே செய்கின்ற பெருமணம் எல்லாம், அவனின்றித் தனித்தே மகிழ்சச ; p தராதேயே ஒழிகின்றதே? ஆற்று அறல் மணல் குவிந்த துறையிலே, சிற்றில் புனைந்த சிறுநுதல் ஆயத்தவர்களிடையிலே, தம் காதலனோடு கூடும் ஒரு மணந்தான் உண்டென்று அறிவானானால், எப்படியும் நான் வாடிய என்னைக் கைவிட்டிருப்பானோ? பரந்த திரை விரிகின்ற கடலை எடுத்திருக்கும் உலகமே கிடைக்கப் பெறினும், அருநெறி பேணுபவர் ஆயர் மகளிர். அவர்ககு ; இருமணம் கூடுதல் என்பது என்றும் இல்லற நெறியல்லவே!", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 3, section 3.8, p.72", "", "hard", "false"], ["SANG-3-4-b", "Sangam literature", "சங்க இலக்கியம் – முல்லைக்கலி 9–17: “பாடல் : 15 : களவு வெளிப்பட்டது : தலைவி கூற்று” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – முல்லைக்கலி 9–17: Explain the poem/passage titled “பாடல் : 15 : களவு வெளிப்பட்டது : தலைவி கூற்று” (section 3.4).", "தோழி! நாம் காணாமை உண்ட கடும் கள்ளை, மெய் கூர நாணாது சென்று நடுங்க உரைத்தாங்குக், கரந்ததூஉம் கையொடு கோட்பட்டாம் கண்டாய், நம் புல்லினத்து ஆயர் மகன் சூடி வந்தது ஓர் முல்லை ஒரு காழும் கண்ணியும், மெல்லியால்! 5 கூந்தலுள் பெய்து முடித்தேன் மன் தோழி! யாய் வெண்ணெய் உரைஇ விரித்த கதுப்போடே அன்னையும் அத்தனும் இல்லரா யாய் நாண, அன்னை முன் வீழ்ந்தன்று அப்பூ; அதனை வினவலும் செய்யாள், சினவலும் செய்யாள், 10 நெருப்புக் கை தொட்டவர் போல விதிர்த்திட்டு, நீங்கிப் புறங்கடை போயினாள்; யானும் என் சாந்து உளர் கூழை முடியா நிலம் தாழ்ந்த பூங்கரை நீலம் தழீஇத் தளர்பு ஒல்கிப், பாங்கரும் கானத்து ஒளித்தேன்; ………… தோழி கூற்று : ………….. ……………. அதற்கு எல்லா! 15 ஈங்கு எவன் அஞ்சுவது? அஞ்சல் அவன் கண்ணி நீ புனைந்தாய், ஆயின் நமரும் அவன் கண் அடை சூழ்ந்தார் நின்னை; அகல் கண் வரைப்பில் மணல் தாழப் பெய்து, திரைப்பில் வதுவையும் ஈங்கே அயர்ப் அதுவே யாம் 20 அல்கலும் சூழ்ந்த வினை. தலைவி : தோழி! பெற்றோர்களுள் மறைத்துக் கள்ளுண்ட ஒருவன், வெறியின் மிகுதியால் தன் மடல் கட்டுப்பாடற்றுப் போயின நிலையில், அவர்முன் செல்வதற்கும் நாணாது சென்று அவர் நடுங்குமாறு பேச்சைக் கொட்டுவானல்லுவோ? அவன் நிலைபோலவே ஆயிற்றடி என் நிலைமை! நாம் பெற்றோர் அறியாது மறைத்தோமே களவு வாழ்க்கை, அதுதான் இன்று கையோடு பிடிபட்டு விட்டதடீ? தோழி : விளக்கிச் சொல்லடீ. தலைவி : நம் காதலனாகிய புல்லினத்து ஆயர் மகன் இருக்கிறானே அவன், ஒரு நாள் முல்லைச் சரமும் கண்ணியும் சூடியவனாக வந்தான். மெல்லியலே! அதனை வாங்கி நான் ஆர்வமுடன் என் கூந்தலுள் வைத்து முடித்துக் கொண்டேன். வீட்டிற்குச் சென்றதும், செவிலித்தாய் என்னைத் தலைவாரி முடிக்க அழைத்தாள், வெண்ணெய் தடவித் தலையை விரித்துக் கோதினாள். தலையினுள் இருந்த பூ அவள் முன்னே விழுந்தது. செவிலித்தாய் நம்மையும் அறியாது இஃதெவ்வாறு வந்ததோ? என நினைத்து நாணினாள். என் அன்னையும் அத்தனும் அன்று வீட்டிலேயே இருந்தனர். செவிலித்தாய், என்னிடம் ஏதுமே கேட்கவில்லை. என்னைச் சினத்து கொள்ளவுமில்லை. நெருப்பினைக் கைதொட்டவர் போல விதிர் விதிர்த்து அந்த இடத்தைவிட்டு எழுந்து புறங்கடைக்குப் போய்விட்டாள். நான், என் கூந்தலை வாரி முடித்துக்கொண்டு தரையிலே வீழ்ந்த பூங்கரையிட்ட நீலச் சிற்றாடையைக் கையிலே பற்றிப் பிடித்துக்கொண்டு, மெல்ல மெல்ல நடந்து, வீட்டிற்கருகே இருந்த இக்குறுங்காட்டினுள்ளேயும் வந்து ஒளிந்து கொண்டேன். தோழி : அதற்கு இங்கிருந்தே ஏனடீ. பயந்து நடுங்குகின்றாய்? அஞ்சாதே! அவன் கண்ணியை நீ சூடினாய், ஆதலால், நம்மவர் உன்னை அவனுக்கே மணஞ்;செய்து தர முடிவு செய்தனர். நம் வீட்டு முற்றத்திலே புது மணலைப் பரப்புகின்றனர். பந்தரிட்டு அங்கே திருமணமும் நடத்துவர். அதுதானேடி நாம் நாள்தோறும் எண்ணிய செயல் அது இப்போது பலித்திருக்கிறது. நீ ஏனடி பதுங்கிக் கொண்டிருக்கின்றாய்?", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 3, section 3.4, p.73", "", "hard", "false"], ["SANG-3-10", "Sangam literature", "சங்க இலக்கியம் – முல்லைக்கலி 9–17: “பாடல் : 16 : அங்கே வருவாய்! : தலைவி கூற்று” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – முல்லைக்கலி 9–17: Explain the poem/passage titled “பாடல் : 16 : அங்கே வருவாய்! : தலைவி கூற்று” (section 3.10).", "பாங்கு அரும் பாட்டங்கால் கன்றொடு செல்வேம்; எம் தாம்பின் ஒரு தலை பற்றினை, ஈங்கு எம்மை முன்னை நின்று ஆங்கே விலக்கிய எல்லா! நீ என்னை ஏமுற்றாய்! விடு! தலைவன் கூற்று : விடேஎன்! தொடீஇய செல்வார்த் துமித்து. எதிர் மண்டும் 5 கடு வய நாகு போல் நோக்கித் தொழு வாயில் நீங்கிச் சினவுவாய் மற்று. தலைவி கூற்று : நீ நீங்கு! கன்று சேர்ந்தார்கண் கத ஈற்று ஆ சென்றாங்கு வண்கண்ணள் ஆய்வரல் ஓம்பு. தலைவன் கூற்று : யாய் வருக ஒன்றோ பிறர் வருக, மற்று நின் 10 கோ வரினும் இங்கே வருக, தளரேன் யான் நீ அருளி நல்க பெறின். தலைவி கூற்று : நின்னை யான் சொல்லினவும் பேணாய்; நினைஇ கனை பெயல் ஏற்றின் தலை சாயத்து, எனையதூஉம் மாறு எதிர் கூறி மயக்குப்படுகுவாய்! 15 கலத்தொடு யாம் செல்வுழி நாடிப் புலத்தும் வருவையால் நாண் இலி நீ! தலைவி : ஊருக்குப் பக்கத்திலேயுள்ள தோட்டத்திற்குக் கன்றோடு செல்கின்றேன். என் தாம்புக் கயிற்றின் ஒரு முனையைப் பற்றினாய்! இங்கு, என்னை முன்னே வந்து நின்று தடுத்தும் நிறுத்துகின்றாய்! ஏடா! நீ என்ன பித்தம் பிடித்தவனோ? வழியை விடுவாயடா! தலைவன் : வழியை விடேன். தன்னைப் பிடிக்க வருவாரைக் கீழே தள்ளிவிட்டு எகிறி ஓடும் கொடிய பெண் எருமைக் கன்றைப் போல, வீட்டை விட்டு வெளியே வந்துள்ள நீ, என்னையும் பிடித்துத் தள்ளிவிட்டு, நின் வழியில் போகலாமே? தலைவி : வழியை விட்டு விலகி நில்லடா! தன் கன்றைத் தளைப்பவர் மீது, சினத்துடன் பாய்ந்து செல்லும் தலையீற்றுப் பசுவை போல, உன்னைத் தக்கபடி ஒறுப்பதற்கு என் தாயாரும் இங்கே வந்து விடுவாள், பாராய்! தலைவன் : தாய் வரினும் வருக. பிறர் எவர் வரினும் வருக! மற்று, நின் அரசனே வந்தாலும் வருக. நின்னால் அன்புசெய்யப் பெற்றேனானால் அவர், எவர் வந்தாலும் நான் அஞ்சித் தளர்ந்துவிட மாட்டேன். தலைவி : உனக்கு, நான் என்னெ;ன சொல்லியும், அவற்றை எல்லாம் பொருட்படுத்த மாட்டேன் என்கிறாயே! நினைத்துப்பார். பெருமழை பெய்யும் போது, அசையாமல் தலை சாய்த்து நிற்கின்ற ஏறுபோல, ஆடாது அசையாது நிற்கின்றாயே? என்ன சொல்லினும், மாறாக எதிர்த்து மற்றொன்று சொல்லிக் காம மயக்கத்திலேயே ஆழ்ந்து விடுகிறாயே! நாணங்கெட்டவனே! கறவைக் கலத்தோடு யாம் நாளைப் புலத்துக்குச் செல்லும்போது, அங்கேயும் வருவாயோ?", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 3, section 3.10, p.75", "", "hard", "false"], ["SANG-3-11", "Sangam literature", "சங்க இலக்கியம் – முல்லைக்கலி 9–17: “பாடல் : 17 : தெளியாது என் அறிவு!” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – முல்லைக்கலி 9–17: Explain the poem/passage titled “பாடல் : 17 : தெளியாது என் அறிவு!” (section 3.11).", "தலைவன் கூற்று : மாண உருக்கிய நல் பொன் மணி உறீஇ, பேணித் துடைத்தன்ன மேனியாய்! கோங்கின் முதிரா இள முகை ஒப்ப எதிரிய தொய்யில் பொறித்த வன முலையாய்! மற்று நின் கையது எவன்? மற்று உரை! 5 தலைவி கூற்று : கையதை சேரிக் கிழவன் மகளேன் யான்; மற்று இஃது ஓர் மாதர்ப் புலைத்தி விலை ஆகச் செய்தது ஓர் போழில் புனைந்த வரிப் புட்டில் - புட்டில் உள் என்? உள ? காண்தக்காய் என் காட்டிக் காண். தலைவி கூற்று : காண்! இனி தோட்டார் கதுப்பின் என் தோழி அவரொடு 10 காட்டுச் சார் கொய்த சிறு முல்லை மற்று இவை. தலைவன் கூற்று : முல்லை இவை ஆயின், முற்றிய கூழையாய்! எல்லியற்றுப் போழ்து ஆயின் ஈதோளிக் கண்டேனால்; செல் என்று நின்னை விடுவேன் யான்; மற்று எனக்கு மெல்லியது ஓராது அறிவு. 15 தலைவன் : பசும்பொன்னை நன்றாக உருக்கி, அதன் நடுவே நீலமணியை வைத்து இழைத்து. நன்கு மெருகிட்டதைப் போன்ற, ஒளிமிகுந்த மேனியினை உடையவளே! கோங்கினது முதிராத இளமொட்டுப் போன்று புடைத்த, தொய்யில் எழுதிய அழகிய மார்பகங்களை உடையவளே! உன் கையில் தான் என்ன இருக்கிறது? அதனைச் சொல்வாயாக! தலைவி : யானோ, இவ்வூர்த் தலைவனுடைய மகளாவேன். இது, ஒரு புலைத்தி விலையாகச் செய்து தந்தது, பனை ஓலை நறுக்கினாலே பின்னி, வண்ணம் ஊட்டிய புட்டில். இது தான் என் கையிலிருப்பது. தலைவன் : புட்டில் என்பதை யானும் அறிவேன். காணத் தகுந்த அழகியே! புட்டிலினுள் என்ன இருக்கிறது? அதனை நான் காணுமாறு காட்டுக. தலைவி : பார்த்துக்கொள், என் தோழிகளோடு காட்டினுள் கொய்த சிறுமுல்லைப் பூக்கள் இவை. தலைவன் : இவை முல்லையாய் இருக்கின்றன. நீண்டு வளர்ந்த கூந்தலை உடையாளே! பொழுதும் மாலைக் காலமாயிருக்கின்றது. இடமோ ஒருவரை ஒருவர் காணமுடியாத இருள் சூழ்ந்த இடம். செல் என்று நின்னை யான் போகவும் விடுவேன். ஆனால், எனக்கு அறிவு மிகவும் மென்மையானது. நல்லது தீது எதனையும் தெளியாதது, அதுவே உன்னை விரும்பும்போது நான்தான் என்ன செய்வேன்?", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 3, section 3.11, p.76", "", "hard", "false"], ["SANG-4-3", "Sangam literature", "சங்க இலக்கியம் – ஐங்குறுநூறு – மருதம்: “வேட்கைப் பத்து” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – ஐங்குறுநூறு – மருதம்: Explain the poem/passage titled “வேட்கைப் பத்து” (section 4.3).", "4.3.1.பாடல் : 1 : தோழி தலைவனிடம் கூறியது : வாழி ஆதன்! வாழி அவினி! நெல் பல பொலிக, பொன் பெரிது சிறக்க, என வேட்டோளே யாயே, யாமே, நனைய காஞ்சிச் சினைய சிறு மீன் யாணர் ஊரன் வாழ்க, பாணணும் வாழ்க, என வேட்டேமே. அரசன் காவற்பொருட்டு வாழ்வானாக. மேல் விருந்தாற்றுதற் பொருட்டு நெற்பல பொலிக. இரவல்க்கீற்று பொருட்டு பெண் உண்டாகுக. என யாம் இல்லறத்திற்கு வேண்டவன விரும்பி ஒழுகியதல்லது பிறிது நினந்திலள் அவள் இத்தன்மையளாக, நீ ஒழுகிய ஒழுக்கத்தால் நினக்கும் நின் ஒழுக்கத்திற்குத் துணையாகிய பாணனுக்கும் தீங்கு வருமென்றஞ்சி யாணரூரன் வாழ்க! பாணனும் வாழ்க! என விரும்பினேம் யாங்களென்றவாறு. 4.3.2.பாடல் : 2 : தோழி தலைவனிடம் கூறியது : ளுநடக -ஐளெவசரஉவழையெட வாழி ஆதன்! வாழி அவினி! ஆயவநசயைட விளைக வயலே, வருக இரவலர். என வேட்டோளே யாயே, யாமே, பல்லிதழ் நீலமொடு நெய்தல் நிகர்க்கும் தண்துறை ஊரன் கேண்மை, வழிவழிச் சிற்க்க, என வேட்டேமே. தலைவி, அரசன் வாழ்வானாக. மேல், வயல் விளைவதாக, அதனால் இரவலர் இல்லாது போகுக என வாழ்ந்திருந்தாள், நாங்கள் பலவிதழ்களை உடைய காவி மலரோடு மாறுகொள்ளும் நெய்தல் மலர் பொருந்திய குளிர்ந்த துறைகள் பொருந்திய இவ்வூரனது உறவு மேலும் மேலும் வளர்வதாக என விரும்பினோம் 4.3.3.பாடல் : 3 : தோழி தலைவனிடம் கூறியது : வாழி ஆதன்! வாழி அவினி! பால் பல ஊறுக, பகடு பல சிறக்க, என வேட்டோளே யாயே, யாமே, வித்திய உழவர் நெல்லொடு பெயரும் பூக்கஞல் ஊரன்,. தன் மனை வாழ்க்கை பொலிக என வேட்டேமே. அரசன் வாழ்வானாக! மேல், பால்மிக பெருக, பகடுகள் பலவாகச் சிறக்குக என்று விரும்பினாள் தலைவி. யாங்கள் வித்தைவித்திய உழவர் விளைந்த நெல்லைக் கொண்டுபோம் வளம் நெருங்கிய ஊரன் தனது மனை வாழ்க்கையித்துப் பொலிவானாக என விரும்பினேம். 4.3.4.பாடல் : 4 : தோழி தலைவனிடம் கூறியது : வாழி ஆதன்! வாழி அவினி! பகைவர் புல் ஆர்க, பார்ப்பார் ஓதுக, என வேட்டோளே யாயே, யாமே, பூத்த கரும்பின், காய்த்த நெல்லின் கழனி ஊரன் மார்பு பழனம் ஆகற்க, என வேட்டேமே. அரசன் வாழ்வானாக! மேலும், பகைவர் புல்லுணவை உண்பாராக, பார்ப்பார் ஓதுவாராக என்று விரும்பினாள் தலைவி. யாங்கள் பூத்த கரும்பையும் காய்ந்த நெல்லையும் உடைய கழனியையுடைய ஊரனது மார்பு சோலை அல்லவாகுக என்று விரும்பினேம். 4.3.5.பாடல் : 5 : தோழி தலைவனிடம் கூறியது : வாழி ஆதன்! வாழி அவினி! பசியில் ஆகுக, பிணி சேண் நீங்குக, என வேட்டோளே யாயே, யாமே, முதலை போத்து முழு மீன் ஆரும் தண்துறை ஊரன் தேர் எம் முன்கடை நிற்க, என வேட்டேமே. அரசன் வாழ்வானாக, பசியில்லாது போகுக. நோய் மிகத் தூரத்தே போவதாக என்ற விரும்பினாள் தலைவி. யாங்கள் முதலைப் போத்தானது முழு மீனையுண்ணும் குளிருந் துறையையுடைய ஊரன் ஊரானது பிற மகளிர் முன் கடை நிற்ற ஒழிந்து என்முன் கடை நிற்க என விரும்பினேம். 4.3.6.பாடல் : 6 : தோழி தலைவனிடம் கூறியது : வாழி ஆதன்! வாழி அவினி! வேந்து பகை தணிக, யாண்டு பல நந்துக, என வேட்டோளே யாயே, யாமே, மலர்ந்த பொய்கை முகைந்த தாமரைத் தண்துறை ஊரன் வரைக, எந்தையும் கொடுக்க, என வேட்டேமே. நின்னை எதிர்ப்பட்ட அன்றே நீ வரைந்தாய் எனக்கொண்ட இல்லறத்திற்கு வேண்டுவன விரும்பி ஆதன் வாழி, அவினி வழி, அரசன் பகை தணிவாளாக, யாண்டு பலவாகப் பெருகுக என ஒழுகினாள் தலைவி, யாங்கள் விரிந்த பொய்கையிடத்து முகிழ்ந்த தாமரையை உடைய தண்டுறை ஊரன் இவளை வரைவானாக. எந்தையும் கொடுப்பானாக என விரும்பினோம். 4.3.7.பாடல் : 7 : தோழி தலைவனிடம் கூறியது : வாழி ஆதன்! வாழி அவினி! அறன் நனி சிறக்க, அல்லது கெடுக, என வேட்டோளே யாயே, யாமே, உளைப்பூ மருதத்துக் கிளைக் குருகு இருக்கும் தண்துறை ஊரன், தன்னூர்க் கொண்டனன் செல்க, என வேட்டேமே. தலைவி! ஆதன் வாழ்க அவினி வாழ்க, தருமம் மென்மேலுஞ் சிறக்க. பாவங் கெடுவதாக என்ற விரும்பினாள். யாங்கள் அகவிதழ் அழகிய பூவையுடைய மருத்த மரத்தின்கண் நாரையினங்கள் இருக்கும் தண்டுறையூரன் தன்னூர்க்குக் கொண்டு செல்வானாக என விரும்பனேம். 4.3.8.பாடல் : 8 : தோழி தலைவனிடம் கூறியது : வாழி ஆதன்! வாழி அவினி! அரசு முறை செய்க, களவு இல் ஆகுக, என வேட்டோளே யாயே, யாமே, அலங்கு சினை மாஅத்து அணி மயில் இருக்கும் பூக்கஞல் ஊரன், சூள் இவண் வாய்ப்பதாக, என வேட்டோமே. ஆதன் வாழ்க! அவினி வாழ்க! அரசு முறை செய்க! களவில்லாது போவதாக என்று விரும்பி ஒழுகினாள் தலைவி. யாங்கள் அசையா நிற்கும் கொம்பர் பொருந்திய மாமரத்தின்கண் அழகிய மயிலானதிருக்கும் அழகு நிறைந்த ஊரன் கூறிய உண்மை வசனம் இவ்விடத்து வாய்ப்பதாக என விரும்பினேம். 4.3.9.பாடல் : 9 : தோழி தலைவனிடம் கூறியது : வாழி ஆதன்! வாழி அவினி! நன்று பெரிது சிறக்க, தீது இல் ஆகுக, என வேட்டோளே யாயே, யாமே, கயல்ஆர் நாரை போர்வில் சேக்கும் தண்துணை ஊரன் கேண்மை, அம்பல் ஆகற்க, என வேட்டேமே. தலைவி ஆதன் வாழ்க, அவினி வாழ்க, நன்மை மிகவம வளர்வதாக, தீமை சிறியதும் இ;ல்லாது போவதாக என்று விரும்பியொழுகினாள். யாங்கள் கயலாகிய உணவை உண்கின்ற நாரை நெற்போரிடத்து இராநின்ற தண்டுறை ஊரனிடை நம்முறவு வெளிபடாமல் இருக்க வேண்டும் என விரும்னேம். 4.3.10.பாடல் : 10 : தோழி தலைவனிடம் கூறியது : வாழி ஆதன்! வாழி அவினி! மார் வாய்க்க, வளம்நனி சிறக்க, என வேட்டோளே யாயே, யாமே, பூத்த மாஅத்துப் புலால் அம் சிறுமீன் தண்துறை ஊரன், தன்னொடு கொண்டனன் செல்க, என வேட்டேமே. தலைவி, அரசனாகிய ஆதன் வாழி! அவினி வாழி! மழை தப்பாது பெய்வதாக, அதனால் வளங்கள் மிகப்பெருகுவதாக என்று விரும்பி ஒழுகினாள். யாங்கள் பூத்த மாவினையும் புலால் சிறுமீனையும் உடைய ஊரன் இங்க வரையானாயின் தன்னூர்க்குக் கொண்டு செல்வானாக என விரும்பினோம்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 4, section 4.3, p.79", "", "hard", "false"], ["SANG-4-4", "Sangam literature", "சங்க இலக்கியம் – ஐங்குறுநூறு – மருதம்: “வேழம் பத்து” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – ஐங்குறுநூறு – மருதம்: Explain the poem/passage titled “வேழம் பத்து” (section 4.4).", "4.4.1.பாடல் : 11 : தலைவி தோழியிடம் அல்லது பாணனிடம்; கூறியது மனை நடு வயலை வேழம் சுற்றும் துறை கேழ் ஊரன் கொடுமை நாணி, நல்லன் என்றும் யாமே, அல்லன் என்னும் தட மென்தோளே. மனை நடுவில் நிற்கும் பசலைக் கொடியானது. மனைப்புறத்தில் நிற்குங் கொற்கையின்மேற் சென்று படருந்துறை பொருந்தியவூரன் நமக்குச் செய்யுங் கொடுமைக்கு நாணியும் யாம் நல்லனென்றே கூறுகின்றோம். யாமப் படியாகவும் பெருமை பொருந்திய மெல்லியவாகிய தோள்களானவை அல்லாதவனென்று கூறுகின்றன. 4.4.2.பாடல் : 12 : தலைவி கூற்று : கரை சேர் வேழம் கரும்பின் பூக்கும் துறைகேழ் ஊரன் கொடுமை நன்றும் ஆற்றுக தில்ல யாமே. தோற்க தில்ல, என் தட மென் தோளே. கரைமருங்கு நிற்கின்ற வேழமானது, வயலகத்து நிற்குங் கரும்பு போலப் பொலிகின்ற துறை பொருந்திய ஊரன் செய்யுங் கொடுமை நன்றாயிருத்தலின் மாற்ற வேண்டும் விருப்பமுடையும் யாமப்படியாகவும், முயக்கத்தை விரும்பி மெலிவடையா நிற்கின்றன பெருமையுடைய மெல்லிய தோள்கள். 4.4.3.பாடல் : 13 : தலைவி தோழியிடம் கூறியது : பரியுடை நன்மான் பொங்குளையன்ன அடைகரை வேழம் வெண்பூப் பகரும், தண்துறை ஊரன் பெண்டிர், துஞ்சு ஊர் யாமத்தும், துயில் அறியலரே. தாய்குதலைத் தொழிலாகவுடைய பெருமை பொருந்திய குதிரையது தலையிலணியப்பட்ட பொலியவாகிய வெண் கவிரி போல் அடைகரைக்கண் நிற்கும் வேழம் வெண் பூவைக் கொடுக்குந் தண்டுரையூரனது பெண்டிர் இவ்வூரிலுள்ள யாருமொருசேரத் துயில்கின்ற யாமத்துங் தாங்கொண்ட காதலாற்றுயிலறியாராக, அவர் வருந்திறம்; யாது? 4.4.4.பாடல் : 14 : தலைவி தோழியிடம் கூறியது : கொடிப் பூ வேழம் தீண்டி அயல வடுக்கொண் மாஅத்து வண் தளிர் நுடங்கும் அணித்துறை ஊரன் மார்பே, பனித் துயில் செய்யும் இன் சாயற்றே. நீண்ட பூவினையுடைய வேழந்; தீண்டப் பக்கத்தில் நிற்கு மாவினது வடுவமைந்த வளவிய தளிரசையும் அழகிய துறையூரனது மார்பே மனம் மகிழுமினிய துயிலைத் தாரா நின்ற மென்மையை உடையத்து அதனாலாற்றேனாகின்றேன். 4.4.5.பாடல் : 15 : தலைவி தோழியிடம் கூறியது : மணலாடு மலிர்நிறை விரும்பிய ஒண் தழைப் புனல் ஆடு மகளிர்க்குப் புணர் துணை உதவும், வேழ மூதூர் ஊரன், ஊரன் ஆயினும், ஊரன் அல்லன்னே. மணலைக் கரைத்துச் செல்லும் வெள்ளமாகிய புதுப் புனலிடத்து ஆடுதலை விரும்பிய மகளிர்க்குத் தழையை உடைய ஒள்ளிய வேழமானது புணர்ந்தார். தன்மையைச் செய்யும் பெரியவூரினையுடைய ஊரன் நின்னாற் சொல்லப்படும் பற்றுக்கோடுடையனாயினும். அவ்வாற்றான் என்னாற் கொள்ளப்படும் தன்மையிலன். 4.4.6.பாடல் : 16 : தோழி தூது வந்த பாணனிடம் கூறியது : ஓங்குபூ வேழத்துத் தூம்பு உடைத் திரள்கால் சிறு தொழு மகளிர் அஞ்சனம் பெய்யும் பூக்கஞல் ஊரனை உள்ளிப், பூப் போல் உண்கண் பொன் போர்த்தனவே. உயர்ந்து தோன்றும் பூவையுடைய வேழத்தினது கட்டுளை பொருந்திய திரண்ட தண்டு சிறிய தொழில் மகளிர் அஞ்சன மையிட்டு வைத்தற்க அமையும் பொலிவு நிறைந்த ஊரனைப் பலகாலும் நினைத்து அழகிய மையுண்ட கண் பசலையான் மூடப்பட்டன. இனியவனடையும் பயனில்லை. 4.4.7.பாடல் : 17 : தலைவி தோழியிடம் கூறியது : புதர் மிசை நுடங்கும் வேழ வெண்பூ விசும்பு ஆடு குருகின் தோன்றும் ஊரன், புதுவோர் மேவலன் ஆகலின், வறிதாகின்று என் மடங்கெழு நெஞ்சே. புதரினமே அசையா நின்ற வேழத்தினது வெள்ளிய பூ கரிய ஆகாயத்தின்கண் பறக்குங் குருகுபோலத் தோன்றகின்ற ஊரன் புறத்தொழுக்க உளதாகிய துணையே அன்றிக் கனவில் வந்து நாடோறும் வருத்துதலுடையனாதலால் என்னெஞ்சு பெருமையிழந்து வருந்துகின்றது. 4.4.8.பாடல் : 18 : தலைவி தலைவனின் நண்பரிகளிடம் கூறியது : இருஞ்சாய் அன்ன செருந்தியொடு வேழம் கரும்பின் அலமரும் கழனி ஊரன், பொருந்தும் மலரன்ன என் கண் அழப் பிரிந்தனன் அல்லனோ, பிரியலென் என்றே? கரிய தண்டான் கோரை போலும் பஞ்சாயக் கோரையோடு வேழமானது கரும்பு போலச் சுழலும் வயலூரன் பொருந்திய மலர்போலும் எனது கண் நீரைச்சொரியப் பிரிந்தானல்லனோ, இனியொருபோதுமினிப் பிரியேனென்று தெளிவித்து 4.4.9.பாடல் : 19 : தலைவி தோழியிடம் கூறியது : எக்கர் மாஅத்துப் புதுப் பூம் பெருஞ்சினை புணர்ந்தோர் மெய்ம் மணங்கமழும் தண் பொழில், வேழ வெண்பு வெள்ளுளை சீக்கும் ஊரன் ஆகலின், கலங்கி, மாரி மலரின் கண் பனி உகுமே. நீரிட்ட மணற்றிடற் கண்ணேயுள்ள மாமரத்தினது பெரிய புதுப்பூவினை உடைய சினையானது வதுவை மகளிர் மெய்மணம் கமழக் கடவ பொழிலை அப்பூ அரும்பாகிய பருவத்தே வேழத்தின் பூவானது துடைக்குமுரனாதலின், கலக்கமுற்று மாரிக்காலத்து மலர் நீரைச் சிந்துந் தன்மை போல என் கண்களாயின நீர்த்துளியைச் சிந்தாது நிற்கும். 4.4.10.பாடல் : 20 : தலைவி தோழியிடம் கூறியது : அறுசில் கால அஞ்சிறைத் தும்பி நூற்றிதழ்த் தாமரைப் பூச்சினை சீக்கும் காம்பு கண்டன்ன தூம்பு உடை வேழத்துத் துறை நணி ஊரனை உள்ளி, என் இறை ஏர் எல் வளை நெகிழ்பு ஓடும்மே. ஆறு சிலவாய கால்களை உடைய அழகிய சிறகுகளை உடைய வண்டினது நூறாகிய விதழ்களையுடைய தாமரைப் பூவின்கண்ணுள்ள முட்டைகளைக் கெடுக்கும் மூங்கில் போலுமுள்ளீடு பொருந்திய வேழங்களமைந்த துறையையுடைய ஊரனை நினைத்தலின் என் கையிலணியப்பட்ட அழகிய வளையல்கள் நெகிழ்ந்து கழலாமல் நிற்கும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 4, section 4.4, p.82", "", "hard", "false"], ["SANG-4-5", "Sangam literature", "சங்க இலக்கியம் – ஐங்குறுநூறு – மருதம்: “கள்வன் பத்து (களவன் பத்து)” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – ஐங்குறுநூறு – மருதம்: Explain the poem/passage titled “கள்வன் பத்து (களவன் பத்து)” (section 4.5).", "4.5.1.பாடல் : 21 : தோழி தலைவியிடம் கூறியது : முள்ளி நீடிய முதுநீர் அடைகரைப் புள்ளிக் களவன் ஆம்பல் அறுக்கும். தண்துறை ஊரன் தெளிப்பவும், உண்கண் பசப்பது, எவன் கொல் அன்னாய்? முள்ளிச்செடி வளர்ந்து நீண்ட முதுநீரடை கரைக்கண் வாழும் வரிகளையுடை நண்டு சென்று ஆம்பலை அறுக்கின்ற தண்டுறையும் ஊரன் தெளிவிக்கவும் மை தீட்டிய கண்கள் பசபர்படைவது யாது கொல்லோ. 4.5.2.பாடல் : 22 : தலைவி தோழியிடம் கூறியது : அள்ளல் ஆடிய புள்ளிக் களவன், முள்ளி வேரளைச் செல்லும் ஊரன், நல்ல சொல்லி மணந்து, இனி நீயேன் என்றது, எவன் கொல் அன்னாய்? சேற்றில் மூழ்கிய வரிகளை உடைய நண்டானது முள்ளி வேர் செறின் அளையிடத்தே சென்;றடைகின்ற ஊரை உடையவன் எமக்கின்பம் பயக்கும் சூளுரைத்து வரைந்து கொண்டு இப்பொழுது முற்கூறிய நீயேன் என்றது யாது கொல்லோ? 4.5.3.பாடல் : 23 : தலைவி தோழியிடம் கூறியது : முள்ளி வேர் அளைக் களவன் ஆட்டிப் பூக்குற்று எய்திய புனல் அணி ஊரன், தேற்றம் செய்து நப்புணர்;ந்து, இனித் தாக்கணங்கு ஆவது, எவன் கொல் அன்னாய்? தன்னூரின்கண் வாழும் விளையாட்டு மகளிர் முள்ளிவேர் நெருங்pய வளைக்கண் வாழும் நண்டையலைத்துப் பூக்குற்று விளையாடும் புனலணிந்தவூரின் நம்மனம் தெளியும்படி செய்து நம்மைக் கலந்து இப்பொழுது வருத்துவது யாது கொல்லோ? 4.5.4.பாடல் : 24 : தோழி தலைவியிடம் கூறியது : தாய் சாப் பிறக்கும் புள்ளிக் களவனொடு, பிள்ளை தின்னும் முதலைத்து அவனூர், எய்தினன் ஆகின்று கொல்லோ? மகிழ்நன் பொலந்தொடி தெளிர்ப்ப முயங்கியவர் நலங்கொண்டு துறப்பது, எவன்கொல் அன்னாய்? தாய் சாதற்கேதுவாகத் தோன்றும் நண்டோடு பிள்ளையைத் தின்னு முதலையை உடையது அவனூர். அவற்றைத் தானடைந்தானாகின்றது கொல்லோ! மகிழ்நன் பொன்னினாய வளையல்கள் ஒலிப்பக்கூடி, அக்கூடியவர்களது அழகைக் கவர்ந்து நீங்குவது என்னை கொல்லோ! தலைவியே, அதனை அறியேமே. 4.5.5.பாடல் : 25 : தோழி தலைவியிடம் கூறியது : அயல் புறந்தந்த புனிற்று வளர் பைங்காய் வயலைச் செங்கொடி களவன் அறுக்கும், கழனி ஊரன் மார்பு, பலர்க்கு இழை நெகிழ் செல்லல் ஆகும் அன்னாய். புறத்தே பாதுகாத்த இளமையாகிய வளரும் பசிய காய்களை உடைய வயலையாகிய செவ்விய கொடியை நண்ட அறுக்குங் கழனி ஊரனது மார்பு பரத்தையர் பலர்க்கும் இழை நெகிழும்படியாகிய துன்பத்தை உடையதாகும்; தலைவியே! 4.5.6.பாடல் : 26 : தோழி தலைவியிடம் கூறியது : கரந்தை அம் செறுவில் துணை துறந்து. களவன் வள்ளை மென் கால் அறுக்கும் ஊரன், எம்மும் பிறரும் அறியான், இன்னன் ஆவது, எவன் கொல் அன்னாய்? கரந்தை செறிந்த வயலிலேயுள்ள தனது பெண்ணைப் பிரிந்த நண்டானது வள்ளையினது மெல்லிய தண்டை அறுக்கின்ற ஊரன் எம்மையும் பிறரையும் வருத்துகின்றதை அறியான். அவ்வாறாயினான் துன்பத்தைச் செய்பவனாதல் எங்ஙனம் கொல்லோ? தலைவியே. 4.5.7.பாடல் : 27 : தோழி தலைவியிடம் கூறியது : செந்நெல் அம் செறுவில் கதிர் கொண்டு, களவன் தண் அக மண் அளைச் செல்லும் ஊரற்கு, எல் வளை நெகிழச் சாஅய் அல்லல் உழப்பது, எவன்கொல் அன்னாய்? செந்நெல்லை உடைய அழகு பொருந்திய வயலின் கண்ணுள்ள கதிரைக் கவர்ந்து கொண்ட நண்டானது தண்ணிய உள்ளிடத்தை உடைய அளையின் கண்ணே செல்லு ; கின்ற ஊரற்கப் புறத்தொழுக்கம் உண்டென நினைந்து ஒளியை உடைய வளை கழலும்படி மெலிந்து வருத்தம் அடைவது யாது கொல்லோ? 4.5.8.பாடல் : 28 : தோழி செவிலித்தாயிடம் கூறியது : உண் துறை அணங்கிவள் உறை நோய் ஆயின், தண்; சேறு களவன் வரிக்கும் ஊரற்கு, ஒண்தொடி நெகிழச் சாஅய் மென் தோள் பசப்பது, எவன் கொல் அன்னாய்? உண்ணப்படும் நீர்துறைக் கண்ணேயுறையுந் தெய்வத்தினாலும் உண்டாகிய நோயிவடகாயின் குளிர்ந்த சேற்றின்கண் நண்ட கோலஞ் செய்யும் ஊரன் பொருட்டு ஒள்ளிய தொடி கழலும்படி மெலிந்து மெல்லிய தோள்கள் பசப்பது யாது கொல்லோ அன்னையே. 4.5.9.பாடல் : 29 : தோழி செவிலித்தாயிடம் கூறியது : மாரி கடி கொளக் காவலர் கடுக, வித்திய வெண்முளை களவன் அறுக்கும், கழனி ஊரன் மார்புற மரீஇத் திதலை அல்குல் நின் மகள் பசலை கொள்வது, எவன் கொல் அன்னாய்? மழை மிகுதியாகப் பெய்யவும், காவலர் விரைந்த செல்லவும், விதைத்த வெண்மையை உடைய நெல் முளைகளை நண்டானது சென்று அறுக்குங் கழனியை உடைய ஊரனது மார்பைப் பொருந்தித் தேமலை உடைய அல்குலையுடைய நினது மகள் பசத்தலைக் கொள்வதியாது கொல்லோ? அன்னையே. 4.5.10.பாடல் : 30 : தோழி செவிலித்தாயிடம் கூறியது : வேப்பு நனை அன்ன நெடுங்கண் களவன், தண் அக மண் அளை நிறைய நெல்லின் இரும் பூ உறைக்கும் ஊரற்கு, இவள் பெருங்கவின் இழப்பது, எவன் கொல் அன்னாய்? வேம்பின் அரும்பு போல நீண்ட கண்ணை உடைய நண்டினது தண்ணிய மண்ணளைக்கண் நிறைய நெல்லினது பெருமை உடைய பூவுதிரும் ஊரற்க இவள் பெரிய அழகிழப்பது யாது கொல்லோ? அன்னையே.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 4, section 4.5, p.85", "", "hard", "false"], ["SANG-4-6", "Sangam literature", "சங்க இலக்கியம் – ஐங்குறுநூறு – மருதம்: “தோழி உரைத்த பத்து” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – ஐங்குறுநூறு – மருதம்: Explain the poem/passage titled “தோழி உரைத்த பத்து” (section 4.6).", "4.6.1.பாடல் : 31 : தலைவி தோழியிடம் கூறியது : அம்ம வாழி தோழி! மகிழ்நன் கடன் அன்று என்னும் கொல்லோ, நம் ஊர் முட முதிர் மருதத்துப் பெருந்துறை உடனாடு ஆயமோடு உற்ற சூளே? தோழி கேட்பாயாக! மகிழ்நன் நம்மூரின் மிக்க முடத்தை உடைய திருமருதந்துரையிடத்து நம்மோடு உடனாடிய வாயத்தாரோடு நமக்கரைத்த சூளுரை இப்போது செய்தற்குரியது என்றென்னும் கொல்லோ? 4.6.2.பாடல் : 32 : தலைவி தோழியிடம் கூறியது : அம்ம வாழி தோழி! மகிழ்நன் ஒரு நாள் நம் இல் வந்ததற்கு, எழு நாள் அழுப என்ப அவன் பெண்டிர், தீ உறு மெழுகின் ஞெகிழ்வனர் விரைந்தே. தோழி! ஊரன் ஒரு ஞான்று நம்மில்லின்கண் வந்ததற்கு அவன் பெண்டிர் எழுநாள் தீயின் கணிட்ட மெழுகைப்போல விரைந்து மெலிந்து அழுபவென்று கூறுவர். ஆதலினவர் வருதல் கூடாது. 4.6.3.பாடல் : 33 : தலைவி தோழியிடம் கூறியது : அம்ம வாழி தோழி! மகிழ்நன் மருது உயர்ந்து ஓங்கிய விரி பூம் பெருந்துறைப் பெண்டிரோடு ஆடும் என்ப, தன் தண் தார்அகலம் தலைத்தலைக் கொளவே. தோழி! மருது மிகவுமுயர்ந்த விரிந்த பூவை உடைய பெரிய துறைக்கண் ஊரன் தனது பெண்டிர் குளிர்ந்த மாலையை உடைய மார்பைத் தாந்தாம் பெற்றுக்; கொள்ள அவர்களோடும் விளையாட வா என்று கூறுவார். ஆதலின் வாரான். 4.6.4.பாடல் : 34 : தலைவி தோழியிடம் கூறியது : அம்ம வாழி தோழி! நம் ஊர்ப் பொய்கைப் பூத்த புழைக்கால் ஆம்பல் தாது ஏர் வண்ணம் கொண்டன, ஏதிலாளற்குப் பசந்த என் கண்ணே. தோழி! நம்மூரின் பொய்கைக்கண் பூத்த துளை உடைய காலையுடைய வாம்பலினது தாது போன்ற அழகை அடைந்தன அயலாராகிய ஊரற்குப் பசப்ப அடைந்த எனது கண்கள். 4.6.5.பாடல் : 35 : தலைவி தோழியிடம் கூறியது : அம்ம வாழி தோழி! நம் ஊர்ப் பொய்கை ஆம்பல் நார் உரிமென் கால் நிறத்தினும் நிழற்றுதல் மன்னே, இனிப் பசந்தன்று, என் மாமைக் கவினே. தோழி! நமதூரின் பொய்கைக்கண்ணுள்ள ஆம்பலினது நாருரித்த மெல்லிய தண்டினது அழகினுமழகைச் செய்தல் இனிமேல் இன்றாய் இப்பொழுது எனது மாமைக்கவின் பசந்தது. வந்ததிற் பயனின்று. 4.6.6.பாடல் : 36 : தலைவி தோழியிடம் கூறியது : அம்ம வாழி தோழி! ஊரன் நம் மறந்து அமைகுவன் ஆயின், நாம் மறந்து உள்ளாது அமைதலும் அமைகுவம் மன்னே, கயல் எனக் கருதிய உண்கண், பயலைக்கு ஒல்கா ஆகுதல் பெறினே. தோழி! ஊரன் நம்மை மறந்திருத்தலைப் பொருந்துவனாயின் நாமும் மறந்து நினையாதிருத்தலும் பெறுவோம். அஃதெற்றானெனி, கயல் மீன் என்று பிறரால் கருதப்படும் மை தீட்டிய கண் பசலையைக் கொண்டு தளராத தன்மை பெற்றால். 4.6.7.பாடல் : 37 : பரத்தை தன் தோழியிடம் கூறியது : அம்ம வாழி தோழி! மகிழ்நன் நயந்தோர் உண்கண் பசந்து பனி மல்க வல்லன் வல்லன், பொய்;த்தல் தேற்றான் உற்ற சூள் வாய்த்தல்லே. தோழி! ஊரன் தன்மீது அன்பினையுடைய மகளிர் மைதீட்டிய கண்கள் பசப்படைந்த நீர் நிறையப் பொய்த்தலைச் செய்ய வல்லமையிலனாகான். தேறுதல் காரணமாக தன்னால் சூ@ற்ற சூள் உண்மையாதலைச் செய்யவல்லவன் அவன். 4.6.8.பாடல் : 38 : பரத்தை தன் தோழியிடம் கூறியது : அம்ம வாழி தோழி! மகிழ்நன் தன்சொல் உணர்ந்தோர் அறியலன் என்றும், தண்தளிர் வெளவும் மேனி, ஒண்தொடி முன் கை யாம், அழப் பிரிந்தே. தோழி! ஊரன் தண்ணிய மாந்தளிரினது அழகைக் கெடுக்கும் மேனிலையையடைய ஒள்ளிய தொடியை அணிந்த முன்கையை உடைய யாம் அழும்படி பிரிந்து தனது வார்த்தையைத் தெளிந்தோரிடத்துச் செல்லுதலை எக்காலத்தும் அறியான். 4.6.9.பாடல் : 39 : பரத்தை தன் தோழியிடம் கூறியது : அம்ம வாழி தோழி! ஊரன் வெம்முலை அடைய முயங்கி நம் வயின் திருந்திழைப் பணைத்தோள் ஞெகிழப் பிரிந்தனன் ஆயினும், பிரியலன் மன்னே. தோழி! ஊரன் தன் மார்போடு வெய்யவாய தனங்கள் அழுந்தத் தழுவிப்பின் பிறருடைய திருத்தமுற்ற இழை அணியப்பட்ட பருத்த தோள் மெலியப் பிரிந்தான் ஆயினம் நம்மிடத்து அவ்விதம் பிரிதலைச் செய்யான். 4.6.10.பாடல் : 40 : பரத்தை தன் தோழியிடம் கூறியது : அம்ம வாழி தோழி! மகிழ்நன் ஒண்தொடி முன் கை யாம் அழப் பிரிந்து, தன் பெண்டிர் ஊர் இறை கொண்டனன் என்ப, கெண்டை பாய்தர அவிழ்ந்த வண்டு பிணி ஆம்பல் நாடு கிழவோனே. தோழி! மகிழ்நன் ஒள்ளிய தொடியணிந்த முன் கையை உடைய யாழும் வண்ணம் பிரிந்த தனது பெண்டிரது ஊரின் கண்ணே உறைகின்றன என்று கூறுகின்றார்கள். அவனோ கெண்டை மீன் பாய்தலின் முறுக்கு அவிழ்ந்து வண்டைப் பிணிக்கும் தேன் நிறைந்த ஆம்பல் பொருந்திய நாட்டை உடையவன் .", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 4, section 4.6, p.87", "", "hard", "false"], ["SANG-4-7", "Sangam literature", "சங்க இலக்கியம் – ஐங்குறுநூறு – மருதம்: “புலவிப் பத்து” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – ஐங்குறுநூறு – மருதம்: Explain the poem/passage titled “புலவிப் பத்து” (section 4.7).", "4.7.1.பாடல் : 41 : தலைவி பாணனிடமும் தலைவனின் நண்பர்களிடமும் கூறியது : தன் பார்ப்புத் தின்னும் அன்பு இல் முதலையொடு வெண்பூம் பொய்கைத்து அவன் ஊர் என்ப, அதனால் தன் சொல் உணர்ந்தோர் மேனி பொன் போல் செய்யும் ஊர் கிழவோனே. தனது பார்ப்பைத் தி;னுகின்ற அன்பில்லா முதலையோடு வெள்ளிய பூவையுடைய பொய்கையை உடைத்து அவனது ஊர் என்று கூறுவர். அதனாலே தனது சொல்லை உண்மை என்று நம்பி அவரது மேனியைப் பொன் பொலச் செய்யும் ஊரன் 4.7.2.பாடல் : 42 : தலைவி தலைவனிடம் பரத்தையைப் பற்றிக் கூறியது : மகிழ் மிகச் சிறப்ப மயங்கினள் கொல்லோ யாணர் ஊர, நின் மாண் இழை அரிவை? காவிரி மலிர் நிறை அன்ன நின் மார்பு நனி விலக்கல் தொடங்கியோளே. யாண ஊரனே! நினது மாட்சிமைப்பட்ட ஆபரணத்தை உடைய அரிவையானவள் மகிழ்மிகவும் சிறத்தலினால் மயக்கமடைந்தாள் கொல்லோ! காவிரி ஆற்றின் நீரை ஒத்த நினது மார்பை மிகவும் தடுத்தற்குத் தொடங்கினாள் 4.7.3.பாடல் : 43 : தலைவி தலைவனிடம் கூறியது : அம்பணத்து அன்ன யாமை ஏறிச், செம்பின் அன்ன பார்ப்புப் பல துஞ்சும் யாணர் ஊர! நின்னினும் பாணன் பொய்யன், பல்சூளினனே. மரக்காலை ஒத்த ஆமையது முகின்கண் செம்மை ஒத்த பல பார்ப்புகள் ஏறித் துயில்கின்ற அழகிய ஊரனே! நின்னினம் பாணனோ பொய்யனல்லன். அவன் பல சூளினையுடையன். 4.7.4.பாடல் : 44 : தோழி தலைவனிடம் கூறியது : தீம் பெரும் பொய்கை யாமை இளம் பார்ப்புத், தாய் முகம் நோக்கி வளர்ந்திசினாஅங்கு, அதுவே ஐய நின் மார்பே, அறிந்தனை ஒழுகுமதி, அறனுமார் அதுவே. இனிய நீரை உடைய பெரிய பொய்கையின் கண்ணுள்ள யாமையின் பார்ப்பானது தாயது முகத்தை நோக்கி வளருந்தன்மைபோல, ஐயனே! நின்மார்பு அத்தன்மைத்தே, அதனi அறிந்தனையாய் ஒழுகுமதி, நிறைந்த தருமமும் அதுவேயாம். 4.7.5.பாடல் : 45 : தோழி தலைவனிடம் சொன்னது, தலைவி கூறுவதைப் போல் : கூதிர் ஆயின் மணி நிறம் கொள்ளும் யாறு அணிந்தன்று நின் ஊரே! பசப்பு அணிந்தனவால் மகிழ்ந என் கண்ணே. கூதிர் காலமாயில் கலங்கி வேனிற் காலமாயிற் றெனிதலைக் கொள்ளும் ஆற்றை அணிந்தது நின்ன}ர் மகிழ்ந! என்னுடைய கண்கள் எக்காலத்தும் பசப்படைந்தன் வாயிருக்கின்றன. 4.7.6.பாடல் : 46 : தோழி தலைவனிடம் கூறியது : தலைவி கூறுவதைப் போல் : நினக்கே அன்று அஃது எமக்குமார் இனிதே, நின் மார்பு நயந்த நன்னுதல் அரிவை வேண்டிய குறிப்பினை ஆகி, ஈண்டு நீ அருளாது, ஆண்டு உறைதல்லே. மகிழ்ந! உன்னுடைய மார்பு விரும்பிய அழகிய நுதலை உடைய பெண்ணானவள், விரும்பிய குறிப்பினை உடையையாகி ஈண்டு வருதலாகிய அருளைச் செய்யும் தன்மையல்லையாய் ஆண்டு உறைதலாகியவருளைச் செய்யாத தன்மையல்லையா இருத்தல் நினக்கேயல்லாமல் அது எமக்கம் இனிதாதலையுடையது. 4.7.7.பாடல் : 47 : தலைவி தலைவனிடமும் பாணனிடமும் கூறியது : முள்ளெயிற்றுப் பாண் மகள் இன் கெடிறு சொரிந்த அகன் பெரு வட்டி நிறைய, மனையோள் அரிகால் பெரும் பயறு நிறைக்கும் ஊர! மாண் இழை ஆயம் அறியும், நின் பாணன் போலப் பல பொய்த்தல்லே. கூரிய பற்களை உடைய வலைப்பாண்மகள் இனிமை உடையத்தென்று கொள்ளப்படும் கெடிற்று மீனைச் சொரிந்த அகன்ற பெட்டி நிறையப் பண்டமாற்றாக மனையோன் இருவியஞ்செய்யின் விளைந்த பெரும்பயற்றை நிறைக்கம் ஊர! அழகிய ஆபரணத்தை உடைய ஆயத்தார் உன் பாணன் போல நீயும் பலவாகப் பொய்த்தலையறிவர். 4.7.8.பாடல் : 48 : தலைவி தலைவனிடமும் பாணனிடமும் கூறியது : வலை வல் பாண்மகன் வால் எயிற்று மடமகள் வராஅல் சொரிந்த வட்டியுள், மனையோள் யாண்டு கழி வெண்ணெல் நிறைக்கும் ஊர! வேண்டேம் பெரும, நின் பரத்தை யாண்டுச் செய் குறியோடு, ஈண்டு நீ வரலே. வலையை உடைய வலிய பாண் மகனது மடகளானவள் வாரன்மீன் சொரிந்த பெட்டியுள் மனையோளானவள் ஓர் ஆண்டு கழிந்த வெண்ணெல்லைச் சொரிந்து நிறைகின்ற ஊரனே! பெரும! நினது பரத்தை ஆனவள் அவிவடத்தி;;ற்க செய்குறியோடு நீ ஈண்டு வருதலை விரும்போம். 4.7.9.பாடல் : 49 : தலைவி தலைவனிடமும் பாணனிடமும் கூறியது : அம்சில் ஓதி அசை நடைப் பாண்மகள், சில்மீன் சொரிந்து, பல் நெல் பெறூஉம் யாணர் ஊர! நின் பாண்மகன் யார் நலம் சிதையப் பொய்க்குமோ இனியே? அழகிய சிலவாய ஒதியையுடைய அசைந்த நடையை உடைய பாண் மகள் சில மீனைக் கொடுத்துப் பல நெல்லைப்பெறும் அழகிய ஊரனே! நினது பாணன் இனி எவரினது அழகு கெடும் வண்ணம் பொய்த்து விடுவானோ? 4.7.10.பாடல் : 50 : தோழி தலைவனிடம் கூறியது : துணையோர் செல்வமும் யாமும் வருந்துதும், வஞ்சி ஓங்கிய யாணர் ஊர! தஞ்சம் அருளாய் நீயே, நின் நெஞ்சம் பெற்ற இவளுமார் அழுமே. வஞ்சி மரம் பெருமை பெற்ற அழகிய ஊரனே! துணையோர் செல்வமும் நாங்களும் வருந்துகின்றோம். உன்னுடைய மார்;பைத் தனக்குப் பற்றுக்கோடாகப் பெற்ற இவளும் பெறாமையின் அழுகின்றாள், ஆதலின் நீயே அவற்றுக்கெல்லாம் காரணனாகையான் அவற்றைப் பெற அருளுவாய்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 4, section 4.7, p.89", "", "hard", "false"], ["SANG-4-8", "Sangam literature", "சங்க இலக்கியம் – ஐங்குறுநூறு – மருதம்: “தோழி கூற்றுப் பத்து” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – ஐங்குறுநூறு – மருதம்: Explain the poem/passage titled “தோழி கூற்றுப் பத்து” (section 4.8).", "4.8.1.பாடல் : 51 : தோழி தலைவனிடம் கூறியது : நீர் உறை கோழி பேடை நீலச் சேவல் கூர் உகிர்ப் பேடை வயாஅம் ஊர! புளிங்காய் வேட்கைத்தன்று நின் மலர்ந்த மார்பு, இவள் வயாஅ நோய்க்கே. நீரினிடத்துத் தங்கம் நீல நிறத்தை உடைய கோழிச் சேவலைக் கூரிய நகத்தை உடைய பேடானது நினைந்து தனது வயா நோய் தீரும் ஊரனே! நினது விரிந்த மார்பானது இவளது வேட்கை நோய்க்குப் புளியங்காயின் தன்மையாயிருக்கும். 4.8.2.பாடல் : 52 : தோழி தலைவனிடம் நகையாடிக் கூறியது : வயலைச் செங்கொடிப் பிணையல் தைஇச், செவ்விரல் சிவந்த, சேய் அரி மழைக்கண், செவ்வாய்க் குறுமகள் இனைய, எவ்வாய் முன்னின்று மகிழ்ந, நின் தேரே? பசலையது சிவந்த பொடியாலாய மாலையைத் தொடுத்தலின் சிவந்த விரல்கள் மிகவும் சிவப்படைந்த விகளை உடைய மழைக்கண்ணையும் சிவந்த வாயை உடைய சிறிவிப் பெண் வருந்த எந்த வாயின் முன்னர் நின்றது மகிழ்ந! நினது தேரானது. 4.8.3.பாடல் :53: தலைவி தலைவனிடம் கூறியது அல்லது தோழி தலைவனிடம் கூறியது : துறை எவன் அணங்கும் யாம் உற்ற நோயே? சிறை அழி புதுப் புனல் பாய்ந்தெனக் கலங்கிக் கழனித் தாமரை மலரும் பழன ஊர, நீ உற்ற சூளே! சிறையை அழித்துச்செல்லும் புதுப்புனல் பாய்ந்த அளவில்கலங்கிக் கழனிக் கட்டாமரை மலருகின்ற பழனத்தை உடைய ஊரனே! துறைதா னெவ்வாற்றாணும் வருத்துவதில்லை. பின்னை யாமுற்ற நோய் யாதானெனின் நீ பிறரோடு ஆடேனெனக் கூறிய வார்;த்தையால் உண்டானது. 4.8.4.பாடல் : 54 : தோழி வாயில் மறுத்து தலைவனிடம் கூறியது : திண் தேர்த் தென்னவன் நல் நாட்டு உள்ளதை வேனில் ஆயினும் தண் புனல் ஒழுகும் தேனூர் அன்ன இவள் தெரி வளை நெகிழ, ஊரின் ஊரனை, நீ தர வந்த பஞ்சாய்க் கோதை மகளிர்ககு ; அஞ்சுவல் அம்ம, அம்முறை வரினே. வலிய தேரை உடைய பாண்டியனது நல்ல நாட்டின் உள்ளதாகிய nனிற்காலமாயினும் குளிர்ந்த நீரைச் சொரியாது நிற்கும் தேனூரை ஒத்த இவளினுடைய ஆராய்ந்து அணிந்த வளையல் கழலச் சென்றால் ஊரனாகவும் உள்ளாய் உன்னால் கொடுக்கப் பொற்ற தண்டான் கோரையால் ஆகிய மலலையை உடைய மகளிருக்குப் பயப்படுவேன் அவர்ககு ; ச் செய்த முறையோடு இவ்விடத்தில் வரின். 4.8.5.பாடல் : 55 : தோழி தலைவனிடம் கூறியது : கரும்பின் எந்திரம் களிற்று எதிர் பிளிற்றும் தேர் வண் கோமான் தேனூர் அன்ன இவள் நல்அணி நயந்து நீ துறத்தலின், பல்லோர் அறியப் பசந்தன்று நுதலே. கரும்பை நெரிக்கும் ஆலையானது யானை;க்கு எதிராகப் பிளிற்றுகின்ற தேர் வளத்தையுடைய பாண்டியனது தேனூரை ஒத்த இவளது நல்ல அழகை நீ விரும்பியப்பின் துறத்தலால் பலரும் அறியப் பசந்தது இவள் நுதல். 4.8.6.பாடல் : 56 : தோழி தலைவனிடம் கூறியது : பகல் கொள் விளக்கோடு இரா நாள் அறியா வெல்போர்ச் சோழர் ஆமூர் அன்னே இவள் நலம் பெறு சுடர்நுதல் தேம்ப, எவன் பயம் செய்யும் நீ தேற்றிய மொழியே? ஒளி பொருந்திய விளக்கோடு இரவு நாளை அறியாத பகைவரை வெல்லுகின்ற போரை உடைய சோழனத ஆமூரை ஒத்த இவளது இன்பம் பெறுதற்கு ஏதுவாகிய ஒளியை உடைய நுதலானது வாட, நீ தெறித்த சொல்லானது யாதோர் பயனையும் செய்யமாடடாது. 4.8.7.பாடல் : 57 : தோழி தலைவனிடம் கூறியது : பகலின் தோன்றும் பல் கதிர்த் தீயின் ஆம்பல் அம் செறுவின் தேனூர் அன்ன இவள் நலம் புலம்பப் பிரிய, அனை நலம் உடையளோ மகிழ்ந, நின் பெண்டே? பகல்போல விளங்கம் பல ஒளியை உடைய தீயினையும் ஆம்பல் பொருந்திய வயலையும் உடைய தேனூரை ஒத்த இவளினுடைய அழகு கெடும்படியாக நீ பிரிய அத்தன்மை ஆகிய அழகை உடையயாளோ மகிழ்நனே! நினது பெண்ணானவள். 4.8.8.பாடல் : 58 : தோழி தலைவனிடம் சொன்னது : விண்டு அன்ன வெண்ணெல் போர்வின் கைவண் விராஅன் இருப்பை அன்ன இவள் அணங்கு உற்றனை போறி, பிறர்க்கும் அனையையால் வாழி நீயே. மலையை ஒத்த வெண்ணெற்போரை உடைய கொடைத் தொழிலால் சிறப்புற்ற விரான் என்பவனது இருப்பை என்னம் ஊரை ஒத்த இவளைத் துயரமைடையச் செய்தவனைப் போல்கின்றாய். நீ பிறருக்கும் அவ்வாறாந் தன்மையை ஆதலின் வாழ்வாயாக. 4.8.9.பாடல் : 59 : தோழி தலைவனிடம் கூறியது : கேட்டிசின் வாழியோ மகிழ்ந! ஆற்றுற மையல் நெஞ்சிற்கு எவ்வம் தீர நினக்கு மருந்தாகிய யான், இனி இவட்கு மருந்து அன்மை, நோம் என் நெஞ்சே. கேட்டிசின் வாழியோ மகிழ்நனே! நினது மயக்கம் பொருந்திய மனத்திற்கு வருத்தந்தீர மருந்தாக இருந்த நான் இவ்பொழுது இவளது மனத்தின் நோயை ஆற்றுதற்க மருந்து இல்லாமையினால் என் மனம் வருந்துகின்றது. 4.8.10.பாடல் : 60 : தோழி தலைவனிடம் கூறியது : பழனக் கம்புள் பயிர்ப் பெடை அகவும் கழனி ஊர! நின் மொழிவல் என்றும் துஞ்சு மனை நெடு நகர் வருதி, அஞ்சாயோ இவள் தந்தை கை வேலே? வயலின் கண்ணுள்ள சம்பங்கோழிச் சேவலானது ஒருவித ஒலியால் தனது பெடையை அழைக்கும் கழனி ஊரனே! உனக்கு ஒன்றனைக் கூறுவேன். எந்நாளும் மனைக் கண்ணுள்ளார் நித்திரை செய்யும் இரவு காலத்தின் வருகின்றாய், இவளது தந்தை கையின் வேலுக்குஅஞ்சாயோ! நாம் அஞ்சுகின்றோம்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 4, section 4.8, p.92", "", "hard", "false"], ["SANG-4-9", "Sangam literature", "சங்க இலக்கியம் – ஐங்குறுநூறு – மருதம்: “கிழத்திக் கூற்றுப் பத்து” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – ஐங்குறுநூறு – மருதம்: Explain the poem/passage titled “கிழத்திக் கூற்றுப் பத்து” (section 4.9).", "4.9.1.பாடல் : 61 : தலைவி தலைவனிடம் கூறியது : நறுவடி மாஅத்து விளைந்து உகு தீம்பழம் நெடு நீர்ப் பொய்கைத் துடுமென விழும், கைவண் மத்தி கழாஅர் அன்ன, நல்லோர் நல்லோர் நாடி, வதுவை அயர விரும்புதி நீயே. நறிய பிஞ்சை உடைய மாவினது முற்றி மூக்கூழ்த்து விழும் இனிய பழம் நிறைந்த நீரை உடைய பொய்கையிடத்துத் துடும் என்னும் ஓசையோடு விழுகின்ற கை வண்மையை உடைய மத்தியினுடைய கழார் என்னும் ஊரை ஒத்த நல்ல பெண்களைத் தேடி வதுவை முடித்தற்கு நீ விரும்புவாய். 4.9.2.பாடல் : 62 : தலைவி தலைவனிடம் கூறியது : இந்திர விழவின் பூவின் அன்ன, புன்தலைப் பேடை வரி நிழல் அகவும், இவ்வூர் மங்கையர்த் தொகுத்து, இனி எவ்வூர் நின்றன்று மகிழ்ந நின் தேரே? இந்திரனது விழாக் கால்தததிலுள்ள பூப்போலும் புல்லிய தலையை உடைய பறவையின் பேடு அழகிய மரநீழலிடத்தில் இருந்த ஒலிக்கும் இவ்வூரன்கணுள்ள பெண்களைக் கூட்டிவிட்டு இனி எவ்வூரிடத்து நின்றது மகிழ்நனே! நினது தேர் தான். 4.9.3.பாடல் : 63 : தலைவி தலைவனிடம் கூறியது : பொய்கைப் பள்ளிப் புலவு நாறு நீர்நாய், வாளை நாள் இரை பெறூஉம் ஊர! எம் நலம் தொலைவது ஆயினும், துன்னலம் பெரும, பிறர்த் தோய்ந்த மார்பே. பொய்கையைத் தனக்குப் படுக்கை இடமாகப் பெர்ருந்திய புலால் மணம் கமழும் நீர் நாயானது, வாளை மீன் நாள்தோறும் இரையாகப் பெறுகின்ற ஊரனே! எம்மிடத்துள்ள எவ்வகையாகிய அழகு கெடினும் பரத்தையருடன் சேர்ந்த மார்பை யாமொருபோதும் சேரமாட்டேம். 4.9.4.பாடல் : 64 : தலைவி தலைவனிடம் கூறியது : அலமரல் ஆயமோடு அமர் துணை தழீஇ, நல மிகு புதுப் புனல் ஆடக் கண்டோர், ஒருவரும் இருவரும் அல்லர், பலரே தெய்ய, எம் மறையாதீமே! கழன்று திரியுமாயத்தோடு பொருந்திய பெண்ணோடு கூடி நன்மை மிகந்த புதிய புனலை நீயாடக் கண்டவர் சிலர் அன்று பலரே. ஆதலின் எமக்க மறையாதி. 4.9.5.பாடல் : 65 : தலைவி தலைவனிடம் கூறியது : கரும்பு நடு பாத்தியில் கலித்த ஆம்பல் சுரும்பு பசி களையும் பெரும் புனல் ஊர! புதல்வனை ஈன்ற எம்மேனி முயங்கன்மோ, தெய்ய, நின் மார்பு சிதைப்பதுவே. கரும்பு நட்ட பாத்தியில் தானே தோன்றி வளர்ந்த ஆம்பலானது, வண்டினத பசியை நீக்குகின்ற பெரிய நீரை உடைய ஊரனே! புதல்வனைப் பெற்ற எனது மேனியை முயங்காதே! அம்முயக்கம் நினது மார்பினது அழகைச் சிதைப்பதாக இருக்கின்றது. 4.9.6.பாடல் : 66 : தலைவி தலைவனிடம் கூறியது : உடலினென் அல்லேன், பொய்யாது உரைமோ, யார் அவள் மகிழ்ந, தானே தேரொடு, தளர் நடைப் புதல்வனை உள்ளி, நின் வள மனை வருதலும், வெளவியோளே? உன் செயல் காரணமாகப் பகைத்தேன் அல்லன். பொய் சொல்லாது உண்மையை உரை. மகிழ்ந! தளர்ந்த நடையை உடைய பதல்வனை நினைத்து நினது வளத்தை உடைய மனைக்குத் தேரொடும் வருதலைத் தடுத்தவள் யார் தான். 4.9.7.பாடல் : 67 : தலைவி தலைவனிடம் கூறியது : மடவள் அம்ம நீ இனிக் கொண்டோளே, தன்னொடு நிகரா என்னொடு நிகரிப் பெரு நலம் தருக்கும் என்ப, விரி மலர்த் தாது உண் வண்டினும் பலரே, ஓதி ஒண்ணுதல் பசப்பித்தோரே. தலைவனே! நீ இப்பnhழுது வரைந்து கொண்டவள் மிக மடவள், யாதனாலெனின், தன்னோடு ஒப்பாகாத என்னையம் தன்னோடு ஒப்பித்துத் தன் பெரிய நலத்தாலே மாறுபடும் என்று கூறுவர். நீ தெளித்துப் பின் ஒளியை உடைய நுதலைப் பசப்பித்தவர்கள் வண்டு தாதை உண்ட மலர்களினும் பார்க்க மிகப்பலர். இதனை அறியாள் போலும். 4.9.8.பாடல் : 68 : தலைவி தலைவனிடம் கூறியது : கன்னி விடியல் கணைக் கால் ஆம்பல், தாமரை போல மலரும் ஊர! பேணாளோ நின் பெண்டே, யான் தன் அடங்கவும், தான் அடங்கலளே. இருள் முழுதும் கெடாத விடியல் காலத்தே திரண்ட தண்டை உடைய ஆம்பல் தாமரையைப் போல் மலர்ந்திருக்கின்ற ஊரனே! நினத பெண்ணானவள் இதனை விரும்பி உட்கொள்ளாளோ, அது யாதெனின், நாம் அடங்க வேணடும் தன்னைப் போன்று அடங்குவம் தான் அடங்குகின்றாள் இல்லை. 4.9.9.பாடல் : 69 : தலைவி தலைவனிடம் கூறியது : கண்டனெம் அல்லமோ மகிழ்ந, நின் பெண்டே, பலர் ஆடு பெருந்துறை மலரொடு வந்த தண் புனல் வண்டல் உய்த்தென, உண்கண் சிவப்ப, அழுத நின்றோளே. மகிழ்நனே! நின் பெண்டைக்காணாதிருந்தேம் அல்லேம் அவள்யார் என்றால். பலரும் வந்து நீராடுகின்ற பெருந்துறைக்கண்மலரோடு பெருகி வந்த தண்ணிய நீர் வண்டல் மனையைச் சிதைத்ததாக மையூட்டிய கண்கள் விப்படைய அழுது நின்றாள் 4.9.10.பாடல் : 70 : தலைவி தலைவனிடம் கூறியது : பழனப் பன் மீன் அருந்த நாலைர, கழனி மருதின் சென்னிச் சேக்கும், மா நீர்ப் பொய்கை யாணர் ஊர! தூயர் நறியர் நின் பெண்டிர், பேஎய் அனையம் யாம், சேய் பயந்தனமே. வயலிடத்தள்ள வலவாய மீன்களை உண்ணுதற்க நாரையானது கழனி இடத்துள்ள மருத மரத்தின் கண்ணே தங்குகின்ற நீர் பொருந்திய பெரிய பொய்கையை உடைய புது வருவாயை உடைய ஊரனே! நினது பெண்டிரோவெனின் அழுக்கற்றவரும் நல்ல வாசனையை உடையவரும் ஆவர். யாமோ பேயைங ஒத்தேம். அன்றிக் குழந்தையையும் பெற்றுக் கொண்டேம், ஆனதால் நின்றலையளியெம் மாட்டு இவ்வளவில் அமையும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 4, section 4.9, p.94", "", "hard", "false"], ["SANG-4-10", "Sangam literature", "சங்க இலக்கியம் – ஐங்குறுநூறு – மருதம்: “புனலாட்டுப் பத்து” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – ஐங்குறுநூறு – மருதம்: Explain the poem/passage titled “புனலாட்டுப் பத்து” (section 4.10).", "4.10.1.பாடல் : 71 : தலைவி தலைவனிடம் கூறியது : சூது ஆர் குறுந்தொடிச் சூரமை நுடக்கத்து, நின் வெங்காதலி தழீஇ, நெருநை ஆடினை என்ப புனரே, அலரே மறைத்தல் ஒல்லுமோ மகிழ்ந, புதைத்தல் ஒல்லுமோ ஞாயிற்றது ஒளியே? சூதார்ந்த குறிய தொடி அணிந்த கையையும் கண்டோர் அஞ்சும் அசைந்த நடையையும் உடைய நினது விருப்பத்தை உடைய பரத்தையுடனே கூடி முன்னை நாளிற் புனலை ஆடினான் என்று கூறுவர். அவ்வலர் நின்னால் மறைத்தல் கூடுமோ மகிழ்நனே! சூரியன் ஒளியை மறைத்தல் கூடாதது போல. 4.10.2.பாடல் : 72 : தலைவன் தோழியிடம் கூறியது : வயல் மலர் ஆம்பல் கயில் அமை நுடங்கு தழைத் திதலை அல்குல், துயல் வரும் கூந்தல், குவளை உண்கண். ஏஎர் மெல்லியல், மலர் ஆர் மலிர் நிறை வந்தெனப், புனலாடு புணர் துணை ஆயினள் எமக்கே. வயலிடத்தில் அலருகின்ற ஆம்பல் பூப் போன்ற மூட்டு வாயையுடைய ஆபரணத்தையும் அசைகின்ற தழையை அணிந்த வல்குலையும் அசைகின்ற கூநத்தலையும் குவளைப் பூப்போலும் மையுண்ட கண்ணையும் அழகையும் உடைய இம்மெல்லியல், அக்காலத்தில் பெருக்கினை உடைய பெரு வெள்ளம் வர, அதனிடத்து ஆடுகின்றவர்களோடு கூடிய நாயகிகளைப் போன்று எமக்கு இருந்தாள். 4.10.3.பாடல் : 73 : தலைவன் தோழியிடம் கூறியது : வண்ண ஒண் தழை நுடங்க, வால் இழை, ஒண்ணுதல் அரிவை, பண்ணை பாய்ந்தெனக், கள் நறுங்குவளை நாறித் தண் என்றிசினே, பெருந்துறைப் புனலே. அழகை உடைய ஒள்ளிய தழை அசைய ஒளியுடைய ஆபரணம் அணிந்த ஒள்ளிய நெற்றியை உடைய பெண்ணானவள் அக்காலத்தில் ஒருகால் விளையாட்டாகப் பாய, தேன் பொருந்திய நல்ல குவளை மணத்தை உடைத்தாகக் குளிர்ச்சியை உடைத்தாயிரருந்தது நமக்கம் பெரும் துறைக்கண் உள்ள நீரானது. 4.10.4.பாடல் : 74 : தலைவன் தோழியிடம் கூறியது விசும்பு இழி தோகைச் சீர் போன்றிசினே, பசும்பொன் அவிர் இழை பைய நிழற்றக், கரைசேர் மருதம் ஏறிப் பண்ணை பாய்வோள், தண் நறும் கதுப்பே. விசும்பினின் வீழ்கின்ற மயிலினது சிறப்புப் போலாய் இருந்தது. பசிய பொன்னாலாய விளங்குகின்ற ஆபரணமானது மெலலவாய நிழலைச் செய்யக் கரைக்கணுள்ள மருத மரத்திலேறி விளையாட்டாகப் பாய்கின்ற அவளது குளிர்ச்சியைத் தரும் வாசனையை உடைய கூந்தலானது. 4.10.5.பாடல் : 75 : தோழி தலைவனிடம் கூறியது : பலர் இவண் ஒவ்வாய் மகிழ்ந, அதனால் அல் தொடங்கின்றால் ஊரே, மலர தொன்னிலை மருதத்துப் பெருந்துறை நின்னொடு ஆடினள் தண் புனல் அதுவே. மகிழ்ந! நின்னோடு, பழைய நிலையுடைய மலர் பொருந்திய மருத்ததுறைக்கணே உள்ள தண்ணிய புனலிடத்து நீராடினவள் பலர். ஊராரும் அலர் கூறத் தொடங்காது நின்றார். அதனால் நீ நமக்குப் பொருந்துதல் உடையது இல்லை. 4.10.6.பாடல் : 76 : தோழி தலைவனிடம் கூறியது : பஞ்சாய்க் கூந்தல், பசு மலர்ச் சுணங்கின், தண் புனல் ஆடித் தன் நலம் மேம்பட்டனள், ஒண்தொடி மடவரல், நின்னோடு, அந்தர மகளிர்க்குத் தெய்வமும் போன்றெ. பஞ்சாய்ப் போலும் உள்ள கூந்தலையும் பசிய மலர் பேலும் சுணங்கையும் உடைய ஒள்ளிய தொடி அணிந்த பெண்ணானவள், நின்னோடு தண்ணிய புனலாடி அமர மாதர்ககு ; த் தெய்வமும் போலாய் அழக பெருமை அடையப் பெற்றாள். 4.10.7.பாடல் : 77 : பரத்தை தலைவனிடம் கூறியது : அம்ம வாழியோ, மகிழ்ந! நின் மொழிவல்! பேரூர் அல் எழ நீரலைக் கலங்கி, நின்னொடு தண் புனல் ஆடுதும், எம்மொடு சென்மோ, செல்லல் நின் மனையே. மகிழ்நனே, நினக்கு ஒன்ற கூறுவேன். பெரிய ஊரிடத்தே அலர் உண்டாக நீரிடத்து அலைபோலக் கலக்கமுற்று நின்னோடு தண்ணிய புனலாடுவேம். நின் மனையிடத்துச் செல்லாயாய் எம்மோடு செல்வாயாக. 4.10.8.பாடல் : 78 : பரத்தை தலைவனிடம் கூறியது : கதிர் இலை நெடு வேல் கடு மான் கிள்ளி மதில் கொல் யானையின், கதழ்பு நெறி வந்த சிறை அழி புதுப் புனல் ஆடுகம், எம்மொடு கொண்மோ, எம் தோள் புரை புணையே. ஒளியை உடைய தகட்டு வடிவு உடைய நீண்ட வேலையும் உடைய கடுமான் கிள்ளயத மதிலைக் கெடுக்கும் யானையைப் போல வழிக்கொண்டு விரைந்து வந்த கரையை அழிக்கும் புப்புனலிடத்து ஆடுதற்கு எமது தோள் போலும் தெப்பத்தை எம்மோடு பொருந்துவாயாக. 4.10.9.பாடல் : 79 : பரத்தையின் தோழி தலைவனிடம் கூறியது : புதுப்புனல் ஆடி அமர்த்த கண்ணள், யார் மகள் இவளெனப் பற்றிய மகிழ்ந! யார் மகள் ஆயினும் அறியாய், நீ யார் மகனை, எம் பற்றியோயே? புதுப்பனலாடிப் போர் செய்தலை உடைய கண்களைப் போன்ற இவள் யார் மகள் என்று வினாவிக் கையைப்பிடித்த மகிழ்நனே! நீ யாரது மகளானாலும் அறியமாட்டாய், எம்மைப் பற்றிய நீ யார் மகனோ? சொல்லுவாயாக. 4.10.10.பாடல் : 80 : தலைவி தலைவனிடம் கூறியது : புலக்குவெம் அல்லேம், பொய்யாது உரைமோ, நலத்தகு மகளிர்க்குத் தோள் துணை ஆகித், தலைப் பெயல் செம்புனல் ஆடித் தவ நனி சிவந்தன மகிழ்ந, நின் கண்ணே. யாம் நின்னோடு புலக்கின்றோம் அல்லேம், பொய்த்தலின்றிச் சொல்லுவாயாக. அழகு தகும் பெண்கள் இன்பமுறுதற்க அவர் தோள்களுக்குத் துணையாய் முதற் பெயலால் வருகின்ற சிவந்த புனலின்கண் ஆடி, மகிழ்நனே! நினது கண்கள் மிகதியும் சிவப்படைந்தன.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 4, section 4.10, p.97", "", "hard", "false"], ["SANG-4-11", "Sangam literature", "சங்க இலக்கியம் – ஐங்குறுநூறு – மருதம்: “புலவி விராய பத்து” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – ஐங்குறுநூறு – மருதம்: Explain the poem/passage titled “புலவி விராய பத்து” (section 4.11).", "4.11.1.பாடல் : 81 : பரத்தை தலைவனிடம் கூறியது : குருகு உடைத்து உண்ட வெள் அகட்டு யாமை, அரிப் பறை வினைஞர் அல்கு மிசைக் கூட்டும், மலர் அணி வாயில் பொய்கை ஊர! நீ என்னை நயந்தனென் என்றி நின் மனையோள் கேட்கின், வருந்துவள் பெரிதே. நாரையால் உடைத்து உண்ணப்பட்டு எஞ்சிய வெள்ளிய வயிற்றை உடைய ஆமையது தசையை அரித்ததெழும் ஓசையைப் பொருந்திய பறையை உடைய வினையாளர் தினந்தோறும ;உணவிற்குச்சேர்க்கும் மலானது அழகுபெறும் வழியமைந்த பொய்iகை ஊரனே! தனிபோலம் பிறர் யாரையும் விரும்பேன் என்கிறாய். ஆயின் இதனை நினத மனைவியானவள் கேட்பாளாயின் மிகவும் வருந்துவாள் அன்றோ. 4.11.2.பாடல் : 82 : தலைவி பாணனிடம் கூறியது : வெகுண்டனள் என்ப பாண, நின் தலைமகள், மகிழ்நன் மார்பின் அவிழ் இணர் நறும் தார்த் தாது உண் பறவை வந்து, எம் போது ஆர் கூந்தல் இரந்தன எனவே. பாணனே! நினது தலைவியானவள் ஊரனது மார்பில் பொருந்திய விரிந்த இணர்போலும் மணந்தங்கிய மாலையில் உள்ள தாதை உண்கின்ற வண்டானது வந்து எமது பூக்கள் நிறைந்த கூந்தலில் தங்கின என்று கூறும்போது கோபம் அடைந்தாள் என்று கூறுவர். அதுவும் பொறாதாள் நீ ஈண்டு வருதல் பொறாள், ஆயிற் கடிது செல்வாய். 4.11.3.பாடல் : 83 : தலைவி தலைவனிடம் கூறியது : மணந்தனை அருளாய் ஆயினும், பைபையத் தணந்தனை ஆகி உய்ம்மோ நும் ஊர், ஒண்தொடி முன் கை ஆயமும், தண்துறை ஊரன் பெண்டு எனப்படற்கே. எம்மை வரைந்தும் எமக்கு அருளைச் செய்யாயினும் மெல்ல மெல்லப் பிரிந்தனையாகியுய்வாய். எதற்கெனின் உமது ஊரிலுள்ள ஒள்ளிய தொடி அணிந்த முன் கையை உடைய மகளிர் கூட்டம் எல்லாம் குளிர்ந்த துறையை உடைய ஊரனது பெண் என்ற பிறரால் கூறப்படுதற்கு. 4.11.4.பாடல் : 84 : தோழி தலைவனிடம் கூறியது : செவியின் கேட்பினும் சொல் இறந்து வெகுள்வோள், கண்ணிற் காணின் என்னாகுவள் கொல், நறு வீ ஐம்பால் மகளிர் ஆடும் தைஇத் தண் கயம் போலப் பலர் படிந்து உண்ணு, நின் பரத்தை மார்பே? நறுமலரை அணிந்த ஐந்து வகையாக முடிக்ப்படும் கூந்தலினை உடைய மகளிர் தைத்திங்களில் விரும்பி ஆடுகின்ற குறிர்ந்த தடாகத்தைப் போல, பலர் தோய்ந்து அனுபவிக்கின்ற பரத்தைமையை உடைய நின்னுடைய மார்பை இத்தன்மைத்து என்று பிறர் சொல்லக் கேட்பினும் அளவைக் கடந்து வெகுள்பவள் தான் தேரே காண்பாளாயின் எவ்வாறு ஆவாளோ! ஆதலின் இதனைத தவிர்வாயாக. 4.11.5.பாடல் : 85 : தலைவி தலைவனிடம் கூறியது : வெண் நுதல் கம்புள் அரிக்குரல் பேடை, தண் நறும் பழனத்துக் கிளையோடு ஆலும், மறுஇல் யாணர் மலி கேழ் ஊர! நீ சிறுவரின் இணைய செய்தி, நகாரோ பெரும, நின் கண்டிசினோரே? வெண்ணிறம் பொருந்திய நெற்றியை உடைய சம்பங்கோழியது இனிய குரலை உடைய பேடு, குளிர்ந்த நறிய யலிடத்துத் தனது கூட்டத்தோடும் ஒலிக்கின்ற குறைவின்றி நிறைந்த புது வருவாய் பொருந்துதலும் உடைய ஊரனே! நீ சிறுவரைப் போன்று தகாத செயலைச் செய்கின்றாய் பெருமா! நின்னைக் கண்டோர் நகுவாரன்றே. இவ்வாறு செய்யற்க. 4.11.6.பாடல் : 86 : பரத்தை தலைவனிடம் கூறியது : வெண்தலைக் குருகின் மென்பறை விளிக் குரல், நீள் வயல் நண்ணி இமிழும் ஊர! எம் இவண் நல்குதல் அரிது, நும் மனை மடந்தையொடு தலைப் பெய்தீமே. வெண்மை பொருந்திய தலையை உடைய குருகினது பார்ப்பின் அழைக்கும் குரல் நீண்ட வயல் இடத்;துப் பொருந்தி ஒலிக்கின்ற ஊரனே! இவ்விடத்தே எம்மைப் பாதுகாத்தல் அரிது. நும்மனையாகிய மடந்தையோடு சேர்வாயாக. 4.11.7.பாடல் : 87 : பரத்தை தலைவனிடம் கூறியது : பகன்றைக் கண்ணிப் பல் ஆன் கோவலர், கரும்பு குணிலா மாங்கனி உதிர்க்கும் யாணர் ஊர! நின் மனையோள் யாரையும் புலக்கும், எம்மை மற்று எவனோ? கிலுகிலுப்பைப் பூமாலையை உடைய பல பசுக்களை உடைய இடையர் கரும்பைக் கநற்தடியாகக் கொண்ட எறிந்து மாங்கனியை வீழ்த்துகின்ற புத வருவாயை உடைய ஊரனே! நினது மனைவியானவள் எவர்களையும் புலப்பாள். எம்மை வேறியாது செய்வ ; hள். 4.11.8.பாடல் : 88 : பரத்தை தலைவியின் தோழியர் கேட்கும்படி கூறியது : வண்டு உறை நயவரும் வள மலர்ப் பொய்கைத் தண்துறை ஊரனை, எவ்வை, எம் வயின் வருதல், வேண்டுதும் என்ப, ஒல்லேம் போல் யாம் அது வேண்டுதுமே. வள்ளிய துறைகளின் கண்ணே எல்லாரும் கொள்ளம் வண்ணம் நயந்து பூக்கின்ற மலர்களை உடைய பொய்கைத் தண்டுறை ஊரனை எவ்வையாயினாள் எம்மிடத்து அவன் வருதலை யாம் விரும்புகின்றோம் என்று கூறுகின்றாள் என்பர். இவ்வாறு எம்மைக் கூறுதல் தவிராளாயின், அத்தன்மையை உடையேம் போலாய் அதனை முடியச் செய்த விடுகின்றோம். 4.11.9.பாடல் : 89 : பரத்தை பாணனிடம் தலைவியின் தோழியர் கேட்கும்படி கூறியது : அம்ம வாழி பாண! எவ்வைக்கு எவன் பெரிது அளிக்கும் என்ப, பழனத்து வண்டு தாது ஊதும் ஊரன் பெண்டென விரும்பின்று அவள் தன் பண்பே. பாணனே வாழ்வாயாக! சோலைக் கண்ணுள்ள பூந்தாதுகளை வண்டகள் உண்ணும் ஊரன் எம் தங்கைக்கு மிக அன்ப செய்து ஒழுகுவான் என்பர். அவளை விரும்பத்தக்காள் என்று விரும்பியது யாதானெனின் அவள் குணமல்லது பிறிதில்லை 4.11.10.பாடல் : 90 : பரத்தை, தலைவியின் தோழியரும் தலைவனும் கேட்கும்படியாக கூறியது : மகிழ்நன் மாண் குணம் வண்டு கொண்டன கொல்? வண்டின் மாண் குணம் மகிழ்நன் கொண்டான் கொல்? அன்னதாகலும் அறியாள், எம்மொடு புலக்கும் அவன் புதல்வன் தாயே. மகிழ்நனது மாட்சிமை உடைய குணத்தை வண்டு வாங்கிக் கொண்டன கொல்லோ! அன்றி வண்டினது மாட்சிமை பொருந்திய குணத்தை மகிழ்நன் வாங்கிக் கொண்டான் கொல்லோ! அது ஆகலையும் அறியாளாய ஊரனுடைய மனைவி எம்மோடு புலப்பாள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 4, section 4.11, p.99", "", "hard", "false"], ["SANG-4-12", "Sangam literature", "சங்க இலக்கியம் – ஐங்குறுநூறு – மருதம்: “எருமைப் பத்து” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – ஐங்குறுநூறு – மருதம்: Explain the poem/passage titled “எருமைப் பத்து” (section 4.12).", "4.12.1.பாடல் : 91 : தோழி தலைவனிடம் கூறியது : நெறி மருப்பு எருமை நீல இரும் போத்து, வெறி மலர்ப் பொய்கை ஆம்பல் மயக்கும், கழனி ஊரன் மகள் இவள், பழன வெதிரின் கொடிப் பிணையலளே. திருகிய கொம்பை உடைய நீலம் போலும் கரியதாய எருமைக் கடா பொய்கைக் கண்ணுள்ள நறு நாற்றம் அமைந்த மலரை உடைய வாம்பலைக் கொடுக்கம் கழனியுரன் அவனுடைய மகளாய இவளுமோ கரும்பின் பூவால் செய்யப்பட்ட நெடிய மாலையை உடையாள். 4.12.2.பாடல் : 92 : தலைவன் தலைவியிடம் கூறியது : கருங்கோட்டு எருமைச் செங்கண் புனிற்று ஆக் காதல் குழவிக்கு ஊறு முலை மடுக்கும், நுந்தை நும் ஊர் வருதும், ஒண்தொடி மடந்தை, நின்னை யாம் பெறினே. கரிதாய கோட்டைப் பொருந்திய செங்கண்ணை உடைய வீன்றண்ணிய எருமை ஆவானது தனது விருப்பம் பொருந்திய கன்றுக்குப் பாலூறிச் சொரியும் முலையை உண்பிப்பும் உன் பிரிவினுடைய நுமது ஊரினிடத்து ஒள்ளிய தொடியை அணிந்த பெண்ணே! வரைவு மாட்சிமைப்படுமாயின் நான் விரைய வருவேன். 4.12.3.பாடல் : 93 : தோழி செவிலித்தாயிடம் சிறைப்புறத்தே உள்ள தலைவன் கேட்கும்படியாக கூறியது : எருமை நல் ஏற்று இனம் மேயல் அருந்தெனப் பசு மோரோடமோடு ஆம்பல் ஒல்லா செய்த வினைய, மன்ற பல் பொழில் தாது உண் வெறுக்கைய ஆகிய, இவள் போத அவிழ் முச்சி ஊதும் வண்டே. எருமை நல்லேற்றினமானவை மேயலாகிய உணவென்று பசுமோரோடமோடு ஆம்பலை அலர் முதலிய இல்லாவாய்க் கெடுத்த நெருங்கிய பல சோலையிலுள்ள தாதை உண்ணும் விருப்பத்தை விட்டனவாய், இவளுடைய விரிந்த போதினை உடைய உச்சியில் வந்து படிந்து உண்ணாமல் நிற்கம் வண்டுகள். 4.12.4.பாடல் : 94 : தலைவன் தன் நெஞ்சிடம் கூறியது : மள்ளர் ;அன்ன தடங்கோட்டு எருமை மகளிர் அன்ன துணையோடு வதியும் நிழல் முதிர் இலஞ்சிப் பழனத்ததுவே கழனித் தாமரை மலரும், கவின் பெறு சுடர்நுதல் தந்தை ஊரே. மள்ளரை ஒத்த வளைந்த கொம்பை உடைய எருமையானது, அவர் மகளிரை ஒத்த நாகெருமையோடு தங்குகின்ற நிழல் நிறைந்த பொய்கையை உடைய வயல்களை உடையது. கழனியிடத்தே தாமரைகள் அலருகின்ற அழகு பெற்ற ஒளி பொருந்திய நுதலை உடையாளது தந்தையின் ஊர். 4.12.5.பாடல் : 95 : தலைவி தலைவனைப் பற்றிக் கூறியது : கருங்கோட்டு எருமை கயிறு பரிந்து அசைஇ நெடுங்கதிர் நெல்லின் நாள் மேயல் ஆரும், புனல் முற்று ஊரன், பகலும் படர் மலி அரு நோய் செய்தனன், எமக்கே. கருங்கோட்டு எருமையானது, கட்டிய கயிற்றை அறுத்துச் சென்று நீண்ட கதிரை உடைய நெல்லாகிய நாண் மேயலை உண்ணுகின்ற நீர்நிறைந்த ஊரன். எமக்கு இரவுக் காலத்திலன்றிப் பகல் காலத்திலும் துன்பம் நிறைந்த பிறரால் நீக்குதற்கரிய நோயைச் செய்தான். 4.12.6.பாடல் :96:தலைவனின் தோழர்கள் தலைவியைப் பற்றிக் கூறியது : அணி நடை எருமை ஆடிய அள்ளல் மணி நிற நெய்தல் ஆம்பலொடு கலிக்கும், கழனி ஊரன் மகள் இவள்,. பழன ஊரன் பாயல் இன் துணையே. அழகிய நடையை உடைய எருமைகள்உழக்கிய சேற்றிடத்தே நீலமணிபோலும் நிறம் விளங்கம் பூக்களை உடைய நெய்தல் ஆம்பலோடு வளருகின்ற கழனிகளை உடைய ஊரன் மகளாகிய இவள் பழன ஊரனுக்கு இனிய பாயலின் துணையாகும். 4.12.7.பாடல் : 97 : தலைவன் தலைவியைப் பற்றிக் கூறியது : பகன்றை வான் மலர் மிடைந்த கோட்டைக் கருந்தாள் எருமைக் கன்று வெரூஉம், பொய்கை ஊரன் மகள் இவள், பொய்கைப் பூவினும் நறுந் தண்ணியளே. சிறந்த பகன்றை மலர் பொருந்திய தாயினது கொம்பைக் கண்டு வலிய கால்களை உடைய எருமைக் கன்று அஞ்சுகின்ற பொய்கையை உடைய ஊரன் மகளாகிய இவள் பொய்கைக்கண் மலரும் பூவினுங் காட்டி நல்ல சாயலை உடையவள். 4.12.8.பாடல் : 98 : தோழி தலைவனிடம் கூறியது : தண் புனல் ஆடும் தடங்கோட்டு எருமை, திண் பிணி அம்பியின் தோன்றும் ஊர! ஒண்தொடி மடமகள் இவளினும், நுந்தையும் யாயும் கடியரோ நின்னே? குளிர்ந்த புனலாடும் வளைந்த கோட்டை உடைய எருமை, வலிய கட்டினை உடைய தோணி போலத் தோன்றுகின்ற ஊரனே ஒள்ளிய தொடியையுடைய மடக்குணத்தினளாய் இவளினும் நும் தந்தையம் தாயும் நின்னிடத்துக் குற்றம் கண்டவழிக் கழறிக் கூறும் இயல்பினர் அன்றே. 4.12.9.பாடல் : 99 : தலைவன் தலைவியைப் பற்றிச் சொன்னது : பழனப் பாகல் முயிறு மூசு குடம்பை கழனி எருமை கதிரொடு மயக்கும், பூக்குஞல் ஊரன் மகள் இவள், நோய்ககு ; மருந்தாகிய பணைத் தோளோளே. பழனப்பாகலின் கண்ணுள்ள முசுற்றெறும்பு மொய்தத கூட்டைக் கழனியிடத்து எருமை நெற்கதிரோடு கெடுக்கும் அழக செறியும் ஊரனுடைய மகளாகிய இவள் தானடைந்த மருந்தில் நோய்ககு ; ம் மருந்தாம் தன்மையவாய பணைபோலும் தோளை உடையவள். 4.12.10.பாடல் : 100 : தோழி தலைவனிடம் கூறியது : புனல் ஆடு மகளிர் இட்ட ஒள்ளிழை, மணல் ஆடு சிமையத்து எருமை கிளைக்கும் யாணர் ஊரன் மகள் இவள், பாணர் நரம்பினும் இன் கிளவியளே. புனலாடுகின்ற பெண்கள் மணல் திட்டின் மேல் வைக்கப்பட்ட ஒள்ளி ஆபரணம் மறைந்திருப்பதனை எருமைகள் கொம்பால் கிழித்துத் தோன்றச் செய்யும் புதுமையை உடைய ஊரனது மகளாய இவள். இசைப் பாணரது கைக்ண்ணுள்ள யாழ் நரம்பினும் காட்டி இனிமை அமைந்த சொல்லை உடையவள்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 4, section 4.12, p.102", "", "hard", "false"], ["SANG-7-3", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (1–50): “பாடல் : 1(7) : கண்டோர் கூற்று பாடியவர்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (1–50): Explain the poem/passage titled “பாடல் : 1(7) : கண்டோர் கூற்று பாடியவர்” (section 7.3).", "பெரும்பதுமனார் வில்லேன் காலன கழலே, தொயோள் மெல்லடி மேலவும் சிலம்பே, நல்லோர் யார் கொல் அளியர் தாமே, ஆரியர் கயிறாடு பறையின் கால் பொரக் கலங்கி வாகை வெண் நெற்று ஒலிக்கும் வேய் பயில் அழுவம் முன்னியோரே? கழைக் கூத்தர்கள், மூங்கிலின் மேல் கட்டிய கயிற்றின் மேல் ஏறிநின்று ஆடும்போது அடிக்கப்படும் பறை ஒலியைப் போல, மேல்காற்று வீசும்போது நிலை கலங்கி, வாகை மரத்தின் வெண்ணிற நெற்றுக்கள் ஒலி எழுப்பும். அத்தகைய மூங்கில் செறிந்த பாலை நிலப் பரப்பில் கடந்து செல்ல நினைத்து வருபவர்களுள், கையில் வில்லை ஏந்திய இவ்வாடவன் கால்களில் வீரக்கழல்கள் உள்ளன. வளையணிந்த கைகளையுடைய இம்மகளின் மெல்லிய அடிகளின் மேல் சிலம்புகள் உள்ளன. இந்நல்லோர் யாவரோ? இவர்கள் அளிக்கத்தக்கவர்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 7, section 7.3, p.151", "", "medium", "false"], ["SANG-7-4", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (1–50): “பாடல் : 2(11) : தலைவி தன் நெஞ்சிடம் தோழி” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (1–50): Explain the poem/passage titled “பாடல் : 2(11) : தலைவி தன் நெஞ்சிடம் தோழி” (section 7.4).", "கேட்கும்படியாக கூறியது : பாடியவர் : மாமூலனார். கோடு ஈர் இலங்கு வளை ஞெகிழ நாடொறும் பாடில கலிழும் கண்ணொடு புலம்பி ;ஈங்கு இவண் உறைதலும் உய்குவம் ஆங்கே, எழு இனி வாழி என் நெஞ்சே, முனாது குல்லைக் கண்ணி வடுகர் முனையது பல்வேல் கட்டி நன்னாட்டு உம்பர் மொழிபெயர் தேஎத்தர் ஆயினும், வழிபடல் சூழ்ந்திசின் அவருடை நாட்டே. சங்கினை அறுத்துச் செய்யப்பட்ட, முன் கையில் விளங்கும் வளையல்கள், உடல் மெலிவினால் நெகிழுமாறு. தலைவன் வரைவிடை(திருமணம் செய்துக்கொள்வேன் என்று கூறி சென்ற) வைத்துச் சென்ற ஒவ்வொரு நாளும் உறக்கமில்லாமல் கலங்கி அழும் கண்ணொடு, தனிமைத் துயரால் நாம் இங்கு வருந்தாமல் இருப்போம். என் நெஞ்சே! நீ வாழவாயாக! நீ அவனுடைய நாட்டிற்குச் செல்ல இப்பொழுதே முற்பட்டு எழுவாயாக! கஞ்சங் குல்லையைத தலைமாலையாக அணிந்த வடுகருடைய பகைப்புலம், வலிமையான வேற்படையையுடைய கட்டி என்பவனுடைய நல்ல நாட்டிற்கு அப்பால் உள்ளது. நம் மொழி பேசாது வேற்று மொழி பேசப்படும். அந்நாட்டில் தலைவன் இருப்பினும், அவனை நாடிச் செல்லும் உன்னைத் தொடர்ந்து வருதலை நான் துணிந்துள்ளேன்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 7, section 7.4, p.152", "", "medium", "false"], ["SANG-7-5", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (1–50): “பாடல் : 3(12) : தலைவி தோழியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (1–50): Explain the poem/passage titled “பாடல் : 3(12) : தலைவி தோழியிடம் கூறியது” (section 7.5).", "பாடியவர் : ஓதலாந்தையார் எறும்பி அளையின் குறும் பல் சுனைய உலைக்கல் அன்ன பாறை ஏறிக் கொடு வில் எயினர் பகழி மாய்க்கும் கவலைத்து என்ப அவர் சென்ற ஆறே. அது மற்று அவலம் கொள்ளாது, நொதுமல் கழறும் இவ்வழுங்கல் ஊரே. எறும்புப் புற்றுக்களைப் போன்ற, குறுகிய, பலவாகிய கனைகளையுடைய பாறைகள் உள்ளன. அப்பாறைகள், கொல்லனது உலைக் கூடத்திலுள்ள பட்டடைக் கல்லைப் போல வெம்மையுடையவை. வளைந்த வில்லினை ஏந்திய வேட்டுவர், அப்பாறையின் மேல் ஏறித் தங்உள் அம்புகளைத் தேய்த்துக் கூர்மையாக்குவர். தலைவனுடைய தேர் சென்ற வழி, இத்தகைய பாலை நிலத்;தில் கவர்த்த பல வழிகளையுடையது. என்போல அவ்வழியைப் பற்றித் துயரம் கொள்ளாமல், இந்த ஆரவாரத்தினையுடைய ஊரானது என்னை அயலாகக் கருதி இடித்துரைக்கும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 7, section 7.5, p.152", "", "medium", "false"], ["SANG-7-6", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (1–50): “பாடல் : 4(15) : செவிலித்தாய் தலைவியின் தாயிடம்” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (1–50): Explain the poem/passage titled “பாடல் : 4(15) : செவிலித்தாய் தலைவியின் தாயிடம்” (section 7.6).", "சொன்னது : பாடியவர் : ஒளவையார் பறை படப் பணிலம் ஆர்ப்ப, இறை கொள்பு தொன்மூது ஆலத்துப் பொதியில் தோன்றிய நாலூர்க் கோசர் நன் மொழி போல வாயாகின்றே தோழி, ஆய் கழல் சேயிலை வெள் வேல் விடலையொடு தொகு வளை முன் கை மடந்தை நட்பே பழைய ஆலமரத்தின் அடியில், மக்கள் கூடும் பொதுமன்றத்திலே, தாம் சொன்ன சொல் பிழையாமல், நான்கு ஊர்களைச் சார்ந்த கோசர் என்ற குடியினர் வந்தனர். அவர்களுடைய பிழையாத வாய்மொழி போல, காலில் ஆய்ந்து கட்டிய கழலினையும், செம்மையாகிய இலை போன்ற வடிவுடைய வெள்ளிய வேலினையும் ஏந்திய தலைவனொடு, பலவாகத் தொக்க வளையல்களை அணிந்த முன்கையையுடைய மடந்தை, ஒரு மனையில் தங்கியதால் அவர்களிடையே உள்ள நட்பு உண்மையாயிற்று.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 7, section 7.6, p.153", "", "medium", "false"], ["SANG-7-7", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (1–50): “பாடல் : 5(16) : தோழி கூற்று” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (1–50): Explain the poem/passage titled “பாடல் : 5(16) : தோழி கூற்று” (section 7.7).", "பாடியவர் : சேரமான் பாலை பாடிய பெருங்கடுங்கோ : உள்ளார் கொல்லோ தோழி, கள்வர் பொன் புனை பகழி செப்பங்கொண்மார் உகிர் நுதி புரட்டும் ஓசை போலச் செங்கால் பல்லி தன் துணை பயிரும் அம் கால் கள்ளியங்காடு இறந்தோரே? ஆறலை கள்வர், இரும்பைத் தலையிடத்தே கொண்ட தங்கள் அம்புகளின் கூர்மையை அறிய நகத்தால் அவற்றின் நுனியை நெருடுவர். அவ்வோசையைப் போல, செவ்விய கால்களையுடைய ஆண்பல்லி, தனக்குத் துணையாகிய பெண்பல்லியை அழைக்கும் ஒலி விளங்கும். இத்தகைய பல்லிகள் தங்கியுள்ள, அழகிய அடிப்பகுதியைக் கொண்ட கள்ளிச் செடிகள் மிகுந்த காட்டினைக் கடந்து சென்ற நம் காதலர் நம்மை நினைக்காமல் இருக்க மாட்டான்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 7, section 7.7, p.153", "", "medium", "false"], ["SANG-7-8", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (1–50): “பாடல் : 6(20) : தலைவி தோழியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (1–50): Explain the poem/passage titled “பாடல் : 6(20) : தலைவி தோழியிடம் கூறியது” (section 7.8).", "பாடியவர் : கோப்பெருஞ்சோழன் அருளும் அன்பும் நீக்கித் துணை துறந்து, பொருள்வயின் பிரிவோர் உரவோர் ஆயின், உரவோர் உரவோர் ஆக, மடவம் ஆக மடந்தை நாமே. தோழியே! நமக்குத் தொடர்பில்லாதவர்களிடையே தோன்றும் அருளையும், அன்பையும் துறந்து, பொருள் தேடும் நோக்கம் ஒன்றே உடையராக நம்மைப் பிரிந்து செல்லும் காதலர், அறிவுடையவராயினும் அத்தகைய ஆற்றலையுடைய அவர், அறிவுடையவரே ஆகுக. அவரைப் பிரிந்திருப்பதற்கு உரிய ஆற்றலில்லாத நமக்கு அறிவில்லாமல் ஆகுக.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 7, section 7.8, p.154", "", "medium", "false"], ["SANG-7-9", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொகை – பாலை (1–50): “பாடல் : 7 (22) : தோழி தலைவியிடம் கூறியது” என்ற பகுதியில் இடம்பெறும் பாடல்/செய்தியை விளக்குக.", "Sangam literature – குறுந்தொகை – பாலை (1–50): Explain the poem/passage titled “பாடல் : 7 (22) : தோழி தலைவியிடம் கூறியது” (section 7.9).", "பாடியவர் : சேரமானெந்தை நீர் வார் கண்ணை நீ இவண் ஒழிய, யாரோ பிரிகிற்பவரே? சாரல் சிலம்பணி கொண்ட வலஞ்சுரி மராஅத்து வேணில் அம்சினை கமழும் தேம் ஊர் ஒண்ணுதல் நின்னொடுஞ் செலவே பிரிவுத் துன்பத்தால், இடைவிடாது ஒழுகும் கண்ணீரை உடையவளாய், நீ இங்கு தங்கியிருக்க, உன்னைப் பிரிந்து செல்லும் ஆற்றல் உடையவர் யார் உளர்? மலைப் பக்கம். தனக்கு அழகாகக் கொண்ட, வலமாகச் சுரிந்து விளங்கும் வெண்கடம்பின் மலர்கள் வேனில் காலத்த்pல் மலர்ந்து மணம் வீசும். அம்மலரின் மணம் கமழும், ஒளி பொருந்திய நெற்றியை உடையவளே, தலைவன் செலவு நின்னொடு உடன்போக்கில் செல்வதாகவே அமையும்.", "M.A. Tamil 31931 Sanga Ilakkiyam (Alagappa University DDE), Unit 7, section 7.9, p.154", "", "medium", "false"], ["SANG-7-10", "Sangam literature", "சங்க இலக்கியம் – குறுந்தொ
